<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="magmaGlow" cx="50%" cy="80%" r="70%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="30%" stop-color="#f97316"/>
      <stop offset="70%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#1c0a06"/>
    </radialGradient>
    <linearGradient id="lavaWave" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="40%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#magmaGlow)"/>
  <!-- Volcanic Shaft Walls -->
  <polygon points="0,0 90,0 60,512 0,512" fill="#292524"/>
  <polygon points="512,0 422,0 452,512 512,512" fill="#292524"/>
  <!-- Platforms -->
  <rect x="110" y="220" width="120" height="20" rx="4" fill="#44403c" stroke="#78716c" stroke-width="3"/>
  <rect x="280" y="140" width="140" height="20" rx="4" fill="#44403c" stroke="#78716c" stroke-width="3"/>
  <!-- Rising Lava Wave -->
  <path d="M 0 380 Q 130 350 256 380 T 512 370 L 512 512 L 0 512 Z" fill="url(#lavaWave)"/>
  <!-- Ascending Explorer Character -->
  <circle cx="180" cy="180" r="16" fill="#38bdf8"/>
  <rect x="172" y="194" width="16" height="24" rx="4" fill="#0284c7"/>
  <!-- Grappling Cable -->
  <line x1="180" y1="180" x2="320" y2="140" stroke="#facc15" stroke-width="4" stroke-dasharray="8 4"/>
</svg>
