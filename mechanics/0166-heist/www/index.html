<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#030712">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Vault Infiltrator</title>
<style>
  html, body { margin: 0; height: 100%; background: #030712; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; margin: 0 auto; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="logic.js"></script>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const W = 360;
const H = 640;
let scale = 1;

function resize() {
  scale = Math.min(innerWidth / W, innerHeight / H);
  const dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.style.width = W * scale + 'px';
  canvas.style.height = H * scale + 'px';
  canvas.width = Math.round(W * scale * dpr);
  canvas.height = Math.round(H * scale * dpr);
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
}
addEventListener('resize', resize);
resize();

function rrect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

let best = 0;
try { best = +localStorage.getItem('goe-0166-best') || 0; } catch (e) {}

let state = createState(Date.now());
let floaters = [];
let animTimer = 0;
let overAt = 0;

function restart() {
  state = createState(Date.now());
  floaters = [];
  overAt = 0;
}

const ZONE_LABELS = [
  'Perimeter Alley',
  'Security Hub',
  'Vault Antechamber',
  'Titanium Deep Vault'
];

function performAction(act) {
  if (isOver(state)) return;
  const legals = legalActions(state);
  if (!legals.includes(act)) return;

  const oldLoot = state.lootValue;
  const oldSusp = state.suspicion;
  const res = step(state, act);

  const gain = state.lootValue - oldLoot;
  if (gain > 0) {
    floaters.push({ text: '+$' + gain, x: 180, y: 220, t: 0, color: '#facc15' });
  } else if (act.includes('takedown')) {
    floaters.push({ text: 'GUARD NEUTRALIZED', x: 240, y: 200, t: 0, color: '#38bdf8' });
  } else if (act.includes('thermal_drill')) {
    floaters.push({ text: 'DRILLING ' + state.drillProgress + '%', x: 180, y: 220, t: 0, color: '#f97316' });
  } else if (act.includes('lock')) {
    floaters.push({ text: 'LOCKPICKED!', x: 180, y: 220, t: 0, color: '#10b981' });
  } else if (act.includes('emp')) {
    floaters.push({ text: 'EMP DISRUPTION!', x: 180, y: 220, t: 0, color: '#06b6d4' });
  }

  if (isOver(state)) {
    overAt = performance.now();
    const sc = score(state);
    if (sc > best) {
      best = sc;
      try { localStorage.setItem('goe-0166-best', best); } catch (e) {}
    }
  }
}

// Action button hitboxes on canvas
const BTNS = [
  { id: 'recon', label: '👁 RECON', action: 'action:recon_surveillance', x: 20, y: 460, w: 100, h: 42, col: '#0284c7' },
  { id: 'takedown', label: '🥋 TAKEDOWN', action: 'action:silent_guard_takedown', x: 130, y: 460, w: 100, h: 42, col: '#ef4444' },
  { id: 'hack', label: '📡 HACK CCTV', action: 'action:hack_camera_loop', x: 240, y: 460, w: 100, h: 42, col: '#8b5cf6' },

  { id: 'lock', label: '🔓 PICK LOCK', action: 'action:pick_security_lock', x: 20, y: 508, w: 100, h: 40, col: '#10b981' },
  { id: 'drill', label: '🔥 THERMAL DRILL', action: 'action:start_thermal_drill', x: 130, y: 508, w: 100, h: 40, col: '#f97316' },
  { id: 'emp', label: '⚡ EMP (2)', action: 'action:deploy_emp_jammer', x: 240, y: 508, w: 100, h: 40, col: '#06b6d4' },

  { id: 'bag_cash', label: '💵 BAG CASH', action: 'action:bag_cash_loot', x: 20, y: 554, w: 100, h: 38, col: '#16a34a' },
  { id: 'bag_gold', label: '🪙 BAG GOLD', action: 'action:bag_gold_bars', x: 130, y: 554, w: 100, h: 38, col: '#eab308' },
  { id: 'diamond', label: '💎 DIAMOND', action: 'action:secure_imperial_diamond', x: 240, y: 554, w: 100, h: 38, col: '#a855f7' },

  { id: 'escape', label: '🚐 ESCAPE IN GETAWAY VAN', action: 'action:escape_in_getaway_van', x: 20, y: 598, w: 320, h: 36, col: '#ea580c' },
];

function toLogical(e) {
  const rect = canvas.getBoundingClientRect();
  return { x: (e.clientX - rect.left) / scale, y: (e.clientY - rect.top) / scale };
}

canvas.addEventListener('pointerdown', (e) => {
  const p = toLogical(e);
  if (isOver(state)) {
    if (performance.now() - overAt > 400) restart();
    return;
  }
  // Check action buttons
  for (const b of BTNS) {
    if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) {
      performAction(b.action);
      return;
    }
  }

  // Zone Transit Buttons in Blueprint View (0..450)
  const legals = legalActions(state);
  const nextZ = legals.find(a => a.startsWith('action:advance_to_zone:' + (state.zone + 1)));
  if (nextZ && p.x > 220 && p.y > 380 && p.y < 440) {
    performAction(nextZ);
    return;
  }
  const prevZ = legals.find(a => a.startsWith('action:advance_to_zone:' + (state.zone - 1)));
  if (prevZ && p.x < 140 && p.y > 380 && p.y < 440) {
    performAction(prevZ);
    return;
  }

  // Tap blueprint elements directly:
  if (p.y < 440) {
    if (state.guardsInZone[state.zone] > 0 && p.x > 180) performAction('action:silent_guard_takedown');
    else if (state.drillDeployed) performAction('action:repair_thermal_drill');
    else if (state.vaultOpened) performAction('action:bag_cash_loot');
    else performAction('action:recon_surveillance');
  }
});

addEventListener('keydown', (e) => {
  if (isOver(state)) {
    if ((e.key === ' ' || e.key === 'Enter') && performance.now() - overAt > 400) restart();
    return;
  }
  const k = e.key.toLowerCase();
  if (k === '1' || k === 'r') performAction('action:recon_surveillance');
  else if (k === '2' || k === 't') performAction('action:silent_guard_takedown');
  else if (k === '3' || k === 'h') performAction('action:hack_camera_loop');
  else if (k === '4' || k === 'p') performAction('action:pick_security_lock');
  else if (k === 'd') {
    if (state.drillJammed) performAction('action:repair_thermal_drill');
    else performAction('action:start_thermal_drill');
  } else if (k === 'c') performAction('action:bag_cash_loot');
  else if (k === 'g') performAction('action:bag_gold_bars');
  else if (k === ' ' || k === 'e') performAction('action:escape_in_getaway_van');
});

function draw(dt) {
  animTimer += dt;

  // Background Blueprint Dark Grid
  ctx.fillStyle = '#030712';
  ctx.fillRect(0, 0, W, H);

  // Blueprint Grid Lines
  ctx.strokeStyle = '#0f172a';
  ctx.lineWidth = 1;
  for (let x = 20; x < W; x += 30) {
    ctx.beginPath(); ctx.moveTo(x, 50); ctx.lineTo(x, 450); ctx.stroke();
  }
  for (let y = 50; y < 450; y += 30) {
    ctx.beginPath(); ctx.moveTo(20, y); ctx.lineTo(W - 20, y); ctx.stroke();
  }

  // Current Infiltration Chamber (Blueprint Room)
  ctx.fillStyle = '#0b1329';
  rrect(30, 70, 300, 310, 8);
  ctx.fill();
  ctx.strokeStyle = '#1e3a8a';
  ctx.lineWidth = 3;
  rrect(30, 70, 300, 310, 8);
  ctx.stroke();

  // Surveillance Camera Scanning Cone (Top Left)
  if (!state.cctvLooped[state.zone]) {
    const sweep = (Math.sin(animTimer * 2) + 1) * 0.5;
    ctx.fillStyle = 'rgba(239, 68, 68, 0.15)';
    ctx.beginPath();
    ctx.moveTo(40, 80);
    ctx.lineTo(80 + sweep * 100, 220);
    ctx.lineTo(130 + sweep * 100, 220);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#ef4444';
    ctx.beginPath();
    ctx.arc(42, 82, 6, 0, Math.PI * 2);
    ctx.fill();
  } else {
    // Looped CCTV Green Indicator
    ctx.fillStyle = '#10b981';
    ctx.beginPath();
    ctx.arc(42, 82, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#a7f3d0';
    ctx.font = 'bold 9px system-ui, sans-serif';
    ctx.fillText('LOOPED', 56, 85);
  }

  // Guards in Zone
  const guardCount = state.guardsInZone[state.zone];
  for (let g = 0; g < guardCount; g++) {
    const gx = 220 + g * 40;
    const gy = 180 + Math.sin(animTimer * 3 + g) * 8;

    ctx.fillStyle = '#ef4444';
    ctx.beginPath();
    ctx.arc(gx, gy - 14, 8, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(gx - 7, gy - 6, 14, 18);

    ctx.fillStyle = '#fca5a5';
    ctx.font = 'bold 9px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('GUARD', gx, gy - 26);
  }

  // Thermal Drill on Vault (Zone 2 or 3)
  if (state.drillDeployed) {
    const dx = 180;
    const dy = 240;
    ctx.fillStyle = '#f97316';
    ctx.fillRect(dx - 18, dy - 18, 36, 36);

    // Sparks
    ctx.fillStyle = '#fde047';
    for (let s = 0; s < 5; s++) {
      ctx.fillRect(dx + (Math.random() - 0.5) * 25, dy + (Math.random() - 0.5) * 25, 3, 3);
    }

    ctx.fillStyle = '#fed7aa';
    ctx.font = 'bold 11px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('DRILL ' + state.drillProgress + '%', dx, dy + 32);
    if (state.drillJammed) {
      ctx.fillStyle = '#ef4444';
      ctx.fillText('⚠ JAMMED!', dx, dy + 45);
    }
  }

  // Open Vault Loot (Zone 3)
  if (state.vaultOpened) {
    ctx.fillStyle = '#facc15';
    ctx.font = 'bold 13px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('💰 VAULT BREACHED! SECURE LOOT 💰', 180, 200);
  }

  // Player Operative (Bottom Center of room)
  const px = 180;
  const py = 330;
  ctx.fillStyle = '#38bdf8';
  ctx.beginPath();
  ctx.arc(px, py - 14, 8, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#0284c7';
  ctx.fillRect(px - 7, py - 6, 14, 18);

  // Top Header HUD
  ctx.fillStyle = 'rgba(3, 7, 18, 0.95)';
  ctx.fillRect(0, 0, W, 52);

  ctx.fillStyle = '#38bdf8';
  ctx.font = 'bold 14px system-ui, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(ZONE_LABELS[state.zone].toUpperCase(), 12, 22);

  ctx.textAlign = 'right';
  ctx.fillStyle = '#facc15';
  ctx.fillText('$' + state.lootValue.toLocaleString(), W - 12, 22);

  // Sub-bars: Suspicion & Crew Health
  ctx.font = '10px system-ui, sans-serif';
  ctx.fillStyle = '#94a3b8';
  ctx.textAlign = 'left';
  ctx.fillText('SUSPICION ' + state.suspicion + '%', 12, 42);
  ctx.fillStyle = '#334155';
  ctx.fillRect(90, 34, 75, 8);
  ctx.fillStyle = state.suspicion < 60 ? '#f59e0b' : '#ef4444';
  ctx.fillRect(90, 34, 75 * (state.suspicion / 100), 8);

  ctx.fillStyle = '#94a3b8';
  ctx.fillText('PAGERS: ' + state.pagersRemaining, 175, 42);
  ctx.fillStyle = '#10b981';
  ctx.textAlign = 'right';
  ctx.fillText('CREW HP: ' + state.crewHealth + '%', W - 12, 42);

  // Floating text
  for (let i = floaters.length - 1; i >= 0; i--) {
    const f = floaters[i];
    f.y -= 35 * dt;
    f.t += dt;
    if (f.t > 0.8) {
      floaters.splice(i, 1);
      continue;
    }
    ctx.fillStyle = f.color;
    ctx.font = 'bold 16px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(f.text, f.x, f.y);
  }

  // Draw Control Deck
  ctx.fillStyle = '#060a14';
  ctx.fillRect(0, 450, W, 190);
  ctx.fillStyle = '#1e3a8a';
  ctx.fillRect(0, 448, W, 2);

  const legals = legalActions(state);
  for (const b of BTNS) {
    const isLegal = legals.includes(b.action);
    ctx.fillStyle = isLegal ? b.col : '#111827';
    rrect(b.x, b.y, b.w, b.h, 5);
    ctx.fill();
    ctx.strokeStyle = isLegal ? 'rgba(255,255,255,0.3)' : '#1e293b';
    ctx.lineWidth = 1.5;
    rrect(b.x, b.y, b.w, b.h, 5);
    ctx.stroke();

    ctx.fillStyle = isLegal ? '#ffffff' : '#64748b';
    ctx.font = 'bold 10px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(b.label, b.x + b.w / 2, b.y + b.h / 2);
  }
  ctx.textBaseline = 'alphabetic';

  // Game over overlay
  if (isOver(state)) {
    ctx.fillStyle = 'rgba(3, 7, 18, 0.95)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = state.victory ? '#10b981' : '#ef4444';
    ctx.font = 'bold 30px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(state.victory ? 'HEIST ACCOMPLISHED!' : 'APPREHENDED', W / 2, H / 2 - 40);
    ctx.fillStyle = '#f1f5f9';
    ctx.font = '18px system-ui, sans-serif';
    ctx.fillText('Take: $' + state.lootValue.toLocaleString() + '  (Best: ' + best + ')', W / 2, H / 2);
    ctx.fillText(state.hasImperialDiamond ? '👑 Imperial Diamond Secured!' : 'Clean getaway', W / 2, H / 2 + 28);
    ctx.fillStyle = '#38bdf8';
    ctx.font = 'bold 16px system-ui, sans-serif';
    ctx.fillText('Tap to infiltrate again', W / 2, H / 2 + 70);
  }
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  draw(dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

const inApk = window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform();
if (!inApk && 'serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
