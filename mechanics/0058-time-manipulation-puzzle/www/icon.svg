<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0728" />
      <stop offset="100%" stop-color="#050214" />
    </linearGradient>
    <linearGradient id="chronoGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#4c1d95" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <!-- Chrono Rings / Loop Arrows -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#chronoGlow)" stroke-width="14" stroke-dasharray="140 30" />
  <circle cx="256" cy="256" r="110" fill="none" stroke="#38bdf8" stroke-width="8" stroke-dasharray="90 20" opacity="0.7" />
  <!-- Echo Silhouette (Past Self) -->
  <circle cx="220" cy="230" r="32" fill="#8b5cf6" opacity="0.4" />
  <!-- Present Hero Silhouette -->
  <circle cx="270" cy="270" r="40" fill="#38bdf8" />
  <polygon points="270,220 286,260 254,260" fill="#ffffff" />
  <!-- Rewind Arrow -->
  <path d="M160 160 L130 200 L180 210" fill="none" stroke="#c084fc" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
</svg>
