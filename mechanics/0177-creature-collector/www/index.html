<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#061220">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Beast Tamer Arena</title>
<style>
  html, body { margin: 0; height: 100%; background: #061220; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; margin: 0 auto; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="logic.js"></script>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const W = 360;
const H = 640;
let scale = 1;

function resize() {
  scale = Math.min(innerWidth / W, innerHeight / H);
  const dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.style.width = W * scale + 'px';
  canvas.style.height = H * scale + 'px';
  canvas.width = Math.round(W * scale * dpr);
  canvas.height = Math.round(H * scale * dpr);
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
}
addEventListener('resize', resize);
resize();

function rrect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

let best = 0;
try { best = +localStorage.getItem('goe-0177-best') || 0; } catch (e) {}

let state = createState(Date.now());
let floaters = [];
let animTimer = 0;
let overAt = 0;

function restart() {
  state = createState(Date.now());
  floaters = [];
  overAt = 0;
}

function getActiveBeast() {
  return state.party[state.activeBeastIndex] || state.party[0];
}

function performAction(act) {
  if (isOver(state)) return;
  const legals = legalActions(state);
  if (!legals.includes(act)) return;

  const oldEnemyHp = state.enemy ? state.enemy.hp : 0;
  const oldActiveHp = getActiveBeast().hp;
  const oldCaught = state.creaturesCaught;

  const res = step(state, act);

  if (act.includes('attack')) {
    const dmg = state.enemy ? Math.max(0, oldEnemyHp - state.enemy.hp) : 0;
    floaters.push({ text: '-' + dmg + ' HP', x: 250, y: 150, t: 0, color: '#ef4444' });
  } else if (act.includes('throw_tamer_sphere')) {
    if (state.creaturesCaught > oldCaught) {
      floaters.push({ text: 'CAUGHT!', x: 250, y: 140, t: 0, color: '#a855f7' });
    } else {
      floaters.push({ text: 'BROKE FREE!', x: 250, y: 140, t: 0, color: '#f59e0b' });
    }
  } else if (act.includes('use_potion')) {
    floaters.push({ text: '+POTION HEAL', x: 100, y: 320, t: 0, color: '#10b981' });
  } else if (act.includes('defend')) {
    floaters.push({ text: 'SHIELD UP', x: 100, y: 320, t: 0, color: '#38bdf8' });
  }

  if (isOver(state)) {
    overAt = performance.now();
    const sc = score(state);
    if (sc > best) {
      best = sc;
      try { localStorage.setItem('goe-0177-best', best); } catch (e) {}
    }
  }
}

// Action buttons on canvas
const BTNS = [
  { id: 'atk', label: '⚔ ATTACK', action: 'action:command_attack', x: 20, y: 470, w: 155, h: 48, col: '#ef4444' },
  { id: 'def', label: '🛡 DEFEND', action: 'action:command_defend', x: 185, y: 470, w: 155, h: 48, col: '#3b82f6' },
  { id: 'sph', label: '🔮 CATCH SPHERE', action: 'action:throw_tamer_sphere', x: 20, y: 526, w: 155, h: 46, col: '#8b5cf6' },
  { id: 'pot', label: '🧪 USE POTION', action: 'action:use_potion', x: 185, y: 526, w: 155, h: 46, col: '#10b981' },
  { id: 'grass', label: '🌿 TALL GRASS', action: 'action:explore_tall_grass', x: 20, y: 580, w: 155, h: 44, col: '#059669' },
  { id: 'arena', label: '🏆 CHALLENGE LEADER', action: 'action:challenge_arena_leader', x: 185, y: 580, w: 155, h: 44, col: '#d97706' },
];

function toLogical(e) {
  const rect = canvas.getBoundingClientRect();
  return { x: (e.clientX - rect.left) / scale, y: (e.clientY - rect.top) / scale };
}

canvas.addEventListener('pointerdown', (e) => {
  const p = toLogical(e);
  if (isOver(state)) {
    if (performance.now() - overAt > 400) restart();
    return;
  }
  for (const b of BTNS) {
    if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) {
      performAction(b.action);
      return;
    }
  }
  // Tap enemy to attack, tap self to heal/defend
  if (p.y < 460) {
    if (p.x > 180 && p.y < 250) performAction('action:command_attack');
    else if (p.x < 180 && p.y > 250) performAction('action:command_defend');
    else if (!state.inBattle) performAction('action:explore_tall_grass');
  }
});

addEventListener('keydown', (e) => {
  if (isOver(state)) {
    if ((e.key === ' ' || e.key === 'Enter') && performance.now() - overAt > 400) restart();
    return;
  }
  const k = e.key.toLowerCase();
  if (k === '1' || k === 'a' || k === ' ') performAction('action:command_attack');
  else if (k === '2' || k === 'd') performAction('action:command_defend');
  else if (k === '3' || k === 'c') performAction('action:throw_tamer_sphere');
  else if (k === '4' || k === 'p') performAction('action:use_potion');
  else if (k === 'e' || k === 'g') performAction('action:explore_tall_grass');
  else if (k === 'l' || k === 'enter') performAction('action:challenge_arena_leader');
});

function draw(dt) {
  animTimer += dt;

  // Background
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#091e36');
  bg.addColorStop(1, '#050c18');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // Arena Battle Field / Stage Podiums
  // Enemy Podium
  ctx.fillStyle = 'rgba(15, 23, 42, 0.6)';
  ctx.beginPath();
  ctx.ellipse(250, 210, 70, 24, 0, 0, Math.PI * 2);
  ctx.fill();

  // Player Podium
  ctx.fillStyle = 'rgba(15, 23, 42, 0.6)';
  ctx.beginPath();
  ctx.ellipse(100, 390, 80, 28, 0, 0, Math.PI * 2);
  ctx.fill();

  // Draw Enemy Beast (Top Right)
  if (state.enemy && state.enemy.hp > 0) {
    const ex = 250;
    const ey = 175 + Math.sin(animTimer * 3) * 4;

    // Enemy Avatar
    ctx.fillStyle = state.enemy.element === 'Fire' ? '#ef4444' :
                    state.enemy.element === 'Water' ? '#0ea5e9' :
                    state.enemy.element === 'Grass' ? '#22c55e' : '#eab308';
    ctx.beginPath();
    ctx.arc(ex, ey, 26, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 18px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(state.enemy.name[0], ex, ey);

    // Enemy HUD Card
    ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
    rrect(150, 70, 190, 48, 6);
    ctx.fill();
    ctx.strokeStyle = '#334155';
    ctx.lineWidth = 1;
    rrect(150, 70, 190, 48, 6);
    ctx.stroke();

    ctx.fillStyle = '#f8fafc';
    ctx.font = 'bold 12px system-ui, sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillText(state.enemy.name, 160, 76);
    ctx.fillStyle = '#f59e0b';
    ctx.textAlign = 'right';
    ctx.fillText('LV ' + (state.enemy.level || 1), 330, 76);

    // Enemy HP Bar
    const eHpPct = Math.max(0, state.enemy.hp / state.enemy.maxHp);
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(160, 96, 170, 8);
    ctx.fillStyle = eHpPct > 0.4 ? '#22c55e' : '#ef4444';
    ctx.fillRect(160, 96, 170 * eHpPct, 8);
  } else if (!state.inBattle) {
    // Wild grass scene
    ctx.fillStyle = '#10b981';
    ctx.font = 'bold 16px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('🌿 Wandering in Wild Plains 🌿', 250, 180);
    ctx.font = '12px system-ui, sans-serif';
    ctx.fillStyle = '#94a3b8';
    ctx.fillText('Tap Tall Grass to find beasts', 250, 204);
  }

  // Draw Player Beast (Bottom Left)
  const active = getActiveBeast();
  const px = 100;
  const py = 350 + Math.sin(animTimer * 2.5) * 3;

  ctx.fillStyle = active.element === 'Fire' ? '#ef4444' :
                  active.element === 'Water' ? '#0ea5e9' :
                  active.element === 'Grass' ? '#22c55e' : '#eab308';
  ctx.beginPath();
  ctx.arc(px, py, 32, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 22px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(active.name[0], px, py);

  // Player Beast HUD Card
  ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
  rrect(20, 260, 190, 52, 6);
  ctx.fill();
  ctx.strokeStyle = '#334155';
  ctx.lineWidth = 1;
  rrect(20, 260, 190, 52, 6);
  ctx.stroke();

  ctx.fillStyle = '#f8fafc';
  ctx.font = 'bold 12px system-ui, sans-serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.fillText(active.name, 30, 268);
  ctx.fillStyle = '#38bdf8';
  ctx.textAlign = 'right';
  ctx.fillText('LV ' + active.level, 200, 268);

  // Player HP Bar
  const pHpPct = Math.max(0, active.hp / active.maxHp);
  ctx.fillStyle = '#1e293b';
  ctx.fillRect(30, 290, 170, 8);
  ctx.fillStyle = pHpPct > 0.4 ? '#22c55e' : '#ef4444';
  ctx.fillRect(30, 290, 170 * pHpPct, 8);
  ctx.fillStyle = '#e2e8f0';
  ctx.font = 'bold 9px system-ui, sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText(active.hp + '/' + active.maxHp + ' HP', 200, 301);

  // Top Dashboard Header
  ctx.fillStyle = 'rgba(6, 18, 32, 0.9)';
  ctx.fillRect(0, 0, W, 48);

  ctx.fillStyle = '#facc15';
  ctx.font = 'bold 15px system-ui, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('BADGES: ' + state.badges + '/4 🏅', 12, 22);

  ctx.textAlign = 'right';
  ctx.fillStyle = '#38bdf8';
  ctx.fillText('CAUGHT: ' + state.creaturesCaught + ' 🐾', W - 12, 22);

  // Items Bar
  ctx.font = '10px system-ui, sans-serif';
  ctx.fillStyle = '#c084fc';
  ctx.textAlign = 'left';
  ctx.fillText('SPHERES: ' + state.spheres + ' 🔮', 12, 38);
  ctx.fillStyle = '#4ade80';
  ctx.textAlign = 'center';
  ctx.fillText('POTIONS: ' + state.potions + ' 🧪', W / 2, 38);
  ctx.fillStyle = '#94a3b8';
  ctx.textAlign = 'right';
  ctx.fillText(state.inBattle ? '⚔ BATTLE' : '🏕 FIELD', W - 12, 38);

  // Floating text
  for (let i = floaters.length - 1; i >= 0; i--) {
    const f = floaters[i];
    f.y -= 35 * dt;
    f.t += dt;
    if (f.t > 0.8) {
      floaters.splice(i, 1);
      continue;
    }
    ctx.fillStyle = f.color;
    ctx.font = 'bold 16px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(f.text, f.x, f.y);
  }

  // Draw Control Deck
  ctx.fillStyle = '#071526';
  ctx.fillRect(0, 460, W, 180);
  ctx.fillStyle = '#0284c7';
  ctx.fillRect(0, 458, W, 2);

  const legals = legalActions(state);
  for (const b of BTNS) {
    const isLegal = legals.includes(b.action);
    ctx.fillStyle = isLegal ? b.col : '#1e293b';
    rrect(b.x, b.y, b.w, b.h, 6);
    ctx.fill();
    ctx.strokeStyle = isLegal ? 'rgba(255,255,255,0.3)' : '#334155';
    ctx.lineWidth = 1.5;
    rrect(b.x, b.y, b.w, b.h, 6);
    ctx.stroke();

    ctx.fillStyle = isLegal ? '#ffffff' : '#64748b';
    ctx.font = 'bold 11px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(b.label, b.x + b.w / 2, b.y + b.h / 2);
  }
  ctx.textBaseline = 'alphabetic';

  // Game over overlay
  if (isOver(state)) {
    ctx.fillStyle = 'rgba(6, 18, 32, 0.9)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = state.victory ? '#10b981' : '#ef4444';
    ctx.font = 'bold 30px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(state.victory ? 'GRAND CHAMPION!' : 'PARTY FAINTED', W / 2, H / 2 - 40);
    ctx.fillStyle = '#f1f5f9';
    ctx.font = '18px system-ui, sans-serif';
    ctx.fillText('Score: ' + score(state) + '  (Best: ' + best + ')', W / 2, H / 2);
    ctx.fillText('Badges: ' + state.badges + '  Beasts: ' + state.creaturesCaught, W / 2, H / 2 + 28);
    ctx.fillStyle = '#38bdf8';
    ctx.font = 'bold 16px system-ui, sans-serif';
    ctx.fillText('Tap to battle again', W / 2, H / 2 + 70);
  }
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  draw(dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

const inApk = window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform();
if (!inApk && 'serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
