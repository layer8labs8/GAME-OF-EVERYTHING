<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <rect width="512" height="512" rx="128" fill="#030712"/>
  <!-- Matrix cyberspace grid lines -->
  <line x1="128" y1="0" x2="128" y2="512" stroke="#1f2937" stroke-width="4"/>
  <line x1="256" y1="0" x2="256" y2="512" stroke="#1f2937" stroke-width="4"/>
  <line x1="384" y1="0" x2="384" y2="512" stroke="#1f2937" stroke-width="4"/>
  <!-- Cyber Keycap -->
  <rect x="156" y="156" width="200" height="200" rx="36" fill="#0e7490" stroke="#06b6d4" stroke-width="16"/>
  <!-- Glowing Letter -->
  <text x="256" y="295" font-family="monospace" font-size="140" font-weight="bold" fill="#ecfeff" text-anchor="middle">Z</text>
  <!-- Cyber laser beams -->
  <line x1="80" y1="420" x2="256" y2="356" stroke="#38bdf8" stroke-width="10" stroke-linecap="round"/>
  <line x1="432" y1="420" x2="256" y2="356" stroke="#38bdf8" stroke-width="10" stroke-linecap="round"/>
</svg>
