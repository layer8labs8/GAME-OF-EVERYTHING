  <rect width="512" height="512" rx="112" fill="url(#haulerBg)" />
  <!-- Semi Truck Cab Profile / Front -->
  <rect x="140" y="110" width="232" height="280" rx="24" fill="#0284c7" stroke="#38bdf8" stroke-width="8" />
