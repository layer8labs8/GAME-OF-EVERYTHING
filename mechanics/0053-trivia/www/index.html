<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Chronicle Quiz</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#8b5cf6">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 10px;
    }
    header {
      width: 100%;
      max-width: 600px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      background: #1e1b4b;
      border: 1px solid #4338ca;
      border-radius: 8px;
      margin-bottom: 8px;
    }
    .hud-title {
      font-size: 16px;
      font-weight: bold;
      color: #a78bfa;
    }
    .hud-stats {
      display: flex;
      gap: 8px;
      font-size: 13px;
    }
    .stat-pill {
      background: #312e81;
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px solid #4338ca;
    }
    .stat-pill.red { color: #f87171; border-color: #ef4444; }
    .stat-pill.yellow { color: #fbbf24; border-color: #f59e0b; }
    .stat-pill.green { color: #34d399; border-color: #10b981; }

    #gameCanvas {
      background: #030712;
      border: 2px solid #6366f1;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(99, 102, 241, 0.25);
      max-width: 100%;
      touch-action: none;
      cursor: pointer;
    }

    .lifeline-bar {
      width: 100%;
      max-width: 600px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-top: 8px;
    }
    .life-btn {
      background: #1e1b4b;
      border: 1px solid #6366f1;
      color: #c7d2fe;
      padding: 8px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.1s;
    }
    .life-btn:hover { background: #312e81; color: #ffffff; }
    .life-btn:disabled { opacity: 0.35; cursor: not-allowed; border-color: #3730a3; }
    .life-btn.active { background: #f59e0b; border-color: #fbbf24; color: #78350f; }

    .options-grid {
      width: 100%;
      max-width: 600px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 8px;
    }
    .opt-btn {
      background: #18181b;
      border: 2px solid #3f3f46;
      color: #f4f4f5;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      text-align: left;
      transition: all 0.1s;
    }
    .opt-btn:hover { background: #27272a; border-color: #8b5cf6; }
    .opt-btn.eliminated { opacity: 0.2; pointer-events: none; border-color: #27272a; }
    .opt-btn .opt-badge {
      background: #3f3f46;
      padding: 2px 6px;
      border-radius: 4px;
      color: #a78bfa;
    }

    #overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(9, 13, 22, 0.94);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <header>
    <div class="hud-title">CHRONICLE QUIZ</div>
    <div class="hud-stats">
      <span class="stat-pill yellow">Round: <strong id="roundEl">1/10</strong></span>
      <span class="stat-pill red">Strikes: <strong id="strikesEl">0/3</strong></span>
      <span class="stat-pill green">Streak: <strong id="streakEl">0x</strong></span>
      <span class="stat-pill">Score: <strong id="scoreEl">0</strong></span>
    </div>
  </header>

  <div style="position: relative; width: 600px; max-width: 100%;">
    <canvas id="gameCanvas" width="600" height="240"></canvas>
    <div id="overlay">
      <h2 id="overlayTitle" style="font-size: 32px; color: #a78bfa; margin-bottom: 12px;">CHAMPION!</h2>
      <p id="overlayDesc" style="color: #cbd5e1; margin-bottom: 24px;">All trivia rounds completed successfully!</p>
      <button class="life-btn" id="playAgainBtn" style="padding: 12px 24px; font-size: 16px;">Next Match</button>
    </div>
  </div>

  <div class="lifeline-bar">
    <button class="life-btn" id="btn-5050">
      <span>✂ 50:50</span>
      <span id="count-5050">(1)</span>
    </button>
    <button class="life-btn" id="btn-double">
      <span>⚡ Double Down</span>
      <span id="count-double">(1)</span>
    </button>
    <button class="life-btn" id="btn-skip">
      <span>⏭ Skip Round</span>
      <span id="count-skip">(1)</span>
    </button>
  </div>

  <div class="options-grid">
    <button class="opt-btn" id="opt-0" data-idx="0">
      <span class="opt-badge">A</span>
      <span class="opt-text" id="text-0">Option 0</span>
    </button>
    <button class="opt-btn" id="opt-1" data-idx="1">
      <span class="opt-badge">B</span>
      <span class="opt-text" id="text-1">Option 1</span>
    </button>
    <button class="opt-btn" id="opt-2" data-idx="2">
      <span class="opt-badge">C</span>
      <span class="opt-text" id="text-2">Option 2</span>
    </button>
    <button class="opt-btn" id="opt-3" data-idx="3">
      <span class="opt-badge">D</span>
      <span class="opt-text" id="text-3">Option 3</span>
    </button>
  </div>

  <script src="logic.js"></script>
  <script>
    let state = createState(1);
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas ? canvas.getContext("2d") : null;

    let audioCtx = null;
    function playTone(freq, type = 'sine', duration = 0.1) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function updateUI() {
      const roundEl = document.getElementById("roundEl");
      if (roundEl) roundEl.textContent = `${Math.min(TOTAL_ROUNDS, state.round + 1)}/${TOTAL_ROUNDS}`;
      const strikesEl = document.getElementById("strikesEl");
      if (strikesEl) strikesEl.textContent = `${state.strikes}/${MAX_STRIKES}`;
      const streakEl = document.getElementById("streakEl");
      if (streakEl) streakEl.textContent = `${state.streak}x`;
      const scoreEl = document.getElementById("scoreEl");
      if (scoreEl) scoreEl.textContent = state.score;

      // Lifelines buttons
      const btn5050 = document.getElementById("btn-5050");
      if (btn5050) {
        btn5050.disabled = (state.lifelines.fiftyFifty <= 0 || state.eliminated.length > 0 || state.done);
        const cnt = document.getElementById("count-5050");
        if (cnt) cnt.textContent = `(${state.lifelines.fiftyFifty})`;
      }

      const btnDouble = document.getElementById("btn-double");
      if (btnDouble) {
        btnDouble.disabled = (state.lifelines.doubleDown <= 0 || state.doubleDownActive || state.done);
        if (btnDouble.classList) {
          if (state.doubleDownActive) btnDouble.classList.add("active");
          else btnDouble.classList.remove("active");
        }
        const cnt = document.getElementById("count-double");
        if (cnt) cnt.textContent = `(${state.lifelines.doubleDown})`;
      }

      const btnSkip = document.getElementById("btn-skip");
      if (btnSkip) {
        btnSkip.disabled = (state.lifelines.skip <= 0 || state.done);
        const cnt = document.getElementById("count-skip");
        if (cnt) cnt.textContent = `(${state.lifelines.skip})`;
      }

      // Question Options
      if (!state.done && state.round < TOTAL_ROUNDS) {
        const q = state.questions[state.round];
        for (let i = 0; i < 4; i++) {
          const optBtn = document.getElementById("opt-" + i);
          const optText = document.getElementById("text-" + i);
          if (optText) optText.textContent = q.options[i];
          if (optBtn && optBtn.classList) {
            if (state.eliminated.includes(i)) {
              optBtn.classList.add("eliminated");
            } else {
              optBtn.classList.remove("eliminated");
            }
          }
        }
      }

      if (state.done) {
        const overlay = document.getElementById("overlay");
        if (overlay) overlay.style.display = "flex";
        const title = document.getElementById("overlayTitle");
        const desc = document.getElementById("overlayDesc");
        if (title && desc) {
          if (state.won) {
            title.textContent = "TRIVIA CHAMPION!";
            title.style.color = "#a78bfa";
            desc.textContent = `Finished with ${score(state)} points and ${state.correctCount}/${TOTAL_ROUNDS} correct!`;
            playTone(659, 'triangle', 0.35);
          } else {
            title.textContent = "DISQUALIFIED (3 STRIKES)";
            title.style.color = "#f87171";
            desc.textContent = `Too many incorrect answers. Final score: ${score(state)}.`;
            playTone(160, 'sawtooth', 0.4);
          }
        }
      }
    }

    function render() {
      if (!ctx || !canvas) return;
      ctx.fillStyle = "#030712";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (state.round < TOTAL_ROUNDS) {
        const q = state.questions[state.round];

        // Category Tag
        ctx.fillStyle = "#4338ca";
        ctx.fillRect(20, 20, 140, 28);
        ctx.strokeStyle = "#6366f1";
        ctx.strokeRect(20, 20, 140, 28);
        ctx.fillStyle = "#e0e7ff";
        ctx.font = "bold 13px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(q.category.toUpperCase(), 90, 34);

        if (state.doubleDownActive) {
          ctx.fillStyle = "#f59e0b";
          ctx.fillRect(170, 20, 130, 28);
          ctx.fillStyle = "#78350f";
          ctx.fillText("⚡ 2X DOUBLE DOWN", 235, 34);
        }

        // Question Prompt Card
        ctx.fillStyle = "#1e1b4b";
        ctx.fillRect(20, 60, canvas.width - 40, 160);
        ctx.strokeStyle = "#4338ca";
        ctx.lineWidth = 2;
        ctx.strokeRect(20, 60, canvas.width - 40, 160);

        ctx.fillStyle = "#f8fafc";
        ctx.font = "bold 20px Georgia, serif";
        ctx.textAlign = "center";

        // Wrap prompt text
        const words = q.prompt.split(" ");
        let line = "";
        let y = 120;
        for (let i = 0; i < words.length; i++) {
          const testLine = line + words[i] + " ";
          const metrics = ctx.measureText(testLine);
          if (metrics.width > canvas.width - 80 && i > 0) {
            ctx.fillText(line, canvas.width / 2, y);
            line = words[i] + " ";
            y += 30;
          } else {
            line = testLine;
          }
        }
        ctx.fillText(line, canvas.width / 2, y);
      }
    }

    function doAction(action) {
      if (state.done) return;
      try {
        const res = step(state, action);
        if (action.startsWith("answer:")) {
          if (res.reward > 0) playTone(587, 'triangle', 0.15);
          else playTone(180, 'sawtooth', 0.2);
        } else {
          playTone(440, 'sine', 0.08);
        }
        updateUI();
        render();
      } catch (err) {
        console.warn(err);
      }
    }

    // Attach button listeners safely
    for (let i = 0; i < 4; i++) {
      const optBtn = document.getElementById("opt-" + i);
      if (optBtn && typeof optBtn.addEventListener === 'function') {
        optBtn.addEventListener("click", () => {
          doAction(`answer:${i}`);
        });
      }
    }

    const btn5050 = document.getElementById("btn-5050");
    if (btn5050 && typeof btn5050.addEventListener === 'function') {
      btn5050.addEventListener("click", () => doAction("use_lifeline:fifty_fifty"));
    }

    const btnDouble = document.getElementById("btn-double");
    if (btnDouble && typeof btnDouble.addEventListener === 'function') {
      btnDouble.addEventListener("click", () => doAction("use_lifeline:double_down"));
    }

    const btnSkip = document.getElementById("btn-skip");
    if (btnSkip && typeof btnSkip.addEventListener === 'function') {
      btnSkip.addEventListener("click", () => doAction("use_lifeline:skip"));
    }

    const playAgainBtn = document.getElementById("playAgainBtn");
    if (playAgainBtn && typeof playAgainBtn.addEventListener === 'function') {
      playAgainBtn.addEventListener("click", () => {
        state = createState(state.seed + 1);
        const overlay = document.getElementById("overlay");
        if (overlay) overlay.style.display = "none";
        updateUI();
        render();
      });
    }

    window.addEventListener("keydown", (e) => {
      if (e.key === "1" || e.key === "a" || e.key === "A") doAction("answer:0");
      else if (e.key === "2" || e.key === "b" || e.key === "B") doAction("answer:1");
      else if (e.key === "3" || e.key === "c" || e.key === "C") doAction("answer:2");
      else if (e.key === "4" || e.key === "d" || e.key === "D") doAction("answer:3");
    });

    updateUI();
    render();
  </script>
</body>
</html>
