<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="chronoBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#881337" />
      <stop offset="60%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <linearGradient id="needleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#chronoBg)" />
  <!-- Red & White Racing Curb Apex Arc -->
  <path d="M 60 450 C 140 320 280 200 450 140" fill="none" stroke="#e11d48" stroke-width="28" stroke-dasharray="32 32" />
  <path d="M 60 450 C 140 320 280 200 450 140" fill="none" stroke="#f8fafc" stroke-width="28" stroke-dashoffset="32" stroke-dasharray="32 32" />
  <!-- Chrono Stopwatch Dial -->
  <circle cx="256" cy="270" r="140" fill="#09090b" stroke="#e11d48" stroke-width="8" />
  <circle cx="256" cy="270" r="124" fill="none" stroke="#fda4af" stroke-width="2" stroke-dasharray="8 16" />
  <!-- Stopwatch Top Pushers -->
  <rect x="236" y="96" width="40" height="26" rx="4" fill="#cbd5e1" stroke="#94a3b8" stroke-width="3" />
  <rect x="246" y="82" width="20" height="16" rx="3" fill="#e11d48" />
  <rect x="146" y="130" width="28" height="18" rx="3" transform="rotate(-30 146 130)" fill="#cbd5e1" />
  <rect x="338" y="116" width="28" height="18" rx="3" transform="rotate(30 338 116)" fill="#cbd5e1" />
  <!-- High-Precision Chrono Needle -->
  <line x1="256" y1="270" x2="310" y2="175" stroke="url(#needleGrad)" stroke-width="6" stroke-linecap="round" />
  <circle cx="256" cy="270" r="12" fill="#e11d48" stroke="#f8fafc" stroke-width="3" />
  <!-- Digital Delta Display -->
  <rect x="206" y="325" width="100" height="32" rx="6" fill="#1e1b4b" stroke="#38bdf8" stroke-width="2" />
  <text x="256" y="347" font-family="monospace" font-size="16" font-weight="bold" fill="#38bdf8" text-anchor="middle">-0.35s</text>
</svg>
