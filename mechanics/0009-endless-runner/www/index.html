<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b1020">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>Neon Sprint</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b1020; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; margin: 0 auto; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="logic.js"></script>
<script>
const { LANES, PLAYER_Y, createState, legalActions, step, isOver, score } = GameLogic;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const W = 360;
const H = 640;
const LANE_X = [95, 180, 265];
const TRACK_L = 50;
const TRACK_R = 310;

let scale = 1;
function resize() {
  scale = Math.min(innerWidth / W, innerHeight / H);
  const dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.style.width = W * scale + 'px';
  canvas.style.height = H * scale + 'px';
  canvas.width = Math.round(W * scale * dpr);
  canvas.height = Math.round(H * scale * dpr);
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
}
addEventListener('resize', resize);
resize();

let best = 0;
try { best = +localStorage.getItem('goe-0009-best') || 0; } catch (e) {}

let state = createState(Date.now());
let visualX = LANE_X[state.lane];
let roadScroll = 0;
let overAt = 0;

function restart() {
  state = createState(Date.now());
  visualX = LANE_X[state.lane];
  roadScroll = 0;
  overAt = 0;
}

function rrect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function toLogical(e) {
  const rect = canvas.getBoundingClientRect();
  return { x: (e.clientX - rect.left) / scale, y: (e.clientY - rect.top) / scale };
}

let startTouch = null;
canvas.addEventListener('pointerdown', (e) => {
  const p = toLogical(e);
  if (isOver(state)) {
    if (performance.now() - overAt > 400) restart();
    return;
  }
  startTouch = p;
});

window.addEventListener('pointerup', (e) => {
  if (!startTouch || isOver(state)) return;
  const p = toLogical(e);
  const dx = p.x - startTouch.x;
  const dy = p.y - startTouch.y;
  startTouch = null;

  if (Math.abs(dx) > Math.abs(dy)) {
    if (dx > 25) stepSim('right');
    else if (dx < -25) stepSim('left');
  } else {
    if (dy < -25) stepSim('jump');
    else if (dy > 25) stepSim('slide');
  }
});

addEventListener('keydown', (e) => {
  if (isOver(state)) {
    if ((e.key === ' ' || e.key === 'Enter') && performance.now() - overAt > 400) restart();
    return;
  }
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') stepSim('left');
  else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') stepSim('right');
  else if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W' || e.key === ' ') stepSim('jump');
  else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') stepSim('slide');
  else if (e.key === 'r') restart();
});

function stepSim(act) {
  if (isOver(state)) return;
  const res = step(state, act);
  if (res.done) {
    overAt = performance.now();
    const sc = score(state);
    if (sc > best) {
      best = sc;
      try { localStorage.setItem('goe-0009-best', best); } catch (e) {}
    }
  }
}

let tickAcc = 0;
function updateSim(dt) {
  tickAcc += dt;
  const STEP_TIME = 1 / 30;

  while (tickAcc >= STEP_TIME && !isOver(state)) {
    tickAcc -= STEP_TIME;
    stepSim('wait');
  }

  // Visual lerp
  const targetX = LANE_X[state.lane];
  visualX += (targetX - visualX) * Math.min(1, dt * 18);
  roadScroll = (roadScroll + state.speed) % 60;
}

function drawPlayer(x, y) {
  ctx.save();
  let py = y;
  let scaleY = 1;

  if (state.jumping > 0) {
    py -= 34;
  } else if (state.sliding > 0) {
    scaleY = 0.5;
    py += 12;
  }

  ctx.translate(x, py);
  ctx.scale(1, scaleY);

  // Shadow if jumping
  if (state.jumping > 0) {
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath();
    ctx.ellipse(0, 34, 14, 5, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  // Runner body
  ctx.fillStyle = '#06b6d4';
  ctx.strokeStyle = '#0891b2';
  ctx.lineWidth = 2;
  rrect(-12, -22, 24, 44, 6);
  ctx.fill();
  ctx.stroke();

  // Cyber visor
  ctx.fillStyle = '#f43f5e';
  ctx.fillRect(-8, -16, 16, 5);

  ctx.restore();
}

function drawObstacle(ob) {
  const x = LANE_X[ob.lane];
  const y = ob.y;

  if (ob.type === 'orb') {
    ctx.fillStyle = '#fbbf24';
    ctx.strokeStyle = '#d97706';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(x, y, 12, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
  } else if (ob.type === 'hurdle') {
    // Low hurdle (jumpable)
    ctx.fillStyle = '#f97316';
    rrect(x - 28, y - 6, 56, 14, 4);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(x - 22, y - 2, 44, 4);
  } else if (ob.type === 'laser') {
    // High laser (slideable)
    ctx.fillStyle = '#f43f5e';
    ctx.shadowColor = '#f43f5e';
    ctx.shadowBlur = 10;
    ctx.fillRect(x - 34, y - 16, 68, 8);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(x - 28, y - 14, 56, 4);
  } else {
    // Barrier (impassable)
    ctx.fillStyle = '#8b5cf6';
    ctx.strokeStyle = '#6d28d9';
    ctx.lineWidth = 2;
    rrect(x - 30, y - 20, 60, 40, 6);
    ctx.fill();
    ctx.stroke();
  }
}

function draw() {
  ctx.fillStyle = '#0a0d1e';
  ctx.fillRect(0, 0, W, H);

  // Highway surface
  ctx.fillStyle = '#111827';
  ctx.fillRect(TRACK_L, 0, TRACK_R - TRACK_L, H);

  // Side curbs
  ctx.strokeStyle = '#38bdf8';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(TRACK_L, 0);
  ctx.lineTo(TRACK_L, H);
  ctx.moveTo(TRACK_R, 0);
  ctx.lineTo(TRACK_R, H);
  ctx.stroke();

  // Lane dividers
  ctx.strokeStyle = 'rgba(255,255,255,0.15)';
  ctx.lineWidth = 2;
  ctx.setLineDash([20, 20]);
  ctx.lineDashOffset = -roadScroll;
  ctx.beginPath();
  ctx.moveTo(137, 0); ctx.lineTo(137, H);
  ctx.moveTo(223, 0); ctx.lineTo(223, H);
  ctx.stroke();
  ctx.setLineDash([]);

  // Obstacles
  for (const ob of state.obstacles) {
    drawObstacle(ob);
  }

  // Player Runner
  if (state.shields > 0) {
    drawPlayer(visualX, PLAYER_Y);
  }

  // HUD
  ctx.fillStyle = '#8a93a8';
  ctx.font = '12px system-ui, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('SCORE', 20, 32);
  ctx.textAlign = 'center';
  ctx.fillText('DISTANCE', W / 2, 32);
  ctx.textAlign = 'right';
  ctx.fillText('BEST', W - 20, 32);

  ctx.fillStyle = '#e8ecf5';
  ctx.font = 'bold 26px system-ui, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(score(state), 20, 62);
  ctx.fillStyle = '#06b6d4';
  ctx.textAlign = 'center';
  ctx.fillText(`${Math.floor(state.distance / 10)} m`, W / 2, 62);
  ctx.fillStyle = '#fbbf24';
  ctx.font = 'bold 20px system-ui, sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText(best, W - 20, 60);

  // Shields
  for (let i = 0; i < 3; i++) {
    ctx.fillStyle = i < state.shields ? '#06b6d4' : '#1e293b';
    ctx.beginPath();
    ctx.arc(28 + i * 22, 86, 7, 0, Math.PI * 2);
    ctx.fill();
  }

  if (state.streak >= 4 && !isOver(state)) {
    ctx.fillStyle = '#fbbf24';
    ctx.font = 'bold 14px system-ui, sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText(`STREAK x${state.streak}`, W - 20, 88);
  }

  // On-screen touch hints at bottom
  ctx.fillStyle = 'rgba(255,255,255,0.06)';
  rrect(20, 580, 70, 42, 8); ctx.fill();
  rrect(100, 580, 70, 42, 8); ctx.fill();
  rrect(190, 580, 70, 42, 8); ctx.fill();
  rrect(270, 580, 70, 42, 8); ctx.fill();

  ctx.fillStyle = '#94a3b8';
  ctx.font = 'bold 12px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('LEFT', 55, 606);
  ctx.fillText('RIGHT', 135, 606);
  ctx.fillText('JUMP', 225, 606);
  ctx.fillText('SLIDE', 305, 606);

  if (isOver(state)) {
    ctx.fillStyle = 'rgba(11,16,32,0.85)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#f43f5e';
    ctx.font = 'bold 34px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Sprint Terminated', W / 2, H / 2 - 32);
    ctx.fillStyle = '#e8ecf5';
    ctx.font = '22px system-ui, sans-serif';
    ctx.fillText('Final Score: ' + score(state), W / 2, H / 2 + 8);
    ctx.fillStyle = '#06b6d4';
    ctx.font = '18px system-ui, sans-serif';
    ctx.fillText('Tap anywhere to sprint again', W / 2, H / 2 + 50);
  }
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  updateSim(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

const inApk = window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform();
if (!inApk && 'serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
