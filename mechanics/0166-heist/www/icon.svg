<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="heistBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="60%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="60%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#854d0e" />
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#heistBg)" />
  <!-- Vault Door Circular Frame -->
  <circle cx="256" cy="256" r="190" fill="#27272a" stroke="#71717a" stroke-width="12" />
  <circle cx="256" cy="256" r="160" fill="#18181b" stroke="#3f3f46" stroke-width="8" />
  <!-- Vault spokes -->
  <line x1="256" y1="110" x2="256" y2="402" stroke="#52525b" stroke-width="10" />
  <line x1="110" y1="256" x2="402" y2="256" stroke="#52525b" stroke-width="10" />
  <line x1="150" y1="150" x2="362" y2="362" stroke="#52525b" stroke-width="8" />
  <line x1="150" y1="362" x2="362" y2="150" stroke="#52525b" stroke-width="8" />
  <!-- Central Diamond -->
  <polygon points="256,180 320,230 256,330 192,230" fill="url(#goldGlow)" stroke="#fef08a" stroke-width="4" />
  <polygon points="216,230 256,180 296,230" fill="#fef9c3" opacity="0.6" />
  <!-- Laser Tripwire Grid -->
  <line x1="80" y1="200" x2="432" y2="200" stroke="#ef4444" stroke-width="4" stroke-dasharray="10 8" opacity="0.8" />
  <line x1="80" y1="312" x2="432" y2="312" stroke="#ef4444" stroke-width="4" stroke-dasharray="10 8" opacity="0.8" />
</svg>
