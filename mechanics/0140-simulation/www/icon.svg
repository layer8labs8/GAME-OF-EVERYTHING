<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="space" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="planet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="120" fill="url(#space)"/>
  <!-- Atmosphere Glow Ring -->
  <circle cx="256" cy="256" r="165" fill="none" stroke="#6ee7b7" stroke-width="8" opacity="0.6"/>
  <!-- Planet Sphere -->
  <circle cx="256" cy="256" r="150" fill="url(#planet)"/>
  <!-- Emerald Continents -->
  <path d="M 180 180 Q 230 160 260 200 T 290 260 Q 250 280 200 250 Z" fill="#10b981"/>
  <path d="M 270 290 Q 330 280 350 330 T 290 370 Q 260 340 270 290 Z" fill="#34d399"/>
  <path d="M 150 280 Q 180 300 170 340 T 130 330 Z" fill="#10b981"/>
