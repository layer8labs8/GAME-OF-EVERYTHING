<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="boxBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <linearGradient id="sandGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="waterGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#boxBg)" />
  <rect x="96" y="96" width="320" height="320" rx="16" fill="#030712" stroke="#38bdf8" stroke-width="8" />
  <!-- Stone base inside box -->
  <rect x="96" y="376" width="320" height="40" fill="#475569" />
  <!-- Sand pyramid -->
  <polygon points="120,376 220,260 280,376" fill="url(#sandGrad)" />
  <!-- Water pool -->
  <rect x="270" y="320" width="130" height="56" rx="6" fill="url(#waterGrad)" opacity="0.8" />
  <!-- Fire tongue -->
  <path d="M 220,240 Q 240,200 230,170 Q 210,210 220,240 Z" fill="#ef4444" />
  <circle cx="225" cy="210" r="8" fill="#facc15" />
  <!-- Lightning bolt -->
  <polygon points="340,120 310,190 335,190 315,250 365,170 340,170" fill="#fde047" stroke="#ca8a04" stroke-width="2" />
</svg>
