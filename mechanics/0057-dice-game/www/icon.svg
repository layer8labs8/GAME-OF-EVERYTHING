<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="felt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="dieFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <radialGradient id="pipGold" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="60%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#felt)" />
  <!-- Golden Trim Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#d97706" stroke-width="8" stroke-dasharray="8 8" opacity="0.6" />
  <!-- Left Die (showing 5) -->
  <g transform="translate(100, 160) rotate(-12)">
    <rect width="140" height="140" rx="28" fill="url(#dieFace)" filter="drop-shadow(0 12px 20px rgba(0,0,0,0.5))" />
    <circle cx="35" cy="35" r="12" fill="url(#pipGold)" />
    <circle cx="105" cy="35" r="12" fill="url(#pipGold)" />
    <circle cx="70" cy="70" r="12" fill="url(#pipGold)" />
    <circle cx="35" cy="105" r="12" fill="url(#pipGold)" />
    <circle cx="105" cy="105" r="12" fill="url(#pipGold)" />
  </g>
  <!-- Right Die (showing 6) -->
  <g transform="translate(260, 200) rotate(15)">
    <rect width="140" height="140" rx="28" fill="url(#dieFace)" filter="drop-shadow(0 12px 20px rgba(0,0,0,0.5))" />
    <circle cx="40" cy="30" r="12" fill="url(#pipGold)" />
    <circle cx="100" cy="30" r="12" fill="url(#pipGold)" />
    <circle cx="40" cy="70" r="12" fill="url(#pipGold)" />
    <circle cx="100" cy="70" r="12" fill="url(#pipGold)" />
    <circle cx="40" cy="110" r="12" fill="url(#pipGold)" />
    <circle cx="100" cy="110" r="12" fill="url(#pipGold)" />
  </g>
</svg>
