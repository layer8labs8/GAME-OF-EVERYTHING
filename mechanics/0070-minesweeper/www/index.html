<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b1020">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>Hazard Grid</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b1020; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; margin: 0 auto; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="logic.js"></script>
<script>
const { SIZE, CELLS, MINES, createState, step, isOver, score } = GameLogic;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const W = 360;
const H = 640;
const BX = 22;
const BY = 132;
const CELL = 45;

const NUM_COLORS = ['', '#4dabf7', '#69db7c', '#ff8787', '#b197fc', '#ffd43b', '#4fd1c5', '#f783ac', '#e8ecf5'];

let scale = 1;
function resize() {
  scale = Math.min(innerWidth / W, innerHeight / H);
  const dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.style.width = W * scale + 'px';
  canvas.style.height = H * scale + 'px';
  canvas.width = Math.round(W * scale * dpr);
  canvas.height = Math.round(H * scale * dpr);
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
}
addEventListener('resize', resize);
resize();

let best = 0;
try { best = +localStorage.getItem('goe-0070-best') || 0; } catch (e) {}

let state = createState(Date.now());
let flagged = new Array(CELLS).fill(false);
let flagMode = false;
let cursor = 24;
let overAt = 0;

function restart() {
  state = createState(Date.now());
  flagged = new Array(CELLS).fill(false);
  flagMode = false;
  overAt = 0;
}

function rrect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function actOnCell(idx, forceFlag) {
  if (isOver(state) || idx < 0 || idx >= CELLS) return;
  if (state.revealed[idx]) return;
  if (forceFlag || flagMode) {
    flagged[idx] = !flagged[idx];
    return;
  }
  if (flagged[idx]) return;
  const res = step(state, idx);
  for (let i = 0; i < CELLS; i++) {
    if (state.revealed[i]) flagged[i] = false;
  }
  if (res.done) {
    overAt = performance.now();
    const sc = score(state);
    if (sc > best) {
      best = sc;
      try { localStorage.setItem('goe-0070-best', best); } catch (e) {}
    }
  }
}

function toLogical(e) {
  const rect = canvas.getBoundingClientRect();
  return { x: (e.clientX - rect.left) / scale, y: (e.clientY - rect.top) / scale };
}

canvas.addEventListener('contextmenu', (e) => e.preventDefault());

canvas.addEventListener('pointerdown', (e) => {
  const p = toLogical(e);
  if (isOver(state)) {
    if (performance.now() - overAt > 400) restart();
    return;
  }
  if (p.x >= BX && p.x <= BX + CELL * SIZE && p.y >= BY && p.y <= BY + CELL * SIZE) {
    const c = Math.min(SIZE - 1, Math.floor((p.x - BX) / CELL));
    const r = Math.min(SIZE - 1, Math.floor((p.y - BY) / CELL));
    const idx = r * SIZE + c;
    cursor = idx;
    actOnCell(idx, e.button === 2);
    return;
  }
  if (p.x >= 36 && p.x <= 176 && p.y >= 478 && p.y <= 534) {
    flagMode = false;
  } else if (p.x >= 184 && p.x <= 324 && p.y >= 478 && p.y <= 534) {
    flagMode = true;
  } else if (p.x >= 115 && p.x <= 245 && p.y >= 554 && p.y <= 596) {
    restart();
  }
});

addEventListener('keydown', (e) => {
  if (isOver(state)) {
    if ((e.key === ' ' || e.key === 'Enter') && performance.now() - overAt > 400) restart();
    return;
  }
  if (e.key === 'ArrowRight' || e.key === 'd') cursor = (cursor + 1) % CELLS;
  else if (e.key === 'ArrowLeft' || e.key === 'a') cursor = (cursor + CELLS - 1) % CELLS;
  else if (e.key === 'ArrowDown' || e.key === 's') cursor = (cursor + SIZE) % CELLS;
  else if (e.key === 'ArrowUp' || e.key === 'w') cursor = (cursor + CELLS - SIZE) % CELLS;
  else if (e.key === 'f' || e.key === 'F') actOnCell(cursor, true);
  else if (e.key === ' ' || e.key === 'Enter') actOnCell(cursor, false);
  else if (e.key === 'r' || e.key === 'R') restart();
});

function drawMine(cx, cy) {
  ctx.fillStyle = '#ff6b6b';
  ctx.beginPath();
  ctx.arc(cx, cy, 10, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#ff6b6b';
  ctx.lineWidth = 2.5;
  for (let k = 0; k < 4; k++) {
    const a = (k * Math.PI) / 4;
    ctx.beginPath();
    ctx.moveTo(cx - Math.cos(a) * 14, cy - Math.sin(a) * 14);
    ctx.lineTo(cx + Math.cos(a) * 14, cy + Math.sin(a) * 14);
    ctx.stroke();
  }
  ctx.fillStyle = '#fff5f5';
  ctx.beginPath();
  ctx.arc(cx - 3, cy - 3, 2.5, 0, Math.PI * 2);
  ctx.fill();
}

function drawFlag(cx, cy) {
  ctx.strokeStyle = '#e8ecf5';
  ctx.lineWidth = 2.2;
  ctx.beginPath();
  ctx.moveTo(cx - 5, cy + 11);
  ctx.lineTo(cx - 5, cy - 11);
  ctx.stroke();
  ctx.fillStyle = '#ff922b';
  ctx.beginPath();
  ctx.moveTo(cx - 4, cy - 11);
  ctx.lineTo(cx + 10, cy - 5);
  ctx.lineTo(cx - 4, cy + 1);
  ctx.closePath();
  ctx.fill();
}

function draw() {
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#162240');
  bg.addColorStop(1, '#0b1020');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  const flagsUsed = flagged.filter(Boolean).length;

  ctx.fillStyle = '#8a93a8';
  ctx.font = '12px system-ui, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('SCORE', 26, 40);
  ctx.textAlign = 'center';
  ctx.fillText('HAZARDS', W / 2, 40);
  ctx.textAlign = 'right';
  ctx.fillText('BEST', W - 26, 40);

  ctx.fillStyle = '#e8ecf5';
  ctx.font = 'bold 28px system-ui, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(score(state), 26, 74);
  ctx.fillStyle = '#ff922b';
  ctx.textAlign = 'center';
  ctx.fillText(Math.max(0, MINES - flagsUsed), W / 2, 74);
  ctx.fillStyle = '#4fd1c5';
  ctx.font = 'bold 22px system-ui, sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText(best, W - 26, 72);

  ctx.fillStyle = '#8a93a8';
  ctx.font = '13px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(`Cleared ${state.revealedCount} / ${CELLS - MINES}`, W / 2, 108);

  ctx.fillStyle = '#111a33';
  rrect(BX - 6, BY - 6, CELL * SIZE + 12, CELL * SIZE + 12, 14);
  ctx.fill();

  for (let i = 0; i < CELLS; i++) {
    const r = Math.floor(i / SIZE);
    const c = i % SIZE;
    const x = BX + c * CELL;
    const y = BY + r * CELL;
    const rev = state.revealed[i];
    const showMine = isOver(state) && state.mines[i];

    if (i === state.explodedCell) ctx.fillStyle = '#5c1f2b';
    else if (rev) ctx.fillStyle = '#141f3c';
    else ctx.fillStyle = '#243666';

    rrect(x + 2, y + 2, CELL - 4, CELL - 4, 7);
    ctx.fill();

    if (i === cursor && !isOver(state)) {
      ctx.strokeStyle = '#4fd1c5';
      ctx.lineWidth = 1.6;
      rrect(x + 2, y + 2, CELL - 4, CELL - 4, 7);
      ctx.stroke();
    }

    const cx = x + CELL / 2;
    const cy = y + CELL / 2;

    if (showMine) {
      drawMine(cx, cy);
    } else if (rev && state.counts[i] > 0) {
      ctx.fillStyle = NUM_COLORS[state.counts[i]];
      ctx.font = 'bold 21px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(state.counts[i], cx, cy + 1);
      ctx.textBaseline = 'alphabetic';
    } else if (!rev && flagged[i]) {
      drawFlag(cx, cy);
    }
  }

  // Dig / Flag mode buttons
  ctx.fillStyle = !flagMode ? '#2b8a83' : '#1b284a';
  rrect(36, 478, 140, 52, 12);
  ctx.fill();
  ctx.fillStyle = '#e8ecf5';
  ctx.font = 'bold 16px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('DIG MODE', 106, 510);

  ctx.fillStyle = flagMode ? '#d96b27' : '#1b284a';
  rrect(184, 478, 140, 52, 12);
  ctx.fill();
  ctx.fillStyle = '#e8ecf5';
  ctx.fillText('FLAG MODE', 254, 510);

  ctx.fillStyle = '#192647';
  rrect(115, 554, 130, 42, 10);
  ctx.fill();
  ctx.fillStyle = '#8a93a8';
  ctx.font = 'bold 14px system-ui, sans-serif';
  ctx.fillText('New Grid', W / 2, 580);

  if (isOver(state)) {
    ctx.fillStyle = 'rgba(11,16,32,0.82)';
    ctx.fillRect(0, 0, W, H);
    const won = state.outcome === 'won';
    ctx.fillStyle = won ? '#69db7c' : '#ff6b6b';
    ctx.font = 'bold 34px system-ui, sans-serif';
    ctx.fillText(won ? 'Sector Cleared!' : 'Hazard Detonated', W / 2, H / 2 - 32);
    ctx.fillStyle = '#e8ecf5';
    ctx.font = '22px system-ui, sans-serif';
    ctx.fillText('Score: ' + score(state), W / 2, H / 2 + 8);
    ctx.fillStyle = '#4fd1c5';
    ctx.font = '18px system-ui, sans-serif';
    ctx.fillText('Tap to play again', W / 2, H / 2 + 50);
  }
}

function frame() {
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

const inApk = window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform();
if (!inApk && 'serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
