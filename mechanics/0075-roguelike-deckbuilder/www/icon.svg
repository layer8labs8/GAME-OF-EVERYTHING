<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="blade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <rect width="500" height="500" x="6" y="6" rx="90" fill="none" stroke="#ef4444" stroke-width="4" stroke-opacity="0.3"/>
  <g transform="translate(106, 86)">
    <!-- Card Frame in background -->
    <rect x="30" y="20" width="240" height="340" rx="20" fill="#1e293b" stroke="#475569" stroke-width="6"/>
    <!-- Card Inner Window -->
    <rect x="50" y="50" width="200" height="180" rx="12" fill="#090d16" stroke="#ef4444" stroke-width="3"/>

    <!-- Glowing Slay / Strike Greatsword -->
    <path d="M 80,60 L 220,200 L 205,215 L 65,75 Z" fill="url(#blade)" filter="url(#glow)"/>
    <polygon points="220,200 235,215 220,230 205,215" fill="#fca5a5"/>
    <circle cx="80" cy="60" r="14" fill="#fbbf24"/>

    <!-- Energy Orb top left -->
    <circle cx="50" cy="50" r="24" fill="#ef4444" stroke="#ffffff" stroke-width="4" filter="url(#glow)"/>
    <text x="50" y="59" fill="#ffffff" font-size="26" font-weight="900" font-family="sans-serif" text-anchor="middle">1</text>

    <!-- Card Title banner -->
    <rect x="60" y="250" width="180" height="32" rx="6" fill="#334155"/>
    <text x="150" y="272" fill="#f87171" font-size="16" font-weight="bold" font-family="sans-serif" text-anchor="middle">HEAVY STRIKE</text>
  </g>
</svg>
