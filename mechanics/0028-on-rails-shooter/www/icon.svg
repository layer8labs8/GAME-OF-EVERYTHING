<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="tunnelGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#3b82f6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#050816" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fighterMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="#050816"/>
  <!-- Rail Tunnel Wireframes -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="#1e293b" stroke-width="3"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="#0ea5e9" stroke-width="2" stroke-opacity="0.5"/>
  <circle cx="256" cy="256" r="90" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.7"/>
  <circle cx="256" cy="256" r="40" fill="url(#tunnelGlow)"/>
  <!-- Rail Perspective Lines -->
  <line x1="26" y1="26" x2="216" y2="216" stroke="#0284c7" stroke-width="2" stroke-opacity="0.4"/>
  <line x1="486" y1="26" x2="296" y2="216" stroke="#0284c7" stroke-width="2" stroke-opacity="0.4"/>
  <line x1="26" y1="486" x2="216" y2="296" stroke="#0284c7" stroke-width="2" stroke-opacity="0.4"/>
  <line x1="486" y1="486" x2="296" y2="296" stroke="#0284c7" stroke-width="2" stroke-opacity="0.4"/>
  <!-- Player Starfighter -->
  <polygon points="256,210 220,310 256,290 292,310" fill="url(#fighterMetal)" stroke="#f8fafc" stroke-width="4"/>
  <polygon points="256,230 200,320 256,305 312,320" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <!-- Reticle -->
  <circle cx="256" cy="180" r="20" fill="none" stroke="#f43f5e" stroke-width="3"/>
  <line x1="256" y1="150" x2="256" y2="170" stroke="#f43f5e" stroke-width="3"/>
  <line x1="256" y1="190" x2="256" y2="210" stroke="#f43f5e" stroke-width="3"/>
  <line x1="226" y1="180" x2="246" y2="180" stroke="#f43f5e" stroke-width="3"/>
  <line x1="266" y1="180" x2="286" y2="180" stroke="#f43f5e" stroke-width="3"/>
</svg>
