<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#04060d">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>Vortex Core</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #04060d;
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  canvas {
    display: block;
    margin: 0 auto;
    touch-action: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="logic.js"></script>
<script>
const {
  ARENA_MIN = 30,
  ARENA_MAX = 370,
  MAX_WAVES = 5,
  createState,
  legalActions,
  step,
  isOver,
  score
} = VortexCore;

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const W = 360;
const H = 640;
const ARENA_SIZE = 400;
const VIEW_X = 10;
const VIEW_Y = 68;
const VIEW_S = 340;
const A_SCALE = VIEW_S / ARENA_SIZE;

let scale = 1;
function resize() {
  scale = Math.min(innerWidth / W, innerHeight / H);
  const dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.style.width = W * scale + 'px';
  canvas.style.height = H * scale + 'px';
  canvas.width = Math.round(W * scale * dpr);
  canvas.height = Math.round(H * scale * dpr);
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
}
addEventListener('resize', resize);
resize();

let best = 0;
try { best = +localStorage.getItem('goe-0024-best') || 0; } catch (e) {}

function rrect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function toLogical(e) {
  const rect = canvas.getBoundingClientRect();
  return { x: (e.clientX - rect.left) / scale, y: (e.clientY - rect.top) / scale };
}

function toArena(lx, ly) {
  return { x: (lx - VIEW_X) / A_SCALE, y: (ly - VIEW_Y) / A_SCALE };
}

const AIM_LIST = [
  { key: 'e', angle: 0 },
  { key: 'se', angle: Math.PI / 4 },
  { key: 's', angle: Math.PI / 2 },
  { key: 'sw', angle: (3 * Math.PI) / 4 },
  { key: 'w', angle: Math.PI },
  { key: 'nw', angle: (-3 * Math.PI) / 4 },
  { key: 'n', angle: -Math.PI / 2 },
  { key: 'ne', angle: -Math.PI / 4 }
];

function angleToAimKey(dx, dy) {
  const a = Math.atan2(dy, dx);
  let bestKey = 'n';
  let bestDiff = Infinity;
  for (const item of AIM_LIST) {
    let diff = Math.abs(a - item.angle);
    if (diff > Math.PI) diff = Math.PI * 2 - diff;
    if (diff < bestDiff) {
      bestDiff = diff;
      bestKey = item.key;
    }
  }
  return bestKey;
}

function aimKeyToAngle(key) {
  const found = AIM_LIST.find(x => x.key === key);
  return found ? found.angle : -Math.PI / 2;
}

function closestMoveDir(dx, dy) {
  if (Math.abs(dx) >= Math.abs(dy)) return dx >= 0 ? 'e' : 'w';
  return dy >= 0 ? 's' : 'n';
}

let state = createState(Date.now());
let overAt = 0;
let lastAim = 'n';
let visShip = { x: state.player.x, y: state.player.y, angle: -Math.PI / 2 };
let visEnemies = new Map();
let visProj = new Map();
let particles = [];
let popups = [];
let empWave = null;
let hurtFlash = 0;

function syncInstant() {
  visShip.x = state.player.x;
  visShip.y = state.player.y;
  visEnemies.clear();
  for (const e of state.enemies) visEnemies.set(e.id, { x: e.x, y: e.y, flash: 0 });
  visProj.clear();
  for (const pr of state.projectiles) visProj.set(pr.id, { x: pr.x, y: pr.y });
}
syncInstant();

function restart() {
  state = createState(Date.now());
  overAt = 0;
  lastAim = 'n';
  particles = [];
  popups = [];
  empWave = null;
  hurtFlash = 0;
  moveAcc = 0;
  fireAcc = 0;
  ambientAcc = 0;
  syncInstant();
}

function autoAim8Dir() {
  if (!state.enemies.length) return lastAim;
  const p = state.player;
  let nearest = state.enemies[0];
  let minD = Infinity;
  for (const e of state.enemies) {
    const d = Math.hypot(e.x - p.x, e.y - p.y);
    if (d < minD) { minD = d; nearest = e; }
  }
  return angleToAimKey(nearest.x - p.x, nearest.y - p.y);
}

function spawnBurst(ax, ay, col, count, spd = 95) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = spd * (0.35 + Math.random() * 0.8);
    particles.push({
      x: ax, y: ay,
      vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: 0.3 + Math.random() * 0.2,
      maxLife: 0.45,
      col,
      r: 2 + Math.random() * 2
    });
  }
}

let moveAcc = 0;
let fireAcc = 0;
let ambientAcc = 0;
let arenaAlt = false;

function execAction(act) {
  if (isOver(state)) return false;
  const legal = legalActions(state);
  if (!legal.includes(act)) return false;

  const prevHp = state.player.hp;
  const prevWave = state.wave;
  const oldMap = new Map();
  for (const e of state.enemies) oldMap.set(e.id, { x: e.x, y: e.y, hp: e.hp, type: e.type });

  if (act.startsWith('fire_')) lastAim = act.slice(5);
  if (act === 'bomb') {
    empWave = { x: state.player.x, y: state.player.y, r: 10, life: 0.45 };
  }

  const res = step(state, act);
  ambientAcc = 0;

  const curIds = new Set(state.enemies.map(e => e.id));
  for (const [id, old] of oldMap) {
    if (!curIds.has(id) && state.wave === prevWave) {
      const col = old.type === 'mine' ? '#fb923c' : old.type === 'turret' ? '#22d3ee' : '#f87171';
      spawnBurst(old.x, old.y, col, 14, 115);
      const pts = old.type === 'mine' ? 200 : old.type === 'turret' ? 120 : 60;
      popups.push({ x: old.x, y: old.y - 10, txt: '+' + pts, col: '#38bdf8', life: 0.65 });
    } else if (curIds.has(id)) {
      const cur = state.enemies.find(e => e.id === id);
      if (cur && cur.hp < old.hp) {
        const ve = visEnemies.get(id);
        if (ve) ve.flash = 0.14;
        spawnBurst(cur.x, cur.y, '#38bdf8', 5, 65);
      }
    }
  }

  if (state.wave > prevWave) {
    popups.push({ x: 200, y: 170, txt: 'WAVE ' + state.wave + '!', col: '#4ade80', life: 0.85 });
    syncInstant();
  }
  if (state.player.hp < prevHp) {
    hurtFlash = 0.25;
    spawnBurst(state.player.x, state.player.y, '#f43f5e', 9, 85);
  }

  const sc = score(state);
  if (sc > best) {
    best = sc;
    try { localStorage.setItem('goe-0024-best', best); } catch (e) {}
  }
  if (res.done) overAt = performance.now();
  return true;
}

// Twin-Stick layout
const LEFT_STICK = { cx: 80, cy: 526, r: 58 };
const RIGHT_STICK = { cx: 280, cy: 526, r: 58 };
const BOMB_BTN = { x: 148, y: 492, w: 64, h: 68 };

const pointers = new Map();

function classifyPoint(p) {
  if (p.x >= BOMB_BTN.x && p.x <= BOMB_BTN.x + BOMB_BTN.w && p.y >= BOMB_BTN.y && p.y <= BOMB_BTN.y + BOMB_BTN.h) {
    return { zone: 'bomb' };
  }
  if (Math.hypot(p.x - LEFT_STICK.cx, p.y - LEFT_STICK.cy) <= LEFT_STICK.r + 16) {
    return { zone: 'left', x: p.x, y: p.y };
  }
  if (Math.hypot(p.x - RIGHT_STICK.cx, p.y - RIGHT_STICK.cy) <= RIGHT_STICK.r + 16) {
    return { zone: 'right', x: p.x, y: p.y };
  }
  if (p.x >= VIEW_X && p.x <= VIEW_X + VIEW_S && p.y >= VIEW_Y && p.y <= VIEW_Y + VIEW_S) {
    return { zone: 'arena', a: toArena(p.x, p.y) };
  }
  return { zone: 'none' };
}

canvas.addEventListener('pointerdown', (e) => {
  const p = toLogical(e);
  if (isOver(state)) {
    if (performance.now() - overAt > 350) restart();
    return;
  }
  const info = classifyPoint(p);
  pointers.set(e.pointerId, info);

  if (info.zone === 'bomb') {
    execAction('bomb');
  } else if (info.zone === 'left') {
    const dx = p.x - LEFT_STICK.cx;
    const dy = p.y - LEFT_STICK.cy;
    if (Math.hypot(dx, dy) > 8) {
      execAction('move_' + closestMoveDir(dx, dy));
      moveAcc = 0;
    }
  } else if (info.zone === 'right') {
    const dx = p.x - RIGHT_STICK.cx;
    const dy = p.y - RIGHT_STICK.cy;
    const aim = Math.hypot(dx, dy) > 8 ? angleToAimKey(dx, dy) : autoAim8Dir();
    execAction('fire_' + aim);
    fireAcc = 0;
  } else if (info.zone === 'arena') {
    const a = info.a;
    // Tap on enemy -> 8-way fire immediately
    let tappedEnemy = null;
    for (const en of state.enemies) {
      if (Math.hypot(a.x - en.x, a.y - en.y) <= 30) { tappedEnemy = en; break; }
    }
    if (tappedEnemy) {
      execAction('fire_' + angleToAimKey(tappedEnemy.x - state.player.x, tappedEnemy.y - state.player.y));
    } else {
      const dx = a.x - state.player.x;
      const dy = a.y - state.player.y;
      if (Math.hypot(dx, dy) > 14) execAction('move_' + closestMoveDir(dx, dy));
      else execAction('fire_' + autoAim8Dir());
    }
    moveAcc = 0;
  }
});

canvas.addEventListener('pointermove', (e) => {
  if (!pointers.has(e.pointerId) || isOver(state)) return;
  const p = toLogical(e);
  const prev = pointers.get(e.pointerId);
  if (prev.zone === 'left') {
    pointers.set(e.pointerId, { zone: 'left', x: p.x, y: p.y });
  } else if (prev.zone === 'right') {
    pointers.set(e.pointerId, { zone: 'right', x: p.x, y: p.y });
  } else if (prev.zone === 'arena') {
    const cx = Math.max(VIEW_X, Math.min(VIEW_X + VIEW_S, p.x));
    const cy = Math.max(VIEW_Y, Math.min(VIEW_Y + VIEW_S, p.y));
    pointers.set(e.pointerId, { zone: 'arena', a: toArena(cx, cy) });
  }
});

function clearPtr(e) { pointers.delete(e.pointerId); }
canvas.addEventListener('pointerup', clearPtr);
canvas.addEventListener('pointercancel', clearPtr);
addEventListener('pointerup', clearPtr);
addEventListener('pointercancel', clearPtr);

const keys = {};
addEventListener('keydown', (e) => {
  const k = (e.key || '').toLowerCase();
  if (isOver(state)) {
    if ((k === ' ' || k === 'enter' || k === 'r') && performance.now() - overAt > 350) restart();
    return;
  }
  const was = !!keys[k];
  keys[k] = true;
  if (!was) {
    if (k === 'b' || k === 'shift' || k === 'e') execAction('bomb');
    else if (k === 'w' || k === 'arrowup') { execAction('move_n'); moveAcc = 0; }
    else if (k === 's' || k === 'arrowdown') { execAction('move_s'); moveAcc = 0; }
    else if (k === 'a' || k === 'arrowleft') { execAction('move_w'); moveAcc = 0; }
    else if (k === 'd' || k === 'arrowright') { execAction('move_e'); moveAcc = 0; }
    else {
      const f = getKeyboardFireAim();
      if (f) { execAction('fire_' + f); fireAcc = 0; }
    }
  }
});
addEventListener('keyup', (e) => {
  keys[(e.key || '').toLowerCase()] = false;
});

function getKeyboardFireAim() {
  let fx = 0, fy = 0;
  if (keys['i']) fy -= 1;
  if (keys['k']) fy += 1;
  if (keys['j']) fx -= 1;
  if (keys['l']) fx += 1;
  if (keys['u']) { fx -= 1; fy -= 1; }
  if (keys['o']) { fx += 1; fy -= 1; }
  if (keys['m']) { fx -= 1; fy += 1; }
  if (keys['.']) { fx += 1; fy += 1; }
  if (fx !== 0 || fy !== 0) return angleToAimKey(fx, fy);
  if (keys[' ']) return autoAim8Dir();
  return null;
}

function getMoveStickState() {
  for (const info of pointers.values()) {
    if (info.zone === 'left') {
      const dx = info.x - LEFT_STICK.cx;
      const dy = info.y - LEFT_STICK.cy;
      const dist = Math.hypot(dx, dy);
      const maxD = 34;
      const k = dist > maxD ? maxD / dist : 1;
      return { active: true, kx: dx * k, ky: dy * k, dir: dist > 10 ? closestMoveDir(dx, dy) : null };
    }
  }
  if (keys['w'] || keys['arrowup']) return { active: true, kx: 0, ky: -28, dir: 'n' };
  if (keys['s'] || keys['arrowdown']) return { active: true, kx: 0, ky: 28, dir: 's' };
  if (keys['a'] || keys['arrowleft']) return { active: true, kx: -28, ky: 0, dir: 'w' };
  if (keys['d'] || keys['arrowright']) return { active: true, kx: 28, ky: 0, dir: 'e' };
  return { active: false, kx: 0, ky: 0, dir: null };
}

function getFireStickState() {
  for (const info of pointers.values()) {
    if (info.zone === 'right') {
      const dx = info.x - RIGHT_STICK.cx;
      const dy = info.y - RIGHT_STICK.cy;
      const dist = Math.hypot(dx, dy);
      const maxD = 34;
      const k = dist > maxD ? maxD / dist : 1;
      const aim = dist > 8 ? angleToAimKey(dx, dy) : autoAim8Dir();
      return { active: true, kx: dx * k, ky: dy * k, aim };
    }
  }
  const kbAim = getKeyboardFireAim();
  if (kbAim) {
    const ang = aimKeyToAngle(kbAim);
    return { active: true, kx: Math.cos(ang) * 28, ky: Math.sin(ang) * 28, aim: kbAim };
  }
  return { active: false, kx: 0, ky: 0, aim: null };
}

function getArenaDrag() {
  for (const info of pointers.values()) {
    if (info.zone === 'arena') return info.a;
  }
  return null;
}

function update(dt) {
  if (!isOver(state)) {
    const ms = getMoveStickState();
    const fs = getFireStickState();
    const drag = getArenaDrag();
    const REPEAT = 0.13;

    if (fs.aim) {
      fireAcc += dt;
      while (fireAcc >= REPEAT && !isOver(state)) {
        fireAcc -= REPEAT;
        execAction('fire_' + fs.aim);
      }
    } else {
      fireAcc = 0;
    }

    if (ms.dir) {
      moveAcc += dt;
      while (moveAcc >= REPEAT && !isOver(state)) {
        moveAcc -= REPEAT;
        execAction('move_' + ms.dir);
      }
    } else if (drag) {
      moveAcc += dt;
      while (moveAcc >= REPEAT && !isOver(state)) {
        moveAcc -= REPEAT;
        const p = state.player;
        const dx = drag.x - p.x;
        const dy = drag.y - p.y;
        arenaAlt = !arenaAlt;
        if (Math.hypot(dx, dy) > 16 && (arenaAlt || state.enemies.length === 0)) {
          execAction('move_' + closestMoveDir(dx, dy));
        } else {
          execAction('fire_' + autoAim8Dir());
        }
      }
    } else {
      moveAcc = 0;
    }

    ambientAcc += dt;
    if (ambientAcc >= 0.42 && !isOver(state)) {
      ambientAcc = 0;
      execAction('wait');
    }
  }

  // Smooth 60 FPS visual interpolation
  const k = 1 - Math.exp(-22 * dt);
  visShip.x += (state.player.x - visShip.x) * k;
  visShip.y += (state.player.y - visShip.y) * k;

  const fs = getFireStickState();
  const targetAng = aimKeyToAngle(fs.aim || autoAim8Dir());
  let da = targetAng - visShip.angle;
  while (da > Math.PI) da -= Math.PI * 2;
  while (da < -Math.PI) da += Math.PI * 2;
  visShip.angle += da * k;

  const eIds = new Set();
  for (const e of state.enemies) {
    eIds.add(e.id);
    if (!visEnemies.has(e.id)) visEnemies.set(e.id, { x: e.x, y: e.y, flash: 0 });
    else {
      const ve = visEnemies.get(e.id);
      ve.x += (e.x - ve.x) * k;
      ve.y += (e.y - ve.y) * k;
      if (ve.flash > 0) ve.flash = Math.max(0, ve.flash - dt);
    }
  }
  for (const id of visEnemies.keys()) if (!eIds.has(id)) visEnemies.delete(id);

  const pk = 1 - Math.exp(-28 * dt);
  const pIds = new Set();
  for (const pr of state.projectiles) {
    pIds.add(pr.id);
    if (!visProj.has(pr.id)) visProj.set(pr.id, { x: pr.x - pr.vx * 0.4, y: pr.y - pr.vy * 0.4 });
    else {
      const vp = visProj.get(pr.id);
      vp.x += (pr.x - vp.x) * pk;
      vp.y += (pr.y - vp.y) * pk;
    }
  }
  for (const id of visProj.keys()) if (!pIds.has(id)) visProj.delete(id);

  if (empWave) {
    empWave.r += 680 * dt;
    empWave.life -= dt;
    if (empWave.life <= 0) empWave = null;
  }
  if (hurtFlash > 0) hurtFlash = Math.max(0, hurtFlash - dt);

  for (let i = particles.length - 1; i >= 0; i--) {
    const pt = particles[i];
    pt.x += pt.vx * dt;
    pt.y += pt.vy * dt;
    pt.life -= dt;
    if (pt.life <= 0) particles.splice(i, 1);
  }
  for (let i = popups.length - 1; i >= 0; i--) {
    const pp = popups[i];
    pp.y -= 26 * dt;
    pp.life -= dt;
    if (pp.life <= 0) popups.splice(i, 1);
  }
}

function draw() {
  ctx.fillStyle = '#04060d';
  ctx.fillRect(0, 0, W, H);

  const p = state.player;

  // Top HUD
  ctx.fillStyle = '#091122';
  rrect(10, 8, W - 20, 52, 10);
  ctx.fill();
  ctx.strokeStyle = '#1e3a5f';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  ctx.fillStyle = '#38bdf8';
  ctx.font = 'bold 13px system-ui, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('VORTEX CORE', 20, 26);

  ctx.fillStyle = '#cbd5e1';
  ctx.font = 'bold 11px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(`WAVE ${state.wave}/${MAX_WAVES}`, W / 2 + 8, 26);

  ctx.fillStyle = '#fbbf24';
  ctx.font = 'bold 13px system-ui, sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText(`${score(state)}`, W - 20, 26);

  const shPct = Math.max(0, Math.min(1, p.hp / p.maxHp));
  ctx.fillStyle = '#0f172a';
  rrect(20, 36, 150, 14, 5);
  ctx.fill();
  ctx.fillStyle = shPct > 0.35 ? '#0ea5e9' : '#f43f5e';
  if (shPct > 0) {
    rrect(20, 36, Math.max(10, 150 * shPct), 14, 5);
    ctx.fill();
  }
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 9px system-ui, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(`SHIELD ${p.hp}%`, 26, 46);

  ctx.fillStyle = '#94a3b8';
  ctx.font = '10px system-ui, sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText(`BOMBS ${p.bombs} · BEST ${best}`, W - 20, 46);

  // Arena Viewport
  ctx.save();
  ctx.translate(VIEW_X, VIEW_Y);
  ctx.scale(A_SCALE, A_SCALE);

  ctx.fillStyle = '#060a16';
  ctx.fillRect(0, 0, ARENA_SIZE, ARENA_SIZE);

  // Subtle Vortex Core ring & Cyber Grid
  ctx.strokeStyle = 'rgba(56, 189, 248, 0.08)';
  ctx.lineWidth = 1;
  for (let g = 60; g < ARENA_MAX; g += 40) {
    ctx.beginPath(); ctx.moveTo(g, ARENA_MIN); ctx.lineTo(g, ARENA_MAX); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(ARENA_MIN, g); ctx.lineTo(ARENA_MAX, g); ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(56, 189, 248, 0.14)';
  ctx.beginPath();
  ctx.arc(200, 200, 58 + Math.sin(performance.now() * 0.004) * 6, 0, Math.PI * 2);
  ctx.stroke();

  ctx.strokeStyle = '#0284c7';
  ctx.lineWidth = 3;
  ctx.strokeRect(ARENA_MIN, ARENA_MIN, ARENA_MAX - ARENA_MIN, ARENA_MAX - ARENA_MIN);

  const drag = getArenaDrag();
  if (drag && !isOver(state)) {
    ctx.strokeStyle = 'rgba(56, 189, 248, 0.45)';
    ctx.lineWidth = 2;
    ctx.setLineDash([5, 5]);
    ctx.beginPath();
    ctx.moveTo(visShip.x, visShip.y);
    ctx.lineTo(drag.x, drag.y);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.beginPath();
    ctx.arc(drag.x, drag.y, 12, 0, Math.PI * 2);
    ctx.stroke();
  }

  // EMP Shockwave
  if (empWave) {
    ctx.strokeStyle = `rgba(56, 189, 248, ${empWave.life * 2})`;
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.arc(empWave.x, empWave.y, empWave.r, 0, Math.PI * 2);
    ctx.stroke();
  }

  // Projectiles
  for (const pr of state.projectiles) {
    const vp = visProj.get(pr.id) || pr;
    ctx.save();
    if (pr.owner === 'player') {
      ctx.strokeStyle = 'rgba(56, 189, 248, 0.5)';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(vp.x, vp.y);
      ctx.lineTo(vp.x - pr.vx * 0.35, vp.y - pr.vy * 0.35);
      ctx.stroke();
      ctx.fillStyle = '#e0f2fe';
      ctx.beginPath();
      ctx.arc(vp.x, vp.y, 4, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.fillStyle = '#f43f5e';
      ctx.beginPath();
      ctx.arc(vp.x, vp.y, 5, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  // Enemies
  const spin = performance.now() * 0.004;
  for (const e of state.enemies) {
    const ve = visEnemies.get(e.id) || e;
    const flash = ve.flash && ve.flash > 0;
    ctx.save();
    ctx.translate(ve.x, ve.y);

    if (e.type === 'seeker') {
      const ang = Math.atan2(visShip.y - ve.y, visShip.x - ve.x) + Math.PI / 2;
      ctx.rotate(ang);
      ctx.fillStyle = flash ? '#ffffff' : '#ef4444';
      ctx.beginPath();
      ctx.moveTo(0, -11);
      ctx.lineTo(9, 9);
      ctx.lineTo(-9, 9);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = '#fca5a5';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    } else if (e.type === 'turret') {
      ctx.fillStyle = flash ? '#ffffff' : '#0891b2';
      ctx.beginPath();
      ctx.arc(0, 0, 12, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#67e8f9';
      ctx.lineWidth = 2;
      ctx.stroke();
    } else {
      ctx.rotate(spin);
      ctx.fillStyle = flash ? '#ffffff' : '#f97316';
      ctx.beginPath();
      ctx.arc(0, 0, 15, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#fdba74';
      ctx.lineWidth = 3;
      ctx.stroke();
    }
    ctx.restore();
  }

  // Player Ship
  ctx.save();
  ctx.translate(visShip.x, visShip.y);
  ctx.strokeStyle = 'rgba(56, 189, 248, 0.38)';
  ctx.lineWidth = 1.8;
  ctx.beginPath();
  ctx.arc(0, 0, 19, 0, Math.PI * 2);
  ctx.stroke();

  ctx.rotate(visShip.angle + Math.PI / 2);
  ctx.fillStyle = '#38bdf8';
  ctx.beginPath();
  ctx.moveTo(0, -15);
  ctx.lineTo(11, 11);
  ctx.lineTo(0, 6);
  ctx.lineTo(-11, 11);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.restore();

  // Particles & Popups
  for (const pt of particles) {
    ctx.globalAlpha = Math.max(0, pt.life / pt.maxLife);
    ctx.fillStyle = pt.col;
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, pt.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  for (const pp of popups) {
    ctx.globalAlpha = Math.min(1, pp.life * 2);
    ctx.fillStyle = pp.col;
    ctx.font = 'bold 13px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(pp.txt, pp.x, pp.y);
  }
  ctx.globalAlpha = 1;

  if (hurtFlash > 0) {
    ctx.fillStyle = `rgba(244, 63, 94, ${hurtFlash * 0.55})`;
    ctx.fillRect(0, 0, ARENA_SIZE, ARENA_SIZE);
  }

  ctx.restore();

  // Twin-Stick Control Deck
  const ms = getMoveStickState();
  const fs = getFireStickState();

  // Left Move Stick
  ctx.fillStyle = '#091122';
  ctx.beginPath();
  ctx.arc(LEFT_STICK.cx, LEFT_STICK.cy, LEFT_STICK.r, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = ms.active ? '#38bdf8' : '#1e3a5f';
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.fillStyle = '#64748b';
  ctx.font = 'bold 10px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('MOVE (WASD)', LEFT_STICK.cx, LEFT_STICK.cy - LEFT_STICK.r - 8);

  ctx.fillStyle = ms.active ? '#38bdf8' : '#1e293b';
  ctx.beginPath();
  ctx.arc(LEFT_STICK.cx + ms.kx, LEFT_STICK.cy + ms.ky, 22, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#7dd3fc';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Center EMP Bomb Button
  const hasBomb = p.bombs > 0;
  ctx.fillStyle = hasBomb ? '#881337' : '#1e293b';
  rrect(BOMB_BTN.x, BOMB_BTN.y, BOMB_BTN.w, BOMB_BTN.h, 12);
  ctx.fill();
  ctx.strokeStyle = hasBomb ? '#fb7185' : '#334155';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.fillStyle = hasBomb ? '#ffffff' : '#64748b';
  ctx.font = 'bold 12px system-ui, sans-serif';
  ctx.fillText('⚡ EMP', BOMB_BTN.x + BOMB_BTN.w / 2, BOMB_BTN.y + 28);
  ctx.font = 'bold 15px system-ui, sans-serif';
  ctx.fillText(`x${p.bombs}`, BOMB_BTN.x + BOMB_BTN.w / 2, BOMB_BTN.y + 49);

  // Right 8-Way Fire Stick
  ctx.fillStyle = '#091122';
  ctx.beginPath();
  ctx.arc(RIGHT_STICK.cx, RIGHT_STICK.cy, RIGHT_STICK.r, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = fs.active ? '#f43f5e' : '#0284c7';
  ctx.lineWidth = 2;
  ctx.stroke();

  for (const item of AIM_LIST) {
    const rx = RIGHT_STICK.cx + Math.cos(item.angle) * 44;
    const ry = RIGHT_STICK.cy + Math.sin(item.angle) * 44;
    ctx.fillStyle = fs.aim === item.key ? '#f43f5e' : '#334155';
    ctx.beginPath();
    ctx.arc(rx, ry, 3, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.fillStyle = '#64748b';
  ctx.font = 'bold 10px system-ui, sans-serif';
  ctx.fillText('AIM & FIRE (IJKL/SPC)', RIGHT_STICK.cx, RIGHT_STICK.cy - RIGHT_STICK.r - 8);

  ctx.fillStyle = fs.active ? '#f43f5e' : '#0c4a6e';
  ctx.beginPath();
  ctx.arc(RIGHT_STICK.cx + fs.kx, RIGHT_STICK.cy + fs.ky, 22, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = fs.active ? '#fda4af' : '#38bdf8';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  ctx.fillStyle = '#64748b';
  ctx.font = '10px system-ui, sans-serif';
  ctx.fillText('Dual thumbsticks or drag directly in arena · [B/Shift] EMP Bomb', W / 2, H - 10);

  if (isOver(state)) {
    ctx.fillStyle = 'rgba(4, 6, 13, 0.9)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.fillStyle = state.won ? '#38bdf8' : '#f43f5e';
    ctx.font = 'bold 28px system-ui, sans-serif';
    ctx.fillText(state.won ? 'SECTOR LIBERATED!' : 'CORE DESTABILIZED', W / 2, H / 2 - 48);

    ctx.fillStyle = '#e0f2fe';
    ctx.font = '16px system-ui, sans-serif';
    ctx.fillText(`Wave ${state.wave}/${MAX_WAVES} · Hostiles Cleared: ${state.kills}`, W / 2, H / 2 - 12);

    ctx.fillStyle = '#fbbf24';
    ctx.font = 'bold 24px system-ui, sans-serif';
    ctx.fillText(`Final Score: ${score(state)}`, W / 2, H / 2 + 28);

    ctx.fillStyle = '#38bdf8';
    ctx.font = 'bold 15px system-ui, sans-serif';
    ctx.fillText('Tap anywhere or press Space to relaunch', W / 2, H / 2 + 74);
  }
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

const inApk = window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform();
if (!inApk && 'serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
