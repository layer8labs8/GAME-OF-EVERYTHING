<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Wilderness Craft - Open World Survival</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #04130d;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
      padding: 8px;
    }
    header {
      width: 100%;
      max-width: 640px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 12px;
      background: #092317;
      border: 1px solid #14532d;
      border-radius: 8px;
      margin-bottom: 6px;
    }
    h1 {
      font-size: 1rem;
      font-weight: 700;
      color: #4ade80;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .badge {
      font-size: 0.72rem;
      padding: 2px 8px;
      border-radius: 4px;
      background: #14532d;
      color: #86efac;
      font-weight: 600;
    }
    #game-container {
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    canvas {
      width: 100%;
      height: auto;
      aspect-ratio: 4/3;
      background: #061a12;
      border: 1px solid #166534;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
      image-rendering: pixelated;
    }
    .vitals-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      width: 100%;
    }
    .vital-card {
      background: #092317;
      border: 1px solid #14532d;
      padding: 4px 6px;
      border-radius: 6px;
      text-align: center;
    }
    .vital-title {
      font-size: 0.65rem;
      color: #86efac;
      text-transform: uppercase;
    }
    .vital-val {
      font-size: 0.95rem;
      font-weight: 700;
      margin-top: 1px;
    }
    .resources-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      background: #071c13;
      border: 1px solid #134e4a;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.72rem;
      color: #cbd5e1;
      justify-content: space-around;
    }
    .res-pill {
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }
    .log-box {
      background: #081d14;
      border: 1px solid #15803d;
      border-left: 4px solid #22c55e;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 0.78rem;
      color: #e2e8f0;
      min-height: 40px;
      display: flex;
      align-items: center;
    }
    .actions-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 6px;
      margin-top: 2px;
    }
    .btn {
      background: #0f3925;
      border: 1px solid #15803d;
      color: #e2e8f0;
      padding: 8px 6px;
      font-family: inherit;
      font-size: 0.72rem;
      border-radius: 6px;
      cursor: pointer;
      text-transform: uppercase;
      font-weight: 600;
      transition: all 0.15s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .btn:hover {
      background: #14532d;
      border-color: #4ade80;
      color: #fff;
    }
    .btn:active {
      transform: scale(0.97);
    }
    .btn-craft {
      background: #1e3a5f;
      border-color: #2563eb;
      color: #93c5fd;
    }
    .btn-craft:hover {
      background: #1d4ed8;
      border-color: #60a5fa;
    }
    .btn-gold {
      background: #78350f;
      border-color: #d97706;
      color: #fde68a;
    }
    .btn-gold:hover {
      background: #b45309;
      border-color: #f59e0b;
    }
    .footer-bar {
      display: flex;
      justify-content: space-between;
      margin-top: 6px;
      width: 100%;
    }
  </style>
</head>
<body>
  <header>
    <h1>🌲 Wilderness Craft</h1>
    <div>
      <span id="turn-badge" class="badge">DAY 0 / 120</span>
      <span id="score-badge" class="badge" style="background:#854d0e; color:#fef08a;">0 PTS</span>
    </div>
  </header>

  <div id="game-container">
    <canvas id="gameCanvas" width="640" height="480"></canvas>

    <div class="vitals-grid">
      <div class="vital-card">
        <div class="vital-title">Health</div>
        <div id="vital-health" class="vital-val" style="color: #4ade80;">100%</div>
      </div>
      <div class="vital-card">
        <div class="vital-title">Hunger</div>
        <div id="vital-hunger" class="vital-val" style="color: #fb923c;">90%</div>
      </div>
      <div class="vital-card">
        <div class="vital-title">Thirst</div>
        <div id="vital-thirst" class="vital-val" style="color: #38bdf8;">90%</div>
      </div>
      <div class="vital-card">
        <div class="vital-title">Stamina</div>
        <div id="vital-stamina" class="vital-val" style="color: #facc15;">100%</div>
      </div>
    </div>

    <div id="resources-panel" class="resources-bar">
      <!-- Injected dynamically -->
    </div>

    <div id="game-log" class="log-box">
      Washed ashore on Coastal Beach. Gather supplies and build shelter before dark.
    </div>

    <div id="actions-panel" class="actions-grid">
      <!-- Injected dynamically -->
    </div>

    <div class="footer-bar">
      <div id="structures-summary" style="font-size:0.7rem; color:#86efac;">Camp: Open Wilderness</div>
      <button id="bot-toggle-btn" class="btn" style="padding: 4px 10px; font-size: 0.68rem;" onclick="window.toggleBot()">BOT: OFF</button>
    </div>
  </div>

  <script src="logic.js"></script>
  <script>
    let state = createState(Date.now ? Date.now() : 12345);
    let botRunning = false;
    let botInterval = null;

    // Web Audio Synthesizer for Wilderness FX
    let audioCtx = null;
    function playSfx(type) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const t = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'chop') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(180, t);
          osc.frequency.exponentialRampToValueAtTime(40, t + 0.1);
          gain.gain.setValueAtTime(0.4, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + 0.12);
          osc.start(t);
          osc.stop(t + 0.12);
        } else if (type === 'mine') {
          osc.type = 'square';
          osc.frequency.setValueAtTime(420, t);
          osc.frequency.exponentialRampToValueAtTime(120, t + 0.08);
          gain.gain.setValueAtTime(0.3, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
          osc.start(t);
          osc.stop(t + 0.1);
        } else if (type === 'craft') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(320, t);
          osc.frequency.setValueAtTime(480, t + 0.1);
          osc.frequency.setValueAtTime(640, t + 0.2);
          gain.gain.setValueAtTime(0.2, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + 0.35);
          osc.start(t);
          osc.stop(t + 0.35);
        } else if (type === 'drink') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(500, t);
          osc.frequency.exponentialRampToValueAtTime(300, t + 0.15);
          gain.gain.setValueAtTime(0.25, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + 0.2);
          osc.start(t);
          osc.stop(t + 0.2);
        }
      } catch (e) {}
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    function render() {
      // Vitals & Status
      document.getElementById('turn-badge').textContent = 'CYCLE ' + state.turns + ' / ' + state.maxTurns;
      document.getElementById('score-badge').textContent = score(state) + ' PTS';

      const hEl = document.getElementById('vital-health');
      hEl.textContent = state.health + '%';
      hEl.style.color = state.health > 60 ? '#4ade80' : (state.health > 25 ? '#fbbf24' : '#ef4444');

      const hungEl = document.getElementById('vital-hunger');
      hungEl.textContent = state.hunger + '%';
      hungEl.style.color = state.hunger > 50 ? '#fb923c' : '#ef4444';

      const tEl = document.getElementById('vital-thirst');
      tEl.textContent = state.thirst + '%';
      tEl.style.color = state.thirst > 50 ? '#38bdf8' : '#ef4444';

      const stEl = document.getElementById('vital-stamina');
      stEl.textContent = state.stamina + '%';

      document.getElementById('game-log').textContent = state.gameMessage;

      // Resources bar
      const resPanel = document.getElementById('resources-panel');
      resPanel.innerHTML = `
        <span class="res-pill">🪵 Wood: <b>${state.wood}</b></span>
        <span class="res-pill">🪨 Stone: <b>${state.stone}</b></span>
        <span class="res-pill">🌾 Fiber: <b>${state.fiber}</b></span>
        <span class="res-pill">⛏️ Flint: <b>${state.flint}</b></span>
        <span class="res-pill">⛓️ Ore: <b>${state.ironOre}</b></span>
        <span class="res-pill">🔩 Ingots: <b>${state.ironIngots}</b></span>
        <span class="res-pill">🥩 Meat: <b>${state.rawMeat}</b></span>
        <span class="res-pill">🍖 Rations: <b>${state.cookedRations}</b></span>
        <span class="res-pill">💧 Water: <b>${state.purifiedWater}</b></span>
      `;

      let structuresList = [];
      if (state.hasCampfire) structuresList.push('Campfire');
      if (state.hasWorkbench) structuresList.push('Workbench');
      if (state.hasShelter) structuresList.push('Shelter');
      if (state.hasSmelter) structuresList.push('Smelter');
      if (state.hasIronTools) structuresList.push('Iron Tools');
      if (state.hasSignalBeacon) structuresList.push('Signal Beacon');

      document.getElementById('structures-summary').textContent =
        'Structures: [' + (structuresList.length ? structuresList.join(', ') : 'None') + ']';

      // Canvas Rendering
      const w = canvas.width;
      const h = canvas.height;

      // Sky & Horizon
      const skyGrad = ctx.createLinearGradient(0, 0, 0, h * 0.6);
      const biomeColors = [
        ['#0ea5e9', '#38bdf8'], // Coast
        ['#064e3b', '#047857'], // Forest
        ['#334155', '#64748b'], // Mountain
        ['#581c87', '#9333ea']  // Ancient Ruins
      ];
      const curCol = biomeColors[state.biome] || biomeColors[0];
      skyGrad.addColorStop(0, curCol[0]);
      skyGrad.addColorStop(1, curCol[1]);
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, w, h * 0.6);

      // Mountains in background
      ctx.fillStyle = '#062c20';
      ctx.beginPath();
      ctx.moveTo(0, h * 0.6);
      ctx.lineTo(w * 0.25, h * 0.35);
      ctx.lineTo(w * 0.5, h * 0.6);
      ctx.lineTo(w * 0.75, h * 0.3);
      ctx.lineTo(w, h * 0.6);
      ctx.fill();

      // Terrain Ground
      const groundGrad = ctx.createLinearGradient(0, h * 0.6, 0, h);
      groundGrad.addColorStop(0, '#14532d');
      groundGrad.addColorStop(1, '#052e16');
      ctx.fillStyle = groundGrad;
      ctx.fillRect(0, h * 0.6, w, h * 0.4);

      // Shoreline water in Coastal biome
      if (state.biome === 0) {
        ctx.fillStyle = 'rgba(14, 165, 233, 0.45)';
        ctx.fillRect(0, h * 0.85, w, h * 0.15);
      }

      // Biome Badge on Canvas
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 16px sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText('BIOME ' + state.biome + ': ' + BIOME_NAMES[state.biome].toUpperCase(), 16, 28);

      // Draw Campfire
      if (state.hasCampfire) {
        ctx.fillStyle = '#78350f';
        ctx.fillRect(w * 0.4 - 15, h * 0.75, 30, 8);
        ctx.fillStyle = '#f59e0b';
        ctx.beginPath();
        ctx.arc(w * 0.4, h * 0.73, 10, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fef08a';
        ctx.beginPath();
        ctx.arc(w * 0.4, h * 0.73, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#cbd5e1';
        ctx.font = '10px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('Campfire', w * 0.4, h * 0.8);
      }

      // Draw Workbench
      if (state.hasWorkbench) {
        ctx.fillStyle = '#92400e';
        ctx.fillRect(w * 0.25 - 20, h * 0.72, 40, 16);
        ctx.fillStyle = '#b45309';
        ctx.fillRect(w * 0.25 - 16, h * 0.74, 32, 10);
        ctx.fillStyle = '#cbd5e1';
        ctx.font = '10px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('Workbench', w * 0.25, h * 0.8);
      }

      // Draw Shelter
      if (state.hasShelter) {
        ctx.fillStyle = '#854d0e';
        ctx.beginPath();
        ctx.moveTo(w * 0.75, h * 0.65);
        ctx.lineTo(w * 0.75 - 35, h * 0.78);
        ctx.lineTo(w * 0.75 + 35, h * 0.78);
        ctx.fill();
        ctx.fillStyle = '#cbd5e1';
        ctx.font = '10px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('Shelter', w * 0.75, h * 0.82);
      }

      // Draw Smelter
      if (state.hasSmelter) {
        ctx.fillStyle = '#475569';
        ctx.fillRect(w * 0.6 - 15, h * 0.7, 30, 24);
        ctx.fillStyle = '#ef4444';
        ctx.fillRect(w * 0.6 - 6, h * 0.78, 12, 10);
        ctx.fillStyle = '#cbd5e1';
        ctx.font = '10px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('Smelter', w * 0.6, h * 0.84);
      }

      // Draw Signal Beacon
      if (state.hasSignalBeacon) {
        ctx.strokeStyle = '#facc15';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(w * 0.85, h * 0.78);
        ctx.lineTo(w * 0.85, h * 0.5);
        ctx.stroke();
        ctx.fillStyle = '#ef4444';
        ctx.beginPath();
        ctx.arc(w * 0.85, h * 0.5, 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fde047';
        ctx.font = 'bold 11px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('BEACON READY', w * 0.85, h * 0.46);
      }

      // Game Over Overlay
      if (isOver(state)) {
        ctx.fillStyle = state.victory ? 'rgba(6, 78, 59, 0.88)' : 'rgba(69, 10, 10, 0.9)';
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 24px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(state.victory ? 'ISLAND EXTRACTION COMPLETE!' : 'SURVIVAL FAILURE - FALLEN', w / 2, h / 2 - 20);
        ctx.font = '14px sans-serif';
        ctx.fillText('Final Survival Score: ' + score(state), w / 2, h / 2 + 15);
      }

      updateActions();
    }

    function updateActions() {
      const panel = document.getElementById('actions-panel');
      if (isOver(state)) {
        panel.innerHTML = '<button class="btn btn-gold" onclick="window.restartGame()">NEW SURVIVAL JOURNEY</button>';
        return;
      }

      const actions = legalActions(state);
      let html = '';

      for (const act of actions) {
        let cls = 'btn';
        let label = act;
        let sub = '';

        if (act === 'action:gather_fiber_and_flint') {
          label = '🌾 Gather Beach Materials';
          sub = '+Fiber, +Flint (0 Sta)';
        } else if (act === 'action:chop_trees') {
          label = '🪓 Chop Timber';
          sub = '+Wood (-15 Sta)';
        } else if (act === 'action:mine_rock_and_ore') {
          label = '⛏️ Mine Rock & Ore';
          sub = '+Stone/Ore (-20 Sta)';
        } else if (act === 'action:hunt_wildlife') {
          label = '🏹 Hunt Wildlife';
          sub = '+Meat (-20 Sta)';
        } else if (act === 'action:drink_water') {
          label = '💧 Drink Fresh Water';
          sub = '+45 Thirst, +20 Sta';
        } else if (act === 'action:eat_cooked_ration') {
          label = '🍖 Eat Cooked Ration';
          sub = '+45 Hunger, +20 HP';
        } else if (act === 'action:cook_rations') {
          label = '🍳 Cook Meat Skewers';
          sub = 'Campfire Cooking';
        } else if (act === 'action:purify_water') {
          label = '🔥 Boil Fresh Water';
          sub = 'Campfire (+2 Water)';
        } else if (act === 'action:craft_campfire') {
          cls += ' btn-craft';
          label = '🔥 Craft Campfire';
          sub = '4 Wood, 3 Stone';
        } else if (act === 'action:craft_workbench') {
          cls += ' btn-craft';
          label = '🔨 Craft Workbench';
          sub = '8 Wood, 2 Flint';
        } else if (act === 'action:craft_shelter') {
          cls += ' btn-craft';
          label = '⛺ Build Shelter';
          sub = '15 Wood, 8 Fiber';
        } else if (act === 'action:craft_smelter') {
          cls += ' btn-craft';
          label = '🏭 Build Blast Smelter';
          sub = '14 Stone, 10 Wood';
        } else if (act === 'action:smelt_iron') {
          cls += ' btn-craft';
          label = '🔩 Smelt Refined Iron';
          sub = '2 Ore, 2 Wood';
        } else if (act === 'action:upgrade_tools_to_iron') {
          cls += ' btn-gold';
          label = '⚔️ Forge Iron Tools';
          sub = '4 Ingots (2x Harvest)';
        } else if (act === 'action:craft_signal_beacon') {
          cls += ' btn-gold';
          label = '📡 Build Rescue Beacon';
          sub = 'Ancient Ruins';
        } else if (act === 'action:rest_at_shelter') {
          label = '💤 Rest & Sleep';
          sub = state.hasShelter ? '+60 Sta, +15 HP' : '+30 Sta, +5 HP';
        } else if (act.startsWith('action:travel_to_biome:')) {
          const b = parseInt(act.split(':')[2], 10);
          label = '🧭 Travel to ' + BIOME_NAMES[b];
          sub = '-20 Stamina';
        } else if (act === 'action:escape_wilderness') {
          cls += ' btn-gold';
          label = '🚀 Trigger Rescue Extraction!';
          sub = 'Victory';
        }

        html += '<button class="' + cls + '" onclick="window.triggerAction(\'' + act + '\')"><span>' + label + '</span>' + (sub ? '<span style="font-size:0.62rem;opacity:0.8;">' + sub + '</span>' : '') + '</button>';
      }

      panel.innerHTML = html;
    }

    window.triggerAction = function(act) {
      if (isOver(state)) return;
      if (act.includes('chop')) playSfx('chop');
      else if (act.includes('mine')) playSfx('mine');
      else if (act.includes('craft') || act.includes('upgrade')) playSfx('craft');
      else if (act.includes('drink')) playSfx('drink');

      step(state, act);
      render();
    };

    window.restartGame = function() {
      state = createState(Date.now ? Date.now() : 12345);
      render();
    };

    window.toggleBot = function() {
      botRunning = !botRunning;
      document.getElementById('bot-toggle-btn').textContent = botRunning ? 'BOT: ON' : 'BOT: OFF';
      document.getElementById('bot-toggle-btn').style.background = botRunning ? '#15803d' : '#0f3925';

      if (botRunning) {
        botInterval = setInterval(() => {
          if (isOver(state)) {
            state = createState(Date.now ? Date.now() : 9999);
            render();
            return;
          }
          const acts = legalActions(state);
          if (acts.length > 0) {
            let choice = acts[0];
            if (acts.includes('action:escape_wilderness')) choice = 'action:escape_wilderness';
            else if (acts.includes('action:craft_signal_beacon')) choice = 'action:craft_signal_beacon';
            else if (acts.includes('action:upgrade_tools_to_iron')) choice = 'action:upgrade_tools_to_iron';
            else if (acts.includes('action:drink_water') && state.thirst < 60) choice = 'action:drink_water';
            else if (acts.includes('action:eat_cooked_ration') && state.hunger < 60) choice = 'action:eat_cooked_ration';
            else if (acts.includes('action:craft_shelter')) choice = 'action:craft_shelter';
            else if (acts.includes('action:craft_workbench')) choice = 'action:craft_workbench';
            else if (acts.includes('action:craft_campfire')) choice = 'action:craft_campfire';
            else if (acts.includes('action:rest_at_shelter') && state.stamina < 30) choice = 'action:rest_at_shelter';
            else if (acts.includes('action:chop_trees') && state.wood < 20) choice = 'action:chop_trees';
            else if (acts.includes('action:mine_rock_and_ore')) choice = 'action:mine_rock_and_ore';
            window.triggerAction(choice);
          }
        }, 350);
      } else {
        clearInterval(botInterval);
      }
    };

    render();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
