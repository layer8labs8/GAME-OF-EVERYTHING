<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <rect x="32" y="32" width="448" height="448" rx="80" fill="none" stroke="url(#gold)" stroke-width="6" opacity="0.4"/>
  <g filter="url(#shadow)" fill="url(#gold)">
    <!-- Crown -->
    <path d="M120 340 h272 l24 -180 l-90 70 l-70 -110 l-70 110 l-90 -70 z"/>
    <!-- Gems -->
    <circle cx="256" cy="380" r="14" fill="#38bdf8"/>
    <circle cx="196" cy="380" r="10" fill="#a855f7"/>
    <circle cx="316" cy="380" r="10" fill="#a855f7"/>
  </g>
</svg>
