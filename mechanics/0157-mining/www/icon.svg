<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="earthbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#292524" />
    </linearGradient>
    <linearGradient id="drill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
    <linearGradient id="diamond" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#earthbg)" />
  <!-- Strata layers -->
  <line x1="60" y1="140" x2="452" y2="140" stroke="#78350f" stroke-width="8" stroke-dasharray="15 10" />
  <line x1="60" y1="240" x2="452" y2="240" stroke="#451a03" stroke-width="8" stroke-dasharray="25 15" />
  <line x1="60" y1="360" x2="452" y2="360" stroke="#b91c1c" stroke-width="8" stroke-dasharray="35 15" />
  <!-- Rotary Drill Cone Bit -->
  <polygon points="256,430 190,170 322,170" fill="url(#drill)" stroke="#ea580c" stroke-width="6" />
  <!-- Drill spiral flutes -->
  <path d="M 200 200 Q 256 220 312 200" stroke="#7c2d12" stroke-width="6" fill="none" />
  <path d="M 215 260 Q 256 280 297 260" stroke="#7c2d12" stroke-width="6" fill="none" />
  <path d="M 230 320 Q 256 340 282 320" stroke="#7c2d12" stroke-width="6" fill="none" />
  <path d="M 245 380 Q 256 395 267 380" stroke="#7c2d12" stroke-width="6" fill="none" />
  <!-- Mining Derrick mount -->
  <rect x="226" y="80" width="60" height="90" fill="#64748b" stroke="#94a3b8" stroke-width="4" />
  <!-- Glowing Diamond at tip -->
  <polygon points="256,430 270,455 256,480 242,455" fill="url(#diamond)" stroke="#e0f2fe" stroke-width="3" />
</svg>
