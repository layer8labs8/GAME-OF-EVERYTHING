<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#f0fdf4" />
    </linearGradient>
    <linearGradient id="hillGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#skyGrad)" />
  <!-- Mountain Incline -->
  <path d="M 0 450 Q 180 430 280 320 T 512 180 L 512 512 L 0 512 Z" fill="url(#hillGrad)" />
  <path d="M 0 450 Q 180 430 280 320 T 512 180" fill="none" stroke="#854d0e" stroke-width="12" />
  <!-- Red 4x4 Hill Climber Jeep -->
  <g transform="translate(230, 260) rotate(-28)">
    <!-- Chassis Body -->
    <rect x="-60" y="-30" width="120" height="40" rx="8" fill="#ef4444" stroke="#991b1b" stroke-width="4" />
    <!-- Roll Cage / Cabin -->
    <path d="M -40 -30 L -15 -65 L 35 -65 L 45 -30 Z" fill="#b91c1c" stroke="#fca5a5" stroke-width="4" />
    <!-- Driver helmet -->
    <circle cx="10" cy="-45" r="12" fill="#fbbf24" stroke="#b45309" stroke-width="2" />
    <!-- Huge Off-Road Big Tires -->
    <circle cx="-42" cy="18" r="26" fill="#18181b" stroke="#71717a" stroke-width="6" />
    <circle cx="-42" cy="18" r="10" fill="#e4e4e7" />
    <circle cx="42" cy="18" r="26" fill="#18181b" stroke="#71717a" stroke-width="6" />
    <circle cx="42" cy="18" r="10" fill="#e4e4e7" />
  </g>
  <!-- Fuel Canister Icon in Sky -->
  <rect x="390" y="70" width="36" height="44" rx="4" fill="#dc2626" stroke="#fecaca" stroke-width="3" />
  <rect x="402" y="58" width="12" height="12" fill="#ef4444" />
  <!-- Gold Coin in Sky -->
  <circle cx="340" cy="90" r="18" fill="#eab308" stroke="#ca8a04" stroke-width="4" />
</svg>
