<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Crime Scene Reconstruction - Forensic Investigation</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0284c7">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #030712;
      color: #f0f9ff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 8px;
      overflow-x: hidden;
    }
    header {
      width: 100%;
      max-width: 480px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      padding: 6px 12px;
      background: #082f49;
      border-radius: 8px;
      border: 1px solid #0284c7;
    }
    h1 {
      font-size: 0.95rem;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 6px;
      letter-spacing: 0.5px;
    }
    .hud {
      width: 100%;
      max-width: 480px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
      margin-bottom: 6px;
    }
    .hud-box {
      background: #0f172a;
      border: 1px solid #0369a1;
      border-radius: 6px;
      padding: 4px 6px;
      text-align: center;
      font-size: 0.72rem;
    }
    .hud-label {
      color: #7dd3fc;
      font-size: 0.62rem;
      text-transform: uppercase;
      margin-bottom: 2px;
    }
    .hud-val {
      font-weight: bold;
      color: #ffffff;
      font-size: 0.8rem;
    }
    .val-sta { color: #38bdf8; }
    .val-ev { color: #facc15; }
    .val-slots { color: #a78bfa; }
    .val-sc { color: #4ade80; }

    #game-container {
      position: relative;
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    canvas {
      width: 100%;
      max-width: 460px;
      aspect-ratio: 16 / 7;
      background: #020617;
      border: 2px solid #0284c7;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(2, 132, 199, 0.25);
      touch-action: none;
    }

    .timeline-board {
      width: 100%;
      max-width: 460px;
      background: #0c1c33;
      border: 1px solid #0284c7;
      border-radius: 8px;
      margin-top: 6px;
      padding: 8px 10px;
      box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5);
    }
    .timeline-header {
      font-size: 0.75rem;
      font-weight: bold;
      color: #38bdf8;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }
    .timeline-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 4px;
    }
    .phase-slot {
      background: #020617;
      border: 1px dashed #0369a1;
      border-radius: 4px;
      padding: 4px 6px;
      font-size: 0.68rem;
      line-height: 1.3;
    }
    .phase-slot-filled {
      border-style: solid;
      border-color: #38bdf8;
      background: #082f49;
    }
    .phase-num {
      color: #facc15;
      font-weight: bold;
    }

    .log-box {
      width: 100%;
      max-width: 460px;
      background: #020617;
      border: 1px solid #1e293b;
      border-radius: 6px;
      margin-top: 6px;
      padding: 6px 8px;
      height: 85px;
      overflow-y: auto;
      font-family: "Courier New", Courier, monospace;
      font-size: 0.72rem;
      color: #e0f2fe;
    }
    .log-line { margin-bottom: 2px; }
    .log-alert { color: #f43f5e; font-weight: bold; }
    .log-ev { color: #facc15; font-weight: bold; }
    .log-win { color: #4ade80; font-weight: bold; }

    .actions-grid {
      width: 100%;
      max-width: 460px;
      margin-top: 6px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 5px;
    }
    .btn-act {
      background: #0f172a;
      color: #e2e8f0;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 8px 6px;
      font-size: 0.72rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.15s ease;
      text-align: center;
    }
    .btn-act:hover {
      background: #1e293b;
      border-color: #64748b;
    }
    .btn-act:active {
      transform: scale(0.97);
    }
    .btn-scan {
      background: #082f49;
      border-color: #0284c7;
      color: #e0f2fe;
    }
    .btn-scan:hover {
      background: #0369a1;
      border-color: #38bdf8;
    }
    .btn-assign {
      background: #3b0764;
      border-color: #9333ea;
      color: #f3e8ff;
    }
    .btn-assign:hover {
      background: #581c87;
      border-color: #c084fc;
    }
    .btn-finalize {
      background: #14532d;
      border-color: #22c55e;
      color: #f0fdf4;
      grid-column: span 2;
      font-size: 0.85rem;
      padding: 10px;
      font-weight: bold;
    }
    .btn-finalize:hover {
      background: #166534;
      border-color: #4ade80;
    }

    .modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(3, 7, 18, 0.94);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      padding: 16px;
      text-align: center;
      z-index: 10;
    }
    .modal-title {
      font-size: 1.4rem;
      font-weight: bold;
      margin-bottom: 8px;
    }
    .win-title { color: #38bdf8; text-shadow: 0 0 10px rgba(56, 189, 248, 0.5); }
    .lose-title { color: #f43f5e; text-shadow: 0 0 10px rgba(244, 63, 94, 0.5); }
  </style>
</head>
<body>

  <header>
    <h1>🔬 Forensic Reconstruction</h1>
    <div style="font-size:0.75rem; color:#7dd3fc;" id="turn-counter">Step: 0/150</div>
  </header>

  <div class="hud">
    <div class="hud-box">
      <div class="hud-label">Station</div>
      <div class="hud-val val-sta" id="hud-sta">Vault</div>
    </div>
    <div class="hud-box">
      <div class="hud-label">Evidence</div>
      <div class="hud-val val-ev" id="hud-ev">0 Items</div>
    </div>
    <div class="hud-box">
      <div class="hud-label">Timeline</div>
      <div class="hud-val val-slots" id="hud-slots">0 / 4</div>
    </div>
    <div class="hud-box">
      <div class="hud-label">Score</div>
      <div class="hud-val val-sc" id="hud-sc">0</div>
    </div>
  </div>

  <div id="game-container">
    <canvas id="game-canvas" width="460" height="200"></canvas>

    <div class="timeline-board">
      <div class="timeline-header">
        <span>INCIDENT TIMELINE RECONSTRUCTION MATRIX</span>
        <span id="evidence-summary" style="font-size:0.68rem; color:#facc15;">0 Trace Items</span>
      </div>
      <div class="timeline-grid" id="timeline-grid">
        <!-- Rendered dynamically -->
      </div>
    </div>

    <div class="log-box" id="log-box"></div>

    <div class="actions-grid" id="actions-grid"></div>

    <div id="end-modal" class="modal-overlay" style="display:none;">
      <div class="modal-title" id="modal-title">CASE RECONSTRUCTION</div>
      <p id="modal-desc" style="font-size:0.85rem; margin-bottom:12px; color:#cbd5e1;"></p>
      <button class="btn-act" onclick="window.restartGame()" style="padding:10px 24px; font-size:0.9rem; font-weight:bold;">New Crime Scene</button>
    </div>
  </div>

  <script src="logic.js"></script>
  <script>
    (function() {
      let state = null;
      const canvas = document.getElementById('game-canvas');
      const ctx = canvas ? canvas.getContext('2d') : null;

      function init() {
        state = createState(Date.now ? Date.now() : 1);
        render();
      }

      window.restartGame = function() {
        init();
      };

      window.executeAction = function(act) {
        if (!state || state.done) return;
        try {
          step(state, act);
          render();
        } catch (e) {
          console.error(e);
        }
      };

      function render() {
        if (!state) return;

        // HUD Updates
        const sEl = document.getElementById('hud-sta');
        if (sEl) sEl.textContent = formatStationShort(state.station);

        const evEl = document.getElementById('hud-ev');
        if (evEl) evEl.textContent = state.evidence.length + ' Trace';

        let filledSlots = 0;
        if (state.timelineSlots.phase_1) filledSlots++;
        if (state.timelineSlots.phase_2) filledSlots++;
        if (state.timelineSlots.phase_3) filledSlots++;
        if (state.timelineSlots.phase_4) filledSlots++;

        const slotsEl = document.getElementById('hud-slots');
        if (slotsEl) slotsEl.textContent = filledSlots + ' / 4';

        const scEl = document.getElementById('hud-sc');
        if (scEl) scEl.textContent = state.score;

        const turnEl = document.getElementById('turn-counter');
        if (turnEl) turnEl.textContent = 'Step: ' + state.turns + '/' + state.maxTurns;

        const evSum = document.getElementById('evidence-summary');
        if (evSum) evSum.textContent = state.evidence.length + ' Evidence Items Bagged';

        // Timeline Grid
        const gridEl = document.getElementById('timeline-grid');
        if (gridEl) {
          const phases = ['phase_1', 'phase_2', 'phase_3', 'phase_4'];
          let html = '';
          for (let i = 0; i < phases.length; i++) {
            const p = phases[i];
            const evId = state.timelineSlots[p];
            const isFilled = evId !== null;
            const cls = 'phase-slot' + (isFilled ? ' phase-slot-filled' : '');
            const pLabel = 'Phase ' + (i + 1);
            const content = isFilled ? EVENT_NAMES[evId] : 'Unassigned (Awaiting Evidence)';

            html += '<div class="' + cls + '">'
              + '<span class="phase-num">' + pLabel + ': </span>'
              + escapeHtml(content)
              + '</div>';
          }
          gridEl.innerHTML = html;
        }

        // Canvas Rendering
        if (ctx) {
          ctx.clearRect(0, 0, 460, 200);

          // Background Sci-Fi Forensic Lab Grid
          ctx.fillStyle = '#020617';
          ctx.fillRect(0, 0, 460, 200);

          ctx.strokeStyle = '#0f172a';
          ctx.lineWidth = 1;
          for (let x = 0; x < 460; x += 30) {
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, 200);
            ctx.stroke();
          }
          for (let y = 0; y < 200; y += 30) {
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(460, y);
            ctx.stroke();
          }

          // Station Title Banner
          ctx.fillStyle = 'rgba(8, 47, 73, 0.8)';
          ctx.fillRect(10, 10, 440, 36);
          ctx.strokeStyle = '#0284c7';
          ctx.strokeRect(10, 10, 440, 36);

          ctx.font = 'bold 14px monospace';
          ctx.fillStyle = '#38bdf8';
          ctx.fillText('STATION: ' + state.station.toUpperCase().replace(/_/g, ' '), 24, 33);

          // Station Diagram Graphic
          drawStationVisual(ctx, state.station);
        }

        // Log Box
        const logBox = document.getElementById('log-box');
        if (logBox) {
          let html = '';
          for (let i = 0; i < state.log.length; i++) {
            const line = state.log[i];
            let cls = 'log-line';
            if (line.includes('AUDIT FAILED') || line.includes('expired')) cls += ' log-alert';
            else if (line.includes('CERTIFIED') || line.includes('RECONSTRUCTION')) cls += ' log-win';
            else if (line.includes('identified') || line.includes('decoded') || line.includes('complete')) cls += ' log-ev';
            html += '<div class="' + cls + '">' + escapeHtml(line) + '</div>';
          }
          logBox.innerHTML = html;
          logBox.scrollTop = logBox.scrollHeight;
        }

        // Actions Grid
        const actionsEl = document.getElementById('actions-grid');
        if (actionsEl) {
          const acts = legalActions(state);
          let html = '';
          for (let i = 0; i < acts.length; i++) {
            const act = acts[i];
            let cls = 'btn-act';
            if (act.startsWith('scan:')) cls += ' btn-scan';
            else if (act.startsWith('assign:')) cls += ' btn-assign';
            else if (act === 'action:finalize_report') cls += ' btn-finalize';

            html += '<button class="' + cls + '" onclick="window.executeAction(\'' + act + '\')">'
              + formatActionTitle(act)
              + '</button>';
          }
          actionsEl.innerHTML = html;
        }

        // End Game Modal
        const modal = document.getElementById('end-modal');
        if (modal) {
          if (state.done) {
            modal.style.display = 'flex';
            const mTitle = document.getElementById('modal-title');
            const mDesc = document.getElementById('modal-desc');

            if (state.victory) {
              if (mTitle) {
                mTitle.textContent = 'RECONSTRUCTION CERTIFIED!';
                mTitle.className = 'modal-title win-title';
              }
              if (mDesc) mDesc.textContent = 'All 4 breach phases sequenced and validated without contradictions! Final Score: ' + state.score;
            } else {
              if (mTitle) {
                mTitle.textContent = 'AUDIT UNRESOLVED';
                mTitle.className = 'modal-title lose-title';
              }
              if (mDesc) mDesc.textContent = 'Maximum investigative steps reached before sequencing concluded. Final Score: ' + state.score;
            }
          } else {
            modal.style.display = 'none';
          }
        }
      }

      function drawStationVisual(ctx, station) {
        ctx.fillStyle = 'rgba(15, 23, 42, 0.7)';
        ctx.fillRect(30, 60, 400, 120);
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(30, 60, 400, 120);

        ctx.font = 'bold 13px monospace';
        ctx.fillStyle = '#facc15';

        if (station === 'vault_door') {
          ctx.fillText('TITANIUM VAULT DOOR BREACH', 45, 88);
          ctx.fillStyle = '#94a3b8';
          ctx.font = '11px monospace';
          ctx.fillText('Molten scorch marks across locking pins.', 45, 110);
          ctx.fillText('Thermite burn temperatures exceeded 2400°C.', 45, 130);
          ctx.fillText('Available tools: Spectrometer, UV Luminol.', 45, 150);
        } else if (station === 'security_console') {
          ctx.fillText('MAINFRAME SECURITY TERMINAL', 45, 88);
          ctx.fillStyle = '#94a3b8';
          ctx.font = '11px monospace';
          ctx.fillText('Corrupted flash logs and scrambled tripwires.', 45, 110);
          ctx.fillText('Keypad registers thermal residual contact.', 45, 130);
          ctx.fillText('Available tools: Cipher Decoder, UV Luminol.', 45, 150);
        } else if (station === 'glass_display') {
          ctx.fillText('BIOMETRIC VITRINE PEDESTAL', 45, 88);
          ctx.fillStyle = '#94a3b8';
          ctx.font = '11px monospace';
          ctx.fillText('Shattered acoustic glass fragments on dais.', 45, 110);
          ctx.fillText('Chronos Relic removed from velvet interior.', 45, 130);
          ctx.fillText('Available tools: Ballistics Laser, Spectrometer.', 45, 150);
        } else {
          // Ventilation
          ctx.fillText('CEILING VENTILATION EXHAUST', 45, 88);
          ctx.fillStyle = '#94a3b8';
          ctx.font = '11px monospace';
          ctx.fillText('Dislodged grill with snagged synthetic fiber.', 45, 110);
          ctx.fillText('Direct optical line of sight to security camera.', 45, 130);
          ctx.fillText('Available tools: Ballistics Laser, UV Luminol.', 45, 150);
        }
      }

      function formatStationShort(s) {
        if (s === 'vault_door') return 'Vault';
        if (s === 'security_console') return 'Console';
        if (s === 'glass_display') return 'Vitrine';
        if (s === 'ventilation_shaft') return 'Vent';
        return s;
      }

      function formatActionTitle(act) {
        if (act === 'move:vault_door') return '🚪 To Vault Door';
        if (act === 'move:security_console') return '💻 To Console';
        if (act === 'move:glass_display') return '💎 To Vitrine';
        if (act === 'move:ventilation_shaft') return '💨 To Ventilation';
        if (act === 'scan:tool:uv_luminol') return '💡 UV Luminol Scan';
        if (act === 'scan:tool:spectrometer') return '🔬 Spectrometer Scan';
        if (act === 'scan:tool:ballistics_laser') return '🎯 Ballistics Laser';
        if (act === 'scan:tool:cipher_decoder') return '🔓 Cipher Decoder';
        if (act.startsWith('assign:')) {
          const parts = act.split(':');
          const p = parts[1].replace('phase_', 'P');
          const e = parts[2].replace('event_', '').toUpperCase();
          return '📌 Set ' + p + ' ➔ ' + e;
        }
        if (act === 'action:finalize_report') return '📋 FINALIZE & CERTIFY RECONSTRUCTION';
        return act;
      }

      function escapeHtml(str) {
        return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }

      // Keyboard navigation
      window.addEventListener('keydown', function(e) {
        if (!state || state.done) return;
        const acts = legalActions(state);
        if (e.key >= '1' && e.key <= '9') {
          const idx = parseInt(e.key, 10) - 1;
          if (idx < acts.length) {
            window.executeAction(acts[idx]);
          }
        }
      });

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(function() {});
      }

      init();
    })();
  </script>
</body>
</html>
