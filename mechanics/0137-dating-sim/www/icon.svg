  <polygon points="256,70 264,88 282,96 264,104 256,122 248,104 230,96 248,88" fill="#fef08a"/>
  <polygon points="120,290 125,302 138,307 125,312 120,324 115,312 102,307 115,302" fill="#fef08a"/>
  <polygon points="390,120 395,132 408,137 395,142 390,154 385,142 372,137 385,132" fill="#fef08a"/>
