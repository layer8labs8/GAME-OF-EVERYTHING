<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kingdom of Text - Text-Based RPG</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#059669">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #030712;
      color: #e2e8f0;
      font-family: "Courier New", Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 8px;
      overflow-x: hidden;
    }
    header {
      width: 100%;
      max-width: 480px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      padding: 6px 12px;
      background: #062b1a;
      border-radius: 8px;
      border: 1px solid #059669;
    }
    h1 {
      font-size: 1rem;
      color: #34d399;
      display: flex;
      align-items: center;
      gap: 6px;
      letter-spacing: 0.5px;
    }
    .hud {
      width: 100%;
      max-width: 480px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
      margin-bottom: 6px;
    }
    .hud-box {
      background: #0b1f17;
      border: 1px solid #047857;
      border-radius: 6px;
      padding: 4px 6px;
      text-align: center;
      font-size: 0.75rem;
    }
    .hud-label {
      color: #6ee7b7;
      font-size: 0.65rem;
      text-transform: uppercase;
      margin-bottom: 2px;
    }
    .hud-val {
      font-weight: bold;
      color: #ffffff;
      font-size: 0.82rem;
    }
    .val-hp { color: #f87171; }
    .val-mp { color: #38bdf8; }
    .val-gold { color: #fbbf24; }
    .val-lvl { color: #a78bfa; }

    #game-container {
      position: relative;
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    canvas {
      width: 100%;
      max-width: 460px;
      aspect-ratio: 16 / 7;
      background: #021a10;
      border: 2px solid #059669;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(5, 150, 105, 0.25);
      touch-action: none;
    }

    .terminal-box {
      width: 100%;
      max-width: 460px;
      background: #05140d;
      border: 1px solid #10b981;
      border-radius: 8px;
      margin-top: 6px;
      padding: 8px 10px;
      height: 120px;
      overflow-y: auto;
      font-size: 0.78rem;
      line-height: 1.35;
      color: #d1fae5;
    }
    .log-line {
      margin-bottom: 3px;
    }
    .log-alert { color: #fbbf24; font-weight: bold; }
    .log-dmg { color: #f87171; }
    .log-heal { color: #4ade80; }
    .log-triumph { color: #38bdf8; font-weight: bold; }

    .actions-grid {
      width: 100%;
      max-width: 460px;
      margin-top: 8px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }
    .btn-act {
      background: #064e3b;
      color: #ecfdf5;
      border: 1px solid #10b981;
      border-radius: 6px;
      padding: 9px 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    .btn-act:hover {
      background: #047857;
      border-color: #34d399;
    }
    .btn-act:active {
      transform: scale(0.97);
    }
    .btn-combat {
      background: #7f1d1d;
      border-color: #ef4444;
      color: #fee2e2;
    }
    .btn-combat:hover {
      background: #991b1b;
      border-color: #f87171;
    }
    .btn-spell {
      background: #1e1b4b;
      border-color: #818cf8;
      color: #e0e7ff;
    }
    .btn-spell:hover {
      background: #312e81;
      border-color: #a5b4fc;
    }
    .btn-shop {
      background: #78350f;
      border-color: #f59e0b;
      color: #fef3c7;
    }
    .btn-shop:hover {
      background: #92400e;
      border-color: #fbbf24;
    }

    .modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(3, 7, 18, 0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      padding: 16px;
      text-align: center;
      z-index: 10;
    }
    .modal-title {
      font-size: 1.4rem;
      font-weight: bold;
      margin-bottom: 8px;
    }
    .win-title { color: #34d399; text-shadow: 0 0 10px rgba(52, 211, 153, 0.5); }
    .lose-title { color: #ef4444; text-shadow: 0 0 10px rgba(239, 68, 68, 0.5); }
  </style>
</head>
<body>

  <header>
    <h1>📜 Kingdom of Text</h1>
    <div style="font-size:0.75rem; color:#a7f3d0;" id="turn-counter">Turn: 0/150</div>
  </header>

  <div class="hud">
    <div class="hud-box">
      <div class="hud-label">HP</div>
      <div class="hud-val val-hp" id="hud-hp">100/100</div>
    </div>
    <div class="hud-box">
      <div class="hud-label">Mana</div>
      <div class="hud-val val-mp" id="hud-mp">40/40</div>
    </div>
    <div class="hud-box">
      <div class="hud-label">Gold/Pot</div>
      <div class="hud-val val-gold" id="hud-inv">25g | 2p</div>
    </div>
    <div class="hud-box">
      <div class="hud-label">Level / XP</div>
      <div class="hud-val val-lvl" id="hud-lvl">Lv 1 (0)</div>
    </div>
  </div>

  <div id="game-container">
    <canvas id="game-canvas" width="460" height="200"></canvas>

    <div class="terminal-box" id="terminal-box">
      <!-- Logs inserted dynamically -->
    </div>

    <div class="actions-grid" id="actions-grid">
      <!-- Action buttons inserted dynamically -->
    </div>

    <div id="end-modal" class="modal-overlay" style="display:none;">
      <div class="modal-title" id="modal-title">VICTORY</div>
      <p id="modal-desc" style="font-size:0.85rem; margin-bottom:12px; color:#cbd5e1;"></p>
      <button class="btn-act" onclick="window.restartGame()" style="padding:10px 24px; font-size:0.9rem;">Play Again</button>
    </div>
  </div>

  <script src="logic.js"></script>
  <script>
    (function() {
      let state = null;
      const canvas = document.getElementById('game-canvas');
      const ctx = canvas ? canvas.getContext('2d') : null;

      function init() {
        state = createState(Date.now ? Date.now() : 1);
        render();
      }

      window.restartGame = function() {
        init();
      };

      window.executeAction = function(act) {
        if (!state || state.done) return;
        try {
          step(state, act);
          render();
        } catch (e) {
          console.error(e);
        }
      };

      function render() {
        if (!state) return;

        // Update HUD
        const hpEl = document.getElementById('hud-hp');
        if (hpEl) hpEl.textContent = state.player.hp + '/' + state.player.maxHp;

        const mpEl = document.getElementById('hud-mp');
        if (mpEl) mpEl.textContent = state.player.mana + '/' + state.player.maxMana;

        const invEl = document.getElementById('hud-inv');
        if (invEl) invEl.textContent = state.player.gold + 'g | ' + state.player.potions + 'p';

        const lvlEl = document.getElementById('hud-lvl');
        if (lvlEl) lvlEl.textContent = 'Lv ' + state.player.level + ' (' + state.player.xp + ')';

        const turnEl = document.getElementById('turn-counter');
        if (turnEl) turnEl.textContent = 'Turn: ' + state.turns + '/' + state.maxTurns;

        // Render Canvas Visual Scene
        if (ctx) {
          ctx.clearRect(0, 0, 460, 200);

          // Background Gradient by Location
          let bgGrad = ctx.createLinearGradient(0, 0, 0, 200);
          if (state.location === 'town') {
            bgGrad.addColorStop(0, '#064e3b');
            bgGrad.addColorStop(1, '#022c22');
          } else if (state.location === 'darkwood') {
            bgGrad.addColorStop(0, '#14532d');
            bgGrad.addColorStop(1, '#052e16');
          } else if (state.location === 'crypt') {
            bgGrad.addColorStop(0, '#312e81');
            bgGrad.addColorStop(1, '#0f172a');
          } else {
            // Wyrm Peak
            bgGrad.addColorStop(0, '#7f1d1d');
            bgGrad.addColorStop(1, '#450a0a');
          }
          ctx.fillStyle = bgGrad;
          ctx.fillRect(0, 0, 460, 200);

          // Location Banner
          ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
          ctx.fillRect(10, 10, 440, 36);
          ctx.strokeStyle = '#10b981';
          ctx.lineWidth = 1;
          ctx.strokeRect(10, 10, 440, 36);

          ctx.font = 'bold 15px "Courier New", monospace';
          ctx.fillStyle = '#34d399';
          let locName = 'TOWN OF OAKHAVEN';
          if (state.location === 'darkwood') locName = 'DARKWOOD WILDERNESS';
          if (state.location === 'crypt') locName = 'SHADOW CRYPT';
          if (state.location === 'wyrm_peak') locName = 'WYRM PEAK (SUMMIT)';
          ctx.fillText('LOC: ' + locName, 22, 33);

          ctx.font = '12px "Courier New", monospace';
          ctx.fillStyle = '#cbd5e1';
          const wpn = WEAPON_TIERS[state.player.weaponTier].name;
          const arm = ARMOR_TIERS[state.player.armorTier].name;
          ctx.fillText('GEAR: ' + wpn + ' | ' + arm, 22, 65);

          // If in combat, render Enemy Card & Health Bar
          if (state.enemy) {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
            ctx.fillRect(30, 80, 400, 95);
            ctx.strokeStyle = state.enemy.isBoss ? '#f59e0b' : '#ef4444';
            ctx.lineWidth = 2;
            ctx.strokeRect(30, 80, 400, 95);

            ctx.font = 'bold 16px "Courier New", monospace';
            ctx.fillStyle = state.enemy.isBoss ? '#fbbf24' : '#f87171';
            ctx.fillText(state.enemy.name + (state.enemy.isBoss ? ' [ANCIENT BOSS]' : ' [HOSTILE]'), 45, 108);

            ctx.font = '12px "Courier New", monospace';
            ctx.fillStyle = '#94a3b8';
            ctx.fillText('ATK: ' + state.enemy.atk + '   DEF: ' + state.enemy.def, 45, 128);

            // Enemy HP bar
            const barW = 370;
            const hpRatio = Math.max(0, state.enemy.hp / state.enemy.maxHp);
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(45, 140, barW, 16);
            ctx.fillStyle = state.enemy.isBoss ? '#eab308' : '#ef4444';
            ctx.fillRect(45, 140, Math.floor(barW * hpRatio), 16);
            ctx.strokeStyle = '#64748b';
            ctx.lineWidth = 1;
            ctx.strokeRect(45, 140, barW, 16);

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 11px "Courier New", monospace';
            ctx.fillText('HP: ' + state.enemy.hp + ' / ' + state.enemy.maxHp, 50, 153);
          } else {
            // Peaceful scene description
            ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
            ctx.fillRect(30, 80, 400, 95);
            ctx.strokeStyle = '#059669';
            ctx.lineWidth = 1;
            ctx.strokeRect(30, 80, 400, 95);

            ctx.fillStyle = '#a7f3d0';
            ctx.font = '13px "Courier New", monospace';
            if (state.location === 'town') {
              ctx.fillText('The cobblestone streets of Oakhaven are calm.', 45, 115);
              ctx.fillText('Visit the Tavern or Blacksmith to gear up.', 45, 140);
            } else if (state.location === 'darkwood') {
              ctx.fillText('Sunlight filters through dense emerald leaves.', 45, 115);
              ctx.fillText('Wild beasts prowl nearby. Be vigilant.', 45, 140);
            } else if (state.location === 'crypt') {
              ctx.fillText('Cold stone vaults echo with forgotten spirits.', 45, 115);
              ctx.fillText('Ancient treasures remain sealed in bone dust.', 45, 140);
            } else {
              ctx.fillText('The wind howls violently at the mountain apex.', 45, 125);
            }
          }
        }

        // Terminal Log Rendering
        const termEl = document.getElementById('terminal-box');
        if (termEl) {
          let logHtml = '';
          for (let i = 0; i < state.log.length; i++) {
            const line = state.log[i];
            let cls = 'log-line';
            if (line.includes('TRIUMPH') || line.includes('LEVEL UP')) cls += ' log-triumph';
            else if (line.includes('Defeat') || line.includes('struck') || line.includes('retaliated')) cls += ' log-dmg';
            else if (line.includes('restored') || line.includes('recovering')) cls += ' log-heal';
            else if (line.includes('Encounter') || line.includes('Victory')) cls += ' log-alert';

            logHtml += '<div class="' + cls + '">' + escapeHtml(line) + '</div>';
          }
          termEl.innerHTML = logHtml;
          termEl.scrollTop = termEl.scrollHeight;
        }

        // Action Buttons
        const actionsEl = document.getElementById('actions-grid');
        if (actionsEl) {
          const acts = legalActions(state);
          let btnHtml = '';

          for (let i = 0; i < acts.length; i++) {
            const act = acts[i];
            let label = formatActionLabel(act);
            let btnClass = 'btn-act';

            if (act.startsWith('combat:strike') || act === 'combat:flee') btnClass += ' btn-combat';
            else if (act.startsWith('combat:cast_') || act.startsWith('combat:heal')) btnClass += ' btn-spell';
            else if (act.startsWith('town:')) btnClass += ' btn-shop';

            btnHtml += '<button class="' + btnClass + '" onclick="window.executeAction(\'' + act + '\')">' + label + '</button>';
          }
          actionsEl.innerHTML = btnHtml;
        }

        // End Game Modal
        const modal = document.getElementById('end-modal');
        if (modal) {
          if (state.done) {
            modal.style.display = 'flex';
            const mTitle = document.getElementById('modal-title');
            const mDesc = document.getElementById('modal-desc');

            if (state.victory) {
              if (mTitle) {
                mTitle.textContent = 'VICTORY ACHIEVED!';
                mTitle.className = 'modal-title win-title';
              }
              if (mDesc) mDesc.textContent = 'You conquered Ignis the Dread and saved Aethelgard! Final Score: ' + state.score;
            } else {
              if (mTitle) {
                mTitle.textContent = 'HERO DEFEATED';
                mTitle.className = 'modal-title lose-title';
              }
              if (mDesc) mDesc.textContent = 'Your vitality was exhausted in battle. Final Score: ' + state.score;
            }
          } else {
            modal.style.display = 'none';
          }
        }
      }

      function formatActionLabel(act) {
        if (act === 'explore:darkwood') return '🌲 Explore Darkwood';
        if (act === 'explore:crypt') return '💀 Enter Crypt';
        if (act === 'explore:wyrm_peak') return '🌋 Climb Wyrm Peak';
        if (act === 'town:rest') return '🛏️ Rest Tavern (10g)';
        if (act === 'town:buy_potion') return '🧪 Buy Potion (15g)';
        if (act === 'town:buy_weapon') return '⚔️ Forge Weapon';
        if (act === 'town:buy_armor') return '🛡️ Buy Armor';
        if (act === 'action:return_town') return '🏛️ Return to Town';
        if (act === 'action:pray_shrine') return '✨ Pray at Shrine';
        if (act === 'action:open_chest') return '📦 Open Crypt Chest';
        if (act === 'combat:strike') return '⚔️ Attack Strike';
        if (act === 'combat:cast_fireball') return '🔥 Fireball (15 MP)';
        if (act === 'combat:heal_spell') return '✨ Heal Spell (15 MP)';
        if (act === 'combat:defend') return '🛡️ Defend & Meditate';
        if (act === 'combat:drink_potion') return '🧪 Drink Potion (+50)';
        if (act === 'combat:flee') return '🏃 Flee to Town';
        return act;
      }

      function escapeHtml(str) {
        return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }

      // Keyboard support
      window.addEventListener('keydown', function(e) {
        if (!state || state.done) return;
        const acts = legalActions(state);
        if (e.key >= '1' && e.key <= '9') {
          const idx = parseInt(e.key, 10) - 1;
          if (idx < acts.length) {
            window.executeAction(acts[idx]);
          }
        }
      });

      // PWA service worker registration
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(function() {});
      }

      init();
    })();
  </script>
</body>
</html>
