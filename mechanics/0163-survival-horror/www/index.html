<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Shadow Descent - Survival Horror</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #070709;
      color: #e2e8f0;
      font-family: 'Courier New', Courier, monospace, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
      padding: 10px;
    }
    header {
      width: 100%;
      max-width: 640px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: #111116;
      border: 1px solid #27272a;
      border-radius: 8px;
      margin-bottom: 8px;
    }
    h1 {
      font-size: 1.1rem;
      letter-spacing: 2px;
      color: #ef4444;
      text-transform: uppercase;
      text-shadow: 0 0 8px rgba(239, 68, 68, 0.6);
    }
    .badge {
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 4px;
      background: #27272a;
      color: #a1a1aa;
    }
    #game-container {
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    canvas {
      width: 100%;
      height: auto;
      aspect-ratio: 4/3;
      background: #030304;
      border: 1px solid #3f3f46;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.8);
      image-rendering: pixelated;
    }
    .vitals-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      width: 100%;
    }
    .vital-card {
      background: #121216;
      border: 1px solid #27272a;
      padding: 6px 8px;
      border-radius: 6px;
    }
    .vital-title {
      font-size: 0.7rem;
      color: #71717a;
      text-transform: uppercase;
      display: flex;
      justify-content: space-between;
    }
    .vital-val {
      font-size: 1rem;
      font-weight: bold;
      margin-top: 2px;
    }
    .log-box {
      background: #0d0d11;
      border: 1px solid #27272a;
      border-left: 3px solid #ef4444;
      padding: 8px 10px;
      border-radius: 4px;
      font-size: 0.8rem;
      color: #cbd5e1;
      min-height: 44px;
      display: flex;
      align-items: center;
    }
    .actions-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 6px;
      margin-top: 4px;
    }
    .btn {
      background: #1c1c24;
      border: 1px solid #3f3f46;
      color: #e4e4e7;
      padding: 10px 8px;
      font-family: inherit;
      font-size: 0.75rem;
      border-radius: 6px;
      cursor: pointer;
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 0.5px;
      transition: all 0.15s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .btn:hover {
      background: #272733;
      border-color: #ef4444;
      color: #fff;
      box-shadow: 0 0 10px rgba(239, 68, 68, 0.3);
    }
    .btn:active {
      transform: scale(0.97);
    }
    .btn-danger {
      border-color: #991b1b;
      background: #2b1111;
      color: #fca5a5;
    }
    .btn-danger:hover {
      background: #450a0a;
      border-color: #ef4444;
    }
    .btn-safe {
      border-color: #065f46;
      background: #062f25;
      color: #6ee7b7;
    }
    .btn-safe:hover {
      background: #064e3b;
      border-color: #10b981;
    }
    .btn-primary {
      border-color: #2563eb;
      background: #1e293b;
      color: #93c5fd;
    }
    .footer-bar {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      width: 100%;
    }
    .subtext {
      font-size: 0.7rem;
      color: #71717a;
    }
  </style>
</head>
<body>
  <header>
    <h1>Shadow Descent</h1>
    <div>
      <span id="turn-badge" class="badge">TURN 0 / 120</span>
      <span id="score-badge" class="badge" style="color: #f59e0b;">0 PTS</span>
    </div>
  </header>

  <div id="game-container">
    <canvas id="gameCanvas" width="640" height="480"></canvas>

    <div class="vitals-bar">
      <div class="vital-card">
        <div class="vital-title"><span>Health</span><span id="health-status">FINE</span></div>
        <div id="health-val" class="vital-val" style="color: #10b981;">100%</div>
      </div>
      <div class="vital-card">
        <div class="vital-title"><span>Sanity</span><span id="sanity-status">CALM</span></div>
        <div id="sanity-val" class="vital-val" style="color: #60a5fa;">90%</div>
      </div>
      <div class="vital-card">
        <div class="vital-title"><span>Battery</span><span id="battery-status">BEAM</span></div>
        <div id="battery-val" class="vital-val" style="color: #fbbf24;">80%</div>
      </div>
    </div>

    <div id="game-log" class="log-box">
      Awakened in Emergency Ward. Blood drips in the hallway. Find a way out.
    </div>

    <div id="actions-panel" class="actions-grid">
      <!-- Injected dynamically -->
    </div>

    <div class="footer-bar">
      <div class="subtext" id="inventory-summary">Ammo: 10 Handgun | 4 Shells | 1 Herb</div>
      <button id="bot-toggle-btn" class="btn" style="padding: 4px 10px; font-size: 0.7rem;" onclick="window.toggleBot()">BOT: OFF</button>
    </div>
  </div>

  <script src="logic.js"></script>
  <script>
    let state = createState(Date.now ? Date.now() : 12345);
    let botRunning = false;
    let botInterval = null;

    // Web Audio synthesizer for survival horror ambiance
    let audioCtx = null;
    function playSfx(type) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const t = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'gunshot') {
          osc.type = 'square';
          osc.frequency.setValueAtTime(140, t);
          osc.frequency.exponentialRampToValueAtTime(30, t + 0.18);
          gain.gain.setValueAtTime(0.4, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + 0.2);
          osc.start(t);
          osc.stop(t + 0.2);
        } else if (type === 'shotgun') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(90, t);
          osc.frequency.exponentialRampToValueAtTime(20, t + 0.35);
          gain.gain.setValueAtTime(0.6, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + 0.38);
          osc.start(t);
          osc.stop(t + 0.38);
        } else if (type === 'safe') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(329.63, t); // E4
          osc.frequency.setValueAtTime(440.00, t + 0.15); // A4
          gain.gain.setValueAtTime(0.15, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + 0.5);
          osc.start(t);
          osc.stop(t + 0.5);
        } else if (type === 'growl') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(65, t);
          osc.frequency.linearRampToValueAtTime(45, t + 0.4);
          gain.gain.setValueAtTime(0.3, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + 0.45);
          osc.start(t);
          osc.stop(t + 0.45);
        }
      } catch (e) {}
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    function render() {
      // Vitals UI
      document.getElementById('turn-badge').textContent = 'TURN ' + state.turns + ' / ' + state.maxTurns;
      document.getElementById('score-badge').textContent = score(state) + ' PTS';

      const hEl = document.getElementById('health-val');
      hEl.textContent = state.health + '%';
      if (state.health > 70) {
        hEl.style.color = '#10b981';
        document.getElementById('health-status').textContent = 'FINE';
      } else if (state.health > 30) {
        hEl.style.color = '#f59e0b';
        document.getElementById('health-status').textContent = 'CAUTION';
      } else {
        hEl.style.color = '#ef4444';
        document.getElementById('health-status').textContent = 'DANGER';
      }

      const sEl = document.getElementById('sanity-val');
      sEl.textContent = state.sanity + '%';
      if (state.sanity > 60) {
        sEl.style.color = '#60a5fa';
        document.getElementById('sanity-status').textContent = 'CALM';
      } else if (state.sanity > 25) {
        sEl.style.color = '#a855f7';
        document.getElementById('sanity-status').textContent = 'ANXIOUS';
      } else {
        sEl.style.color = '#ef4444';
        document.getElementById('sanity-status').textContent = 'PANIC';
      }

      const bEl = document.getElementById('battery-val');
      bEl.textContent = state.battery + '%';
      bEl.style.color = state.battery > 30 ? '#fbbf24' : '#ef4444';
      document.getElementById('battery-status').textContent = state.battery > 0 ? 'BEAM' : 'DEPLETED';

      document.getElementById('game-log').textContent = state.gameMessage;
      document.getElementById('inventory-summary').textContent =
        'Ammo: ' + state.handgunRounds + ' Handgun | ' + state.shotgunShells + ' Shells | ' +
        state.greenHerbs + ' Herbs | ' + state.spareBatteries + ' Batteries | Keys: [' + state.keyItems.join(', ') + ']';

      // Canvas Rendering
      ctx.fillStyle = '#050508';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Flashlight cone & hallway perspective
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;

      // Sector ambient tint
      const tints = ['#1a0808', '#08141e', '#160822', '#260404'];
      const bgGrad = ctx.createRadialGradient(cx, cy - 20, 30, cx, cy, 320);
      const bright = Math.max(0.05, state.battery / 100);
      bgGrad.addColorStop(0, 'rgba(255, 240, 220, ' + (0.5 * bright) + ')');
      bgGrad.addColorStop(0.5, 'rgba(180, 100, 80, ' + (0.15 * bright) + ')');
      bgGrad.addColorStop(1, '#020203');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Hallway grid wires
      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 2;
      ctx.beginPath();
      // Vanishing point lines
      ctx.moveTo(0, 0); ctx.lineTo(cx - 80, cy - 60);
      ctx.moveTo(canvas.width, 0); ctx.lineTo(cx + 80, cy - 60);
      ctx.moveTo(0, canvas.height); ctx.lineTo(cx - 80, cy + 80);
      ctx.moveTo(canvas.width, canvas.height); ctx.lineTo(cx + 80, cy + 80);
      // Back wall rectangle
      ctx.rect(cx - 80, cy - 60, 160, 140);
      ctx.stroke();

      // Sector Title Banner on Wall
      ctx.fillStyle = '#ef4444';
      ctx.font = 'bold 16px "Courier New"';
      ctx.textAlign = 'center';
      ctx.fillText('SECTOR ' + state.sector + ': ' + SECTOR_NAMES[state.sector].toUpperCase(), cx, 50);

      // Blast door status
      const isSolved = state.sectorPuzzlesSolved[state.sector];
      ctx.fillStyle = isSolved ? '#10b981' : '#f59e0b';
      ctx.font = '12px "Courier New"';
      ctx.fillText(isSolved ? '[BLAST DOORS UNLOCKED]' : '[SECURITY LOCK ENGAGED]', cx, 75);

      // Draw Monster if present
      if (state.currentMonster) {
        const m = state.currentMonster;
        // Monster shadow body
        ctx.fillStyle = '#0f0505';
        ctx.beginPath();
        ctx.ellipse(cx, cy + 20, 65, 85, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#7f1d1d';
        ctx.lineWidth = 3;
        ctx.stroke();

        // Menacing glowing eyes
        ctx.fillStyle = '#ef4444';
        ctx.shadowColor = '#dc2626';
        ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.arc(cx - 20, cy - 10, 6, 0, Math.PI * 2);
        ctx.arc(cx + 20, cy - 10, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;

        // Claws
        ctx.strokeStyle = '#ef4444';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(cx - 50, cy + 30); ctx.lineTo(cx - 75, cy + 70);
        ctx.moveTo(cx + 50, cy + 30); ctx.lineTo(cx + 75, cy + 70);
        ctx.stroke();

        // Monster HP Bar
        const barW = 160;
        const barH = 12;
        const barX = cx - barW / 2;
        const barY = cy + 120;
        ctx.fillStyle = '#27272a';
        ctx.fillRect(barX, barY, barW, barH);
        const fillW = Math.max(0, (m.hp / m.maxHp) * barW);
        ctx.fillStyle = '#ef4444';
        ctx.fillRect(barX, barY, fillW, barH);
        ctx.strokeStyle = '#52525b';
        ctx.strokeRect(barX, barY, barW, barH);

        ctx.fillStyle = '#fff';
        ctx.font = 'bold 12px "Courier New"';
        ctx.fillText(m.name + ' (' + m.hp + '/' + m.maxHp + ' HP)', cx, barY - 6);
      } else {
        // Safe hallway or room icon
        ctx.fillStyle = '#10b981';
        ctx.font = '14px "Courier New"';
        ctx.fillText('Corridor Clear. No Immediate Bio-Threat.', cx, cy + 20);
      }

      // Darkness Vignette
      if (state.battery < 40) {
        const darkGrad = ctx.createRadialGradient(cx, cy, 80, cx, cy, 320);
        darkGrad.addColorStop(0, 'rgba(0,0,0,0)');
        darkGrad.addColorStop(1, 'rgba(0,0,0,' + (0.9 - state.battery * 0.015) + ')');
        ctx.fillStyle = darkGrad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      // Game Over Screen Overlay
      if (isOver(state)) {
        ctx.fillStyle = state.victory ? 'rgba(6, 78, 59, 0.85)' : 'rgba(69, 10, 10, 0.9)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 24px "Courier New"';
        ctx.fillText(state.victory ? 'MISSION ACCOMPLISHED' : 'SIGNAL LOST - TERMINATED', cx, cy - 20);
        ctx.font = '14px "Courier New"';
        ctx.fillText('Final Evaluation Score: ' + score(state), cx, cy + 15);
      }

      updateActions();
    }

    function updateActions() {
      const panel = document.getElementById('actions-panel');
      if (isOver(state)) {
        panel.innerHTML = '<button class="btn btn-primary" onclick="window.restartGame()">RESTART SYSTEM</button>';
        return;
      }

      const actions = legalActions(state);
      let html = '';
      for (const act of actions) {
        let cls = 'btn';
        let label = act;
        let sub = '';

        if (act === 'action:rest_in_safe_room') {
          cls += ' btn-safe';
          label = 'REST IN SAFE ROOM';
          sub = '+35 Sanity';
        } else if (act === 'action:precision_handgun_shot') {
          cls += ' btn-danger';
          label = '9mm HANDGUN SHOT';
          sub = '-1 Ammo';
        } else if (act === 'action:shotgun_blast') {
          cls += ' btn-danger';
          label = 'SHOTGUN BLAST';
          sub = '-1 Shell (45 Dmg)';
        } else if (act === 'action:dodge_evasion') {
          label = 'EVASIVE DODGE';
          sub = '-10 Sanity';
        } else if (act === 'action:flee_combat') {
          label = 'FLEE TO SAFETY';
          sub = 'Escape Room';
        } else if (act === 'action:use_green_herb') {
          cls += ' btn-safe';
          label = 'USE GREEN HERB';
          sub = '+35 Health';
        } else if (act === 'action:recharge_flashlight') {
          label = 'NEW BATTERY';
          sub = '+50 Battery';
        } else if (act === 'action:explore_chamber') {
          label = 'EXPLORE CHAMBER';
          sub = 'Scavenge Items';
        } else if (act === 'action:solve_sector_puzzle') {
          cls += ' btn-primary';
          label = 'UNLOCK BLAST DOOR';
          sub = 'Insert Key';
        } else if (act.startsWith('action:advance_to_sector:')) {
          cls += ' btn-primary';
          const s = act.split(':')[2];
          label = 'ADVANCE TO SECTOR ' + s;
        } else if (act === 'action:trigger_extraction_flare') {
          cls += ' btn-primary';
          label = 'FIRE RESCUE FLARE';
        } else {
          label = act.replace('action:', '').replace(/_/g, ' ');
        }

        html += '<button class="' + cls + '" onclick="window.triggerAction(\'' + act + '\')"><span>' + label + '</span>' + (sub ? '<span style="font-size:0.65rem;opacity:0.8;">' + sub + '</span>' : '') + '</button>';
      }

      panel.innerHTML = html;
    }

    window.restartGame = function() {
      state = createState(Date.now ? Date.now() : 12345);
      render();
    };

    window.triggerAction = function(act) {
      if (isOver(state)) return;
      if (act.includes('shotgun')) playSfx('shotgun');
      else if (act.includes('handgun')) playSfx('gunshot');
      else if (act.includes('safe')) playSfx('safe');
      else if (act.includes('explore')) playSfx('growl');

      step(state, act);
      render();
    };

    window.toggleBot = function() {
      botRunning = !botRunning;
      document.getElementById('bot-toggle-btn').textContent = botRunning ? 'BOT: ON' : 'BOT: OFF';
      document.getElementById('bot-toggle-btn').style.background = botRunning ? '#065f46' : '#1c1c24';

      if (botRunning) {
        botInterval = setInterval(() => {
          if (isOver(state)) {
            state = createState(Date.now ? Date.now() : 9999);
            render();
            return;
          }
          const acts = legalActions(state);
          if (acts.length > 0) {
            // Prioritize heal if damaged, attack if monster, puzzle if available
            let choice = acts[0];
            if (acts.includes('action:use_green_herb') && state.health <= 60) choice = 'action:use_green_herb';
            else if (acts.includes('action:shotgun_blast')) choice = 'action:shotgun_blast';
            else if (acts.includes('action:precision_handgun_shot')) choice = 'action:precision_handgun_shot';
            else if (acts.includes('action:trigger_extraction_flare')) choice = 'action:trigger_extraction_flare';
            else if (acts.includes('action:solve_sector_puzzle')) choice = 'action:solve_sector_puzzle';
            else if (acts.find(a => a.startsWith('action:advance_to_sector:'))) choice = acts.find(a => a.startsWith('action:advance_to_sector:'));
            else if (acts.includes('action:explore_chamber')) choice = 'action:explore_chamber';
            window.triggerAction(choice);
          }
        }, 400);
      } else {
        clearInterval(botInterval);
      }
    };

    render();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
