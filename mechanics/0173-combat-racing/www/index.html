<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#090303">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Nitro Carnage</title>
<style>
  html, body { margin: 0; height: 100%; background: #050202; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; margin: 0 auto; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="logic.js"></script>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const W = 360;
const H = 640;
let scale = 1;

function resize() {
  scale = Math.min(innerWidth / W, innerHeight / H);
  const dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.style.width = W * scale + 'px';
  canvas.style.height = H * scale + 'px';
  canvas.width = Math.round(W * scale * dpr);
  canvas.height = Math.round(H * scale * dpr);
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
}
addEventListener('resize', resize);
resize();

function rrect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

let best = 0;
try { best = +localStorage.getItem('goe-0173-best') || 0; } catch (e) {}

let state = createState(Date.now());
let playerX = 180;
let targetX = 180;
let roadOffset = 0;
let particles = [];
let floaters = [];
let overAt = 0;
let swipeStartX = null;
let swipeStartY = null;

function restart() {
  state = createState(Date.now());
  targetX = getLaneX(state.lane);
  playerX = targetX;
  particles = [];
  floaters = [];
  overAt = 0;
}

function getLaneX(lane) {
  return 85 + lane * 95;
}

function performAction(act) {
  if (isOver(state)) return;
  const legals = legalActions(state);
  if (!legals.includes(act)) return;

  const oldHp = state.rival ? state.rival.hp : 0;
  const res = step(state, act);
  targetX = getLaneX(state.lane);

  if (act.includes('vulcan') || act.includes('missile')) {
    const dmg = state.rival ? Math.max(0, oldHp - state.rival.hp) : 0;
    if (dmg > 0) {
      floaters.push({ text: '-' + dmg + ' HP', x: getLaneX(state.rival ? state.rival.lane : state.lane), y: 150, t: 0, color: '#ef4444' });
    }
    // Muzzle flash particles
    for (let i = 0; i < 8; i++) {
      particles.push({
        x: playerX + (Math.random() - 0.5) * 20,
        y: 380,
        vx: (Math.random() - 0.5) * 60,
        vy: -200 - Math.random() * 150,
        color: '#f59e0b',
        life: 0.25,
        maxLife: 0.25
      });
    }
  } else if (act.includes('nitro')) {
    floaters.push({ text: 'NITRO BOOST!', x: playerX, y: 380, t: 0, color: '#06b6d4' });
  } else if (act.includes('repair')) {
    floaters.push({ text: '+25 HULL', x: playerX, y: 380, t: 0, color: '#10b981' });
  }

  if (isOver(state)) {
    overAt = performance.now();
    const sc = score(state);
    if (sc > best) {
      best = sc;
      try { localStorage.setItem('goe-0173-best', best); } catch (e) {}
    }
  }
}

// Action button hitboxes on canvas
const BTNS = [
  { id: 'left', label: '◀ LEFT', action: 'action:shift_lane:left', x: 20, y: 480, w: 75, h: 48, col: '#3b82f6' },
  { id: 'cruise', label: 'CRUISE ▲', action: 'action:cruise_forward', x: 105, y: 480, w: 150, h: 48, col: '#10b981' },
  { id: 'right', label: 'RIGHT ▶', action: 'action:shift_lane:right', x: 265, y: 480, w: 75, h: 48, col: '#3b82f6' },
  { id: 'vulcan', label: 'VULCAN (2)', action: 'action:fire_vulcan_cannon', x: 20, y: 538, w: 100, h: 44, col: '#f59e0b' },
  { id: 'missile', label: 'MISSILE (1)', action: 'action:launch_homing_missile', x: 130, y: 538, w: 100, h: 44, col: '#ef4444' },
  { id: 'nitro', label: 'NITRO (20)', action: 'action:burn_nitro_boost', x: 240, y: 538, w: 100, h: 44, col: '#06b6d4' },
  { id: 'oil', label: 'OIL SLICK', action: 'action:deploy_oil_slick', x: 20, y: 590, w: 155, h: 40, col: '#8b5cf6' },
  { id: 'repair', label: 'NANITE REPAIR', action: 'action:repair_armor_nanites', x: 185, y: 590, w: 155, h: 40, col: '#10b981' },
];

function toLogical(e) {
  const rect = canvas.getBoundingClientRect();
  return { x: (e.clientX - rect.left) / scale, y: (e.clientY - rect.top) / scale };
}

canvas.addEventListener('pointerdown', (e) => {
  const p = toLogical(e);
  if (isOver(state)) {
    if (performance.now() - overAt > 400) restart();
    return;
  }
  // Check button taps
  for (const b of BTNS) {
    if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) {
      performAction(b.action);
      return;
    }
  }
  // Touch upper canvas to steer or target
  if (p.y < 460) {
    swipeStartX = p.x;
    swipeStartY = p.y;
    // Tap left third or right third to steer, center to shoot
    if (p.x < 110) performAction('action:shift_lane:left');
    else if (p.x > 250) performAction('action:shift_lane:right');
    else performAction('action:fire_vulcan_cannon');
  }
});

canvas.addEventListener('pointermove', (e) => {
  if (swipeStartX === null || isOver(state)) return;
  const p = toLogical(e);
  const dx = p.x - swipeStartX;
  if (Math.abs(dx) > 30) {
    if (dx > 0) performAction('action:shift_lane:right');
    else performAction('action:shift_lane:left');
    swipeStartX = p.x;
  }
});

canvas.addEventListener('pointerup', () => { swipeStartX = null; swipeStartY = null; });
canvas.addEventListener('pointercancel', () => { swipeStartX = null; swipeStartY = null; });

addEventListener('keydown', (e) => {
  if (isOver(state)) {
    if ((e.key === ' ' || e.key === 'Enter') && performance.now() - overAt > 400) restart();
    return;
  }
  const k = e.key.toLowerCase();
  if (k === 'arrowleft' || k === 'a') performAction('action:shift_lane:left');
  else if (k === 'arrowright' || k === 'd') performAction('action:shift_lane:right');
  else if (k === 'arrowup' || k === 'w') performAction('action:cruise_forward');
  else if (k === ' ' || k === 'f') performAction('action:fire_vulcan_cannon');
  else if (k === 'm') performAction('action:launch_homing_missile');
  else if (k === 'n') performAction('action:burn_nitro_boost');
  else if (k === 'o') performAction('action:deploy_oil_slick');
  else if (k === 'r') performAction('action:repair_armor_nanites');
});

function draw(dt) {
  // Road speed calculation
  const speed = state.boostActiveTurns > 0 ? 420 : 220;
  roadOffset = (roadOffset + speed * dt) % 60;

  // Background
  ctx.fillStyle = '#0a0303';
  ctx.fillRect(0, 0, W, H);

  // Highway surface
  ctx.fillStyle = '#180707';
  ctx.fillRect(40, 0, 280, 460);

  // Road borders
  ctx.fillStyle = '#ef4444';
  ctx.fillRect(36, 0, 4, 460);
  ctx.fillRect(320, 0, 4, 460);

  // Lane dividers (striped)
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  for (let y = -60 + roadOffset; y < 460; y += 50) {
    ctx.fillRect(132, y, 4, 28);
    ctx.fillRect(224, y, 4, 28);
  }

  // Smooth car lerp
  playerX += (targetX - playerX) * Math.min(1, dt * 14);

  // Draw Rival car if present
  if (state.rival && state.rival.hp > 0) {
    const rx = getLaneX(state.rival.lane);
    const ry = Math.max(60, 260 - state.rival.dist * 3.5);

    // Rival shadow
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    rrect(rx - 16, ry + 20, 32, 26, 6);
    ctx.fill();

    // Rival chassis
    ctx.fillStyle = '#7f1d1d';
    rrect(rx - 16, ry - 24, 32, 48, 6);
    ctx.fill();
    ctx.fillStyle = '#ef4444';
    rrect(rx - 12, ry - 18, 24, 36, 4);
    ctx.fill();

    // Rival health bar
    const hpPct = Math.max(0, state.rival.hp / state.rival.maxHp);
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(rx - 25, ry - 34, 50, 6);
    ctx.fillStyle = hpPct > 0.4 ? '#ef4444' : '#f59e0b';
    ctx.fillRect(rx - 25, ry - 34, 50 * hpPct, 6);

    ctx.fillStyle = '#fecaca';
    ctx.font = 'bold 9px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(state.rival.name.split(' ')[0] + ' ' + state.rival.hp + 'HP', rx, ry - 38);
  }

  // Draw Player Car
  const py = 390;
  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  rrect(playerX - 18, py + 16, 36, 26, 6);
  ctx.fill();

  // Wheels
  ctx.fillStyle = '#111';
  ctx.fillRect(playerX - 22, py - 22, 6, 14);
  ctx.fillRect(playerX + 16, py - 22, 6, 14);
  ctx.fillRect(playerX - 22, py + 8, 6, 14);
  ctx.fillRect(playerX + 16, py + 8, 6, 14);

  // Armored Chassis
  ctx.fillStyle = '#1e3a8a';
  rrect(playerX - 17, py - 26, 34, 52, 6);
  ctx.fill();
  ctx.fillStyle = '#3b82f6';
  rrect(playerX - 13, py - 20, 26, 40, 4);
  ctx.fill();

  // Cockpit
  ctx.fillStyle = '#0f172a';
  rrect(playerX - 9, py - 10, 18, 16, 3);
  ctx.fill();

  // Weapon turrets
  ctx.fillStyle = '#f59e0b';
  ctx.fillRect(playerX - 11, py - 28, 4, 8);
  ctx.fillRect(playerX + 7, py - 28, 4, 8);

  // Nitro exhaust flame
  if (state.boostActiveTurns > 0) {
    ctx.fillStyle = '#06b6d4';
    ctx.beginPath();
    ctx.moveTo(playerX - 6, py + 26);
    ctx.lineTo(playerX + 6, py + 26);
    ctx.lineTo(playerX, py + 40 + Math.random() * 12);
    ctx.closePath();
    ctx.fill();
  }

  // Draw HUD at top
  ctx.fillStyle = 'rgba(15, 3, 3, 0.88)';
  ctx.fillRect(0, 0, W, 48);

  ctx.fillStyle = '#ef4444';
  ctx.font = 'bold 15px system-ui, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('DIST: ' + state.raceDistance + '/100 KM', 12, 22);

  ctx.textAlign = 'right';
  ctx.fillStyle = '#f59e0b';
  ctx.fillText('WRECKS: ' + state.rivalsWrecked, W - 12, 22);

  // Bars: Hull & Nitro
  ctx.font = '10px system-ui, sans-serif';
  ctx.fillStyle = '#94a3b8';
  ctx.textAlign = 'left';
  ctx.fillText('HULL ' + state.hull + '%', 12, 38);
  ctx.fillStyle = '#334155';
  ctx.fillRect(68, 30, 80, 8);
  ctx.fillStyle = state.hull > 30 ? '#10b981' : '#ef4444';
  ctx.fillRect(68, 30, 80 * (state.hull / 100), 8);

  ctx.fillStyle = '#94a3b8';
  ctx.fillText('NITRO ' + state.nitro, 165, 38);
  ctx.fillStyle = '#334155';
  ctx.fillRect(215, 30, 75, 8);
  ctx.fillStyle = '#06b6d4';
  ctx.fillRect(215, 30, 75 * Math.min(1, state.nitro / 80), 8);

  // Draw Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const pt = particles[i];
    pt.x += pt.vx * dt;
    pt.y += pt.vy * dt;
    pt.life -= dt;
    if (pt.life <= 0) {
      particles.splice(i, 1);
      continue;
    }
    ctx.fillStyle = pt.color;
    ctx.globalAlpha = pt.life / pt.maxLife;
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, 3, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Floating text
  for (let i = floaters.length - 1; i >= 0; i--) {
    const f = floaters[i];
    f.y -= 35 * dt;
    f.t += dt;
    if (f.t > 0.8) {
      floaters.splice(i, 1);
      continue;
    }
    ctx.fillStyle = f.color;
    ctx.font = 'bold 15px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(f.text, f.x, f.y);
  }

  // Draw Control Deck
  ctx.fillStyle = '#0d0404';
  ctx.fillRect(0, 460, W, 180);
  ctx.fillStyle = '#7f1d1d';
  ctx.fillRect(0, 458, W, 2);

  const legals = legalActions(state);
  for (const b of BTNS) {
    const isLegal = legals.includes(b.action);
    ctx.fillStyle = isLegal ? b.col : '#1c1010';
    rrect(b.x, b.y, b.w, b.h, 6);
    ctx.fill();
    ctx.strokeStyle = isLegal ? 'rgba(255,255,255,0.3)' : '#2a1515';
    ctx.lineWidth = 1.5;
    rrect(b.x, b.y, b.w, b.h, 6);
    ctx.stroke();

    ctx.fillStyle = isLegal ? '#ffffff' : '#6b7280';
    ctx.font = 'bold 11px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(b.label, b.x + b.w / 2, b.y + b.h / 2);
  }
  ctx.textBaseline = 'alphabetic';

  // Game over overlay
  if (isOver(state)) {
    ctx.fillStyle = 'rgba(5, 2, 2, 0.88)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = state.victory ? '#10b981' : '#ef4444';
    ctx.font = 'bold 30px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(state.victory ? 'RACE CONQUERED!' : 'CARNAGE TOTALED', W / 2, H / 2 - 40);
    ctx.fillStyle = '#f4f4f5';
    ctx.font = '18px system-ui, sans-serif';
    ctx.fillText('Score: ' + score(state) + '  (Best: ' + best + ')', W / 2, H / 2);
    ctx.fillText('Wrecks: ' + state.rivalsWrecked + '  Distance: ' + state.raceDistance + 'km', W / 2, H / 2 + 28);
    ctx.fillStyle = '#38bdf8';
    ctx.font = 'bold 16px system-ui, sans-serif';
    ctx.fillText('Tap to race again', W / 2, H / 2 + 70);
  }
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  draw(dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

const inApk = window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform();
if (!inApk && 'serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
