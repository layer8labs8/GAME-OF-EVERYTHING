<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="reactorBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#083344" />
      <stop offset="60%" stop-color="#0c1829" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <radialGradient id="plasmaCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#reactorBg)" />
  <!-- Outer magnetic containment coils -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#0284c7" stroke-width="8" stroke-dasharray="24 16" />
  <circle cx="256" cy="256" r="150" fill="none" stroke="#38bdf8" stroke-width="12" />
  <circle cx="256" cy="256" r="110" fill="none" stroke="#a5f3fc" stroke-width="6" opacity="0.6" />
  <!-- Radiant Core -->
  <circle cx="256" cy="256" r="85" fill="url(#plasmaCore)" />
  <circle cx="256" cy="256" r="35" fill="#ffffff" />
  <!-- Magnetic Spoke Nodes -->
  <rect x="246" y="70" width="20" height="40" rx="4" fill="#38bdf8" />
  <rect x="246" y="402" width="20" height="40" rx="4" fill="#38bdf8" />
  <rect x="70" y="246" width="40" height="20" rx="4" fill="#38bdf8" />
  <rect x="402" y="246" width="40" height="20" rx="4" fill="#38bdf8" />
</svg>
