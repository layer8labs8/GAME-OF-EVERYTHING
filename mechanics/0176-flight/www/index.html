<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aero Ace - Flight Simulator</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #032b43;
      color: #f0f9ff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
      padding: 8px;
    }
    header {
      width: 100%;
      max-width: 640px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 12px;
      background: #0b4f6c;
      border: 1px solid #38bdf8;
      border-radius: 8px;
      margin-bottom: 6px;
    }
    h1 {
      font-size: 1.05rem;
      font-weight: 700;
      color: #38bdf8;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .badge {
      font-size: 0.72rem;
      padding: 2px 8px;
      border-radius: 4px;
      background: #0284c7;
      color: #f0f9ff;
      font-weight: 600;
    }
    #game-container {
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    canvas {
      width: 100%;
      height: auto;
      aspect-ratio: 4/3;
      background: #011627;
      border: 2px solid #38bdf8;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(56, 189, 248, 0.25);
    }
    .vitals-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      width: 100%;
    }
    .vital-card {
      background: #0b4f6c;
      border: 1px solid #0284c7;
      border-radius: 6px;
      padding: 6px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .vital-title {
      font-size: 0.65rem;
      color: #bae6fd;
      text-transform: uppercase;
      font-weight: bold;
    }
    .vital-val {
      font-size: 0.95rem;
      font-weight: bold;
      color: #fff;
    }
    .meter-bar {
      height: 4px;
      background: #011627;
      border-radius: 2px;
      overflow: hidden;
      margin-top: 2px;
    }
    .meter-fill {
      height: 100%;
      background: #38bdf8;
      transition: width 0.2s ease;
    }
    #message-box {
      background: #083344;
      border-left: 4px solid #38bdf8;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 0.8rem;
      min-height: 38px;
      display: flex;
      align-items: center;
      color: #e0f2fe;
    }
    #actions-panel {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      width: 100%;
    }
    .btn {
      background: #0c4a6e;
      border: 1px solid #0284c7;
      color: #fff;
      padding: 10px 8px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      transition: all 0.1s ease;
    }
    .btn:active {
      transform: scale(0.97);
      filter: brightness(1.2);
    }
    .btn-thrust {
      background: #0369a1;
      border-color: #38bdf8;
      color: #f0f9ff;
    }
    .btn-pitch {
      background: #1e3a8a;
      border-color: #60a5fa;
      color: #eff6ff;
    }
    .btn-bank {
      background: #4338ca;
      border-color: #818cf8;
      color: #eef2ff;
    }
    .btn-gear {
      background: #b45309;
      border-color: #f59e0b;
      color: #fefce8;
    }
    .top-controls {
      display: flex;
      gap: 6px;
    }
    .ctrl-btn {
      background: #0b4f6c;
      border: 1px solid #38bdf8;
      color: #38bdf8;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      cursor: pointer;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <header>
    <h1>Aero Ace</h1>
    <div class="top-controls">
      <button class="ctrl-btn" id="bot-toggle-btn" onclick="window.toggleBot()">BOT: OFF</button>
      <button class="ctrl-btn" onclick="window.restartGame()">RESTART</button>
      <span class="badge" id="turn-badge">TURN 0/100</span>
    </div>
  </header>

  <div id="game-container">
    <canvas id="gameCanvas" width="640" height="480"></canvas>

    <div class="vitals-grid">
      <div class="vital-card">
        <span class="vital-title">Altitude (ft)</span>
        <span class="vital-val" id="val-alt">1,200 ft</span>
        <div class="meter-bar"><div class="meter-fill" id="fill-alt" style="width:24%"></div></div>
      </div>
      <div class="vital-card">
        <span class="vital-title">Airspeed (kts)</span>
        <span class="vital-val" id="val-speed">130 kts</span>
        <div class="meter-bar"><div class="meter-fill" id="fill-speed" style="width:43%;background:#22c55e"></div></div>
      </div>
      <div class="vital-card">
        <span class="vital-title">Throttle / Fuel</span>
        <span class="vital-val" id="val-thrust">60% | 100%</span>
        <div class="meter-bar"><div class="meter-fill" id="fill-fuel" style="width:100%;background:#eab308"></div></div>
      </div>
      <div class="vital-card">
        <span class="vital-title">Sky Rings / Gear</span>
        <span class="vital-val" id="val-rings">0/5 | UP</span>
        <div class="meter-bar"><div class="meter-fill" id="fill-rings" style="width:0%;background:#a855f7"></div></div>
      </div>
    </div>

    <div id="message-box">Aircraft cruising at 1,200 ft. Line up through the first aerial sky ring.</div>

    <div id="actions-panel"></div>
  </div>

  <script src="logic.js"></script>
  <script>
    let state = createState(Date.now ? Date.now() : 12345);
    let botRunning = false;
    let botInterval = null;

    // Web Audio Synthesizer
    const audioCtx = (typeof AudioContext !== 'undefined' || typeof webkitAudioContext !== 'undefined')
      ? new (window.AudioContext || window.webkitAudioContext)()
      : null;

    function playSfx(type) {
      if (!audioCtx) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      const t = audioCtx.currentTime;

      if (type === 'thrust') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(110, t);
        osc.frequency.linearRampToValueAtTime(150, t + 0.15);
        gain.gain.setValueAtTime(0.12, t);
        gain.gain.linearRampToValueAtTime(0.01, t + 0.15);
        osc.start(t);
        osc.stop(t + 0.15);
      } else if (type === 'gear') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(220, t);
        osc.frequency.linearRampToValueAtTime(80, t + 0.2);
        gain.gain.setValueAtTime(0.2, t);
        gain.gain.linearRampToValueAtTime(0.01, t + 0.2);
        osc.start(t);
        osc.stop(t + 0.2);
      } else if (type === 'ring') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587, t);
        osc.frequency.setValueAtTime(880, t + 0.1);
        gain.gain.setValueAtTime(0.2, t);
        gain.gain.linearRampToValueAtTime(0.01, t + 0.25);
        osc.start(t);
        osc.stop(t + 0.25);
      } else if (type === 'crash') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(90, t);
        osc.frequency.linearRampToValueAtTime(30, t + 0.4);
        gain.gain.setValueAtTime(0.3, t);
        gain.gain.linearRampToValueAtTime(0.01, t + 0.4);
        osc.start(t);
        osc.stop(t + 0.4);
      }
    }

    function render() {
      // Vitals UI
      document.getElementById('turn-badge').textContent = 'TURN ' + state.turns + '/' + state.maxTurns;
      document.getElementById('val-alt').textContent = state.altitude + ' ft';
      document.getElementById('fill-alt').style.width = Math.min(100, (state.altitude / 5000) * 100) + '%';

      document.getElementById('val-speed').textContent = state.airspeed + ' kts';
      document.getElementById('fill-speed').style.width = Math.min(100, (state.airspeed / 280) * 100) + '%';
      document.getElementById('fill-speed').style.background = state.airspeed < 80 ? '#ef4444' : '#22c55e';

      document.getElementById('val-thrust').textContent = state.throttle + '% | ' + state.fuel + '%';
      document.getElementById('fill-fuel').style.width = Math.max(0, state.fuel) + '%';

      document.getElementById('val-rings').textContent = state.ringsPassed + '/5 | ' + (state.landingGear ? 'GEAR DN' : 'GEAR UP');
      document.getElementById('fill-rings').style.width = ((state.ringsPassed / 5) * 100) + '%';

      document.getElementById('message-box').textContent = state.gameMessage;

      // Canvas Artificial Horizon & Flight View
      const canvas = document.getElementById('gameCanvas');
      if (!canvas || !canvas.getContext) return;
      const ctx = canvas.getContext('2d');
      const w = canvas.width;
      const h = canvas.height;
      const cx = w / 2;
      const cy = h / 2;

      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate((-state.bank * Math.PI) / 180);

      // Pitch vertical displacement: positive pitch moves horizon down
      const horizonOffset = state.pitch * 6;

      // 1. Sky Half
      ctx.fillStyle = '#0284c7';
      ctx.fillRect(-w, -h * 2 + horizonOffset, w * 2, h * 2);

      // 2. Earth / Ocean Half
      ctx.fillStyle = '#064e3b';
      ctx.fillRect(-w, horizonOffset, w * 2, h * 2);

      // Horizon Line
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(-w, horizonOffset);
      ctx.lineTo(w, horizonOffset);
      ctx.stroke();

      // Pitch Ladder Marks (-20, -10, +10, +20)
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
      ctx.lineWidth = 2;
      ctx.font = '10px sans-serif';
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'right';

      for (let p = -30; p <= 30; p += 10) {
        if (p === 0) continue;
        const py = horizonOffset - p * 6;
        const markW = 35;
        ctx.beginPath();
        ctx.moveTo(-markW, py);
        ctx.lineTo(markW, py);
        ctx.stroke();
        ctx.fillText(p + '°', -markW - 4, py + 3);
      }

      // Next Sky Ring in 3D Perspective Projection
      if (state.currentRingIndex < SKY_RINGS.length) {
        const ring = SKY_RINGS[state.currentRingIndex];
        const distToRing = ring.distance - state.flightDistance;

        if (distToRing > -50 && distToRing < 500) {
          const scale = Math.max(0.2, 1 - distToRing / 500);
          const ringRad = 70 * scale;
          const altDiff = ring.targetAltitude - state.altitude;
          const ry = horizonOffset - (altDiff * 0.12) * scale;
          const rx = (ring.targetBank - state.bank) * 8 * scale;

          // Outer glowing ring
          ctx.strokeStyle = '#f59e0b';
          ctx.lineWidth = 10 * scale;
          ctx.beginPath();
          ctx.arc(rx, ry, ringRad, 0, Math.PI * 2);
          ctx.stroke();

          // Inner ring border
          ctx.strokeStyle = '#fef08a';
          ctx.lineWidth = 4 * scale;
          ctx.beginPath();
          ctx.arc(rx, ry, ringRad * 0.9, 0, Math.PI * 2);
          ctx.stroke();

          // Ring Target Tag
          ctx.fillStyle = '#fef08a';
          ctx.font = 'bold ' + Math.floor(13 * scale) + 'px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('RING ' + (state.currentRingIndex + 1) + ' (' + ring.targetAltitude + 'ft)', rx, ry - ringRad - 6);
        }
      }

      // Runway Visual on Final Sector
      if (state.flightDistance >= 1200) {
        const distToRunway = RUNWAY_DISTANCE - state.flightDistance;
        const scale = Math.max(0.1, 1 - distToRunway / 450);
        const rwyY = horizonOffset;
        const rwTopW = 20 * scale;
        const rwBottomW = 120 * scale;
        const rwLen = 140 * scale;

        ctx.fillStyle = '#1e293b';
        ctx.beginPath();
        ctx.moveTo(-rwTopW / 2, rwyY);
        ctx.lineTo(rwTopW / 2, rwyY);
        ctx.lineTo(rwBottomW / 2, rwyY + rwLen);
        ctx.lineTo(-rwBottomW / 2, rwyY + rwLen);
        ctx.closePath();
        ctx.fill();

        // Runway Centerline
        ctx.strokeStyle = '#f8fafc';
        ctx.setLineDash([8, 8]);
        ctx.lineWidth = 3 * scale;
        ctx.beginPath();
        ctx.moveTo(0, rwyY);
        ctx.lineTo(0, rwyY + rwLen);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      ctx.restore();

      // Fixed Aircraft Crosshair Reticle at Center
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 3;
      // Center dot
      ctx.fillStyle = '#38bdf8';
      ctx.beginPath();
      ctx.arc(cx, cy, 4, 0, Math.PI * 2);
      ctx.fill();
      // Reticle wings
      ctx.beginPath();
      ctx.moveTo(cx - 45, cy);
      ctx.lineTo(cx - 15, cy);
      ctx.lineTo(cx - 15, cy + 10);
      ctx.moveTo(cx + 45, cy);
      ctx.lineTo(cx + 15, cy);
      ctx.lineTo(cx + 15, cy + 10);
      ctx.stroke();

      // Stall Warning Banner
      if (state.isStalling) {
        ctx.fillStyle = 'rgba(239, 68, 68, 0.85)';
        ctx.fillRect(cx - 120, cy - 80, 240, 36);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 16px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('STALL WARNING!', cx, cy - 56);
      }

      // Game Over Screen Overlay
      if (isOver(state)) {
        ctx.fillStyle = state.victory ? 'rgba(6, 78, 59, 0.9)' : 'rgba(69, 10, 10, 0.9)';
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 24px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(state.victory ? 'MISSION ACCOMPLISHED - SAFE LANDING!' : 'FLIGHT TERMINATED - CRASH', cx, cy - 20);
        ctx.font = '14px sans-serif';
        ctx.fillText('Aviator Evaluation Score: ' + score(state), cx, cy + 15);
      }

      updateActions();
    }

    function updateActions() {
      const panel = document.getElementById('actions-panel');
      if (isOver(state)) {
        panel.innerHTML = '<button class="btn btn-thrust" onclick="window.restartGame()">NEW FLIGHT FLIGHTPLAN</button>';
        return;
      }

      const actions = legalActions(state);
      let html = '';

      for (const act of actions) {
        let cls = 'btn';
        let label = act;
        let sub = '';

        if (act === 'action:throttle_increase') {
          cls += ' btn-thrust';
          label = '⚡ Throttle Up (+20%)';
          sub = 'Gain Thrust & Speed';
        } else if (act === 'action:throttle_decrease') {
          cls += ' btn-thrust';
          label = '📉 Throttle Down (-20%)';
          sub = 'Slow Airspeed';
        } else if (act === 'action:pitch_up') {
          cls += ' btn-pitch';
          label = '⬆️ Pitch Up (Climb)';
          sub = 'Stick Back (+8° Angle)';
        } else if (act === 'action:pitch_down') {
          cls += ' btn-pitch';
          label = '⬇️ Pitch Down (Dive)';
          sub = 'Stick Forward (-8° Angle)';
        } else if (act === 'action:bank_left') {
          cls += ' btn-bank';
          label = '◀ Bank Left';
          sub = 'Roll -10° Left';
        } else if (act === 'action:bank_right') {
          cls += ' btn-bank';
          label = '▶ Bank Right';
          sub = 'Roll +10° Right';
        } else if (act === 'action:level_wings') {
          cls += ' btn-pitch';
          label = '⚖️ Level Wings';
          sub = 'Auto-Trim Horizon';
        } else if (act === 'action:toggle_landing_gear') {
          cls += ' btn-gear';
          label = state.landingGear ? '⚙️ Retract Gear' : '⚙️ Deploy Gear Down';
          sub = state.landingGear ? 'Reduce Drag' : 'Mandatory for Landing';
        }

        html += '<button class="' + cls + '" onclick="window.triggerAction(\'' + act + '\')"><span>' + label + '</span>' + (sub ? '<span style="font-size:0.62rem;opacity:0.8;">' + sub + '</span>' : '') + '</button>';
      }

      panel.innerHTML = html;
    }

    window.triggerAction = function(act) {
      if (isOver(state)) return;
      if (act.includes('throttle')) playSfx('thrust');
      else if (act.includes('gear')) playSfx('gear');

      const oldRings = state.ringsPassed;
      step(state, act);

      if (state.ringsPassed > oldRings) playSfx('ring');
      if (state.defeat) playSfx('crash');
      render();
    };

    window.restartGame = function() {
      state = createState(Date.now ? Date.now() : 12345);
      render();
    };

    window.toggleBot = function() {
      botRunning = !botRunning;
      const btn = document.getElementById('bot-toggle-btn');
      if (btn) {
        btn.textContent = botRunning ? 'BOT: ON' : 'BOT: OFF';
        btn.style.background = botRunning ? '#0284c7' : '#0b4f6c';
      }

      if (botRunning) {
        botInterval = setInterval(() => {
          if (isOver(state)) {
            state = createState(Date.now ? Date.now() : 9999);
            render();
            return;
          }
          const acts = legalActions(state);
          if (acts.length > 0) {
            let choice = acts[0];
            // Intelligent flight navigation autopilot
            if (state.flightDistance >= RUNWAY_DISTANCE - 100) {
              if (!state.landingGear && acts.includes('action:toggle_landing_gear')) choice = 'action:toggle_landing_gear';
              else if (state.altitude > 100 && acts.includes('action:pitch_down')) choice = 'action:pitch_down';
              else if (state.airspeed > 120 && acts.includes('action:throttle_decrease')) choice = 'action:throttle_decrease';
              else if (acts.includes('action:level_wings')) choice = 'action:level_wings';
            } else if (state.currentRingIndex < SKY_RINGS.length) {
              const target = SKY_RINGS[state.currentRingIndex];
              if (state.altitude < target.targetAltitude - 150 && acts.includes('action:pitch_up')) choice = 'action:pitch_up';
              else if (state.altitude > target.targetAltitude + 150 && acts.includes('action:pitch_down')) choice = 'action:pitch_down';
              else if (state.bank < target.targetBank - 10 && acts.includes('action:bank_right')) choice = 'action:bank_right';
              else if (state.bank > target.targetBank + 10 && acts.includes('action:bank_left')) choice = 'action:bank_left';
              else if (state.airspeed < 110 && acts.includes('action:throttle_increase')) choice = 'action:throttle_increase';
              else if (acts.includes('action:level_wings')) choice = 'action:level_wings';
            }

            window.triggerAction(choice);
          }
        }, 250);
      } else {
        clearInterval(botInterval);
      }
    };

    render();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
