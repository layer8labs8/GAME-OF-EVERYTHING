<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#03080e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Peak Climber</title>
<style>
  html, body { margin: 0; height: 100%; background: #03080e; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; margin: 0 auto; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="logic.js"></script>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const W = 360;
const H = 640;
let scale = 1;

function resize() {
  scale = Math.min(innerWidth / W, innerHeight / H);
  const dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.style.width = W * scale + 'px';
  canvas.style.height = H * scale + 'px';
  canvas.width = Math.round(W * scale * dpr);
  canvas.height = Math.round(H * scale * dpr);
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
}
addEventListener('resize', resize);
resize();

function rrect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

let best = 0;
try { best = +localStorage.getItem('goe-0175-best') || 0; } catch (e) {}

let state = createState(Date.now());
let visualPitch = 0;
let floaters = [];
let overAt = 0;

function restart() {
  state = createState(Date.now());
  visualPitch = 0;
  floaters = [];
  overAt = 0;
}

function getTerrainY(worldX) {
  return 360 - (Math.sin(worldX * 0.04) * 45 + Math.sin(worldX * 0.015) * 35);
}

function performAction(act) {
  if (isOver(state)) return;
  const legals = legalActions(state);
  if (!legals.includes(act)) return;

  const oldCoins = state.coins;
  const oldFuel = state.fuel;
  const res = step(state, act);

  if (act.includes('gas')) {
    floaters.push({ text: 'GAS +' + state.velocity + 'm/s', x: 180, y: 260, t: 0, color: '#10b981' });
  } else if (act.includes('brake')) {
    floaters.push({ text: 'BRAKE', x: 180, y: 260, t: 0, color: '#ef4444' });
  } else if (act.includes('tilt')) {
    floaters.push({ text: 'BALANCE ' + state.pitchAngle + '°', x: 180, y: 260, t: 0, color: '#38bdf8' });
  } else if (act.includes('upgrade')) {
    floaters.push({ text: 'UPGRADE APPLIED!', x: 180, y: 260, t: 0, color: '#fbbf24' });
  }

  if (state.coins > oldCoins) {
    floaters.push({ text: '+' + (state.coins - oldCoins) + ' COINS', x: 220, y: 240, t: 0, color: '#facc15' });
  }
  if (state.fuel > oldFuel) {
    floaters.push({ text: '+FUEL CANISTER', x: 140, y: 240, t: 0, color: '#ef4444' });
  }

  if (isOver(state)) {
    overAt = performance.now();
    const sc = score(state);
    if (sc > best) {
      best = sc;
      try { localStorage.setItem('goe-0175-best', best); } catch (e) {}
    }
  }
}

// Action button hitboxes on canvas
const BTNS = [
  { id: 'brake', label: '◀ BRAKE', action: 'action:brake_reverse', x: 20, y: 480, w: 90, h: 56, col: '#ef4444' },
  { id: 'tilt_fwd', label: 'TILT DN ⤵', action: 'action:tilt_forward', x: 120, y: 480, w: 55, h: 56, col: '#0284c7' },
  { id: 'tilt_back', label: '⤴ TILT UP', action: 'action:tilt_backward', x: 185, y: 480, w: 55, h: 56, col: '#0284c7' },
  { id: 'gas', label: 'GAS ▲', action: 'action:gas_accelerate', x: 250, y: 480, w: 90, h: 56, col: '#10b981' },
  { id: 'upg_eng', label: 'ENGINE +', action: 'action:upgrade_vehicle:engine', x: 20, y: 550, w: 100, h: 42, col: '#f59e0b' },
  { id: 'upg_susp', label: 'SUSPENSION +', action: 'action:upgrade_vehicle:suspension', x: 130, y: 550, w: 100, h: 42, col: '#8b5cf6' },
  { id: 'upg_tires', label: 'TIRES +', action: 'action:upgrade_vehicle:tires', x: 240, y: 550, w: 100, h: 42, col: '#06b6d4' },
];

function toLogical(e) {
  const rect = canvas.getBoundingClientRect();
  return { x: (e.clientX - rect.left) / scale, y: (e.clientY - rect.top) / scale };
}

canvas.addEventListener('pointerdown', (e) => {
  const p = toLogical(e);
  if (isOver(state)) {
    if (performance.now() - overAt > 400) restart();
    return;
  }
  for (const b of BTNS) {
    if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) {
      performAction(b.action);
      return;
    }
  }
  // Tap upper half: left=tilt back, right=gas, bottom-left=brake
  if (p.y < 470) {
    if (p.x > 200) performAction('action:gas_accelerate');
    else if (p.x < 100) performAction('action:brake_reverse');
    else performAction('action:tilt_forward');
  }
});

addEventListener('keydown', (e) => {
  if (isOver(state)) {
    if ((e.key === ' ' || e.key === 'Enter') && performance.now() - overAt > 400) restart();
    return;
  }
  const k = e.key.toLowerCase();
  if (k === 'arrowright' || k === 'd' || k === ' ') performAction('action:gas_accelerate');
  else if (k === 'arrowleft' || k === 'a') performAction('action:brake_reverse');
  else if (k === 'arrowdown' || k === 's') performAction('action:tilt_forward');
  else if (k === 'arrowup' || k === 'w') performAction('action:tilt_backward');
  else if (k === '1') performAction('action:upgrade_vehicle:engine');
  else if (k === '2') performAction('action:upgrade_vehicle:suspension');
  else if (k === '3') performAction('action:upgrade_vehicle:tires');
});

function draw(dt) {
  // Background Sky Gradient
  const grad = ctx.createLinearGradient(0, 0, 0, 400);
  grad.addColorStop(0, '#03080e');
  grad.addColorStop(1, '#0e2a47');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Smooth visual pitch lerp
  visualPitch += (state.pitchAngle - visualPitch) * Math.min(1, dt * 10);

  // Mountain Terrain
  const carWorldX = state.distance;
  ctx.beginPath();
  ctx.moveTo(0, H);
  for (let sx = 0; sx <= W; sx += 8) {
    const wx = carWorldX + (sx - 150);
    const sy = getTerrainY(wx);
    if (sx === 0) ctx.lineTo(sx, sy);
    else ctx.lineTo(sx, sy);
  }
  ctx.lineTo(W, H);
  ctx.closePath();

  // Terrain fill
  ctx.fillStyle = '#143322';
  ctx.fill();

  // Grass cap
  ctx.strokeStyle = '#22c55e';
  ctx.lineWidth = 4;
  ctx.beginPath();
  for (let sx = 0; sx <= W; sx += 8) {
    const wx = carWorldX + (sx - 150);
    const sy = getTerrainY(wx);
    if (sx === 0) ctx.moveTo(sx, sy);
    else ctx.lineTo(sx, sy);
  }
  ctx.stroke();

  // Draw 4x4 Rig at fixed screen center (x=150, y=getTerrainY(carWorldX))
  const carSX = 150;
  const carSY = getTerrainY(carWorldX) - 12;

  ctx.save();
  ctx.translate(carSX, carSY);
  ctx.rotate((visualPitch * Math.PI) / 180);

  // Chassis
  ctx.fillStyle = '#0284c7';
  rrect(-24, -18, 48, 20, 4);
  ctx.fill();
  ctx.fillStyle = '#38bdf8';
  rrect(-12, -28, 26, 12, 3);
  ctx.fill();

  // Roll cage
  ctx.strokeStyle = '#e2e8f0';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-14, -8);
  ctx.lineTo(-8, -28);
  ctx.lineTo(14, -28);
  ctx.lineTo(20, -8);
  ctx.stroke();

  // Wheels
  ctx.fillStyle = '#0f172a';
  ctx.beginPath();
  ctx.arc(-16, 6, 9, 0, Math.PI * 2);
  ctx.arc(16, 6, 9, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#94a3b8';
  ctx.beginPath();
  ctx.arc(-16, 6, 4, 0, Math.PI * 2);
  ctx.arc(16, 6, 4, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();

  // Top HUD
  ctx.fillStyle = 'rgba(3, 8, 14, 0.88)';
  ctx.fillRect(0, 0, W, 48);

  ctx.fillStyle = '#38bdf8';
  ctx.font = 'bold 15px system-ui, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('PEAK: ' + state.distance + '/1000 M', 12, 22);

  ctx.textAlign = 'right';
  ctx.fillStyle = '#facc15';
  ctx.fillText('COINS: ' + state.coins + ' 🪙', W - 12, 22);

  // Bars: Fuel & Angle
  ctx.font = '10px system-ui, sans-serif';
  ctx.fillStyle = '#94a3b8';
  ctx.textAlign = 'left';
  ctx.fillText('FUEL ' + state.fuel + '%', 12, 38);
  ctx.fillStyle = '#334155';
  ctx.fillRect(66, 30, 80, 8);
  ctx.fillStyle = state.fuel > 25 ? '#ef4444' : '#b91c1c';
  ctx.fillRect(66, 30, 80 * (state.fuel / 100), 8);

  ctx.fillStyle = '#94a3b8';
  ctx.fillText('TILT ' + state.pitchAngle + '°', 160, 38);
  ctx.fillStyle = '#10b981';
  ctx.textAlign = 'right';
  ctx.fillText('SPEED ' + state.velocity + ' m/s', W - 12, 38);

  // Floating text
  for (let i = floaters.length - 1; i >= 0; i--) {
    const f = floaters[i];
    f.y -= 35 * dt;
    f.t += dt;
    if (f.t > 0.8) {
      floaters.splice(i, 1);
      continue;
    }
    ctx.fillStyle = f.color;
    ctx.font = 'bold 15px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(f.text, f.x, f.y);
  }

  // Draw Control Deck
  ctx.fillStyle = '#06101c';
  ctx.fillRect(0, 460, W, 180);
  ctx.fillStyle = '#0284c7';
  ctx.fillRect(0, 458, W, 2);

  const legals = legalActions(state);
  for (const b of BTNS) {
    const isLegal = legals.includes(b.action);
    ctx.fillStyle = isLegal ? b.col : '#1e293b';
    rrect(b.x, b.y, b.w, b.h, 6);
    ctx.fill();
    ctx.strokeStyle = isLegal ? 'rgba(255,255,255,0.3)' : '#334155';
    ctx.lineWidth = 1.5;
    rrect(b.x, b.y, b.w, b.h, 6);
    ctx.stroke();

    ctx.fillStyle = isLegal ? '#ffffff' : '#64748b';
    ctx.font = 'bold 11px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(b.label, b.x + b.w / 2, b.y + b.h / 2);
  }
  ctx.textBaseline = 'alphabetic';

  // Game over overlay
  if (isOver(state)) {
    ctx.fillStyle = 'rgba(3, 8, 14, 0.9)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = state.victory ? '#10b981' : '#ef4444';
    ctx.font = 'bold 30px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(state.victory ? 'SUMMIT CONQUERED!' : 'ROLLOVER CRASH', W / 2, H / 2 - 40);
    ctx.fillStyle = '#f1f5f9';
    ctx.font = '18px system-ui, sans-serif';
    ctx.fillText('Score: ' + score(state) + '  (Best: ' + best + ')', W / 2, H / 2);
    ctx.fillText('Climbed: ' + state.distance + 'm  Coins: ' + state.coins, W / 2, H / 2 + 28);
    ctx.fillStyle = '#38bdf8';
    ctx.font = 'bold 16px system-ui, sans-serif';
    ctx.fillText('Tap to climb again', W / 2, H / 2 + 70);
  }
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  draw(dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

const inApk = window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform();
if (!inApk && 'serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
