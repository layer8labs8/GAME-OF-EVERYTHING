  <line x1="175" y1="275" x2="337" y2="275" stroke="#334155" stroke-width="4" />
  <line x1="175" y1="295" x2="337" y2="295" stroke="#334155" stroke-width="4" />
  <line x1="175" y1="315" x2="337" y2="315" stroke="#334155" stroke-width="4" />
  <line x1="175" y1="335" x2="337" y2="335" stroke="#334155" stroke-width="4" />
  <!-- Headlights -->
  <circle cx="160" cy="360" r="18" fill="#fef08a" stroke="#ca8a04" stroke-width="3" />
  <circle cx="352" cy="360" r="18" fill="#fef08a" stroke="#ca8a04" stroke-width="3" />
  <!-- Roof Clearance Lights -->
  <circle cx="216" cy="118" r="6" fill="#f97316" />
  <circle cx="256" cy="118" r="6" fill="#f97316" />
  <circle cx="296" cy="118" r="6" fill="#f97316" />
