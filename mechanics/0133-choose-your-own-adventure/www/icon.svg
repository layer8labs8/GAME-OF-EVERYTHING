<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="120" fill="url(#bg)"/>
  <!-- Parchment page -->
  <rect x="100" y="80" width="312" height="352" rx="20" fill="#fef3c7" stroke="url(#gold)" stroke-width="12"/>
  <!-- Text lines on page -->
  <line x1="140" y1="130" x2="370" y2="130" stroke="#78350f" stroke-width="8" stroke-linecap="round"/>
  <line x1="140" y1="165" x2="340" y2="165" stroke="#78350f" stroke-width="8" stroke-linecap="round"/>
  <line x1="140" y1="200" x2="370" y2="200" stroke="#78350f" stroke-width="8" stroke-linecap="round"/>
  <!-- Choice buttons on page -->
  <rect x="140" y="240" width="232" height="36" rx="8" fill="#b45309"/>
  <line x1="160" y1="258" x2="280" y2="258" stroke="#fef3c7" stroke-width="6" stroke-linecap="round"/>
  <rect x="140" y="290" width="232" height="36" rx="8" fill="#b45309"/>
  <line x1="160" y1="308" x2="260" y2="308" stroke="#fef3c7" stroke-width="6" stroke-linecap="round"/>
  <!-- 20-sided die symbol -->
  <polygon points="256,345 295,375 280,415 232,415 217,375" fill="#f59e0b" stroke="#78350f" stroke-width="4"/>
</svg>
