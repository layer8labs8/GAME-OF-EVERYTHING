<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Royal Dice - Dice Game</title>
  <link rel="manifest" href="./manifest.json">
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }
    body {
      background: #061019;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }
    #game-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 500px;
      gap: 10px;
    }
    .hud {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f1c2b;
      border: 1px solid #1e3a5f;
      border-radius: 10px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 700;
    }
    .badge-gold { color: #f59e0b; }
    .badge-blue { color: #38bdf8; }
    .badge-emerald { color: #10b981; }
    
    canvas {
      width: 100%;
      max-width: 480px;
      height: 110px;
      background: #07251e;
      border: 2px solid #047857;
      border-radius: 12px;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.6);
      cursor: pointer;
      display: block;
    }
    .controls-row {
      width: 100%;
      display: flex;
      gap: 8px;
    }
    .btn-roll {
      flex: 1;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #0f172a;
      border: none;
      border-radius: 8px;
      padding: 10px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(217, 119, 6, 0.4);
      transition: all 0.1s;
    }
    .btn-roll:disabled {
      background: #334155;
      color: #64748b;
      box-shadow: none;
      cursor: not-allowed;
    }
    .scorecard-grid {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      max-height: 270px;
      overflow-y: auto;
    }
    .cat-btn {
      background: #0f1c2b;
      border: 1px solid #1e3a5f;
      border-radius: 6px;
      padding: 6px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: #e2e8f0;
      cursor: pointer;
      transition: all 0.1s;
    }
    .cat-btn:hover:not(:disabled) {
      background: #1e3a5f;
      border-color: #38bdf8;
    }
    .cat-btn.scored {
      background: #09121d;
      color: #94a3b8;
      cursor: default;
    }
    .cat-score {
      font-weight: bold;
      color: #f59e0b;
    }
    .cat-preview {
      font-weight: bold;
      color: #38bdf8;
      opacity: 0.7;
    }
    .message-bar {
      font-size: 12px;
      color: #94a3b8;
      text-align: center;
      min-height: 18px;
    }
    .footer {
      display: flex;
      justify-content: space-between;
      width: 100%;
      font-size: 11px;
      color: #64748b;
      align-items: center;
    }
    .btn-sm {
      background: transparent;
      border: 1px solid #334155;
      color: #94a3b8;
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <div class="hud">
      <div class="badge-blue" id="round-display">ROUND 1/13</div>
      <div class="badge-gold" id="bonus-display">BONUS: 0/63</div>
      <div class="badge-emerald" id="score-display">TOTAL: 0</div>
    </div>

    <!-- Dice Table Canvas -->
    <canvas id="canvas" width="480" height="110"></canvas>

    <div class="controls-row">
      <button class="btn-roll" id="btn-roll">ROLL DICE (2 left)</button>
    </div>

    <div class="scorecard-grid" id="scorecard-grid">
      <!-- Upper Section -->
      <button class="cat-btn" data-cat="ones"><span>Ones</span><span class="cat-score">-</span></button>
      <button class="cat-btn" data-cat="three_of_a_kind"><span>3 of a Kind</span><span class="cat-score">-</span></button>
      <button class="cat-btn" data-cat="twos"><span>Twos</span><span class="cat-score">-</span></button>
      <button class="cat-btn" data-cat="four_of_a_kind"><span>4 of a Kind</span><span class="cat-score">-</span></button>
      <button class="cat-btn" data-cat="threes"><span>Threes</span><span class="cat-score">-</span></button>
      <button class="cat-btn" data-cat="full_house"><span>Full House (25)</span><span class="cat-score">-</span></button>
      <button class="cat-btn" data-cat="fours"><span>Fours</span><span class="cat-score">-</span></button>
      <button class="cat-btn" data-cat="small_straight"><span>Sm. Straight (30)</span><span class="cat-score">-</span></button>
      <button class="cat-btn" data-cat="fives"><span>Fives</span><span class="cat-score">-</span></button>
      <button class="cat-btn" data-cat="large_straight"><span>Lg. Straight (40)</span><span class="cat-score">-</span></button>
      <button class="cat-btn" data-cat="sixes"><span>Sixes</span><span class="cat-score">-</span></button>
      <button class="cat-btn" data-cat="yacht"><span>Yacht (50)</span><span class="cat-score">-</span></button>
      <div></div>
      <button class="cat-btn" data-cat="chance"><span>Chance</span><span class="cat-score">-</span></button>
    </div>

    <div class="message-bar" id="message-display">Tap dice to hold/unlock, then roll or score.</div>

    <div class="footer">
      <span>Tap die to lock. Click category to score.</span>
      <button class="btn-sm" id="btn-restart">Restart (R)</button>
    </div>
  </div>

  <script src="logic.js"></script>
  <script>
    (function() {
      const canvas = document.getElementById('canvas');
      const ctx = (canvas && typeof canvas.getContext === 'function') ? canvas.getContext('2d') : null;

      let state = createState(Math.floor(Math.random() * 100000) + 1);

      // Web Audio Synth
      let audioCtx = null;
      function getAudio() {
        if (!audioCtx && typeof AudioContext !== 'undefined') {
          audioCtx = new AudioContext();
        }
        return audioCtx;
      }
      function playTone(freq, type, duration, gainVal = 0.08) {
        try {
          const actx = getAudio();
          if (!actx) return;
          const osc = actx.createOscillator();
          const gain = actx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, actx.currentTime);
          gain.gain.setValueAtTime(gainVal, actx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + duration);
          osc.connect(gain);
          gain.connect(actx.destination);
          osc.start();
          osc.stop(actx.currentTime + duration);
        } catch (e) {}
      }

      function playSound(type) {
        if (type === 'hold') playTone(400, 'sine', 0.05, 0.05);
        else if (type === 'roll') {
          playTone(150, 'triangle', 0.08, 0.1);
          setTimeout(() => playTone(220, 'triangle', 0.08, 0.1), 60);
          setTimeout(() => playTone(180, 'triangle', 0.1, 0.1), 120);
        } else if (type === 'score') {
          playTone(523, 'sine', 0.12, 0.1);
          setTimeout(() => playTone(659, 'sine', 0.18, 0.12), 90);
        } else if (type === 'yacht') {
          playTone(523, 'triangle', 0.15, 0.15);
          setTimeout(() => playTone(659, 'triangle', 0.15, 0.15), 100);
          setTimeout(() => playTone(784, 'triangle', 0.15, 0.15), 200);
          setTimeout(() => playTone(1046, 'triangle', 0.3, 0.2), 300);
        }
      }

      function updateUI() {
        const roundEl = document.getElementById('round-display');
        const bonusEl = document.getElementById('bonus-display');
        const scoreEl = document.getElementById('score-display');
        const msgEl = document.getElementById('message-display');
        const rollBtn = document.getElementById('btn-roll');

        if (roundEl) roundEl.textContent = 'ROUND ' + Math.min(state.round, 13) + '/13';

        // Calculate upper score
        const upperSum = UPPER_CATEGORIES.reduce((acc, cat) => {
          return acc + (state.scorecard[cat] !== null ? state.scorecard[cat] : 0);
        }, 0);
        if (bonusEl) {
          bonusEl.textContent = state.upperBonusAwarded
            ? 'BONUS: +35'
            : 'UPPER: ' + upperSum + '/63';
        }

        if (scoreEl) scoreEl.textContent = 'TOTAL: ' + score(state);
        if (msgEl) msgEl.textContent = state.message;

        if (rollBtn) {
          const leg = legalActions(state);
          rollBtn.disabled = !leg.includes('roll');
          rollBtn.textContent = 'ROLL DICE (' + state.rollsLeft + ' left)';
        }

        // Update Scorecard Buttons
        const grid = document.getElementById('scorecard-grid');
        const buttons = (grid && typeof grid.getElementsByClassName === 'function')
          ? grid.getElementsByClassName('cat-btn')
          : [];
        for (let i = 0; i < buttons.length; i++) {
          const btn = buttons[i];
          const cat = (btn && typeof btn.getAttribute === 'function') ? btn.getAttribute('data-cat') : null;
          if (!cat) continue;
          const scoreSpan = (btn && typeof btn.querySelector === 'function') ? btn.querySelector('.cat-score') : null;
          if (!scoreSpan) continue;

          const val = state.scorecard[cat];
          if (val !== null && val !== undefined) {
            if (btn.classList && typeof btn.classList.add === 'function') btn.classList.add('scored');
            btn.disabled = true;
            scoreSpan.textContent = val;
          } else {
            if (btn.classList && typeof btn.classList.remove === 'function') btn.classList.remove('scored');
            btn.disabled = state.done;
            const pot = calculateCategoryScore(cat, state.dice);
            scoreSpan.textContent = pot;
            if (scoreSpan.classList && typeof scoreSpan.classList.add === 'function') scoreSpan.classList.add('cat-preview');
          }
        }
      }

      function renderDice() {
        if (!ctx) return;
        const W = canvas.width;
        const H = canvas.height;

        ctx.fillStyle = '#07251e';
        ctx.fillRect(0, 0, W, H);

        const dieSize = 64;
        const gap = 16;
        const startX = (W - (5 * dieSize + 4 * gap)) / 2;
        const startY = (H - dieSize) / 2;

        for (let i = 0; i < 5; i++) {
          const val = state.dice[i];
          const isHeld = state.held[i];
          const x = startX + i * (dieSize + gap);
          const y = startY;

          // Shadow
          ctx.fillStyle = 'rgba(0,0,0,0.4)';
          ctx.beginPath();
          ctx.roundRect(x + 3, y + 4, dieSize, dieSize, 12);
          ctx.fill();

          // Die body
          ctx.fillStyle = isHeld ? '#fef3c7' : '#ffffff';
          ctx.beginPath();
          ctx.roundRect(x, y, dieSize, dieSize, 12);
          ctx.fill();

          // Die border
          ctx.strokeStyle = isHeld ? '#f59e0b' : '#94a3b8';
          ctx.lineWidth = isHeld ? 4 : 2;
          ctx.stroke();

          // Held Badge
          if (isHeld) {
            ctx.fillStyle = '#f59e0b';
            ctx.font = 'bold 9px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            ctx.fillText('HELD', x + dieSize / 2, y + 4);
          }

          // Draw Pips
          drawPips(x, y, dieSize, val, isHeld ? '#78350f' : '#0f172a');
        }
      }

      function drawPips(x, y, size, value, color) {
        ctx.fillStyle = color;
        const r = 4.5;
        const c = x + size / 2;
        const m = y + size / 2;
        const left = x + 16;
        const right = x + size - 16;
        const top = y + 18;
        const bottom = y + size - 16;

        function pip(px, py) {
          ctx.beginPath();
          ctx.arc(px, py, r, 0, Math.PI * 2);
          ctx.fill();
        }

        if (value === 1) {
          pip(c, m);
        } else if (value === 2) {
          pip(left, top);
          pip(right, bottom);
        } else if (value === 3) {
          pip(left, top);
          pip(c, m);
          pip(right, bottom);
        } else if (value === 4) {
          pip(left, top);
          pip(right, top);
          pip(left, bottom);
          pip(right, bottom);
        } else if (value === 5) {
          pip(left, top);
          pip(right, top);
          pip(c, m);
          pip(left, bottom);
          pip(right, bottom);
        } else if (value === 6) {
          pip(left, top);
          pip(right, top);
          pip(left, m);
          pip(right, m);
          pip(left, bottom);
          pip(right, bottom);
        }
      }

      function handleDieClick(idx) {
        if (state.done || state.rollsLeft <= 0) return;
        const act = `toggle_hold:${idx}`;
        if (legalActions(state).includes(act)) {
          step(state, act);
          playSound('hold');
          updateUI();
          renderDice();
        }
      }

      // Event Listeners
      if (canvas && typeof canvas.addEventListener === 'function') {
        canvas.addEventListener('click', (e) => {
          const rect = canvas.getBoundingClientRect();
          const scaleX = canvas.width / rect.width;
          const mx = (e.clientX - rect.left) * scaleX;

          const dieSize = 64;
          const gap = 16;
          const startX = (canvas.width - (5 * dieSize + 4 * gap)) / 2;

          for (let i = 0; i < 5; i++) {
            const dx = startX + i * (dieSize + gap);
            if (mx >= dx && mx <= dx + dieSize) {
              handleDieClick(i);
              break;
            }
          }
        });
      }

      const rollBtn = document.getElementById('btn-roll');
      if (rollBtn && typeof rollBtn.addEventListener === 'function') {
        rollBtn.addEventListener('click', () => {
          if (legalActions(state).includes('roll')) {
            step(state, 'roll');
            playSound('roll');
            updateUI();
            renderDice();
          }
        });
      }

      const grid = document.getElementById('scorecard-grid');
      if (grid && typeof grid.addEventListener === 'function') {
        grid.addEventListener('click', (e) => {
          let btn = e.target;
          while (btn && btn !== grid && !btn.getAttribute('data-cat')) {
            btn = btn.parentElement;
          }
          if (!btn || btn === grid) return;
          const cat = btn.getAttribute('data-cat');
          const act = `score:${cat}`;
          if (legalActions(state).includes(act)) {
            const pot = calculateCategoryScore(cat, state.dice);
            step(state, act);
            if (cat === 'yacht' && pot === 50) playSound('yacht');
            else playSound('score');
            updateUI();
            renderDice();
          }
        });
      }

      const restartBtn = document.getElementById('btn-restart');
      if (restartBtn && typeof restartBtn.addEventListener === 'function') {
        restartBtn.addEventListener('click', () => {
          state = createState(Math.floor(Math.random() * 100000) + 1);
          updateUI();
          renderDice();
        });
      }

      if (typeof window !== 'undefined' && typeof window.addEventListener === 'function') {
        window.addEventListener('keydown', (e) => {
          if (e.key === 'r' || e.key === 'R') {
            state = createState(Math.floor(Math.random() * 100000) + 1);
            updateUI();
            renderDice();
          } else if (e.code === 'Space') {
            if (legalActions(state).includes('roll')) {
              e.preventDefault();
              step(state, 'roll');
              playSound('roll');
              updateUI();
              renderDice();
            }
          }
        });
      }

      // Initial render
      updateUI();
      renderDice();
    })();
  </script>
</body>
</html>
