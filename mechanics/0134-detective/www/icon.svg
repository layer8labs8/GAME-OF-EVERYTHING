<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="brass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="lens" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="120" fill="url(#bg)"/>
  <!-- Pocket Watch silhouette in background -->
  <circle cx="230" cy="230" r="140" fill="#1e293b" stroke="url(#brass)" stroke-width="10"/>
  <!-- Roman numerals ticks -->
  <line x1="230" y1="110" x2="230" y2="135" stroke="#fef08a" stroke-width="6"/>
  <line x1="350" y1="230" x2="325" y2="230" stroke="#fef08a" stroke-width="6"/>
  <line x1="230" y1="350" x2="230" y2="325" stroke="#fef08a" stroke-width="6"/>
  <line x1="110" y1="230" x2="135" y2="230" stroke="#fef08a" stroke-width="6"/>
  <!-- Watch Hands at Midnight -->
  <line x1="230" y1="230" x2="230" y2="150" stroke="#f87171" stroke-width="6" stroke-linecap="round"/>
  <line x1="230" y1="230" x2="245" y2="165" stroke="#fbbf24" stroke-width="5" stroke-linecap="round"/>
  <!-- Magnifying Glass -->
  <circle cx="280" cy="270" r="95" fill="url(#lens)" opacity="0.35"/>
  <circle cx="280" cy="270" r="95" fill="none" stroke="url(#brass)" stroke-width="16"/>
  <line x1="350" y1="340" x2="440" y2="430" stroke="url(#brass)" stroke-width="24" stroke-linecap="round"/>
  <!-- Fingerprint whorl inside lens -->
  <path d="M 260 250 A 20 20 0 0 1 300 250 A 30 30 0 0 1 250 280 A 40 40 0 0 1 305 295" fill="none" stroke="#e0f2fe" stroke-width="5" stroke-linecap="round"/>
</svg>
