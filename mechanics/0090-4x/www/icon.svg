<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <rect width="512" height="512" rx="100" fill="#030712"/>
  <!-- Space galaxy swirl & hyperlanes -->
  <line x1="120" y1="256" x2="256" y2="120" stroke="#0284c7" stroke-width="6" stroke-dasharray="8 8"/>
  <line x1="256" y1="120" x2="392" y2="256" stroke="#0284c7" stroke-width="6" stroke-dasharray="8 8"/>
  <line x1="392" y1="256" x2="256" y2="392" stroke="#0284c7" stroke-width="6" stroke-dasharray="8 8"/>
  <line x1="256" y1="392" x2="120" y2="256" stroke="#0284c7" stroke-width="6" stroke-dasharray="8 8"/>
  <!-- Central Star / Dyson Core -->
  <circle cx="256" cy="256" r="64" fill="#38bdf8" opacity="0.3"/>
  <circle cx="256" cy="256" r="44" fill="#facc15"/>
  <circle cx="256" cy="256" r="26" fill="#fef08a"/>
  <!-- Outer Planetary Orbits & Colonies -->
  <circle cx="120" cy="256" r="24" fill="#3b82f6" stroke="#60a5fa" stroke-width="4"/>
  <circle cx="256" cy="120" r="20" fill="#10b981" stroke="#34d399" stroke-width="4"/>
  <circle cx="392" cy="256" r="24" fill="#ef4444" stroke="#f87171" stroke-width="4"/>
  <circle cx="256" cy="392" r="20" fill="#a855f7" stroke="#c084fc" stroke-width="4"/>
  <!-- Fleet icon -->
  <polygon points="256,180 270,210 256,200 242,210" fill="#ffffff"/>
</svg>
