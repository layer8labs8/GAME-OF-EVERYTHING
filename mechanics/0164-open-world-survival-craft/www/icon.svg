<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="60%" stop-color="#062e24" />
      <stop offset="100%" stop-color="#021a14" />
    </linearGradient>
    <radialGradient id="fireGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#skyGrad)" />
  <!-- Mountain silhouette -->
  <polygon points="110,360 256,180 370,360" fill="#134e4a" opacity="0.6" />
  <polygon points="210,360 330,190 450,360" fill="#0f3d3a" opacity="0.4" />
  <!-- Pine trees -->
  <polygon points="80,410 120,330 160,410" fill="#047857" />
  <polygon points="90,360 120,290 150,360" fill="#059669" />
  <polygon points="360,410 400,330 440,410" fill="#047857" />
  <!-- Campfire wood logs -->
  <rect x="210" y="380" width="92" height="18" rx="6" transform="rotate(-15 256 389)" fill="#78350f" stroke="#b45309" stroke-width="3" />
  <rect x="210" y="380" width="92" height="18" rx="6" transform="rotate(15 256 389)" fill="#78350f" stroke="#b45309" stroke-width="3" />
  <!-- Fire Flame -->
  <circle cx="256" cy="340" r="70" fill="url(#fireGlow)" />
  <path d="M 256,260 Q 285,320 280,360 Q 256,380 232,360 Q 227,320 256,260 Z" fill="#f59e0b" />
  <path d="M 256,290 Q 272,330 268,360 Q 256,375 244,360 Q 240,330 256,290 Z" fill="#fef08a" />
  <!-- Crossed Iron Hatchet -->
  <line x1="170" y1="170" x2="310" y2="310" stroke="#92400e" stroke-width="12" stroke-linecap="round" />
  <path d="M 160,160 L 195,130 L 215,150 L 180,180 Z" fill="#94a3b8" stroke="#cbd5e1" stroke-width="3" />
</svg>
