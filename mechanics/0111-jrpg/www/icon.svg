<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="crystalMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="35%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="fireSpark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <linearGradient id="iceSpark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="thunderSpark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="100" fill="url(#bg)" stroke="#38bdf8" stroke-width="8" />

  <!-- Arcane Celestial Aura Rings -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#6366f1" stroke-width="2" opacity="0.4" stroke-dasharray="10 8" />
  <circle cx="256" cy="256" r="120" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.5" />

  <!-- Tri-Element Orbs Orbiting -->
  <!-- Fire (Red/Orange top-right) -->
  <circle cx="370" cy="170" r="18" fill="url(#fireSpark)" filter="url(#glow)" />
  <!-- Ice (Cyan/White bottom) -->
  <circle cx="256" cy="400" r="18" fill="url(#iceSpark)" filter="url(#glow)" />
  <!-- Thunder (Yellow top-left) -->
  <circle cx="142" cy="170" r="18" fill="url(#thunderSpark)" filter="url(#glow)" />

  <!-- Great Celestial Mother Crystal -->
  <g filter="url(#glow)">
    <!-- Main Center Crystal Diamond -->
    <polygon points="256,70 336,230 256,430 176,230" fill="url(#crystalMain)" stroke="#bae6fd" stroke-width="3" />
    <!-- Center Facet line -->
    <line x1="256" y1="70" x2="256" y2="430" stroke="#ffffff" stroke-width="2" opacity="0.8" />
    <!-- Horizontal Cross Facets -->
    <polygon points="256,70 256,230 176,230" fill="rgba(255,255,255,0.25)" />
    <polygon points="256,230 336,230 256,430" fill="rgba(0,0,0,0.2)" />

    <!-- Left Smaller Shard -->
    <polygon points="170,180 200,260 170,360 140,260" fill="url(#crystalMain)" stroke="#7dd3fc" stroke-width="2" opacity="0.8" />
    <!-- Right Smaller Shard -->
    <polygon points="342,180 372,260 342,360 312,260" fill="url(#crystalMain)" stroke="#7dd3fc" stroke-width="2" opacity="0.8" />
  </g>

  <!-- Gleaming Highlight Star -->
  <polygon points="256,190 262,210 282,216 262,222 256,242 250,222 230,216 250,210" fill="#ffffff" />
</svg>