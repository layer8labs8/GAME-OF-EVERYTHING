<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b0f19">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>Spell & Blade</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0b0f19;
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  canvas {
    display: block;
    margin: 0 auto;
    touch-action: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="logic.js"></script>
<script>
const { CARDS, createState, legalActions, step, isOver, score } = GameLogic;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const W = 360;
const H = 640;

let scale = 1;
function resize() {
  scale = Math.min(innerWidth / W, innerHeight / H);
  const dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.style.width = W * scale + 'px';
  canvas.style.height = H * scale + 'px';
  canvas.width = Math.round(W * scale * dpr);
  canvas.height = Math.round(H * scale * dpr);
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
}
addEventListener('resize', resize);
resize();

let best = 0;
try { best = +localStorage.getItem('goe-0073-best') || 0; } catch (e) {}

let state = createState(Date.now());
let overAt = 0;

function restart() {
  state = createState(Date.now());
  overAt = 0;
}

function rrect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function toLogical(e) {
  const rect = canvas.getBoundingClientRect();
  return { x: (e.clientX - rect.left) / scale, y: (e.clientY - rect.top) / scale };
}

function tryAction(act) {
  if (isOver(state)) return;
  try {
    step(state, act);
    if (isOver(state)) {
      overAt = performance.now();
      const sc = score(state);
      if (sc > best) {
        best = sc;
        try { localStorage.setItem('goe-0073-best', best); } catch (e) {}
      }
    }
  } catch (err) {}
}

// Hand card bounds
const CARD_W = 74;
const CARD_H = 110;
const CARD_Y = 410;

function getCardX(idx, total) {
  const totalW = total * CARD_W + (total - 1) * 8;
  const startX = Math.round((W - totalW) / 2);
  return startX + idx * (CARD_W + 8);
}

canvas.addEventListener('pointerdown', (e) => {
  const p = toLogical(e);
  if (isOver(state)) {
    if (performance.now() - overAt > 400) restart();
    return;
  }

  // Check card taps
  const total = state.hero.hand.length;
  for (let i = 0; i < total; i++) {
    const cx = getCardX(i, total);
    if (p.x >= cx && p.x <= cx + CARD_W && p.y >= CARD_Y && p.y <= CARD_Y + CARD_H) {
      const cardKey = state.hero.hand[i];
      if (state.hero.energy >= CARDS[cardKey].cost) {
        tryAction({ type: 'play', cardIndex: i });
      }
      return;
    }
  }

  // End Turn button (x: 105 to 255, y: 550 to 598)
  if (p.x >= 105 && p.x <= 255 && p.y >= 550 && p.y <= 598) {
    tryAction({ type: 'end_turn' });
    return;
  }
});

addEventListener('keydown', (e) => {
  if (isOver(state)) {
    if ((e.key === ' ' || e.key === 'Enter') && performance.now() - overAt > 400) restart();
    return;
  }
  if (e.key >= '1' && e.key <= '4') {
    const idx = parseInt(e.key, 10) - 1;
    if (idx < state.hero.hand.length) {
      tryAction({ type: 'play', cardIndex: idx });
    }
  } else if (e.key === ' ' || e.key === 'Enter') {
    tryAction({ type: 'end_turn' });
  } else if (e.key === 'r') restart();
});

function draw() {
  ctx.fillStyle = '#0b0f19';
  ctx.fillRect(0, 0, W, H);

  // Top Status Bar
  ctx.fillStyle = '#111827';
  rrect(15, 12, W - 30, 44, 8);
  ctx.fill();

  ctx.fillStyle = '#94a3b8';
  ctx.font = '10px system-ui, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('DUNGEON ENCOUNTER', 26, 26);
  ctx.textAlign = 'center';
  ctx.fillText('STEPS', W / 2, 26);
  ctx.textAlign = 'right';
  ctx.fillText('SCORE', W - 26, 26);

  ctx.font = 'bold 15px system-ui, sans-serif';
  ctx.fillStyle = '#a855f7';
  ctx.textAlign = 'left';
  ctx.fillText(`Battle ${state.encounter} / 3`, 26, 46);

  ctx.fillStyle = '#38bdf8';
  ctx.textAlign = 'center';
  ctx.fillText(`${state.stepCount} / 150`, W / 2, 46);

  ctx.fillStyle = '#fbbf24';
  ctx.textAlign = 'right';
  ctx.fillText(score(state), W - 26, 46);

  // Enemy Arena Box (y: 68 to 220)
  ctx.fillStyle = '#1e1b4b';
  ctx.strokeStyle = '#4338ca';
  ctx.lineWidth = 1.5;
  rrect(18, 68, W - 36, 150, 12);
  ctx.fill();
  ctx.stroke();

  // Enemy Name
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 16px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(state.enemy.name.toUpperCase(), W / 2, 94);

  // Enemy Sprite / Monster Silhouette
  ctx.fillStyle = '#6366f1';
  ctx.beginPath();
  ctx.arc(W / 2, 140, 28, 0, Math.PI * 2);
  ctx.fill();

  // Monster eyes
  ctx.fillStyle = '#ef4444';
  ctx.beginPath();
  ctx.arc(W / 2 - 9, 136, 4, 0, Math.PI * 2);
  ctx.arc(W / 2 + 9, 136, 4, 0, Math.PI * 2);
  ctx.fill();

  // Telegraphed Intent Badge
  const intent = state.enemy.intent;
  let intentBg = '#ef4444';
  let intentText = `ATK ${intent.value}`;
  if (intent.type === 'defend') {
    intentBg = '#0284c7';
    intentText = `DEF +${intent.value}`;
  } else if (intent.type === 'buff') {
    intentBg = '#eab308';
    intentText = `BUFF +${intent.value}`;
  }

  ctx.fillStyle = intentBg;
  rrect(W / 2 - 45, 178, 90, 24, 6);
  ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 11px system-ui, sans-serif';
  ctx.fillText(intentText, W / 2, 194);

  // Enemy HP & Block Bar
  const eHpRatio = Math.max(0, state.enemy.hp / state.enemy.maxHp);
  ctx.fillStyle = '#0f172a';
  rrect(35, 204, W - 70, 8, 4);
  ctx.fill();

  ctx.fillStyle = '#ef4444';
  rrect(35, 204, (W - 70) * eHpRatio, 8, 4);
  ctx.fill();

  ctx.fillStyle = '#cbd5e1';
  ctx.font = 'bold 10px system-ui, sans-serif';
  ctx.textAlign = 'center';
  const enemyBlockStr = state.enemy.block > 0 ? ` (🛡️ ${state.enemy.block})` : '';
  ctx.fillText(`HP ${state.enemy.hp}/${state.enemy.maxHp}${enemyBlockStr}`, W / 2, 226);

  // Hero Status Dashboard (y: 245 to 370)
  ctx.fillStyle = '#111827';
  rrect(18, 240, W - 36, 140, 10);
  ctx.fill();

  // Hero HP Bar
  ctx.textAlign = 'left';
  ctx.fillStyle = '#94a3b8';
  ctx.font = '10px system-ui, sans-serif';
  ctx.fillText('HERO VITALITY', 30, 258);

  const hHpRatio = Math.max(0, state.hero.hp / state.hero.maxHp);
  ctx.fillStyle = '#0f172a';
  rrect(30, 264, W - 60, 12, 6);
  ctx.fill();

  ctx.fillStyle = '#22c55e';
  rrect(30, 264, (W - 60) * hHpRatio, 12, 6);
  ctx.fill();

  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 11px system-ui, sans-serif';
  ctx.fillText(`${state.hero.hp} / ${state.hero.maxHp} HP`, 35, 274);

  // Hero Block Shield
  ctx.fillStyle = '#38bdf8';
  rrect(30, 288, 120, 26, 6);
  ctx.fill();
  ctx.fillStyle = '#0f172a';
  ctx.font = 'bold 12px system-ui, sans-serif';
  ctx.fillText(`🛡️ Block: ${state.hero.block}`, 40, 305);

  // Energy Orbs (3 max)
  ctx.fillStyle = '#94a3b8';
  ctx.font = '10px system-ui, sans-serif';
  ctx.fillText('ENERGY STAMINA', 30, 335);

  for (let i = 0; i < state.hero.maxEnergy; i++) {
    const ox = 30 + i * 26;
    const isAvail = i < state.hero.energy;
    ctx.fillStyle = isAvail ? '#facc15' : '#374151';
    ctx.beginPath();
    ctx.arc(ox + 8, 355, 9, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#000000';
    ctx.font = 'bold 10px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('⚡', ox + 8, 358);
  }

  // Draw Hand Cards (y: 395 to 535)
  const totalCards = state.hero.hand.length;
  for (let i = 0; i < totalCards; i++) {
    const cardKey = state.hero.hand[i];
    const card = CARDS[cardKey];
    const cx = getCardX(i, totalCards);
    const canAfford = state.hero.energy >= card.cost;

    // Card background
    let cardBg = '#1e293b';
    let borderCol = '#38bdf8';
    if (card.damage > 0) { cardBg = '#450a0a'; borderCol = '#ef4444'; }
    else if (card.block > 0) { cardBg = '#082f49'; borderCol = '#0284c7'; }
    else if (card.heal > 0) { cardBg = '#052e16'; borderCol = '#22c55e'; }

    ctx.fillStyle = canAfford ? cardBg : '#0f172a';
    ctx.strokeStyle = canAfford ? borderCol : '#334155';
    ctx.lineWidth = 1.5;
    rrect(cx, CARD_Y, CARD_W, CARD_H, 8);
    ctx.fill();
    ctx.stroke();

    // Energy Cost Pill
    ctx.fillStyle = '#facc15';
    ctx.beginPath();
    ctx.arc(cx + 14, CARD_Y + 14, 9, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#000000';
    ctx.font = 'bold 11px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(card.cost, cx + 14, CARD_Y + 18);

    // Card Name
    ctx.fillStyle = canAfford ? '#ffffff' : '#64748b';
    ctx.font = 'bold 10px system-ui, sans-serif';
    ctx.fillText(card.name, cx + CARD_W / 2, CARD_Y + 44);

    // Card Description
    ctx.fillStyle = canAfford ? '#cbd5e1' : '#475569';
    ctx.font = '10px system-ui, sans-serif';
    let desc = '';
    if (card.damage > 0) desc = `Atk ${card.damage}`;
    else if (card.block > 0) desc = `Def ${card.block}`;
    else if (card.heal > 0) desc = `Heal ${card.heal}`;
    ctx.fillText(desc, cx + CARD_W / 2, CARD_Y + 70);

    // Key shortcut hint
    ctx.fillStyle = '#94a3b8';
    ctx.font = '9px system-ui, sans-serif';
    ctx.fillText(`[${i + 1}]`, cx + CARD_W / 2, CARD_Y + 98);
  }

  // Bottom Toolbar: Deck / End Turn / Discard
  ctx.font = 'bold 11px system-ui, sans-serif';
  ctx.fillStyle = '#94a3b8';
  ctx.textAlign = 'left';
  ctx.fillText(`Deck: ${state.hero.drawPile.length}`, 24, 578);

  ctx.textAlign = 'right';
  ctx.fillText(`Discard: ${state.hero.discardPile.length}`, W - 24, 578);

  // End Turn Button
  ctx.fillStyle = '#dc2626';
  rrect(105, 550, 150, 48, 10);
  ctx.fill();

  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 14px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('END TURN (Space)', W / 2, 579);

  // Game Over Overlay
  if (isOver(state)) {
    ctx.fillStyle = 'rgba(11, 15, 25, 0.94)';
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = state.won ? '#4ade80' : '#ef4444';
    ctx.font = 'bold 28px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(state.won ? 'VICTORY ACHIEVED!' : 'SLAYED IN BATTLE', W / 2, H / 2 - 50);

    ctx.fillStyle = '#e2e8f0';
    ctx.font = '15px system-ui, sans-serif';
    ctx.fillText(`Battles Conquered: ${state.won ? 3 : state.encounter - 1} / 3`, W / 2, H / 2 - 15);
    ctx.fillText(`Damage Inflicted: ${state.stats.damageDealt}`, W / 2, H / 2 + 10);

    ctx.fillStyle = '#fbbf24';
    ctx.font = 'bold 24px system-ui, sans-serif';
    ctx.fillText(`Final Score: ${score(state)}`, W / 2, H / 2 + 55);

    ctx.fillStyle = '#38bdf8';
    ctx.font = 'bold 14px system-ui, sans-serif';
    ctx.fillText('Tap anywhere to play again', W / 2, H / 2 + 105);
  }
}

function frame(now) {
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

const inApk = window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform();
if (!inApk && 'serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
