<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1128" />
      <stop offset="50%" stop-color="#1c2541" />
      <stop offset="100%" stop-color="#0b132b" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="100" fill="url(#bg)" stroke="#1e293b" stroke-width="8" />

  <!-- Territorial Sector Grid (Diamond/Hex-like layout) -->
  <g filter="url(#shadow)">
    <!-- Neutral / Grey Sectors -->
    <polygon points="256,120 320,160 320,240 256,280 192,240 192,160" fill="#334155" stroke="#475569" stroke-width="4" />
    <polygon points="176,170 240,210 240,290 176,330 112,290 112,210" fill="#334155" stroke="#475569" stroke-width="4" />
    <polygon points="336,170 400,210 400,290 336,330 272,290 272,210" fill="#334155" stroke="#475569" stroke-width="4" />

    <!-- Enemy Controlled Sector (Top-Left) -->
    <polygon points="176,70 240,110 240,190 176,230 112,190 112,110" fill="url(#redGrad)" stroke="#fca5a5" stroke-width="4" />

    <!-- Player Controlled Sectors (Dominant Blue Bottom Cluster) -->
    <polygon points="256,260 320,300 320,380 256,420 192,380 192,300" fill="url(#blueGrad)" stroke="#7dd3fc" stroke-width="4" />
    <polygon points="336,260 400,300 400,380 336,420 272,380 272,300" fill="url(#blueGrad)" stroke="#7dd3fc" stroke-width="4" />
  </g>

  <!-- Bastion / Tower Fortification in Center -->
  <g fill="url(#goldGrad)" stroke="#ca8a04" stroke-width="3">
    <rect x="242" y="180" width="28" height="34" rx="2" />
    <!-- Turret battlements -->
    <polygon points="238,180 244,166 250,180 256,166 262,180 268,166 274,180" />
    <!-- Flag atop tower -->
    <line x1="256" y1="166" x2="256" y2="136" stroke="#fde047" stroke-width="4" stroke-linecap="round" />
    <polygon points="256,136 280,146 256,156" fill="#38bdf8" stroke="#0284c7" stroke-width="2" />
  </g>

  <!-- Strategic Advance Arrow (Curved Red/Blue Conquest Vector) -->
  <path d="M 230,360 Q 230,270 252,240" fill="none" stroke="#67e8f9" stroke-width="6" stroke-linecap="round" stroke-dasharray="10 6" />
  <polygon points="256,228 262,248 244,244" fill="#67e8f9" />
</svg>