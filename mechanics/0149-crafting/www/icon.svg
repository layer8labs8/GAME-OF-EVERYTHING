<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="forge-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="rune-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="120" fill="url(#forge-bg)"/>
  <!-- Arcane Glowing Rune Ring -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#38bdf8" stroke-width="8" stroke-dasharray="16 12" opacity="0.6"/>
  <!-- Heavy Blacksmith Anvil -->
  <path d="M 120 280 L 160 240 L 350 240 L 400 280 L 330 280 L 310 350 L 360 400 L 150 400 L 200 350 L 180 280 Z" fill="#334155" stroke="#64748b" stroke-width="6"/>
  <!-- Smithing Hammer Striking Anvil -->
  <rect x="230" y="80" width="80" height="50" rx="8" fill="#475569" stroke="#94a3b8" stroke-width="4" transform="rotate(-30 270 105)"/>
  <rect x="260" y="125" width="16" height="110" rx="4" fill="#78350f" transform="rotate(-30 268 180)"/>
  <!-- Arcane Mana Gemstone Spark at Impact Point -->
  <polygon points="260,195 285,175 310,195 285,225" fill="url(#rune-glow)"/>
  <!-- Floating Runic Glyphs -->
  <path d="M 270 185 L 295 185 M 282 175 L 282 215" stroke="#f0f9ff" stroke-width="3" stroke-linecap="round"/>
</svg>
