<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Chronos Paradox - Time Manipulation Puzzle</title>
  <link rel="manifest" href="./manifest.json">
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }
    body {
      background: #050214;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px;
      overflow-x: hidden;
      touch-action: manipulation;
    }
    #game-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 500px;
      gap: 10px;
    }
    .hud {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #110926;
      border: 1px solid #3b1b68;
      border-radius: 12px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
    }
    .badge-purple { color: #c084fc; }
    .badge-cyan { color: #38bdf8; }
    .badge-emerald { color: #34d399; }
    canvas {
      width: 100%;
      max-width: 440px;
      aspect-ratio: 1;
      background: #09031c;
      border: 2px solid #4c1d95;
      border-radius: 14px;
      box-shadow: 0 8px 30px rgba(139, 92, 246, 0.2);
      display: block;
    }
    .timeline-bar-wrap {
      width: 100%;
      background: #1e113b;
      border-radius: 6px;
      height: 10px;
      overflow: hidden;
      border: 1px solid #4c1d95;
    }
    .timeline-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #8b5cf6, #38bdf8);
      transition: width 0.1s linear;
    }
    .message-bar {
      font-size: 12px;
      color: #94a3b8;
      text-align: center;
      min-height: 18px;
      font-weight: 600;
    }
    .controls-grid {
      display: grid;
      grid-template-columns: repeat(3, 64px);
      grid-template-rows: repeat(3, 48px);
      gap: 6px;
      justify-content: center;
      margin-top: 4px;
    }
    .btn-ctrl {
      background: #1e113b;
      color: #e2e8f0;
      border: 1px solid #4c1d95;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
      transition: all 0.1s;
    }
    .btn-ctrl:active {
      background: #3b1b68;
      transform: translateY(2px);
    }
    .btn-up { grid-column: 2; grid-row: 1; }
    .btn-left { grid-column: 1; grid-row: 2; }
    .btn-wait { grid-column: 2; grid-row: 2; font-size: 11px; background: #2e1065; color: #c084fc; }
    .btn-right { grid-column: 3; grid-row: 2; }
    .btn-down { grid-column: 2; grid-row: 3; }
    .btn-rewind-action {
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 8px 16px;
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(124, 58, 237, 0.4);
    }
    .bottom-row {
      display: flex;
      justify-content: space-between;
      width: 100%;
      align-items: center;
      font-size: 11px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <div class="hud">
      <div class="badge-purple" id="stage-display">CHAMBER 1/3</div>
      <div class="badge-cyan" id="echoes-display">ECHOES: 0/2</div>
      <div class="badge-emerald" id="rewinds-display">REWIND: 0/12</div>
      <div id="score-display">PTS 0</div>
    </div>

    <div class="timeline-bar-wrap">
      <div class="timeline-bar-fill" id="timeline-fill"></div>
    </div>

    <canvas id="canvas" width="440" height="440"></canvas>

    <div class="message-bar" id="message-display">Step on plate, then rewind to let past Echo open gate.</div>

    <div style="display: flex; gap: 12px; align-items: center;">
      <div class="controls-grid">
        <button class="btn-ctrl btn-up" id="btn-up">▲</button>
        <button class="btn-ctrl btn-left" id="btn-left">◀</button>
        <button class="btn-ctrl btn-wait" id="btn-wait">WAIT</button>
        <button class="btn-ctrl btn-right" id="btn-right">▶</button>
        <button class="btn-ctrl btn-down" id="btn-down">▼</button>
      </div>
      <button class="btn-rewind-action" id="btn-rewind">REWIND ⏳</button>
    </div>

    <div class="bottom-row">
      <span>WASD / Arrow Keys / Space</span>
      <button style="background:transparent;border:1px solid #3b1b68;color:#94a3b8;padding:4px 8px;border-radius:4px;cursor:pointer;" id="btn-restart">Restart</button>
    </div>
  </div>

  <script src="logic.js"></script>
  <script>
    (function() {
      const canvas = document.getElementById('canvas');
      const ctx = (canvas && typeof canvas.getContext === 'function') ? canvas.getContext('2d') : null;

      let state = createState(Math.floor(Math.random() * 100000) + 1);

      // Web Audio Synth
      let audioCtx = null;
      function getAudio() {
        if (!audioCtx && typeof AudioContext !== 'undefined') {
          audioCtx = new AudioContext();
        }
        return audioCtx;
      }
      function playTone(freq, type, duration, gainVal = 0.08) {
        try {
          const actx = getAudio();
          if (!actx) return;
          const osc = actx.createOscillator();
          const gain = actx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, actx.currentTime);
          gain.gain.setValueAtTime(gainVal, actx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + duration);
          osc.connect(gain);
          gain.connect(actx.destination);
          osc.start();
          osc.stop(actx.currentTime + duration);
        } catch (e) {}
      }

      function playSound(type) {
        if (type === 'step') playTone(120, 'sine', 0.05, 0.06);
        else if (type === 'rewind') {
          playTone(600, 'sawtooth', 0.25, 0.12);
          setTimeout(() => playTone(300, 'sine', 0.2, 0.1), 100);
        } else if (type === 'gate') playTone(440, 'triangle', 0.12, 0.1);
        else if (type === 'orb') playTone(880, 'sine', 0.15, 0.1);
        else if (type === 'win') {
          playTone(440, 'sine', 0.15, 0.1);
          setTimeout(() => playTone(554, 'sine', 0.15, 0.1), 100);
          setTimeout(() => playTone(659, 'sine', 0.25, 0.12), 200);
        }
      }

      function updateUI() {
        const stageEl = document.getElementById('stage-display');
        const echoesEl = document.getElementById('echoes-display');
        const rewindsEl = document.getElementById('rewinds-display');
        const scoreEl = document.getElementById('score-display');
        const msgEl = document.getElementById('message-display');
        const timeFill = document.getElementById('timeline-fill');

        if (stageEl) stageEl.textContent = 'CHAMBER ' + state.stage + '/' + state.maxStages;
        if (echoesEl) echoesEl.textContent = 'ECHOES: ' + state.clones.length + '/' + 2;
        if (rewindsEl) rewindsEl.textContent = 'REWIND: ' + state.rewindsUsed + '/' + state.maxRewinds;
        if (scoreEl) scoreEl.textContent = 'PTS ' + score(state);
        if (msgEl) msgEl.textContent = state.message;

        if (timeFill) {
          const pct = Math.min(100, (state.tick / state.maxTicksPerLoop) * 100);
          timeFill.style.width = pct + '%';
        }
      }

      function handleAction(act) {
        if (state.done) return;
        const leg = legalActions(state);
        if (!leg.includes(act)) return;

        const prevStage = state.stage;
        const prevOrbs = state.orbsCollected;
        const prevRewinds = state.rewindsUsed;

        step(state, act);

        if (state.stage > prevStage || state.won) playSound('win');
        else if (act === 'rewind' || state.rewindsUsed > prevRewinds) playSound('rewind');
        else if (state.orbsCollected > prevOrbs) playSound('orb');
        else if (act !== 'wait') playSound('step');

        updateUI();
        render();
      }

      function render() {
        if (!ctx) return;
        const W = canvas.width;
        const H = canvas.height;
        const tileSize = W / WIDTH;

        ctx.fillStyle = '#09031c';
        ctx.fillRect(0, 0, W, H);

        // Draw Chamber Tiles
        for (let y = 0; y < HEIGHT; y++) {
          for (let x = 0; x < WIDTH; x++) {
            const cell = state.grid[y][x];
            const px = x * tileSize;
            const py = y * tileSize;

            if (cell === '#') {
              // Wall
              ctx.fillStyle = '#1e113b';
              ctx.fillRect(px, py, tileSize, tileSize);
              ctx.fillStyle = '#2e1065';
              ctx.fillRect(px + 2, py + 2, tileSize - 4, tileSize - 4);
              ctx.fillStyle = '#0f0728';
              ctx.fillRect(px + 4, py + 4, tileSize - 8, tileSize - 8);
            } else {
              // Floor
              ctx.fillStyle = ((x + y) % 2 === 0) ? '#130924' : '#10071f';
              ctx.fillRect(px, py, tileSize, tileSize);
              ctx.strokeStyle = '#1e113b';
              ctx.lineWidth = 1;
              ctx.strokeRect(px, py, tileSize, tileSize);
            }
          }
        }

        // Draw Pressure Plates
        for (const plate of state.plates) {
          const px = plate.x * tileSize;
          const py = plate.y * tileSize;
          const isPressed = state.gates.find(g => g.id === plate.id)?.open;
          ctx.fillStyle = isPressed ? '#a855f7' : '#4c1d95';
          ctx.beginPath();
          ctx.roundRect(px + 8, py + 8, tileSize - 16, tileSize - 16, 6);
          ctx.fill();
          ctx.strokeStyle = '#c084fc';
          ctx.lineWidth = 2;
          ctx.stroke();
          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 12px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('P' + plate.id, px + tileSize / 2, py + tileSize / 2);
        }

        // Draw Gates
        for (const gate of state.gates) {
          const gx = gate.x * tileSize;
          const gy = gate.y * tileSize;
          if (!gate.open) {
            // Closed Gate (Red Laser Barrier)
            ctx.fillStyle = '#7f1d1d';
            ctx.fillRect(gx + 4, gy + 4, tileSize - 8, tileSize - 8);
            ctx.strokeStyle = '#ef4444';
            ctx.lineWidth = 3;
            ctx.strokeRect(gx + 6, gy + 6, tileSize - 12, tileSize - 12);
            ctx.fillStyle = '#ef4444';
            ctx.font = 'bold 12px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('LOCKED', gx + tileSize / 2, gy + tileSize / 2);
          } else {
            // Open Gate
            ctx.fillStyle = 'rgba(16, 185, 129, 0.15)';
            ctx.fillRect(gx + 4, gy + 4, tileSize - 8, tileSize - 8);
            ctx.strokeStyle = '#10b981';
            ctx.lineWidth = 2;
            ctx.strokeRect(gx + 6, gy + 6, tileSize - 12, tileSize - 12);
          }
        }

        // Draw Chrono Orbs
        for (const orb of state.orbs) {
          const ox = orb.x * tileSize + tileSize / 2;
          const oy = orb.y * tileSize + tileSize / 2;
          ctx.fillStyle = '#38bdf8';
          ctx.beginPath();
          ctx.arc(ox, oy, 8, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#bae6fd';
          ctx.lineWidth = 2;
          ctx.stroke();
        }

        // Draw Exit Portal
        const ex = state.exit.x * tileSize + tileSize / 2;
        const ey = state.exit.y * tileSize + tileSize / 2;
        ctx.fillStyle = '#065f46';
        ctx.beginPath();
        ctx.arc(ex, ey, tileSize / 2 - 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#10b981';
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.fillStyle = '#34d399';
        ctx.font = 'bold 16px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('X', ex, ey);

        // Draw Echo Clones (Past Selves)
        for (let i = 0; i < state.clonePositions.length; i++) {
          const cp = state.clonePositions[i];
          const cx = cp.x * tileSize + tileSize / 2;
          const cy = cp.y * tileSize + tileSize / 2;

          // Translucent purple silhouette
          ctx.fillStyle = 'rgba(168, 85, 247, 0.5)';
          ctx.beginPath();
          ctx.arc(cx, cy, tileSize / 2 - 8, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#c084fc';
          ctx.lineWidth = 2;
          ctx.stroke();
          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 11px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('E' + (i + 1), cx, cy);
        }

        // Draw Present Player
        const px = state.player.x * tileSize + tileSize / 2;
        const py = state.player.y * tileSize + tileSize / 2;
        ctx.fillStyle = '#0284c7';
        ctx.beginPath();
        ctx.arc(px, py, tileSize / 2 - 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 3;
        ctx.stroke();
        // Cyan Eye / Visor
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(px, py - 3, 4, 0, Math.PI * 2);
        ctx.fill();

        // Game Over Overlay
        if (state.done) {
          ctx.fillStyle = 'rgba(5, 2, 20, 0.85)';
          ctx.fillRect(0, 0, W, H);
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          if (state.won) {
            ctx.fillStyle = '#34d399';
            ctx.font = 'bold 28px sans-serif';
            ctx.fillText('PARADOX RESOLVED!', W / 2, H / 2 - 25);
            ctx.fillStyle = '#f8fafc';
            ctx.font = '16px sans-serif';
            ctx.fillText('Final Score: ' + score(state), W / 2, H / 2 + 10);
            ctx.fillText('All Chambers Mastered', W / 2, H / 2 + 35);
          } else {
            ctx.fillStyle = '#f43f5e';
            ctx.font = 'bold 28px sans-serif';
            ctx.fillText('TIMELINE COLLAPSE', W / 2, H / 2 - 25);
            ctx.fillStyle = '#f8fafc';
            ctx.font = '16px sans-serif';
            ctx.fillText('Ran out of chronal rewinds', W / 2, H / 2 + 10);
            ctx.fillText('Press Restart to try again', W / 2, H / 2 + 35);
          }
        }
      }

      // Event Listeners
      const btnUp = document.getElementById('btn-up');
      const btnDown = document.getElementById('btn-down');
      const btnLeft = document.getElementById('btn-left');
      const btnRight = document.getElementById('btn-right');
      const btnWait = document.getElementById('btn-wait');
      const btnRewind = document.getElementById('btn-rewind');
      const btnRestart = document.getElementById('btn-restart');

      if (btnUp && typeof btnUp.addEventListener === 'function') btnUp.addEventListener('click', () => handleAction('up'));
      if (btnDown && typeof btnDown.addEventListener === 'function') btnDown.addEventListener('click', () => handleAction('down'));
      if (btnLeft && typeof btnLeft.addEventListener === 'function') btnLeft.addEventListener('click', () => handleAction('left'));
      if (btnRight && typeof btnRight.addEventListener === 'function') btnRight.addEventListener('click', () => handleAction('right'));
      if (btnWait && typeof btnWait.addEventListener === 'function') btnWait.addEventListener('click', () => handleAction('wait'));
      if (btnRewind && typeof btnRewind.addEventListener === 'function') btnRewind.addEventListener('click', () => handleAction('rewind'));
      if (btnRestart && typeof btnRestart.addEventListener === 'function') {
        btnRestart.addEventListener('click', () => {
          state = createState(Math.floor(Math.random() * 100000) + 1);
          updateUI();
          render();
        });
      }

      if (typeof window !== 'undefined' && typeof window.addEventListener === 'function') {
        window.addEventListener('keydown', (e) => {
          if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') handleAction('up');
          else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') handleAction('down');
          else if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') handleAction('left');
          else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') handleAction('right');
          else if (e.key === ' ' || e.key === 'e' || e.key === 'E') handleAction('wait');
          else if (e.key === 'q' || e.key === 'Q' || e.key === 'Backspace') handleAction('rewind');
          else if (e.key === 'r' || e.key === 'R') {
            state = createState(Math.floor(Math.random() * 100000) + 1);
            updateUI();
            render();
          }
        });
      }

      // Initial render
      updateUI();
      render();
    })();
  </script>
</body>
</html>
