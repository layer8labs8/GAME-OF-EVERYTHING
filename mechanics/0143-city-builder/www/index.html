<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b121e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>Metro Grid</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0b121e;
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  canvas {
    display: block;
    margin: 0 auto;
    touch-action: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="logic.js"></script>
<script>
const {
  GRID_SIZE,
  MAX_MONTHS,
  TARGET_POP,
  TARGET_HAPPINESS,
  COSTS,
  createState,
  legalActions,
  step,
  isOver,
  score
} = GameLogic;

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const W = 360;
const H = 640;

let scale = 1;
function resize() {
  scale = Math.min(innerWidth / W, innerHeight / H);
  const dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.style.width = W * scale + 'px';
  canvas.style.height = H * scale + 'px';
  canvas.width = Math.round(W * scale * dpr);
  canvas.height = Math.round(H * scale * dpr);
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
}
addEventListener('resize', resize);
resize();

let state = createState(Date.now());
let selectedTool = 'zone_residential';
let overAt = 0;

function restart() {
  state = createState(Date.now());
  selectedTool = 'zone_residential';
  overAt = 0;
}

const CELL = 36;
const GRID_X = (W - GRID_SIZE * CELL) / 2; // (360 - 288) / 2 = 36
const GRID_Y = 74;

function toLogical(e) {
  const rect = canvas.getBoundingClientRect();
  return { x: (e.clientX - rect.left) / scale, y: (e.clientY - rect.top) / scale };
}

function doAction(actionName) {
  if (isOver(state)) return;
  if (!legalActions(state).includes(actionName)) return;
  const res = step(state, actionName);
  if (res.done) overAt = performance.now();
}

function drawRoundedRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

const TOOLS = [
  { action: 'build_road', label: 'Road', cost: '$10', col: 0, row: 0 },
  { action: 'zone_residential', label: 'Res', cost: '$25', col: 1, row: 0 },
  { action: 'zone_commercial', label: 'Com', cost: '$35', col: 2, row: 0 },
  { action: 'zone_industrial', label: 'Ind', cost: '$50', col: 0, row: 1 },
  { action: 'build_park', label: 'Park', cost: '$40', col: 1, row: 1 },
  { action: 'demolish', label: 'Bulldoze', cost: '$5', col: 2, row: 1 },
];

const TOOL_W = 96;
const TOOL_H = 44;
const TOOL_X0 = 24;
const TOOL_Y0 = 412;

canvas.addEventListener('pointerdown', (e) => {
  const p = toLogical(e);
  if (isOver(state)) {
    if (performance.now() - overAt > 400) restart();
    return;
  }

  // Next Month Button
  if (p.x >= 24 && p.x <= W - 24 && p.y >= 522 && p.y <= 576) {
    doAction('next_month');
    return;
  }

  // Tool selection buttons
  for (const t of TOOLS) {
    const tx = TOOL_X0 + t.col * (TOOL_W + 12);
    const ty = TOOL_Y0 + t.row * (TOOL_H + 8);
    if (p.x >= tx && p.x <= tx + TOOL_W && p.y >= ty && p.y <= ty + TOOL_H) {
      selectedTool = t.action;
      // If cursor already at a spot, try placing
      doAction(t.action);
      return;
    }
  }

  // Grid clicks
  const gx = Math.floor((p.x - GRID_X) / CELL);
  const gy = Math.floor((p.y - GRID_Y) / CELL);
  if (gx >= 0 && gx < GRID_SIZE && gy >= 0 && gy < GRID_SIZE) {
    state.cursor.x = gx;
    state.cursor.y = gy;
    doAction(selectedTool);
  }
});

addEventListener('keydown', (e) => {
  if (isOver(state)) {
    if ((e.key === ' ' || e.key === 'Enter') && performance.now() - overAt > 400) restart();
    return;
  }

  if (e.key === 'ArrowUp' || e.key === 'w') doAction('cursor_up');
  else if (e.key === 'ArrowDown' || e.key === 's') doAction('cursor_down');
  else if (e.key === 'ArrowLeft' || e.key === 'a') doAction('cursor_left');
  else if (e.key === 'ArrowRight' || e.key === 'd') doAction('cursor_right');
  else if (e.key === '1') { selectedTool = 'build_road'; doAction('build_road'); }
  else if (e.key === '2') { selectedTool = 'zone_residential'; doAction('zone_residential'); }
  else if (e.key === '3') { selectedTool = 'zone_commercial'; doAction('zone_commercial'); }
  else if (e.key === '4') { selectedTool = 'zone_industrial'; doAction('zone_industrial'); }
  else if (e.key === '5') { selectedTool = 'build_park'; doAction('build_park'); }
  else if (e.key === '6') { selectedTool = 'demolish'; doAction('demolish'); }
  else if (e.key === ' ' || e.key === 'Enter') doAction('next_month');
  else if (e.key === 'r') restart();
});

function draw() {
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#111c2e');
  bg.addColorStop(1, '#0b121e');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // Top Municipal Dashboard
  ctx.fillStyle = '#64748b';
  ctx.font = '11px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('FUNDS', 24, 26);
  ctx.textAlign = 'center';
  ctx.fillText('CITIZENS', W / 2, 26);
  ctx.textAlign = 'right';
  ctx.fillText('DATE', W - 24, 26);

  ctx.fillStyle = state.funds < 0 ? '#ef4444' : '#10b981';
  ctx.font = 'bold 15px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(`$${state.funds}`, 24, 48);

  ctx.fillStyle = state.population >= TARGET_POP ? '#10b981' : '#38bdf8';
  ctx.textAlign = 'center';
  ctx.fillText(`👥 ${state.population}/${TARGET_POP}`, W / 2, 48);

  ctx.fillStyle = '#f59e0b';
  ctx.textAlign = 'right';
  ctx.fillText(`M${state.month}/${MAX_MONTHS}`, W - 24, 48);

  // Happiness Rating Pill
  ctx.fillStyle = '#1e293b';
  drawRoundedRect(W / 2 - 50, 56, 100, 16, 8);
  ctx.fill();
  ctx.fillStyle = state.happiness >= TARGET_HAPPINESS ? '#10b981' : '#ef4444';
  ctx.font = 'bold 10px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(`HAPPINESS: ${state.happiness}%`, W / 2, 68);

  // 8x8 Grid Base
  ctx.fillStyle = '#0a0f18';
  ctx.fillRect(GRID_X - 2, GRID_Y - 2, GRID_SIZE * CELL + 4, GRID_SIZE * CELL + 4);

  for (let r = 0; r < GRID_SIZE; r++) {
    for (let c = 0; c < GRID_SIZE; c++) {
      const x = GRID_X + c * CELL;
      const y = GRID_Y + r * CELL;
      const cell = state.grid[r][c];

      if (cell.type === '.') {
        ctx.fillStyle = '#13281c';
        ctx.fillRect(x + 1, y + 1, CELL - 2, CELL - 2);
      } else if (cell.type === 'R') {
        ctx.fillStyle = '#334155';
        ctx.fillRect(x + 1, y + 1, CELL - 2, CELL - 2);
        ctx.fillStyle = '#facc15';
        ctx.fillRect(x + CELL / 2 - 1, y + 4, 2, CELL - 8);
      } else if (cell.type === 'RES') {
        ctx.fillStyle = '#059669';
        ctx.fillRect(x + 1, y + 1, CELL - 2, CELL - 2);
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 11px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(cell.pop, x + CELL / 2, y + CELL / 2 + 4);
      } else if (cell.type === 'COM') {
        ctx.fillStyle = '#0284c7';
        ctx.fillRect(x + 1, y + 1, CELL - 2, CELL - 2);
        ctx.fillStyle = '#bae6fd';
        ctx.fillRect(x + 8, y + 8, CELL - 16, CELL - 16);
      } else if (cell.type === 'IND') {
        ctx.fillStyle = '#b45309';
        ctx.fillRect(x + 1, y + 1, CELL - 2, CELL - 2);
        ctx.fillStyle = '#fde68a';
        ctx.beginPath();
        ctx.arc(x + CELL / 2, y + CELL / 2, 6, 0, Math.PI * 2);
        ctx.fill();
      } else if (cell.type === 'PARK') {
        ctx.fillStyle = '#15803d';
        ctx.fillRect(x + 1, y + 1, CELL - 2, CELL - 2);
        ctx.fillStyle = '#86efac';
        ctx.beginPath();
        ctx.arc(x + CELL / 2, y + CELL / 2, 7, 0, Math.PI * 2);
        ctx.fill();
      }

      // Cursor Highlight
      if (r === state.cursor.y && c === state.cursor.x) {
        ctx.strokeStyle = '#facc15';
        ctx.lineWidth = 2.5;
        ctx.strokeRect(x + 1.5, y + 1.5, CELL - 3, CELL - 3);
      }
    }
  }

  // Event Ticker
  ctx.fillStyle = '#1e293b';
  drawRoundedRect(24, 372, W - 48, 30, 6);
  ctx.fill();
  ctx.fillStyle = '#cbd5e1';
  ctx.font = '11px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(state.lastEvent, W / 2, 391);

  // Zoning Toolbar
  for (const t of TOOLS) {
    const isSel = selectedTool === t.action;
    const tx = TOOL_X0 + t.col * (TOOL_W + 12);
    const ty = TOOL_Y0 + t.row * (TOOL_H + 8);

    ctx.fillStyle = isSel ? '#1e3a8a' : '#1e293b';
    drawRoundedRect(tx, ty, TOOL_W, TOOL_H, 8);
    ctx.fill();

    ctx.strokeStyle = isSel ? '#38bdf8' : '#334155';
    ctx.lineWidth = isSel ? 2 : 1;
    ctx.stroke();

    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 13px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(t.label, tx + 10, ty + 20);

    ctx.fillStyle = isSel ? '#7dd3fc' : '#94a3b8';
    ctx.font = '11px sans-serif';
    ctx.fillText(t.cost, tx + 10, ty + 36);
  }

  // Next Month Button
  ctx.fillStyle = '#10b981';
  drawRoundedRect(24, 522, W - 48, 50, 10);
  ctx.fill();
  ctx.strokeStyle = '#34d399';
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 16px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('ADVANCE MONTH ⏩', W / 2, 553);

  ctx.fillStyle = '#64748b';
  ctx.font = '10px sans-serif';
  ctx.fillText('Tap tiles or use 1-6 keys · Space to Advance Month', W / 2, 606);

  // End Modal
  if (isOver(state)) {
    ctx.fillStyle = 'rgba(11, 18, 30, 0.94)';
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    if (state.won) {
      ctx.fillStyle = '#10b981';
      ctx.font = 'bold 30px sans-serif';
      ctx.fillText('METROPOLIS THRIVING', W / 2, H / 2 - 35);
      ctx.fillStyle = '#cbd5e1';
      ctx.font = '16px sans-serif';
      ctx.fillText(`Target reached with ${state.population} happy citizens!`, W / 2, H / 2 - 5);
    } else {
      ctx.fillStyle = '#ef4444';
      ctx.font = 'bold 30px sans-serif';
      ctx.fillText('CITY BANKRUPTCY', W / 2, H / 2 - 35);
      ctx.fillStyle = '#cbd5e1';
      ctx.font = '16px sans-serif';
      ctx.fillText('Municipal funds depleted or term expired!', W / 2, H / 2 - 5);
    }

    ctx.fillStyle = '#38bdf8';
    ctx.font = 'bold 22px sans-serif';
    ctx.fillText(`Score: ${score(state)}`, W / 2, H / 2 + 30);

    ctx.fillStyle = '#94a3b8';
    ctx.font = '14px sans-serif';
    ctx.fillText('Tap anywhere to found a new city', W / 2, H / 2 + 75);
  }
}

function frame() {
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

const inApk = window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform();
if (!inApk && 'serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
