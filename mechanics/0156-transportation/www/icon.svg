<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="skybg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="train" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#skybg)" />
  <!-- Rail track rails -->
  <line x1="80" y1="360" x2="432" y2="360" stroke="#64748b" stroke-width="12" />
  <line x1="80" y1="410" x2="432" y2="410" stroke="#64748b" stroke-width="12" />
  <!-- Ties -->
  <line x1="120" y1="345" x2="120" y2="425" stroke="#475569" stroke-width="8" />
  <line x1="180" y1="345" x2="180" y2="425" stroke="#475569" stroke-width="8" />
  <line x1="240" y1="345" x2="240" y2="425" stroke="#475569" stroke-width="8" />
  <line x1="300" y1="345" x2="300" y2="425" stroke="#475569" stroke-width="8" />
  <line x1="360" y1="345" x2="360" y2="425" stroke="#475569" stroke-width="8" />
  <!-- Modern streamlined train nose -->
  <path d="M 120 340 L 320 340 C 390 340 430 290 440 250 L 340 210 L 120 210 Z" fill="url(#train)" stroke="#60a5fa" stroke-width="6" />
  <!-- Windshield -->
  <polygon points="350,225 410,255 350,255" fill="#38bdf8" />
  <!-- Cargo freight container on back -->
  <rect x="90" y="170" width="120" height="90" rx="6" fill="url(#metal)" stroke="#fbbf24" stroke-width="4" />
  <line x1="130" y1="170" x2="130" y2="260" stroke="#78350f" stroke-width="4" />
  <line x1="170" y1="170" x2="170" y2="260" stroke="#78350f" stroke-width="4" />
  <!-- Headlight beam -->
  <polygon points="440,250 500,220 500,280" fill="#fef08a" opacity="0.4" />
</svg>
