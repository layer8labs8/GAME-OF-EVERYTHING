<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a0808" />
      <stop offset="60%" stop-color="#120404" />
      <stop offset="100%" stop-color="#050202" />
    </radialGradient>
    <radialGradient id="lightBeam" cx="30%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#ffedd5" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#f97316" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="shadowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <circle cx="256" cy="256" r="210" fill="none" stroke="#ef4444" stroke-width="6" stroke-dasharray="14 10" opacity="0.4" />
  <!-- Light cone -->
  <polygon points="120,400 392,400 256,160" fill="url(#lightBeam)" />
  <!-- Crosshair / Biohazard / Monster Eyes -->
  <circle cx="256" cy="240" r="44" fill="none" stroke="#dc2626" stroke-width="8" />
  <circle cx="256" cy="240" r="16" fill="#ef4444" filter="url(#shadowGlow)" />
  <line x1="256" y1="170" x2="256" y2="310" stroke="#dc2626" stroke-width="6" stroke-linecap="round" />
  <line x1="186" y1="240" x2="326" y2="240" stroke="#dc2626" stroke-width="6" stroke-linecap="round" />
  <path d="M 210,320 Q 256,380 302,320" fill="none" stroke="#991b1b" stroke-width="6" stroke-linecap="round" />
  <!-- Flashlight torch icon -->
  <rect x="236" y="380" width="40" height="70" rx="8" fill="#475569" stroke="#94a3b8" stroke-width="4" />
  <rect x="228" y="360" width="56" height="24" rx="4" fill="#64748b" stroke="#cbd5e1" stroke-width="3" />
</svg>
