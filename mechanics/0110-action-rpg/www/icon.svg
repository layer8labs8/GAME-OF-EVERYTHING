<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="fireBlade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <linearGradient id="iceBlade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="100" fill="url(#bg)" stroke="#38bdf8" stroke-width="8" />

  <!-- Action Slash Arcs / Motion Trails -->
  <g fill="none" stroke="#f97316" stroke-width="6" opacity="0.4" stroke-linecap="round">
    <path d="M 80,380 C 140,460 380,460 440,360" />
    <path d="M 120,340 C 180,410 340,410 400,320" />
  </g>

  <!-- Arcane Frost Spiral -->
  <path d="M 256,120 C 340,120 400,180 400,256 C 400,340 320,400 256,400 C 180,400 120,320 120,256" fill="none" stroke="#38bdf8" stroke-width="4" stroke-dasharray="14 10" opacity="0.6" />

  <!-- Crossed Twin Blades (Fire & Ice) -->
  <g filter="url(#glow)">
    <!-- Fire Blade (Diagonal Top-Left to Bottom-Right) -->
    <path d="M 120,110 L 145,115 L 360,370 L 380,390 L 370,400 L 350,380 L 115,135 Z" fill="url(#fireBlade)" stroke="#fbbf24" stroke-width="2" />
    <!-- Crossguard -->
    <rect x="330" y="360" width="36" height="12" rx="3" transform="rotate(45 348 366)" fill="#ca8a04" />

    <!-- Ice Blade (Diagonal Top-Right to Bottom-Left) -->
    <path d="M 392,110 L 397,135 L 162,380 L 142,400 L 132,390 L 152,370 L 367,115 Z" fill="url(#iceBlade)" stroke="#a5f3fc" stroke-width="2" />
    <!-- Crossguard -->
    <rect x="150" y="360" width="36" height="12" rx="3" transform="rotate(-45 168 366)" fill="#0284c7" />
  </g>

  <!-- Central Flash / Impact Burst -->
  <polygon points="256,220 268,246 296,256 268,266 256,292 244,266 216,256 244,246" fill="#ffffff" filter="url(#glow)" />
</svg>