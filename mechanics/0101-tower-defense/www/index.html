<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b1020">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>Citadel Guard</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b1020; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; margin: 0 auto; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="logic.js"></script>
<script>
const { WAYPOINTS, PLATFORMS, TOWER_TYPES, UPGRADE_COST, createState, legalActions, step, isOver, score } = GameLogic;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const W = 360;
const H = 640;

let scale = 1;
function resize() {
  scale = Math.min(innerWidth / W, innerHeight / H);
  const dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.style.width = W * scale + 'px';
  canvas.style.height = H * scale + 'px';
  canvas.width = Math.round(W * scale * dpr);
  canvas.height = Math.round(H * scale * dpr);
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
}
addEventListener('resize', resize);
resize();

let best = 0;
try { best = +localStorage.getItem('goe-0101-best') || 0; } catch (e) {}

let state = createState(Date.now());
let selectedSlot = 0;
let beams = [];
let overAt = 0;

function restart() {
  state = createState(Date.now());
  selectedSlot = 0;
  beams = [];
  overAt = 0;
}

function rrect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y + w, y, r);
  ctx.closePath();
}

function toLogical(e) {
  const rect = canvas.getBoundingClientRect();
  return { x: (e.clientX - rect.left) / scale, y: (e.clientY - rect.top) / scale };
}

function doAction(act) {
  if (isOver(state)) return;
  const acts = legalActions(state);
  if (!acts.includes(act)) return;

  const res = step(state, act);
  if (res.done) {
    overAt = performance.now();
    const sc = score(state);
    if (sc > best) {
      best = sc;
      try { localStorage.setItem('goe-0101-best', best); } catch (e) {}
    }
  }
}

canvas.addEventListener('pointerdown', (e) => {
  const p = toLogical(e);
  if (isOver(state)) {
    if (performance.now() - overAt > 400) restart();
    return;
  }
  // Check platform clicks
  for (let i = 0; i < PLATFORMS.length; i++) {
    const plat = PLATFORMS[i];
    const dx = p.x - plat.x;
    const dy = p.y - plat.y;
    if (dx * dx + dy * dy <= 28 * 28) {
      selectedSlot = i;
      return;
    }
  }

  // Build / Upgrade button tray at bottom
  if (p.y >= 560 && p.y <= 620) {
    const sl = state.slots[selectedSlot];
    if (sl.type === 'empty') {
      if (p.x >= 20 && p.x <= 110) doAction(`build_ballista_${selectedSlot}`);
      else if (p.x >= 125 && p.x <= 215) doAction(`build_cannon_${selectedSlot}`);
      else if (p.x >= 230 && p.x <= 320) doAction(`build_frost_${selectedSlot}`);
    } else if (sl.level < 2) {
      if (p.x >= 110 && p.x <= 250) doAction(`upgrade_${selectedSlot}`);
    }
  }
});

addEventListener('keydown', (e) => {
  if (isOver(state)) {
    if ((e.key === ' ' || e.key === 'Enter') && performance.now() - overAt > 400) restart();
    return;
  }
  const sl = state.slots[selectedSlot];
  if (e.key >= '1' && e.key <= '6') {
    selectedSlot = parseInt(e.key, 10) - 1;
  } else if (e.key === 'b' || e.key === 'B') {
    if (sl.type === 'empty') doAction(`build_ballista_${selectedSlot}`);
  } else if (e.key === 'c' || e.key === 'C') {
    if (sl.type === 'empty') doAction(`build_cannon_${selectedSlot}`);
  } else if (e.key === 'f' || e.key === 'F') {
    if (sl.type === 'empty') doAction(`build_frost_${selectedSlot}`);
  } else if (e.key === 'u' || e.key === 'U') {
    if (sl.type !== 'empty' && sl.level < 2) doAction(`upgrade_${selectedSlot}`);
  } else if (e.key === 'r') restart();
});

let tickAcc = 0;
function updateSim(dt) {
  tickAcc += dt;
  const STEP_TIME = 1 / 30;

  while (tickAcc >= STEP_TIME && !isOver(state)) {
    tickAcc -= STEP_TIME;
    doAction('wait');
  }
}

function draw() {
  ctx.fillStyle = '#0f172a';
  ctx.fillRect(0, 0, W, H);

  // Winding Cobblestone Path
  ctx.strokeStyle = '#334155';
  ctx.lineWidth = 32;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(WAYPOINTS[0].x, WAYPOINTS[0].y);
  for (let i = 1; i < WAYPOINTS.length; i++) {
    ctx.lineTo(WAYPOINTS[i].x, WAYPOINTS[i].y);
  }
  ctx.stroke();

  ctx.strokeStyle = '#64748b';
  ctx.lineWidth = 26;
  ctx.stroke();

  // Selected Range Indicator
  const selPlat = PLATFORMS[selectedSlot];
  const selSlot = state.slots[selectedSlot];
  let selRange = 100;
  if (selSlot.type !== 'empty') {
    selRange = TOWER_TYPES[selSlot.type].range + (selSlot.level > 1 ? 20 : 0);
  }
  ctx.fillStyle = 'rgba(56,189,248,0.1)';
  ctx.strokeStyle = 'rgba(56,189,248,0.4)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(selPlat.x, selPlat.y, selRange, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  // Platforms & Towers
  const TOWER_COLS = {
    ballista: '#38bdf8',
    cannon: '#f97316',
    frost: '#a855f7'
  };

  for (let i = 0; i < PLATFORMS.length; i++) {
    const plat = PLATFORMS[i];
    const sl = state.slots[i];
    const isSel = i === selectedSlot;

    // Platform Base
    ctx.fillStyle = isSel ? '#1e293b' : '#0f172a';
    ctx.strokeStyle = isSel ? '#38bdf8' : '#475569';
    ctx.lineWidth = isSel ? 2.5 : 1.5;
    ctx.beginPath();
    ctx.arc(plat.x, plat.y, 22, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    if (sl.type !== 'empty') {
      // Tower Icon
      ctx.fillStyle = TOWER_COLS[sl.type];
      ctx.beginPath();
      ctx.arc(plat.x, plat.y, 14, 0, Math.PI * 2);
      ctx.fill();

      // Level stars / pip
      if (sl.level > 1) {
        ctx.fillStyle = '#fbbf24';
        ctx.beginPath();
        ctx.arc(plat.x, plat.y, 5, 0, Math.PI * 2);
        ctx.fill();
      }
    } else {
      ctx.fillStyle = '#64748b';
      ctx.font = 'bold 11px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(`P${i + 1}`, plat.x, plat.y + 4);
    }
  }

  // Creeps
  for (const c of state.creeps) {
    ctx.fillStyle = c.slowed > 0 ? '#38bdf8' : '#ef4444';
    ctx.beginPath();
    ctx.arc(c.x, c.y, 11, 0, Math.PI * 2);
    ctx.fill();

    // HP Bar
    const hpRatio = Math.max(0, c.hp / c.maxHp);
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(c.x - 12, c.y - 18, 24, 4);
    ctx.fillStyle = '#22c55e';
    ctx.fillRect(c.x - 12, c.y - 18, 24 * hpRatio, 4);
  }

  // HUD
  ctx.fillStyle = '#8a93a8';
  ctx.font = '12px system-ui, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('GOLD', 20, 32);
  ctx.textAlign = 'center';
  ctx.fillText('CITADEL HP', W / 2, 32);
  ctx.textAlign = 'right';
  ctx.fillText('BEST', W - 20, 32);

  ctx.fillStyle = '#fbbf24';
  ctx.font = 'bold 24px system-ui, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(`${state.gold} g`, 20, 60);
  ctx.fillStyle = state.citadelHp <= 3 ? '#ef4444' : '#22c55e';
  ctx.textAlign = 'center';
  ctx.fillText(`${state.citadelHp} / 10`, W / 2, 60);
  ctx.fillStyle = '#38bdf8';
  ctx.font = 'bold 20px system-ui, sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText(best, W - 20, 58);

  ctx.fillStyle = '#94a3b8';
  ctx.font = '13px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(`Wave ${state.wave} / 5   •   Score: ${score(state)}`, W / 2, 88);

  // Build / Upgrade Menu Tray at bottom
  ctx.fillStyle = '#1e293b';
  rrect(12, 550, W - 24, 76, 14);
  ctx.fill();

  if (selSlot.type === 'empty') {
    // 3 Build Buttons
    const canBallista = state.gold >= 25;
    ctx.fillStyle = canBallista ? '#0284c7' : '#334155';
    rrect(20, 560, 95, 56, 10);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 12px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('BALLISTA', 67, 582);
    ctx.fillStyle = '#fbbf24';
    ctx.fillText('25g', 67, 602);

    const canCannon = state.gold >= 40;
    ctx.fillStyle = canCannon ? '#c2410c' : '#334155';
    rrect(125, 560, 95, 56, 10);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.fillText('CANNON', 172, 582);
    ctx.fillStyle = '#fbbf24';
    ctx.fillText('40g', 172, 602);

    const canFrost = state.gold >= 35;
    ctx.fillStyle = canFrost ? '#7e22ce' : '#334155';
    rrect(230, 560, 95, 56, 10);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.fillText('FROST', 277, 582);
    ctx.fillStyle = '#fbbf24';
    ctx.fillText('35g', 277, 602);
  } else if (selSlot.level < 2) {
    const canUp = state.gold >= UPGRADE_COST;
    ctx.fillStyle = canUp ? '#15803d' : '#334155';
    rrect(100, 560, 160, 56, 10);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 14px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(`UPGRADE ${selSlot.type.toUpperCase()}`, 180, 584);
    ctx.fillStyle = '#fbbf24';
    ctx.fillText('30g', 180, 604);
  } else {
    ctx.fillStyle = '#fbbf24';
    ctx.font = 'bold 15px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('MAX LEVEL TOWER', W / 2, 595);
  }

  if (isOver(state)) {
    ctx.fillStyle = 'rgba(11,16,32,0.85)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = state.won ? '#22c55e' : '#ef4444';
    ctx.font = 'bold 34px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(state.won ? 'Citadel Defended!' : 'Citadel Fallen', W / 2, H / 2 - 32);
    ctx.fillStyle = '#e8ecf5';
    ctx.font = '22px system-ui, sans-serif';
    ctx.fillText('Final Score: ' + score(state), W / 2, H / 2 + 8);
    ctx.fillStyle = '#38bdf8';
    ctx.font = '18px system-ui, sans-serif';
    ctx.fillText('Tap anywhere to play again', W / 2, H / 2 + 50);
  }
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  updateSim(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

const inApk = window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform();
if (!inApk && 'serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
