<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <!-- Golden Star Trophy -->
    <path d="M256 90 L290 190 L395 190 L310 255 L345 355 L256 295 L167 355 L202 255 L117 190 L222 190 Z" fill="url(#gold)"/>
    <!-- Trophy Base -->
    <path d="M216 350 h80 v50 h-80 z M186 400 h140 v30 h-140 z" fill="url(#gold)"/>
  </g>
  <!-- Confetti circles -->
  <circle cx="120" cy="110" r="16" fill="#38bdf8"/>
  <circle cx="390" cy="110" r="14" fill="#4ade80"/>
  <circle cx="90" cy="310" r="12" fill="#fbbf24"/>
  <circle cx="420" cy="330" r="14" fill="#f43f5e"/>
</svg>
