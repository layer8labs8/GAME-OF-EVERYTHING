<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="domeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)" stroke="#38bdf8" stroke-width="8"/>
  <!-- Base Foundation Grid Lines -->
  <line x1="120" y1="360" x2="392" y2="360" stroke="#475569" stroke-width="6"/>
  <line x1="80" y1="410" x2="432" y2="410" stroke="#334155" stroke-width="6"/>
  <!-- Central Habitat Dome -->
  <path d="M 176 360 C 176 250 336 250 336 360 Z" fill="url(#domeGrad)" stroke="#ffffff" stroke-width="6"/>
  <!-- Dome Windows / Geodesic segments -->
  <line x1="256" y1="250" x2="256" y2="360" stroke="#0369a1" stroke-width="4"/>
  <line x1="200" y1="310" x2="312" y2="310" stroke="#0369a1" stroke-width="4"/>
  <!-- Solar Wing Left -->
  <rect x="80" y="270" width="70" height="40" rx="4" fill="#0284c7" stroke="#38bdf8" stroke-width="4"/>
  <line x1="150" y1="290" x2="176" y2="320" stroke="#64748b" stroke-width="5"/>
  <!-- Laser Turret Mount Top -->
  <circle cx="256" cy="230" r="16" fill="#f59e0b" stroke="#ffffff" stroke-width="4"/>
  <line x1="256" y1="230" x2="290" y2="190" stroke="#f43f5e" stroke-width="6" stroke-linecap="round"/>
  <!-- Power Conduits -->
  <path d="M 256 360 L 256 420 L 380 420" fill="none" stroke="#facc15" stroke-width="6" stroke-dasharray="10, 6"/>
</svg>
