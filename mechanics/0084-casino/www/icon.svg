<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="felt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#felt)"/>
  <rect x="28" y="28" width="456" height="456" rx="84" fill="none" stroke="url(#gold)" stroke-width="6" opacity="0.4"/>
  <!-- Roulette Wheel -->
  <g filter="url(#shadow)">
    <circle cx="256" cy="256" r="170" fill="#1c1917" stroke="url(#gold)" stroke-width="12"/>
    <circle cx="256" cy="256" r="120" fill="#064e3b" stroke="url(#gold)" stroke-width="4"/>
    <!-- Wheel Hub -->
    <circle cx="256" cy="256" r="50" fill="url(#gold)"/>
    <!-- Ball -->
    <circle cx="210" cy="180" r="14" fill="#ffffff" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.5))"/>
  </g>
</svg>
