<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b1020">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>Power Tiles</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b1020; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; margin: 0 auto; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="logic.js"></script>
<script>
const { N, createState, legalActions, step, isOver, score } = GameLogic;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const W = 360;
const H = 640;
const BX = 22;
const BY = 154;
const GAP = 10;
const CELL = 71.5;

const TILE_COLORS = {
  2: ['#25365e', '#e8ecf5'],
  4: ['#2d4678', '#e8ecf5'],
  8: ['#f08c00', '#ffffff'],
  16: ['#e8590c', '#ffffff'],
  32: ['#ff6b6b', '#ffffff'],
  64: ['#fa5252', '#ffffff'],
  128: ['#ffd43b', '#0b1020'],
  256: ['#fcc419', '#0b1020'],
  512: ['#51cf66', '#0b1020'],
  1024: ['#4fd1c5', '#0b1020'],
  2048: ['#b197fc', '#0b1020'],
};

let scale = 1;
function resize() {
  scale = Math.min(innerWidth / W, innerHeight / H);
  const dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.style.width = W * scale + 'px';
  canvas.style.height = H * scale + 'px';
  canvas.width = Math.round(W * scale * dpr);
  canvas.height = Math.round(H * scale * dpr);
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
}
addEventListener('resize', resize);
resize();

let best = 0;
try { best = +localStorage.getItem('goe-0063-best') || 0; } catch (e) {}

let state = createState(Date.now());
let swipeStart = null;
let overAt = 0;

function restart() {
  state = createState(Date.now());
  swipeStart = null;
  overAt = 0;
}

function rrect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function trySlide(dir) {
  if (isOver(state)) return;
  if (!legalActions(state).includes(dir)) return;
  const res = step(state, dir);
  const sc = score(state);
  if (sc > best) {
    best = sc;
    try { localStorage.setItem('goe-0063-best', best); } catch (e) {}
  }
  if (res.done) overAt = performance.now();
}

const DPAD = [
  { dir: 'U', x: 152, y: 498, w: 56, h: 48, label: '▲' },
  { dir: 'L', x: 90, y: 552, w: 56, h: 48, label: '◀' },
  { dir: 'D', x: 152, y: 552, w: 56, h: 48, label: '▼' },
  { dir: 'R', x: 214, y: 552, w: 56, h: 48, label: '▶' },
];

function toLogical(e) {
  const rect = canvas.getBoundingClientRect();
  return { x: (e.clientX - rect.left) / scale, y: (e.clientY - rect.top) / scale };
}

canvas.addEventListener('pointerdown', (e) => {
  const p = toLogical(e);
  if (isOver(state)) {
    if (performance.now() - overAt > 400) restart();
    return;
  }
  for (const b of DPAD) {
    if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) {
      trySlide(b.dir);
      return;
    }
  }
  swipeStart = p;
});

canvas.addEventListener('pointerup', (e) => {
  if (!swipeStart) return;
  const p = toLogical(e);
  const dx = p.x - swipeStart.x;
  const dy = p.y - swipeStart.y;
  swipeStart = null;
  if (Math.hypot(dx, dy) >= 22) {
    if (Math.abs(dx) > Math.abs(dy)) trySlide(dx > 0 ? 'R' : 'L');
    else trySlide(dy > 0 ? 'D' : 'U');
  }
});
canvas.addEventListener('pointercancel', () => { swipeStart = null; });

addEventListener('keydown', (e) => {
  if (isOver(state)) {
    if ((e.key === ' ' || e.key === 'Enter') && performance.now() - overAt > 400) restart();
    return;
  }
  if (e.key === 'ArrowUp' || e.key === 'w') trySlide('U');
  else if (e.key === 'ArrowDown' || e.key === 's') trySlide('D');
  else if (e.key === 'ArrowLeft' || e.key === 'a') trySlide('L');
  else if (e.key === 'ArrowRight' || e.key === 'd') trySlide('R');
  else if (e.key === 'r') restart();
});

function draw() {
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#182342');
  bg.addColorStop(1, '#0b1020');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = '#8a93a8';
  ctx.font = '12px system-ui, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('SCORE', 24, 42);
  ctx.textAlign = 'center';
  ctx.fillText('TOP TILE', W / 2, 42);
  ctx.textAlign = 'right';
  ctx.fillText('BEST', W - 24, 42);

  ctx.fillStyle = '#e8ecf5';
  ctx.font = 'bold 30px system-ui, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(score(state), 24, 78);
  ctx.fillStyle = '#ffd43b';
  ctx.textAlign = 'center';
  ctx.fillText(state.maxTile, W / 2, 78);
  ctx.fillStyle = '#e8ecf5';
  ctx.font = 'bold 22px system-ui, sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText(best, W - 24, 76);

  ctx.fillStyle = '#121b33';
  rrect(BX - 10, BY - 10, 4 * CELL + 3 * GAP + 20, 4 * CELL + 3 * GAP + 20, 16);
  ctx.fill();

  for (let r = 0; r < N; r++) {
    for (let c = 0; c < N; c++) {
      const x = BX + c * (CELL + GAP);
      const y = BY + r * (CELL + GAP);
      const v = state.grid[r][c];
      if (!v) {
        ctx.fillStyle = '#1b2747';
        rrect(x, y, CELL, CELL, 10);
        ctx.fill();
        continue;
      }
      const [fill, fg] = TILE_COLORS[v] || ['#b197fc', '#0b1020'];
      ctx.fillStyle = fill;
      rrect(x, y, CELL, CELL, 10);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.16)';
      rrect(x + 4, y + 4, CELL - 8, 16, 6);
      ctx.fill();
      ctx.fillStyle = fg;
      ctx.font = v >= 1000 ? 'bold 20px system-ui, sans-serif' : v >= 100 ? 'bold 24px system-ui, sans-serif' : 'bold 28px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(v, x + CELL / 2, y + CELL / 2 + 1);
    }
  }

  for (const b of DPAD) {
    ctx.fillStyle = '#1c294a';
    rrect(b.x, b.y, b.w, b.h, 10);
    ctx.fill();
    ctx.fillStyle = '#e8ecf5';
    ctx.font = 'bold 16px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(b.label, b.x + b.w / 2, b.y + b.h / 2 + 1);
  }
  ctx.textBaseline = 'alphabetic';

  if (isOver(state)) {
    ctx.fillStyle = 'rgba(11,16,32,0.84)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#e8ecf5';
    ctx.font = 'bold 34px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('No Moves Left', W / 2, H / 2 - 32);
    ctx.font = '22px system-ui, sans-serif';
    ctx.fillText(`Score: ${score(state)}  ·  Max: ${state.maxTile}`, W / 2, H / 2 + 8);
    ctx.fillStyle = '#4fd1c5';
    ctx.font = '18px system-ui, sans-serif';
    ctx.fillText('Tap to play again', W / 2, H / 2 + 50);
  }
}

function frame() {
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

const inApk = window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform();
if (!inApk && 'serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
