<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b1020">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>Rogue Depths</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b1020; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; margin: 0 auto; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="logic.js"></script>
<script>
const { SIZE, CELLS, createState, legalActions, step, isOver, score } = GameLogic;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const W = 360;
const H = 640;
const BX = 26;
const BY = 130;
const CELL = 44;

let scale = 1;
function resize() {
  scale = Math.min(innerWidth / W, innerHeight / H);
  const dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.style.width = W * scale + 'px';
  canvas.style.height = H * scale + 'px';
  canvas.width = Math.round(W * scale * dpr);
  canvas.height = Math.round(H * scale * dpr);
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
}
addEventListener('resize', resize);
resize();

let best = 0;
try { best = +localStorage.getItem('goe-0116-best') || 0; } catch (e) {}

let state = createState(Date.now());
let combatFx = null;
let overAt = 0;

function restart() {
  state = createState(Date.now());
  combatFx = null;
  overAt = 0;
}

function rrect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function toLogical(e) {
  const rect = canvas.getBoundingClientRect();
  return { x: (e.clientX - rect.left) / scale, y: (e.clientY - rect.top) / scale };
}

function doAction(act) {
  if (isOver(state)) return;
  const acts = legalActions(state);
  if (!acts.includes(act)) return;

  const res = step(state, act);
  if (res.done) {
    overAt = performance.now();
    const sc = score(state);
    if (sc > best) {
      best = sc;
      try { localStorage.setItem('goe-0116-best', best); } catch (e) {}
    }
  }
}

canvas.addEventListener('pointerdown', (e) => {
  const p = toLogical(e);
  if (isOver(state)) {
    if (performance.now() - overAt > 400) restart();
    return;
  }
  // Tap adjacent tile on grid
  if (p.x >= BX && p.x <= BX + SIZE * CELL && p.y >= BY && p.y <= BY + SIZE * CELL) {
    const c = Math.floor((p.x - BX) / CELL);
    const r = Math.floor((p.y - BY) / CELL);
    const h = state.hero;
    if (r === h.y - 1 && c === h.x) doAction('up');
    else if (r === h.y + 1 && c === h.x) doAction('down');
    else if (r === h.y && c === h.x - 1) doAction('left');
    else if (r === h.y && c === h.x + 1) doAction('right');
    return;
  }

  // D-pad controls at bottom
  if (p.y >= 460) {
    // Up
    if (p.x >= 70 && p.x <= 130 && p.y >= 460 && p.y <= 510) doAction('up');
    // Down
    else if (p.x >= 70 && p.x <= 130 && p.y >= 570 && p.y <= 620) doAction('down');
    // Left
    else if (p.x >= 15 && p.x <= 75 && p.y >= 515 && p.y <= 565) doAction('left');
    // Right
    else if (p.x >= 125 && p.x <= 185 && p.y >= 515 && p.y <= 565) doAction('right');
    // Potion Button
    else if (p.x >= 230 && p.x <= 330 && p.y >= 500 && p.y <= 580) doAction('potion');
  }
});

addEventListener('keydown', (e) => {
  if (isOver(state)) {
    if ((e.key === ' ' || e.key === 'Enter') && performance.now() - overAt > 400) restart();
    return;
  }
  if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') doAction('up');
  else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') doAction('down');
  else if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') doAction('left');
  else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') doAction('right');
  else if (e.key === 'p' || e.key === 'P' || e.key === ' ') doAction('potion');
  else if (e.key === 'r') restart();
});

function drawTile(type, x, y) {
  if (type === 1) {
    // Wall
    ctx.fillStyle = '#1e293b';
    rrect(x + 1, y + 1, CELL - 2, CELL - 2, 4);
    ctx.fill();
    ctx.strokeStyle = '#334155';
    ctx.lineWidth = 1;
    ctx.stroke();
  } else if (type === 2) {
    // Monster (Goblin/Fiend)
    ctx.fillStyle = '#f43f5e';
    ctx.beginPath();
    ctx.arc(x + CELL / 2, y + CELL / 2, 12, 0, Math.PI * 2);
    ctx.fill();

    // Eyes
    ctx.fillStyle = '#fef08a';
    ctx.fillRect(x + CELL / 2 - 6, y + CELL / 2 - 3, 3, 3);
    ctx.fillRect(x + CELL / 2 + 3, y + CELL / 2 - 3, 3, 3);
  } else if (type === 3) {
    // Chest
    ctx.fillStyle = '#eab308';
    rrect(x + 10, y + 12, 24, 20, 4);
    ctx.fill();
    ctx.fillStyle = '#713f12';
    ctx.fillRect(x + 10, y + 18, 24, 3);
  } else if (type === 4) {
    // Potion
    ctx.fillStyle = '#ef4444';
    ctx.beginPath();
    ctx.arc(x + CELL / 2, y + CELL / 2 + 4, 9, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(x + CELL / 2 - 3, y + CELL / 2 - 9, 6, 6);
  } else if (type === 5) {
    // Stairs
    ctx.fillStyle = '#38bdf8';
    ctx.font = 'bold 20px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('▼', x + CELL / 2, y + CELL / 2 + 7);
  }
}

function draw() {
  ctx.fillStyle = '#0b1020';
  ctx.fillRect(0, 0, W, H);

  // HUD
  ctx.fillStyle = '#8a93a8';
  ctx.font = '12px system-ui, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('HEALTH', 24, 32);
  ctx.textAlign = 'center';
  ctx.fillText('DUNGEON FLOOR', W / 2, 32);
  ctx.textAlign = 'right';
  ctx.fillText('BEST', W - 24, 32);

  // Health Bar
  const hpRatio = Math.max(0, state.hero.hp / state.hero.maxHp);
  ctx.fillStyle = '#1e293b';
  rrect(24, 42, 110, 14, 4);
  ctx.fill();
  ctx.fillStyle = hpRatio > 0.3 ? '#22c55e' : '#ef4444';
  rrect(24, 42, 110 * hpRatio, 14, 4);
  ctx.fill();

  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 10px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(`${state.hero.hp}/${state.hero.maxHp}`, 79, 53);

  ctx.fillStyle = '#38bdf8';
  ctx.font = 'bold 22px system-ui, sans-serif';
  ctx.fillText(`Floor ${state.floor} / 3`, W / 2, 60);

  ctx.fillStyle = '#fbbf24';
  ctx.font = 'bold 20px system-ui, sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText(best, W - 24, 58);

  ctx.fillStyle = '#94a3b8';
  ctx.font = '12px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(`Gold: ${state.hero.gold} g   •   Score: ${score(state)}`, W / 2, 88);

  // Grid
  ctx.fillStyle = '#080d1a';
  rrect(BX - 4, BY - 4, SIZE * CELL + 8, SIZE * CELL + 8, 10);
  ctx.fill();

  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      const idx = r * SIZE + c;
      const x = BX + c * CELL;
      const y = BY + r * CELL;
      const vis = state.revealed[idx];

      if (!vis) {
        // Fog of war
        ctx.fillStyle = '#040711';
        ctx.fillRect(x, y, CELL, CELL);
        continue;
      }

      // Passable floor tile
      ctx.fillStyle = (r + c) % 2 === 0 ? '#131b2e' : '#0f172a';
      ctx.fillRect(x, y, CELL, CELL);

      const type = state.grid[idx];
      drawTile(type, x, y);
    }
  }

  // Draw Hero
  const hx = BX + state.hero.x * CELL;
  const hy = BY + state.hero.y * CELL;
  ctx.fillStyle = '#38bdf8';
  ctx.beginPath();
  ctx.arc(hx + CELL / 2, hy + CELL / 2, 14, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 2;
  ctx.stroke();

  // Helmet visor
  ctx.fillStyle = '#0f172a';
  ctx.fillRect(hx + CELL / 2 - 6, hy + CELL / 2 - 4, 12, 4);

  // Controls UI at bottom
  // D-pad
  ctx.fillStyle = 'rgba(30,41,59,0.8)';
  rrect(70, 460, 60, 50, 10); ctx.fill();
  rrect(70, 570, 60, 50, 10); ctx.fill();
  rrect(15, 515, 60, 50, 10); ctx.fill();
  rrect(125, 515, 60, 50, 10); ctx.fill();

  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 18px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('▲', 100, 492);
  ctx.fillText('▼', 100, 602);
  ctx.fillText('◀', 45, 547);
  ctx.fillText('▶', 155, 547);

  // Potion Button
  const canPot = state.hero.potions > 0 && state.hero.hp < state.hero.maxHp;
  ctx.fillStyle = canPot ? '#dc2626' : '#334155';
  rrect(230, 500, 100, 80, 14);
  ctx.fill();

  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 15px system-ui, sans-serif';
  ctx.fillText('POTION', 280, 536);
  ctx.fillStyle = '#fbbf24';
  ctx.font = 'bold 13px system-ui, sans-serif';
  ctx.fillText(`x ${state.hero.potions}`, 280, 560);

  if (isOver(state)) {
    ctx.fillStyle = 'rgba(11,16,32,0.85)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = state.won ? '#22c55e' : '#ef4444';
    ctx.font = 'bold 34px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(state.won ? 'Dungeon Conquered!' : 'You Perished', W / 2, H / 2 - 32);
    ctx.fillStyle = '#e8ecf5';
    ctx.font = '22px system-ui, sans-serif';
    ctx.fillText('Final Score: ' + score(state), W / 2, H / 2 + 8);
    ctx.fillStyle = '#38bdf8';
    ctx.font = '18px system-ui, sans-serif';
    ctx.fillText('Tap anywhere to descend again', W / 2, H / 2 + 50);
  }
}

function frame() {
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

const inApk = window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform();
if (!inApk && 'serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
