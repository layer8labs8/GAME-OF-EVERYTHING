<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="twilight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#fde047" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="120" fill="url(#twilight)"/>
  <!-- Mountain & Cliff Silhouettes -->
  <polygon points="0,512 0,380 120,320 220,390 350,290 512,380 512,512" fill="#020617"/>
  <!-- Lighthouse on promontory -->
  <rect x="330" y="220" width="36" height="70" fill="#e2e8f0"/>
  <rect x="325" y="210" width="46" height="10" fill="#dc2626"/>
  <circle cx="348" cy="200" r="16" fill="#fef08a"/>
  <!-- Light Beam Sweep -->
  <polygon points="348,200 0,60 0,180" fill="url(#beam)"/>
  <!-- Pine tree silhouettes -->
  <polygon points="100,340 85,390 115,390" fill="#0f172a"/>
  <polygon points="140,330 125,385 155,385" fill="#0f172a"/>
  <!-- Solitary Walker Silhouette -->
  <circle cx="210" cy="350" r="8" fill="#e2e8f0"/>
  <line x1="210" y1="358" x2="210" y2="385" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round"/>
  <line x1="210" y1="385" x2="200" y2="405" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round"/>
  <line x1="210" y1="385" x2="218" y2="405" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round"/>
  <!-- Walking stick -->
  <line x1="218" y1="365" x2="225" y2="405" stroke="#94a3b8" stroke-width="3"/>
</svg>
