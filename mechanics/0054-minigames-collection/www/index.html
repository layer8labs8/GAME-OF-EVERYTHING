<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Micro Blitz</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ec4899">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background: #09090b;
      color: #f4f4f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 10px;
    }
    header {
      width: 100%;
      max-width: 500px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 8px;
      margin-bottom: 8px;
    }
    .hud-title {
      font-size: 16px;
      font-weight: 900;
      color: #ec4899;
      letter-spacing: 1px;
    }
    .hud-stats {
      display: flex;
      gap: 10px;
      font-size: 13px;
    }
    .stat-pill {
      background: #27272a;
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px solid #3f3f46;
    }

    #gameCanvas {
      background: #020617;
      border: 3px solid #ec4899;
      border-radius: 8px;
      box-shadow: 0 0 25px rgba(236, 72, 153, 0.3);
      max-width: 100%;
      touch-action: none;
    }

    .prompt-banner {
      width: 100%;
      max-width: 500px;
      background: #f43f5e;
      color: #ffffff;
      padding: 8px 12px;
      border-radius: 6px;
      margin-top: 8px;
      text-align: center;
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 1px;
      box-shadow: 0 4px 12px rgba(244, 63, 94, 0.4);
    }

    .controls-panel {
      width: 100%;
      max-width: 500px;
      margin-top: 8px;
      display: flex;
      gap: 8px;
    }
    .ctrl-btn {
      flex: 1;
      background: #27272a;
      border: 2px solid #52525b;
      color: #f4f4f5;
      padding: 14px 8px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.08s ease;
    }
    .ctrl-btn:hover { background: #3f3f46; border-color: #a1a1aa; }
    .ctrl-btn:active { transform: scale(0.96); background: #ec4899; }
    .ctrl-btn.primary { background: #e11d48; border-color: #fb7185; }

    #overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(9, 9, 11, 0.94);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <header>
    <div class="hud-title">MICRO BLITZ</div>
    <div class="hud-stats">
      <span class="stat-pill">Hearts: <strong id="livesEl" style="color: #f43f5e;">❤❤❤❤</strong></span>
      <span class="stat-pill">Stage: <strong id="stageEl">1/5</strong></span>
      <span class="stat-pill">Score: <strong id="scoreEl">0</strong></span>
    </div>
  </header>

  <div style="position: relative; width: 500px; max-width: 100%;">
    <canvas id="gameCanvas" width="500" height="360"></canvas>
    <div id="overlay">
      <h2 id="overlayTitle" style="font-size: 32px; color: #ec4899; margin-bottom: 12px;">GAUNTLET CLEARED!</h2>
      <p id="overlayDesc" style="color: #a1a1aa; margin-bottom: 24px;">All micro-challenges completed!</p>
      <button class="ctrl-btn primary" id="playAgainBtn" style="max-width: 200px; padding: 12px 24px;">Play Again</button>
    </div>
  </div>

  <div class="prompt-banner" id="promptBanner">DODGE!</div>

  <div class="controls-panel" id="controlsPanel"></div>

  <script src="logic.js"></script>
  <script>
    let state = createState(1);
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas ? canvas.getContext("2d") : null;

    let audioCtx = null;
    function playTone(freq, type = 'sine', duration = 0.08) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function updateUI() {
      const livesEl = document.getElementById("livesEl");
      if (livesEl) {
        let hearts = "";
        for (let i = 0; i < state.lives; i++) hearts += "❤";
        livesEl.textContent = hearts || "NONE";
      }

      const stageEl = document.getElementById("stageEl");
      if (stageEl) stageEl.textContent = `${Math.min(TOTAL_STAGES, state.stageIndex + 1)}/${TOTAL_STAGES}`;
      const scoreEl = document.getElementById("scoreEl");
      if (scoreEl) scoreEl.textContent = score(state);

      const promptBanner = document.getElementById("promptBanner");
      if (promptBanner) promptBanner.textContent = state.prompt;

      // Render Dynamic Controls Panel based on current stage legal actions
      const panel = document.getElementById("controlsPanel");
      if (panel) {
        let html = "";
        const legal = legalActions(state);
        legal.forEach(act => {
          let label = act;
          let cls = "ctrl-btn";
          if (act === "move_left") label = "◀ Left";
          else if (act === "move_right") label = "Right ▶";
          else if (act === "stay") label = "Stay";
          else if (act === "pump") { label = "🎈 PUMP!"; cls += " primary"; }
          else if (act === "wait") label = "Wait";
          else if (act.startsWith("pick:")) {
            const idx = parseInt(act.slice(5), 10);
            const sym = (state.matchOptions && state.matchOptions[idx]) || idx;
            label = `Pick ${sym}`;
          } else if (act === "deflect") { label = "🛡️ DEFLECT!"; cls += " primary"; }

          html += `<button class="${cls}" data-action="${act}">${label}</button>`;
        });
        panel.innerHTML = html;

        const buttons = (typeof panel.querySelectorAll === 'function') ? panel.querySelectorAll(".ctrl-btn") : [];
        if (buttons && buttons.length) {
          buttons.forEach(btn => {
            if (typeof btn.addEventListener === 'function') {
              btn.addEventListener("click", () => {
                const act = (typeof btn.getAttribute === 'function') ? btn.getAttribute("data-action") : null;
                if (act) doAction(act);
              });
            }
          });
        }
      }

      if (state.done) {
        const overlay = document.getElementById("overlay");
        if (overlay) overlay.style.display = "flex";
        const title = document.getElementById("overlayTitle");
        const desc = document.getElementById("overlayDesc");
        if (title && desc) {
          if (state.won) {
            title.textContent = "GAUNTLET CLEARED!";
            title.style.color = "#ec4899";
            desc.textContent = `All stages conquered with ${score(state)} points!`;
            playTone(659, 'triangle', 0.35);
          } else {
            title.textContent = "GAME OVER";
            title.style.color = "#f43f5e";
            desc.textContent = `Out of lives. Total score: ${score(state)}`;
            playTone(180, 'sawtooth', 0.35);
          }
        }
      }
    }

    function render() {
      if (!ctx || !canvas) return;
      ctx.fillStyle = "#020617";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const st = state.stageIndex;

      if (st === 0 || st === 1) {
        // 3 Lanes
        const laneW = canvas.width / 3;
        for (let i = 0; i < 3; i++) {
          ctx.strokeStyle = "#1e293b";
          ctx.strokeRect(i * laneW, 0, laneW, canvas.height);

          if (st === 0 && i === state.dangerLane) {
            // Falling danger boulder
            ctx.fillStyle = "rgba(239, 68, 68, 0.25)";
            ctx.fillRect(i * laneW, 0, laneW, canvas.height);
            ctx.fillStyle = "#ef4444";
            ctx.beginPath();
            ctx.arc(i * laneW + laneW / 2, 80 + state.stageStep * 60, 32, 0, Math.PI * 2);
            ctx.fill();
            ctx.font = "28px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("💣", i * laneW + laneW / 2, 88 + state.stageStep * 60);
          }

          if (st === 1 && i === state.targetLane) {
            // Falling gold gem
            ctx.fillStyle = "rgba(234, 179, 8, 0.2)";
            ctx.fillRect(i * laneW, 0, laneW, canvas.height);
            ctx.fillStyle = "#eab308";
            ctx.font = "36px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("💎", i * laneW + laneW / 2, 80 + state.stageStep * 60);
          }
        }

        // Player cart / character at bottom
        const px = state.playerLane * laneW + laneW / 2;
        ctx.fillStyle = (st === 0) ? "#38bdf8" : "#f59e0b";
        ctx.beginPath();
        ctx.arc(px, canvas.height - 50, 26, 0, Math.PI * 2);
        ctx.fill();
        ctx.font = "28px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(st === 0 ? "🏃" : "🧺", px, canvas.height - 40);

      } else if (st === 2) {
        // PUMP STAGE: Balloon
        const bx = canvas.width / 2;
        const by = canvas.height / 2;
        const rad = 30 + state.pumps * 35;

        ctx.fillStyle = "#f43f5e";
        ctx.beginPath();
        ctx.arc(bx, by, rad, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#fda4af";
        ctx.lineWidth = 4;
        ctx.stroke();

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 24px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(`${state.pumps}/${state.targetPumps}`, bx, by + 8);

      } else if (st === 3) {
        // MATCH STAGE
        ctx.fillStyle = "#a855f7";
        ctx.font = "bold 64px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(state.targetSymbol, canvas.width / 2, 110);
        ctx.font = "14px sans-serif";
        ctx.fillStyle = "#c084fc";
        ctx.fillText("TARGET PATTERN", canvas.width / 2, 150);

        if (state.matchOptions) {
          const optW = canvas.width / 3;
          for (let i = 0; i < 3; i++) {
            const ox = i * optW + optW / 2;
            ctx.fillStyle = "#1e1b4b";
            ctx.fillRect(i * optW + 10, 200, optW - 20, 100);
            ctx.strokeStyle = "#6366f1";
            ctx.strokeRect(i * optW + 10, 200, optW - 20, 100);
            ctx.fillStyle = "#ffffff";
            ctx.font = "38px sans-serif";
            ctx.fillText(state.matchOptions[i], ox, 260);
          }
        }
      } else if (st === 4) {
        // DEFLECT STAGE
        ctx.fillStyle = "#38bdf8";
        ctx.fillRect(60, canvas.height / 2 - 30, 40, 60); // Shield zone
        ctx.strokeStyle = "#0284c7";
        ctx.strokeRect(60, canvas.height / 2 - 30, 40, 60);

        // Projectile moving leftward
        const projX = 80 + state.projectileDist * 160;
        ctx.fillStyle = "#ef4444";
        ctx.beginPath();
        ctx.arc(projX, canvas.height / 2, 22, 0, Math.PI * 2);
        ctx.fill();
        ctx.font = "24px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("⚡", projX, canvas.height / 2 + 8);
      }
    }

    function doAction(action) {
      if (state.done) return;
      try {
        const res = step(state, action);
        if (res.reward > 0) playTone(523, 'triangle', 0.1);
        else if (res.reward < 0) playTone(180, 'sawtooth', 0.15);
        updateUI();
        render();
      } catch (err) {
        console.warn(err);
      }
    }

    const playAgainBtn = document.getElementById("playAgainBtn");
    if (playAgainBtn && typeof playAgainBtn.addEventListener === 'function') {
      playAgainBtn.addEventListener("click", () => {
        state = createState(state.seed + 1);
        const overlay = document.getElementById("overlay");
        if (overlay) overlay.style.display = "none";
        updateUI();
        render();
      });
    }

    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") {
        const legal = legalActions(state);
        if (legal.includes("move_left")) doAction("move_left");
      } else if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") {
        const legal = legalActions(state);
        if (legal.includes("move_right")) doAction("move_right");
      } else if (e.code === "Space") {
        e.preventDefault();
        const legal = legalActions(state);
        if (legal.includes("pump")) doAction("pump");
        else if (legal.includes("deflect")) doAction("deflect");
        else if (legal.includes("stay")) doAction("stay");
        else if (legal.includes("wait")) doAction("wait");
      }
    });

    updateUI();
    render();
  </script>
</body>
</html>
