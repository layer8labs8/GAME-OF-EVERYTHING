<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="70%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>
    <radialGradient id="ringGlow" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#fbbf24" stop-opacity="0" />
      <stop offset="85%" stop-color="#f59e0b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#d97706" />
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#skyGrad)" />
  <!-- Fluffy Cirrus Clouds -->
  <ellipse cx="140" cy="180" rx="90" ry="40" fill="#ffffff" opacity="0.6" />
  <ellipse cx="380" cy="340" rx="110" ry="48" fill="#ffffff" opacity="0.5" />
  <!-- Glowing Sky Ring Waypoint -->
  <ellipse cx="256" cy="240" rx="150" ry="90" fill="none" stroke="#f59e0b" stroke-width="18" stroke-dasharray="24 12" />
  <ellipse cx="256" cy="240" rx="146" ry="86" fill="none" stroke="#fef08a" stroke-width="6" />
  <!-- Aerobatic Propeller Aircraft Center Cross -->
  <g transform="translate(256, 240) rotate(-12)">
    <!-- Wings -->
    <path d="M -130 -5 L 130 -5 L 115 15 L -115 15 Z" fill="#e0f2fe" stroke="#0284c7" stroke-width="4" />
    <rect x="-120" y="-3" width="24" height="6" fill="#ef4444" />
    <rect x="96" y="-3" width="24" height="6" fill="#22c55e" />
    <!-- Fuselage Body -->
    <ellipse cx="0" cy="0" rx="20" ry="60" fill="#f8fafc" stroke="#0369a1" stroke-width="4" />
    <!-- Cockpit Canopy Glass -->
    <ellipse cx="0" cy="-12" rx="10" ry="24" fill="#38bdf8" stroke="#0284c7" stroke-width="2" />
    <!-- Tail Fin -->
    <path d="M -12 40 L 12 40 L 0 70 Z" fill="#ef4444" stroke="#991b1b" stroke-width="3" />
    <!-- Horizontal Stabilizers -->
    <rect x="-45" y="46" width="90" height="10" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" />
    <!-- Propeller Spinner Arc -->
    <ellipse cx="0" cy="-60" rx="28" ry="4" fill="#cbd5e1" opacity="0.7" />
    <circle cx="0" cy="-60" r="6" fill="#f59e0b" />
  </g>
</svg>
