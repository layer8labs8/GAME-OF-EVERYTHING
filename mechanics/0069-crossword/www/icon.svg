<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="tile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <rect width="500" height="500" x="6" y="6" rx="90" fill="none" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.3"/>
  <g transform="translate(96, 96)">
    <!-- Crossword Tiles: 3x3 intersecting pattern -->
    <rect x="0" y="80" width="70" height="70" rx="10" fill="#1e293b" stroke="#475569" stroke-width="4"/>
    <text x="35" y="125" fill="#94a3b8" font-size="34" font-weight="bold" font-family="sans-serif" text-anchor="middle">W</text>

    <rect x="80" y="0" width="70" height="70" rx="10" fill="#1e293b" stroke="#475569" stroke-width="4"/>
    <text x="115" y="45" fill="#94a3b8" font-size="34" font-weight="bold" font-family="sans-serif" text-anchor="middle">C</text>

    <!-- Intersecting highlighted cell -->
    <rect x="80" y="80" width="70" height="70" rx="10" fill="url(#tile)" stroke="#e0f2fe" stroke-width="6" filter="url(#glow)"/>
    <text x="115" y="128" fill="#ffffff" font-size="40" font-weight="bold" font-family="sans-serif" text-anchor="middle">O</text>

    <rect x="80" y="160" width="70" height="70" rx="10" fill="#1e293b" stroke="#475569" stroke-width="4"/>
    <text x="115" y="205" fill="#94a3b8" font-size="34" font-weight="bold" font-family="sans-serif" text-anchor="middle">D</text>

    <rect x="80" y="240" width="70" height="70" rx="10" fill="#1e293b" stroke="#475569" stroke-width="4"/>
    <text x="115" y="285" fill="#94a3b8" font-size="34" font-weight="bold" font-family="sans-serif" text-anchor="middle">E</text>

    <rect x="160" y="80" width="70" height="70" rx="10" fill="#1e293b" stroke="#475569" stroke-width="4"/>
    <text x="195" y="125" fill="#94a3b8" font-size="34" font-weight="bold" font-family="sans-serif" text-anchor="middle">R</text>

    <rect x="240" y="80" width="70" height="70" rx="10" fill="#1e293b" stroke="#475569" stroke-width="4"/>
    <text x="275" y="125" fill="#94a3b8" font-size="34" font-weight="bold" font-family="sans-serif" text-anchor="middle">D</text>
  </g>
</svg>
