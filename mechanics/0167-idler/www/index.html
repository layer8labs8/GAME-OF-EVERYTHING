<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#050b18">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>Stellar Reactor</title>
<style>
  html, body { margin: 0; height: 100%; background: #050b18; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; font-family: system-ui, -apple-system, sans-serif; }
  canvas { display: block; margin: 0 auto; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="logic.js"></script>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const W = 360;
const H = 640;
const CORE_X = 180;
const CORE_Y = 182;
const CORE_R = 76;

let scale = 1;
function resize() {
  scale = Math.min(innerWidth / W, innerHeight / H);
  const dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.style.width = W * scale + 'px';
  canvas.style.height = H * scale + 'px';
  canvas.width = Math.round(W * scale * dpr);
  canvas.height = Math.round(H * scale * dpr);
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
}
addEventListener('resize', resize);
resize();

function rrect(x, y, w, h, r) {
  const rr = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.arcTo(x + w, y, x + w, y + h, rr);
  ctx.arcTo(x + w, y + h, x, y + h, rr);
  ctx.arcTo(x, y + h, x, y, rr);
  ctx.arcTo(x, y, x + w, y, rr);
  ctx.closePath();
}

let audioCtx = null;
function playSfx(freq, freq2, dur, type, vol) {
  try {
    const AC = typeof AudioContext !== 'undefined' ? AudioContext : (typeof webkitAudioContext !== 'undefined' ? webkitAudioContext : null);
    if (!AC) return;
    if (!audioCtx) audioCtx = new AC();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t);
    if (freq2) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq2), t + dur);
    gain.gain.setValueAtTime(vol || 0.1, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + dur);
  } catch (e) {}
}

let best = 0;
try { best = +localStorage.getItem('goe-0167-best') || 0; } catch (e) {}

const GEN_META = [
  { id: 'solenoid', name: 'Magnetic Solenoid', yieldTxt: '+2⚡/tick', color: '#38bdf8' },
  { id: 'injector', name: 'Deuterium Injector', yieldTxt: '+10⚡ +0.5🟣', color: '#06b6d4' },
  { id: 'tokamak', name: 'Toroidal Tokamak', yieldTxt: '+45⚡ +2🟣', color: '#818cf8' },
  { id: 'antimatterCore', name: 'Antimatter Core', yieldTxt: '+220⚡ +8🟣', color: '#c084fc' },
  { id: 'dysonRelay', name: 'Dyson Beam Relay', yieldTxt: '+1000⚡ +35🟣', color: '#fbbf24' }
];

let state = createState(Date.now());
let visTemp = state.coreTemp;
let coreScale = 1;
let phase = 0;
let idleAcc = 0;
let holdCore = false;
let holdAcc = 0;
let overAt = 0;
let rings = [];
let floaters = [];

function fmt(n) {
  if (n >= 1000000) return (n / 1000000).toFixed(2) + 'M';
  if (n >= 10000) return (n / 1000).toFixed(1) + 'k';
  return Math.floor(n).toLocaleString();
}

function restart() {
  state = createState(Date.now());
  visTemp = state.coreTemp;
  coreScale = 1;
  idleAcc = 0;
  holdCore = false;
  holdAcc = 0;
  overAt = 0;
  rings = [];
  floaters = [];
}

function execStep(act) {
  if (isOver(state)) return false;
  const valid = legalActions(state);
  if (!valid.includes(act)) return false;
  const prevE = state.energy;
  const res = step(state, act);
  const diffE = state.energy - prevE;
  const sc = score(state);
  if (sc > best) {
    best = sc;
    try { localStorage.setItem('goe-0167-best', best); } catch (e) {}
  }
  if (res.done) overAt = performance.now();
  return { ok: true, diffE };
}

function triggerPulse(px, py) {
  const out = execStep('action:pulse_reactor_core');
  if (!out) return;
  coreScale = 1.14;
  rings.push({ r: 26, maxR: 98, alpha: 0.9, color: state.coreTemp > 80 ? '#f97316' : '#38bdf8' });
  const gain = Math.max(6, out.diffE);
  floaters.push({ text: '+' + fmt(gain) + ' ⚡', x: px || CORE_X, y: (py || CORE_Y) - 18, t: 0, color: '#7dd3fc' });
  playSfx(240 + state.coreTemp * 2, 110, 0.09, 'sine', 0.1);
}

function toLogical(e) {
  const rect = canvas.getBoundingClientRect();
  return { x: (e.clientX - rect.left) / scale, y: (e.clientY - rect.top) / scale };
}

canvas.addEventListener('pointerdown', (e) => {
  const p = toLogical(e);
  if (isOver(state)) {
    if (performance.now() - overAt > 400) restart();
    return;
  }

  const valid = legalActions(state);

  // Stellar Ignition Victory Button
  if (valid.includes('action:achieve_stellar_ignition') && p.x >= 20 && p.x <= 340 && p.y >= 264 && p.y <= 296) {
    execStep('action:achieve_stellar_ignition');
    playSfx(440, 1320, 0.4, 'triangle', 0.2);
    return;
  }

  // Reactor Core Tap / Hold
  const dx = p.x - CORE_X;
  const dy = p.y - CORE_Y;
  if (dx * dx + dy * dy <= (CORE_R + 24) * (CORE_R + 24) && p.y < 296) {
    canvas.setPointerCapture(e.pointerId);
    holdCore = true;
    holdAcc = 0;
    triggerPulse(p.x, p.y);
    return;
  }

  // Control Row (y = 300..344)
  if (p.y >= 300 && p.y <= 344) {
    if (p.x >= 16 && p.x < 122) {
      if (execStep('action:cycle_cryo_coolant')) {
        rings.push({ r: 85, maxR: 25, alpha: 0.9, color: '#67e8f9' });
        floaters.push({ text: '-35° CRYO', x: 70, y: 295, t: 0, color: '#67e8f9' });
        playSfx(680, 180, 0.18, 'triangle', 0.12);
      }
    } else if (p.x >= 126 && p.x < 234) {
      if (execStep('action:engage_plasma_overclock')) {
        rings.push({ r: 20, maxR: 110, alpha: 1, color: '#f97316' });
        floaters.push({ text: '2X OVERCLOCK!', x: 180, y: 295, t: 0, color: '#fb923c' });
        playSfx(200, 620, 0.2, 'sawtooth', 0.12);
      }
    } else if (p.x >= 238 && p.x <= 344) {
      if (execStep('action:quantum_overdrive_prestige')) {
        rings.push({ r: 10, maxR: 150, alpha: 1, color: '#c084fc' });
        floaters.push({ text: '+1 DARK MATTER!', x: 260, y: 295, t: 0, color: '#e879f9' });
        playSfx(140, 880, 0.32, 'sawtooth', 0.16);
      }
    }
    return;
  }

  // 5 Generator Cards (y = 352..622, height 50 + 4 gap = 54)
  if (p.y >= 352 && p.y <= 622 && p.x >= 16 && p.x <= 344) {
    const idx = Math.floor((p.y - 352) / 54);
    if (GEN_META[idx]) {
      const act = 'action:purchase_generator:' + GEN_META[idx].id;
      if (execStep(act)) {
        rings.push({ r: 30, maxR: 90, alpha: 0.75, color: GEN_META[idx].color });
        floaters.push({ text: '+1 ' + GEN_META[idx].name.split(' ')[1], x: p.x, y: p.y - 10, t: 0, color: GEN_META[idx].color });
        playSfx(440, 680, 0.12, 'triangle', 0.12);
      }
    }
  }
});

addEventListener('pointerup', () => { holdCore = false; });
addEventListener('pointercancel', () => { holdCore = false; });

addEventListener('keydown', (e) => {
  if (isOver(state)) {
    if ((e.key === ' ' || e.key === 'Enter') && performance.now() - overAt > 400) restart();
    return;
  }
  if (e.key === ' ' || e.key === 'Enter') {
    const valid = legalActions(state);
    if (valid.includes('action:achieve_stellar_ignition')) execStep('action:achieve_stellar_ignition');
    else triggerPulse(CORE_X, CORE_Y);
  } else if (e.key === 'c' || e.key === 'C') {
    if (execStep('action:cycle_cryo_coolant')) playSfx(680, 180, 0.18, 'triangle', 0.12);
  } else if (e.key === 'o' || e.key === 'O') {
    if (execStep('action:engage_plasma_overclock')) playSfx(200, 620, 0.2, 'sawtooth', 0.12);
  } else if (e.key === 'p' || e.key === 'P') {
    if (execStep('action:quantum_overdrive_prestige')) playSfx(140, 880, 0.32, 'sawtooth', 0.16);
  } else if (e.key >= '1' && e.key <= '5') {
    const idx = parseInt(e.key, 10) - 1;
    if (execStep('action:purchase_generator:' + GEN_META[idx].id)) playSfx(440, 680, 0.12, 'triangle', 0.12);
  } else if (e.key === 'r' || e.key === 'R') {
    restart();
  }
});

function update(dt) {
  phase += dt * (1.8 + (state.overclockTurns > 0 ? 2.5 : 0));
  visTemp += (state.coreTemp - visTemp) * Math.min(1, dt * 10);
  coreScale += (1 - coreScale) * Math.min(1, dt * 14);

  if (!isOver(state)) {
    if (holdCore) {
      holdAcc += dt;
      if (holdAcc >= 0.12) {
        holdAcc = 0;
        if (state.coreTemp >= 92) {
          execStep('action:cycle_cryo_coolant');
          floaters.push({ text: 'AUTO-CRYO!', x: CORE_X, y: CORE_Y - 40, t: 0, color: '#67e8f9' });
        } else {
          triggerPulse(CORE_X + Math.sin(phase * 5) * 16, CORE_Y + Math.cos(phase * 4) * 12);
        }
      }
    }

    idleAcc += dt;
    if (idleAcc >= 0.60) {
      idleAcc -= 0.60;
      const prevE = state.energy;
      execStep('action:idle_cycle');
      const gain = state.energy - prevE;
      if (gain > 0) {
        floaters.push({ text: '+' + fmt(gain), x: CORE_X + 46, y: CORE_Y - 38, t: 0, color: '#38bdf8' });
      }
    }
  }

  for (const r of rings) {
    r.r += (r.maxR - r.r) * Math.min(1, dt * 9);
    r.alpha -= dt * 2.1;
  }
  rings = rings.filter((r) => r.alpha > 0.02);

  for (const f of floaters) f.t += dt;
  floaters = floaters.filter((f) => f.t < 0.75);
}

function draw() {
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#09152b');
  bg.addColorStop(1, '#040812');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // Top Resource HUD
  const cards = [
    { label: 'ENERGY', val: fmt(state.energy), col: '#38bdf8' },
    { label: 'NEUTRONS', val: fmt(state.neutrons), col: '#c084fc' },
    { label: 'DARK MATTER', val: state.darkMatter + ' (' + (1 + state.darkMatter * 0.5).toFixed(1) + 'x)', col: '#f472b6' },
    { label: 'SCORE', val: fmt(score(state)), col: '#fbbf24' }
  ];
  for (let i = 0; i < 4; i++) {
    const cx = 12 + i * 86;
    ctx.fillStyle = '#0f1d36';
    rrect(cx, 10, 80, 46, 8);
    ctx.fill();
    ctx.strokeStyle = '#1e3a5f';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.fillStyle = '#94a3b8';
    ctx.font = 'bold 9px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(cards[i].label, cx + 40, 25);
    ctx.fillStyle = cards[i].col;
    ctx.font = 'bold 13px system-ui, sans-serif';
    ctx.fillText(cards[i].val, cx + 40, 45);
  }

  // Reactor Core Chamber
  ctx.save();
  ctx.translate(CORE_X, CORE_Y);

  const hot = visTemp > 85;
  const sweet = visTemp >= 50 && visTemp <= 90;
  const coreCol = hot ? '#ef4444' : (sweet ? '#f59e0b' : '#38bdf8');

  // Ambient glow
  const glow = ctx.createRadialGradient(0, 0, 10, 0, 0, 105);
  glow.addColorStop(0, hot ? 'rgba(239,68,68,0.42)' : (sweet ? 'rgba(245,158,11,0.35)' : 'rgba(56,189,248,0.35)'));
  glow.addColorStop(1, 'rgba(5,11,24,0)');
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(0, 0, 105, 0, Math.PI * 2);
  ctx.fill();

  // Temperature outer arc gauge
  ctx.strokeStyle = '#1e293b';
  ctx.lineWidth = 8;
  ctx.beginPath();
  ctx.arc(0, 0, 86, Math.PI * 0.75, Math.PI * 2.25);
  ctx.stroke();

  ctx.strokeStyle = coreCol;
  ctx.lineWidth = 8;
  ctx.beginPath();
  ctx.arc(0, 0, 86, Math.PI * 0.75, Math.PI * (0.75 + 1.5 * Math.min(1, visTemp / 100)));
  ctx.stroke();

  // Rotating magnetic coils
  ctx.scale(coreScale, coreScale);
  ctx.strokeStyle = state.overclockTurns > 0 ? '#fb923c' : '#0284c7';
  ctx.lineWidth = 4;
  ctx.setLineDash([14, 10]);
  ctx.beginPath();
  ctx.arc(0, 0, 64, phase, phase + Math.PI * 2);
  ctx.stroke();

  ctx.strokeStyle = '#a855f7';
  ctx.lineWidth = 3;
  ctx.setLineDash([8, 12]);
  ctx.beginPath();
  ctx.arc(0, 0, 50, -phase * 1.4, -phase * 1.4 + Math.PI * 2);
  ctx.stroke();
  ctx.setLineDash([]);

  // Orbiting plasma particles
  const totalGens = Math.min(12, 2 + state.generators.solenoid + state.generators.injector + state.generators.tokamak * 2 + state.generators.antimatterCore * 3);
  for (let i = 0; i < totalGens; i++) {
    const ang = phase * 1.8 + (i / totalGens) * Math.PI * 2;
    const ox = Math.cos(ang) * 57;
    const oy = Math.sin(ang) * 57;
    ctx.fillStyle = i % 2 === 0 ? '#7dd3fc' : '#f0abfc';
    ctx.beginPath();
    ctx.arc(ox, oy, 3, 0, Math.PI * 2);
    ctx.fill();
  }

  // Inner Fusion Sphere
  const sphere = ctx.createRadialGradient(0, 0, 2, 0, 0, 36);
  sphere.addColorStop(0, '#ffffff');
  sphere.addColorStop(0.55, coreCol);
  sphere.addColorStop(1, '#0c4a6e');
  ctx.fillStyle = sphere;
  ctx.beginPath();
  ctx.arc(0, 0, 35 + Math.sin(phase * 4) * 2.5, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#040812';
  ctx.font = 'bold 11px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('TAP / HOLD', 0, 4);

  ctx.restore();

  // Shockwave rings
  for (const r of rings) {
    ctx.globalAlpha = Math.max(0, r.alpha);
    ctx.strokeStyle = r.color;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(CORE_X, CORE_Y, r.r, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // Core Temp & Status Readout
  ctx.fillStyle = coreCol;
  ctx.font = 'bold 12px system-ui, sans-serif';
  ctx.textAlign = 'center';
  const tempTag = hot ? 'CRITICAL MELTDOWN RISK!' : (sweet ? '1.5x THERMAL BONUS' : 'NOMINAL');
  ctx.fillText('TEMP ' + Math.round(state.coreTemp) + '% • ' + tempTag, W / 2, 282);

  const valid = legalActions(state);
  if (valid.includes('action:achieve_stellar_ignition')) {
    ctx.fillStyle = '#d97706';
    rrect(20, 264, 320, 32, 8);
    ctx.fill();
    ctx.strokeStyle = '#fef08a';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 13px system-ui, sans-serif';
    ctx.fillText('🌟 IGNITE DYSON SPHERE (VICTORY!)', W / 2, 285);
  }

  // 3 Reactor Control Buttons (y = 300..344)
  const ctrls = [
    { label: '❄️ CRYO COOL', sub: '-35% Heat', ok: valid.includes('action:cycle_cryo_coolant'), col: '#06b6d4' },
    { label: state.overclockTurns > 0 ? '🔥 ACTIVE (' + state.overclockTurns + ')' : '🔥 OVERCLOCK', sub: '2x Output', ok: valid.includes('action:engage_plasma_overclock'), col: '#f97316' },
    { label: '🌌 PRESTIGE', sub: '80🟣 → +1 DM', ok: valid.includes('action:quantum_overdrive_prestige'), col: '#c084fc' }
  ];
  for (let i = 0; i < 3; i++) {
    const bx = 16 + i * 112;
    ctx.fillStyle = ctrls[i].ok ? '#13233f' : '#0b1324';
    rrect(bx, 300, 104, 42, 8);
    ctx.fill();
    ctx.strokeStyle = ctrls[i].ok ? ctrls[i].col : '#1e293b';
    ctx.lineWidth = ctrls[i].ok ? 1.8 : 1;
    ctx.stroke();
    ctx.fillStyle = ctrls[i].ok ? '#ffffff' : '#64748b';
    ctx.font = 'bold 10px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(ctrls[i].label, bx + 52, 318);
    ctx.fillStyle = ctrls[i].ok ? ctrls[i].col : '#475569';
    ctx.font = '9px system-ui, sans-serif';
    ctx.fillText(ctrls[i].sub, bx + 52, 333);
  }

  // 5 Generator Cards (y = 352..622)
  for (let i = 0; i < GEN_META.length; i++) {
    const g = GEN_META[i];
    const count = state.generators[g.id];
    const cost = getGeneratorCost(g.id, count);
    const canBuy = valid.includes('action:purchase_generator:' + g.id);
    const cy = 352 + i * 54;

    ctx.fillStyle = canBuy ? '#112240' : '#0b1324';
    rrect(16, cy, 328, 48, 8);
    ctx.fill();
    ctx.strokeStyle = canBuy ? g.color : '#1e293b';
    ctx.lineWidth = canBuy ? 1.8 : 1;
    ctx.stroke();

    // Count badge
    ctx.fillStyle = canBuy ? g.color : '#1e293b';
    rrect(24, cy + 8, 36, 32, 6);
    ctx.fill();
    ctx.fillStyle = canBuy ? '#040812' : '#94a3b8';
    ctx.font = 'bold 14px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(count, 42, cy + 29);

    ctx.fillStyle = canBuy ? '#f8fafc' : '#94a3b8';
    ctx.font = 'bold 12px system-ui, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(g.name, 70, cy + 21);

    ctx.fillStyle = '#64748b';
    ctx.font = '10px system-ui, sans-serif';
    ctx.fillText(g.yieldTxt, 70, cy + 37);

    const costStr = fmt(cost.energy) + '⚡' + (cost.neutrons > 0 ? ' ' + fmt(cost.neutrons) + '🟣' : '');
    ctx.fillStyle = canBuy ? '#fde047' : '#475569';
    ctx.font = 'bold 11px system-ui, sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText(costStr, 334, cy + 28);
  }

  // Floating popups
  for (const f of floaters) {
    ctx.globalAlpha = Math.max(0, 1 - f.t / 0.75);
    ctx.fillStyle = f.color;
    ctx.font = 'bold 13px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(f.text, f.x, f.y - f.t * 36);
  }
  ctx.globalAlpha = 1;

  // Footer goal progress
  ctx.fillStyle = '#64748b';
  ctx.font = '10px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('Goal: 1 Dyson + 2 DM + 20k⚡ • Cycle ' + state.turns + '/' + state.maxTurns + ' • Best ' + fmt(best), W / 2, 634);

  if (isOver(state)) {
    ctx.fillStyle = 'rgba(5, 11, 24, 0.88)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = state.victory ? '#34d399' : '#f87171';
    ctx.font = 'bold 25px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(state.victory ? 'STELLAR IGNITION!' : 'REACTOR OFFLINE', W / 2, H / 2 - 40);
    ctx.fillStyle = '#cbd5e1';
    ctx.font = '13px system-ui, sans-serif';
    ctx.fillText(state.coreTemp >= 100 ? 'Core Plasma Containment Meltdown!' : 'Cycle window completed', W / 2, H / 2 - 12);
    ctx.fillStyle = '#fbbf24';
    ctx.font = 'bold 22px system-ui, sans-serif';
    ctx.fillText('Score: ' + fmt(score(state)), W / 2, H / 2 + 24);
    ctx.fillStyle = '#38bdf8';
    ctx.font = '16px system-ui, sans-serif';
    ctx.fillText('Tap anywhere to restart', W / 2, H / 2 + 62);
  }
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

const inApk = window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform();
if (!inApk && 'serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
