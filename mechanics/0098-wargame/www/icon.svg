<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14181f" />
      <stop offset="100%" stop-color="#222b38" />
    </linearGradient>
    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)" stroke="#64748b" stroke-width="8"/>
  <!-- Operational Hexagon -->
  <polygon points="256,60 430,160 430,360 256,460 82,360 82,160" fill="#1e293b" stroke="#38bdf8" stroke-width="8" stroke-linejoin="round"/>
  <!-- NATO Division Counter Box -->
  <rect x="156" y="176" width="200" height="160" rx="12" fill="url(#hexGrad)" stroke="#ffffff" stroke-width="6"/>
  <!-- NATO Armor Ellipse Symbol -->
  <ellipse cx="256" cy="256" rx="60" ry="32" fill="none" stroke="#ffffff" stroke-width="10"/>
  <!-- Entrenchment Stars -->
  <circle cx="216" cy="140" r="10" fill="#facc15"/>
  <circle cx="256" cy="130" r="12" fill="#facc15"/>
  <circle cx="296" cy="140" r="10" fill="#facc15"/>
</svg>
