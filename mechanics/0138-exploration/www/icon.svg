<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="abyss" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="40%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="yellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="120" fill="url(#abyss)"/>
  <!-- Searchlight Cones -->
  <polygon points="200,240 40,460 220,460" fill="url(#beam)"/>
  <polygon points="312,240 292,460 472,460" fill="url(#beam)"/>
  <!-- Submersible Yellow Hull -->
  <ellipse cx="256" cy="220" rx="140" ry="80" fill="url(#yellow)" stroke="#ca8a04" stroke-width="8"/>
  <!-- Domed Glass Observation Cockpit -->
  <circle cx="256" cy="220" r="50" fill="#0284c7" stroke="#38bdf8" stroke-width="6"/>
  <circle cx="240" cy="205" r="14" fill="#ffffff" opacity="0.6"/>
  <!-- Top Conning Tower -->
  <rect x="230" y="110" width="52" height="40" rx="8" fill="#ca8a04"/>
  <!-- Twin Propellers -->
  <rect x="90" y="200" width="28" height="40" rx="4" fill="#475569"/>
  <rect x="394" y="200" width="28" height="40" rx="4" fill="#475569"/>
</svg>
