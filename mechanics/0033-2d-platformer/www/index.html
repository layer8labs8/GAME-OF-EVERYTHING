<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b1020">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>Pixel Jumper</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b1020; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; margin: 0 auto; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="logic.js"></script>
<script>
const { ARENA_W, ARENA_H, PLATFORMS, PORTAL, createState, legalActions, step, isOver, score } = GameLogic;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const W = 360;
const H = 640;

let scale = 1;
function resize() {
  scale = Math.min(innerWidth / W, innerHeight / H);
  const dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.style.width = W * scale + 'px';
  canvas.style.height = H * scale + 'px';
  canvas.width = Math.round(W * scale * dpr);
  canvas.height = Math.round(H * scale * dpr);
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
}
addEventListener('resize', resize);
resize();

let best = 0;
try { best = +localStorage.getItem('goe-0033-best') || 0; } catch (e) {}

let state = createState(Date.now());
let coinSpin = 0;
let portalAngle = 0;
let overAt = 0;

function restart() {
  state = createState(Date.now());
  coinSpin = 0;
  portalAngle = 0;
  overAt = 0;
}

function rrect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

const keys = {};
addEventListener('keydown', (e) => {
  if (isOver(state)) {
    if ((e.key === ' ' || e.key === 'Enter') && performance.now() - overAt > 400) restart();
    return;
  }
  keys[e.key] = true;
  if (e.key === 'r') restart();
});
addEventListener('keyup', (e) => { keys[e.key] = false; });

function toLogical(e) {
  const rect = canvas.getBoundingClientRect();
  return { x: (e.clientX - rect.left) / scale, y: (e.clientY - rect.top) / scale };
}

let touchLeft = false;
let touchRight = false;
let touchJump = false;

canvas.addEventListener('pointerdown', (e) => {
  const p = toLogical(e);
  if (isOver(state)) {
    if (performance.now() - overAt > 400) restart();
    return;
  }
  // Check touch controls on screen
  if (p.x >= 20 && p.x <= 80 && p.y >= 540 && p.y <= 610) touchLeft = true;
  else if (p.x >= 90 && p.x <= 150 && p.y >= 540 && p.y <= 610) touchRight = true;
  else if (p.x >= 270 && p.x <= 340 && p.y >= 540 && p.y <= 610) touchJump = true;
  else if (p.x > 180) touchJump = true;
  else if (p.x < 180) {
    if (p.x < state.player.x) touchLeft = true;
    else touchRight = true;
  }
});

function clearTouch() {
  touchLeft = false;
  touchRight = false;
  touchJump = false;
}
window.addEventListener('pointerup', clearTouch);
window.addEventListener('pointercancel', clearTouch);

let tickAcc = 0;
function updateSim(dt) {
  tickAcc += dt;
  const STEP_TIME = 1 / 40;

  while (tickAcc >= STEP_TIME && !isOver(state)) {
    tickAcc -= STEP_TIME;

    let act = 'wait';
    if (keys['ArrowLeft'] || keys['a'] || touchLeft) {
      act = 'left';
    } else if (keys['ArrowRight'] || keys['d'] || touchRight) {
      act = 'right';
    }

    if (keys['ArrowUp'] || keys['w'] || keys[' '] || touchJump) {
      if (state.player.grounded) {
        act = 'jump';
        touchJump = false;
      }
    }

    const res = step(state, act);

    if (res.done) {
      overAt = performance.now();
      const sc = score(state);
      if (sc > best) {
        best = sc;
        try { localStorage.setItem('goe-0033-best', best); } catch (e) {}
      }
    }
  }

  coinSpin += dt * 4;
  portalAngle += dt * 3;
}

function drawPlayer(p) {
  ctx.save();
  ctx.translate(p.x, p.y - 13);

  // Body
  ctx.fillStyle = '#38bdf8';
  ctx.strokeStyle = '#0284c7';
  ctx.lineWidth = 2;
  rrect(-10, -13, 20, 26, 6);
  ctx.fill();
  ctx.stroke();

  // Face visor
  ctx.fillStyle = '#ffffff';
  const lookDir = p.vx >= 0 ? 3 : -3;
  ctx.beginPath();
  ctx.arc(lookDir, -4, 4, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function drawCoin(c) {
  if (c.collected) return;
  const scaleX = Math.abs(Math.cos(coinSpin));
  ctx.save();
  ctx.translate(c.x, c.y);
  ctx.scale(scaleX, 1);

  ctx.fillStyle = '#fbbf24';
  ctx.strokeStyle = '#d97706';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(0, 0, 8, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  ctx.restore();
}

function drawPortal() {
  ctx.save();
  ctx.translate(PORTAL.x + PORTAL.w / 2, PORTAL.y + PORTAL.h / 2);

  const ready = state.coinsCollected >= 4;
  ctx.strokeStyle = ready ? '#a855f7' : '#475569';
  ctx.lineWidth = 3;

  ctx.rotate(portalAngle);
  ctx.beginPath();
  ctx.arc(0, 0, 18, 0, Math.PI * 1.5);
  ctx.stroke();

  ctx.rotate(-portalAngle * 2);
  ctx.beginPath();
  ctx.arc(0, 0, 11, 0, Math.PI * 1.5);
  ctx.stroke();

  ctx.restore();
}

function draw() {
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#0f172a');
  bg.addColorStop(1, '#020617');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // Platforms
  for (const plat of PLATFORMS) {
    ctx.fillStyle = '#1e293b';
    rrect(plat.x, plat.y, plat.w, plat.h, 4);
    ctx.fill();

    // Grass top highlight
    ctx.fillStyle = '#22c55e';
    rrect(plat.x, plat.y, plat.w, 4, 2);
    ctx.fill();
  }

  // Summit Portal
  drawPortal();

  // Coins
  for (const c of state.coins) {
    drawCoin(c);
  }

  // Player
  drawPlayer(state.player);

  // HUD
  ctx.fillStyle = '#8a93a8';
  ctx.font = '12px system-ui, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('SCORE', 24, 34);
  ctx.textAlign = 'center';
  ctx.fillText('COINS', W / 2, 34);
  ctx.textAlign = 'right';
  ctx.fillText('BEST', W - 24, 34);

  ctx.fillStyle = '#e8ecf5';
  ctx.font = 'bold 26px system-ui, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(score(state), 24, 64);
  ctx.fillStyle = '#fbbf24';
  ctx.textAlign = 'center';
  ctx.fillText(`${state.coinsCollected} / 7`, W / 2, 64);
  ctx.fillStyle = '#38bdf8';
  ctx.font = 'bold 20px system-ui, sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText(best, W - 24, 62);

  // Lives (hearts)
  for (let i = 0; i < 3; i++) {
    ctx.fillStyle = i < state.lives ? '#f43f5e' : '#334155';
    ctx.beginPath();
    ctx.arc(28 + i * 20, 88, 6, 0, Math.PI * 2);
    ctx.fill();
  }

  // Touch control buttons
  ctx.fillStyle = touchLeft ? '#38bdf8' : 'rgba(30,41,59,0.7)';
  rrect(20, 550, 60, 50, 10);
  ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 20px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('◀', 50, 582);

  ctx.fillStyle = touchRight ? '#38bdf8' : 'rgba(30,41,59,0.7)';
  rrect(90, 550, 60, 50, 10);
  ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.fillText('▶', 120, 582);

  ctx.fillStyle = touchJump ? '#22c55e' : 'rgba(30,41,59,0.7)';
  rrect(270, 550, 70, 50, 10);
  ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 15px system-ui, sans-serif';
  ctx.fillText('JUMP', 305, 581);

  if (isOver(state)) {
    ctx.fillStyle = 'rgba(11,16,32,0.85)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = state.won ? '#22c55e' : '#f43f5e';
    ctx.font = 'bold 34px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(state.won ? 'Portal Reached!' : 'Out of Lives', W / 2, H / 2 - 32);
    ctx.fillStyle = '#e8ecf5';
    ctx.font = '22px system-ui, sans-serif';
    ctx.fillText('Final Score: ' + score(state), W / 2, H / 2 + 8);
    ctx.fillStyle = '#38bdf8';
    ctx.font = '18px system-ui, sans-serif';
    ctx.fillText('Tap anywhere to try again', W / 2, H / 2 + 50);
  }
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  updateSim(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

const inApk = window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform();
if (!inApk && 'serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
