<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b1020">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>Crate Keeper</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b1020; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; margin: 0 auto; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="logic.js"></script>
<script>
const { LEVELS, move, isSolved } = GameLogic;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const W = 360;
const H = 640;

let scale = 1;
function resize() {
  scale = Math.min(innerWidth / W, innerHeight / H);
  const dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.style.width = W * scale + 'px';
  canvas.style.height = H * scale + 'px';
  canvas.width = Math.round(W * scale * dpr);
  canvas.height = Math.round(H * scale * dpr);
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
}
addEventListener('resize', resize);
resize();

let bestMoves = {};
try { bestMoves = JSON.parse(localStorage.getItem('goe-0043-best') || '{}') || {}; } catch (e) { bestMoves = {}; }

let levelIdx = 0;
for (let i = 0; i < LEVELS.length; i++) {
  if (!bestMoves[LEVELS[i].id]) { levelIdx = i; break; }
}

let grid = [];
let history = [];
let solved = false;
let solvedAt = 0;
let swipeStart = null;

function loadLevel(idx) {
  levelIdx = (idx + LEVELS.length) % LEVELS.length;
  grid = LEVELS[levelIdx].grid.slice();
  history = [];
  solved = isSolved(grid);
  solvedAt = 0;
}
loadLevel(levelIdx);

function rrect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function tryDir(dir) {
  if (solved) return;
  const next = move(grid, dir);
  if (next.join('|') === grid.join('|')) return;
  history.push(grid);
  grid = next;
  if (isSolved(grid)) {
    solved = true;
    solvedAt = performance.now();
    const id = LEVELS[levelIdx].id;
    const moves = history.length;
    if (!bestMoves[id] || moves < bestMoves[id]) {
      bestMoves[id] = moves;
      try { localStorage.setItem('goe-0043-best', JSON.stringify(bestMoves)); } catch (e) {}
    }
  }
}

function undo() {
  if (history.length === 0) return;
  grid = history.pop();
  solved = false;
}

function findPlayer() {
  for (let r = 0; r < grid.length; r++) {
    for (let c = 0; c < grid[r].length; c++) {
      if (grid[r][c] === '@' || grid[r][c] === '+') return [r, c];
    }
  }
  return [0, 0];
}

function boardMetrics() {
  const rows = grid.length;
  const cols = grid[0].length;
  const cell = Math.min(Math.floor(332 / cols), Math.floor(320 / rows), 46);
  const bx = Math.floor((W - cols * cell) / 2);
  const by = 118 + Math.floor((320 - rows * cell) / 2);
  return { rows, cols, cell, bx, by };
}

const BUTTONS = [
  { id: 'prev', x: 14, y: 18, w: 38, h: 36, label: '<' },
  { id: 'next', x: 308, y: 18, w: 38, h: 36, label: '>' },
  { id: 'undo', x: 20, y: 500, w: 74, h: 48, label: 'Undo' },
  { id: 'reset', x: 266, y: 500, w: 74, h: 48, label: 'Reset' },
  { id: 'U', x: 154, y: 468, w: 52, h: 48, label: '▲' },
  { id: 'L', x: 98, y: 522, w: 52, h: 48, label: '◀' },
  { id: 'D', x: 154, y: 522, w: 52, h: 48, label: '▼' },
  { id: 'R', x: 210, y: 522, w: 52, h: 48, label: '▶' },
];

function toLogical(e) {
  const rect = canvas.getBoundingClientRect();
  return { x: (e.clientX - rect.left) / scale, y: (e.clientY - rect.top) / scale };
}

canvas.addEventListener('pointerdown', (e) => {
  const p = toLogical(e);
  if (solved) {
    if (performance.now() - solvedAt > 350) loadLevel(levelIdx + 1);
    return;
  }
  for (const b of BUTTONS) {
    if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) {
      if (b.id === 'prev') loadLevel(levelIdx - 1);
      else if (b.id === 'next') loadLevel(levelIdx + 1);
      else if (b.id === 'undo') undo();
      else if (b.id === 'reset') loadLevel(levelIdx);
      else tryDir(b.id);
      return;
    }
  }
  swipeStart = p;
});

canvas.addEventListener('pointerup', (e) => {
  if (!swipeStart || solved) return;
  const p = toLogical(e);
  const dx = p.x - swipeStart.x;
  const dy = p.y - swipeStart.y;
  const start = swipeStart;
  swipeStart = null;
  if (Math.hypot(dx, dy) >= 24) {
    if (Math.abs(dx) > Math.abs(dy)) tryDir(dx > 0 ? 'R' : 'L');
    else tryDir(dy > 0 ? 'D' : 'U');
    return;
  }
  const { cell, bx, by } = boardMetrics();
  const tc = Math.floor((start.x - bx) / cell);
  const tr = Math.floor((start.y - by) / cell);
  const [pr, pc] = findPlayer();
  if (Math.abs(tr - pr) + Math.abs(tc - pc) === 1) {
    if (tr < pr) tryDir('U');
    else if (tr > pr) tryDir('D');
    else if (tc < pc) tryDir('L');
    else tryDir('R');
  }
});

canvas.addEventListener('pointercancel', () => { swipeStart = null; });

addEventListener('keydown', (e) => {
  if (solved) {
    if ((e.key === ' ' || e.key === 'Enter' || e.key === 'n') && performance.now() - solvedAt > 350) loadLevel(levelIdx + 1);
    return;
  }
  if (e.key === 'ArrowUp' || e.key === 'w') tryDir('U');
  else if (e.key === 'ArrowDown' || e.key === 's') tryDir('D');
  else if (e.key === 'ArrowLeft' || e.key === 'a') tryDir('L');
  else if (e.key === 'ArrowRight' || e.key === 'd') tryDir('R');
  else if (e.key === 'z' || e.key === 'u' || e.key === 'Backspace') undo();
  else if (e.key === 'r') loadLevel(levelIdx);
  else if (e.key === '[') loadLevel(levelIdx - 1);
  else if (e.key === ']') loadLevel(levelIdx + 1);
});

function draw() {
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#16203a');
  bg.addColorStop(1, '#0b1020');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  const lvl = LEVELS[levelIdx];
  const best = bestMoves[lvl.id];

  // Header
  ctx.fillStyle = '#e8ecf5';
  ctx.font = 'bold 18px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(`Level ${levelIdx + 1}/${LEVELS.length} · ${lvl.name}`, W / 2, 34);

  ctx.fillStyle = '#8a93a8';
  ctx.font = '13px system-ui, sans-serif';
  const solvedCount = Object.keys(bestMoves).length;
  ctx.fillText(
    `Moves: ${history.length}   Par: ${lvl.par}` + (best ? `   Best: ${best}` : '') + `   Solved: ${solvedCount}/${LEVELS.length}`,
    W / 2,
    58
  );

  // Board
  const { rows, cols, cell, bx, by } = boardMetrics();
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const ch = grid[r][c];
      const x = bx + c * cell;
      const y = by + r * cell;
      if (ch === '#') {
        ctx.fillStyle = '#2d3b5e';
        rrect(x + 1, y + 1, cell - 2, cell - 2, 6);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.12)';
        rrect(x + 3, y + 3, cell - 6, Math.max(4, cell * 0.22), 4);
        ctx.fill();
        continue;
      }
      // Check if outside room (leading spaces)
      ctx.fillStyle = '#182340';
      rrect(x + 1, y + 1, cell - 2, cell - 2, 4);
      ctx.fill();

      if (ch === '.' || ch === '*' || ch === '+') {
        ctx.strokeStyle = '#ffd43b';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(x + cell / 2, y + cell / 2, cell * 0.22, 0, Math.PI * 2);
        ctx.stroke();
      }

      if (ch === '$' || ch === '*') {
        const onTarget = ch === '*';
        ctx.fillStyle = onTarget ? '#51cf66' : '#f08c00';
        rrect(x + 4, y + 4, cell - 8, cell - 8, 7);
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.35)';
        ctx.lineWidth = 2;
        rrect(x + 8, y + 8, cell - 16, cell - 16, 4);
        ctx.stroke();
      }

      if (ch === '@' || ch === '+') {
        ctx.fillStyle = '#4fd1c5';
        ctx.beginPath();
        ctx.arc(x + cell / 2, y + cell / 2, cell * 0.34, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#0b1020';
        ctx.beginPath();
        ctx.arc(x + cell * 0.4, y + cell * 0.44, 2.2, 0, Math.PI * 2);
        ctx.arc(x + cell * 0.6, y + cell * 0.44, 2.2, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  // Controls
  for (const b of BUTTONS) {
    ctx.fillStyle = '#1f2b4d';
    rrect(b.x, b.y, b.w, b.h, 10);
    ctx.fill();
    ctx.strokeStyle = '#314373';
    ctx.lineWidth = 1.5;
    rrect(b.x, b.y, b.w, b.h, 10);
    ctx.stroke();
    ctx.fillStyle = '#e8ecf5';
    ctx.font = 'bold 15px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(b.label, b.x + b.w / 2, b.y + b.h / 2 + 1);
  }
  ctx.textBaseline = 'alphabetic';

  ctx.fillStyle = '#6c7793';
  ctx.font = '12px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('Swipe, tap adjacent tile, or use controls', W / 2, 606);

  if (solved) {
    ctx.fillStyle = 'rgba(11,16,32,0.84)';
    ctx.fillRect(0, 0, W, H);
    const moves = history.length;
    const stars = moves <= lvl.par ? '★★★' : moves <= Math.ceil(lvl.par * 1.5) ? '★★☆' : '★☆☆';
    ctx.fillStyle = '#ffd43b';
    ctx.font = '34px system-ui, sans-serif';
    ctx.fillText(stars, W / 2, H / 2 - 52);
    ctx.fillStyle = '#e8ecf5';
    ctx.font = 'bold 30px system-ui, sans-serif';
    ctx.fillText('Level Complete!', W / 2, H / 2 - 8);
    ctx.font = '20px system-ui, sans-serif';
    ctx.fillText(`Moves: ${moves}  (Par ${lvl.par})`, W / 2, H / 2 + 28);
    ctx.fillStyle = '#4fd1c5';
    ctx.font = '18px system-ui, sans-serif';
    ctx.fillText('Tap for next level', W / 2, H / 2 + 70);
  }
}

function frame() {
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

const inApk = window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform();
if (!inApk && 'serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
