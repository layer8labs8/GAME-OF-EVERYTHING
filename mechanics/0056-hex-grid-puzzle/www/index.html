<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hexa Conduits - Hex Grid Puzzle</title>
  <link rel="manifest" href="./manifest.json">
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }
    body {
      background: #04060c;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      touch-action: manipulation;
    }
    #game-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 520px;
      padding: 12px;
      gap: 12px;
    }
    .hud {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0c1222;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 700;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
    }
    .stat-badge {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .cyan-badge { color: #06b6d4; }
    .gold-badge { color: #fbbf24; }
    .emerald-badge { color: #10b981; }
    canvas {
      width: 100%;
      max-width: 480px;
      aspect-ratio: 1;
      background: #060913;
      border: 2px solid #1e293b;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(6, 182, 212, 0.15);
      cursor: pointer;
      display: block;
    }
    .message-bar {
      width: 100%;
      text-align: center;
      font-size: 13px;
      color: #94a3b8;
      min-height: 20px;
      font-weight: 600;
    }
    .footer-bar {
      display: flex;
      justify-content: space-between;
      width: 100%;
      align-items: center;
      font-size: 12px;
      color: #64748b;
    }
    .btn {
      background: #0f172a;
      border: 1px solid #334155;
      color: #94a3b8;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 12px;
      transition: all 0.15s;
    }
    .btn:hover {
      background: #1e293b;
      color: #f8fafc;
      border-color: #06b6d4;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <div class="hud">
      <div class="stat-badge cyan-badge" id="stage-display">STAGE 1/3</div>
      <div class="stat-badge emerald-badge" id="relays-display">RELAYS 0/3</div>
      <div class="stat-badge gold-badge" id="rotations-display">TURNS 0/50</div>
      <div class="stat-badge" id="score-display">PTS 0</div>
    </div>

    <canvas id="canvas" width="480" height="480"></canvas>

    <div class="message-bar" id="message-display">Click conduits to rotate and channel plasma to all relays.</div>

    <div class="footer-bar">
      <span>Click / Tap hex cell to rotate 60°</span>
      <button class="btn" id="btn-restart">Restart (R)</button>
    </div>
  </div>

  <script src="logic.js"></script>
  <script>
    (function() {
      const canvas = document.getElementById('canvas');
      const ctx = (canvas && typeof canvas.getContext === 'function') ? canvas.getContext('2d') : null;

      let state = createState(Math.floor(Math.random() * 100000) + 1);

      // Web Audio Synth
      let audioCtx = null;
      function getAudio() {
        if (!audioCtx && typeof AudioContext !== 'undefined') {
          audioCtx = new AudioContext();
        }
        return audioCtx;
      }
      function playTone(freq, type, duration, gainVal = 0.08) {
        try {
          const actx = getAudio();
          if (!actx) return;
          const osc = actx.createOscillator();
          const gain = actx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, actx.currentTime);
          gain.gain.setValueAtTime(gainVal, actx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + duration);
          osc.connect(gain);
          gain.connect(actx.destination);
          osc.start();
          osc.stop(actx.currentTime + duration);
        } catch (e) {}
      }

      function playSound(type) {
        if (type === 'rotate') playTone(280, 'sine', 0.08, 0.08);
        else if (type === 'relay') {
          playTone(523, 'triangle', 0.15, 0.1);
          setTimeout(() => playTone(659, 'triangle', 0.15, 0.1), 80);
          setTimeout(() => playTone(784, 'triangle', 0.25, 0.12), 160);
        } else if (type === 'stage') {
          playTone(440, 'sine', 0.15, 0.1);
          setTimeout(() => playTone(554, 'sine', 0.15, 0.1), 100);
          setTimeout(() => playTone(659, 'sine', 0.15, 0.1), 200);
          setTimeout(() => playTone(880, 'sine', 0.3, 0.15), 300);
        } else if (type === 'fail') {
          playTone(200, 'sawtooth', 0.3, 0.15);
        }
      }

      function updateHUD() {
        const stageEl = document.getElementById('stage-display');
        const relaysEl = document.getElementById('relays-display');
        const rotEl = document.getElementById('rotations-display');
        const scoreEl = document.getElementById('score-display');
        const msgEl = document.getElementById('message-display');

        if (stageEl) stageEl.textContent = 'STAGE ' + state.stage + '/' + state.maxStages;
        if (relaysEl) relaysEl.textContent = 'RELAYS ' + state.poweredRelays + '/' + state.targetRelays;
        if (rotEl) rotEl.textContent = 'TURNS ' + state.stageRotations + '/' + state.maxRotationsPerStage;
        if (scoreEl) scoreEl.textContent = 'PTS ' + score(state);
        if (msgEl) msgEl.textContent = state.message;
      }

      // Hex metric coordinates
      const HEX_RADIUS = 42;
      const CENTER_X = 240;
      const CENTER_Y = 240;

      function getHexPixel(q, r) {
        // Pointy-topped hexagon projection
        const x = CENTER_X + HEX_RADIUS * Math.sqrt(3) * (q + r / 2);
        const y = CENTER_Y + HEX_RADIUS * 1.5 * r;
        return { x, y };
      }

      function getEffectiveWires(tile) {
        return tile.baseWires.map(w => (w + tile.rotation) % 6);
      }

      function drawHexPolygon(cx, cy, radius, fillStyle, strokeStyle, lineWidth = 2) {
        ctx.beginPath();
        for (let i = 0; i < 6; i++) {
          const angle = (Math.PI / 6) + (i * Math.PI / 3);
          const px = cx + radius * Math.cos(angle);
          const py = cy + radius * Math.sin(angle);
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.closePath();
        if (fillStyle) {
          ctx.fillStyle = fillStyle;
          ctx.fill();
        }
        if (strokeStyle) {
          ctx.strokeStyle = strokeStyle;
          ctx.lineWidth = lineWidth;
          ctx.stroke();
        }
      }

      function render() {
        if (!ctx) return;
        const W = canvas.width;
        const H = canvas.height;

        ctx.fillStyle = '#060913';
        ctx.fillRect(0, 0, W, H);

        // Draw ambient background hex mesh
        ctx.strokeStyle = '#0f172a';
        ctx.lineWidth = 1;
        for (const coord of HEX_COORDS) {
          const { x, y } = getHexPixel(coord.q, coord.r);
          drawHexPolygon(x, y, HEX_RADIUS - 1, null, '#0f172a', 1);
        }

        // Draw Hex Cells
        for (const tile of state.tiles) {
          const { x: cx, y: cy } = getHexPixel(tile.q, tile.r);
          const isPowered = tile.isPowered;

          // Hex base
          let cellFill = '#0a0f1d';
          let borderStroke = '#1e293b';

          if (tile.type === 'core') {
            cellFill = '#082f49';
            borderStroke = '#38bdf8';
          } else if (tile.type === 'relay') {
            cellFill = isPowered ? '#064e3b' : '#3f1118';
            borderStroke = isPowered ? '#10b981' : '#f43f5e';
          } else if (isPowered) {
            cellFill = '#0c1e33';
            borderStroke = '#0ea5e9';
          }

          drawHexPolygon(cx, cy, HEX_RADIUS - 3, cellFill, borderStroke, isPowered ? 2.5 : 1.5);

          // Draw Conduits / Wires
          const wires = getEffectiveWires(tile);
          const wireColor = isPowered ? '#38bdf8' : '#334155';
          const wireGlow = isPowered ? '#0284c7' : null;

          ctx.lineWidth = isPowered ? 6 : 4;
          ctx.lineCap = 'round';

          for (const dir of wires) {
            // Direction angles (0: E, 1: SE, 2: SW, 3: W, 4: NW, 5: NE)
            const angle = (dir * Math.PI / 3);
            const edgeDist = HEX_RADIUS * 0.866; // cos(30 deg)
            const ex = cx + edgeDist * Math.cos(angle);
            const ey = cy + edgeDist * Math.sin(angle);

            ctx.strokeStyle = wireColor;
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(ex, ey);
            ctx.stroke();
          }

          // Central junction hub
          if (tile.type === 'core') {
            // Radiant core orb
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(cx, cy, 14, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 4;
            ctx.stroke();
          } else if (tile.type === 'relay') {
            // Terminal beacon
            ctx.fillStyle = isPowered ? '#34d399' : '#f43f5e';
            ctx.beginPath();
            ctx.arc(cx, cy, 12, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = isPowered ? '#6ee7b7' : '#fda4af';
            ctx.lineWidth = 3;
            ctx.stroke();
          } else {
            // Normal conduit hub
            ctx.fillStyle = isPowered ? '#0284c7' : '#1e293b';
            ctx.beginPath();
            ctx.arc(cx, cy, 7, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        // Victory / Defeat Overlay
        if (state.done) {
          ctx.fillStyle = 'rgba(4, 6, 12, 0.85)';
          ctx.fillRect(0, 0, W, H);
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          if (state.won) {
            ctx.fillStyle = '#34d399';
            ctx.font = 'bold 30px sans-serif';
            ctx.fillText('GRID SYNCHRONIZED!', W / 2, H / 2 - 25);
            ctx.fillStyle = '#f8fafc';
            ctx.font = '16px sans-serif';
            ctx.fillText('All Energy Relays Active', W / 2, H / 2 + 10);
            ctx.fillText('Final Score: ' + score(state), W / 2, H / 2 + 35);
          } else {
            ctx.fillStyle = '#f43f5e';
            ctx.font = 'bold 30px sans-serif';
            ctx.fillText('CIRCUIT OVERLOAD', W / 2, H / 2 - 25);
            ctx.fillStyle = '#f8fafc';
            ctx.font = '16px sans-serif';
            ctx.fillText('Exceeded turn budget', W / 2, H / 2 + 10);
            ctx.fillText('Press Restart to try again', W / 2, H / 2 + 35);
          }
        }
      }

      function handleTileClick(mx, my) {
        if (state.done) return;
        // Find clicked hex cell by euclidean distance
        let closestTile = null;
        let minDist = 99999;

        for (const tile of state.tiles) {
          const { x, y } = getHexPixel(tile.q, tile.r);
          const dist = Math.hypot(mx - x, my - y);
          if (dist < minDist && dist <= HEX_RADIUS) {
            minDist = dist;
            closestTile = tile;
          }
        }

        if (closestTile && !closestTile.isLocked) {
          const act = `rotate:${closestTile.id}`;
          const leg = legalActions(state);
          if (leg.includes(act)) {
            const prevRelays = state.poweredRelays;
            const prevStage = state.stage;
            step(state, act);

            if (state.stage > prevStage || state.won) playSound('stage');
            else if (state.poweredRelays > prevRelays) playSound('relay');
            else playSound('rotate');

            updateHUD();
            render();
          }
        }
      }

      // Event Listeners
      if (canvas && typeof canvas.addEventListener === 'function') {
        canvas.addEventListener('click', (e) => {
          const rect = canvas.getBoundingClientRect();
          const scaleX = canvas.width / rect.width;
          const scaleY = canvas.height / rect.height;
          const mx = (e.clientX - rect.left) * scaleX;
          const my = (e.clientY - rect.top) * scaleY;
          handleTileClick(mx, my);
        });
      }

      const btnRestart = document.getElementById('btn-restart');
      if (btnRestart && typeof btnRestart.addEventListener === 'function') {
        btnRestart.addEventListener('click', () => {
          state = createState(Math.floor(Math.random() * 100000) + 1);
          updateHUD();
          render();
        });
      }

      if (typeof window !== 'undefined' && typeof window.addEventListener === 'function') {
        window.addEventListener('keydown', (e) => {
          if (e.key === 'r' || e.key === 'R') {
            state = createState(Math.floor(Math.random() * 100000) + 1);
            updateHUD();
            render();
          } else if (e.key === ' ' || e.key === 'w' || e.key === 'W') {
            if (legalActions(state).includes('wait')) {
              step(state, 'wait');
              updateHUD();
              render();
            }
          }
        });
      }

      // Initial render
      updateHUD();
      render();
    })();
  </script>
</body>
</html>
