<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#090e17">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>Frost Outpost</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #090e17;
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  canvas {
    display: block;
    margin: 0 auto;
    touch-action: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="logic.js"></script>
<script>
const { MAX_DAYS, MAX_STEPS, createState, legalActions, step, isOver, score } = GameLogic;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const W = 360;
const H = 640;

let scale = 1;
function resize() {
  scale = Math.min(innerWidth / W, innerHeight / H);
  const dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.style.width = W * scale + 'px';
  canvas.style.height = H * scale + 'px';
  canvas.width = Math.round(W * scale * dpr);
  canvas.height = Math.round(H * scale * dpr);
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
}
addEventListener('resize', resize);
resize();

let best = 0;
try { best = +localStorage.getItem('goe-0162-best') || 0; } catch (e) {}

let state = createState(Date.now());
let message = 'Keep the fire burning and survive 20 days.';
let overAt = 0;

function restart() {
  state = createState(Date.now());
  message = 'Keep the fire burning and survive 20 days.';
  overAt = 0;
}

function rrect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function toLogical(e) {
  const rect = canvas.getBoundingClientRect();
  return { x: (e.clientX - rect.left) / scale, y: (e.clientY - rect.top) / scale };
}

function tryAction(act) {
  if (isOver(state)) return;
  try {
    step(state, act);
    if (isOver(state)) {
      overAt = performance.now();
      const sc = score(state);
      if (sc > best) {
        best = sc;
        try { localStorage.setItem('goe-0162-best', best); } catch (e) {}
      }
    }
  } catch (err) {
    message = err.message;
  }
}

// Action Button Bounds: 2 columns of 4 buttons
const BTN_X1 = 18;
const BTN_X2 = 184;
const BTN_W = 158;
const BTN_H = 48;
const BTN_START_Y = 320;
const BTN_GAP_Y = 56;

const BUTTONS = [
  { type: 'stoke_fire', title: 'Stoke Hearth', sub: '3 Wood (+35 Fire)', x: BTN_X1, y: BTN_START_Y },
  { type: 'eat', title: 'Eat Rations', sub: '2 Food (-35 Hunger)', x: BTN_X2, y: BTN_START_Y },
  { type: 'heal', title: 'Use Medkit', sub: '1 Med (+30 HP)', x: BTN_X1, y: BTN_START_Y + BTN_GAP_Y },
  { type: 'forage_wood', title: 'Scavenge Timber', sub: '+Wood (-Cold)', x: BTN_X2, y: BTN_START_Y + BTN_GAP_Y },
  { type: 'hunt_food', title: 'Hunt Game', sub: '+Food, Scrap (-Cold)', x: BTN_X1, y: BTN_START_Y + BTN_GAP_Y * 2 },
  { type: 'repair_shelter', title: 'Reinforce Cabin', sub: '4 Wood, 2 Scrap', x: BTN_X2, y: BTN_START_Y + BTN_GAP_Y * 2 },
  { type: 'upgrade_insulation', title: 'Insulate Walls', sub: '8 Wood, 8 Scrap', x: BTN_X1, y: BTN_START_Y + BTN_GAP_Y * 3 },
  { type: 'defend', title: 'Repel Wolves', sub: '2 Wood (Torches)', x: BTN_X2, y: BTN_START_Y + BTN_GAP_Y * 3 },
];

canvas.addEventListener('pointerdown', (e) => {
  const p = toLogical(e);
  if (isOver(state)) {
    if (performance.now() - overAt > 400) restart();
    return;
  }

  // Action buttons
  for (const b of BUTTONS) {
    if (p.x >= b.x && p.x <= b.x + BTN_W && p.y >= b.y && p.y <= b.y + BTN_H) {
      tryAction({ type: b.type });
      return;
    }
  }

  // Sleep Button (y: 560 to 615, full width)
  if (p.x >= 18 && p.x <= 342 && p.y >= 560 && p.y <= 615) {
    tryAction({ type: 'sleep' });
    return;
  }
});

addEventListener('keydown', (e) => {
  if (isOver(state)) {
    if ((e.key === ' ' || e.key === 'Enter') && performance.now() - overAt > 400) restart();
    return;
  }
  if (e.key === '1') tryAction({ type: 'stoke_fire' });
  else if (e.key === '2') tryAction({ type: 'eat' });
  else if (e.key === '3') tryAction({ type: 'heal' });
  else if (e.key === '4') tryAction({ type: 'forage_wood' });
  else if (e.key === '5') tryAction({ type: 'hunt_food' });
  else if (e.key === '6') tryAction({ type: 'repair_shelter' });
  else if (e.key === '7') tryAction({ type: 'upgrade_insulation' });
  else if (e.key === '8' || e.key === 'd' || e.key === 'D') tryAction({ type: 'defend' });
  else if (e.key === ' ' || e.key === 'Enter') tryAction({ type: 'sleep' });
  else if (e.key === 'r') restart();
});

function drawMeter(x, y, w, h, label, val, maxVal, col) {
  ctx.fillStyle = '#1e293b';
  rrect(x, y, w, h, 6);
  ctx.fill();

  const frac = Math.max(0, Math.min(1, val / maxVal));
  if (frac > 0) {
    ctx.fillStyle = col;
    rrect(x + 2, y + 2, (w - 4) * frac, h - 4, 4);
    ctx.fill();
  }

  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 10px system-ui, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(label, x + 8, y + h - 5);
  ctx.textAlign = 'right';
  ctx.fillText(`${val}/${maxVal}`, x + w - 8, y + h - 5);
}

function draw() {
  ctx.fillStyle = '#090e17';
  ctx.fillRect(0, 0, W, H);

  // Top Status Bar
  ctx.fillStyle = '#111827';
  rrect(15, 12, W - 30, 48, 10);
  ctx.fill();

  ctx.fillStyle = '#9ca3af';
  ctx.font = '10px system-ui, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('EXPEDITION DAY', 26, 28);
  ctx.textAlign = 'center';
  ctx.fillText('WEATHER', W / 2, 28);
  ctx.textAlign = 'right';
  ctx.fillText('SCORE', W - 26, 28);

  ctx.font = 'bold 16px system-ui, sans-serif';
  ctx.fillStyle = '#38bdf8';
  ctx.textAlign = 'left';
  ctx.fillText(`${state.day} / ${MAX_DAYS}`, 26, 48);

  const wCol = state.weather === 'blizzard' ? '#ef4444' : state.weather === 'windy' ? '#38bdf8' : '#e0f2fe';
  ctx.fillStyle = wCol;
  ctx.textAlign = 'center';
  ctx.fillText(state.weather.toUpperCase(), W / 2, 48);

  ctx.fillStyle = '#fbbf24';
  ctx.textAlign = 'right';
  ctx.fillText(score(state), W - 26, 48);

  // Threat alert banner
  if (state.threat === 'wolves') {
    ctx.fillStyle = '#991b1b';
    rrect(15, 66, W - 30, 24, 6);
    ctx.fill();
    ctx.fillStyle = '#fef2f2';
    ctx.font = 'bold 11px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('⚠️ WOLF PACK CIRCLES OUTPOST! DEFEND WITH TORCHES!', W / 2, 82);
  }

  // Survivor 4 Main Meters
  const meterY = state.threat === 'wolves' ? 96 : 70;
  drawMeter(18, meterY, 158, 20, 'HEALTH', state.health, 100, '#ef4444');
  drawMeter(184, meterY, 158, 20, 'WARMTH', state.warmth, 100, '#38bdf8');
  drawMeter(18, meterY + 26, 158, 20, 'HUNGER', state.hunger, 100, '#f97316');
  drawMeter(184, meterY + 26, 158, 20, 'FIRE HEARTH', state.fireLevel, 100, '#eab308');

  // Shelter Info Box
  const shY = meterY + 54;
  ctx.fillStyle = '#111827';
  rrect(15, shY, W - 30, 44, 8);
  ctx.fill();

  ctx.fillStyle = '#94a3b8';
  ctx.font = '10px system-ui, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('OUTPOST INTEGRITY', 26, shY + 18);
  ctx.fillText('CABIN INSULATION', 200, shY + 18);

  ctx.font = 'bold 14px system-ui, sans-serif';
  ctx.fillStyle = state.shelter.integrity > 40 ? '#4ade80' : '#ef4444';
  ctx.fillText(`${state.shelter.integrity}%`, 26, shY + 36);

  ctx.fillStyle = '#38bdf8';
  ctx.fillText(`Level ${state.shelter.insulation} / 3`, 200, shY + 36);

  // Supply Chest Dashboard
  const supY = shY + 52;
  ctx.fillStyle = '#1e293b';
  rrect(15, supY, W - 30, 42, 8);
  ctx.fill();

  const items = [
    { name: 'Wood', count: state.supplies.wood, col: '#fbbf24' },
    { name: 'Food', count: state.supplies.food, col: '#4ade80' },
    { name: 'Meds', count: state.supplies.medical, col: '#f87171' },
    { name: 'Scrap', count: state.supplies.scrap, col: '#94a3b8' },
  ];

  for (let i = 0; i < 4; i++) {
    const it = items[i];
    const ix = 24 + i * 80;
    ctx.fillStyle = '#94a3b8';
    ctx.font = '10px system-ui, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(it.name, ix, supY + 16);

    ctx.fillStyle = it.col;
    ctx.font = 'bold 14px system-ui, sans-serif';
    ctx.fillText(it.count, ix, supY + 34);
  }

  // Draw 8 Action Buttons
  const acts = legalActions(state);
  const actTypes = new Set(acts.map((a) => a.type));

  for (const b of BUTTONS) {
    const isLegal = actTypes.has(b.type);
    const isWolfDef = b.type === 'defend' && state.threat === 'wolves';

    ctx.fillStyle = isWolfDef ? '#b91c1c' : isLegal ? '#1e293b' : '#0f172a';
    ctx.strokeStyle = isWolfDef ? '#ef4444' : isLegal ? '#38bdf8' : '#1e293b';
    ctx.lineWidth = isWolfDef ? 2 : 1;

    rrect(b.x, b.y, BTN_W, BTN_H, 8);
    ctx.fill();
    ctx.stroke();

    ctx.textAlign = 'left';
    ctx.fillStyle = isLegal ? '#ffffff' : '#64748b';
    ctx.font = 'bold 12px system-ui, sans-serif';
    ctx.fillText(b.title, b.x + 10, b.y + 20);

    ctx.fillStyle = isLegal ? '#94a3b8' : '#475569';
    ctx.font = '10px system-ui, sans-serif';
    ctx.fillText(b.sub, b.x + 10, b.y + 36);
  }

  // Big Sleep & Survive Night Button
  ctx.fillStyle = '#2563eb';
  rrect(18, 560, 324, 52, 12);
  ctx.fill();

  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 15px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('SLEEP & SURVIVE NIGHT', W / 2, 584);
  ctx.font = '11px system-ui, sans-serif';
  ctx.fillStyle = '#bfdbfe';
  ctx.fillText('Advance Day (-Fire, Process Cold & Weather)', W / 2, 602);

  // Game Over Overlay
  if (isOver(state)) {
    ctx.fillStyle = 'rgba(9, 14, 23, 0.92)';
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = state.won ? '#4ade80' : '#ef4444';
    ctx.font = 'bold 26px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(state.won ? 'RESCUE EXTRACTED!' : 'FROZEN OUTPOST FELL', W / 2, H / 2 - 70);

    ctx.fillStyle = '#e2e8f0';
    ctx.font = '15px system-ui, sans-serif';
    ctx.fillText(state.won ? 'Helicopter arrived on Day 21!' : 'The cold arctic night took you.', W / 2, H / 2 - 30);
    ctx.fillText(`Days Endured: ${state.day} / ${MAX_DAYS}`, W / 2, H / 2 - 5);
    ctx.fillText(`Final Health: ${state.health} HP`, W / 2, H / 2 + 20);

    ctx.fillStyle = '#fbbf24';
    ctx.font = 'bold 24px system-ui, sans-serif';
    ctx.fillText(`Final Score: ${score(state)}`, W / 2, H / 2 + 65);

    ctx.fillStyle = '#38bdf8';
    ctx.font = 'bold 14px system-ui, sans-serif';
    ctx.fillText('Tap anywhere to try again', W / 2, H / 2 + 115);
  }
}

function frame(now) {
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

const inApk = window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform();
if (!inApk && 'serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
