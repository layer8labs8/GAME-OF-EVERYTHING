<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#030712">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Highway Hauler</title>
<style>
  html, body { margin: 0; height: 100%; background: #030712; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; margin: 0 auto; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="logic.js"></script>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const W = 360;
const H = 640;
let scale = 1;

function resize() {
  scale = Math.min(innerWidth / W, innerHeight / H);
  const dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.style.width = W * scale + 'px';
  canvas.style.height = H * scale + 'px';
  canvas.width = Math.round(W * scale * dpr);
  canvas.height = Math.round(H * scale * dpr);
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
}
addEventListener('resize', resize);
resize();

function rrect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

let best = 0;
try { best = +localStorage.getItem('goe-0174-best') || 0; } catch (e) {}

let state = createState(Date.now());
let playerX = 180;
let targetX = 180;
let roadOffset = 0;
let floaters = [];
let overAt = 0;
let swipeStartX = null;

function restart() {
  state = createState(Date.now());
  targetX = getLaneX(state.lane);
  playerX = targetX;
  floaters = [];
  overAt = 0;
}

function getLaneX(lane) {
  return 85 + lane * 95;
}

function performAction(act) {
  if (isOver(state)) return;
  const legals = legalActions(state);
  if (!legals.includes(act)) return;

  const oldDist = state.distance;
  const res = step(state, act);
  targetX = getLaneX(state.lane);

  if (act.includes('accelerate')) {
    floaters.push({ text: state.speed + ' KM/H', x: playerX, y: 380, t: 0, color: '#10b981' });
  } else if (act.includes('brakes')) {
    floaters.push({ text: 'BRAKE', x: playerX, y: 380, t: 0, color: '#ef4444' });
  } else if (act.includes('fuel')) {
    floaters.push({ text: '+FUEL REFILL', x: playerX, y: 380, t: 0, color: '#f59e0b' });
  } else if (act.includes('rest')) {
    floaters.push({ text: 'RESTORED FATIGUE', x: playerX, y: 380, t: 0, color: '#06b6d4' });
  } else if (act.includes('deliver')) {
    floaters.push({ text: 'FREIGHT DELIVERED!', x: playerX, y: 380, t: 0, color: '#38bdf8' });
  }

  if (isOver(state)) {
    overAt = performance.now();
    const sc = score(state);
    if (sc > best) {
      best = sc;
      try { localStorage.setItem('goe-0174-best', best); } catch (e) {}
    }
  }
}

// Action button hitboxes on canvas
const BTNS = [
  { id: 'left', label: '◀ STEER L', action: 'action:shift_lane:left', x: 20, y: 470, w: 75, h: 48, col: '#0284c7' },
  { id: 'gas', label: 'THROTTLE ▲', action: 'action:accelerate_throttle', x: 105, y: 470, w: 150, h: 48, col: '#10b981' },
  { id: 'right', label: 'STEER R ▶', action: 'action:shift_lane:right', x: 265, y: 470, w: 75, h: 48, col: '#0284c7' },
  { id: 'brake', label: 'BRAKES ▼', action: 'action:apply_service_brakes', x: 20, y: 528, w: 100, h: 44, col: '#ef4444' },
  { id: 'gear_up', label: 'GEAR ▲', action: 'action:shift_gear_up', x: 130, y: 528, w: 100, h: 44, col: '#f59e0b' },
  { id: 'gear_dn', label: 'GEAR ▼', action: 'action:shift_gear_down', x: 240, y: 528, w: 100, h: 44, col: '#d97706' },
  { id: 'fuel', label: 'FUEL STOP', action: 'action:stop_at_fuel_depot', x: 20, y: 582, w: 100, h: 44, col: '#06b6d4' },
  { id: 'rest', label: 'REST CAB', action: 'action:rest_sleeper_cab', x: 130, y: 582, w: 100, h: 44, col: '#8b5cf6' },
  { id: 'deliver', label: 'DELIVER FREIGHT', action: 'action:deliver_freight', x: 240, y: 582, w: 100, h: 44, col: '#10b981' },
];

function toLogical(e) {
  const rect = canvas.getBoundingClientRect();
  return { x: (e.clientX - rect.left) / scale, y: (e.clientY - rect.top) / scale };
}

canvas.addEventListener('pointerdown', (e) => {
  const p = toLogical(e);
  if (isOver(state)) {
    if (performance.now() - overAt > 400) restart();
    return;
  }
  for (const b of BTNS) {
    if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) {
      performAction(b.action);
      return;
    }
  }
  if (p.y < 460) {
    swipeStartX = p.x;
    if (p.x < 110) performAction('action:shift_lane:left');
    else if (p.x > 250) performAction('action:shift_lane:right');
    else performAction('action:accelerate_throttle');
  }
});

canvas.addEventListener('pointermove', (e) => {
  if (swipeStartX === null || isOver(state)) return;
  const p = toLogical(e);
  const dx = p.x - swipeStartX;
  if (Math.abs(dx) > 30) {
    if (dx > 0) performAction('action:shift_lane:right');
    else performAction('action:shift_lane:left');
    swipeStartX = p.x;
  }
});

canvas.addEventListener('pointerup', () => { swipeStartX = null; });
canvas.addEventListener('pointercancel', () => { swipeStartX = null; });

addEventListener('keydown', (e) => {
  if (isOver(state)) {
    if ((e.key === ' ' || e.key === 'Enter') && performance.now() - overAt > 400) restart();
    return;
  }
  const k = e.key.toLowerCase();
  if (k === 'arrowleft' || k === 'a') performAction('action:shift_lane:left');
  else if (k === 'arrowright' || k === 'd') performAction('action:shift_lane:right');
  else if (k === 'arrowup' || k === 'w') performAction('action:accelerate_throttle');
  else if (k === 'arrowdown' || k === 's') performAction('action:apply_service_brakes');
  else if (k === 'e') performAction('action:shift_gear_up');
  else if (k === 'q') performAction('action:shift_gear_down');
  else if (k === 'f') performAction('action:stop_at_fuel_depot');
  else if (k === 'r') performAction('action:rest_sleeper_cab');
  else if (k === ' ' || k === 'enter') {
    if (state.distance >= 100) performAction('action:deliver_freight');
    else performAction('action:accelerate_throttle');
  }
});

function draw(dt) {
  // Road scrolling speed based on truck km/h
  const pxSpeed = Math.max(40, state.speed * 4.5);
  roadOffset = (roadOffset + pxSpeed * dt) % 60;

  // Background
  ctx.fillStyle = '#030712';
  ctx.fillRect(0, 0, W, H);

  // Interstate Highway Surface
  ctx.fillStyle = '#0f172a';
  ctx.fillRect(40, 0, 280, 460);

  // Shoulders & Guardrails
  ctx.fillStyle = '#38bdf8';
  ctx.fillRect(36, 0, 4, 460);
  ctx.fillRect(320, 0, 4, 460);

  // Lane dividers (striped)
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  for (let y = -60 + roadOffset; y < 460; y += 50) {
    ctx.fillRect(132, y, 4, 28);
    ctx.fillRect(224, y, 4, 28);
  }

  // Draw Hazards / Traffic in lanes
  if (state.traffic) {
    for (let lane = 0; lane < 3; lane++) {
      const item = state.traffic[lane];
      if (!item) continue;
      const hx = getLaneX(lane);
      const hy = 160;

      if (item.type === 'slow_van') {
        ctx.fillStyle = '#f59e0b';
        rrect(hx - 15, hy - 22, 30, 44, 5);
        ctx.fill();
        ctx.fillStyle = '#1e293b';
        rrect(hx - 11, hy - 16, 22, 12, 3);
        ctx.fill();
        ctx.fillStyle = '#fef3c7';
        ctx.font = 'bold 9px system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('VAN 35k', hx, hy - 26);
      } else {
        // Road work cones
        ctx.fillStyle = '#ea580c';
        ctx.beginPath();
        ctx.moveTo(hx - 12, hy + 16);
        ctx.lineTo(hx + 12, hy + 16);
        ctx.lineTo(hx, hy - 16);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.fillRect(hx - 6, hy - 4, 12, 4);
        ctx.fillStyle = '#fef08a';
        ctx.font = 'bold 9px system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('CONES!', hx, hy - 22);
      }
    }
  }

  // Smooth lerp for Semi-Truck
  playerX += (targetX - playerX) * Math.min(1, dt * 12);

  // Draw Semi-Truck (Trailer + Cab)
  const py = 360;

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  rrect(playerX - 20, py + 20, 40, 36, 6);
  ctx.fill();

  // Wheels
  ctx.fillStyle = '#0f172a';
  ctx.fillRect(playerX - 22, py - 35, 5, 14);
  ctx.fillRect(playerX + 17, py - 35, 5, 14);
  ctx.fillRect(playerX - 22, py - 5, 5, 14);
  ctx.fillRect(playerX + 17, py - 5, 5, 14);
  ctx.fillRect(playerX - 22, py + 25, 5, 14);
  ctx.fillRect(playerX + 17, py + 25, 5, 14);

  // Big Cargo Trailer
  ctx.fillStyle = '#e2e8f0';
  rrect(playerX - 18, py - 18, 36, 60, 4);
  ctx.fill();
  ctx.fillStyle = '#0284c7';
  rrect(playerX - 16, py - 14, 32, 52, 3);
  ctx.fill();

  // Cab
  ctx.fillStyle = '#38bdf8';
  rrect(playerX - 17, py - 48, 34, 28, 5);
  ctx.fill();
  ctx.fillStyle = '#0f172a';
  rrect(playerX - 12, py - 44, 24, 10, 2);
  ctx.fill();

  // Top Dashboard HUD
  ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
  ctx.fillRect(0, 0, W, 48);

  ctx.fillStyle = '#38bdf8';
  ctx.font = 'bold 15px system-ui, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('ROUTE: ' + state.distance + '/100 KM', 12, 22);

  ctx.textAlign = 'right';
  ctx.fillStyle = '#10b981';
  ctx.fillText(state.speed + ' KM/H (G' + state.gear + ')', W - 12, 22);

  // Sub-bars: Cargo & Fuel
  ctx.font = '10px system-ui, sans-serif';
  ctx.fillStyle = '#94a3b8';
  ctx.textAlign = 'left';
  ctx.fillText('CARGO ' + state.cargoIntegrity + '%', 12, 38);
  ctx.fillStyle = '#334155';
  ctx.fillRect(75, 30, 75, 8);
  ctx.fillStyle = state.cargoIntegrity > 50 ? '#10b981' : '#ef4444';
  ctx.fillRect(75, 30, 75 * (state.cargoIntegrity / 100), 8);

  ctx.fillStyle = '#94a3b8';
  ctx.fillText('FUEL ' + state.fuel + '%', 165, 38);
  ctx.fillStyle = '#334155';
  ctx.fillRect(215, 30, 60, 8);
  ctx.fillStyle = state.fuel > 25 ? '#38bdf8' : '#ef4444';
  ctx.fillRect(215, 30, 60 * (state.fuel / 100), 8);

  ctx.fillStyle = '#f59e0b';
  ctx.fillText('TIRED ' + state.fatigue + '%', 282, 38);

  // Floating text
  for (let i = floaters.length - 1; i >= 0; i--) {
    const f = floaters[i];
    f.y -= 35 * dt;
    f.t += dt;
    if (f.t > 0.8) {
      floaters.splice(i, 1);
      continue;
    }
    ctx.fillStyle = f.color;
    ctx.font = 'bold 15px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(f.text, f.x, f.y);
  }

  // Draw Control Deck
  ctx.fillStyle = '#0b1320';
  ctx.fillRect(0, 460, W, 180);
  ctx.fillStyle = '#0284c7';
  ctx.fillRect(0, 458, W, 2);

  const legals = legalActions(state);
  for (const b of BTNS) {
    const isLegal = legals.includes(b.action);
    ctx.fillStyle = isLegal ? b.col : '#1e293b';
    rrect(b.x, b.y, b.w, b.h, 6);
    ctx.fill();
    ctx.strokeStyle = isLegal ? 'rgba(255,255,255,0.3)' : '#334155';
    ctx.lineWidth = 1.5;
    rrect(b.x, b.y, b.w, b.h, 6);
    ctx.stroke();

    ctx.fillStyle = isLegal ? '#ffffff' : '#64748b';
    ctx.font = 'bold 11px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(b.label, b.x + b.w / 2, b.y + b.h / 2);
  }
  ctx.textBaseline = 'alphabetic';

  // Game over overlay
  if (isOver(state)) {
    ctx.fillStyle = 'rgba(3, 7, 18, 0.9)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = state.victory ? '#10b981' : '#ef4444';
    ctx.font = 'bold 30px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(state.victory ? 'DELIVERY COMPLETE!' : 'HAUL FAILED', W / 2, H / 2 - 40);
    ctx.fillStyle = '#f1f5f9';
    ctx.font = '18px system-ui, sans-serif';
    ctx.fillText('Score: ' + score(state) + '  (Best: ' + best + ')', W / 2, H / 2);
    ctx.fillText('Cargo: ' + state.cargoIntegrity + '%  Distance: ' + state.distance + 'km', W / 2, H / 2 + 28);
    ctx.fillStyle = '#38bdf8';
    ctx.font = 'bold 16px system-ui, sans-serif';
    ctx.fillText('Tap to drive again', W / 2, H / 2 + 70);
  }
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  draw(dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

const inApk = window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform();
if (!inApk && 'serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
