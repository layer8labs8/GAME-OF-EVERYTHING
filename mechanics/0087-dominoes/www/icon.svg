<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#292524"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>
    <linearGradient id="ivory" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f4"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <rect x="28" y="28" width="456" height="456" rx="84" fill="none" stroke="#d97706" stroke-width="6" opacity="0.4"/>
  <!-- Ivory Domino Tile (Double Six) -->
  <g filter="url(#shadow)">
    <rect x="176" y="86" width="160" height="340" rx="20" fill="url(#ivory)" stroke="#e7e5e4" stroke-width="4"/>
    <!-- Center divider -->
    <line x1="188" y1="256" x2="324" y2="256" stroke="#78716c" stroke-width="4" stroke-linecap="round"/>
    <circle cx="256" cy="256" r="6" fill="#d97706"/>
    <!-- Top 6 pips -->
    <circle cx="216" cy="130" r="10" fill="#1c1917"/>
    <circle cx="296" cy="130" r="10" fill="#1c1917"/>
    <circle cx="216" cy="170" r="10" fill="#1c1917"/>
    <circle cx="296" cy="170" r="10" fill="#1c1917"/>
    <circle cx="216" cy="210" r="10" fill="#1c1917"/>
    <circle cx="296" cy="210" r="10" fill="#1c1917"/>
    <!-- Bottom 6 pips -->
    <circle cx="216" cy="302" r="10" fill="#1c1917"/>
    <circle cx="296" cy="302" r="10" fill="#1c1917"/>
    <circle cx="216" cy="342" r="10" fill="#1c1917"/>
    <circle cx="296" cy="342" r="10" fill="#1c1917"/>
    <circle cx="216" cy="382" r="10" fill="#1c1917"/>
    <circle cx="296" cy="382" r="10" fill="#1c1917"/>
  </g>
</svg>
