<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#180e29"/>
      <stop offset="100%" stop-color="#070814"/>
    </linearGradient>
    <radialGradient id="bullet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#881337"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <!-- Danmaku spiral bullets -->
  <circle cx="256" cy="180" r="22" fill="url(#bullet)"/>
  <circle cx="200" cy="140" r="18" fill="url(#bullet)"/>
  <circle cx="312" cy="140" r="18" fill="url(#bullet)"/>
  <circle cx="150" cy="220" r="16" fill="url(#bullet)"/>
  <circle cx="362" cy="220" r="16" fill="url(#bullet)"/>
  <circle cx="190" cy="280" r="14" fill="url(#bullet)"/>
  <circle cx="322" cy="280" r="14" fill="url(#bullet)"/>
  <!-- Player Ship -->
  <polygon points="256,360 226,430 286,430" fill="#38bdf8"/>
  <!-- Glowing Micro-Core Hitbox -->
  <circle cx="256" cy="405" r="7" fill="#ffffff" stroke="#ef4444" stroke-width="3"/>
  <!-- Border -->
  <rect x="20" y="20" width="472" height="472" rx="80" fill="none" stroke="#475569" stroke-width="8"/>
</svg>
