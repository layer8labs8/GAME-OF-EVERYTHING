<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b1020">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>Speedway Rush</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b1020; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; margin: 0 auto; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="logic.js"></script>
<script>
const { LANES, PLAYER_Y, CAR_LEN, createState, legalActions, step, isOver, score } = GameLogic;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const W = 360;
const H = 640;
const LANE_X = [95, 180, 265];
const ROAD_LEFT = 45;
const ROAD_RIGHT = 315;

let scale = 1;
function resize() {
  scale = Math.min(innerWidth / W, innerHeight / H);
  const dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.style.width = W * scale + 'px';
  canvas.style.height = H * scale + 'px';
  canvas.width = Math.round(W * scale * dpr);
  canvas.height = Math.round(H * scale * dpr);
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
}
addEventListener('resize', resize);
resize();

let best = 0;
try { best = +localStorage.getItem('goe-0172-best') || 0; } catch (e) {}

let state = createState(Date.now());
let playerVisualX = LANE_X[state.lane];
let roadScroll = 0;
let nitroHolding = false;
let overAt = 0;

function restart() {
  state = createState(Date.now());
  playerVisualX = LANE_X[state.lane];
  roadScroll = 0;
  nitroHolding = false;
  overAt = 0;
}

function rrect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y + w, y, r);
  ctx.closePath();
}

function toLogical(e) {
  const rect = canvas.getBoundingClientRect();
  return { x: (e.clientX - rect.left) / scale, y: (e.clientY - rect.top) / scale };
}

let pointerDownX = 0;
canvas.addEventListener('pointerdown', (e) => {
  const p = toLogical(e);
  if (isOver(state)) {
    if (performance.now() - overAt > 400) restart();
    return;
  }
  pointerDownX = p.x;
  if (p.y > 480 && p.x >= 130 && p.x <= 230) {
    nitroHolding = true;
  } else if (p.x < 130) {
    stepSim('left');
  } else if (p.x > 230) {
    stepSim('right');
  } else {
    nitroHolding = true;
  }
});

window.addEventListener('pointerup', () => { nitroHolding = false; });
window.addEventListener('pointercancel', () => { nitroHolding = false; });

const keys = {};
addEventListener('keydown', (e) => {
  if (isOver(state)) {
    if ((e.key === ' ' || e.key === 'Enter') && performance.now() - overAt > 400) restart();
    return;
  }
  keys[e.key] = true;
  if (e.key === 'ArrowLeft' || e.key === 'a') stepSim('left');
  else if (e.key === 'ArrowRight' || e.key === 'd') stepSim('right');
  else if (e.key === 'r') restart();
});
addEventListener('keyup', (e) => { keys[e.key] = false; });

function stepSim(act) {
  if (isOver(state)) return;
  const res = step(state, act);
  if (res.done) {
    overAt = performance.now();
    const sc = score(state);
    if (sc > best) {
      best = sc;
      try { localStorage.setItem('goe-0172-best', best); } catch (e) {}
    }
  }
}

let tickAcc = 0;
function updateSim(dt) {
  tickAcc += dt;
  const STEP_TIME = 1 / 30;

  while (tickAcc >= STEP_TIME && !isOver(state)) {
    tickAcc -= STEP_TIME;
    let act = 'wait';
    if (keys[' '] || keys['ArrowUp'] || keys['w'] || nitroHolding) {
      act = 'nitro';
    }
    stepSim(act);
  }

  // Smooth visual lerp
  const targetX = LANE_X[state.lane];
  playerVisualX += (targetX - playerVisualX) * Math.min(1, dt * 16);

  const speed = state.nitroActive ? 18 : 9;
  roadScroll = (roadScroll + speed) % 60;
}

function drawCar(x, y, color, isPlayer, nitro) {
  ctx.save();
  ctx.translate(x, y);

  // Nitro exhaust flame
  if (isPlayer && nitro) {
    ctx.fillStyle = '#38bdf8';
    ctx.beginPath();
    ctx.moveTo(-7, 24);
    ctx.lineTo(0, 36 + Math.random() * 8);
    ctx.lineTo(7, 24);
    ctx.fill();

    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.moveTo(-3, 24);
    ctx.lineTo(0, 30);
    ctx.lineTo(3, 24);
    ctx.fill();
  }

  // Car chassis
  ctx.fillStyle = color;
  rrect(-15, -23, 30, 46, 7);
  ctx.fill();

  // Roof / Windshield
  ctx.fillStyle = '#0f172a';
  rrect(-11, -12, 22, 22, 4);
  ctx.fill();

  // Glass front
  ctx.fillStyle = '#38bdf8';
  ctx.fillRect(-9, -10, 18, 5);

  // Wheels
  ctx.fillStyle = '#020617';
  ctx.fillRect(-17, -18, 3, 10);
  ctx.fillRect(14, -18, 3, 10);
  ctx.fillRect(-17, 10, 3, 10);
  ctx.fillRect(14, 10, 3, 10);

  // Headlights or taillights
  if (isPlayer) {
    ctx.fillStyle = '#ef4444';
    ctx.fillRect(-12, 21, 6, 2);
    ctx.fillRect(6, 21, 6, 2);
  } else {
    ctx.fillStyle = '#fef08a';
    ctx.fillRect(-12, 21, 6, 2);
    ctx.fillRect(6, 21, 6, 2);
  }

  ctx.restore();
}

function drawFuel(x, y) {
  ctx.save();
  ctx.translate(x, y);

  ctx.fillStyle = '#22c55e';
  rrect(-10, -12, 20, 24, 4);
  ctx.fill();

  ctx.fillStyle = '#ffffff';
  ctx.fillRect(-4, -6, 8, 3);
  ctx.fillRect(-2, -6, 4, 12);

  ctx.restore();
}

function draw() {
  ctx.fillStyle = '#020617';
  ctx.fillRect(0, 0, W, H);

  // Grass shoulders
  ctx.fillStyle = '#14532d';
  ctx.fillRect(0, 0, ROAD_LEFT, H);
  ctx.fillRect(ROAD_RIGHT, 0, W - ROAD_RIGHT, H);

  // Road asphalt
  ctx.fillStyle = '#1e293b';
  ctx.fillRect(ROAD_LEFT, 0, ROAD_RIGHT - ROAD_LEFT, H);

  // Side curbs
  for (let y = -60 + roadScroll; y < H; y += 30) {
    const curbCol = Math.floor(y / 30) % 2 === 0 ? '#ef4444' : '#ffffff';
    ctx.fillStyle = curbCol;
    ctx.fillRect(ROAD_LEFT - 5, y, 5, 28);
    ctx.fillRect(ROAD_RIGHT, y, 5, 28);
  }

  // Dashed lane lines
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 3;
  ctx.setLineDash([24, 24]);
  ctx.lineDashOffset = -roadScroll;

  ctx.beginPath();
  ctx.moveTo(137, 0);
  ctx.lineTo(137, H);
  ctx.moveTo(223, 0);
  ctx.lineTo(223, H);
  ctx.stroke();
  ctx.setLineDash([]);

  // Items
  for (const it of state.items) {
    drawFuel(LANE_X[it.lane], it.y);
  }

  // Traffic
  const RIVAL_COLORS = ['#fbbf24', '#a855f7', '#06b6d4'];
  for (const c of state.traffic) {
    drawCar(LANE_X[c.lane], c.y, RIVAL_COLORS[c.type % 3], false, false);
  }

  // Player Car
  if (state.hull > 0) {
    drawCar(playerVisualX, PLAYER_Y, '#ef4444', true, state.nitroActive);
  }

  // HUD
  ctx.fillStyle = '#8a93a8';
  ctx.font = '12px system-ui, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('SCORE', 20, 32);
  ctx.textAlign = 'center';
  ctx.fillText('DISTANCE', W / 2, 32);
  ctx.textAlign = 'right';
  ctx.fillText('BEST', W - 20, 32);

  ctx.fillStyle = '#e8ecf5';
  ctx.font = 'bold 26px system-ui, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(score(state), 20, 62);
  ctx.fillStyle = '#38bdf8';
  ctx.textAlign = 'center';
  ctx.fillText(`${Math.floor(state.distance / 10)} m`, W / 2, 62);
  ctx.fillStyle = '#fbbf24';
  ctx.font = 'bold 20px system-ui, sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText(best, W - 20, 60);

  // Hull Shields
  for (let i = 0; i < 3; i++) {
    ctx.fillStyle = i < state.hull ? '#22c55e' : '#334155';
    ctx.beginPath();
    ctx.arc(28 + i * 22, 86, 7, 0, Math.PI * 2);
    ctx.fill();
  }

  // Nitro Status Banner
  if (state.nitroActive && !isOver(state)) {
    ctx.fillStyle = '#38bdf8';
    ctx.font = 'bold 15px system-ui, sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText('TURBO NITRO 2X', W - 20, 88);
  }

  if (isOver(state)) {
    ctx.fillStyle = 'rgba(11,16,32,0.85)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ef4444';
    ctx.font = 'bold 34px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Car Totaled!', W / 2, H / 2 - 32);
    ctx.fillStyle = '#e8ecf5';
    ctx.font = '22px system-ui, sans-serif';
    ctx.fillText('Final Score: ' + score(state), W / 2, H / 2 + 8);
    ctx.fillStyle = '#38bdf8';
    ctx.font = '18px system-ui, sans-serif';
    ctx.fillText('Tap anywhere to race again', W / 2, H / 2 + 50);
  }
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  updateSim(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

const inApk = window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform();
if (!inApk && 'serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
