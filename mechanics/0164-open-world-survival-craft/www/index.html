<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#071b12">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Wilderness Craft</title>
<style>
  html, body { margin: 0; height: 100%; background: #071b12; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; margin: 0 auto; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="logic.js"></script>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const W = 360;
const H = 640;
let scale = 1;

function resize() {
  scale = Math.min(innerWidth / W, innerHeight / H);
  const dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.style.width = W * scale + 'px';
  canvas.style.height = H * scale + 'px';
  canvas.width = Math.round(W * scale * dpr);
  canvas.height = Math.round(H * scale * dpr);
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
}
addEventListener('resize', resize);
resize();

function rrect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

let best = 0;
try { best = +localStorage.getItem('goe-0164-best') || 0; } catch (e) {}

let state = createState(Date.now());
let floaters = [];
let animTimer = 0;
let overAt = 0;

function restart() {
  state = createState(Date.now());
  floaters = [];
  overAt = 0;
}

const BIOME_LABELS = [
  'Coastal Beach',
  'Pine Forest',
  'Granite Mountain Ridge',
  'Ancient Ruins'
];

function performAction(act) {
  if (isOver(state)) return;
  const legals = legalActions(state);
  if (!legals.includes(act)) return;

  const oldWood = state.wood;
  const oldStone = state.stone;
  const res = step(state, act);

  if (act.includes('chop')) {
    floaters.push({ text: '+WOOD', x: 90, y: 220, t: 0, color: '#f59e0b' });
  } else if (act.includes('mine')) {
    floaters.push({ text: '+STONE / ORE', x: 270, y: 240, t: 0, color: '#94a3b8' });
  } else if (act.includes('hunt')) {
    floaters.push({ text: '+RAW MEAT', x: 180, y: 200, t: 0, color: '#ef4444' });
  } else if (act.includes('build')) {
    floaters.push({ text: 'STRUCTURE BUILT!', x: 180, y: 320, t: 0, color: '#10b981' });
  } else if (act.includes('eat')) {
    floaters.push({ text: '+HEALTH & HUNGER', x: 180, y: 320, t: 0, color: '#f59e0b' });
  } else if (act.includes('drink')) {
    floaters.push({ text: '+HYDRATION', x: 180, y: 320, t: 0, color: '#38bdf8' });
  }

  if (isOver(state)) {
    overAt = performance.now();
    const sc = score(state);
    if (sc > best) {
      best = sc;
      try { localStorage.setItem('goe-0164-best', best); } catch (e) {}
    }
  }
}

// Action button hitboxes on canvas
const BTNS = [
  { id: 'chop', label: '🪓 CHOP TREES', action: 'action:chop_trees', x: 20, y: 460, w: 100, h: 44, col: '#d97706' },
  { id: 'mine', label: '⛏ MINE ROCK', action: 'action:mine_rock_and_ore', x: 130, y: 460, w: 100, h: 44, col: '#64748b' },
  { id: 'hunt', label: '🏹 HUNT BEASTS', action: 'action:hunt_wildlife', x: 240, y: 460, w: 100, h: 44, col: '#ef4444' },

  { id: 'gather', label: '🌾 GATHER FLINT', action: 'action:gather_fiber_and_flint', x: 20, y: 510, w: 100, h: 40, col: '#10b981' },
  { id: 'eat', label: '🍖 EAT RATION', action: 'action:eat_cooked_ration', x: 130, y: 510, w: 100, h: 40, col: '#ea580c' },
  { id: 'drink', label: '💧 DRINK WATER', action: 'action:drink_water', x: 240, y: 510, w: 100, h: 40, col: '#0284c7' },

  { id: 'camp', label: '🔥 CAMPFIRE', action: 'action:build_structure:campfire', x: 20, y: 556, w: 75, h: 38, col: '#d97706' },
  { id: 'shelter', label: '🛖 SHELTER', action: 'action:build_structure:shelter', x: 100, y: 556, w: 75, h: 38, col: '#b45309' },
  { id: 'bench', label: '🛠 WORKBENCH', action: 'action:build_structure:workbench', x: 180, y: 556, w: 80, h: 38, col: '#475569' },
  { id: 'beacon', label: '📡 BEACON', action: 'action:build_structure:signal_beacon', x: 265, y: 556, w: 75, h: 38, col: '#06b6d4' },

  { id: 'travel', label: '🗺 TRAVEL NEXT BIOME', action: 'action:travel_to_biome:' + (state.biome + 1), x: 20, y: 600, w: 320, h: 34, col: '#059669' },
];

function toLogical(e) {
  const rect = canvas.getBoundingClientRect();
  return { x: (e.clientX - rect.left) / scale, y: (e.clientY - rect.top) / scale };
}

canvas.addEventListener('pointerdown', (e) => {
  const p = toLogical(e);
  if (isOver(state)) {
    if (performance.now() - overAt > 400) restart();
    return;
  }
  // Check action buttons
  for (const b of BTNS) {
    if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) {
      // Dynamic travel biome action check
      if (b.id === 'travel') {
        performAction('action:travel_to_biome:' + (state.biome + 1));
      } else {
        performAction(b.action);
      }
      return;
    }
  }

  // Tapping natural scene elements directly:
  if (p.y < 450) {
    if (p.x < 130) performAction('action:chop_trees');
    else if (p.x > 230) performAction('action:mine_rock_and_ore');
    else if (p.y < 230) performAction('action:hunt_wildlife');
    else performAction('action:gather_fiber_and_flint');
  }
});

addEventListener('keydown', (e) => {
  if (isOver(state)) {
    if ((e.key === ' ' || e.key === 'Enter') && performance.now() - overAt > 400) restart();
    return;
  }
  const k = e.key.toLowerCase();
  if (k === '1' || k === 'c') performAction('action:chop_trees');
  else if (k === '2' || k === 'm') performAction('action:mine_rock_and_ore');
  else if (k === '3' || k === 'h') performAction('action:hunt_wildlife');
  else if (k === 'g') performAction('action:gather_fiber_and_flint');
  else if (k === 'e') performAction('action:eat_cooked_ration');
  else if (k === 'd') performAction('action:drink_water');
  else if (k === 'b') performAction('action:build_structure:shelter');
  else if (k === 't') performAction('action:travel_to_biome:' + (state.biome + 1));
});

function draw(dt) {
  animTimer += dt;

  // Sky & Biome Backdrop
  ctx.fillStyle = state.biome === 0 ? '#0284c7' :
                  state.biome === 1 ? '#064e3b' :
                  state.biome === 2 ? '#334155' : '#451a03';
  ctx.fillRect(0, 0, W, H);

  // Ground Terrain (0..450)
  ctx.fillStyle = state.biome === 0 ? '#eab308' :
                  state.biome === 1 ? '#14532d' :
                  state.biome === 2 ? '#475569' : '#78350f';
  ctx.fillRect(0, 260, W, 190);

  // Draw Scenery: Pine Trees on Left
  const treeSway = Math.sin(animTimer * 2) * 3;
  ctx.fillStyle = '#15803d';
  ctx.beginPath();
  ctx.moveTo(70 + treeSway, 140);
  ctx.lineTo(105, 260);
  ctx.lineTo(35, 260);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#78350f';
  ctx.fillRect(65, 260, 10, 20);

  // Draw Boulders / Ore Vein on Right
  ctx.fillStyle = '#64748b';
  ctx.beginPath();
  ctx.arc(280, 270, 32, Math.PI, 0);
  ctx.fill();
  ctx.fillStyle = '#94a3b8';
  ctx.beginPath();
  ctx.arc(260, 275, 18, Math.PI, 0);
  ctx.fill();

  // Campfire if built
  if (state.hasCampfire) {
    ctx.fillStyle = '#ef4444';
    ctx.beginPath();
    ctx.arc(180, 280, 10 + Math.sin(animTimer * 10) * 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#f59e0b';
    ctx.beginPath();
    ctx.arc(180, 280, 6, 0, Math.PI * 2);
    ctx.fill();
  }

  // Shelter if built
  if (state.hasShelter) {
    ctx.fillStyle = '#b45309';
    ctx.beginPath();
    ctx.moveTo(130, 210);
    ctx.lineTo(165, 270);
    ctx.lineTo(95, 270);
    ctx.closePath();
    ctx.fill();
  }

  // Player Survivor (Center)
  const px = 180;
  const py = 320;
  ctx.fillStyle = '#f8fafc';
  ctx.beginPath();
  ctx.arc(px, py - 18, 9, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#0284c7';
  ctx.fillRect(px - 7, py - 9, 14, 22);

  // Top Header HUD
  ctx.fillStyle = 'rgba(7, 27, 18, 0.95)';
  ctx.fillRect(0, 0, W, 52);

  ctx.fillStyle = '#34d399';
  ctx.font = 'bold 14px system-ui, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(BIOME_LABELS[state.biome].toUpperCase(), 12, 22);

  ctx.textAlign = 'right';
  ctx.fillStyle = '#facc15';
  ctx.fillText('BUILT: ' + state.structuresBuilt + ' 🛖', W - 12, 22);

  // Resource Inventory Counters
  ctx.font = '10px system-ui, sans-serif';
  ctx.fillStyle = '#fde047';
  ctx.textAlign = 'left';
  ctx.fillText('🪵 ' + state.wood + '  🪨 ' + state.stone + '  ⛏ ' + state.ironOre, 12, 42);

  ctx.fillStyle = '#38bdf8';
  ctx.textAlign = 'right';
  ctx.fillText('HP ' + state.health + '%  🍖 ' + state.hunger + '  💧 ' + state.thirst, W - 12, 42);

  // Floating text
  for (let i = floaters.length - 1; i >= 0; i--) {
    const f = floaters[i];
    f.y -= 35 * dt;
    f.t += dt;
    if (f.t > 0.8) {
      floaters.splice(i, 1);
      continue;
    }
    ctx.fillStyle = f.color;
    ctx.font = 'bold 15px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(f.text, f.x, f.y);
  }

  // Draw Control Deck
  ctx.fillStyle = '#071810';
  ctx.fillRect(0, 450, W, 190);
  ctx.fillStyle = '#059669';
  ctx.fillRect(0, 448, W, 2);

  const legals = legalActions(state);
  for (const b of BTNS) {
    const isTravel = b.id === 'travel';
    const actStr = isTravel ? 'action:travel_to_biome:' + (state.biome + 1) : b.action;
    const isLegal = legals.includes(actStr);

    ctx.fillStyle = isLegal ? b.col : '#13281c';
    rrect(b.x, b.y, b.w, b.h, 5);
    ctx.fill();
    ctx.strokeStyle = isLegal ? 'rgba(255,255,255,0.3)' : '#1f3d2b';
    ctx.lineWidth = 1.5;
    rrect(b.x, b.y, b.w, b.h, 5);
    ctx.stroke();

    ctx.fillStyle = isLegal ? '#ffffff' : '#64748b';
    ctx.font = 'bold 10px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(b.label, b.x + b.w / 2, b.y + b.h / 2);
  }
  ctx.textBaseline = 'alphabetic';

  // Game over overlay
  if (isOver(state)) {
    ctx.fillStyle = 'rgba(7, 27, 18, 0.95)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = state.victory ? '#10b981' : '#ef4444';
    ctx.font = 'bold 30px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(state.victory ? 'RESCUE SIGNAL SENT!' : 'PERISHED IN WILD', W / 2, H / 2 - 40);
    ctx.fillStyle = '#f1f5f9';
    ctx.font = '18px system-ui, sans-serif';
    ctx.fillText('Score: ' + score(state) + '  (Best: ' + best + ')', W / 2, H / 2);
    ctx.fillText('Biome: ' + BIOME_LABELS[state.biome] + '  Structures: ' + state.structuresBuilt, W / 2, H / 2 + 28);
    ctx.fillStyle = '#38bdf8';
    ctx.font = 'bold 16px system-ui, sans-serif';
    ctx.fillText('Tap to craft again', W / 2, H / 2 + 70);
  }
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  draw(dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

const inApk = window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform();
if (!inApk && 'serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
