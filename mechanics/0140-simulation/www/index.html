<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Biosphere Genesis - Planetary Simulation</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#10b981">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #021a12;
      color: #ecfdf5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 8px;
      overflow-x: hidden;
    }
    header {
      width: 100%;
      max-width: 480px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      padding: 6px 12px;
      background: #064e3b;
      border-radius: 8px;
      border: 1px solid #10b981;
    }
    h1 {
      font-size: 0.95rem;
      color: #6ee7b7;
      display: flex;
      align-items: center;
      gap: 6px;
      letter-spacing: 0.5px;
    }
    .hud {
      width: 100%;
      max-width: 480px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
      margin-bottom: 6px;
    }
    .hud-box {
      background: #064e3b;
      border: 1px solid #059669;
      border-radius: 6px;
      padding: 4px 6px;
      text-align: center;
      font-size: 0.72rem;
    }
    .hud-label {
      color: #a7f3d0;
      font-size: 0.62rem;
      text-transform: uppercase;
      margin-bottom: 2px;
    }
    .hud-val {
      font-weight: bold;
      color: #ffffff;
      font-size: 0.8rem;
    }
    .val-temp { color: #facc15; }
    .val-o2 { color: #38bdf8; }
    .val-moist { color: #34d399; }
    .val-stg { color: #f472b6; }

    #game-container {
      position: relative;
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    canvas {
      width: 100%;
      max-width: 460px;
      aspect-ratio: 16 / 7;
      background: #020617;
      border: 2px solid #10b981;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(16, 185, 129, 0.25);
      touch-action: none;
    }

    .log-box {
      width: 100%;
      max-width: 460px;
      background: #022c22;
      border: 1px solid #047857;
      border-radius: 6px;
      margin-top: 6px;
      padding: 6px 8px;
      height: 80px;
      overflow-y: auto;
      font-family: "Courier New", Courier, monospace;
      font-size: 0.72rem;
      color: #d1fae5;
    }
    .log-line { margin-bottom: 2px; }
    .log-alert { color: #f43f5e; font-weight: bold; }
    .log-ev { color: #facc15; font-weight: bold; }
    .log-win { color: #34d399; font-weight: bold; }

    .actions-grid {
      width: 100%;
      max-width: 460px;
      margin-top: 6px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 5px;
    }
    .btn-act {
      background: #064e3b;
      color: #ecfdf5;
      border: 1px solid #10b981;
      border-radius: 6px;
      padding: 8px 6px;
      font-size: 0.74rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.15s ease;
      text-align: center;
    }
    .btn-act:hover {
      background: #047857;
      border-color: #34d399;
    }
    .btn-act:active {
      transform: scale(0.97);
    }
    .btn-ice {
      background: #0369a1;
      border-color: #38bdf8;
    }
    .btn-ice:hover { background: #0284c7; }
    .btn-warm {
      background: #854d0e;
      border-color: #f59e0b;
    }
    .btn-warm:hover { background: #a16207; }
    .btn-bio {
      background: #047857;
      border-color: #34d399;
    }
    .btn-bio:hover { background: #059669; }
    .btn-epoch {
      background: #4338ca;
      border-color: #818cf8;
      grid-column: span 2;
      font-weight: bold;
      font-size: 0.82rem;
      padding: 10px;
    }
    .btn-epoch:hover { background: #4f46e5; }

    .modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(2, 26, 18, 0.94);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      padding: 16px;
      text-align: center;
      z-index: 10;
    }
    .modal-title {
      font-size: 1.4rem;
      font-weight: bold;
      margin-bottom: 8px;
    }
    .win-title { color: #34d399; text-shadow: 0 0 10px rgba(52, 211, 153, 0.5); }
    .lose-title { color: #f43f5e; }
  </style>
</head>
<body>

  <header>
    <h1>🌍 Biosphere Genesis</h1>
    <div style="font-size:0.75rem; color:#a7f3d0;" id="turn-counter">Epoch 1 (Energy: 30)</div>
  </header>

  <div class="hud">
    <div class="hud-box">
      <div class="hud-label">Temp (°C)</div>
      <div class="hud-val val-temp" id="hud-temp">-25°C</div>
    </div>
    <div class="hud-box">
      <div class="hud-label">Oxygen (%)</div>
      <div class="hud-val val-o2" id="hud-o2">1%</div>
    </div>
    <div class="hud-box">
      <div class="hud-label">Moisture (%)</div>
      <div class="hud-val val-moist" id="hud-moist">8%</div>
    </div>
    <div class="hud-box">
      <div class="hud-label">Life Stage</div>
      <div class="hud-val val-stg" id="hud-stage">Crust (0)</div>
    </div>
  </div>

  <div id="game-container">
    <canvas id="game-canvas" width="460" height="200"></canvas>

    <div class="log-box" id="log-box"></div>

    <div class="actions-grid" id="actions-grid"></div>

    <div id="end-modal" class="modal-overlay" style="display:none;">
      <div class="modal-title" id="modal-title">BIOSPHERE GENESIS</div>
      <p id="modal-desc" style="font-size:0.85rem; margin-bottom:12px; color:#d1fae5;"></p>
      <button class="btn-act" onclick="window.restartGame()" style="padding:10px 24px; font-size:0.9rem; font-weight:bold;">Simulate New Planet</button>
    </div>
  </div>

  <script src="logic.js"></script>
  <script>
    (function() {
      let state = null;
      const canvas = document.getElementById('game-canvas');
      const ctx = canvas ? canvas.getContext('2d') : null;

      function init() {
        state = createState(Date.now ? Date.now() : 1);
        render();
      }

      window.restartGame = function() {
        init();
      };

      window.executeAction = function(act) {
        if (!state || state.done) return;
        try {
          step(state, act);
          render();
        } catch (e) {
          console.error(e);
        }
      };

      function render() {
        if (!state) return;

        // HUD Updates
        const tEl = document.getElementById('hud-temp');
        if (tEl) tEl.textContent = state.temperature + '°C';

        const oEl = document.getElementById('hud-o2');
        if (oEl) oEl.textContent = state.oxygen + '%';

        const mEl = document.getElementById('hud-moist');
        if (mEl) mEl.textContent = state.moisture + '%';

        const sEl = document.getElementById('hud-stage');
        if (sEl) sEl.textContent = 'Stage ' + state.lifeStage;

        const epEl = document.getElementById('turn-counter');
        if (epEl) epEl.textContent = 'Epoch ' + state.epoch + ' (Energy: ' + state.energy + '/' + state.maxEnergy + ')';

        // Canvas Rendering
        if (ctx) {
          ctx.clearRect(0, 0, 460, 200);

          // Deep Space Starfield
          ctx.fillStyle = '#020617';
          ctx.fillRect(0, 0, 460, 200);

          ctx.fillStyle = '#ffffff';
          const stars = [[30, 20], [80, 50], [130, 15], [320, 30], [390, 60], [430, 20], [300, 180]];
          for (let i = 0; i < stars.length; i++) {
            ctx.fillRect(stars[i][0], stars[i][1], 2, 2);
          }

          // Planet Globe Graphic on Left
          const px = 100;
          const py = 100;
          const pr = 65;

          // Atmosphere Glow
          ctx.beginPath();
          ctx.arc(px, py, pr + 8, 0, Math.PI * 2);
          if (state.lifeStage >= 3) ctx.fillStyle = 'rgba(56, 189, 248, 0.35)';
          else if (state.lifeStage >= 1) ctx.fillStyle = 'rgba(52, 211, 153, 0.25)';
          else ctx.fillStyle = 'rgba(251, 146, 60, 0.2)';
          ctx.fill();

          // Planet Body
          const pGrad = ctx.createLinearGradient(px - pr, py - pr, px + pr, py + pr);
          if (state.lifeStage >= 3) {
            pGrad.addColorStop(0, '#38bdf8');
            pGrad.addColorStop(0.5, '#059669');
            pGrad.addColorStop(1, '#022c22');
          } else if (state.temperature < -10) {
            pGrad.addColorStop(0, '#e2e8f0');
            pGrad.addColorStop(0.5, '#64748b');
            pGrad.addColorStop(1, '#1e293b');
          } else {
            pGrad.addColorStop(0, '#ea580c');
            pGrad.addColorStop(0.5, '#7c2d12');
            pGrad.addColorStop(1, '#1c1917');
          }
          ctx.fillStyle = pGrad;
          ctx.beginPath();
          ctx.arc(px, py, pr, 0, Math.PI * 2);
          ctx.fill();

          // Right Side Gauges & Stats
          ctx.fillStyle = 'rgba(2, 44, 34, 0.8)';
          ctx.fillRect(200, 20, 240, 160);
          ctx.strokeStyle = '#10b981';
          ctx.lineWidth = 1;
          ctx.strokeRect(200, 20, 240, 160);

          ctx.font = 'bold 13px monospace';
          ctx.fillStyle = '#6ee7b7';
          ctx.fillText('PLANET: Aethel-Prime', 215, 42);

          ctx.font = '11px monospace';
          ctx.fillStyle = '#facc15';
          ctx.fillText('EVOLUTION: ' + LIFE_STAGE_NAMES[state.lifeStage], 215, 62);

          ctx.fillStyle = '#cbd5e1';
          ctx.fillText('Biomass: ' + state.biomass + ' / 100', 215, 82);
          ctx.fillText('CO2 Greenhouse: ' + state.co2 + '%', 215, 102);

          // Golden Zone Status Indicator
          const gz = isGoldenZone(state);
          ctx.fillStyle = gz ? '#34d399' : '#f87171';
          ctx.font = 'bold 11px monospace';
          ctx.fillText('Equilibrium: ' + (gz ? 'GOLDEN ZONE (' + state.stableEpochs + '/3)' : 'UNSTABLE'), 215, 126);

          ctx.font = '10px monospace';
          ctx.fillStyle = '#94a3b8';
          ctx.fillText('Target: 15-25°C | 18-24% O2 | 40-70% Moist', 215, 146);
        }

        // Log Rendering
        const logBox = document.getElementById('log-box');
        if (logBox) {
          let html = '';
          for (let i = 0; i < state.log.length; i++) {
            const line = state.log[i];
            let cls = 'log-line';
            if (line.includes('GENESIS') || line.includes('MILESTONE')) cls += ' log-win';
            else if (line.includes('fluctuating') || line.includes('elapsed')) cls += ' log-alert';
            else if (line.includes('Equilibrium') || line.includes('orchestrated')) cls += ' log-ev';
            html += '<div class="' + cls + '">' + escapeHtml(line) + '</div>';
          }
          logBox.innerHTML = html;
          logBox.scrollTop = logBox.scrollHeight;
        }

        // Actions Grid
        const actionsEl = document.getElementById('actions-grid');
        if (actionsEl) {
          const acts = legalActions(state);
          let html = '';
          for (let i = 0; i < acts.length; i++) {
            const act = acts[i];
            let cls = 'btn-act';
            if (act === 'action:deploy_comet_ice' || act === 'action:orbital_sunshade') cls += ' btn-ice';
            else if (act === 'action:ignite_thermal_vents') cls += ' btn-warm';
            else if (act.startsWith('action:seed_') || act === 'action:introduce_fauna') cls += ' btn-bio';
            else if (act === 'action:advance_epoch') cls += ' btn-epoch';

            html += '<button class="' + cls + '" onclick="window.executeAction(\'' + act + '\')">'
              + formatActionTitle(act)
              + '</button>';
          }
          actionsEl.innerHTML = html;
        }

        // End Game Modal
        const modal = document.getElementById('end-modal');
        if (modal) {
          if (state.done) {
            modal.style.display = 'flex';
            const mTitle = document.getElementById('modal-title');
            const mDesc = document.getElementById('modal-desc');

            if (state.victory) {
              if (mTitle) {
                mTitle.textContent = 'LIVING PARADISE STABILIZED!';
                mTitle.className = 'modal-title win-title';
              }
              if (mDesc) mDesc.textContent = 'Aethel-Prime is now a self-sustaining biosphere flourishing with life! Final Score: ' + state.score;
            } else {
              if (mTitle) {
                mTitle.textContent = 'SIMULATION CONCLUDED';
                mTitle.className = 'modal-title lose-title';
              }
              if (mDesc) mDesc.textContent = 'The planetary epoch thresholds elapsed before biospheric stabilization. Final Score: ' + state.score;
            }
          } else {
            modal.style.display = 'none';
          }
        }
      }

      function formatActionTitle(act) {
        if (act === 'action:deploy_comet_ice') return '☄️ Deploy Comet Ice (10e)';
        if (act === 'action:ignite_thermal_vents') return '🌋 Ignite Vents (10e)';
        if (act === 'action:orbital_sunshade') return '🛰️ Orbital Sunshade (10e)';
        if (act === 'action:seed_cyanobacteria') return '🦠 Seed Cyanobacteria (10e)';
        if (act === 'action:seed_flora') return '🌲 Cultivate Forests (10e)';
        if (act === 'action:introduce_fauna') return '🦌 Introduce Fauna (10e)';
        if (act === 'action:advance_epoch') return '⏩ ADVANCE PLANETARY EPOCH (Cycle)';
        return act;
      }

      function escapeHtml(str) {
        return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }

      window.addEventListener('keydown', function(e) {
        if (!state || state.done) return;
        const acts = legalActions(state);
        if (e.key >= '1' && e.key <= '9') {
          const idx = parseInt(e.key, 10) - 1;
          if (idx < acts.length) {
            window.executeAction(acts[idx]);
          }
        }
      });

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(function() {});
      }

      init();
    })();
  </script>
</body>
</html>
