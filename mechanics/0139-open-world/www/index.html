<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Wilds of Eldoria - Open World</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#10b981">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #022c22;
      color: #ecfdf5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 8px;
      overflow-x: hidden;
    }
    header {
      width: 100%;
      max-width: 480px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      padding: 6px 12px;
      background: #064e3b;
      border-radius: 8px;
      border: 1px solid #10b981;
    }
    h1 {
      font-size: 1rem;
      color: #6ee7b7;
      display: flex;
      align-items: center;
      gap: 6px;
      letter-spacing: 0.5px;
    }
    .hud {
      width: 100%;
      max-width: 480px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
      margin-bottom: 6px;
    }
    .hud-box {
      background: #064e3b;
      border: 1px solid #059669;
      border-radius: 6px;
      padding: 4px 6px;
      text-align: center;
      font-size: 0.72rem;
    }
    .hud-label {
      color: #a7f3d0;
      font-size: 0.62rem;
      text-transform: uppercase;
      margin-bottom: 2px;
    }
    .hud-val {
      font-weight: bold;
      color: #ffffff;
      font-size: 0.8rem;
    }
    .val-hp { color: #f87171; }
    .val-reg { color: #facc15; }
    .val-orbs { color: #38bdf8; }
    .val-sc { color: #4ade80; }

    #game-container {
      position: relative;
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    canvas {
      width: 100%;
      max-width: 460px;
      aspect-ratio: 16 / 7;
      background: #062b1a;
      border: 2px solid #10b981;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(16, 185, 129, 0.25);
      touch-action: none;
    }

    .log-box {
      width: 100%;
      max-width: 460px;
      background: #022c22;
      border: 1px solid #047857;
      border-radius: 6px;
      margin-top: 6px;
      padding: 6px 8px;
      height: 85px;
      overflow-y: auto;
      font-family: "Courier New", Courier, monospace;
      font-size: 0.72rem;
      color: #d1fae5;
    }
    .log-line { margin-bottom: 2px; }
    .log-alert { color: #f43f5e; font-weight: bold; }
    .log-trial { color: #38bdf8; }
    .log-win { color: #facc15; font-weight: bold; }

    .actions-grid {
      width: 100%;
      max-width: 460px;
      margin-top: 6px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 5px;
    }
    .btn-act {
      background: #064e3b;
      color: #ecfdf5;
      border: 1px solid #10b981;
      border-radius: 6px;
      padding: 8px 6px;
      font-size: 0.74rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.15s ease;
      text-align: center;
    }
    .btn-act:hover {
      background: #047857;
      border-color: #34d399;
    }
    .btn-act:active {
      transform: scale(0.97);
    }
    .btn-travel {
      background: #075985;
      border-color: #0284c7;
      color: #e0f2fe;
    }
    .btn-travel:hover { background: #0369a1; }
    .btn-shrine {
      background: #065f46;
      border-color: #34d399;
      color: #ecfdf5;
    }
    .btn-shrine:hover { background: #047857; }
    .btn-boss {
      background: #881337;
      border-color: #f43f5e;
      color: #ffe4e6;
      font-weight: bold;
    }
    .btn-boss:hover { background: #9f1239; }
    .btn-climax {
      background: #9d174d;
      border-color: #f43f5e;
      grid-column: span 2;
      font-weight: bold;
      font-size: 0.84rem;
      padding: 10px;
    }
    .btn-climax:hover { background: #be123c; }

    .modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(2, 44, 34, 0.94);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      padding: 16px;
      text-align: center;
      z-index: 10;
    }
    .modal-title {
      font-size: 1.4rem;
      font-weight: bold;
      margin-bottom: 8px;
    }
    .win-title { color: #facc15; text-shadow: 0 0 10px rgba(250, 204, 21, 0.5); }
    .lose-title { color: #f43f5e; }
  </style>
</head>
<body>

  <header>
    <h1>🗡️ Wilds of Eldoria</h1>
    <div style="font-size:0.75rem; color:#a7f3d0;" id="turn-counter">Turn: 0/150</div>
  </header>

  <div class="hud">
    <div class="hud-box">
      <div class="hud-label">Hearts</div>
      <div class="hud-val val-hp" id="hud-hp">100/100</div>
    </div>
    <div class="hud-box">
      <div class="hud-label">Region</div>
      <div class="hud-val val-reg" id="hud-reg">Plateau</div>
    </div>
    <div class="hud-box">
      <div class="hud-label">Orbs</div>
      <div class="hud-val val-orbs" id="hud-orbs">0 Orbs</div>
    </div>
    <div class="hud-box">
      <div class="hud-label">Weapon / Food</div>
      <div class="hud-val val-sc" id="hud-inv">Branch | 2f</div>
    </div>
  </div>

  <div id="game-container">
    <canvas id="game-canvas" width="460" height="200"></canvas>

    <div class="log-box" id="log-box"></div>

    <div class="actions-grid" id="actions-grid"></div>

    <div id="end-modal" class="modal-overlay" style="display:none;">
      <div class="modal-title" id="modal-title">CHAMPION OF ELDORIA</div>
      <p id="modal-desc" style="font-size:0.85rem; margin-bottom:12px; color:#d1fae5;"></p>
      <button class="btn-act" onclick="window.restartGame()" style="padding:10px 24px; font-size:0.9rem; font-weight:bold;">New Quest</button>
    </div>
  </div>

  <script src="logic.js"></script>
  <script>
    (function() {
      let state = null;
      const canvas = document.getElementById('game-canvas');
      const ctx = canvas ? canvas.getContext('2d') : null;

      function init() {
        state = createState(Date.now ? Date.now() : 1);
        render();
      }

      window.restartGame = function() {
        init();
      };

      window.executeAction = function(act) {
        if (!state || state.done) return;
        try {
          step(state, act);
          render();
        } catch (e) {
          console.error(e);
        }
      };

      function render() {
        if (!state) return;

        // HUD Updates
        const hpEl = document.getElementById('hud-hp');
        if (hpEl) hpEl.textContent = state.hp + '/' + state.maxHp;

        const regEl = document.getElementById('hud-reg');
        if (regEl) regEl.textContent = formatRegionShort(state.region);

        const orbEl = document.getElementById('hud-orbs');
        if (orbEl) orbEl.textContent = state.spiritOrbs + ' Orbs';

        const invEl = document.getElementById('hud-inv');
        if (invEl) {
          const wpnName = WEAPONS[state.weaponTier].name.split(' ')[0];
          invEl.textContent = wpnName + ' | ' + state.meals + 'm';
        }

        const tEl = document.getElementById('turn-counter');
        if (tEl) tEl.textContent = 'Turn: ' + state.turns + '/' + state.maxTurns;

        // Canvas Rendering
        if (ctx) {
          ctx.clearRect(0, 0, 460, 200);

          // Regional Panorama Background
          const grad = ctx.createLinearGradient(0, 0, 0, 200);
          if (state.region === 'plateau') {
            grad.addColorStop(0, '#0284c7');
            grad.addColorStop(0.6, '#38bdf8');
            grad.addColorStop(1, '#059669');
          } else if (state.region === 'forest') {
            grad.addColorStop(0, '#064e3b');
            grad.addColorStop(0.6, '#065f46');
            grad.addColorStop(1, '#022c22');
          } else if (state.region === 'canyon') {
            grad.addColorStop(0, '#b45309');
            grad.addColorStop(0.6, '#d97706');
            grad.addColorStop(1, '#78350f');
          } else {
            // Storm Peaks
            grad.addColorStop(0, '#1e1b4b');
            grad.addColorStop(0.6, '#312e81');
            grad.addColorStop(1, '#0f172a');
          }
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, 460, 200);

          // Mountains Silhouette
          ctx.fillStyle = 'rgba(2, 44, 34, 0.7)';
          ctx.beginPath();
          ctx.moveTo(0, 200);
          ctx.lineTo(90, 90);
          ctx.lineTo(190, 140);
          ctx.lineTo(290, 70);
          ctx.lineTo(390, 120);
          ctx.lineTo(460, 80);
          ctx.lineTo(460, 200);
          ctx.fill();

          // Regional Banner
          ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
          ctx.fillRect(10, 10, 440, 36);
          ctx.strokeStyle = '#10b981';
          ctx.lineWidth = 1;
          ctx.strokeRect(10, 10, 440, 36);

          ctx.font = 'bold 14px sans-serif';
          ctx.fillStyle = '#6ee7b7';
          ctx.fillText('REALM: ' + REGION_NAMES[state.region].toUpperCase(), 22, 33);

          // Boss encounter or Regional Prop
          if (state.boss) {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
            ctx.fillRect(30, 60, 400, 110);
            ctx.strokeStyle = '#f43f5e';
            ctx.lineWidth = 2;
            ctx.strokeRect(30, 60, 400, 110);

            ctx.font = 'bold 15px sans-serif';
            ctx.fillStyle = '#f43f5e';
            ctx.fillText('ZEPHYROS THE STORM SOVEREIGN [TEMPEST BOSS]', 45, 88);

            // Boss HP Bar
            const barW = 370;
            const ratio = Math.max(0, state.boss.hp / state.boss.maxHp);
            ctx.fillStyle = '#1e1b4b';
            ctx.fillRect(45, 105, barW, 16);
            ctx.fillStyle = state.bossStunned ? '#facc15' : '#ef4444';
            ctx.fillRect(45, 105, Math.floor(barW * ratio), 16);
            ctx.strokeStyle = '#94a3b8';
            ctx.lineWidth = 1;
            ctx.strokeRect(45, 105, barW, 16);

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 11px monospace';
            ctx.fillText('HP: ' + state.boss.hp + ' / ' + state.boss.maxHp + (state.bossStunned ? ' [STUNNED!]' : ''), 50, 118);

            ctx.fillStyle = '#cbd5e1';
            ctx.font = '11px sans-serif';
            ctx.fillText('Weapon: ' + WEAPONS[state.weaponTier].name + ' (+' + WEAPONS[state.weaponTier].atk + ' ATK)', 45, 145);
          } else {
            // Peace exploration card
            ctx.fillStyle = 'rgba(2, 44, 34, 0.75)';
            ctx.fillRect(30, 60, 400, 110);
            ctx.strokeStyle = '#059669';
            ctx.lineWidth = 1;
            ctx.strokeRect(30, 60, 400, 110);

            ctx.font = 'bold 13px sans-serif';
            ctx.fillStyle = '#a7f3d0';
            const towerStatus = state.towers[state.region] ? 'Tower Synchronized' : 'Tower Unscaled';
            ctx.fillText('STATUS: ' + towerStatus + ' | ' + WEAPONS[state.weaponTier].name, 45, 88);

            ctx.font = '11px monospace';
            ctx.fillStyle = '#ecfdf5';
            if (state.region === 'plateau') {
              ctx.fillText('The Great Plateau rises above the realm.', 45, 110);
              ctx.fillText('Offer Spirit Orbs to the Temple of Time statue.', 45, 130);
            } else if (state.region === 'forest') {
              ctx.fillText('Lost Woods shroud the ancient Sunforged Blade.', 45, 110);
              ctx.fillText('Requires 140 Max HP to survive the divine trial.', 45, 130);
            } else if (state.region === 'canyon') {
              ctx.fillText('Spicy peppers flourish among sunny rock formations.', 45, 110);
              ctx.fillText('Brew Cold Elixir before daring the Storm Peaks.', 45, 130);
            } else {
              ctx.fillText('Sub-zero blizzards whip around the peak.', 45, 110);
              ctx.fillText('Zephyros circles in the thunderclouds above.', 45, 130);
            }
          }
        }

        // Log Rendering
        const logBox = document.getElementById('log-box');
        if (logBox) {
          let html = '';
          for (let i = 0; i < state.log.length; i++) {
            const line = state.log[i];
            let cls = 'log-line';
            if (line.includes('VICTORY') || line.includes('DIVINE TRIAL')) cls += ' log-win';
            else if (line.includes('blasted') || line.includes('burned') || line.includes('fallen')) cls += ' log-alert';
            else if (line.includes('Spirit Orb') || line.includes('Synchronized')) cls += ' log-trial';
            html += '<div class="' + cls + '">' + escapeHtml(line) + '</div>';
          }
          logBox.innerHTML = html;
          logBox.scrollTop = logBox.scrollHeight;
        }

        // Actions Grid
        const actionsEl = document.getElementById('actions-grid');
        if (actionsEl) {
          const acts = legalActions(state);
          let html = '';
          for (let i = 0; i < acts.length; i++) {
            const act = acts[i];
            let cls = 'btn-act';
            if (act.startsWith('travel:') || act.startsWith('fast_travel:')) cls += ' btn-travel';
            else if (act.startsWith('explore_shrine:')) cls += ' btn-shrine';
            else if (act.startsWith('combat:') || act === 'action:challenge_boss') cls += ' btn-boss';
            else if (act === 'action:draw_sunforged_blade') cls += ' btn-climax';

            html += '<button class="' + cls + '" onclick="window.executeAction(\'' + act + '\')">'
              + formatActionTitle(act)
              + '</button>';
          }
          actionsEl.innerHTML = html;
        }

        // End Game Modal
        const modal = document.getElementById('end-modal');
        if (modal) {
          if (state.done) {
            modal.style.display = 'flex';
            const mTitle = document.getElementById('modal-title');
            const mDesc = document.getElementById('modal-desc');

            if (state.victory) {
              if (mTitle) {
                mTitle.textContent = 'ZEPHYROS VANQUISHED!';
                mTitle.className = 'modal-title win-title';
              }
              if (mDesc) mDesc.textContent = 'The eternal storm dissipates into golden twilight. Eldoria is liberated! Final Score: ' + state.score;
            } else {
              if (mTitle) {
                mTitle.textContent = 'CHAMPION DEFEATED';
                mTitle.className = 'modal-title lose-title';
              }
              if (mDesc) mDesc.textContent = 'The tempest was unrelenting. Final Score: ' + state.score;
            }
          } else {
            modal.style.display = 'none';
          }
        }
      }

      function formatRegionShort(r) {
        if (r === 'plateau') return 'Plateau';
        if (r === 'forest') return 'Forest';
        if (r === 'canyon') return 'Canyon';
        if (r === 'peaks') return 'Peaks';
        return r;
      }

      function formatActionTitle(act) {
        if (act === 'travel:plateau') return '🚶 Walk to Plateau';
        if (act === 'travel:forest') return '🚶 Walk to Forest';
        if (act === 'travel:canyon') return '🚶 Walk to Canyon';
        if (act === 'travel:peaks') return '🚶 Climb to Peaks';
        if (act === 'fast_travel:plateau') return '⚡ Fast Travel: Plateau';
        if (act === 'fast_travel:forest') return '⚡ Fast Travel: Forest';
        if (act === 'fast_travel:canyon') return '⚡ Fast Travel: Canyon';
        if (act === 'fast_travel:peaks') return '⚡ Fast Travel: Peaks';
        if (act === 'action:activate_tower') return '🗼 Synchronize Tower';
        if (act.startsWith('explore_shrine:')) return '⛩️ Conquer Trial Shrine';
        if (act === 'action:forage_gather') return '🍎 Forage Wild Food';
        if (act === 'action:cook_meal') return '🍲 Cook Hearty Feast';
        if (act === 'action:brew_cold_elixir') return '🧪 Brew Warm Elixir';
        if (act === 'upgrade:health') return '❤️ Goddess Blessing (+20 HP)';
        if (act === 'upgrade:stamina') return '🟢 Goddess Blessing (+20 Stamina)';
        if (act === 'action:scavenge_weapon') return '⚔️ Scavenge Broadsword';
        if (act === 'action:draw_sunforged_blade') return '🗡️ DRAW SUNFORGED MASTER BLADE';
        if (act === 'action:challenge_boss') return '🐉 Challenge Zephyros';
        if (act === 'combat:strike') return '⚔️ Sword Slash';
        if (act === 'combat:shoot_bow') return '🏹 Precision Arrow';
        if (act === 'combat:parry') return '🛡️ Shield Parry';
        if (act === 'combat:eat_meal') return '🍖 Eat Meal (+40 HP)';
        if (act === 'combat:flee') return '🏃 Glider Retreat';
        return act;
      }

      function escapeHtml(str) {
        return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }

      window.addEventListener('keydown', function(e) {
        if (!state || state.done) return;
        const acts = legalActions(state);
        if (e.key >= '1' && e.key <= '9') {
          const idx = parseInt(e.key, 10) - 1;
          if (idx < acts.length) {
            window.executeAction(acts[idx]);
          }
        }
      });

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(function() {});
      }

      init();
    })();
  </script>
</body>
</html>
