<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Speed Chrono - Time Attack</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #09090b;
      color: #fafafa;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
      padding: 8px;
    }
    header {
      width: 100%;
      max-width: 640px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 12px;
      background: #18181b;
      border: 1px solid #e11d48;
      border-radius: 8px;
      margin-bottom: 6px;
    }
    h1 {
      font-size: 1.05rem;
      font-weight: 700;
      color: #fb7185;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .badge {
      font-size: 0.72rem;
      padding: 2px 8px;
      border-radius: 4px;
      background: #be123c;
      color: #fff1f2;
      font-weight: 600;
    }
    #game-container {
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    canvas {
      width: 100%;
      height: auto;
      aspect-ratio: 4/3;
      background: #020617;
      border: 2px solid #e11d48;
      border-radius: 8px;
      box-shadow: 0 4px 25px rgba(225, 29, 72, 0.25);
    }
    .vitals-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      width: 100%;
    }
    .vital-card {
      background: #18181b;
      border: 1px solid #3f3f46;
      border-radius: 6px;
      padding: 6px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .vital-title {
      font-size: 0.65rem;
      color: #a1a1aa;
      text-transform: uppercase;
      font-weight: bold;
    }
    .vital-val {
      font-size: 0.95rem;
      font-weight: bold;
      color: #fff;
    }
    .meter-bar {
      height: 4px;
      background: #09090b;
      border-radius: 2px;
      overflow: hidden;
      margin-top: 2px;
    }
    .meter-fill {
      height: 100%;
      background: #e11d48;
      transition: width 0.2s ease;
    }
    #message-box {
      background: #18181b;
      border-left: 4px solid #e11d48;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 0.8rem;
      min-height: 38px;
      display: flex;
      align-items: center;
      color: #fda4af;
    }
    #actions-panel {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      width: 100%;
    }
    .btn {
      background: #18181b;
      border: 1px solid #3f3f46;
      color: #fff;
      padding: 10px 8px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      transition: all 0.1s ease;
    }
    .btn:active {
      transform: scale(0.97);
      filter: brightness(1.2);
    }
    .btn-throttle {
      background: #15803d;
      border-color: #22c55e;
      color: #f0fdf4;
    }
    .btn-brake {
      background: #991b1b;
      border-color: #ef4444;
      color: #fef2f2;
    }
    .btn-steer {
      background: #1e3a8a;
      border-color: #3b82f6;
      color: #eff6ff;
    }
    .btn-boost {
      background: #0369a1;
      border-color: #38bdf8;
      color: #f0f9ff;
    }
    .top-controls {
      display: flex;
      gap: 6px;
    }
    .ctrl-btn {
      background: #18181b;
      border: 1px solid #e11d48;
      color: #fb7185;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      cursor: pointer;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <header>
    <h1>Speed Chrono</h1>
    <div class="top-controls">
      <button class="ctrl-btn" id="bot-toggle-btn" onclick="window.toggleBot()">BOT: OFF</button>
      <button class="ctrl-btn" onclick="window.restartGame()">RESTART</button>
      <span class="badge" id="turn-badge">TURN 0/80</span>
    </div>
  </header>

  <div id="game-container">
    <canvas id="gameCanvas" width="640" height="480"></canvas>

    <div class="vitals-grid">
      <div class="vital-card">
        <span class="vital-title">Lap Chrono</span>
        <span class="vital-val" id="val-time">0.0s / 65.0s</span>
        <div class="meter-bar"><div class="meter-fill" id="fill-time" style="width:0%"></div></div>
      </div>
      <div class="vital-card">
        <span class="vital-title">Telemetry Speed</span>
        <span class="vital-val" id="val-speed">90 km/h</span>
        <div class="meter-bar"><div class="meter-fill" id="fill-speed" style="width:28%;background:#38bdf8"></div></div>
      </div>
      <div class="vital-card">
        <span class="vital-title">Tire Heat & Line</span>
        <span class="vital-val" id="val-tires">60°C | Apex 0</span>
        <div class="meter-bar"><div class="meter-fill" id="fill-tires" style="width:60%;background:#eab308"></div></div>
      </div>
      <div class="vital-card">
        <span class="vital-title">KERS Battery Boost</span>
        <span class="vital-val" id="val-boost">75%</span>
        <div class="meter-bar"><div class="meter-fill" id="fill-boost" style="width:75%;background:#06b6d4"></div></div>
      </div>
    </div>

    <div id="message-box">Hypercar launching out of pit lane. Target Gold Lap: 65.0s!</div>

    <div id="actions-panel"></div>
  </div>

  <script src="logic.js"></script>
  <script>
    let state = createState(Date.now ? Date.now() : 12345);
    let botRunning = false;
    let botInterval = null;

    // Web Audio Synthesizer
    const audioCtx = (typeof AudioContext !== 'undefined' || typeof webkitAudioContext !== 'undefined')
      ? new (window.AudioContext || window.webkitAudioContext)()
      : null;

    function playSfx(type) {
      if (!audioCtx) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      const t = audioCtx.currentTime;

      if (type === 'engine') {
        const freq = 120 + (state.speed / 320) * 350;
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(freq, t);
        osc.frequency.linearRampToValueAtTime(freq * 1.15, t + 0.15);
        gain.gain.setValueAtTime(0.18, t);
        gain.gain.linearRampToValueAtTime(0.01, t + 0.15);
        osc.start(t);
        osc.stop(t + 0.15);
      } else if (type === 'brake') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(450, t);
        osc.frequency.linearRampToValueAtTime(180, t + 0.2);
        gain.gain.setValueAtTime(0.2, t);
        gain.gain.linearRampToValueAtTime(0.01, t + 0.2);
        osc.start(t);
        osc.stop(t + 0.2);
      } else if (type === 'boost') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(220, t);
        osc.frequency.exponentialRampToValueAtTime(880, t + 0.25);
        gain.gain.setValueAtTime(0.25, t);
        gain.gain.linearRampToValueAtTime(0.01, t + 0.25);
        osc.start(t);
        osc.stop(t + 0.25);
      } else if (type === 'apex') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(659, t);
        osc.frequency.setValueAtTime(1046, t + 0.08);
        gain.gain.setValueAtTime(0.2, t);
        gain.gain.linearRampToValueAtTime(0.01, t + 0.2);
        osc.start(t);
        osc.stop(t + 0.2);
      }
    }

    function render() {
      const curSector = getCurrentSector(state.distance);
      const secondsElapsed = (state.timeElapsed / 10).toFixed(1);

      // Vitals UI
      document.getElementById('turn-badge').textContent = 'TURN ' + state.turns + '/' + state.maxTurns;
      document.getElementById('val-time').textContent = secondsElapsed + 's / 65.0s (S' + (SECTORS.indexOf(curSector) + 1) + ')';
      document.getElementById('fill-time').style.width = Math.min(100, (state.timeElapsed / GOLD_TARGET_TIME) * 100) + '%';
      document.getElementById('fill-time').style.background = state.timeElapsed > GOLD_TARGET_TIME ? '#ef4444' : '#e11d48';

      document.getElementById('val-speed').textContent = state.speed + ' km/h';
      document.getElementById('fill-speed').style.width = Math.min(100, (state.speed / 320) * 100) + '%';

      document.getElementById('val-tires').textContent = state.tireHeat + '°C | Line ' + state.line;
      document.getElementById('fill-tires').style.width = Math.min(100, state.tireHeat) + '%';
      document.getElementById('fill-tires').style.background = state.tireHeat > 85 ? '#ef4444' : '#eab308';

      document.getElementById('val-boost').textContent = state.boost + '%';
      document.getElementById('fill-boost').style.width = state.boost + '%';

      document.getElementById('message-box').textContent = state.gameMessage;

      // Canvas Rendering
      const canvas = document.getElementById('gameCanvas');
      if (!canvas || !canvas.getContext) return;
      const ctx = canvas.getContext('2d');
      const w = canvas.width;
      const h = canvas.height;
      const cx = w / 2;
      const cy = h / 2;

      // 1. Circuit Asphalt & Runoff
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, w, h);

      // Grass / gravel runoff borders
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(0, 0, 60, h);
      ctx.fillRect(w - 60, 0, 60, h);

      // Red and White Racing Curbs
      const curbW = 16;
      ctx.fillStyle = '#e11d48';
      for (let y = 0; y < h; y += 32) {
        ctx.fillRect(60, y, curbW, 16);
        ctx.fillRect(w - 60 - curbW, y + 16, curbW, 16);
      }
      ctx.fillStyle = '#f8fafc';
      for (let y = 16; y < h; y += 32) {
        ctx.fillRect(60, y, curbW, 16);
        ctx.fillRect(w - 60 - curbW, y - 16, curbW, 16);
      }

      // Track Centerline
      ctx.strokeStyle = 'rgba(248, 250, 252, 0.3)';
      ctx.setLineDash([20, 20]);
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(cx, 0);
      ctx.lineTo(cx, h);
      ctx.stroke();
      ctx.setLineDash([]);

      // 2. Sector Ideal Racing Line Ghost Arc
      const trackPlayW = w - 160;
      const idealX = cx + (curSector.idealLine / 100) * (trackPlayW / 2);
      ctx.strokeStyle = 'rgba(56, 189, 248, 0.4)';
      ctx.lineWidth = 8;
      ctx.beginPath();
      ctx.moveTo(idealX, 0);
      ctx.lineTo(idealX, h);
      ctx.stroke();

      ctx.fillStyle = '#38bdf8';
      ctx.font = 'bold 11px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('OPTIMAL APEX LINE', idealX, 40);

      // Sector Header Banner on Canvas
      ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
      ctx.roundRect(cx - 150, 10, 300, 32, 6);
      ctx.fill();
      ctx.strokeStyle = '#e11d48';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 13px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(curSector.name + ' (' + state.distance + 'm / ' + CIRCUIT_LENGTH + 'm)', cx, 31);

      // 3. Electric Hypercar Chassis
      const carX = cx + (state.line / 100) * (trackPlayW / 2);
      const carY = h * 0.72;

      ctx.save();
      ctx.translate(carX, carY);

      // Underglow LED neon
      ctx.fillStyle = 'rgba(225, 29, 72, 0.35)';
      ctx.beginPath();
      ctx.ellipse(0, 5, 45, 65, 0, 0, Math.PI * 2);
      ctx.fill();

      // Carbon aerokit chassis
      ctx.fillStyle = '#1e1b4b';
      ctx.beginPath();
      ctx.roundRect(-26, -55, 52, 110, 8);
      ctx.fill();
      ctx.strokeStyle = '#e11d48';
      ctx.lineWidth = 3;
      ctx.stroke();

      // Cockpit cockpit canopy
      ctx.fillStyle = '#0284c7';
      ctx.beginPath();
      ctx.ellipse(0, -10, 14, 28, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 2;
      ctx.stroke();

      // Rear Spoiler Wing
      ctx.fillStyle = '#e11d48';
      ctx.fillRect(-36, 42, 72, 10);

      // High-performance tires with heat glow
      const tireColor = state.tireHeat > 85 ? '#ef4444' : (state.tireHeat >= 50 ? '#22c55e' : '#38bdf8');
      ctx.fillStyle = tireColor;
      // Front Left / Right
      ctx.fillRect(-34, -48, 8, 22);
      ctx.fillRect(26, -48, 8, 22);
      // Rear Left / Right
      ctx.fillRect(-34, 25, 8, 24);
      ctx.fillRect(26, 25, 8, 24);

      ctx.restore();

      // Checkpoint Delta Telemetry HUD Overlay
      const ghostDelta = ((state.timeElapsed - curSector.ghostSplit) / 10);
      const deltaText = (ghostDelta <= 0 ? '-' : '+') + Math.abs(ghostDelta).toFixed(1) + 's';
      ctx.fillStyle = ghostDelta <= 0 ? '#22c55e' : '#ef4444';
      ctx.font = 'bold 20px monospace';
      ctx.textAlign = 'right';
      ctx.fillText(deltaText, w - 80, 42);

      // Game Over Screen Overlay
      if (isOver(state)) {
        ctx.fillStyle = state.victory ? 'rgba(6, 78, 59, 0.92)' : 'rgba(69, 10, 10, 0.92)';
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 24px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(state.victory ? 'GOLD LAP RECORD CRUSHED!' : 'CIRCUIT TRIAL TERMINATED', cx, cy - 20);
        ctx.font = '14px sans-serif';
        ctx.fillText('Chrono Performance Rating: ' + score(state).toLocaleString() + ' pts', cx, cy + 15);
      }

      updateActions();
    }

    function updateActions() {
      const panel = document.getElementById('actions-panel');
      if (isOver(state)) {
        panel.innerHTML = '<button class="btn btn-throttle" onclick="window.restartGame()">NEW LAP TIME TRIAL</button>';
        return;
      }

      const actions = legalActions(state);
      let html = '';

      for (const act of actions) {
        let cls = 'btn';
        let label = act;
        let sub = '';

        if (act === 'action:throttle_accelerate') {
          cls += ' btn-throttle';
          label = '⚡ Full Throttle';
          sub = '+35 km/h Acceleration';
        } else if (act === 'action:apex_brake') {
          cls += ' btn-brake';
          label = '🛑 Trail-Braking';
          sub = '-50 km/h Decel & Line Trim';
        } else if (act === 'action:steer_inside_curb') {
          cls += ' btn-steer';
          label = '◀ Cut Inside Curb';
          sub = 'Steer toward Apex';
        } else if (act === 'action:steer_outside_line') {
          cls += ' btn-steer';
          label = '▶ Drift Outside';
          sub = 'Wide Corner Exit Setup';
        } else if (act === 'action:boost_overdrive') {
          cls += ' btn-boost';
          label = '🚀 KERS Boost Surge';
          sub = '+55 km/h Blast (-25% Bat)';
        } else if (act === 'action:maintain_coasting') {
          cls += ' btn-steer';
          label = '⚖️ Smooth Coasting';
          sub = 'Cool Tires & Maintain Flow';
        }

        html += '<button class="' + cls + '" onclick="window.triggerAction(\'' + act + '\')"><span>' + label + '</span>' + (sub ? '<span style="font-size:0.62rem;opacity:0.8;">' + sub + '</span>' : '') + '</button>';
      }

      panel.innerHTML = html;
    }

    window.triggerAction = function(act) {
      if (isOver(state)) return;
      if (act.includes('throttle')) playSfx('engine');
      else if (act.includes('brake')) playSfx('brake');
      else if (act.includes('boost')) playSfx('boost');

      const oldApex = state.perfectApexCount;
      step(state, act);

      if (state.perfectApexCount > oldApex) playSfx('apex');
      render();
    };

    window.restartGame = function() {
      state = createState(Date.now ? Date.now() : 12345);
      render();
    };

    window.toggleBot = function() {
      botRunning = !botRunning;
      const btn = document.getElementById('bot-toggle-btn');
      if (btn) {
        btn.textContent = botRunning ? 'BOT: ON' : 'BOT: OFF';
        btn.style.background = botRunning ? '#be123c' : '#18181b';
      }

      if (botRunning) {
        botInterval = setInterval(() => {
          if (isOver(state)) {
            state = createState(Date.now ? Date.now() : 9999);
            render();
            return;
          }
          const acts = legalActions(state);
          if (acts.length > 0) {
            let choice = acts[0];
            const curSector = getCurrentSector(state.distance);

            // Precision autopilot
            if (state.speed < curSector.targetSpeed - 30) {
              if (state.boost >= 25 && acts.includes('action:boost_overdrive')) choice = 'action:boost_overdrive';
              else if (acts.includes('action:throttle_accelerate')) choice = 'action:throttle_accelerate';
            } else if (state.speed > curSector.targetSpeed + 40 && acts.includes('action:apex_brake')) {
              choice = 'action:apex_brake';
            } else if (state.line > curSector.idealLine + 15 && acts.includes('action:steer_inside_curb')) {
              choice = 'action:steer_inside_curb';
            } else if (state.line < curSector.idealLine - 15 && acts.includes('action:steer_outside_line')) {
              choice = 'action:steer_outside_line';
            } else if (acts.includes('action:throttle_accelerate')) {
              choice = 'action:throttle_accelerate';
            }

            window.triggerAction(choice);
          }
        }, 250);
      } else {
        clearInterval(botInterval);
      }
    };

    render();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
