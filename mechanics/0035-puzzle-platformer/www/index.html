<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#070c16">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>Portal Shift</title>
<style>
  html, body { margin: 0; height: 100%; background: #070c16; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; margin: 0 auto; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="logic.js"></script>
<script>
const logic = window.PortalShift || window.GameLogic;
const { DEFAULT_LEVELS, createState, legalActions, step, isOver, score } = logic;

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const W = 360;
const H = 640;

let scale = 1;
function resize() {
  scale = Math.min(innerWidth / W, innerHeight / H);
  const dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.style.width = W * scale + 'px';
  canvas.style.height = H * scale + 'px';
  canvas.width = Math.round(W * scale * dpr);
  canvas.height = Math.round(H * scale * dpr);
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
}
addEventListener('resize', resize);
resize();

let best = 0;
try { best = +localStorage.getItem('goe-0035-best') || 0; } catch (e) {}

let currentLevel = 0;
let totalScore = 0;
let state = createState(1, { levelIndex: 0 });
let visPlayer = { x: state.player.x, y: state.player.y, hop: 0, facing: 1 };
let visCrates = state.crates.map((c) => ({ x: c.x, y: c.y }));
let animTime = 0;
let overAt = 0;
let particles = [];
let popups = [];

const keys = {};
let touchDir = 0;
let activeBtn = '';
let activePointer = null;
let dragStart = null;
let holdTimer = 0;

const BTNS = [
  { id: 'prev', x: 14, y: 74, w: 56, h: 28, label: '◀ LVL' },
  { id: 'next', x: 222, y: 74, w: 56, h: 28, label: 'LVL ▶' },
  { id: 'reset', x: 286, y: 74, w: 60, h: 28, label: '↺ RST' },
  { id: 'left', x: 18, y: 506, w: 76, h: 68, label: '◀' },
  { id: 'right', x: 102, y: 506, w: 76, h: 68, label: '▶' },
  { id: 'vault_l', x: 190, y: 506, w: 74, h: 68, label: '↖ LEAP' },
  { id: 'vault_r', x: 272, y: 506, w: 74, h: 68, label: 'LEAP ↗' },
  { id: 'smart_jump', x: 190, y: 444, w: 156, h: 52, label: '▲ SMART VAULT' },
  { id: 'reset_big', x: 18, y: 444, w: 160, h: 52, label: '↺ RESET CHAMBER' }
];

function rrect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function getLayout() {
  const gw = state.width;
  const gh = state.height;
  const tile = Math.min(36, Math.floor(332 / gw), Math.floor(260 / gh));
  const ox = Math.round((W - gw * tile) / 2);
  const oy = Math.round(120 + (270 - gh * tile) / 2);
  return { tile, ox, oy, gw, gh };
}

function addBurst(gx, gy, color, count) {
  const { tile, ox, oy } = getLayout();
  const px = ox + (gx + 0.5) * tile;
  const py = oy + (gy + 0.5) * tile;
  for (let i = 0; i < count; i++) {
    const a = (Math.PI * 2 * i) / count + (i % 3) * 0.25;
    const sp = 30 + (i % 4) * 20;
    particles.push({ x: px, y: py, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 15, color, life: 0.45 });
  }
}

function loadLevel(idx) {
  currentLevel = (idx + DEFAULT_LEVELS.length) % DEFAULT_LEVELS.length;
  state = createState(1, { levelIndex: currentLevel });
  visPlayer = { x: state.player.x, y: state.player.y, hop: 0, facing: 1 };
  visCrates = state.crates.map((c) => ({ x: c.x, y: c.y }));
  overAt = 0;
  touchDir = 0;
  activeBtn = '';
  holdTimer = 0;
}

function triggerAction(act) {
  if (isOver(state)) {
    if (performance.now() - overAt > 300) {
      if (state.won) loadLevel(currentLevel + 1);
      else loadLevel(currentLevel);
    }
    return false;
  }

  if (act === 'L' || act === 'J') visPlayer.facing = -1;
  if (act === 'R' || act === 'K') visPlayer.facing = 1;

  const legal = legalActions(state);
  if (!legal.includes(act)) return false;

  const wasOpen = state.switches.length === 0 || state.switches.every((s) =>
    state.crates.some((c) => c.x === s.x && c.y === s.y) || (state.player.x === s.x && state.player.y === s.y)
  );

  if (act === 'J' || act === 'K') {
    visPlayer.hop = 1.0;
    addBurst(state.player.x, state.player.y, '#38bdf8', 6);
  }

  const res = step(state, act);

  const nowOpen = state.switches.length === 0 || state.switches.every((s) =>
    state.crates.some((c) => c.x === s.x && c.y === s.y) || (state.player.x === s.x && state.player.y === s.y)
  );

  if (!wasOpen && nowOpen && state.doors.length > 0) {
    for (const d of state.doors) addBurst(d.x, d.y, '#4ade80', 10);
    const { tile, ox, oy } = getLayout();
    popups.push({ x: ox + (state.doors[0].x + 0.5) * tile, y: oy + state.doors[0].y * tile, text: 'GATE OPEN!', color: '#4ade80', life: 0.9 });
  }

  if (res.done) {
    overAt = performance.now();
    if (state.won) {
      const gained = score(state);
      totalScore += gained;
      if (totalScore > best) {
        best = totalScore;
        try { localStorage.setItem('goe-0035-best', best); } catch (e) {}
      }
      addBurst(state.exit.x, state.exit.y, '#38bdf8', 18);
      popups.push({ x: W / 2, y: 155, text: `+${gained} PTS!`, color: '#38bdf8', life: 1.1 });
    }
  }
  return true;
}

function smartVault() {
  const wantLeft = keys['ArrowLeft'] || keys['a'] || keys['A'] || touchDir < 0;
  const wantRight = keys['ArrowRight'] || keys['d'] || keys['D'] || touchDir > 0;
  const pref = wantLeft ? 'J' : wantRight ? 'K' : (visPlayer.facing < 0 ? 'J' : 'K');
  const alt = pref === 'J' ? 'K' : 'J';
  const legal = legalActions(state);
  if (legal.includes(pref)) return triggerAction(pref);
  if (legal.includes(alt)) return triggerAction(alt);
  return false;
}

function toLogical(e) {
  const rect = canvas.getBoundingClientRect();
  return { x: (e.clientX - rect.left) / scale, y: (e.clientY - rect.top) / scale };
}

function hitBtn(p) {
  for (const b of BTNS) {
    if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) return b.id;
  }
  return '';
}

canvas.addEventListener('pointerdown', (e) => {
  const p = toLogical(e);
  if (isOver(state)) {
    if (performance.now() - overAt > 300) {
      if (state.won) loadLevel(currentLevel + 1);
      else loadLevel(currentLevel);
    }
    return;
  }

  canvas.setPointerCapture(e.pointerId);
  activePointer = e.pointerId;
  const bid = hitBtn(p);
  activeBtn = bid;

  if (bid === 'prev') { loadLevel(currentLevel - 1); return; }
  if (bid === 'next') { loadLevel(currentLevel + 1); return; }
  if (bid === 'reset' || bid === 'reset_big') { loadLevel(currentLevel); return; }
  if (bid === 'left') { touchDir = -1; triggerAction('L'); holdTimer = 0.17; return; }
  if (bid === 'right') { touchDir = 1; triggerAction('R'); holdTimer = 0.17; return; }
  if (bid === 'vault_l') { triggerAction('J'); return; }
  if (bid === 'vault_r') { triggerAction('K'); return; }
  if (bid === 'smart_jump') { smartVault(); return; }

  // Direct touch / swipe inside the puzzle chamber
  dragStart = { x: p.x, y: p.y, acted: false };
  const { tile, ox, oy } = getLayout();
  const pxScreen = ox + (visPlayer.x + 0.5) * tile;
  const pyScreen = oy + (visPlayer.y + 0.5) * tile;
  const dx = p.x - pxScreen;
  const dy = p.y - pyScreen;

  if (dy < -tile * 0.45) {
    dragStart.acted = true;
    triggerAction(dx < 0 ? 'J' : 'K');
  } else if (Math.abs(dx) > tile * 0.35) {
    touchDir = dx < 0 ? -1 : 1;
    dragStart.acted = true;
    triggerAction(dx < 0 ? 'L' : 'R');
    holdTimer = 0.17;
  }
});

canvas.addEventListener('pointermove', (e) => {
  if (activePointer !== e.pointerId || isOver(state)) return;
  const p = toLogical(e);
  const bid = hitBtn(p);
  if (bid === 'left') { activeBtn = 'left'; touchDir = -1; return; }
  if (bid === 'right') { activeBtn = 'right'; touchDir = 1; return; }
  if (dragStart && !dragStart.acted) {
    const dx = p.x - dragStart.x;
    const dy = p.y - dragStart.y;
    if (Math.hypot(dx, dy) > 18) {
      dragStart.acted = true;
      if (dy < -14) triggerAction(dx < 0 ? 'J' : 'K');
      else {
        touchDir = dx < 0 ? -1 : 1;
        triggerAction(dx < 0 ? 'L' : 'R');
        holdTimer = 0.17;
      }
    }
  }
});

function clearPointer() {
  activePointer = null;
  touchDir = 0;
  activeBtn = '';
  dragStart = null;
}
canvas.addEventListener('pointerup', clearPointer);
canvas.addEventListener('pointercancel', clearPointer);

addEventListener('keydown', (e) => {
  if (isOver(state)) {
    if ((e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowRight') && performance.now() - overAt > 300) {
      if (state.won) loadLevel(currentLevel + 1);
      else loadLevel(currentLevel);
    }
    return;
  }

  const wasDown = keys[e.key];
  keys[e.key] = true;

  if (e.key === 'r' || e.key === 'R') { loadLevel(currentLevel); return; }
  if (e.key === '[') { loadLevel(currentLevel - 1); return; }
  if (e.key === ']') { loadLevel(currentLevel + 1); return; }

  if (!wasDown) {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
      e.preventDefault();
      triggerAction('L');
      holdTimer = 0.17;
    } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
      e.preventDefault();
      triggerAction('R');
      holdTimer = 0.17;
    } else if (e.key === 'q' || e.key === 'Q') {
      triggerAction('J');
    } else if (e.key === 'e' || e.key === 'E') {
      triggerAction('K');
    } else if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
      e.preventDefault();
      smartVault();
    }
  }
});

addEventListener('keyup', (e) => { keys[e.key] = false; });

function updateSim(dt) {
  animTime += dt;
  if (holdTimer > 0) holdTimer = Math.max(0, holdTimer - dt);

  if (!isOver(state)) {
    let dir = touchDir;
    if (keys['ArrowLeft'] || keys['a'] || keys['A']) dir = -1;
    else if (keys['ArrowRight'] || keys['d'] || keys['D']) dir = 1;

    if (dir !== 0 && holdTimer <= 0) {
      triggerAction(dir < 0 ? 'L' : 'R');
      holdTimer = 0.15;
    }
  }

  // Smooth 60 FPS interpolation for player & crates
  const k = Math.min(1, dt * 19);
  visPlayer.x += (state.player.x - visPlayer.x) * k;
  visPlayer.y += (state.player.y - visPlayer.y) * k;
  if (visPlayer.hop > 0) visPlayer.hop = Math.max(0, visPlayer.hop - dt * 5.2);

  while (visCrates.length < state.crates.length) {
    const c = state.crates[visCrates.length];
    visCrates.push({ x: c.x, y: c.y });
  }
  for (let i = 0; i < state.crates.length; i++) {
    visCrates[i].x += (state.crates[i].x - visCrates[i].x) * k;
    visCrates[i].y += (state.crates[i].y - visCrates[i].y) * k;
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const pt = particles[i];
    pt.x += pt.vx * dt;
    pt.y += pt.vy * dt;
    pt.vy += 120 * dt;
    pt.life -= dt;
    if (pt.life <= 0) particles.splice(i, 1);
  }
  for (let i = popups.length - 1; i >= 0; i--) {
    popups[i].y -= 24 * dt;
    popups[i].life -= dt;
    if (popups[i].life <= 0) popups.splice(i, 1);
  }
}

function draw() {
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#0d1829');
  bg.addColorStop(1, '#070c16');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // Header HUD
  ctx.fillStyle = '#64748b';
  ctx.font = 'bold 11px system-ui, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('RUN SCORE', 16, 26);
  ctx.textAlign = 'center';
  ctx.fillText('MOVES / PAR', W / 2, 26);
  ctx.textAlign = 'right';
  ctx.fillText('BEST', W - 16, 26);

  ctx.fillStyle = '#f8fafc';
  ctx.font = 'bold 24px system-ui, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(totalScore + score(state), 16, 54);

  ctx.fillStyle = state.movesCount <= state.par ? '#38bdf8' : '#fbbf24';
  ctx.textAlign = 'center';
  ctx.fillText(`${state.movesCount} / ${state.par}`, W / 2, 54);

  ctx.fillStyle = '#34d399';
  ctx.font = 'bold 20px system-ui, sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText(best, W - 16, 52);

  // Level bar title
  ctx.fillStyle = '#cbd5e1';
  ctx.font = 'bold 12px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(`Ch.${currentLevel + 1}/${DEFAULT_LEVELS.length}: ${state.levelName}`, 146, 92);

  // Puzzle Arena
  const { tile, ox, oy, gw, gh } = getLayout();

  ctx.fillStyle = '#050911';
  rrect(ox - 8, oy - 8, gw * tile + 16, gh * tile + 16, 12);
  ctx.fill();
  ctx.strokeStyle = '#1e293b';
  ctx.lineWidth = 2;
  ctx.stroke();

  const switchesPressed = state.switches.length === 0 || state.switches.every((s) =>
    state.crates.some((c) => c.x === s.x && c.y === s.y) || (state.player.x === s.x && state.player.y === s.y)
  );

  // Subtle floor grid
  ctx.strokeStyle = 'rgba(30, 41, 59, 0.35)';
  ctx.lineWidth = 1;
  for (let y = 0; y < gh; y++) {
    for (let x = 0; x < gw; x++) {
      ctx.strokeRect(ox + x * tile, oy + y * tile, tile, tile);
    }
  }

  // Walls
  for (const w of state.walls) {
    const wx = ox + w.x * tile;
    const wy = oy + w.y * tile;
    ctx.fillStyle = '#1e293b';
    rrect(wx + 1, wy + 1, tile - 2, tile - 2, 4);
    ctx.fill();
    ctx.fillStyle = '#334155';
    ctx.fillRect(wx + 3, wy + 2, tile - 6, 3);
  }

  // Switches
  for (const s of state.switches) {
    const isDown = state.crates.some((c) => c.x === s.x && c.y === s.y) || (state.player.x === s.x && state.player.y === s.y);
    const sx = ox + s.x * tile;
    const sy = oy + (s.y + 1) * tile;
    ctx.fillStyle = isDown ? '#22c55e' : '#eab308';
    rrect(sx + 3, sy - (isDown ? 4 : 7), tile - 6, isDown ? 4 : 7, 2);
    ctx.fill();
  }

  // Doors
  for (const d of state.doors) {
    const dx = ox + d.x * tile;
    const dy = oy + d.y * tile;
    if (!switchesPressed) {
      ctx.fillStyle = '#dc2626';
      rrect(dx + 3, dy + 2, tile - 6, tile - 4, 4);
      ctx.fill();
      ctx.strokeStyle = '#fca5a5';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    } else {
      ctx.strokeStyle = 'rgba(74, 222, 128, 0.45)';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(dx + 4, dy + 4, tile - 8, tile - 8);
    }
  }

  // Swirling Exit Portal
  const ex = ox + (state.exit.x + 0.5) * tile;
  const ey = oy + (state.exit.y + 0.5) * tile;
  ctx.save();
  ctx.translate(ex, ey);
  ctx.rotate(animTime * 2.8);
  ctx.fillStyle = 'rgba(2, 132, 199, 0.45)';
  ctx.beginPath();
  ctx.arc(0, 0, tile * 0.4, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#38bdf8';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.arc(0, 0, tile * 0.4, 0, Math.PI * 1.5);
  ctx.stroke();
  ctx.rotate(-animTime * 5);
  ctx.strokeStyle = '#bae6fd';
  ctx.lineWidth = 1.8;
  ctx.beginPath();
  ctx.arc(0, 0, tile * 0.23, 0, Math.PI * 1.4);
  ctx.stroke();
  ctx.restore();

  // Crates (smoothly interpolated)
  for (let i = 0; i < state.crates.length; i++) {
    const vc = visCrates[i] || state.crates[i];
    const cx = ox + vc.x * tile;
    const cy = oy + vc.y * tile;
    ctx.fillStyle = '#d97706';
    rrect(cx + 3, cy + 3, tile - 6, tile - 6, 4);
    ctx.fill();
    ctx.strokeStyle = '#fbbf24';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.strokeStyle = '#92400e';
    ctx.beginPath();
    ctx.moveTo(cx + 5, cy + 5);
    ctx.lineTo(cx + tile - 5, cy + tile - 5);
    ctx.moveTo(cx + tile - 5, cy + 5);
    ctx.lineTo(cx + 5, cy + tile - 5);
    ctx.stroke();
  }

  // Player (smoothly interpolated + parabolic vault arc)
  const hopOffset = Math.sin(visPlayer.hop * Math.PI) * tile * 0.48;
  const px = ox + (visPlayer.x + 0.5) * tile;
  const py = oy + (visPlayer.y + 0.5) * tile - hopOffset;
  ctx.save();
  ctx.translate(px, py);
  ctx.fillStyle = '#38bdf8';
  ctx.beginPath();
  ctx.arc(0, 0, tile * 0.36, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#e0f2fe';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.fillStyle = '#f43f5e';
  ctx.fillRect(visPlayer.facing > 0 ? 0 : -tile * 0.24, -3, tile * 0.24, 4);
  ctx.restore();

  // Particles & Popups
  for (const pt of particles) {
    ctx.globalAlpha = Math.min(1, pt.life * 2.4);
    ctx.fillStyle = pt.color;
    ctx.fillRect(pt.x - 2, pt.y - 2, 4, 4);
  }
  ctx.globalAlpha = 1;

  for (const pop of popups) {
    ctx.globalAlpha = Math.min(1, pop.life * 1.4);
    ctx.fillStyle = pop.color;
    ctx.font = 'bold 14px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(pop.text, pop.x, pop.y);
  }
  ctx.globalAlpha = 1;

  // Helpful hint text
  ctx.fillStyle = '#64748b';
  ctx.font = '12px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('Push crates ($) onto switches (_) to unlock gates (D)!', W / 2, 424);

  // Draw Touch Buttons
  const legal = legalActions(state);
  const holdL = keys['ArrowLeft'] || keys['a'] || keys['A'] || touchDir < 0;
  const holdR = keys['ArrowRight'] || keys['d'] || keys['D'] || touchDir > 0;

  for (const b of BTNS) {
    let fill = '#162238';
    let border = '#334155';
    let textCol = '#f8fafc';

    if (b.id === 'left' && holdL) { fill = '#0284c7'; border = '#7dd3fc'; }
    else if (b.id === 'right' && holdR) { fill = '#0284c7'; border = '#7dd3fc'; }
    else if (b.id === 'vault_l') {
      const ok = legal.includes('J');
      fill = ok ? '#0369a1' : '#0f172a';
      border = ok ? '#38bdf8' : '#1e293b';
      textCol = ok ? '#f8fafc' : '#475569';
    } else if (b.id === 'vault_r') {
      const ok = legal.includes('K');
      fill = ok ? '#0369a1' : '#0f172a';
      border = ok ? '#38bdf8' : '#1e293b';
      textCol = ok ? '#f8fafc' : '#475569';
    } else if (b.id === 'smart_jump') {
      const ok = legal.includes('J') || legal.includes('K');
      fill = ok ? '#059669' : '#0f172a';
      border = ok ? '#34d399' : '#1e293b';
      textCol = ok ? '#f8fafc' : '#475569';
    } else if (b.id === 'reset' || b.id === 'reset_big') {
      fill = '#4c0519';
      border = '#e11d48';
      textCol = '#ffe4e6';
    }

    ctx.fillStyle = fill;
    rrect(b.x, b.y, b.w, b.h, b.h > 40 ? 12 : 7);
    ctx.fill();
    ctx.strokeStyle = border;
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.fillStyle = textCol;
    ctx.font = b.h > 55 ? 'bold 15px system-ui, sans-serif' : 'bold 11px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(b.label, b.x + b.w / 2, b.y + b.h / 2 + 4);
  }

  ctx.fillStyle = '#64748b';
  ctx.font = '11px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('A/D Move · Space/Up Smart Vault · Q/E Diagonal Leap · R Reset', W / 2, 604);

  // Chamber Solved / Out of Moves Overlay
  if (isOver(state)) {
    ctx.fillStyle = 'rgba(7, 12, 22, 0.88)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';

    if (state.won) {
      ctx.fillStyle = '#38bdf8';
      ctx.font = 'bold 30px system-ui, sans-serif';
      ctx.fillText('CHAMBER SOLVED!', W / 2, H / 2 - 44);
      ctx.fillStyle = '#e2e8f0';
      ctx.font = '17px system-ui, sans-serif';
      ctx.fillText(`Cleared in ${state.movesCount} moves (Par: ${state.par})`, W / 2, H / 2 - 8);
      ctx.fillStyle = '#34d399';
      ctx.font = 'bold 22px system-ui, sans-serif';
      ctx.fillText(`+${score(state)} pts`, W / 2, H / 2 + 28);
      ctx.fillStyle = '#94a3b8';
      ctx.font = '15px system-ui, sans-serif';
      ctx.fillText('Tap anywhere for Next Chamber', W / 2, H / 2 + 68);
    } else {
      ctx.fillStyle = '#f43f5e';
      ctx.font = 'bold 30px system-ui, sans-serif';
      ctx.fillText('CHAMBER STALLED', W / 2, H / 2 - 30);
      ctx.fillStyle = '#cbd5e1';
      ctx.font = '16px system-ui, sans-serif';
      ctx.fillText('No legal moves or step limit reached', W / 2, H / 2 + 6);
      ctx.fillStyle = '#38bdf8';
      ctx.font = '15px system-ui, sans-serif';
      ctx.fillText('Tap anywhere to retry chamber', W / 2, H / 2 + 48);
    }
  }
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  updateSim(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

const inApk = window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform();
if (!inApk && 'serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
