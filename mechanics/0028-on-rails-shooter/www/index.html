<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Rail Phantom - On-Rails Shooter</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#060914">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #060914;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      overflow-x: hidden;
      touch-action: manipulation;
    }
    header {
      width: 100%;
      max-width: 480px;
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(10, 15, 30, 0.9);
      border-bottom: 1px solid #1e293b;
    }
    .title-group h1 {
      font-size: 1.1rem;
      font-weight: 700;
      color: #38bdf8;
      letter-spacing: 0.5px;
    }
    .title-group .sub {
      font-size: 0.72rem;
      color: #94a3b8;
    }
    .score-badge {
      font-size: 0.9rem;
      font-weight: 700;
      color: #facc15;
    }
    .hud-bar {
      width: 100%;
      max-width: 480px;
      padding: 8px 16px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      gap: 8px;
      background: #090e1d;
      border-bottom: 1px solid #1e293b;
      font-size: 0.75rem;
    }
    .hud-stat {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .hud-stat .label {
      font-size: 0.65rem;
      color: #64748b;
      text-transform: uppercase;
      font-weight: 600;
    }
    .bar-bg {
      width: 100%;
      height: 6px;
      background: #1e293b;
      border-radius: 3px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      transition: width 0.15s ease;
    }
    .fill-hp { background: #10b981; }
    .fill-dist { background: #38bdf8; }
    .fill-energy { background: #818cf8; }
    .fill-heat { background: #f43f5e; }
    #gameCanvas {
      background: #030611;
      width: 100%;
      max-width: 480px;
      aspect-ratio: 1;
      display: block;
      border-bottom: 1px solid #1e293b;
    }
    .event-ticker {
      width: 100%;
      max-width: 480px;
      padding: 6px 16px;
      font-size: 0.75rem;
      color: #38bdf8;
      background: #080d1c;
      border-bottom: 1px solid #1e293b;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .controls-panel {
      width: 100%;
      max-width: 480px;
      padding: 10px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: #060914;
      flex-grow: 1;
    }
    .control-row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }
    .dpad-grid {
      display: grid;
      grid-template-columns: repeat(3, 46px);
      grid-template-rows: repeat(2, 40px);
      gap: 5px;
    }
    .action-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(2, 40px);
      gap: 6px;
      flex-grow: 1;
    }
    .btn-act {
      background: #1e293b;
      border: 1px solid #334155;
      color: #f1f5f9;
      font-weight: 700;
      font-size: 0.78rem;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      transition: background 0.1s;
    }
    .btn-act:active {
      background: #0284c7;
      color: white;
    }
    .btn-fire {
      background: #dc2626;
      border-color: #ef4444;
      color: white;
    }
    .btn-fire:active {
      background: #b91c1c;
    }
    .btn-missile {
      background: #d97706;
      border-color: #f59e0b;
      color: white;
    }
    .btn-roll {
      background: #4f46e5;
      border-color: #6366f1;
      color: white;
    }
    .btn-vent {
      background: #0f766e;
      border-color: #14b8a6;
      color: white;
    }
    .bottom-tools {
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }
    .btn-tool {
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
    }
    .btn-tool:hover {
      background: #334155;
      color: #f1f5f9;
    }
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(3, 6, 17, 0.88);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 20px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-box {
      background: #0f172a;
      border: 1px solid #38bdf8;
      border-radius: 12px;
      padding: 24px;
      max-width: 340px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 30px rgba(56, 189, 248, 0.2);
    }
    .modal-box h2 {
      font-size: 1.3rem;
      margin-bottom: 8px;
    }
    .modal-box.win h2 {
      color: #34d399;
    }
    .modal-box.lose h2 {
      color: #f43f5e;
    }
    .modal-box p {
      color: #94a3b8;
      font-size: 0.88rem;
      margin-bottom: 16px;
    }
    .modal-box .btn-modal {
      background: #0284c7;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
    }
  </style>
</head>
<body>
  <header>
    <div class="title-group">
      <h1>Rail Phantom</h1>
      <div class="sub">Sector Sigma Orbital Corridor</div>
    </div>
    <div class="score-badge" id="scoreDisp">0 PTS</div>
  </header>

  <div class="hud-bar">
    <div class="hud-stat">
      <span class="label">Hull (HP)</span>
      <div class="bar-bg"><div class="bar-fill fill-hp" id="hpFill" style="width: 100%;"></div></div>
    </div>
    <div class="hud-stat">
      <span class="label" id="distLabel">Rail: 0m</span>
      <div class="bar-bg"><div class="bar-fill fill-dist" id="distFill" style="width: 0%;"></div></div>
    </div>
    <div class="hud-stat">
      <span class="label">Energy</span>
      <div class="bar-bg"><div class="bar-fill fill-energy" id="energyFill" style="width: 100%;"></div></div>
    </div>
    <div class="hud-stat">
      <span class="label" id="missileLabel">Ordnance: 4</span>
      <div class="bar-bg"><div class="bar-fill fill-heat" id="heatFill" style="width: 0%;"></div></div>
    </div>
  </div>

  <canvas id="gameCanvas" width="480" height="480"></canvas>

  <div class="event-ticker" id="eventTicker">Mission start: Sector Sigma conduit approach</div>

  <div class="controls-panel">
    <div class="control-row">
      <div class="dpad-grid">
        <button class="btn-act" id="btnLeft">&larr;</button>
        <button class="btn-act" id="btnUp">&uarr;</button>
        <button class="btn-act" id="btnRight">&rarr;</button>
        <div></div>
        <button class="btn-act" id="btnDown">&darr;</button>
        <div></div>
      </div>
      <div class="action-grid">
        <button class="btn-act btn-fire" id="btnFire">Laser (Space)</button>
        <button class="btn-act btn-missile" id="btnMissile">Missile (M)</button>
        <button class="btn-act btn-roll" id="btnRoll">Barrel Roll (B)</button>
        <button class="btn-act btn-vent" id="btnVent">Vent / Boost (V)</button>
      </div>
    </div>
    <div class="bottom-tools">
      <button class="btn-tool" id="btnBoost">Boost (+35m)</button>
      <button class="btn-tool" id="btnReset">Restart Mission (R)</button>
    </div>
  </div>

  <div class="modal-overlay" id="endModal">
    <div class="modal-box" id="modalBox">
      <h2 id="modalTitle">Victory!</h2>
      <p id="modalMsg">Conduit cleared.</p>
      <button class="btn-modal" id="modalBtn">Replay Mission</button>
    </div>
  </div>

  <script src="logic.js"></script>
  <script>
    (function () {
      'use strict';

      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas ? canvas.getContext('2d') : null;

      let state = null;
      let starField = [];
      const NUM_STARS = 60;

      for (let i = 0; i < NUM_STARS; i++) {
        starField.push({
          x: (Math.random() - 0.5) * 480,
          y: (Math.random() - 0.5) * 480,
          z: Math.random() * 8 + 1
        });
      }

      function initGame() {
        state = RailPhantom.createState(Date.now() & 0xffff);
        updateUI();
        render();
      }

      function updateUI() {
        if (!state) return;

        const scoreDisp = document.getElementById('scoreDisp');
        if (scoreDisp) scoreDisp.textContent = state.scoreVal + ' PTS';

        const hpFill = document.getElementById('hpFill');
        if (hpFill) hpFill.style.width = Math.max(0, Math.min(100, state.player.hp)) + '%';

        const distFill = document.getElementById('distFill');
        if (distFill) distFill.style.width = Math.min(100, (state.distance / 1000) * 100) + '%';

        const distLabel = document.getElementById('distLabel');
        if (distLabel) distLabel.textContent = 'Rail: ' + state.distance + 'm';

        const energyFill = document.getElementById('energyFill');
        if (energyFill) energyFill.style.width = Math.max(0, Math.min(100, state.player.energy)) + '%';

        const heatFill = document.getElementById('heatFill');
        if (heatFill) heatFill.style.width = Math.max(0, Math.min(100, state.player.heat)) + '%';

        const missileLabel = document.getElementById('missileLabel');
        if (missileLabel) missileLabel.textContent = 'Missiles: ' + state.player.missiles;

        const eventTicker = document.getElementById('eventTicker');
        if (eventTicker && state.lastEvent) eventTicker.textContent = state.lastEvent;

        // Modals
        const modal = document.getElementById('endModal');
        const modalBox = document.getElementById('modalBox');
        const modalTitle = document.getElementById('modalTitle');
        const modalMsg = document.getElementById('modalMsg');
        const modalBtn = document.getElementById('modalBtn');

        if (state.won) {
          if (modal && modal.classList) modal.classList.add('active');
          if (modalBox && modalBox.classList) {
            modalBox.classList.remove('lose');
            modalBox.classList.add('win');
          }
          if (modalTitle) modalTitle.textContent = 'SECTOR CLEARED!';
          if (modalMsg) modalMsg.textContent = 'Final Score: ' + state.scoreVal + ' | Hull Left: ' + state.player.hp + '%';
          if (modalBtn) modalBtn.onclick = () => {
            if (modal && modal.classList) modal.classList.remove('active');
            initGame();
          };
        } else if (state.lost) {
          if (modal && modal.classList) modal.classList.add('active');
          if (modalBox && modalBox.classList) {
            modalBox.classList.remove('win');
            modalBox.classList.add('lose');
          }
          if (modalTitle) modalTitle.textContent = 'MISSION FAILED';
          if (modalMsg) modalMsg.textContent = state.player.hp <= 0 ? 'Starfighter hull collapsed under enemy fire.' : 'Conduit energy depleted.';
          if (modalBtn) modalBtn.onclick = () => {
            if (modal && modal.classList) modal.classList.remove('active');
            initGame();
          };
        } else {
          if (modal && modal.classList) modal.classList.remove('active');
        }
      }

      function handleAction(action) {
        if (!state || state.won || state.lost) return;
        const legal = RailPhantom.legalActions(state);
        if (!legal.includes(action)) return;

        RailPhantom.step(state, action);
        updateUI();
        render();
      }

      function render() {
        if (!ctx || !state) return;
        const w = canvas.width;
        const h = canvas.height;
        const cx = w / 2;
        const cy = h / 2;

        ctx.fillStyle = '#030611';
        ctx.fillRect(0, 0, w, h);

        // 1. Perspective Conduit Starfield & Speed Lines
        ctx.fillStyle = '#ffffff';
        for (let i = 0; i < starField.length; i++) {
          const s = starField[i];
          s.z -= 0.15;
          if (s.z <= 0.2) s.z = 8;
          const k = 150 / s.z;
          const sx = cx + s.x * (k / 100);
          const sy = cy + s.y * (k / 100);
          const rad = Math.max(0.5, (1 - s.z / 8) * 2.2);

          ctx.beginPath();
          ctx.arc(sx, sy, rad, 0, Math.PI * 2);
          ctx.fill();
        }

        // 2. Rail Wireframe Rings
        const ringPulse = (state.stepCount % 4) * 0.25;
        for (let r = 1; r <= 4; r++) {
          const zDepth = r + ringPulse;
          const radius = (240 / zDepth) * 1.8;
          ctx.strokeStyle = 'rgba(56, 189, 248, ' + (0.15 / zDepth) + ')';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.arc(cx, cy, radius, 0, Math.PI * 2);
          ctx.stroke();
        }

        // 3. Render Dreadnought Boss (if active)
        if (state.boss && state.boss.active) {
          const bz = state.boss.z;
          const scale = 220 / bz;
          const bx = cx;
          const by = cy - 40;

          // Left generator
          ctx.fillStyle = state.boss.leftGen > 0 ? '#ef4444' : '#475569';
          ctx.strokeStyle = '#f87171';
          ctx.lineWidth = 2;
          ctx.fillRect(bx - scale * 1.2, by - scale * 0.2, scale * 0.5, scale * 0.4);
          ctx.strokeRect(bx - scale * 1.2, by - scale * 0.2, scale * 0.5, scale * 0.4);

          // Right generator
          ctx.fillStyle = state.boss.rightGen > 0 ? '#ef4444' : '#475569';
          ctx.fillRect(bx + scale * 0.7, by - scale * 0.2, scale * 0.5, scale * 0.4);
          ctx.strokeRect(bx + scale * 0.7, by - scale * 0.2, scale * 0.5, scale * 0.4);

          // Core
          ctx.fillStyle = (state.boss.leftGen <= 0 && state.boss.rightGen <= 0) ? '#a855f7' : '#1e293b';
          ctx.strokeStyle = '#c084fc';
          ctx.beginPath();
          ctx.arc(bx, by, scale * 0.35, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

          // Health bars
          ctx.fillStyle = '#e2e8f0';
          ctx.font = '10px monospace';
          ctx.textAlign = 'center';
          ctx.fillText('DREADNOUGHT CORE: ' + state.boss.core + ' HP', bx, by - scale * 0.4);
        }

        // 4. Render Enemies
        for (let i = 0; i < state.enemies.length; i++) {
          const e = state.enemies[i];
          const ez = Math.max(0.5, e.z);
          const factor = 120 / ez;
          const ex = cx + (e.x * 50) * (factor / 40);
          const ey = cy + (e.y * 50) * (factor / 40);
          const size = (e.type === 'interceptor' ? 22 : 14) * (factor / 30);

          ctx.fillStyle = e.type === 'interceptor' ? '#f43f5e' : '#f59e0b';
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(ex, ey - size);
          ctx.lineTo(ex - size, ey + size * 0.7);
          ctx.lineTo(ex + size, ey + size * 0.7);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();

          // Reticle bracket when targeted
          if (e.x === state.player.x && e.y === state.player.y) {
            ctx.strokeStyle = '#ef4444';
            ctx.lineWidth = 2;
            ctx.strokeRect(ex - size * 1.3, ey - size * 1.3, size * 2.6, size * 2.6);
          }
        }

        // 5. Render Reticle
        const retX = cx + state.player.x * 60;
        const retY = cy + state.player.y * 50 - 20;

        ctx.strokeStyle = 'rgba(56, 189, 248, 0.8)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(retX, retY, 18, 0, Math.PI * 2);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(retX, retY - 24); ctx.lineTo(retX, retY - 12);
        ctx.moveTo(retX, retY + 12); ctx.lineTo(retX, retY + 24);
        ctx.moveTo(retX - 24, retY); ctx.lineTo(retX - 12, retY);
        ctx.moveTo(retX + 12, retY); ctx.lineTo(retX + 24, retY);
        ctx.stroke();

        // 6. Render Player Starfighter in foreground
        const shipX = cx + state.player.x * 50;
        const shipY = h - 70 + state.player.y * 20;

        ctx.save();
        ctx.translate(shipX, shipY);

        // Barrel roll deflector effect
        if (state.player.barrelRolling) {
          ctx.strokeStyle = '#38bdf8';
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.arc(0, 0, 36, 0, Math.PI * 2);
          ctx.stroke();
        }

        // Ship body
        ctx.fillStyle = '#0284c7';
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, -28);
        ctx.lineTo(-24, 18);
        ctx.lineTo(0, 8);
        ctx.lineTo(24, 18);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // Engine glow
        ctx.fillStyle = '#facc15';
        ctx.beginPath();
        ctx.arc(0, 10, 5, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      // Action Handlers
      const btnUp = document.getElementById('btnUp');
      if (btnUp) btnUp.onclick = () => handleAction('move_up');

      const btnDown = document.getElementById('btnDown');
      if (btnDown) btnDown.onclick = () => handleAction('move_down');

      const btnLeft = document.getElementById('btnLeft');
      if (btnLeft) btnLeft.onclick = () => handleAction('move_left');

      const btnRight = document.getElementById('btnRight');
      if (btnRight) btnRight.onclick = () => handleAction('move_right');

      const btnFire = document.getElementById('btnFire');
      if (btnFire) btnFire.onclick = () => handleAction('fire_blaster');

      const btnMissile = document.getElementById('btnMissile');
      if (btnMissile) btnMissile.onclick = () => handleAction('lock_missile');

      const btnRoll = document.getElementById('btnRoll');
      if (btnRoll) btnRoll.onclick = () => handleAction('barrel_roll');

      const btnVent = document.getElementById('btnVent');
      if (btnVent) btnVent.onclick = () => handleAction('vent_heat');

      const btnBoost = document.getElementById('btnBoost');
      if (btnBoost) btnBoost.onclick = () => handleAction('boost');

      const btnReset = document.getElementById('btnReset');
      if (btnReset) btnReset.onclick = initGame;

      // Keyboard Controls
      window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
          e.preventDefault();
          handleAction('move_up');
        } else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') {
          e.preventDefault();
          handleAction('move_down');
        } else if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
          e.preventDefault();
          handleAction('move_left');
        } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
          e.preventDefault();
          handleAction('move_right');
        } else if (e.key === ' ') {
          e.preventDefault();
          handleAction('fire_blaster');
        } else if (e.key === 'm' || e.key === 'M') {
          e.preventDefault();
          handleAction('lock_missile');
        } else if (e.key === 'b' || e.key === 'B') {
          e.preventDefault();
          handleAction('barrel_roll');
        } else if (e.key === 'v' || e.key === 'V') {
          e.preventDefault();
          handleAction('vent_heat');
        } else if (e.key === 'Shift') {
          e.preventDefault();
          handleAction('boost');
        } else if (e.key === 'r' || e.key === 'R') {
          e.preventDefault();
          initGame();
        }
      });

      // Service worker registration
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js').catch(() => {});
        });
      }

      initGame();
    })();
  </script>
</body>
</html>
