<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="die" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <rect width="500" height="500" x="6" y="6" rx="90" fill="none" stroke="#10b981" stroke-width="4" stroke-opacity="0.3"/>
  <g transform="translate(106, 96)">
    <!-- 4-Quadrant Ludo Board Base -->
    <rect x="0" y="0" width="300" height="300" rx="16" fill="#1e293b" stroke="#475569" stroke-width="4" filter="url(#shadow)"/>
    <rect x="10" y="10" width="110" height="110" rx="10" fill="#ef4444"/>
    <rect x="180" y="10" width="110" height="110" rx="10" fill="#3b82f6"/>
    <rect x="10" y="180" width="110" height="110" rx="10" fill="#10b981"/>
    <rect x="180" y="180" width="110" height="110" rx="10" fill="#f59e0b"/>

    <!-- Central Die with 6 pips -->
    <rect x="90" y="90" width="120" height="120" rx="20" fill="url(#die)" stroke="#94a3b8" stroke-width="4" filter="url(#shadow)"/>
    <circle cx="120" cy="115" r="8" fill="#ef4444"/>
    <circle cx="120" cy="150" r="8" fill="#ef4444"/>
    <circle cx="120" cy="185" r="8" fill="#ef4444"/>
    <circle cx="180" cy="115" r="8" fill="#ef4444"/>
    <circle cx="180" cy="150" r="8" fill="#ef4444"/>
    <circle cx="180" cy="185" r="8" fill="#ef4444"/>
  </g>
</svg>
