<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="grid-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#083344"/>
      <stop offset="50%" stop-color="#164e63"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="chip-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="120" fill="url(#grid-bg)"/>
  <!-- Industrial Floor Grid Lines -->
  <path d="M 60 256 H 452 M 256 60 V 452" stroke="#0e7490" stroke-width="4" stroke-dasharray="16 16" opacity="0.4"/>
  <!-- Conveyor Belt Loop -->
  <rect x="90" y="210" width="332" height="92" rx="46" fill="#1e293b" stroke="#06b6d4" stroke-width="8"/>
  <circle cx="136" cy="256" r="32" fill="#0f172a" stroke="#22d3ee" stroke-width="6"/>
  <circle cx="376" cy="256" r="32" fill="#0f172a" stroke="#22d3ee" stroke-width="6"/>
  <!-- Conveyor Belt Direction Arrows -->
  <path d="M 210 240 L 235 256 L 210 272 M 275 240 L 300 256 L 275 272" stroke="#67e8f9" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Central Microchip Component Being Carried -->
  <rect x="216" y="110" width="80" height="80" rx="10" fill="url(#chip-grad)" stroke="#cffafe" stroke-width="4"/>
  <!-- Chip Pins -->
  <rect x="230" y="96" width="10" height="14" fill="#67e8f9"/>
  <rect x="272" y="96" width="10" height="14" fill="#67e8f9"/>
  <rect x="230" y="190" width="10" height="14" fill="#67e8f9"/>
  <rect x="272" y="190" width="10" height="14" fill="#67e8f9"/>
  <!-- Silicon Wafer Core -->
  <circle cx="256" cy="150" r="16" fill="#083344"/>
</svg>
