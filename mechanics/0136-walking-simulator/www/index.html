<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Solitary Echoes - Walking Simulator</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0284c7">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #0b0f19;
      color: #f1f5f9;
      font-family: Georgia, "Times New Roman", serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 8px;
      overflow-x: hidden;
    }
    header {
      width: 100%;
      max-width: 480px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      padding: 6px 12px;
      background: #0f172a;
      border-radius: 8px;
      border: 1px solid #38bdf8;
    }
    h1 {
      font-size: 1rem;
      color: #7dd3fc;
      display: flex;
      align-items: center;
      gap: 6px;
      letter-spacing: 0.5px;
    }
    .hud {
      width: 100%;
      max-width: 480px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
      margin-bottom: 6px;
      font-family: monospace;
    }
    .hud-box {
      background: #1e293b;
      border: 1px solid #475569;
      border-radius: 6px;
      padding: 4px 6px;
      text-align: center;
      font-size: 0.72rem;
    }
    .hud-label {
      color: #94a3b8;
      font-size: 0.62rem;
      text-transform: uppercase;
      margin-bottom: 2px;
    }
    .hud-val {
      font-weight: bold;
      color: #ffffff;
      font-size: 0.8rem;
    }
    .val-loc { color: #38bdf8; }
    .val-mem { color: #facc15; }
    .val-clr { color: #a78bfa; }
    .val-sc { color: #4ade80; }

    #game-container {
      position: relative;
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    canvas {
      width: 100%;
      max-width: 460px;
      aspect-ratio: 16 / 7;
      background: #020617;
      border: 2px solid #0284c7;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(2, 132, 199, 0.25);
      touch-action: none;
    }

    .monologue-box {
      width: 100%;
      max-width: 460px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      margin-top: 6px;
      padding: 10px 12px;
      height: 110px;
      overflow-y: auto;
      font-size: 0.82rem;
      line-height: 1.45;
      color: #e2e8f0;
      box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5);
    }
    .mono-line { margin-bottom: 5px; }
    .mono-memory { color: #facc15; font-style: italic; }
    .mono-walk { color: #93c5fd; }
    .mono-radio { color: #c084fc; font-family: monospace; font-size: 0.75rem; }
    .mono-triumph { color: #4ade80; font-weight: bold; }

    .actions-grid {
      width: 100%;
      max-width: 460px;
      margin-top: 6px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 5px;
    }
    .btn-act {
      background: #1e293b;
      color: #f1f5f9;
      border: 1px solid #475569;
      border-radius: 6px;
      padding: 8px 6px;
      font-family: Georgia, serif;
      font-size: 0.75rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.15s ease;
      text-align: center;
    }
    .btn-act:hover {
      background: #334155;
      border-color: #94a3b8;
    }
    .btn-act:active {
      transform: scale(0.97);
    }
    .btn-walk {
      background: #0c4a6e;
      border-color: #0284c7;
      color: #e0f2fe;
    }
    .btn-walk:hover {
      background: #0369a1;
      border-color: #38bdf8;
    }
    .btn-inspect {
      background: #713f12;
      border-color: #ca8a04;
      color: #fef9c3;
    }
    .btn-inspect:hover {
      background: #854d0e;
      border-color: #eab308;
    }
    .btn-radio {
      background: #3b0764;
      border-color: #9333ea;
      color: #f3e8ff;
    }
    .btn-radio:hover {
      background: #581c87;
      border-color: #c084fc;
    }
    .btn-climax {
      background: #14532d;
      border-color: #22c55e;
      color: #f0fdf4;
      grid-column: span 2;
      font-size: 0.85rem;
      padding: 10px;
      font-weight: bold;
    }
    .btn-climax:hover {
      background: #166534;
      border-color: #4ade80;
    }

    .modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(11, 15, 25, 0.94);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      padding: 16px;
      text-align: center;
      z-index: 10;
    }
    .modal-title {
      font-size: 1.4rem;
      font-weight: bold;
      margin-bottom: 8px;
    }
    .win-title { color: #38bdf8; text-shadow: 0 0 10px rgba(56, 189, 248, 0.5); }
    .lose-title { color: #f43f5e; text-shadow: 0 0 10px rgba(244, 63, 94, 0.5); }
  </style>
</head>
<body>

  <header>
    <h1>🌌 Solitary Echoes</h1>
    <div style="font-size:0.75rem; color:#bae6fd;" id="turn-counter">Step: 0/150</div>
  </header>

  <div class="hud">
    <div class="hud-box">
      <div class="hud-label">Trail</div>
      <div class="hud-val val-loc" id="hud-loc">Coast</div>
    </div>
    <div class="hud-box">
      <div class="hud-label">Memories</div>
      <div class="hud-val val-mem" id="hud-mem">0 / 4</div>
    </div>
    <div class="hud-box">
      <div class="hud-label">Clarity</div>
      <div class="hud-val val-clr" id="hud-clr">10</div>
    </div>
    <div class="hud-box">
      <div class="hud-label">Score</div>
      <div class="hud-val val-sc" id="hud-sc">0</div>
    </div>
  </div>

  <div id="game-container">
    <canvas id="game-canvas" width="460" height="200"></canvas>

    <div class="monologue-box" id="monologue-box">
      <!-- Lines rendered dynamically -->
    </div>

    <div class="actions-grid" id="actions-grid">
      <!-- Buttons rendered dynamically -->
    </div>

    <div id="end-modal" class="modal-overlay" style="display:none;">
      <div class="modal-title" id="modal-title">JOURNEY TRANSCENDED</div>
      <p id="modal-desc" style="font-size:0.85rem; margin-bottom:12px; color:#cbd5e1;"></p>
      <button class="btn-act" onclick="window.restartGame()" style="padding:10px 24px; font-size:0.9rem; font-weight:bold;">Retrace the Path</button>
    </div>
  </div>

  <script src="logic.js"></script>
  <script>
    (function() {
      let state = null;
      const canvas = document.getElementById('game-canvas');
      const ctx = canvas ? canvas.getContext('2d') : null;

      function init() {
        state = createState(Date.now ? Date.now() : 1);
        render();
      }

      window.restartGame = function() {
        init();
      };

      window.executeAction = function(act) {
        if (!state || state.done) return;
        try {
          step(state, act);
          render();
        } catch (e) {
          console.error(e);
        }
      };

      function render() {
        if (!state) return;

        // HUD Updates
        const lEl = document.getElementById('hud-loc');
        if (lEl) lEl.textContent = formatLocationShort(state.location);

        const mEl = document.getElementById('hud-mem');
        if (mEl) mEl.textContent = state.discoveredMemories.length + ' / 4';

        const cEl = document.getElementById('hud-clr');
        if (cEl) cEl.textContent = state.clarity;

        const scEl = document.getElementById('hud-sc');
        if (scEl) scEl.textContent = state.score;

        const turnEl = document.getElementById('turn-counter');
        if (turnEl) turnEl.textContent = 'Step: ' + state.turns + '/' + state.maxTurns;

        // Canvas Rendering
        if (ctx) {
          ctx.clearRect(0, 0, 460, 200);

          // Scenic Twilight Sky
          const skyGrad = ctx.createLinearGradient(0, 0, 0, 160);
          skyGrad.addColorStop(0, '#020617');
          skyGrad.addColorStop(0.5, '#1e1b4b');
          skyGrad.addColorStop(1, '#312e81');
          ctx.fillStyle = skyGrad;
          ctx.fillRect(0, 0, 460, 160);

          // Ocean / Terrain Base
          const landGrad = ctx.createLinearGradient(0, 160, 0, 200);
          landGrad.addColorStop(0, '#0c4a6e');
          landGrad.addColorStop(1, '#02131e');
          ctx.fillStyle = landGrad;
          ctx.fillRect(0, 160, 460, 40);

          // Stars
          ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
          const starCoords = [[50, 30], [90, 70], [140, 25], [200, 50], [280, 20], [350, 65], [410, 35]];
          for (let i = 0; i < starCoords.length; i++) {
            ctx.fillRect(starCoords[i][0], starCoords[i][1], 2, 2);
          }

          // Coastal Mountain Cliffs & Lighthouse
          ctx.fillStyle = '#0f172a';
          ctx.beginPath();
          ctx.moveTo(0, 160);
          ctx.lineTo(80, 100);
          ctx.lineTo(160, 130);
          ctx.lineTo(260, 70);
          ctx.lineTo(360, 120);
          ctx.lineTo(460, 80);
          ctx.lineTo(460, 200);
          ctx.lineTo(0, 200);
          ctx.fill();

          // Location Banner
          ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
          ctx.fillRect(10, 10, 440, 34);
          ctx.strokeStyle = '#38bdf8';
          ctx.lineWidth = 1;
          ctx.strokeRect(10, 10, 440, 34);

          ctx.font = 'bold 14px Georgia, serif';
          ctx.fillStyle = '#7dd3fc';
          ctx.fillText('VISTA: ' + formatLocationLong(state.location), 22, 32);

          // Scenic Prop Card on Canvas
          drawScenicCard(ctx, state.location);
        }

        // Monologue Scroll
        const monoBox = document.getElementById('monologue-box');
        if (monoBox) {
          let html = '';
          for (let i = 0; i < state.monologue.length; i++) {
            const line = state.monologue[i];
            let cls = 'mono-line';
            if (line.includes('Memory Restored:')) cls += ' mono-memory';
            else if (line.includes('TRANSCENDED:')) cls += ' mono-triumph';
            else if (line.includes('Static crackles')) cls += ' mono-radio';
            else if (line.includes('You step') || line.includes('You reach') || line.includes('The copper')) cls += ' mono-walk';
            html += '<div class="' + cls + '">' + escapeHtml(line) + '</div>';
          }
          monoBox.innerHTML = html;
          monoBox.scrollTop = monoBox.scrollHeight;
        }

        // Actions Grid
        const actionsEl = document.getElementById('actions-grid');
        if (actionsEl) {
          const acts = legalActions(state);
          let html = '';
          for (let i = 0; i < acts.length; i++) {
            const act = acts[i];
            let cls = 'btn-act';
            if (act.startsWith('walk:')) cls += ' btn-walk';
            else if (act.startsWith('inspect:')) cls += ' btn-inspect';
            else if (act === 'tune:radio') cls += ' btn-radio';
            else if (act === 'action:align_telescope') cls += ' btn-climax';

            html += '<button class="' + cls + '" onclick="window.executeAction(\'' + act + '\')">'
              + formatActionTitle(act)
              + '</button>';
          }
          actionsEl.innerHTML = html;
        }

        // End Game Modal
        const modal = document.getElementById('end-modal');
        if (modal) {
          if (state.done) {
            modal.style.display = 'flex';
            const mTitle = document.getElementById('modal-title');
            const mDesc = document.getElementById('modal-desc');

            if (state.victory) {
              if (mTitle) {
                mTitle.textContent = 'STELLA MARIS AWAKENS';
                mTitle.className = 'modal-title win-title';
              }
              if (mDesc) mDesc.textContent = 'You aligned all 4 celestial memories and restored the island beacon across the quiet sea! Final Score: ' + state.score;
            } else {
              if (mTitle) {
                mTitle.textContent = 'JOURNEY AT REST';
                mTitle.className = 'modal-title lose-title';
              }
              if (mDesc) mDesc.textContent = 'Twilight settles over Orford Isle as the stars look on. Final Score: ' + state.score;
            }
          } else {
            modal.style.display = 'none';
          }
        }
      }

      function drawScenicCard(ctx, loc) {
        ctx.fillStyle = 'rgba(15, 23, 42, 0.65)';
        ctx.fillRect(25, 55, 410, 95);
        ctx.strokeStyle = '#0284c7';
        ctx.lineWidth = 1;
        ctx.strokeRect(25, 55, 410, 95);

        ctx.font = 'italic 13px Georgia, serif';
        ctx.fillStyle = '#fef08a';

        if (loc === 'coastal_trail') {
          ctx.fillText('The wind carries salt and the distant cry of gulls.', 40, 80);
          ctx.fillStyle = '#cbd5e1';
          ctx.font = '11px monospace';
          ctx.fillText('A weathered stone cairn marks the beginning of the trail.', 40, 105);
          ctx.fillText('Paths continue toward the Fisherman Cottage and Groves.', 40, 125);
        } else if (loc === 'cottage') {
          ctx.fillText('Sunbleached cedar shakes and quiet windowframes.', 40, 80);
          ctx.fillStyle = '#cbd5e1';
          ctx.font = '11px monospace';
          ctx.fillText('An upright piano stands against the interior parlor wall.', 40, 105);
          ctx.fillText('Unsent letters rest on the oak writing desk.', 40, 125);
        } else if (loc === 'groves') {
          ctx.fillText('Ancient coastal pines murmur in the gentle onshore breeze.', 40, 80);
          ctx.fillStyle = '#cbd5e1';
          ctx.font = '11px monospace';
          ctx.fillText('Glass windchimes sway softly from a mossy bough.', 40, 105);
          ctx.fillText('A trail branches upward to the Cliffside Overlook.', 40, 125);
        } else if (loc === 'overlook') {
          ctx.fillText('A breathtaking panorama of sea and sky at twilight.', 40, 80);
          ctx.fillStyle = '#cbd5e1';
          ctx.font = '11px monospace';
          ctx.fillText('Brass coin-operated binoculars aim toward the horizon.', 40, 105);
          ctx.fillText('The final ridge leads directly to the Observatory.', 40, 125);
        } else {
          // Observatory
          ctx.fillText('The domed summit of Starlight Observatory.', 40, 80);
          ctx.fillStyle = '#cbd5e1';
          ctx.font = '11px monospace';
          ctx.fillText('The grand refractor telescope rests beneath the slit.', 40, 105);
          ctx.fillText('Gather all 4 coordinate memories to align the lenses.', 40, 125);
        }
      }

      function formatLocationShort(l) {
        if (l === 'coastal_trail') return 'Trail';
        if (l === 'cottage') return 'Cottage';
        if (l === 'groves') return 'Groves';
        if (l === 'overlook') return 'Overlook';
        if (l === 'observatory') return 'Dome';
        return l;
      }

      function formatLocationLong(l) {
        if (l === 'coastal_trail') return 'Rocky Coastal Trail';
        if (l === 'cottage') return 'Fisherman Homestead';
        if (l === 'groves') return 'Whispering Pine Groves';
        if (l === 'overlook') return 'Cliffside Promontory Overlook';
        if (l === 'observatory') return 'Starlight Observatory Dome';
        return l;
      }

      function formatActionTitle(act) {
        if (act === 'walk:coastal_trail') return '🚶 Walk to Coastal Trail';
        if (act === 'walk:cottage') return '🚶 Walk to Cottage';
        if (act === 'walk:groves') return '🚶 Walk to Whispering Groves';
        if (act === 'walk:overlook') return '🚶 Walk to Cliffside Overlook';
        if (act === 'walk:observatory') return '🚶 Walk to Observatory Dome';
        if (act === 'inspect:cairn') return '🪨 Inspect Stone Cairn';
        if (act === 'inspect:foghorn_post') return '📢 Read Foghorn Plaque';
        if (act === 'inspect:piano') return '🎹 Touch Piano Keys';
        if (act === 'inspect:postcard_desk') return '✉️ Read Unmailed Postcards';
        if (act === 'inspect:windchime_tree') return '🎐 Listen to Windchimes';
        if (act === 'inspect:carved_trunk') return '🌲 Inspect Carved Initials';
        if (act === 'inspect:binoculars') return '🔭 Peer Through Binoculars';
        if (act === 'inspect:weather_station') return '🌡️ Check Barometer';
        if (act === 'inspect:star_chart_desk') return '🗺️ Inspect Star Charts';
        if (act === 'inspect:telescope_console') return '⚙️ Inspect Refractor Console';
        if (act === 'tune:radio') return '📻 Tune Transistor Radio';
        if (act === 'contemplate:surroundings') return '🌿 Pause & Contemplate';
        if (act === 'action:align_telescope') return '✨ ALIGN TELESCOPE & RESTORE BEACON';
        return act;
      }

      function escapeHtml(str) {
        return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }

      // Keyboard navigation
      window.addEventListener('keydown', function(e) {
        if (!state || state.done) return;
        const acts = legalActions(state);
        if (e.key >= '1' && e.key <= '9') {
          const idx = parseInt(e.key, 10) - 1;
          if (idx < acts.length) {
            window.executeAction(acts[idx]);
          }
        }
      });

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(function() {});
      }

      init();
    })();
  </script>
</body>
</html>
