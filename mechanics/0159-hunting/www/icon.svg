<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="forestbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#052e16" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>
    <linearGradient id="antlers" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#forestbg)" />
  <!-- Mountain ridge silhouette -->
  <polygon points="40,380 180,220 310,360 400,260 480,380" fill="#064e3b" opacity="0.7" />
  <polygon points="20,440 140,320 270,440 380,340 500,440" fill="#022c22" />
  <!-- Stag head & antlers -->
  <path d="M 256 340 L 235 280 L 277 280 Z" fill="url(#antlers)" />
  <!-- Antler branches Left -->
  <path d="M 235 280 C 180 240 150 160 170 110 C 185 140 215 160 225 180" stroke="url(#antlers)" stroke-width="12" fill="none" stroke-linecap="round" />
  <path d="M 180 170 C 150 140 130 110 130 90" stroke="url(#antlers)" stroke-width="8" fill="none" stroke-linecap="round" />
  <path d="M 200 210 C 160 200 130 170 120 150" stroke="url(#antlers)" stroke-width="8" fill="none" stroke-linecap="round" />
  <!-- Antler branches Right -->
  <path d="M 277 280 C 332 240 362 160 342 110 C 327 140 297 160 287 180" stroke="url(#antlers)" stroke-width="12" fill="none" stroke-linecap="round" />
  <path d="M 332 170 C 362 140 382 110 382 90" stroke="url(#antlers)" stroke-width="8" fill="none" stroke-linecap="round" />
  <path d="M 312 210 C 352 200 382 170 392 150" stroke="url(#antlers)" stroke-width="8" fill="none" stroke-linecap="round" />
  <!-- Rifle Scope Reticle Crosshairs -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="#ef4444" stroke-width="4" opacity="0.8" />
  <circle cx="256" cy="256" r="80" fill="none" stroke="#ef4444" stroke-width="2" opacity="0.6" />
  <line x1="80" y1="256" x2="432" y2="256" stroke="#ef4444" stroke-width="3" />
  <line x1="256" y1="80" x2="256" y2="432" stroke="#ef4444" stroke-width="3" />
  <circle cx="256" cy="256" r="4" fill="#ef4444" />
</svg>
