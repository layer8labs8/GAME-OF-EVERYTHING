<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1128" />
      <stop offset="50%" stop-color="#1c2541" />
      <stop offset="100%" stop-color="#0b132b" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6d365" />
      <stop offset="100%" stop-color="#fda085" />
    </linearGradient>
    <linearGradient id="dome" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6fffe9" />
      <stop offset="100%" stop-color="#3a506b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="100" fill="url(#bg)" stroke="#3a506b" stroke-width="8" />

  <!-- Laurel Wreath -->
  <g fill="none" stroke="url(#gold)" stroke-width="6" stroke-linecap="round" opacity="0.6">
    <path d="M 110,340 C 90,260 110,180 180,130" />
    <path d="M 402,340 C 422,260 402,180 332,130" />
    <!-- Leaf pairs -->
    <path d="M 120,310 Q 140,300 135,280" />
    <path d="M 110,260 Q 130,250 120,230" />
    <path d="M 118,210 Q 140,205 130,185" />
    <path d="M 140,165 Q 165,165 155,145" />

    <path d="M 392,310 Q 372,300 377,280" />
    <path d="M 402,260 Q 382,250 392,230" />
    <path d="M 394,210 Q 372,205 382,185" />
    <path d="M 372,165 Q 347,165 357,145" />
  </g>

  <!-- Capitol / Parliament Dome -->
  <g filter="url(#glow)">
    <!-- Base podium -->
    <rect x="156" y="360" width="200" height="24" rx="4" fill="#6fffe9" opacity="0.9" />
    <rect x="140" y="384" width="232" height="16" rx="3" fill="#3a506b" />

    <!-- Neoclassical Columns -->
    <rect x="176" y="270" width="18" height="90" rx="3" fill="#ffffff" opacity="0.9" />
    <rect x="214" y="270" width="18" height="90" rx="3" fill="#ffffff" opacity="0.9" />
    <rect x="252" y="270" width="18" height="90" rx="3" fill="#ffffff" opacity="0.9" />
    <rect x="280" y="270" width="18" height="90" rx="3" fill="#ffffff" opacity="0.9" />
    <rect x="318" y="270" width="18" height="90" rx="3" fill="#ffffff" opacity="0.9" />

    <!-- Entablature / Pediment triangle -->
    <polygon points="150,270 256,200 362,270" fill="url(#gold)" />
    
    <!-- Central Dome Rotunda -->
    <path d="M 200,200 C 200,130 312,130 312,200 Z" fill="url(#dome)" stroke="#6fffe9" stroke-width="4" />
    
    <!-- Spire / Finial -->
    <line x1="256" y1="130" x2="256" y2="90" stroke="#f6d365" stroke-width="6" stroke-linecap="round" />
    <circle cx="256" cy="85" r="8" fill="#f6d365" />
  </g>

  <!-- Scales of Justice / Balance Emblem in Pediment -->
  <circle cx="256" cy="242" r="14" fill="#0b132b" stroke="#f6d365" stroke-width="3" />
  <line x1="250" y1="242" x2="262" y2="242" stroke="#f6d365" stroke-width="2" />
  <line x1="256" y1="236" x2="256" y2="248" stroke="#f6d365" stroke-width="2" />
</svg>