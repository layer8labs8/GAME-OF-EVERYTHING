<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#07090e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>Abyssal Crypt</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #07090e;
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  canvas {
    display: block;
    margin: 0 auto;
    touch-action: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="logic.js"></script>
<script>
const { GRID_SIZE, MAX_FLOORS, createState, legalActions, step, isOver, score } = GameLogic;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const W = 360;
const H = 640;

let scale = 1;
function resize() {
  scale = Math.min(innerWidth / W, innerHeight / H);
  const dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.style.width = W * scale + 'px';
  canvas.style.height = H * scale + 'px';
  canvas.width = Math.round(W * scale * dpr);
  canvas.height = Math.round(H * scale * dpr);
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
}
addEventListener('resize', resize);
resize();

let best = 0;
try { best = +localStorage.getItem('goe-0121-best') || 0; } catch (e) {}

let state = createState(Date.now());
let overAt = 0;

function restart() {
  state = createState(Date.now());
  overAt = 0;
}

function rrect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function toLogical(e) {
  const rect = canvas.getBoundingClientRect();
  return { x: (e.clientX - rect.left) / scale, y: (e.clientY - rect.top) / scale };
}

function tryAction(act) {
  if (isOver(state)) return;
  const legal = legalActions(state);
  if (!legal.includes(act)) return;

  try {
    step(state, act);
    if (isOver(state)) {
      overAt = performance.now();
      const sc = score(state);
      if (sc > best) {
        best = sc;
        try { localStorage.setItem('goe-0121-best', best); } catch (e) {}
      }
    }
  } catch (err) {
    // Action failed
  }
}

// Map dimensions on canvas
const TILE_SIZE = 38;
const MAP_OFFSET_X = Math.round((W - GRID_SIZE * TILE_SIZE) / 2);
const MAP_OFFSET_Y = 110;

// Virtual D-pad geometry
const DPAD_CX = 95;
const DPAD_CY = 515;
const DPAD_BTN = 44;

canvas.addEventListener('pointerdown', (e) => {
  const p = toLogical(e);
  if (isOver(state)) {
    if (performance.now() - overAt > 400) restart();
    return;
  }

  // Check tap directly on adjacent map tile
  if (p.x >= MAP_OFFSET_X && p.x <= MAP_OFFSET_X + GRID_SIZE * TILE_SIZE &&
      p.y >= MAP_OFFSET_Y && p.y <= MAP_OFFSET_Y + GRID_SIZE * TILE_SIZE) {
    const tx = Math.floor((p.x - MAP_OFFSET_X) / TILE_SIZE);
    const ty = Math.floor((p.y - MAP_OFFSET_Y) / TILE_SIZE);
    const dx = tx - state.hero.x;
    const dy = ty - state.hero.y;

    if (dx === 0 && dy === -1) { tryAction('move_up'); return; }
    if (dx === 0 && dy === 1) { tryAction('move_down'); return; }
    if (dx === -1 && dy === 0) { tryAction('move_left'); return; }
    if (dx === 1 && dy === 0) { tryAction('move_right'); return; }
  }

  // D-Pad Up
  if (p.x >= DPAD_CX - DPAD_BTN / 2 && p.x <= DPAD_CX + DPAD_BTN / 2 &&
      p.y >= DPAD_CY - DPAD_BTN * 1.5 && p.y <= DPAD_CY - DPAD_BTN * 0.5) {
    tryAction('move_up');
    return;
  }
  // D-Pad Down
  if (p.x >= DPAD_CX - DPAD_BTN / 2 && p.x <= DPAD_CX + DPAD_BTN / 2 &&
      p.y >= DPAD_CY + DPAD_BTN * 0.5 && p.y <= DPAD_CY + DPAD_BTN * 1.5) {
    tryAction('move_down');
    return;
  }
  // D-Pad Left
  if (p.x >= DPAD_CX - DPAD_BTN * 1.5 && p.x <= DPAD_CX - DPAD_BTN * 0.5 &&
      p.y >= DPAD_CY - DPAD_BTN / 2 && p.y <= DPAD_CY + DPAD_BTN / 2) {
    tryAction('move_left');
    return;
  }
  // D-Pad Right
  if (p.x >= DPAD_CX + DPAD_BTN * 0.5 && p.x <= DPAD_CX + DPAD_BTN * 1.5 &&
      p.y >= DPAD_CY - DPAD_BTN / 2 && p.y <= DPAD_CY + DPAD_BTN / 2) {
    tryAction('move_right');
    return;
  }
  // D-Pad Center (Wait)
  if (p.x >= DPAD_CX - DPAD_BTN / 2 && p.x <= DPAD_CX + DPAD_BTN / 2 &&
      p.y >= DPAD_CY - DPAD_BTN / 2 && p.y <= DPAD_CY + DPAD_BTN / 2) {
    tryAction('wait');
    return;
  }

  // Tactical Buttons (Right Side)
  // Potion Button (x: 195 to 335, y: 460 to 505)
  if (p.x >= 195 && p.x <= 335 && p.y >= 460 && p.y <= 505) {
    tryAction('use_potion');
    return;
  }

  // Pray Altar Button (x: 195 to 335, y: 515 to 560)
  if (p.x >= 195 && p.x <= 335 && p.y >= 515 && p.y <= 560) {
    tryAction('pray_altar');
    return;
  }

  // Descend Stairs Button (x: 195 to 335, y: 570 to 615)
  if (p.x >= 195 && p.x <= 335 && p.y >= 570 && p.y <= 615) {
    tryAction('descend');
    return;
  }
});

addEventListener('keydown', (e) => {
  if (isOver(state)) {
    if ((e.key === ' ' || e.key === 'Enter') && performance.now() - overAt > 400) restart();
    return;
  }
  if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') tryAction('move_up');
  else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') tryAction('move_down');
  else if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') tryAction('move_left');
  else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') tryAction('move_right');
  else if (e.key === 'p' || e.key === 'P' || e.key === '1') tryAction('use_potion');
  else if (e.key === 'a' || e.key === 'A' || e.key === '2') tryAction('pray_altar');
  else if (e.key === 'Enter') {
    const tile = state.map[state.hero.y][state.hero.x];
    if (tile === '>') tryAction('descend');
    else tryAction('wait');
  } else if (e.key === ' ') tryAction('wait');
  else if (e.key === 'r') restart();
});

function draw() {
  ctx.fillStyle = '#07090e';
  ctx.fillRect(0, 0, W, H);

  // Top Status Bar
  ctx.fillStyle = '#111827';
  rrect(15, 12, W - 30, 48, 10);
  ctx.fill();

  ctx.fillStyle = '#94a3b8';
  ctx.font = '10px system-ui, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('CRYPT DEPTH', 28, 28);
  ctx.textAlign = 'center';
  ctx.fillText('ENEMIES SLAIN', W / 2, 28);
  ctx.textAlign = 'right';
  ctx.fillText('SCORE', W - 28, 28);

  ctx.font = 'bold 16px system-ui, sans-serif';
  ctx.fillStyle = '#a855f7';
  ctx.textAlign = 'left';
  ctx.fillText(`Floor ${state.floor} / ${MAX_FLOORS}`, 28, 48);

  ctx.fillStyle = '#f87171';
  ctx.textAlign = 'center';
  ctx.fillText(state.stats.kills, W / 2, 48);

  ctx.fillStyle = '#fbbf24';
  ctx.textAlign = 'right';
  ctx.fillText(score(state), W - 28, 48);

  // Hero Stats Strip
  ctx.fillStyle = '#1e293b';
  rrect(15, 68, W - 30, 32, 8);
  ctx.fill();

  ctx.textAlign = 'left';
  ctx.font = 'bold 12px system-ui, sans-serif';
  ctx.fillStyle = state.hero.hp <= 10 ? '#ef4444' : '#22c55e';
  ctx.fillText(`HP ${state.hero.hp}/${state.hero.maxHp}`, 26, 88);

  ctx.fillStyle = '#f97316';
  ctx.fillText(`ATK ${state.hero.atk}`, 115, 88);

  ctx.fillStyle = '#38bdf8';
  ctx.fillText(`DEF ${state.hero.def}`, 180, 88);

  ctx.fillStyle = '#fbbf24';
  ctx.fillText(`$ ${state.hero.gold}`, 240, 88);

  ctx.fillStyle = '#ec4899';
  ctx.fillText(`🧪 ${state.hero.potions}`, 298, 88);

  // Draw 8x8 Dungeon Grid
  for (let y = 0; y < GRID_SIZE; y++) {
    for (let x = 0; x < GRID_SIZE; x++) {
      const rx = MAP_OFFSET_X + x * TILE_SIZE;
      const ry = MAP_OFFSET_Y + y * TILE_SIZE;
      const revealed = state.fog[y][x];

      if (!revealed) {
        ctx.fillStyle = '#05070b';
        ctx.fillRect(rx, ry, TILE_SIZE, TILE_SIZE);
        continue;
      }

      const cell = state.map[y][x];
      if (cell === '#') {
        ctx.fillStyle = '#1f2937';
        ctx.fillRect(rx, ry, TILE_SIZE, TILE_SIZE);
        ctx.strokeStyle = '#111827';
        ctx.strokeRect(rx, ry, TILE_SIZE, TILE_SIZE);
      } else {
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(rx, ry, TILE_SIZE, TILE_SIZE);
        ctx.strokeStyle = '#1e293b';
        ctx.strokeRect(rx, ry, TILE_SIZE, TILE_SIZE);

        if (cell === '>') {
          ctx.fillStyle = '#38bdf8';
          ctx.font = 'bold 20px system-ui, sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('▼', rx + TILE_SIZE / 2, ry + 26);
        } else if (cell === 'A') {
          ctx.fillStyle = '#e879f9';
          ctx.font = 'bold 16px system-ui, sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('☥', rx + TILE_SIZE / 2, ry + 25);
        }
      }

      // Draw Item
      const it = state.items.find((i) => i.x === x && i.y === y);
      if (it) {
        ctx.textAlign = 'center';
        if (it.type === 'gold') {
          ctx.fillStyle = '#fbbf24';
          ctx.font = 'bold 15px system-ui, sans-serif';
          ctx.fillText('$', rx + TILE_SIZE / 2, ry + 25);
        } else if (it.type === 'potion') {
          ctx.fillStyle = '#ef4444';
          ctx.font = 'bold 14px system-ui, sans-serif';
          ctx.fillText('🧪', rx + TILE_SIZE / 2, ry + 25);
        } else if (it.type === 'relic') {
          ctx.fillStyle = '#a855f7';
          ctx.font = 'bold 14px system-ui, sans-serif';
          ctx.fillText('★', rx + TILE_SIZE / 2, ry + 25);
        }
      }

      // Draw Enemy
      const en = state.enemies.find((e) => e.x === x && e.y === y);
      if (en) {
        ctx.fillStyle = en.type === 'arch_lich' ? '#a855f7' : en.type === 'orc_berserker' ? '#ea580c' : '#ef4444';
        ctx.beginPath();
        ctx.arc(rx + TILE_SIZE / 2, ry + TILE_SIZE / 2, 12, 0, Math.PI * 2);
        ctx.fill();

        // Enemy HP bar
        const hpRatio = Math.max(0, en.hp / en.maxHp);
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(rx + 6, ry + 2, TILE_SIZE - 12, 3);
        ctx.fillStyle = '#22c55e';
        ctx.fillRect(rx + 6, ry + 2, (TILE_SIZE - 12) * hpRatio, 3);
      }

      // Draw Hero
      if (state.hero.x === x && state.hero.y === y) {
        ctx.fillStyle = '#38bdf8';
        ctx.beginPath();
        ctx.arc(rx + TILE_SIZE / 2, ry + TILE_SIZE / 2, 13, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(rx + TILE_SIZE / 2, ry + TILE_SIZE / 2, 6, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  // Relic Showcase bar
  ctx.fillStyle = '#111827';
  rrect(15, 422, W - 30, 26, 6);
  ctx.fill();

  ctx.fillStyle = '#94a3b8';
  ctx.font = '10px system-ui, sans-serif';
  ctx.textAlign = 'left';
  const relicsStr = state.hero.relics.length ? state.hero.relics.map((r) => r.replace('_', ' ')).join(', ') : 'None yet';
  ctx.fillText(`Relics: ${relicsStr}`, 24, 439);

  // Virtual D-pad
  ctx.fillStyle = '#1e293b';
  // Up
  rrect(DPAD_CX - 20, DPAD_CY - 60, 40, 36, 8);
  ctx.fill();
  // Down
  rrect(DPAD_CX - 20, DPAD_CY + 24, 40, 36, 8);
  ctx.fill();
  // Left
  rrect(DPAD_CX - 60, DPAD_CY - 18, 36, 36, 8);
  ctx.fill();
  // Right
  rrect(DPAD_CX + 24, DPAD_CY - 18, 36, 36, 8);
  ctx.fill();
  // Center (Wait)
  rrect(DPAD_CX - 18, DPAD_CY - 18, 36, 36, 8);
  ctx.fillStyle = '#334155';
  ctx.fill();

  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 14px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('▲', DPAD_CX, DPAD_CY - 37);
  ctx.fillText('▼', DPAD_CX, DPAD_CY + 47);
  ctx.fillText('◀', DPAD_CX - 42, DPAD_CY + 5);
  ctx.fillText('▶', DPAD_CX + 42, DPAD_CY + 5);
  ctx.font = '10px system-ui, sans-serif';
  ctx.fillText('WAIT', DPAD_CX, DPAD_CY + 4);

  // Tactical Buttons Right Side
  const acts = legalActions(state);

  // Use Potion
  const canPot = acts.includes('use_potion');
  ctx.fillStyle = canPot ? '#b91c1c' : '#1f2937';
  rrect(195, 460, 140, 42, 8);
  ctx.fill();
  ctx.fillStyle = canPot ? '#ffffff' : '#4b5563';
  ctx.font = 'bold 12px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('DRINK POTION (+20)', 265, 485);

  // Pray Altar
  const canAltar = acts.includes('pray_altar');
  ctx.fillStyle = canAltar ? '#7e22ce' : '#1f2937';
  rrect(195, 512, 140, 42, 8);
  ctx.fill();
  ctx.fillStyle = canAltar ? '#ffffff' : '#4b5563';
  ctx.fillText('PRAY ALTAR (-6 HP)', 265, 537);

  // Descend Stairs
  const canDesc = acts.includes('descend');
  ctx.fillStyle = canDesc ? '#0284c7' : '#1f2937';
  rrect(195, 564, 140, 42, 8);
  ctx.fill();
  ctx.fillStyle = canDesc ? '#ffffff' : '#4b5563';
  ctx.fillText(state.floor >= MAX_FLOORS ? 'VICTORY ESCAPE' : 'DESCEND STAIRS', 265, 589);

  // Game Over Overlay
  if (isOver(state)) {
    ctx.fillStyle = 'rgba(7, 9, 14, 0.92)';
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = state.won ? '#4ade80' : '#ef4444';
    ctx.font = 'bold 26px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(state.won ? 'CRYPT CONQUERED!' : 'PERISHED IN DEPTHS', W / 2, H / 2 - 60);

    ctx.fillStyle = '#e2e8f0';
    ctx.font = '15px system-ui, sans-serif';
    ctx.fillText(`Floor Reached: ${state.floor} / ${MAX_FLOORS}`, W / 2, H / 2 - 20);
    ctx.fillText(`Monsters Slain: ${state.stats.kills}`, W / 2, H / 2 + 5);
    ctx.fillText(`Relics Collected: ${state.hero.relics.length}`, W / 2, H / 2 + 30);

    ctx.fillStyle = '#fbbf24';
    ctx.font = 'bold 24px system-ui, sans-serif';
    ctx.fillText(`Final Score: ${score(state)}`, W / 2, H / 2 + 75);

    ctx.fillStyle = '#38bdf8';
    ctx.font = 'bold 14px system-ui, sans-serif';
    ctx.fillText('Tap anywhere to begin new run', W / 2, H / 2 + 120);
  }
}

function frame(now) {
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

const inApk = window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform();
if (!inApk && 'serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
