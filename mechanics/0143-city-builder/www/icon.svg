<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b121e"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <!-- Skyline skyscrapers -->
  <rect x="80" y="240" width="70" height="180" rx="8" fill="#38bdf8"/>
  <rect x="170" y="140" width="85" height="280" rx="8" fill="#10b981"/>
  <rect x="275" y="200" width="75" height="220" rx="8" fill="#f59e0b"/>
  <rect x="370" y="280" width="60" height="140" rx="8" fill="#818cf8"/>
  <!-- Highway strip -->
  <rect x="50" y="420" width="412" height="30" rx="6" fill="#475569"/>
  <line x1="70" y1="435" x2="442" y2="435" stroke="#facc15" stroke-width="4" stroke-dasharray="16, 12"/>
  <!-- Border -->
  <rect x="20" y="20" width="472" height="472" rx="80" fill="none" stroke="#475569" stroke-width="8"/>
</svg>
