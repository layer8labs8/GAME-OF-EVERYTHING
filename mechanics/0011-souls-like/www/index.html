<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#120a0a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>Ashen Knight</title>
<style>
  html, body { margin: 0; height: 100%; background: #120a0a; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; margin: 0 auto; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="logic.js"></script>
<script>
const G = AshenKnight;
const W = G.W;
const H = G.H;
const GROUND = G.GROUND;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let scale = 1;
function resize() {
  scale = Math.min(innerWidth / W, innerHeight / H);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.style.width = W * scale + 'px';
  canvas.style.height = H * scale + 'px';
  canvas.width = Math.round(W * scale * dpr);
  canvas.height = Math.round(H * scale * dpr);
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
}
addEventListener('resize', resize);
resize();

let best = 0;
try { best = +localStorage.getItem('ashen-best') || 0; } catch (e) {}

let state = G.createState(Date.now() >>> 0);
let overAt = 0;
let hitStop = 0;
let shake = 0;
let flash = 0;
let clock = 0;
const particles = [];
const floaters = [];

// ---------- Input ----------
// On-canvas controls. Left: drag pad for walking. Right: action buttons. Arena: tap = light, swipe = roll.
const PAD = { x: 70, y: 572, r: 52 };
const BUTTONS = [
  { id: 'heavy', label: 'HEAVY', key: 'K', x: 178, y: 532, r: 30, color: '#f97316' },
  { id: 'parry', label: 'PARRY', key: 'L', x: 248, y: 520, r: 28, color: '#facc15' },
  { id: 'heal', label: 'FLASK', key: 'H', x: 316, y: 520, r: 26, color: '#22c55e' },
  { id: 'light', label: 'SLASH', key: 'J', x: 190, y: 600, r: 34, color: '#e2e8f0' },
  { id: 'roll', label: 'ROLL', key: 'SPC', x: 262, y: 594, r: 30, color: '#38bdf8' },
  { id: 'block', label: 'BLOCK', key: 'SHIFT', x: 326, y: 590, r: 26, color: '#a78bfa', hold: true },
];
const pointers = new Map();
const keys = { left: false, right: false, block: false };
let pendingAction = null;
const pressedAt = {};

function toLocal(e) {
  const rect = canvas.getBoundingClientRect();
  return { x: (e.clientX - rect.left) / scale, y: (e.clientY - rect.top) / scale };
}

function buttonAt(x, y) {
  for (const b of BUTTONS) {
    const dx = x - b.x;
    const dy = y - b.y;
    if (dx * dx + dy * dy <= (b.r + 8) * (b.r + 8)) return b;
  }
  return null;
}

function trigger(action) {
  pendingAction = action;
  pressedAt[action] = clock;
}

function restart() {
  state = G.createState(Date.now() >>> 0);
  particles.length = 0;
  floaters.length = 0;
  pendingAction = null;
}

canvas.addEventListener('pointerdown', (e) => {
  if (e.preventDefault) e.preventDefault();
  if (state.won || state.lost) {
    if (performance.now() - overAt > 600) restart();
    return;
  }
  const p = toLocal(e);
  const id = e.pointerId === undefined ? 0 : e.pointerId;
  if (canvas.setPointerCapture && e.pointerId !== undefined) {
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  }
  const b = buttonAt(p.x, p.y);
  if (b) {
    pointers.set(id, { role: 'button', id: b.id });
    if (!b.hold) trigger(b.id);
    else pressedAt.block = clock;
    return;
  }
  if (p.y >= 500 && p.x < 150) {
    pointers.set(id, { role: 'pad', sx: p.x, x: p.x });
    return;
  }
  if (p.y < 500) {
    pointers.set(id, { role: 'arena', sx: p.x, sy: p.y, t: clock });
  }
});

canvas.addEventListener('pointermove', (e) => {
  const id = e.pointerId === undefined ? 0 : e.pointerId;
  const ptr = pointers.get(id);
  if (!ptr) return;
  const p = toLocal(e);
  if (ptr.role === 'pad') ptr.x = p.x;
  if (ptr.role === 'arena') {
    const dx = p.x - ptr.sx;
    const dy = p.y - ptr.sy;
    if (!ptr.used && Math.abs(dx) > 28 && Math.abs(dx) > Math.abs(dy)) {
      ptr.used = true;
      ptr.swipeDir = Math.sign(dx);
      trigger('roll');
    }
  }
});

function endPointer(e) {
  const id = e.pointerId === undefined ? 0 : e.pointerId;
  const ptr = pointers.get(id);
  if (ptr && ptr.role === 'arena' && !ptr.used) trigger('light');
  pointers.delete(id);
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', (e) => {
  const id = e.pointerId === undefined ? 0 : e.pointerId;
  pointers.delete(id);
});

addEventListener('keydown', (e) => {
  const k = e.key;
  if ((state.won || state.lost) && (k === ' ' || k === 'Enter')) {
    if (performance.now() - overAt > 600) restart();
    return;
  }
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') keys.left = true;
  else if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.right = true;
  else if (k === 'Shift' || k === 's' || k === 'S' || k === 'ArrowDown') keys.block = true;
  else if (e.repeat) return;
  else if (k === 'j' || k === 'J' || k === 'z' || k === 'Z') trigger('light');
  else if (k === 'k' || k === 'K' || k === 'x' || k === 'X') trigger('heavy');
  else if (k === ' ' || k === 'ArrowUp' || k === 'w' || k === 'W') trigger('roll');
  else if (k === 'l' || k === 'L' || k === 'c' || k === 'C') trigger('parry');
  else if (k === 'h' || k === 'H' || k === 'e' || k === 'E') trigger('heal');
  else if (k === 'r' || k === 'R') restart();
});
addEventListener('keyup', (e) => {
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') keys.left = false;
  else if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.right = false;
  else if (k === 'Shift' || k === 's' || k === 'S' || k === 'ArrowDown') keys.block = false;
});

function currentInput() {
  let move = 0;
  let block = keys.block;
  let swipeDir = 0;
  for (const ptr of pointers.values()) {
    if (ptr.role === 'pad') move += Math.max(-1, Math.min(1, (ptr.x - ptr.sx) / 36));
    if (ptr.role === 'button' && ptr.id === 'block') block = true;
    if (ptr.role === 'arena' && ptr.swipeDir) swipeDir = ptr.swipeDir;
  }
  if (keys.left) move -= 1;
  if (keys.right) move += 1;
  move = Math.max(-1, Math.min(1, move));
  if (pendingAction === 'roll' && swipeDir) move = swipeDir;
  const input = { move, block, action: pendingAction };
  pendingAction = null;
  return input;
}

// ---------- Feedback ----------
function burst(x, y, color, n, speed) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const v = speed * (0.4 + Math.random() * 0.8);
    particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 60, life: 0.5 + Math.random() * 0.4, max: 0.9, color, r: 1.5 + Math.random() * 2.5 });
  }
}
function floatText(x, y, text, color) {
  floaters.push({ x, y, text, color, life: 0.9 });
}
function buzz(ms) {
  if (navigator.vibrate) {
    try { navigator.vibrate(ms); } catch (e) {}
  }
}

function handleEvents() {
  for (const ev of state.events) {
    const y = GROUND - 50;
    if (ev.type === 'hit') {
      hitStop = 0.05; shake = Math.max(shake, 3);
      burst(ev.x, y, '#fde68a', 10, 160); floatText(ev.x, y - 40, '-' + ev.v, '#fde68a');
    } else if (ev.type === 'critical') {
      hitStop = 0.14; shake = 10; flash = 0.25;
      burst(ev.x, y, '#f87171', 30, 260); floatText(ev.x, y - 60, 'CRITICAL ' + ev.v, '#f87171'); buzz(40);
    } else if (ev.type === 'parry') {
      hitStop = 0.12; shake = 6; flash = 0.18;
      burst(ev.x, y - 10, '#facc15', 24, 240); floatText(ev.x, y - 70, 'PARRY!', '#facc15'); buzz(25);
    } else if (ev.type === 'dodge') {
      floatText(ev.x, y - 50, 'EVADE', '#38bdf8');
    } else if (ev.type === 'block') {
      shake = Math.max(shake, 4); burst(ev.x + 14, y, '#c4b5fd', 8, 120); floatText(ev.x, y - 50, 'BLOCK -' + ev.v, '#c4b5fd');
    } else if (ev.type === 'guardbreak') {
      floatText(ev.x, y - 70, 'GUARD BROKEN', '#fb7185');
    } else if (ev.type === 'hurt') {
      hitStop = 0.08; shake = 9; flash = 0.3;
      burst(ev.x, y, '#ef4444', 18, 200); floatText(ev.x, y - 50, '-' + ev.v, '#ef4444'); buzz(60);
    } else if (ev.type === 'slam') {
      shake = 12; burst(ev.x, GROUND, '#fb923c', 26, 220);
    } else if (ev.type === 'stagger') {
      floatText(ev.x, y - 90, 'STAGGERED', '#fbbf24');
    } else if (ev.type === 'heal') {
      burst(ev.x, y, '#4ade80', 16, 100); floatText(ev.x, y - 50, '+' + ev.v, '#4ade80');
    } else if (ev.type === 'phase') {
      shake = 14; flash = 0.5; burst(ev.x, y - 30, '#f97316', 40, 300); floatText(W / 2, 200, 'THE EMBER LORD AWAKENS', '#fb923c');
    } else if (ev.type === 'whiff') {
      burst(ev.x, y, 'rgba(226,232,240,0.6)', 4, 60);
    } else if (ev.type === 'victory' || ev.type === 'death' || ev.type === 'timeout') {
      overAt = performance.now();
      if (state.scoreVal > best) {
        best = state.scoreVal;
        try { localStorage.setItem('ashen-best', best); } catch (e) {}
      }
      if (ev.type === 'victory') burst(ev.x, y - 40, '#fbbf24', 60, 320);
    }
  }
}

// ---------- Drawing ----------
const embers = [];
for (let i = 0; i < 40; i++) embers.push({ x: Math.random() * W, y: Math.random() * GROUND, s: 10 + Math.random() * 30, r: 0.8 + Math.random() * 1.6 });

function drawBackground(dt) {
  const g = ctx.createLinearGradient(0, 0, 0, GROUND);
  g.addColorStop(0, '#1a0b0b');
  g.addColorStop(1, state.boss.phase === 2 ? '#4a1408' : '#2a1410');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, GROUND);
  // Cathedral pillars and window arches
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  for (let i = 0; i < 4; i++) {
    const x = 20 + i * 100;
    ctx.fillRect(x, 90, 26, GROUND - 90);
    ctx.beginPath();
    ctx.arc(x + 63, 170, 24, Math.PI, 0);
    ctx.lineTo(x + 87, 260);
    ctx.lineTo(x + 39, 260);
    ctx.closePath();
    ctx.fill();
  }
  for (const e of embers) {
    e.y -= e.s * dt;
    e.x += Math.sin(clock * 2 + e.s) * 8 * dt;
    if (e.y < 70) { e.y = GROUND; e.x = Math.random() * W; }
    ctx.fillStyle = 'rgba(251,146,60,' + (0.3 + 0.3 * Math.sin(clock * 4 + e.s)) + ')';
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
    ctx.fill();
  }
  // Floor
  const fg = ctx.createLinearGradient(0, GROUND, 0, 500);
  fg.addColorStop(0, '#3b2a24');
  fg.addColorStop(1, '#140c0a');
  ctx.fillStyle = fg;
  ctx.fillRect(0, GROUND, W, 500 - GROUND);
  ctx.strokeStyle = 'rgba(0,0,0,0.4)';
  ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 40) {
    ctx.beginPath();
    ctx.moveTo(x, GROUND);
    ctx.lineTo(x - 20, 500);
    ctx.stroke();
  }
}

function drawShadow(x, w) {
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.beginPath();
  ctx.ellipse(x, GROUND + 4, w, 6, 0, 0, Math.PI * 2);
  ctx.fill();
}

function drawKnight() {
  const p = state.player;
  const f = p.facing;
  const x = p.x;
  drawShadow(x, 18);
  ctx.save();
  ctx.translate(x, GROUND);
  if (p.move === 'roll') {
    const t = p.moveT / G.MOVES.roll.end;
    const inv = p.moveT >= G.MOVES.roll.iStart && p.moveT <= G.MOVES.roll.iEnd;
    ctx.translate(0, -16);
    ctx.rotate(t * Math.PI * 2 * p.moveDir);
    ctx.fillStyle = inv ? 'rgba(148,163,184,0.55)' : '#94a3b8';
    ctx.beginPath();
    ctx.arc(0, 0, 15, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#475569';
    ctx.fillRect(-3, -15, 6, 10);
    ctx.restore();
    return;
  }
  const hurt = p.move === 'hurt';
  const bob = p.move === null ? Math.sin(clock * 6) * 1.2 : 0;
  ctx.scale(f, 1);
  if (hurt) ctx.translate(-6 * Math.max(0, 1 - p.moveT * 3), 0);
  // Legs
  ctx.fillStyle = '#334155';
  ctx.fillRect(-9, -26, 7, 26);
  ctx.fillRect(2, -26, 7, 26);
  // Body
  ctx.fillStyle = hurt ? '#f87171' : '#94a3b8';
  ctx.fillRect(-12, -56 + bob, 24, 32);
  ctx.fillStyle = '#7f1d1d';
  ctx.fillRect(-12, -40 + bob, 24, 5);
  // Helmet
  ctx.fillStyle = hurt ? '#fca5a5' : '#cbd5e1';
  ctx.beginPath();
  ctx.arc(0, -66 + bob, 10, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#0f172a';
  ctx.fillRect(2, -68 + bob, 8, 3);
  // Shield (raised when blocking or parrying)
  const guard = p.blocking || p.move === 'parry';
  ctx.save();
  ctx.translate(guard ? 14 : -10, guard ? -52 : -44);
  ctx.fillStyle = p.move === 'parry' && p.moveT <= G.MOVES.parry.guard ? '#fde047' : '#78716c';
  ctx.beginPath();
  ctx.moveTo(-6, -14);
  ctx.lineTo(6, -14);
  ctx.lineTo(6, 6);
  ctx.lineTo(0, 14);
  ctx.lineTo(-6, 6);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
  // Sword arm: angle follows the attack phase
  let ang = -0.4;
  if (p.move === 'light' || p.move === 'heavy') {
    const m = G.MOVES[p.move];
    if (p.moveT < m.hit) ang = -0.4 - 1.8 * (p.moveT / m.hit);
    else ang = -2.2 + 3.4 * Math.min(1, (p.moveT - m.hit) / 0.1);
  } else if (p.move === 'heal') {
    ang = -1.2;
  }
  ctx.save();
  ctx.translate(8, -50 + bob);
  ctx.rotate(ang);
  ctx.fillStyle = '#e2e8f0';
  ctx.fillRect(0, -2, p.move === 'heavy' ? 46 : 38, 4);
  ctx.fillStyle = '#a16207';
  ctx.fillRect(-4, -5, 4, 10);
  ctx.restore();
  // Swing arc right after the blow
  if ((p.move === 'light' || p.move === 'heavy') && p.moveT >= G.MOVES[p.move].hit && p.moveT < G.MOVES[p.move].hit + 0.12) {
    ctx.strokeStyle = p.move === 'heavy' ? 'rgba(251,146,60,0.8)' : 'rgba(255,255,255,0.75)';
    ctx.lineWidth = p.move === 'heavy' ? 6 : 4;
    ctx.beginPath();
    ctx.arc(8, -50, G.MOVES[p.move].range * 0.6, -1.6, 0.9);
    ctx.stroke();
  }
  if (p.move === 'heal') {
    ctx.fillStyle = 'rgba(74,222,128,' + (0.25 + 0.2 * Math.sin(clock * 20)) + ')';
    ctx.beginPath();
    ctx.arc(0, -40, 30, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function drawBoss() {
  const b = state.boss;
  if (b.hp <= 0 && state.won) return;
  const a = G.ATTACKS[b.attack];
  let lift = 0;
  let tilt = 0;
  const windup = b.mode === 'windup' && a;
  const wt = windup ? Math.min(1, b.modeT / a.windup) : 0;
  if (windup && b.attack === 'slam') lift = Math.sin(wt * Math.PI * 0.5) * 150;
  if (windup && b.attack !== 'slam') tilt = -0.25 * wt;
  // Slam landing marker
  if (windup && b.attack === 'slam') {
    ctx.fillStyle = 'rgba(239,68,68,' + (0.15 + 0.35 * wt) + ')';
    ctx.beginPath();
    ctx.ellipse(b.targetX, GROUND + 2, a.radius, 10, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  drawShadow(b.x, 34 - lift * 0.1);
  ctx.save();
  ctx.translate(b.x, GROUND - lift);
  ctx.scale(b.facing, 1);
  ctx.rotate(tilt);
  const stag = b.mode === 'stagger';
  if (stag) ctx.rotate(Math.sin(clock * 10) * 0.08);
  // Body
  const glow = b.phase === 2 ? '#f97316' : '#b91c1c';
  ctx.fillStyle = '#1c1917';
  ctx.fillRect(-26, -40, 20, 40);
  ctx.fillRect(6, -40, 20, 40);
  ctx.fillStyle = '#292524';
  ctx.beginPath();
  ctx.moveTo(-34, -40);
  ctx.lineTo(34, -40);
  ctx.lineTo(28, -112);
  ctx.lineTo(-28, -112);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = glow;
  ctx.fillRect(-20, -86, 40, 6);
  // Head and horns
  ctx.fillStyle = '#1c1917';
  ctx.beginPath();
  ctx.arc(0, -126, 17, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#57534e';
  ctx.beginPath();
  ctx.moveTo(-12, -136); ctx.lineTo(-26, -162); ctx.lineTo(-4, -140); ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(12, -136); ctx.lineTo(26, -162); ctx.lineTo(4, -140); ctx.closePath(); ctx.fill();
  ctx.fillStyle = windup ? '#fef08a' : glow;
  ctx.fillRect(3, -130, 10, 4);
  // Greatsword
  let sw = 0.6;
  if (windup) sw = 0.6 - 2.6 * wt;
  if (b.mode === 'active') sw = 1.6;
  if (b.mode === 'recover') sw = 1.6 - Math.min(1, b.modeT) * 1.0;
  ctx.save();
  ctx.translate(20, -90);
  ctx.rotate(sw);
  ctx.fillStyle = b.phase === 2 ? '#fdba74' : '#a8a29e';
  ctx.fillRect(0, -5, b.attack === 'jab' && windup ? 64 : 84, 10);
  ctx.fillStyle = '#44403c';
  ctx.fillRect(-8, -9, 10, 18);
  ctx.restore();
  // Telegraph glint
  if (windup) {
    ctx.fillStyle = 'rgba(254,240,138,' + (0.4 + 0.6 * wt) + ')';
    ctx.font = 'bold 26px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('!', 0, -176);
  }
  if (b.mode === 'active' && (b.attack === 'cleave' || b.attack === 'jab')) {
    ctx.strokeStyle = 'rgba(248,113,113,0.85)';
    ctx.lineWidth = 7;
    ctx.beginPath();
    ctx.arc(20, -70, a.range * 0.75, -0.9, 1.3);
    ctx.stroke();
  }
  ctx.restore();
  if (stag) {
    for (let i = 0; i < 3; i++) {
      const ang = clock * 4 + (i * Math.PI * 2) / 3;
      ctx.fillStyle = '#fbbf24';
      ctx.beginPath();
      ctx.arc(b.x + Math.cos(ang) * 22, GROUND - 170 + Math.sin(ang) * 6, 4, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

function drawWaves() {
  for (const wv of state.waves) {
    const g = ctx.createLinearGradient(wv.x, GROUND - 40, wv.x, GROUND);
    g.addColorStop(0, 'rgba(251,146,60,0)');
    g.addColorStop(1, 'rgba(249,115,22,0.95)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(wv.x - 16, GROUND);
    ctx.quadraticCurveTo(wv.x, GROUND - 46 - Math.sin(clock * 30) * 6, wv.x + 16, GROUND);
    ctx.closePath();
    ctx.fill();
  }
}

function bar(x, y, w, h, frac, color, back) {
  ctx.fillStyle = back || 'rgba(0,0,0,0.6)';
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = color;
  ctx.fillRect(x, y, w * Math.max(0, Math.min(1, frac)), h);
}

function drawHud() {
  const b = state.boss;
  const p = state.player;
  ctx.fillStyle = '#fde68a';
  ctx.font = 'bold 14px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(b.name + (b.phase === 2 ? ' - Enraged' : ''), W / 2, 26);
  bar(30, 34, W - 60, 10, b.hp / b.maxHp, b.phase === 2 ? '#f97316' : '#dc2626');
  bar(30, 47, W - 60, 4, b.poise / b.maxPoise, '#fbbf24');
  ctx.fillStyle = '#e7e5e4';
  ctx.font = '13px system-ui, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('Score ' + state.scoreVal, 12, 72);
  ctx.textAlign = 'right';
  ctx.fillText('Best ' + best + '   ' + Math.max(0, Math.ceil(G.TIME_LIMIT - state.time)) + 's', W - 12, 72);
  // Player bars under the floor
  bar(14, 456, 200, 10, p.hp / p.maxHp, '#ef4444');
  bar(14, 470, 200, 6, p.stamina / p.maxStamina, p.staminaDelay > 0 ? '#65a30d' : '#84cc16');
  for (let i = 0; i < 3; i++) {
    ctx.fillStyle = i < p.flasks ? '#22c55e' : 'rgba(255,255,255,0.15)';
    ctx.beginPath();
    ctx.arc(232 + i * 18, 466, 6, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawControls() {
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(0, 500, W, H - 500);
  // Movement pad
  let padX = PAD.x;
  for (const ptr of pointers.values()) {
    if (ptr.role === 'pad') padX = PAD.x + Math.max(-36, Math.min(36, ptr.x - ptr.sx));
  }
  if (keys.left) padX = PAD.x - 36;
  if (keys.right) padX = PAD.x + 36;
  ctx.strokeStyle = 'rgba(255,255,255,0.25)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(PAD.x, PAD.y, PAD.r, 0, Math.PI * 2);
  ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.font = '18px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('\u25C0', PAD.x - 36, PAD.y + 6);
  ctx.fillText('\u25B6', PAD.x + 36, PAD.y + 6);
  ctx.fillStyle = 'rgba(226,232,240,0.85)';
  ctx.beginPath();
  ctx.arc(padX, PAD.y, 20, 0, Math.PI * 2);
  ctx.fill();
  // Action buttons
  const p = state.player;
  const cost = { light: G.MOVES.light.cost, heavy: G.MOVES.heavy.cost, roll: G.MOVES.roll.cost, parry: G.MOVES.parry.cost };
  let blockHeld = keys.block;
  for (const ptr of pointers.values()) if (ptr.role === 'button' && ptr.id === 'block') blockHeld = true;
  for (const b of BUTTONS) {
    const recent = pressedAt[b.id] !== undefined && clock - pressedAt[b.id] < 0.12;
    const down = recent || (b.id === 'block' && blockHeld);
    const usable = b.id === 'heal' ? p.flasks > 0 : b.id === 'block' ? p.stamina > 0 : p.stamina >= cost[b.id];
    ctx.globalAlpha = usable ? 1 : 0.35;
    ctx.fillStyle = down ? b.color : 'rgba(255,255,255,0.08)';
    ctx.strokeStyle = b.color;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(b.x, b.y, down ? b.r - 3 : b.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = down ? '#0c0a09' : b.color;
    ctx.font = 'bold 11px system-ui, sans-serif';
    ctx.fillText(b.label, b.x, b.y + 4);
    ctx.globalAlpha = 1;
  }
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.font = '10px system-ui, sans-serif';
  ctx.fillText('tap = slash \u2022 swipe = roll', PAD.x, 512);
}

function drawEffects(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const q = particles[i];
    q.life -= dt;
    if (q.life <= 0) { particles.splice(i, 1); continue; }
    q.vy += 400 * dt;
    q.x += q.vx * dt;
    q.y += q.vy * dt;
    ctx.globalAlpha = Math.max(0, q.life / q.max);
    ctx.fillStyle = q.color;
    ctx.beginPath();
    ctx.arc(q.x, q.y, q.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center';
  for (let i = floaters.length - 1; i >= 0; i--) {
    const fl = floaters[i];
    fl.life -= dt;
    if (fl.life <= 0) { floaters.splice(i, 1); continue; }
    fl.y -= 40 * dt;
    ctx.globalAlpha = Math.min(1, fl.life * 2);
    ctx.fillStyle = fl.color;
    ctx.font = 'bold 16px system-ui, sans-serif';
    ctx.fillText(fl.text, fl.x, fl.y);
  }
  ctx.globalAlpha = 1;
}

function drawOverlay() {
  if (!state.won && !state.lost) return;
  ctx.fillStyle = 'rgba(10,5,5,0.78)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.fillStyle = state.won ? '#fbbf24' : '#ef4444';
  ctx.font = 'bold 34px system-ui, sans-serif';
  ctx.fillText(state.won ? 'VICTORY ACHIEVED' : 'YOU DIED', W / 2, H / 2 - 30);
  ctx.fillStyle = '#e7e5e4';
  ctx.font = '20px system-ui, sans-serif';
  ctx.fillText('Score: ' + state.scoreVal, W / 2, H / 2 + 8);
  ctx.font = '16px system-ui, sans-serif';
  ctx.fillText('Tap to try again', W / 2, H / 2 + 44);
}

function draw(dt) {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  drawBackground(dt);
  drawWaves();
  drawBoss();
  drawKnight();
  drawEffects(dt);
  ctx.restore();
  if (flash > 0) {
    ctx.fillStyle = 'rgba(255,255,255,' + Math.min(0.35, flash) + ')';
    ctx.fillRect(0, 0, W, 500);
  }
  drawHud();
  drawControls();
  drawOverlay();
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
  last = now;
  clock += dt;
  shake = Math.max(0, shake - 40 * dt);
  flash = Math.max(0, flash - dt);
  if (hitStop > 0) {
    hitStop -= dt;
  } else {
    G.tick(state, dt, currentInput());
    handleEvents();
  }
  draw(dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

const inApk = window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform();
if (!inApk && 'serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
