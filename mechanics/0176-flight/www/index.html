<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#030814">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Aero Ace</title>
<style>
  html, body { margin: 0; height: 100%; background: #030814; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; margin: 0 auto; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="logic.js"></script>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const W = 360;
const H = 640;
let scale = 1;

function resize() {
  scale = Math.min(innerWidth / W, innerHeight / H);
  const dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.style.width = W * scale + 'px';
  canvas.style.height = H * scale + 'px';
  canvas.width = Math.round(W * scale * dpr);
  canvas.height = Math.round(H * scale * dpr);
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
}
addEventListener('resize', resize);
resize();

function rrect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

let best = 0;
try { best = +localStorage.getItem('goe-0176-best') || 0; } catch (e) {}

let state = createState(Date.now());
let visualPitch = 0;
let visualBank = 0;
let floaters = [];
let overAt = 0;

function restart() {
  state = createState(Date.now());
  visualPitch = 0;
  visualBank = 0;
  floaters = [];
  overAt = 0;
}

function performAction(act) {
  if (isOver(state)) return;
  const legals = legalActions(state);
  if (!legals.includes(act)) return;

  const oldRings = state.ringsPassed;
  const res = step(state, act);

  if (state.ringsPassed > oldRings) {
    floaters.push({ text: 'RING CLEARED! +1200', x: 180, y: 180, t: 0, color: '#38bdf8' });
  } else if (act.includes('throttle_increase')) {
    floaters.push({ text: 'THROTTLE ' + state.throttle + '%', x: 70, y: 380, t: 0, color: '#10b981' });
  } else if (act.includes('pitch_up')) {
    floaters.push({ text: 'CLIMB +' + state.pitch + '°', x: 180, y: 380, t: 0, color: '#38bdf8' });
  } else if (act.includes('pitch_down')) {
    floaters.push({ text: 'DIVE ' + state.pitch + '°', x: 180, y: 380, t: 0, color: '#f59e0b' });
  } else if (act.includes('level_wings')) {
    floaters.push({ text: 'WINGS LEVEL', x: 180, y: 380, t: 0, color: '#06b6d4' });
  } else if (act.includes('toggle_landing_gear')) {
    floaters.push({ text: state.landingGear ? 'GEAR DOWN' : 'GEAR UP', x: 280, y: 380, t: 0, color: '#fbbf24' });
  }

  if (isOver(state)) {
    overAt = performance.now();
    const sc = score(state);
    if (sc > best) {
      best = sc;
      try { localStorage.setItem('goe-0176-best', best); } catch (e) {}
    }
  }
}

// Action button hitboxes on canvas
const BTNS = [
  { id: 'bank_l', label: '◀ BANK L', action: 'action:bank_left', x: 20, y: 470, w: 75, h: 48, col: '#0284c7' },
  { id: 'pitch_up', label: 'PULL UP ▲', action: 'action:pitch_up', x: 105, y: 470, w: 70, h: 48, col: '#38bdf8' },
  { id: 'pitch_dn', label: 'DIVE ▼', action: 'action:pitch_down', x: 185, y: 470, w: 70, h: 48, col: '#38bdf8' },
  { id: 'bank_r', label: 'BANK R ▶', action: 'action:bank_right', x: 265, y: 470, w: 75, h: 48, col: '#0284c7' },
  { id: 'throt_up', label: 'THROT ▲', action: 'action:throttle_increase', x: 20, y: 530, w: 75, h: 44, col: '#10b981' },
  { id: 'level', label: 'LEVEL WINGS', action: 'action:level_wings', x: 105, y: 530, w: 150, h: 44, col: '#06b6d4' },
  { id: 'throt_dn', label: 'THROT ▼', action: 'action:throttle_decrease', x: 265, y: 530, w: 75, h: 44, col: '#ef4444' },
  { id: 'gear', label: 'TOGGLE GEAR', action: 'action:toggle_landing_gear', x: 80, y: 585, w: 200, h: 42, col: '#f59e0b' },
];

function toLogical(e) {
  const rect = canvas.getBoundingClientRect();
  return { x: (e.clientX - rect.left) / scale, y: (e.clientY - rect.top) / scale };
}

canvas.addEventListener('pointerdown', (e) => {
  const p = toLogical(e);
  if (isOver(state)) {
    if (performance.now() - overAt > 400) restart();
    return;
  }
  for (const b of BTNS) {
    if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) {
      performAction(b.action);
      return;
    }
  }
  // Yoke tap zones in upper half
  if (p.y < 460) {
    if (p.y < 200) performAction('action:pitch_down');
    else if (p.y > 320) performAction('action:pitch_up');
    else if (p.x < 120) performAction('action:bank_left');
    else if (p.x > 240) performAction('action:bank_right');
    else performAction('action:level_wings');
  }
});

addEventListener('keydown', (e) => {
  if (isOver(state)) {
    if ((e.key === ' ' || e.key === 'Enter') && performance.now() - overAt > 400) restart();
    return;
  }
  const k = e.key.toLowerCase();
  if (k === 'arrowleft' || k === 'a') performAction('action:bank_left');
  else if (k === 'arrowright' || k === 'd') performAction('action:bank_right');
  else if (k === 'arrowdown' || k === 's') performAction('action:pitch_up'); // Pulled back = pitch up
  else if (k === 'arrowup' || k === 'w') performAction('action:pitch_down'); // Pushed fwd = pitch down
  else if (k === 'e' || k === '+') performAction('action:throttle_increase');
  else if (k === 'q' || k === '-') performAction('action:throttle_decrease');
  else if (k === ' ' || k === 'enter') performAction('action:level_wings');
  else if (k === 'g') performAction('action:toggle_landing_gear');
});

function draw(dt) {
  // Lerp visual orientation
  visualPitch += (state.pitch - visualPitch) * Math.min(1, dt * 8);
  visualBank += (state.bank - visualBank) * Math.min(1, dt * 8);

  // Cockpit Viewport (0..460)
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 0, W, 460);
  ctx.clip();

  // Artificial Horizon Center
  const hx = W / 2;
  const hy = 230 + visualPitch * 4;

  ctx.save();
  ctx.translate(hx, hy);
  ctx.rotate((-visualBank * Math.PI) / 180);

  // Sky
  ctx.fillStyle = '#0284c7';
  ctx.fillRect(-W, -H, W * 2, H);

  // Ground
  ctx.fillStyle = '#14532d';
  ctx.fillRect(-W, 0, W * 2, H);

  // Horizon Line
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(-W, 0);
  ctx.lineTo(W, 0);
  ctx.stroke();

  // Pitch ladder marks
  ctx.strokeStyle = 'rgba(255,255,255,0.6)';
  ctx.lineWidth = 1.5;
  for (let p = -20; p <= 20; p += 10) {
    if (p === 0) continue;
    const py = -p * 4;
    ctx.beginPath();
    ctx.moveTo(-25, py);
    ctx.lineTo(25, py);
    ctx.stroke();
  }

  ctx.restore();

  // Draw Sky Rings / Target Waypoint in forward view
  if (state.currentRingIndex < 5) {
    const rx = W / 2 + (state.bank * 1.5);
    const ry = 210 - (state.altitude - 1500) * 0.05;
    ctx.strokeStyle = '#facc15';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(rx, Math.max(80, Math.min(380, ry)), 32, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = 'rgba(250, 204, 21, 0.2)';
    ctx.fill();

    ctx.fillStyle = '#fef08a';
    ctx.font = 'bold 11px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('RING #' + (state.currentRingIndex + 1), rx, Math.max(80, Math.min(380, ry)) - 38);
  }

  // Crosshair Gunsight / Flight Director (Aircraft Reticle)
  ctx.strokeStyle = '#38bdf8';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  // Center dot
  ctx.arc(W / 2, 230, 4, 0, Math.PI * 2);
  // Wings
  ctx.moveTo(W / 2 - 40, 230);
  ctx.lineTo(W / 2 - 12, 230);
  ctx.moveTo(W / 2 + 12, 230);
  ctx.lineTo(W / 2 + 40, 230);
  // Fin
  ctx.moveTo(W / 2, 222);
  ctx.lineTo(W / 2, 210);
  ctx.stroke();

  // Instrument Tapes on Sides
  // Speed Tape (Left)
  ctx.fillStyle = 'rgba(15, 23, 42, 0.75)';
  rrect(10, 80, 52, 140, 4);
  ctx.fill();
  ctx.fillStyle = '#38bdf8';
  ctx.font = 'bold 10px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('KNOTS', 36, 96);
  ctx.font = 'bold 17px system-ui, sans-serif';
  ctx.fillStyle = state.isStalling ? '#ef4444' : '#ffffff';
  ctx.fillText(state.airspeed, 36, 122);
  ctx.font = '10px system-ui, sans-serif';
  ctx.fillStyle = '#94a3b8';
  ctx.fillText(state.isStalling ? 'STALL!' : 'AIRSPEED', 36, 142);

  // Altitude Tape (Right)
  ctx.fillStyle = 'rgba(15, 23, 42, 0.75)';
  rrect(W - 62, 80, 52, 140, 4);
  ctx.fill();
  ctx.fillStyle = '#38bdf8';
  ctx.font = 'bold 10px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('ALT FT', W - 36, 96);
  ctx.font = 'bold 17px system-ui, sans-serif';
  ctx.fillStyle = '#ffffff';
  ctx.fillText(state.altitude, W - 36, 122);
  ctx.font = '10px system-ui, sans-serif';
  ctx.fillStyle = '#94a3b8';
  ctx.fillText('MSL', W - 36, 142);

  ctx.restore();

  // Top Header HUD
  ctx.fillStyle = 'rgba(3, 8, 20, 0.9)';
  ctx.fillRect(0, 0, W, 48);

  ctx.fillStyle = '#38bdf8';
  ctx.font = 'bold 15px system-ui, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('RINGS: ' + state.ringsPassed + '/5', 12, 22);

  ctx.textAlign = 'right';
  ctx.fillStyle = '#10b981';
  ctx.fillText('THROT ' + state.throttle + '%', W - 12, 22);

  // Sub-bars: Fuel & Gear
  ctx.font = '10px system-ui, sans-serif';
  ctx.fillStyle = '#94a3b8';
  ctx.textAlign = 'left';
  ctx.fillText('FUEL ' + state.fuel + '%', 12, 38);
  ctx.fillStyle = '#334155';
  ctx.fillRect(66, 30, 75, 8);
  ctx.fillStyle = state.fuel > 25 ? '#10b981' : '#ef4444';
  ctx.fillRect(66, 30, 75 * (state.fuel / 100), 8);

  ctx.fillStyle = state.landingGear ? '#fbbf24' : '#64748b';
  ctx.textAlign = 'right';
  ctx.fillText(state.landingGear ? 'GEAR DOWN 🛞' : 'GEAR RETRACTED ✈', W - 12, 38);

  // Floating text
  for (let i = floaters.length - 1; i >= 0; i--) {
    const f = floaters[i];
    f.y -= 35 * dt;
    f.t += dt;
    if (f.t > 0.8) {
      floaters.splice(i, 1);
      continue;
    }
    ctx.fillStyle = f.color;
    ctx.font = 'bold 15px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(f.text, f.x, f.y);
  }

  // Draw Control Deck
  ctx.fillStyle = '#060f1e';
  ctx.fillRect(0, 460, W, 180);
  ctx.fillStyle = '#0284c7';
  ctx.fillRect(0, 458, W, 2);

  const legals = legalActions(state);
  for (const b of BTNS) {
    const isLegal = legals.includes(b.action);
    ctx.fillStyle = isLegal ? b.col : '#1e293b';
    rrect(b.x, b.y, b.w, b.h, 6);
    ctx.fill();
    ctx.strokeStyle = isLegal ? 'rgba(255,255,255,0.3)' : '#334155';
    ctx.lineWidth = 1.5;
    rrect(b.x, b.y, b.w, b.h, 6);
    ctx.stroke();

    ctx.fillStyle = isLegal ? '#ffffff' : '#64748b';
    ctx.font = 'bold 11px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(b.label, b.x + b.w / 2, b.y + b.h / 2);
  }
  ctx.textBaseline = 'alphabetic';

  // Game over overlay
  if (isOver(state)) {
    ctx.fillStyle = 'rgba(3, 8, 20, 0.9)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = state.victory ? '#10b981' : '#ef4444';
    ctx.font = 'bold 30px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(state.victory ? 'TOUCHDOWN SAFE!' : 'AIRCRAFT CRASH', W / 2, H / 2 - 40);
    ctx.fillStyle = '#f1f5f9';
    ctx.font = '18px system-ui, sans-serif';
    ctx.fillText('Score: ' + score(state) + '  (Best: ' + best + ')', W / 2, H / 2);
    ctx.fillText('Rings Cleared: ' + state.ringsPassed + '/5  Distance: ' + state.flightDistance, W / 2, H / 2 + 28);
    ctx.fillStyle = '#38bdf8';
    ctx.font = 'bold 16px system-ui, sans-serif';
    ctx.fillText('Tap to fly again', W / 2, H / 2 + 70);
  }
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  draw(dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

const inApk = window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform();
if (!inApk && 'serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
