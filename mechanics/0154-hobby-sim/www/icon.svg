<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#292524" />
    </linearGradient>
    <linearGradient id="brush" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="mecha" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bg)" />
  <!-- Cutting mat grid -->
  <rect x="64" y="64" width="384" height="384" rx="20" fill="#064e3b" stroke="#10b981" stroke-width="4" />
  <line x1="128" y1="64" x2="128" y2="448" stroke="#047857" stroke-width="2" />
  <line x1="192" y1="64" x2="192" y2="448" stroke="#047857" stroke-width="2" />
  <line x1="256" y1="64" x2="256" y2="448" stroke="#047857" stroke-width="2" />
  <line x1="320" y1="64" x2="320" y2="448" stroke="#047857" stroke-width="2" />
  <line x1="384" y1="64" x2="384" y2="448" stroke="#047857" stroke-width="2" />
  <line x1="64" y1="128" x2="448" y2="128" stroke="#047857" stroke-width="2" />
  <line x1="64" y1="192" x2="448" y2="192" stroke="#047857" stroke-width="2" />
  <line x1="64" y1="256" x2="448" y2="256" stroke="#047857" stroke-width="2" />
  <line x1="64" y1="320" x2="448" y2="320" stroke="#047857" stroke-width="2" />
  <line x1="64" y1="384" x2="448" y2="384" stroke="#047857" stroke-width="2" />
  <!-- Miniature Figure Base -->
  <circle cx="256" cy="270" r="85" fill="#334155" stroke="#64748b" stroke-width="8" />
  <!-- Robot/Mech miniature torso & head -->
  <rect x="220" y="190" width="72" height="80" rx="8" fill="url(#mecha)" stroke="#34d399" stroke-width="4" />
  <polygon points="256,140 230,185 282,185" fill="#10b981" stroke="#34d399" stroke-width="4" />
  <circle cx="256" cy="165" r="8" fill="#fbbf24" />
  <!-- Crossed hobby brush & knife -->
  <path d="M 120 400 L 392 128" stroke="url(#brush)" stroke-width="14" stroke-linecap="round" />
  <polygon points="392,128 410,110 380,115" fill="#f59e0b" />
</svg>
