<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Genesis Engine - Procedural Generation</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#06b6d4">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #070d18;
      color: #e0f2fe;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 8px;
      overflow-x: hidden;
    }
    header {
      width: 100%;
      max-width: 440px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      padding: 6px 12px;
      background: #0c182b;
      border-radius: 8px;
      border: 1px solid #164e63;
    }
    h1 {
      font-size: 1.05rem;
      color: #22d3ee;
      display: flex;
      align-items: center;
      gap: 6px;
      letter-spacing: 0.5px;
    }
    .hud {
      width: 100%;
      max-width: 440px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
      margin-bottom: 6px;
    }
    .hud-box {
      background: #0c182b;
      border: 1px solid #164e63;
      border-radius: 6px;
      padding: 4px 6px;
      text-align: center;
      font-size: 0.75rem;
    }
    .hud-label {
      color: #38bdf8;
      font-size: 0.65rem;
      text-transform: uppercase;
      margin-bottom: 2px;
    }
    .hud-val {
      font-weight: bold;
      color: #ffffff;
      font-size: 0.85rem;
    }
    .val-hp { color: #f43f5e; }
    .val-flux { color: #06b6d4; }
    .val-keys { color: #facc15; }
    .val-score { color: #a855f7; }

    #game-container {
      position: relative;
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    canvas {
      width: 100%;
      max-width: 400px;
      aspect-ratio: 1 / 1;
      background: #030712;
      border: 2px solid #0891b2;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(6, 182, 212, 0.15);
      touch-action: none;
    }
    .mode-switch {
      width: 100%;
      max-width: 400px;
      margin-top: 6px;
      display: flex;
      gap: 4px;
    }
    .mode-btn {
      flex: 1;
      padding: 8px 4px;
      background: #0c182b;
      border: 1px solid #164e63;
      color: #94a3b8;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
    }
    .mode-btn.active {
      background: #0891b2;
      border-color: #22d3ee;
      color: #ffffff;
      box-shadow: 0 0 10px rgba(6, 182, 212, 0.4);
    }

    .control-panel {
      width: 100%;
      max-width: 400px;
      margin-top: 6px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .dpad-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      max-width: 220px;
      margin: 0 auto;
    }
    .pad-btn {
      background: #0e2238;
      border: 1px solid #155e75;
      color: #22d3ee;
      padding: 10px 6px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
    }
    .pad-btn:active {
      background: #164e63;
      transform: scale(0.96);
    }
    .quick-actions {
      display: flex;
      gap: 4px;
      justify-content: center;
    }
    .action-btn {
      flex: 1;
      padding: 8px 4px;
      background: #0c182b;
      border: 1px solid #164e63;
      color: #38bdf8;
      font-size: 0.75rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
    }
    .action-btn:active {
      background: #164e63;
    }

    .log-box {
      width: 100%;
      max-width: 400px;
      margin-top: 6px;
      background: #050b14;
      border: 1px solid #112845;
      border-radius: 6px;
      padding: 6px 10px;
      font-family: monospace;
      font-size: 0.7rem;
      min-height: 48px;
      max-height: 52px;
      overflow-y: hidden;
      color: #94a3b8;
    }
    .log-box p {
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .log-box p:last-child {
      color: #22d3ee;
      font-weight: bold;
    }

    /* Modal dialogs */
    .modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(7, 13, 24, 0.94);
      backdrop-filter: blur(4px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      border-radius: 8px;
      z-index: 50;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-card {
      background: #0c182b;
      border: 2px solid #06b6d4;
      border-radius: 12px;
      padding: 16px;
      width: 100%;
      max-width: 340px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.85);
    }
    .modal-title {
      font-size: 1.15rem;
      font-weight: bold;
      color: #22d3ee;
      margin-bottom: 6px;
    }
    .btn-primary {
      background: linear-gradient(135deg, #0891b2, #0284c7);
      border: none;
      color: #ffffff;
      font-weight: bold;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <header>
    <h1><span>💠</span> GENESIS ENGINE</h1>
    <span style="font-size: 0.75rem; color: #22d3ee; font-weight: bold;" id="sector-badge">SECTOR 1 / 4</span>
  </header>

  <div class="hud">
    <div class="hud-box">
      <div class="hud-label">Health</div>
      <div class="hud-val val-hp" id="val-hp">60 / 60</div>
    </div>
    <div class="hud-box">
      <div class="hud-label">Flux</div>
      <div class="hud-val val-flux" id="val-flux">40 / 100</div>
    </div>
    <div class="hud-box">
      <div class="hud-label">Keystones</div>
      <div class="hud-val val-keys" id="val-keys">0 / 3</div>
    </div>
    <div class="hud-box">
      <div class="hud-label">Score</div>
      <div class="hud-val val-score" id="val-score">0</div>
    </div>
  </div>

  <div id="game-container">
    <canvas id="engine-canvas" width="400" height="400"></canvas>

    <!-- Game Over / Victory Modal -->
    <div class="modal-overlay" id="gameover-modal">
      <div class="modal-card">
        <div class="modal-title" id="gameover-title">SIMULATION RESULT</div>
        <p style="font-size: 0.8rem; color: #94a3b8; margin: 8px 0;" id="gameover-desc"></p>
        <div style="font-size: 1rem; color: #facc15; font-weight: bold; margin-bottom: 8px;" id="gameover-score">Score: 0</div>
        <button class="btn-primary" id="btn-restart">RE-SEED ENGINE</button>
      </div>
    </div>
  </div>

  <div class="mode-switch">
    <button class="mode-btn active" id="btn-mode-move">NAVIGATE (1)</button>
    <button class="mode-btn" id="btn-mode-erode">ERODE WALL (2)</button>
    <button class="mode-btn" id="btn-mode-solidify">SOLIDIFY (3)</button>
  </div>

  <div class="control-panel">
    <div class="dpad-container">
      <div></div>
      <button class="pad-btn" id="btn-up">▲</button>
      <div></div>
      <button class="pad-btn" id="btn-left">◀</button>
      <button class="pad-btn" id="btn-pulse" style="font-size: 0.65rem; color: #06b6d4;">PULSE</button>
      <button class="pad-btn" id="btn-right">▶</button>
      <div></div>
      <button class="pad-btn" id="btn-down">▼</button>
      <div></div>
    </div>

    <div class="quick-actions">
      <button class="action-btn" id="btn-activate">ACTIVATE (E)</button>
      <button class="action-btn" id="btn-wait">WAIT (Z)</button>
      <button class="action-btn" id="btn-bot" style="border-color: #0891b2; color: #22d3ee;">AI STEP</button>
    </div>
  </div>

  <div class="log-box" id="log-box">
    <p>Genesis Engine online. Traverse sectors to stabilize.</p>
  </div>

  <script src="logic.js"></script>
  <script>
    let state = createState(Math.floor(Math.random() * 1000000));
    let currentMode = 'move'; // 'move', 'erode', 'solidify'
    const canvas = document.getElementById('engine-canvas');
    const ctx = canvas.getContext('2d');
    const TILE_SIZE = 40; // 10 x 40 = 400

    function setMode(mode) {
      currentMode = mode;
      document.getElementById('btn-mode-move').className = 'mode-btn' + (mode === 'move' ? ' active' : '');
      document.getElementById('btn-mode-erode').className = 'mode-btn' + (mode === 'erode' ? ' active' : '');
      document.getElementById('btn-mode-solidify').className = 'mode-btn' + (mode === 'solidify' ? ' active' : '');
    }

    function executeAction(act) {
      if (isOver(state)) return;
      const legals = legalActions(state);
      if (!legals.includes(act)) return;

      step(state, act);
      render();
    }

    function handleDirection(dir) {
      if (currentMode === 'move') {
        executeAction('move:' + dir);
      } else if (currentMode === 'erode') {
        executeAction('erode:' + dir);
      } else if (currentMode === 'solidify') {
        executeAction('solidify:' + dir);
      }
    }

    function render() {
      const p = state.player;

      // HUD
      const SECTOR_NAMES = [
        '',
        'SECTOR 1: BSP DUNGEON',
        'SECTOR 2: CELLULAR CAVES',
        'SECTOR 3: DRUNKARD WALK',
        'SECTOR 4: SINGULARITY CORE'
      ];
      document.getElementById('sector-badge').textContent = SECTOR_NAMES[state.sector] || ('SECTOR ' + state.sector);
      document.getElementById('val-hp').textContent = p.hp + ' / ' + p.maxHp;
      document.getElementById('val-flux').textContent = p.flux + ' / ' + p.maxFlux;
      document.getElementById('val-keys').textContent = p.keystones + ' / 3';
      document.getElementById('val-score').textContent = state.score;

      // Combat Log
      const logBox = document.getElementById('log-box');
      const recent = (state.combatLog || []).slice(-3);
      logBox.innerHTML = recent.map(line => '<p>' + line + '</p>').join('');

      // Canvas
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, 400, 400);

      // Wall color themes by sector
      let wallFill = '#0f172a';
      let wallStroke = '#1e293b';
      if (state.sector === 1) {
        wallFill = '#0c1b33';
        wallStroke = '#1d4ed8';
      } else if (state.sector === 2) {
        wallFill = '#06201b';
        wallStroke = '#059669';
      } else if (state.sector === 3) {
        wallFill = '#241407';
        wallStroke = '#d97706';
      } else {
        wallFill = '#1c082b';
        wallStroke = '#9333ea';
      }

      // Tiles
      for (let y = 0; y < 10; y++) {
        for (let x = 0; x < 10; x++) {
          const isExplored = state.explored[y] && state.explored[y][x];
          const isVisible = state.visible[y] && state.visible[y][x];

          if (!isExplored) continue; // Unseen

          const rx = x * TILE_SIZE;
          const ry = y * TILE_SIZE;
          const char = state.map[y][x];

          if (char === '#') {
            ctx.fillStyle = isVisible ? wallFill : '#0a0f1d';
            ctx.fillRect(rx + 1, ry + 1, TILE_SIZE - 2, TILE_SIZE - 2);
            ctx.strokeStyle = isVisible ? wallStroke : '#111827';
            ctx.lineWidth = 1;
            ctx.strokeRect(rx + 1, ry + 1, TILE_SIZE - 2, TILE_SIZE - 2);
          } else {
            ctx.fillStyle = isVisible ? '#091322' : '#040711';
            ctx.fillRect(rx, ry, TILE_SIZE, TILE_SIZE);

            if (char === 'E') {
              ctx.fillStyle = '#22d3ee';
              ctx.font = 'bold 22px monospace';
              ctx.textAlign = 'center';
              ctx.textBaseline = 'middle';
              ctx.fillText('⚡', rx + TILE_SIZE / 2, ry + TILE_SIZE / 2);
            } else if (char === 'K') {
              ctx.fillStyle = '#facc15';
              ctx.font = 'bold 20px monospace';
              ctx.textAlign = 'center';
              ctx.textBaseline = 'middle';
              ctx.fillText('🔑', rx + TILE_SIZE / 2, ry + TILE_SIZE / 2);
            } else if (char === 'F') {
              ctx.fillStyle = '#38bdf8';
              ctx.font = 'bold 20px monospace';
              ctx.textAlign = 'center';
              ctx.textBaseline = 'middle';
              ctx.fillText('💠', rx + TILE_SIZE / 2, ry + TILE_SIZE / 2);
            }
          }
        }
      }

      // Enemies
      for (const e of state.enemies) {
        if (e.hp <= 0) continue;
        if (!state.visible[e.y] || !state.visible[e.y][e.x]) continue;

        const ex = e.x * TILE_SIZE;
        const ey = e.y * TILE_SIZE;

        ctx.save();
        if (e.type === 'boss') {
          ctx.fillStyle = '#c084fc';
          ctx.strokeStyle = '#e879f9';
        } else if (e.type === 'sentinel') {
          ctx.fillStyle = '#ef4444';
          ctx.strokeStyle = '#f87171';
        } else {
          ctx.fillStyle = '#f97316';
          ctx.strokeStyle = '#fb923c';
        }

        ctx.lineWidth = 2;
        ctx.fillRect(ex + 8, ey + 8, TILE_SIZE - 16, TILE_SIZE - 16);
        ctx.strokeRect(ex + 8, ey + 8, TILE_SIZE - 16, TILE_SIZE - 16);

        // HP bar
        const hpPct = Math.max(0, e.hp / e.maxHp);
        ctx.fillStyle = '#374151';
        ctx.fillRect(ex + 8, ey + 3, TILE_SIZE - 16, 3);
        ctx.fillStyle = '#ef4444';
        ctx.fillRect(ex + 8, ey + 3, (TILE_SIZE - 16) * hpPct, 3);
        ctx.restore();
      }

      // Player
      const px = p.x * TILE_SIZE;
      const py = p.y * TILE_SIZE;
      ctx.save();
      ctx.fillStyle = '#06b6d4';
      ctx.strokeStyle = '#a5f3fc';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(px + TILE_SIZE / 2, py + TILE_SIZE / 2, 12, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // Inner quantum node
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(px + TILE_SIZE / 2, py + TILE_SIZE / 2, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Modals
      const modal = document.getElementById('gameover-modal');
      if (isOver(state)) {
        modal.className = 'modal-overlay active';
        const title = document.getElementById('gameover-title');
        const desc = document.getElementById('gameover-desc');
        const sc = document.getElementById('gameover-score');
        sc.textContent = 'Final Score: ' + state.score;

        if (state.victory) {
          title.textContent = 'ENGINE STABILIZED!';
          title.style.color = '#34d399';
          desc.textContent = 'All procedural biomes resolved. The Genesis Engine is synthesized into cosmic harmony!';
        } else {
          title.textContent = 'COHESION COLLAPSE';
          title.style.color = '#f43f5e';
          desc.textContent = p.hp <= 0 ? 'Your quantum signature was scrambled in the void.' : 'Dimensional distortion limit exceeded.';
        }
      } else {
        modal.className = 'modal-overlay';
      }
    }

    // Controls
    document.getElementById('btn-mode-move').onclick = () => setMode('move');
    document.getElementById('btn-mode-erode').onclick = () => setMode('erode');
    document.getElementById('btn-mode-solidify').onclick = () => setMode('solidify');

    document.getElementById('btn-up').onclick = () => handleDirection('up');
    document.getElementById('btn-down').onclick = () => handleDirection('down');
    document.getElementById('btn-left').onclick = () => handleDirection('left');
    document.getElementById('btn-right').onclick = () => handleDirection('right');
    document.getElementById('btn-pulse').onclick = () => executeAction('pulse');

    document.getElementById('btn-activate').onclick = () => executeAction('activate');
    document.getElementById('btn-wait').onclick = () => executeAction('wait');

    document.getElementById('btn-bot').onclick = () => {
      const legals = legalActions(state);
      if (legals.length > 0) {
        const act = legals.find(a => a === 'activate') ||
                    legals.find(a => a.startsWith('move:')) ||
                    legals[Math.floor(Math.random() * legals.length)];
        executeAction(act);
      }
    };

    document.getElementById('btn-restart').onclick = () => {
      state = createState(Math.floor(Math.random() * 1000000));
      render();
    };

    // Keyboard support
    window.addEventListener('keydown', (e) => {
      if (isOver(state)) return;
      const key = e.key.toLowerCase();

      if (key === '1') { setMode('move'); return; }
      if (key === '2') { setMode('erode'); return; }
      if (key === '3') { setMode('solidify'); return; }

      if (key === 'arrowup' || key === 'w') { handleDirection('up'); e.preventDefault(); }
      else if (key === 'arrowdown' || key === 's') { handleDirection('down'); e.preventDefault(); }
      else if (key === 'arrowleft' || key === 'a') { handleDirection('left'); e.preventDefault(); }
      else if (key === 'arrowright' || key === 'd') { handleDirection('right'); e.preventDefault(); }
      else if (key === 'e' || key === 'enter') { executeAction('activate'); }
      else if (key === ' ' || key === 'z') { executeAction('wait'); e.preventDefault(); }
      else if (key === 'p') { executeAction('pulse'); }
    });

    render();
  </script>
</body>
</html>
