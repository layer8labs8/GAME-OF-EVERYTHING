<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#050508">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Shadow Descent</title>
<style>
  html, body { margin: 0; height: 100%; background: #050508; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; margin: 0 auto; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="logic.js"></script>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const W = 360;
const H = 640;
let scale = 1;

function resize() {
  scale = Math.min(innerWidth / W, innerHeight / H);
  const dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.style.width = W * scale + 'px';
  canvas.style.height = H * scale + 'px';
  canvas.width = Math.round(W * scale * dpr);
  canvas.height = Math.round(H * scale * dpr);
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
}
addEventListener('resize', resize);
resize();

function rrect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

let best = 0;
try { best = +localStorage.getItem('goe-0163-best') || 0; } catch (e) {}

let state = createState(Date.now());
let lightX = 180;
let lightY = 220;
let floaters = [];
let animTimer = 0;
let overAt = 0;

function restart() {
  state = createState(Date.now());
  floaters = [];
  overAt = 0;
}

const SECTOR_LABELS = [
  'Emergency Ward',
  'Containment Labs',
  'Deep Morgue',
  'Extraction Core'
];

function performAction(act) {
  if (isOver(state)) return;
  const legals = legalActions(state);
  if (!legals.includes(act)) return;

  const oldHp = state.currentMonster ? state.currentMonster.hp : 0;
  const oldPlayerHp = state.health;
  const res = step(state, act);

  if (act.includes('shotgun') || act.includes('handgun')) {
    const dmg = state.currentMonster ? Math.max(0, oldHp - state.currentMonster.hp) : (oldHp || 25);
    floaters.push({ text: '-' + dmg + ' HP', x: lightX, y: 160, t: 0, color: '#ef4444' });
  } else if (act.includes('green_herb')) {
    floaters.push({ text: '+HERB HEAL', x: 180, y: 350, t: 0, color: '#10b981' });
  } else if (act.includes('flashlight')) {
    floaters.push({ text: '+BATTERY CHARGED', x: 180, y: 350, t: 0, color: '#facc15' });
  } else if (act.includes('dodge')) {
    floaters.push({ text: 'EVADED!', x: 180, y: 350, t: 0, color: '#38bdf8' });
  }

  if (isOver(state)) {
    overAt = performance.now();
    const sc = score(state);
    if (sc > best) {
      best = sc;
      try { localStorage.setItem('goe-0163-best', best); } catch (e) {}
    }
  }
}

// Action button hitboxes on canvas
const BTNS = [
  { id: 'gun', label: '🔫 HANDGUN', action: 'action:precision_handgun_shot', x: 20, y: 470, w: 155, h: 48, col: '#ef4444' },
  { id: 'shotgun', label: '💥 SHOTGUN', action: 'action:shotgun_blast', x: 185, y: 470, w: 155, h: 48, col: '#dc2626' },
  { id: 'dodge', label: '💨 EVADE', action: 'action:dodge_evasion', x: 20, y: 526, w: 155, h: 46, col: '#0284c7' },
  { id: 'flee', label: '🏃 FLEE', action: 'action:flee_combat', x: 185, y: 526, w: 155, h: 46, col: '#475569' },
  { id: 'explore', label: '🔦 EXPLORE', action: 'action:explore_chamber', x: 20, y: 580, w: 100, h: 44, col: '#d97706' },
  { id: 'herb', label: '🌿 HERB', action: 'action:use_green_herb', x: 130, y: 580, w: 100, h: 44, col: '#10b981' },
  { id: 'safe', label: '🚪 SAFE ROOM', action: 'action:rest_in_safe_room', x: 240, y: 580, w: 100, h: 44, col: '#3b82f6' },
];

function toLogical(e) {
  const rect = canvas.getBoundingClientRect();
  return { x: (e.clientX - rect.left) / scale, y: (e.clientY - rect.top) / scale };
}

canvas.addEventListener('pointerdown', (e) => {
  const p = toLogical(e);
  if (isOver(state)) {
    if (performance.now() - overAt > 400) restart();
    return;
  }
  // Check action buttons
  for (const b of BTNS) {
    if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) {
      performAction(b.action);
      return;
    }
  }
  // Check Advance button if available
  const legals = legalActions(state);
  const advAct = legals.find(a => a.startsWith('action:advance_to_sector'));
  if (advAct && p.y > 400 && p.y < 460) {
    performAction(advAct);
    return;
  }
  const puzAct = legals.find(a => a === 'action:solve_sector_puzzle');
  if (puzAct && p.y > 400 && p.y < 460) {
    performAction(puzAct);
    return;
  }

  // Tapping upper screen directs flashlight and shoots / explores
  if (p.y < 460) {
    lightX = p.x;
    lightY = p.y;
    if (state.currentMonster) {
      if (state.shotgunShells > 0) performAction('action:shotgun_blast');
      else performAction('action:precision_handgun_shot');
    } else {
      performAction('action:explore_chamber');
    }
  }
});

canvas.addEventListener('pointermove', (e) => {
  if (isOver(state)) return;
  const p = toLogical(e);
  if (p.y < 450) {
    lightX += (p.x - lightX) * 0.4;
    lightY += (p.y - lightY) * 0.4;
  }
});

addEventListener('keydown', (e) => {
  if (isOver(state)) {
    if ((e.key === ' ' || e.key === 'Enter') && performance.now() - overAt > 400) restart();
    return;
  }
  const k = e.key.toLowerCase();
  if (k === '1') performAction('action:precision_handgun_shot');
  else if (k === '2') performAction('action:shotgun_blast');
  else if (k === ' ' || k === 'f') {
    if (state.currentMonster) performAction('action:precision_handgun_shot');
    else performAction('action:explore_chamber');
  } else if (k === 'h') performAction('action:use_green_herb');
  else if (k === 'b') performAction('action:recharge_flashlight');
  else if (k === 'd') performAction('action:dodge_evasion');
  else if (k === 'r') performAction('action:rest_in_safe_room');
  else if (k === 'e' || k === 'enter') {
    const legals = legalActions(state);
    const adv = legals.find(a => a.startsWith('action:advance'));
    const puz = legals.find(a => a.includes('puzzle'));
    if (adv) performAction(adv);
    else if (puz) performAction(puz);
  }
});

function draw(dt) {
  animTimer += dt;

  // Total Blackout / Dark Corridor
  ctx.fillStyle = '#050508';
  ctx.fillRect(0, 0, W, H);

  // Viewport Dark Hallway (0..460)
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 50, W, 410);
  ctx.clip();

  // Perspective Corridor Lines
  ctx.strokeStyle = '#181822';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, 50); ctx.lineTo(180, 220);
  ctx.moveTo(W, 50); ctx.lineTo(180, 220);
  ctx.moveTo(0, 460); ctx.lineTo(180, 220);
  ctx.moveTo(W, 460); ctx.lineTo(180, 220);
  ctx.stroke();

  // Blood Decals on wall
  ctx.fillStyle = 'rgba(153, 27, 27, 0.4)';
  ctx.beginPath();
  ctx.arc(80, 180, 24, 0, Math.PI * 2);
  ctx.arc(95, 200, 14, 0, Math.PI * 2);
  ctx.fill();

  // Flashlight Cone
  const fRad = Math.max(40, state.battery * 1.4);
  const grad = ctx.createRadialGradient(lightX, lightY, 10, lightX, lightY, fRad);
  grad.addColorStop(0, 'rgba(254, 240, 138, 0.35)');
  grad.addColorStop(0.5, 'rgba(254, 240, 138, 0.12)');
  grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(lightX, lightY, fRad, 0, Math.PI * 2);
  ctx.fill();

  // Monster in corridor if engaged
  if (state.currentMonster && state.currentMonster.hp > 0) {
    const mx = 180;
    const my = 220 + Math.sin(animTimer * 4) * 5;

    // Menacing Monster Silhouette
    ctx.fillStyle = '#1c0a0a';
    ctx.beginPath();
    ctx.arc(mx, my - 20, 22, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillRect(mx - 18, my, 36, 45);

    // Glowing Red Eyes
    ctx.fillStyle = '#ef4444';
    ctx.beginPath();
    ctx.arc(mx - 7, my - 22, 3, 0, Math.PI * 2);
    ctx.arc(mx + 7, my - 22, 3, 0, Math.PI * 2);
    ctx.fill();

    // Monster HP Bar
    const hpPct = Math.max(0, state.currentMonster.hp / state.currentMonster.maxHp);
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(mx - 40, my - 55, 80, 6);
    ctx.fillStyle = '#ef4444';
    ctx.fillRect(mx - 40, my - 55, 80 * hpPct, 6);

    ctx.fillStyle = '#fca5a5';
    ctx.font = 'bold 11px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(state.currentMonster.name, mx, my - 62);
  } else {
    // Empty Creepy Corridor Hint
    ctx.fillStyle = 'rgba(148, 163, 184, 0.5)';
    ctx.font = '12px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Hallway is silent. Tap to shine light & explore.', 180, 240);
  }

  // Transit Prompt Pill if puzzle solved
  const legals = legalActions(state);
  const adv = legals.find(a => a.startsWith('action:advance'));
  if (adv) {
    ctx.fillStyle = '#10b981';
    rrect(60, 410, 240, 36, 6);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 12px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('DOOR UNLOCKED: TAP TO ADVANCE 🚪', 180, 432);
  } else {
    const puz = legals.find(a => a.includes('puzzle'));
    if (puz) {
      ctx.fillStyle = '#d97706';
      rrect(60, 410, 240, 36, 6);
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 12px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('KEYCARD HELD: TAP TO SOLVE 🧩', 180, 432);
    }
  }

  ctx.restore();

  // Top Header HUD
  ctx.fillStyle = 'rgba(8, 8, 12, 0.95)';
  ctx.fillRect(0, 0, W, 50);

  ctx.fillStyle = '#ef4444';
  ctx.font = 'bold 14px system-ui, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(SECTOR_LABELS[state.sector].toUpperCase(), 12, 22);

  ctx.textAlign = 'right';
  ctx.fillStyle = '#facc15';
  ctx.fillText('KILLS: ' + state.monstersSlain, W - 12, 22);

  // Sub-bars: Health & Sanity
  ctx.font = '10px system-ui, sans-serif';
  ctx.fillStyle = '#94a3b8';
  ctx.textAlign = 'left';
  ctx.fillText('HP ' + state.health + '%', 12, 40);
  ctx.fillStyle = '#334155';
  ctx.fillRect(58, 32, 65, 8);
  ctx.fillStyle = state.health > 35 ? '#10b981' : '#ef4444';
  ctx.fillRect(58, 32, 65 * (state.health / 100), 8);

  ctx.fillStyle = '#94a3b8';
  ctx.fillText('SANITY ' + state.sanity + '%', 135, 40);
  ctx.fillStyle = '#334155';
  ctx.fillRect(195, 32, 55, 8);
  ctx.fillStyle = '#38bdf8';
  ctx.fillRect(195, 32, 55 * (state.sanity / 100), 8);

  ctx.fillStyle = '#facc15';
  ctx.textAlign = 'right';
  ctx.fillText('BAT: ' + state.battery + '%', W - 12, 40);

  // Floating text
  for (let i = floaters.length - 1; i >= 0; i--) {
    const f = floaters[i];
    f.y -= 35 * dt;
    f.t += dt;
    if (f.t > 0.8) {
      floaters.splice(i, 1);
      continue;
    }
    ctx.fillStyle = f.color;
    ctx.font = 'bold 16px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(f.text, f.x, f.y);
  }

  // Draw Control Deck
  ctx.fillStyle = '#0a0a0f';
  ctx.fillRect(0, 460, W, 180);
  ctx.fillStyle = '#27272a';
  ctx.fillRect(0, 458, W, 2);

  for (const b of BTNS) {
    const isLegal = legals.includes(b.action);
    ctx.fillStyle = isLegal ? b.col : '#18181b';
    rrect(b.x, b.y, b.w, b.h, 6);
    ctx.fill();
    ctx.strokeStyle = isLegal ? 'rgba(255,255,255,0.3)' : '#27272a';
    ctx.lineWidth = 1.5;
    rrect(b.x, b.y, b.w, b.h, 6);
    ctx.stroke();

    ctx.fillStyle = isLegal ? '#ffffff' : '#52525b';
    ctx.font = 'bold 11px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(b.label, b.x + b.w / 2, b.y + b.h / 2);
  }
  ctx.textBaseline = 'alphabetic';

  // Game over overlay
  if (isOver(state)) {
    ctx.fillStyle = 'rgba(5, 5, 8, 0.95)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = state.victory ? '#10b981' : '#ef4444';
    ctx.font = 'bold 30px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(state.victory ? 'ESCAPED FACILITY!' : 'CLAIMED BY SHADOWS', W / 2, H / 2 - 40);
    ctx.fillStyle = '#f1f5f9';
    ctx.font = '18px system-ui, sans-serif';
    ctx.fillText('Score: ' + score(state) + '  (Best: ' + best + ')', W / 2, H / 2);
    ctx.fillText('Sector: ' + SECTOR_LABELS[state.sector] + '  Kills: ' + state.monstersSlain, W / 2, H / 2 + 28);
    ctx.fillStyle = '#38bdf8';
    ctx.font = 'bold 16px system-ui, sans-serif';
    ctx.fillText('Tap to survive again', W / 2, H / 2 + 70);
  }
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  draw(dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

const inApk = window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform();
if (!inApk && 'serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
