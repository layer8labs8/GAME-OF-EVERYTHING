<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cryptic Vault</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#6366f1">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background: #09090b;
      color: #f4f4f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 10px;
    }
    header {
      width: 100%;
      max-width: 680px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 8px;
      margin-bottom: 8px;
    }
    .hud-title {
      font-size: 16px;
      font-weight: 700;
      color: #818cf8;
    }
    .hud-stats {
      display: flex;
      gap: 12px;
      font-size: 13px;
    }
    .stat-pill {
      background: #27272a;
      padding: 4px 10px;
      border-radius: 4px;
      color: #a1a1aa;
    }
    .stat-pill strong { color: #f4f4f5; }

    #gameCanvas {
      background: #09090b;
      border: 2px solid #3f3f46;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      max-width: 100%;
      touch-action: none;
    }

    .nav-bar {
      width: 100%;
      max-width: 680px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      margin-top: 8px;
    }
    .nav-btn {
      background: #18181b;
      border: 1px solid #3f3f46;
      color: #a1a1aa;
      padding: 8px 4px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: all 0.1s ease;
    }
    .nav-btn:hover { background: #27272a; color: #f4f4f5; }
    .nav-btn.active {
      background: #4338ca;
      border-color: #6366f1;
      color: #ffffff;
      box-shadow: 0 0 10px rgba(99, 102, 241, 0.3);
    }

    .actions-panel {
      width: 100%;
      max-width: 680px;
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 8px;
      padding: 10px;
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .action-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .btn-interact {
      background: #27272a;
      border: 1px solid #3f3f46;
      color: #f4f4f5;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-interact:hover { background: #3f3f46; }
    .btn-interact.primary { background: #4f46e5; border-color: #6366f1; }
    .btn-interact.success { background: #059669; border-color: #10b981; }

    .inventory-bar {
      width: 100%;
      max-width: 680px;
      display: flex;
      gap: 8px;
      align-items: center;
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 8px;
      padding: 8px 12px;
      margin-top: 8px;
      font-size: 13px;
    }
    .inv-slot {
      background: #27272a;
      border: 1px dashed #52525b;
      padding: 4px 10px;
      border-radius: 4px;
      color: #e4e4e7;
    }

    #overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(9, 9, 11, 0.92);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <header>
    <div class="hud-title">Cryptic Vault</div>
    <div class="hud-stats">
      <span class="stat-pill">Turns: <strong id="turnsEl">40</strong></span>
      <span class="stat-pill">Power: <strong id="powerEl" style="color: #ef4444;">OFFLINE</strong></span>
      <span class="stat-pill">Score: <strong id="scoreEl">0</strong></span>
    </div>
  </header>

  <div style="position: relative; width: 680px; max-width: 100%;">
    <canvas id="gameCanvas" width="680" height="400"></canvas>
    <div id="overlay">
      <h2 id="overlayTitle" style="font-size: 32px; color: #10b981; margin-bottom: 12px;">VAULT ESCAPED!</h2>
      <p id="overlayDesc" style="color: #a1a1aa; margin-bottom: 24px;">Security vault doors breached safely!</p>
      <button class="btn-interact primary" id="playAgainBtn" style="padding: 12px 24px;">Next Chamber</button>
    </div>
  </div>

  <div class="nav-bar">
    <button class="nav-btn active" data-station="desk">1. Desk</button>
    <button class="nav-btn" data-station="painting">2. Painting</button>
    <button class="nav-btn" data-station="panel">3. Panel</button>
    <button class="nav-btn" data-station="safe">4. Safe</button>
    <button class="nav-btn" data-station="door">5. Vault Door</button>
  </div>

  <div class="actions-panel">
    <div style="font-size: 12px; color: #a1a1aa; text-transform: uppercase;">Station Actions:</div>
    <div class="action-grid" id="actionGrid"></div>
  </div>

  <div class="inventory-bar">
    <span style="color: #a1a1aa;">Inventory:</span>
    <div id="invList" style="display: flex; gap: 6px;">
      <span class="inv-slot" style="color: #71717a;">Empty</span>
    </div>
  </div>

  <script src="logic.js"></script>
  <script>
    let state = createState(1);
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas ? canvas.getContext("2d") : null;

    let audioCtx = null;
    function playTone(freq, type = 'sine', duration = 0.1) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function updateUI() {
      const turnsEl = document.getElementById("turnsEl");
      if (turnsEl) turnsEl.textContent = state.turnsLeft;
      const powerEl = document.getElementById("powerEl");
      if (powerEl) {
        powerEl.textContent = state.powerOn ? "ONLINE" : "OFFLINE";
        powerEl.style.color = state.powerOn ? "#10b981" : "#ef4444";
      }
      const scoreEl = document.getElementById("scoreEl");
      if (scoreEl) scoreEl.textContent = score(state);

      const navButtons = document.querySelectorAll(".nav-btn");
      if (navButtons && navButtons.length) {
        navButtons.forEach(btn => {
          if (btn && typeof btn.getAttribute === 'function' && btn.classList) {
            if (btn.getAttribute("data-station") === state.currentStation) {
              btn.classList.add("active");
            } else {
              btn.classList.remove("active");
            }
          }
        });
      }

      const invList = document.getElementById("invList");
      if (invList) {
        if (state.inventory.length === 0) {
          invList.innerHTML = '<span class="inv-slot" style="color: #71717a;">Empty</span>';
        } else {
          let html = "";
          state.inventory.forEach(item => {
            let icon = "🔧";
            if (item === "fuse") icon = "💡";
            if (item === "keycard") icon = "💳";
            html += `<span class="inv-slot">${icon} ${item}</span>`;
          });
          invList.innerHTML = html;
        }
      }

      const actionGrid = document.getElementById("actionGrid");
      if (actionGrid) {
        const legal = legalActions(state);
        const stationLegal = legal.filter(a => !a.startsWith("examine:"));
        let html = "";

        stationLegal.forEach(act => {
          let label = act;
          let cls = "btn-interact";

          if (act === "pickup:screwdriver") label = "🔧 Pick Up Screwdriver";
          else if (act === "use:screwdriver:painting") label = "🪛 Unscrew Painting Frame";
          else if (act === "pickup:fuse") label = "💡 Pick Up Fuse";
          else if (act === "use:fuse:panel") label = "🔌 Insert Fuse into Panel";
          else if (act.startsWith("toggle_switch:")) {
            const idx = act.split(":")[1];
            label = `⚡ Toggle Switch #${parseInt(idx) + 1}`;
          } else if (act.startsWith("cycle_dial:")) {
            const idx = act.split(":")[1];
            label = `🔢 Turn Tumbler #${parseInt(idx) + 1}`;
          } else if (act === "open_safe") {
            label = "🔓 Unlock Safe";
            cls += " primary";
          } else if (act === "pickup:keycard") {
            label = "💳 Pick Up Master Keycard";
          } else if (act === "use:keycard:door") {
            label = "🔑 Swipe Keycard on Vault Door";
            cls += " primary";
          } else if (act === "escape") {
            label = "🚪 ESCAPE THROUGH VAULT!";
            cls += " success";
          }

          html += `<button class="${cls}" data-action="${act}">${label}</button>`;
        });

        if (stationLegal.length === 0) {
          html = '<span style="color: #71717a; font-size: 13px;">Nothing left to interact with here. Examine other stations!</span>';
        }
        actionGrid.innerHTML = html;

        const actionButtons = (actionGrid && typeof actionGrid.querySelectorAll === 'function') ? actionGrid.querySelectorAll("button") : [];
        if (actionButtons && actionButtons.length) {
          actionButtons.forEach(btn => {
            if (btn && typeof btn.addEventListener === 'function') {
              btn.addEventListener("click", () => {
                const act = (typeof btn.getAttribute === 'function') ? btn.getAttribute("data-action") : null;
                if (act) doAction(act);
              });
            }
          });
        }
      }

      if (state.done) {
        const overlay = document.getElementById("overlay");
        if (overlay) overlay.style.display = "flex";
        const title = document.getElementById("overlayTitle");
        const desc = document.getElementById("overlayDesc");
        if (title && desc) {
          if (state.won) {
            title.textContent = "VAULT ESCAPED!";
            title.style.color = "#10b981";
            desc.textContent = `Vault breached with ${score(state)} points!`;
            playTone(659, 'triangle', 0.35);
          } else {
            title.textContent = "CHAMBER LOCKED";
            title.style.color = "#ef4444";
            desc.textContent = "Life support exhausted. You remained locked inside.";
            playTone(196, 'sawtooth', 0.4);
          }
        }
      }
    }

    function render() {
      if (!ctx || !canvas) return;
      ctx.fillStyle = "#09090b";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const st = state.currentStation;

      if (st === "desk") {
        ctx.fillStyle = "#3f3f46";
        ctx.fillRect(40, 60, 600, 280);
        ctx.fillStyle = "#52525b";
        ctx.fillRect(60, 80, 560, 240);

        ctx.fillStyle = "#1e3a8a";
        ctx.fillRect(100, 110, 220, 160);
        ctx.strokeStyle = "#3b82f6";
        ctx.strokeRect(100, 110, 220, 160);
        ctx.fillStyle = "#93c5fd";
        ctx.font = "12px monospace";
        ctx.fillText("FACILITY SCHEMATIC", 120, 140);
        ctx.fillText("Vault Deadbolt Model-4", 120, 165);

        ctx.fillStyle = "#27272a";
        ctx.fillRect(360, 110, 220, 160);
        ctx.strokeStyle = "#71717a";
        ctx.strokeRect(360, 110, 220, 160);

        if (state.deskScrewdriverAvailable) {
          ctx.fillStyle = "#f59e0b";
          ctx.font = "32px sans-serif";
          ctx.fillText("🔧", 440, 190);
          ctx.font = "12px sans-serif";
          ctx.fillStyle = "#fef3c7";
          ctx.fillText("Heavy Screwdriver", 420, 230);
        } else {
          ctx.fillStyle = "#71717a";
          ctx.font = "12px sans-serif";
          ctx.fillText("(Drawer is empty)", 420, 190);
        }
      } else if (st === "painting") {
        ctx.fillStyle = "#27272a";
        ctx.fillRect(140, 40, 400, 320);
        ctx.fillStyle = "#78350f";
        ctx.fillRect(160, 60, 360, 280);

        if (!state.paintingUnscrewed) {
          ctx.fillStyle = "#451a03";
          ctx.fillRect(180, 80, 320, 240);
          ctx.font = "64px sans-serif";
          ctx.textAlign = "center";
          ctx.fillText("🏛️", 340, 210);
          ctx.font = "14px serif";
          ctx.fillStyle = "#fde68a";
          ctx.fillText("Founder's Portrait (Screwed Frame)", 340, 270);
        } else {
          ctx.fillStyle = "#18181b";
          ctx.fillRect(180, 80, 320, 240);
          ctx.fillStyle = "#fef3c7";
          ctx.font = "14px monospace";
          ctx.textAlign = "center";
          ctx.fillText("CONCEALED SCHEMATIC:", 340, 130);

          const s = state.switchSolution;
          ctx.fillStyle = "#38bdf8";
          ctx.fillText(`Switch 1: ${s[0] ? "ON" : "OFF"}`, 340, 160);
          ctx.fillText(`Switch 2: ${s[1] ? "ON" : "OFF"}`, 340, 185);
          ctx.fillText(`Switch 3: ${s[2] ? "ON" : "OFF"}`, 340, 210);

          if (state.paintingFuseAvailable) {
            ctx.fillStyle = "#f59e0b";
            ctx.font = "28px sans-serif";
            ctx.fillText("💡 Spare Fuse", 340, 265);
          }
        }
      } else if (st === "panel") {
        ctx.fillStyle = "#18181b";
        ctx.fillRect(100, 40, 480, 320);
        ctx.strokeStyle = "#52525b";
        ctx.lineWidth = 4;
        ctx.strokeRect(100, 40, 480, 320);

        ctx.fillStyle = state.powerOn ? "#10b981" : "#ef4444";
        ctx.beginPath();
        ctx.arc(140, 75, 12, 0, Math.PI * 2);
        ctx.fill();
        ctx.font = "bold 14px sans-serif";
        ctx.fillText(state.powerOn ? "POWER ONLINE" : "POWER OFFLINE", 170, 80);

        ctx.fillStyle = "#27272a";
        ctx.fillRect(140, 120, 120, 180);
        ctx.strokeStyle = "#71717a";
        ctx.lineWidth = 2;
        ctx.strokeRect(140, 120, 120, 180);
        ctx.font = "12px sans-serif";
        ctx.textAlign = "center";
        ctx.fillStyle = "#a1a1aa";
        ctx.fillText("FUSE BAY", 200, 150);
        if (state.fuseInserted) {
          ctx.fillStyle = "#f59e0b";
          ctx.font = "40px sans-serif";
          ctx.fillText("💡", 200, 220);
          ctx.font = "12px sans-serif";
          ctx.fillText("ACTIVE", 200, 260);
        } else {
          ctx.fillText("[EMPTY]", 200, 220);
        }

        for (let i = 0; i < 3; i++) {
          const sx = 320 + i * 80;
          ctx.fillStyle = "#27272a";
          ctx.fillRect(sx - 25, 120, 50, 180);
          ctx.strokeRect(sx - 25, 120, 50, 180);

          ctx.fillStyle = "#f4f4f5";
          ctx.fillText(`SW-${i + 1}`, sx, 150);

          const on = state.switches[i];
          ctx.fillStyle = on ? "#10b981" : "#71717a";
          const toggleY = on ? 180 : 230;
          ctx.fillRect(sx - 15, toggleY, 30, 30);
          ctx.fillStyle = "#ffffff";
          ctx.fillText(on ? "ON" : "OFF", sx, toggleY + 20);
        }
      } else if (st === "safe") {
        ctx.fillStyle = "#18181b";
        ctx.fillRect(160, 40, 360, 320);
        ctx.strokeStyle = "#52525b";
        ctx.lineWidth = 4;
        ctx.strokeRect(160, 40, 360, 320);

        ctx.fillStyle = "#0284c7";
        ctx.fillRect(200, 70, 280, 50);
        ctx.fillStyle = "#e0f2fe";
        ctx.font = "bold 16px monospace";
        ctx.textAlign = "center";
        if (state.powerOn) {
          ctx.fillText(`CODE: ${state.safeCode.join("-")}`, 340, 102);
        } else {
          ctx.fillText("[TERMINAL NO POWER]", 340, 102);
        }

        ctx.fillStyle = state.safeOpened ? "#09090b" : "#3f3f46";
        ctx.fillRect(200, 140, 280, 180);
        ctx.strokeRect(200, 140, 280, 180);

        if (!state.safeOpened) {
          for (let i = 0; i < 3; i++) {
            const dx = 250 + i * 70;
            ctx.fillStyle = "#18181b";
            ctx.fillRect(dx - 22, 190, 44, 60);
            ctx.strokeStyle = "#818cf8";
            ctx.strokeRect(dx - 22, 190, 44, 60);

            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 28px monospace";
            ctx.fillText(state.safeDials[i], dx, 232);
          }
        } else {
          if (state.safeKeycardAvailable) {
            ctx.fillStyle = "#6366f1";
            ctx.font = "48px sans-serif";
            ctx.fillText("💳", 340, 230);
            ctx.font = "14px sans-serif";
            ctx.fillStyle = "#c7d2fe";
            ctx.fillText("Master Keycard Inside", 340, 270);
          } else {
            ctx.fillStyle = "#71717a";
            ctx.font = "14px sans-serif";
            ctx.fillText("(Safe is empty)", 340, 240);
          }
        }
      } else if (st === "door") {
        ctx.fillStyle = "#18181b";
        ctx.fillRect(100, 20, 480, 360);

        ctx.beginPath();
        ctx.arc(340, 200, 140, 0, Math.PI * 2);
        ctx.fillStyle = state.doorUnlocked ? "#064e3b" : "#27272a";
        ctx.fill();
        ctx.lineWidth = 6;
        ctx.strokeStyle = state.doorUnlocked ? "#10b981" : "#52525b";
        ctx.stroke();

        ctx.textAlign = "center";
        if (state.doorUnlocked) {
          ctx.fillStyle = "#34d399";
          ctx.font = "bold 24px sans-serif";
          ctx.fillText("VAULT UNLOCKED", 340, 190);
          ctx.font = "14px sans-serif";
          ctx.fillText("Press 'ESCAPE' below to exit!", 340, 220);
        } else {
          ctx.fillStyle = "#f4f4f5";
          ctx.font = "bold 20px sans-serif";
          ctx.fillText("BLAST DOOR SECURED", 340, 180);
          ctx.font = "12px sans-serif";
          ctx.fillStyle = "#a1a1aa";
          ctx.fillText(state.powerOn ? "Scanner Ready for Keycard" : "Requires Terminal Power", 340, 210);

          ctx.fillStyle = state.powerOn ? "#38bdf8" : "#ef4444";
          ctx.fillRect(320, 230, 40, 20);
          ctx.strokeRect(320, 230, 40, 20);
        }
      }
    }

    function doAction(action) {
      if (state.done) return;
      try {
        const res = step(state, action);
        if (res.reward > 0) {
          playTone(523, 'triangle', 0.1);
        } else {
          playTone(200, 'sawtooth', 0.1);
        }
        updateUI();
        render();
      } catch (err) {
        console.warn(err);
      }
    }

    const navBtns = document.querySelectorAll(".nav-btn");
    if (navBtns && navBtns.length) {
      navBtns.forEach(btn => {
        if (btn && typeof btn.addEventListener === 'function') {
          btn.addEventListener("click", () => {
            const targetStation = (typeof btn.getAttribute === 'function') ? btn.getAttribute("data-station") : null;
            if (targetStation && targetStation !== state.currentStation) {
              doAction(`examine:${targetStation}`);
            }
          });
        }
      });
    }

    const playAgainBtn = document.getElementById("playAgainBtn");
    if (playAgainBtn && typeof playAgainBtn.addEventListener === 'function') {
      playAgainBtn.addEventListener("click", () => {
        state = createState(state.seed + 1);
        const overlay = document.getElementById("overlay");
        if (overlay) overlay.style.display = "none";
        updateUI();
        render();
      });
    }

    updateUI();
    render();
  </script>
</body>
</html>
