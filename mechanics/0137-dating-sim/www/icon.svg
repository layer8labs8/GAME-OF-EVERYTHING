  </defs>
  <rect width="512" height="512" rx="120" fill="url(#bg)"/>
  <!-- Starlight halo ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#fdf2f8" stroke-width="6" stroke-dasharray="16 12" opacity="0.6"/>
