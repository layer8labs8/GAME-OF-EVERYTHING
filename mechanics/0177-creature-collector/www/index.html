<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Beast Tamer Arena - Creature Collector</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #052e16;
      color: #f0fdf4;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
      padding: 8px;
    }
    header {
      width: 100%;
      max-width: 640px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 12px;
      background: #14532d;
      border: 1px solid #22c55e;
      border-radius: 8px;
      margin-bottom: 6px;
    }
    h1 {
      font-size: 1.05rem;
      font-weight: 700;
      color: #4ade80;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .badge {
      font-size: 0.72rem;
      padding: 2px 8px;
      border-radius: 4px;
      background: #15803d;
      color: #f0fdf4;
      font-weight: 600;
    }
    #game-container {
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    canvas {
      width: 100%;
      height: auto;
      aspect-ratio: 4/3;
      background: #022c22;
      border: 2px solid #22c55e;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(34, 197, 94, 0.25);
    }
    .vitals-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      width: 100%;
    }
    .vital-card {
      background: #14532d;
      border: 1px solid #16a34a;
      border-radius: 6px;
      padding: 6px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .vital-title {
      font-size: 0.65rem;
      color: #bbf7d0;
      text-transform: uppercase;
      font-weight: bold;
    }
    .vital-val {
      font-size: 0.95rem;
      font-weight: bold;
      color: #fff;
    }
    .meter-bar {
      height: 4px;
      background: #022c22;
      border-radius: 2px;
      overflow: hidden;
      margin-top: 2px;
    }
    .meter-fill {
      height: 100%;
      background: #22c55e;
      transition: width 0.2s ease;
    }
    #message-box {
      background: #064e3b;
      border-left: 4px solid #4ade80;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 0.8rem;
      min-height: 38px;
      display: flex;
      align-items: center;
      color: #f0fdf4;
    }
    #actions-panel {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      width: 100%;
    }
    .btn {
      background: #14532d;
      border: 1px solid #22c55e;
      color: #fff;
      padding: 10px 8px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      transition: all 0.1s ease;
    }
    .btn:active {
      transform: scale(0.97);
      filter: brightness(1.2);
    }
    .btn-attack {
      background: #991b1b;
      border-color: #ef4444;
      color: #fef2f2;
    }
    .btn-defend {
      background: #1e3a8a;
      border-color: #3b82f6;
      color: #eff6ff;
    }
    .btn-sphere {
      background: #854d0e;
      border-color: #eab308;
      color: #fefce8;
    }
    .btn-potion {
      background: #047857;
      border-color: #10b981;
      color: #ecfdf5;
    }
    .top-controls {
      display: flex;
      gap: 6px;
    }
    .ctrl-btn {
      background: #14532d;
      border: 1px solid #22c55e;
      color: #4ade80;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      cursor: pointer;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <header>
    <h1>Beast Tamer Arena</h1>
    <div class="top-controls">
      <button class="ctrl-btn" id="bot-toggle-btn" onclick="window.toggleBot()">BOT: OFF</button>
      <button class="ctrl-btn" onclick="window.restartGame()">RESTART</button>
      <span class="badge" id="turn-badge">TURN 0/120</span>
    </div>
  </header>

  <div id="game-container">
    <canvas id="gameCanvas" width="640" height="480"></canvas>

    <div class="vitals-grid">
      <div class="vital-card">
        <span class="vital-title">Active Beast HP</span>
        <span class="vital-val" id="val-hp">50 / 50</span>
        <div class="meter-bar"><div class="meter-fill" id="fill-hp" style="width:100%"></div></div>
      </div>
      <div class="vital-card">
        <span class="vital-title">Badges Won</span>
        <span class="vital-val" id="val-badges">0 / 4</span>
        <div class="meter-bar"><div class="meter-fill" id="fill-badges" style="width:0%;background:#eab308"></div></div>
      </div>
      <div class="vital-card">
        <span class="vital-title">Spheres & Potions</span>
        <span class="vital-val" id="val-items">5 ⚪ | 3 🧪</span>
        <div class="meter-bar"><div class="meter-fill" id="fill-items" style="width:80%;background:#38bdf8"></div></div>
      </div>
      <div class="vital-card">
        <span class="vital-title">Roster Size</span>
        <span class="vital-val" id="val-roster">1 / 3 Beasts</span>
        <div class="meter-bar"><div class="meter-fill" id="fill-roster" style="width:33%;background:#a855f7"></div></div>
      </div>
    </div>

    <div id="message-box">Starter creature Sparkfang ready. Explore tall grass or challenge regional arena leaders.</div>

    <div id="actions-panel"></div>
  </div>

  <script src="logic.js"></script>
  <script>
    let state = createState(Date.now ? Date.now() : 12345);
    let botRunning = false;
    let botInterval = null;

    // Web Audio Synthesizer
    const audioCtx = (typeof AudioContext !== 'undefined' || typeof webkitAudioContext !== 'undefined')
      ? new (window.AudioContext || window.webkitAudioContext)()
      : null;

    function playSfx(type) {
      if (!audioCtx) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      const t = audioCtx.currentTime;

      if (type === 'hit') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(260, t);
        osc.frequency.linearRampToValueAtTime(80, t + 0.12);
        gain.gain.setValueAtTime(0.2, t);
        gain.gain.linearRampToValueAtTime(0.01, t + 0.12);
        osc.start(t);
        osc.stop(t + 0.12);
      } else if (type === 'sphere') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(440, t);
        osc.frequency.setValueAtTime(554, t + 0.1);
        osc.frequency.setValueAtTime(659, t + 0.2);
        gain.gain.setValueAtTime(0.18, t);
        gain.gain.linearRampToValueAtTime(0.01, t + 0.3);
        osc.start(t);
        osc.stop(t + 0.3);
      } else if (type === 'potion') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(330, t);
        osc.frequency.linearRampToValueAtTime(660, t + 0.2);
        gain.gain.setValueAtTime(0.15, t);
        gain.gain.linearRampToValueAtTime(0.01, t + 0.2);
        osc.start(t);
        osc.stop(t + 0.2);
      } else if (type === 'victory') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523, t);
        osc.frequency.setValueAtTime(659, t + 0.12);
        osc.frequency.setValueAtTime(783, t + 0.24);
        osc.frequency.setValueAtTime(1046, t + 0.36);
        gain.gain.setValueAtTime(0.25, t);
        gain.gain.linearRampToValueAtTime(0.01, t + 0.55);
        osc.start(t);
        osc.stop(t + 0.55);
      }
    }

    function getElementColor(elem) {
      if (elem === 'Fire') return '#ef4444';
      if (elem === 'Water') return '#38bdf8';
      if (elem === 'Grass') return '#22c55e';
      if (elem === 'Electric') return '#eab308';
      return '#a855f7';
    }

    function render() {
      const active = state.party[state.activeBeastIndex] || state.party[0];

      // Vitals UI
      document.getElementById('turn-badge').textContent = 'TURN ' + state.turns + '/' + state.maxTurns;
      document.getElementById('val-hp').textContent = active.hp + ' / ' + active.maxHp + ' (Lv' + active.level + ')';
      document.getElementById('fill-hp').style.width = Math.min(100, Math.max(0, (active.hp / active.maxHp) * 100)) + '%';
      document.getElementById('fill-hp').style.background = (active.hp / active.maxHp) < 0.25 ? '#ef4444' : '#22c55e';

      document.getElementById('val-badges').textContent = state.badges + ' / 4 Badges';
      document.getElementById('fill-badges').style.width = ((state.badges / 4) * 100) + '%';

      document.getElementById('val-items').textContent = state.spheres + ' ⚪ | ' + state.potions + ' 🧪';
      document.getElementById('val-roster').textContent = state.party.length + ' / 3 Beasts';
      document.getElementById('fill-roster').style.width = ((state.party.length / 3) * 100) + '%';

      document.getElementById('message-box').textContent = state.gameMessage;

      // Canvas Rendering
      const canvas = document.getElementById('gameCanvas');
      if (!canvas || !canvas.getContext) return;
      const ctx = canvas.getContext('2d');
      const w = canvas.width;
      const h = canvas.height;

      // 1. Background Arena / Field
      if (state.isArenaMatch) {
        // Colosseum arena floor
        ctx.fillStyle = '#451a03';
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = '#78350f';
        ctx.beginPath();
        ctx.ellipse(w / 2, h / 2 + 40, w * 0.45, h * 0.35, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#f59e0b';
        ctx.lineWidth = 4;
        ctx.stroke();
      } else {
        // Tall grass meadow
        ctx.fillStyle = '#064e3b';
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = '#047857';
        // Battle circles
        ctx.beginPath();
        ctx.ellipse(w * 0.28, h * 0.72, 110, 36, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(w * 0.72, h * 0.38, 95, 30, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      // 2. Enemy Beast Platform (Upper Right)
      if (state.inBattle && state.enemy) {
        const ex = w * 0.72;
        const ey = h * 0.35;
        const elemCol = getElementColor(state.enemy.element);

        // Creature Sprite Representation
        ctx.fillStyle = elemCol;
        ctx.beginPath();
        ctx.arc(ex, ey - 20, 32, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 3;
        ctx.stroke();

        // Beast Eyes
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(ex - 10, ey - 24, 6, 0, Math.PI * 2);
        ctx.arc(ex + 10, ey - 24, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(ex - 10, ey - 24, 3, 0, Math.PI * 2);
        ctx.arc(ex + 10, ey - 24, 3, 0, Math.PI * 2);
        ctx.fill();

        // Enemy HUD Box
        ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
        ctx.roundRect(ex - 120, ey - 105, 240, 48, 6);
        ctx.fill();
        ctx.strokeStyle = elemCol;
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = '#fff';
        ctx.font = 'bold 12px sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText(state.enemy.name + ' Lv' + state.enemy.level, ex - 110, ey - 88);
        ctx.fillStyle = elemCol;
        ctx.fillText(state.enemy.element, ex + 60, ey - 88);

        // Enemy HP Bar
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(ex - 110, ey - 76, 220, 8);
        const ehpRatio = Math.max(0, state.enemy.hp / state.enemy.maxHp);
        ctx.fillStyle = ehpRatio < 0.25 ? '#ef4444' : '#22c55e';
        ctx.fillRect(ex - 110, ey - 76, 220 * ehpRatio, 8);
      } else {
        // Idle Overworld Visual
        ctx.fillStyle = '#a7f3d0';
        ctx.font = 'bold 16px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('Searching the Wilds... Tall Grass Awaits', w / 2, h * 0.35);
      }

      // 3. Player Active Beast Platform (Lower Left)
      const px = w * 0.28;
      const py = h * 0.70;
      const pElemCol = getElementColor(active.element);

      // Player Beast Sprite
      ctx.fillStyle = pElemCol;
      ctx.beginPath();
      ctx.arc(px, py - 25, 38, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 4;
      ctx.stroke();

      // Cute ears / crest
      ctx.beginPath();
      ctx.moveTo(px - 25, py - 55);
      ctx.lineTo(px - 15, py - 85);
      ctx.lineTo(px - 5, py - 58);
      ctx.moveTo(px + 5, py - 58);
      ctx.lineTo(px + 15, py - 85);
      ctx.lineTo(px + 25, py - 55);
      ctx.fillStyle = pElemCol;
      ctx.fill();

      // Eyes
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(px - 12, py - 28, 7, 0, Math.PI * 2);
      ctx.arc(px + 12, py - 28, 7, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(px - 10, py - 28, 3, 0, Math.PI * 2);
      ctx.arc(px + 14, py - 28, 3, 0, Math.PI * 2);
      ctx.fill();

      // Player HUD Box
      ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
      ctx.roundRect(px - 110, py + 18, 220, 48, 6);
      ctx.fill();
      ctx.strokeStyle = pElemCol;
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.fillStyle = '#fff';
      ctx.font = 'bold 12px sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(active.name + ' Lv' + active.level, px - 100, py + 34);
      ctx.fillStyle = pElemCol;
      ctx.fillText(active.element, px + 50, py + 34);

      // Player HP Bar
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(px - 100, py + 44, 200, 8);
      const phpRatio = Math.max(0, active.hp / active.maxHp);
      ctx.fillStyle = phpRatio < 0.25 ? '#ef4444' : '#22c55e';
      ctx.fillRect(px - 100, py + 44, 200 * phpRatio, 8);

      // Game Over Screen Overlay
      if (isOver(state)) {
        ctx.fillStyle = state.victory ? 'rgba(6, 78, 59, 0.9)' : 'rgba(69, 10, 10, 0.9)';
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 24px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(state.victory ? 'MASTER TAMER CHAMPION! VICTORY!' : 'EXPEDITION FAILED - PARTY FAINTED', w / 2, h / 2 - 20);
        ctx.font = '14px sans-serif';
        ctx.fillText('Grand Tamer Final Score: ' + score(state), w / 2, h / 2 + 15);
      }

      updateActions();
    }

    function updateActions() {
      const panel = document.getElementById('actions-panel');
      if (isOver(state)) {
        panel.innerHTML = '<button class="btn btn-attack" onclick="window.restartGame()">NEW TAMER EXPEDITION</button>';
        return;
      }

      const actions = legalActions(state);
      let html = '';

      for (const act of actions) {
        let cls = 'btn';
        let label = act;
        let sub = '';

        if (act === 'action:command_attack') {
          cls += ' btn-attack';
          label = '⚔️ Elemental Strike';
          sub = 'Strike Enemy Creature';
        } else if (act === 'action:command_defend') {
          cls += ' btn-defend';
          label = '🛡️ Defend Stance';
          sub = 'Cut incoming damage by 50%';
        } else if (act === 'action:throw_tamer_sphere') {
          cls += ' btn-sphere';
          label = '⚪ Throw Tamer Sphere';
          sub = 'Attempt Capture (' + state.spheres + ' Left)';
        } else if (act === 'action:use_potion') {
          cls += ' btn-potion';
          label = '🧪 Administer Potion';
          sub = '+40 HP (' + state.potions + ' Left)';
        } else if (act === 'action:explore_tall_grass') {
          cls += ' btn-potion';
          label = '🌿 Explore Tall Grass';
          sub = 'Encounter Wild Beasts';
        } else if (act === 'action:challenge_arena_leader') {
          cls += ' btn-attack';
          label = '🏆 Challenge Arena Leader';
          sub = 'Badge Match #' + (state.badges + 1);
        } else if (act.startsWith('action:switch_beast:')) {
          const idx = parseInt(act.split(':')[2], 10);
          const b = state.party[idx];
          cls += ' btn-defend';
          label = '🔄 Switch: ' + (b ? b.name : 'Beast ' + idx);
          sub = b ? 'Lv' + b.level + ' ' + b.element + ' (' + b.hp + ' HP)' : '';
        }

        html += '<button class="' + cls + '" onclick="window.triggerAction(\'' + act + '\')"><span>' + label + '</span>' + (sub ? '<span style="font-size:0.62rem;opacity:0.8;">' + sub + '</span>' : '') + '</button>';
      }

      panel.innerHTML = html;
    }

    window.triggerAction = function(act) {
      if (isOver(state)) return;
      if (act.includes('attack')) playSfx('hit');
      else if (act.includes('sphere')) playSfx('sphere');
      else if (act.includes('potion')) playSfx('potion');

      step(state, act);

      if (state.victory) playSfx('victory');
      render();
    };

    window.restartGame = function() {
      state = createState(Date.now ? Date.now() : 12345);
      render();
    };

    window.toggleBot = function() {
      botRunning = !botRunning;
      const btn = document.getElementById('bot-toggle-btn');
      if (btn) {
        btn.textContent = botRunning ? 'BOT: ON' : 'BOT: OFF';
        btn.style.background = botRunning ? '#15803d' : '#14532d';
      }

      if (botRunning) {
        botInterval = setInterval(() => {
          if (isOver(state)) {
            state = createState(Date.now ? Date.now() : 9999);
            render();
            return;
          }
          const acts = legalActions(state);
          if (acts.length > 0) {
            let choice = acts[0];
            const active = state.party[state.activeBeastIndex] || state.party[0];

            if (state.inBattle) {
              if (active.hp < 20 && acts.includes('action:use_potion')) choice = 'action:use_potion';
              else if (!state.isArenaMatch && state.enemy && state.enemy.hp < 25 && acts.includes('action:throw_tamer_sphere')) choice = 'action:throw_tamer_sphere';
              else if (acts.includes('action:command_attack')) choice = 'action:command_attack';
            } else {
              if (active.hp < 20 && acts.includes('action:use_potion')) choice = 'action:use_potion';
              else if (active.level >= 2 + state.badges && acts.includes('action:challenge_arena_leader')) choice = 'action:challenge_arena_leader';
              else if (acts.includes('action:explore_tall_grass')) choice = 'action:explore_tall_grass';
            }

            window.triggerAction(choice);
          }
        }, 250);
      } else {
        clearInterval(botInterval);
      }
    };

    render();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
