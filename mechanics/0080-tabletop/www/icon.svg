<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="shield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <rect x="32" y="32" width="448" height="448" rx="80" fill="none" stroke="url(#shield)" stroke-width="6" opacity="0.4"/>
  <!-- Crossed D6 and Battle Banner -->
  <g filter="url(#shadow)">
    <!-- Tabletop Shield -->
    <path d="M256 100 L370 150 V260 C370 340 256 410 256 410 C256 410 142 340 142 260 V150 Z" fill="url(#shield)" stroke="#7dd3fc" stroke-width="8"/>
    <!-- D6 Dice Inlay -->
    <rect x="216" y="216" width="80" height="80" rx="16" fill="#ffffff" transform="rotate(45 256 256)"/>
    <!-- Pips -->
    <circle cx="256" cy="256" r="8" fill="#0f172a"/>
    <circle cx="236" cy="236" r="6" fill="#0f172a"/>
    <circle cx="276" cy="276" r="6" fill="#0f172a"/>
    <circle cx="236" cy="276" r="6" fill="#0f172a"/>
    <circle cx="276" cy="236" r="6" fill="#0f172a"/>
  </g>
</svg>
