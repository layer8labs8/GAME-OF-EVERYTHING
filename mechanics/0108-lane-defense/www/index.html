<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lane Bastion: Lane Defense</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #0b111e;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
      padding: 8px;
    }
    header {
      width: 100%;
      max-width: 600px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 12px;
      background: #141e33;
      border: 1px solid #233554;
      border-radius: 8px;
      margin-bottom: 8px;
    }
    h1 {
      font-size: 1.1rem;
      letter-spacing: 0.05em;
      color: #38bdf8;
      text-transform: uppercase;
    }
    .hud-stat {
      font-size: 0.82rem;
      font-weight: 600;
      color: #facc15;
    }
    #game-container {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    canvas {
      width: 100%;
      height: auto;
      max-height: 380px;
      background: #060b14;
      border: 1px solid #1e293b;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
      cursor: pointer;
    }
    .controls-panel {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .panel-section {
      background: #141e33;
      border: 1px solid #233554;
      border-radius: 8px;
      padding: 8px 10px;
    }
    .section-title {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #94a3b8;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }
    .button-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }
    .hero-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }
    .btn {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #f1f5f9;
      padding: 6px 4px;
      font-size: 0.74rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      min-height: 46px;
    }
    .btn:hover:not(:disabled) {
      background: #334155;
      border-color: #38bdf8;
    }
    .btn:active:not(:disabled) {
      transform: scale(0.98);
    }
    .btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    .btn-advance {
      background: #1d4ed8;
      border-color: #3b82f6;
      color: #eff6ff;
      font-weight: 700;
      padding: 10px;
      font-size: 0.86rem;
    }
    .btn-advance:hover:not(:disabled) {
      background: #2563eb;
    }
    .btn-hero.active-hero {
      background: #065f46;
      border-color: #34d399;
      color: #ecfdf5;
    }
    .log-feed {
      font-size: 0.72rem;
      color: #cbd5e1;
      max-height: 52px;
      overflow-y: auto;
      line-height: 1.3;
      padding: 4px;
      background: #090e17;
      border-radius: 4px;
      border: 1px solid #1e293b;
    }
  </style>
</head>
<body>
  <header>
    <h1>Lane Bastion</h1>
    <div class="hud-stat" id="hud-stats">Turn 1 / 36 • 60 Gold • Gate: 30/30 HP</div>
  </header>

  <div id="game-container">
    <canvas id="view" width="560" height="380"></canvas>

    <div class="controls-panel">
      <!-- Construction Directives -->
      <div class="panel-section">
        <div class="section-title">
          <span id="slot-info">Target Slot: Click a lane tile (Cols 1-4)</span>
          <span id="gold-cost-info" style="color: #facc15;">Gold: 60g</span>
        </div>
        <div class="button-grid" style="margin-bottom: 6px;">
          <button id="btn-build-archer" class="btn">Archer Spire<br><small>25g • Rng 4</small></button>
          <button id="btn-build-cannon" class="btn">Cannon Bastion<br><small>40g • 16 Dmg</small></button>
          <button id="btn-build-barricade" class="btn">Barricade<br><small>15g • 45 HP</small></button>
          <button id="btn-build-obelisk" class="btn">Frost Obelisk<br><small>35g • 10 Dmg</small></button>
        </div>

        <!-- Champion Hero Deployment -->
        <div class="section-title" style="margin-top: 6px;">
          <span>Frontline Champion Hero (12 Dmg/Turn)</span>
        </div>
        <div class="hero-grid" style="margin-bottom: 6px;">
          <button id="btn-hero-0" class="btn btn-hero">Top Lane (1)</button>
          <button id="btn-hero-1" class="btn btn-hero">Mid Lane (2)</button>
          <button id="btn-hero-2" class="btn btn-hero">Bot Lane (3)</button>
        </div>

        <button id="btn-advance-wave" class="btn btn-advance" style="width: 100%;">Advance Wave / End Turn</button>
      </div>

      <!-- Historical Defense Log -->
      <div class="panel-section">
        <div class="section-title">Citadel Defense Chronicle</div>
        <div id="log-feed" class="log-feed"></div>
      </div>
    </div>
  </div>

  <script src="logic.js"></script>
  <script>
    let state = createState(Date.now() & 0xffff);
    const canvas = document.getElementById('view');
    const ctx = canvas.getContext('2d');

    let selectedSlot = { lane: 0, x: 2 }; // Default selection

    // Web Audio Synthesizer
    let audioCtx = null;
    function playSfx(freq = 240, type = 'square', duration = 0.1) {
      try {
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) audioCtx = new AudioContextClass();
        }
        if (audioCtx && audioCtx.state !== 'closed') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + duration);
        }
      } catch (e) {}
    }

    function doAction(action) {
      if (state.done) return;
      try {
        step(state, action);
        if (action.startsWith('build')) playSfx(330, 'triangle', 0.12);
        else if (action.startsWith('hero')) playSfx(440, 'sine', 0.08);
        else playSfx(180, 'sawtooth', 0.14);

        updateUI();
        render();
      } catch (err) {
        console.warn('Action error:', err);
      }
    }

    // Canvas click handling to select lane and slot
    canvas.addEventListener('click', (e) => {
      if (state.done) return;
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const mx = (e.clientX - rect.left) * scaleX;
      const my = (e.clientY - rect.top) * scaleY;

      const ox = 70;
      const oy = 40;
      const slotW = 55;
      const laneH = 100;

      const lane = Math.floor((my - oy) / laneH);
      const x = Math.floor((mx - ox) / slotW);

      if (lane >= 0 && lane < NUM_LANES && x >= 1 && x <= 4) {
        selectedSlot = { lane, x };
        playSfx(520, 'sine', 0.05);
        updateUI();
        render();
      }
    });

    // Attach static button listeners
    document.getElementById('btn-build-archer').onclick = () => buildSelected('archer');
    document.getElementById('btn-build-cannon').onclick = () => buildSelected('cannon');
    document.getElementById('btn-build-barricade').onclick = () => buildSelected('barricade');
    document.getElementById('btn-build-obelisk').onclick = () => buildSelected('obelisk');

    document.getElementById('btn-hero-0').onclick = () => doAction('hero:0');
    document.getElementById('btn-hero-1').onclick = () => doAction('hero:1');
    document.getElementById('btn-hero-2').onclick = () => doAction('hero:2');

    document.getElementById('btn-advance-wave').onclick = () => doAction('advance_wave');

    function buildSelected(type) {
      if (selectedSlot) {
        doAction(`build:${type}:${selectedSlot.lane},${selectedSlot.x}`);
      }
    }

    function updateUI() {
      const legals = legalActions(state);

      // Header stats
      const hud = document.getElementById('hud-stats');
      if (hud) {
        hud.textContent = `Turn ${state.turn} / ${state.maxTurns} • ${state.gold} Gold • Gate: ${state.fortressHp}/${state.maxFortressHp} HP`;
      }

      // Slot info
      const sInfo = document.getElementById('slot-info');
      const gInfo = document.getElementById('gold-cost-info');
      if (sInfo && selectedSlot) {
        const slot = state.lanes[selectedSlot.lane][selectedSlot.x];
        const towerName = slot.tower ? TOWER_TYPES[slot.tower.type].name : 'Empty Ground';
        sInfo.textContent = `Lane ${selectedSlot.lane + 1}, Sector ${selectedSlot.x} (${towerName})`;
      }
      if (gInfo) {
        gInfo.textContent = `Gold: ${state.gold}g`;
      }

      // Construction buttons state
      ['archer', 'cannon', 'barricade', 'obelisk'].forEach(type => {
        const btn = document.getElementById(`btn-build-${type}`);
        if (btn) {
          const act = selectedSlot ? `build:${type}:${selectedSlot.lane},${selectedSlot.x}` : '';
          btn.disabled = !legals.includes(act);
        }
      });

      // Hero buttons state
      for (let l = 0; l < NUM_LANES; l++) {
        const btn = document.getElementById(`btn-hero-${l}`);
        if (btn) {
          if (btn.classList) {
            if (state.heroLane === l) btn.classList.add('active-hero');
            else btn.classList.remove('active-hero');
          }
          btn.disabled = (state.heroLane === l) || state.done;
        }
      }

      // Advance button
      const advBtn = document.getElementById('btn-advance-wave');
      if (advBtn) {
        advBtn.disabled = state.done;
      }

      // History log
      const logFeed = document.getElementById('log-feed');
      if (logFeed && state.history.length > 0) {
        logFeed.innerHTML = state.history.slice(-4).reverse().join('<br>');
      }
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Arena Grass / Field
      ctx.fillStyle = '#0c1626';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const ox = 70;
      const oy = 40;
      const slotW = 55;
      const laneH = 100;

      // Draw 3 Lanes
      for (let l = 0; l < NUM_LANES; l++) {
        const ly = oy + l * laneH;

        // Lane road strip
        ctx.fillStyle = (l % 2 === 0) ? '#13233a' : '#101d30';
        ctx.fillRect(ox, ly, slotW * 8, laneH - 8);
        ctx.strokeStyle = '#1e385c';
        ctx.strokeRect(ox, ly, slotW * 8, laneH - 8);

        // Lane label
        ctx.fillStyle = '#64748b';
        ctx.font = '10px sans-serif';
        ctx.fillText(`Lane ${l + 1}`, ox + 6, ly + 14);

        // Draw slots 1 to 7
        for (let x = 0; x < LANE_LENGTH; x++) {
          const sx = ox + x * slotW;
          ctx.strokeStyle = 'rgba(71, 85, 105, 0.3)';
          ctx.lineWidth = 1;
          ctx.strokeRect(sx, ly, slotW, laneH - 8);

          // If slot has a tower
          const slot = state.lanes[l][x];
          if (slot.tower) {
            drawTower(sx + slotW / 2, ly + (laneH - 8) / 2, slot.tower.type, slot.tower.hp);
          }

          // Buildable highlight for slots 1..4
          if (x >= 1 && x <= 4 && !slot.tower) {
            ctx.fillStyle = 'rgba(56, 189, 248, 0.05)';
            ctx.fillRect(sx + 2, ly + 2, slotW - 4, laneH - 12);
          }

          // Selected slot outline
          if (selectedSlot && selectedSlot.lane === l && selectedSlot.x === x) {
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 2;
            ctx.strokeRect(sx + 1, ly + 1, slotW - 2, laneH - 10);
          }
        }

        // Draw Hero banner if stationed in this lane
        if (state.heroLane === l) {
          const hx = ox + 1 * slotW + slotW / 2;
          const hy = ly + (laneH - 8) / 2;
          drawHero(hx, hy);
        }
      }

      // Left Citadel Wall (Fortress Gate)
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(0, 0, ox, canvas.height);
      ctx.strokeStyle = '#475569';
      ctx.lineWidth = 3;
      ctx.strokeRect(0, 0, ox, canvas.height);

      ctx.fillStyle = '#38bdf8';
      ctx.font = 'bold 11px sans-serif';
      ctx.fillText('CITADEL', 8, 24);

      // Gate HP Bar
      const gateHpPct = Math.max(0, state.fortressHp / state.maxFortressHp);
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(10, 36, 50, 8);
      ctx.fillStyle = gateHpPct > 0.4 ? '#22c55e' : '#ef4444';
      ctx.fillRect(10, 36, Math.floor(50 * gateHpPct), 8);

      ctx.fillStyle = '#f8fafc';
      ctx.font = '10px sans-serif';
      ctx.fillText(`${state.fortressHp} HP`, 12, 58);

      // Right Incursion Rift Portal
      const riftX = ox + 8 * slotW;
      ctx.fillStyle = '#3b0764';
      ctx.fillRect(riftX, 0, canvas.width - riftX, canvas.height);
      ctx.strokeStyle = '#a855f7';
      ctx.strokeRect(riftX, 0, canvas.width - riftX, canvas.height);

      ctx.fillStyle = '#c084fc';
      ctx.font = 'bold 11px sans-serif';
      ctx.fillText('RIFT', riftX + 6, 24);

      // Draw Creeps
      state.activeCreeps.forEach(creep => {
        const cx = ox + creep.x * slotW + slotW / 2;
        const cy = oy + creep.lane * laneH + (laneH - 8) / 2;
        drawCreep(cx, cy, creep);
      });

      // Top Game Score & Wave counter
      ctx.fillStyle = '#facc15';
      ctx.font = 'bold 12px sans-serif';
      ctx.fillText(`Tactical Defense Score: ${score(state)} Points`, ox + 10, 24);

      // Game Over Screen Overlay
      if (state.done) {
        ctx.fillStyle = 'rgba(2, 6, 23, 0.88)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.textAlign = 'center';
        if (state.winner === 'player') {
          ctx.fillStyle = '#4ade80';
          ctx.font = 'bold 24px sans-serif';
          ctx.fillText('CITADEL DEFENSE TRIUMPH', 280, 160);
          ctx.fillStyle = '#e2e8f0';
          ctx.font = '14px sans-serif';
          ctx.fillText(`All Invading Warbands Annihilated! Score: ${score(state)}`, 280, 195);
        } else {
          ctx.fillStyle = '#f87171';
          ctx.font = 'bold 24px sans-serif';
          ctx.fillText('THE CITADEL GATES FELL', 280, 160);
          ctx.fillStyle = '#e2e8f0';
          ctx.font = '14px sans-serif';
          ctx.fillText(`Monsters sacked the realm. Final Score: ${score(state)}`, 280, 195);
        }
        ctx.textAlign = 'left';
      }
    }

    function drawTower(cx, cy, type, hp) {
      ctx.save();
      if (type === 'archer') {
        ctx.fillStyle = '#334155';
        ctx.fillRect(cx - 10, cy - 14, 20, 28);
        ctx.fillStyle = '#f59e0b';
        ctx.beginPath();
        ctx.moveTo(cx, cy - 22);
        ctx.lineTo(cx + 12, cy - 12);
        ctx.lineTo(cx - 12, cy - 12);
        ctx.closePath();
        ctx.fill();
      } else if (type === 'cannon') {
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(cx - 12, cy - 10, 24, 20);
        ctx.fillStyle = '#64748b';
        ctx.fillRect(cx, cy - 4, 16, 8);
      } else if (type === 'barricade') {
        ctx.fillStyle = '#78716c';
        ctx.fillRect(cx - 8, cy - 16, 16, 32);
        ctx.strokeStyle = '#d6d3d1';
        ctx.strokeRect(cx - 8, cy - 16, 16, 32);
      } else if (type === 'obelisk') {
        ctx.fillStyle = '#0284c7';
        ctx.beginPath();
        ctx.moveTo(cx, cy - 18);
        ctx.lineTo(cx + 8, cy);
        ctx.lineTo(cx, cy + 18);
        ctx.lineTo(cx - 8, cy);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();
    }

    function drawHero(cx, cy) {
      ctx.save();
      // Glowing hero shield
      ctx.fillStyle = '#22c55e';
      ctx.beginPath();
      ctx.arc(cx - 14, cy - 18, 6, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#10b981';
      ctx.font = 'bold 9px sans-serif';
      ctx.fillText('HERO', cx - 22, cy - 28);
      ctx.restore();
    }

    function drawCreep(cx, cy, creep) {
      ctx.save();
      if (creep.type === 'goblin') {
        ctx.fillStyle = '#16a34a'; // Green goblin
        ctx.beginPath();
        ctx.arc(cx, cy, 10, 0, Math.PI * 2);
        ctx.fill();
      } else if (creep.type === 'orc') {
        ctx.fillStyle = '#dc2626'; // Red orc
        ctx.fillRect(cx - 12, cy - 12, 24, 24);
      } else if (creep.type === 'ogre') {
        ctx.fillStyle = '#7c2d12'; // Brown ogre
        ctx.fillRect(cx - 16, cy - 16, 32, 32);
        ctx.strokeStyle = '#f97316';
        ctx.strokeRect(cx - 16, cy - 16, 32, 32);
      }

      // Creep HP bar
      const hpPct = Math.max(0, creep.hp / creep.maxHp);
      ctx.fillStyle = '#000000';
      ctx.fillRect(cx - 12, cy - 18, 24, 4);
      ctx.fillStyle = '#ef4444';
      ctx.fillRect(cx - 12, cy - 18, Math.floor(24 * hpPct), 4);

      ctx.restore();
    }

    // Initialize
    updateUI();
    render();

    // Register service worker if supported
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
