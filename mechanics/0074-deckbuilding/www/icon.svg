<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#27272a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="shield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <rect width="500" height="500" x="6" y="6" rx="90" fill="none" stroke="#eab308" stroke-width="4" stroke-opacity="0.3"/>
  <g transform="translate(106, 96)">
    <!-- Stack of Deck Cards -->
    <rect x="20" y="50" width="180" height="260" rx="16" fill="#3f3f46" stroke="#71717a" stroke-width="4" transform="rotate(-8, 110, 180)" filter="url(#shadow)"/>
    <rect x="50" y="40" width="180" height="260" rx="16" fill="#27272a" stroke="#a1a1aa" stroke-width="4" transform="rotate(8, 140, 170)" filter="url(#shadow)"/>
    <rect x="60" y="40" width="180" height="260" rx="16" fill="#18181b" stroke="#eab308" stroke-width="6" filter="url(#shadow)"/>

    <!-- Crown on Front Card -->
    <path d="M 90,210 L 110,130 L 150,170 L 190,130 L 210,210 Z" fill="url(#gold)" filter="url(#shadow)"/>
    <circle cx="110" cy="120" r="8" fill="#fde047"/>
    <circle cx="150" cy="160" r="8" fill="#fde047"/>
    <circle cx="190" cy="120" r="8" fill="#fde047"/>
    <rect x="90" y="215" width="120" height="18" rx="4" fill="url(#gold)"/>

    <!-- Gold Coin in lower right corner -->
    <circle cx="210" cy="270" r="32" fill="url(#gold)" stroke="#78350f" stroke-width="4" filter="url(#shadow)"/>
    <text x="210" y="282" fill="#78350f" font-size="34" font-weight="900" font-family="sans-serif" text-anchor="middle">¢</text>
  </g>
</svg>
