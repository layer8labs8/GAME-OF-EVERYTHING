<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="arenaBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="60%" stop-color="#14532d" />
      <stop offset="100%" stop-color="#052e16" />
    </radialGradient>
    <radialGradient id="sphereCore" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#arenaBg)" />
  <!-- Tall Grass Wild Blades in Background -->
  <path d="M 60 420 Q 90 260 140 200 Q 110 320 100 420 Z" fill="#22c55e" opacity="0.6" />
  <path d="M 120 420 Q 160 220 220 160 Q 180 300 160 420 Z" fill="#4ade80" opacity="0.7" />
  <path d="M 400 420 Q 370 240 310 180 Q 340 310 360 420 Z" fill="#22c55e" opacity="0.6" />
  <!-- Elemental Tamer Sphere -->
  <g transform="translate(256, 256)">
    <!-- Sphere Shadow -->
    <ellipse cx="0" cy="140" rx="130" ry="24" fill="#022c22" opacity="0.6" />
    <!-- Outer Sphere Shell -->
    <circle cx="0" cy="0" r="130" fill="#0f172a" stroke="#f8fafc" stroke-width="8" />
    <!-- Top Half (Red Fire / Yellow Electric) -->
    <path d="M -130 0 A 130 130 0 0 1 130 0 Z" fill="#ef4444" />
    <path d="M 0 0 L 130 0 A 130 130 0 0 0 0 -130 Z" fill="#eab308" />
    <!-- Bottom Half (White/Silver) -->
    <path d="M -130 0 A 130 130 0 0 0 130 0 Z" fill="#f1f5f9" />
    <!-- Center Band -->
    <rect x="-130" y="-12" width="260" height="24" fill="#0f172a" />
    <!-- Center Latch Button -->
    <circle cx="0" cy="0" r="38" fill="#0f172a" stroke="#f8fafc" stroke-width="6" />
    <circle cx="0" cy="0" r="22" fill="url(#sphereCore)" stroke="#bae6fd" stroke-width="3" />
  </g>
</svg>
