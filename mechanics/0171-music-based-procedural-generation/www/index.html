<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#070014">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Beat Odyssey</title>
<style>
  html, body { margin: 0; height: 100%; background: #070014; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; margin: 0 auto; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="logic.js"></script>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const W = 360;
const H = 640;
let scale = 1;

function resize() {
  scale = Math.min(innerWidth / W, innerHeight / H);
  const dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.style.width = W * scale + 'px';
  canvas.style.height = H * scale + 'px';
  canvas.width = Math.round(W * scale * dpr);
  canvas.height = Math.round(H * scale * dpr);
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
}
addEventListener('resize', resize);
resize();

function rrect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

let best = 0;
try { best = +localStorage.getItem('goe-0171-best') || 0; } catch (e) {}

let state = createState(Date.now());
let playerX = 180;
let targetX = 180;
let roadOffset = 0;
let floaters = [];
let animTimer = 0;
let overAt = 0;
let swipeStartX = null;

function restart() {
  state = createState(Date.now());
  targetX = getLaneX(state.lane);
  playerX = targetX;
  floaters = [];
  overAt = 0;
}

function getLaneX(lane) {
  return 85 + lane * 95;
}

function performAction(act) {
  if (isOver(state)) return;
  const legals = legalActions(state);
  if (!legals.includes(act)) return;

  const oldGems = state.gemsCollected;
  const oldCombo = state.combo;
  const res = step(state, act);
  targetX = getLaneX(state.lane);

  if (state.gemsCollected > oldGems) {
    floaters.push({ text: 'CHROMA GEM! +' + (state.combo * 50), x: playerX, y: 360, t: 0, color: '#facc15' });
  } else if (act.includes('trigger_overdrive')) {
    floaters.push({ text: 'OVERDRIVE ACTIVE!', x: playerX, y: 360, t: 0, color: '#ec4899' });
  } else if (act.includes('pulse_shield')) {
    floaters.push({ text: '+SHIELD HARMONY', x: playerX, y: 360, t: 0, color: '#10b981' });
  } else if (act.includes('surf')) {
    floaters.push({ text: 'BEAT ' + state.measure, x: playerX, y: 360, t: 0, color: '#38bdf8' });
  }

  if (isOver(state)) {
    overAt = performance.now();
    const sc = score(state);
    if (sc > best) {
      best = sc;
      try { localStorage.setItem('goe-0171-best', best); } catch (e) {}
    }
  }
}

// Action button hitboxes on canvas
const BTNS = [
  { id: 'left', label: '◀ LANE L', action: 'action:shift_lane:left', x: 20, y: 470, w: 75, h: 48, col: '#0284c7' },
  { id: 'surf', label: 'SURF BEAT ▲', action: 'action:surf_forward', x: 105, y: 470, w: 150, h: 48, col: '#ec4899' },
  { id: 'right', label: 'LANE R ▶', action: 'action:shift_lane:right', x: 265, y: 470, w: 75, h: 48, col: '#0284c7' },
  { id: 'overdrive', label: '⚡ OVERDRIVE (40)', action: 'action:trigger_overdrive', x: 20, y: 528, w: 155, h: 46, col: '#d946ef' },
  { id: 'shield', label: '🛡 PULSE REPAIR (25)', action: 'action:pulse_shield_repair', x: 185, y: 528, w: 155, h: 46, col: '#10b981' },
  { id: 'skip', label: '⏩ PHASE SKIP', action: 'action:phase_skip_beat', x: 80, y: 584, w: 200, h: 42, col: '#f59e0b' },
];

function toLogical(e) {
  const rect = canvas.getBoundingClientRect();
  return { x: (e.clientX - rect.left) / scale, y: (e.clientY - rect.top) / scale };
}

canvas.addEventListener('pointerdown', (e) => {
  const p = toLogical(e);
  if (isOver(state)) {
    if (performance.now() - overAt > 400) restart();
    return;
  }
  for (const b of BTNS) {
    if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) {
      performAction(b.action);
      return;
    }
  }
  if (p.y < 460) {
    swipeStartX = p.x;
    if (p.x < 110) performAction('action:shift_lane:left');
    else if (p.x > 250) performAction('action:shift_lane:right');
    else performAction('action:surf_forward');
  }
});

canvas.addEventListener('pointermove', (e) => {
  if (swipeStartX === null || isOver(state)) return;
  const p = toLogical(e);
  const dx = p.x - swipeStartX;
  if (Math.abs(dx) > 30) {
    if (dx > 0) performAction('action:shift_lane:right');
    else performAction('action:shift_lane:left');
    swipeStartX = p.x;
  }
});

canvas.addEventListener('pointerup', () => { swipeStartX = null; });
canvas.addEventListener('pointercancel', () => { swipeStartX = null; });

addEventListener('keydown', (e) => {
  if (isOver(state)) {
    if ((e.key === ' ' || e.key === 'Enter') && performance.now() - overAt > 400) restart();
    return;
  }
  const k = e.key.toLowerCase();
  if (k === 'arrowleft' || k === 'a') performAction('action:shift_lane:left');
  else if (k === 'arrowright' || k === 'd') performAction('action:shift_lane:right');
  else if (k === 'arrowup' || k === 'w' || k === ' ') performAction('action:surf_forward');
  else if (k === 'e') performAction('action:trigger_overdrive');
  else if (k === 'r') performAction('action:pulse_shield_repair');
  else if (k === 'q') performAction('action:phase_skip_beat');
});

function draw(dt) {
  animTimer += dt;
  const speed = state.overdriveTurns > 0 ? 380 : 200;
  roadOffset = (roadOffset + speed * dt) % 60;

  // Background Synth Void
  ctx.fillStyle = '#070014';
  ctx.fillRect(0, 0, W, H);

  // Equalizer Spectrum Visualizer Bars in Background
  const curSlice = state.track[state.measure] || { bass: 50, mid: 50, treble: 50 };
  ctx.fillStyle = 'rgba(217, 70, 239, 0.12)';
  for (let i = 0; i < 18; i++) {
    const val = (Math.sin(animTimer * 5 + i * 0.8) + 1) * 35 + (curSlice.bass * 0.4);
    ctx.fillRect(10 + i * 19, 200 - val, 14, val);
  }

  // Neon Highway Surface
  ctx.fillStyle = '#140026';
  ctx.fillRect(40, 0, 280, 460);

  // Outer Neon Rails (Magenta Glow)
  ctx.fillStyle = '#d946ef';
  ctx.fillRect(36, 0, 4, 460);
  ctx.fillRect(320, 0, 4, 460);

  // Neon Lane Dividers
  ctx.fillStyle = 'rgba(56, 189, 248, 0.4)';
  for (let y = -60 + roadOffset; y < 460; y += 50) {
    ctx.fillRect(132, y, 3, 30);
    ctx.fillRect(224, y, 3, 30);
  }

  // Draw Ahead Track Elements (Gems & Hazards from future measures)
  for (let m = 0; m < 5; m++) {
    const sliceIdx = state.measure + m;
    const slice = state.track[sliceIdx];
    if (!slice) continue;
    const itemY = 320 - m * 70 + (roadOffset * 0.6);

    for (let lane = 0; lane < 3; lane++) {
      const elem = slice.elements[lane];
      if (!elem) continue;
      const ex = getLaneX(lane);

      if (elem === 'gem') {
        // Chroma energy gem
        ctx.fillStyle = '#facc15';
        ctx.beginPath();
        ctx.moveTo(ex, itemY - 12);
        ctx.lineTo(ex + 10, itemY);
        ctx.lineTo(ex, itemY + 12);
        ctx.lineTo(ex - 10, itemY);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(ex, itemY, 3, 0, Math.PI * 2);
        ctx.fill();
      } else if (elem === 'hazard') {
        // Sonic barrier
        ctx.fillStyle = '#ef4444';
        rrect(ex - 22, itemY - 6, 44, 12, 3);
        ctx.fill();
        ctx.fillStyle = '#fca5a5';
        ctx.fillRect(ex - 14, itemY - 2, 28, 4);
      } else if (elem === 'harmonizer') {
        // Shield Ring
        ctx.strokeStyle = '#22c55e';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(ex, itemY, 12, 0, Math.PI * 2);
        ctx.stroke();
      }
    }
  }

  // Smooth car lerp
  playerX += (targetX - playerX) * Math.min(1, dt * 14);

  // Draw Player Synth Surfer Craft
  const py = 390;

  // Trail
  ctx.fillStyle = state.overdriveTurns > 0 ? '#ec4899' : 'rgba(56, 189, 248, 0.5)';
  ctx.beginPath();
  ctx.moveTo(playerX - 12, py + 16);
  ctx.lineTo(playerX + 12, py + 16);
  ctx.lineTo(playerX, py + 36 + Math.sin(animTimer * 20) * 8);
  ctx.closePath();
  ctx.fill();

  // Ship Body (Futuristic Dart)
  ctx.fillStyle = '#38bdf8';
  ctx.beginPath();
  ctx.moveTo(playerX, py - 26);
  ctx.lineTo(playerX + 18, py + 16);
  ctx.lineTo(playerX, py + 8);
  ctx.lineTo(playerX - 18, py + 16);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = '#ec4899';
  ctx.beginPath();
  ctx.arc(playerX, py - 4, 6, 0, Math.PI * 2);
  ctx.fill();

  // Shield bubble if active
  if (state.shield > 50) {
    ctx.strokeStyle = 'rgba(56, 189, 248, 0.4)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(playerX, py, 26, 0, Math.PI * 2);
    ctx.stroke();
  }

  // Top Header HUD
  ctx.fillStyle = 'rgba(7, 0, 20, 0.9)';
  ctx.fillRect(0, 0, W, 48);

  ctx.fillStyle = '#ec4899';
  ctx.font = 'bold 15px system-ui, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('MEASURE: ' + state.measure + '/100', 12, 22);

  ctx.textAlign = 'right';
  ctx.fillStyle = '#facc15';
  ctx.fillText('COMBO x' + state.combo, W - 12, 22);

  // Bars: Shield & Energy
  ctx.font = '10px system-ui, sans-serif';
  ctx.fillStyle = '#94a3b8';
  ctx.textAlign = 'left';
  ctx.fillText('SHIELD ' + state.shield + '%', 12, 38);
  ctx.fillStyle = '#334155';
  ctx.fillRect(72, 30, 80, 8);
  ctx.fillStyle = state.shield > 30 ? '#38bdf8' : '#ef4444';
  ctx.fillRect(72, 30, 80 * (state.shield / 100), 8);

  ctx.fillStyle = '#94a3b8';
  ctx.fillText('ENERGY ' + state.energy + '%', 165, 38);
  ctx.fillStyle = '#334155';
  ctx.fillRect(225, 30, 65, 8);
  ctx.fillStyle = '#d946ef';
  ctx.fillRect(225, 30, 65 * Math.min(1, state.energy / 100), 8);

  // Floating text
  for (let i = floaters.length - 1; i >= 0; i--) {
    const f = floaters[i];
    f.y -= 35 * dt;
    f.t += dt;
    if (f.t > 0.8) {
      floaters.splice(i, 1);
      continue;
    }
    ctx.fillStyle = f.color;
    ctx.font = 'bold 15px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(f.text, f.x, f.y);
  }

  // Draw Control Deck
  ctx.fillStyle = '#0d021f';
  ctx.fillRect(0, 460, W, 180);
  ctx.fillStyle = '#d946ef';
  ctx.fillRect(0, 458, W, 2);

  const legals = legalActions(state);
  for (const b of BTNS) {
    const isLegal = legals.includes(b.action);
    ctx.fillStyle = isLegal ? b.col : '#1c0733';
    rrect(b.x, b.y, b.w, b.h, 6);
    ctx.fill();
    ctx.strokeStyle = isLegal ? 'rgba(255,255,255,0.3)' : '#2b0b4f';
    ctx.lineWidth = 1.5;
    rrect(b.x, b.y, b.w, b.h, 6);
    ctx.stroke();

    ctx.fillStyle = isLegal ? '#ffffff' : '#64748b';
    ctx.font = 'bold 11px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(b.label, b.x + b.w / 2, b.y + b.h / 2);
  }
  ctx.textBaseline = 'alphabetic';

  // Game over overlay
  if (isOver(state)) {
    ctx.fillStyle = 'rgba(7, 0, 20, 0.9)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = state.victory ? '#10b981' : '#ef4444';
    ctx.font = 'bold 30px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(state.victory ? 'SYMPHONY FINISHED!' : 'SIGNAL LOST', W / 2, H / 2 - 40);
    ctx.fillStyle = '#f1f5f9';
    ctx.font = '18px system-ui, sans-serif';
    ctx.fillText('Score: ' + score(state) + '  (Best: ' + best + ')', W / 2, H / 2);
    ctx.fillText('Measures Surfed: ' + state.measure + '  Max Combo: ' + state.combo, W / 2, H / 2 + 28);
    ctx.fillStyle = '#38bdf8';
    ctx.font = 'bold 16px system-ui, sans-serif';
    ctx.fillText('Tap to surf again', W / 2, H / 2 + 70);
  }
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  draw(dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

const inApk = window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform();
if (!inApk && 'serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
