<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b1020">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>Roof Jumper</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b1020; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; margin: 0 auto; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="logic.js"></script>
<script>
const { W: TW, PLAYER_X, createState, step, isOver, score } = GameLogic;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const W = 360;
const H = 640;
const TX = (W - TW) / 2;
const GROUND_Y = 430;

let scale = 1;
function resize() {
  scale = Math.min(innerWidth / W, innerHeight / H);
  const dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.style.width = W * scale + 'px';
  canvas.style.height = H * scale + 'px';
  canvas.width = Math.round(W * scale * dpr);
  canvas.height = Math.round(H * scale * dpr);
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
}
addEventListener('resize', resize);
resize();

let best = 0;
try { best = +localStorage.getItem('goe-0020-best') || 0; } catch (e) {}

let state = createState(Date.now());
let holding = false;
let tapQueued = false;
let accum = 0;
let overAt = 0;

function restart() {
  state = createState(Date.now());
  holding = false;
  tapQueued = false;
  accum = 0;
  overAt = 0;
}

function rrect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

canvas.addEventListener('pointerdown', (e) => {
  if (isOver(state)) {
    if (performance.now() - overAt > 400) restart();
    return;
  }
  canvas.setPointerCapture(e.pointerId);
  holding = true;
  tapQueued = true;
});
canvas.addEventListener('pointerup', () => { holding = false; });
canvas.addEventListener('pointercancel', () => { holding = false; });

addEventListener('keydown', (e) => {
  if (isOver(state)) {
    if ((e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowUp') && performance.now() - overAt > 400) restart();
    return;
  }
  if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w') {
    holding = true;
    tapQueued = true;
  }
});
addEventListener('keyup', (e) => {
  if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w') holding = false;
});

function draw() {
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#162447');
  bg.addColorStop(1, '#0b1020');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // Distant skyline silhouettes
  ctx.fillStyle = '#111a34';
  for (let i = 0; i < 6; i++) {
    const bx = ((i * 74 - (state.stepCount * 0.8) % 74) + W) % (W + 74) - 40;
    const bh = 80 + (i % 3) * 38;
    ctx.fillRect(bx, GROUND_Y - bh, 52, bh);
  }

  ctx.fillStyle = '#8a93a8';
  ctx.font = '12px system-ui, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('SCORE', 24, 40);
  ctx.textAlign = 'center';
  ctx.fillText('CLEARED', W / 2, 40);
  ctx.textAlign = 'right';
  ctx.fillText('BEST', W - 24, 40);

  ctx.fillStyle = '#e8ecf5';
  ctx.font = 'bold 30px system-ui, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(score(state), 24, 76);
  ctx.fillStyle = '#4fd1c5';
  ctx.textAlign = 'center';
  ctx.fillText(state.cleared, W / 2, 76);
  ctx.fillStyle = '#e8ecf5';
  ctx.font = 'bold 22px system-ui, sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText(best, W - 24, 74);

  // Rooftop deck
  ctx.fillStyle = '#1f2d52';
  rrect(TX, GROUND_Y, TW, 18, 6);
  ctx.fill();

  // Obstacles
  for (const ob of state.obstacles) {
    if (ob.x + ob.w < 0 || ob.x > TW) continue;
    ctx.fillStyle = '#ff6b6b';
    rrect(TX + ob.x, GROUND_Y - ob.h, ob.w, ob.h, 5);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    rrect(TX + ob.x + 2, GROUND_Y - ob.h + 2, ob.w - 4, 5, 2);
    ctx.fill();
  }

  // Runner
  const px = TX + PLAYER_X - 10;
  const py = GROUND_Y - 22 - state.y;
  ctx.fillStyle = '#4fd1c5';
  rrect(px, py, 20, 22, 6);
  ctx.fill();
  ctx.fillStyle = '#0b1020';
  ctx.fillRect(px + 12, py + 5, 4, 4);

  // Jump button hint
  ctx.fillStyle = holding ? '#2c4175' : '#1b2848';
  rrect(80, 500, 200, 58, 16);
  ctx.fill();
  ctx.strokeStyle = '#385291';
  ctx.lineWidth = 2;
  rrect(80, 500, 200, 58, 16);
  ctx.stroke();
  ctx.fillStyle = '#e8ecf5';
  ctx.font = 'bold 18px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('TAP / HOLD TO JUMP', W / 2, 535);

  if (isOver(state)) {
    ctx.fillStyle = 'rgba(11,16,32,0.84)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#e8ecf5';
    ctx.font = 'bold 34px system-ui, sans-serif';
    ctx.fillText(state.alive ? 'Run Complete!' : 'Wiped Out!', W / 2, H / 2 - 32);
    ctx.font = '22px system-ui, sans-serif';
    ctx.fillText('Score: ' + score(state), W / 2, H / 2 + 8);
    ctx.fillStyle = '#4fd1c5';
    ctx.font = '18px system-ui, sans-serif';
    ctx.fillText('Tap to run again', W / 2, H / 2 + 50);
  }
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (!isOver(state)) {
    accum += dt;
    const stepDt = 1 / 60;
    while (accum >= stepDt && !isOver(state)) {
      accum -= stepDt;
      const act = holding || tapQueued ? 'jump' : 'run';
      tapQueued = false;
      const res = step(state, act);
      if (res.done) {
        overAt = performance.now();
        const sc = score(state);
        if (sc > best) {
          best = sc;
          try { localStorage.setItem('goe-0020-best', best); } catch (e) {}
        }
      }
    }
  }
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

const inApk = window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform();
if (!inApk && 'serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
