<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#09071a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>Quantum Forge</title>
<style>
  html, body { margin: 0; height: 100%; background: #09071a; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; font-family: system-ui, -apple-system, sans-serif; }
  canvas { display: block; margin: 0 auto; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="logic.js"></script>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const W = 360;
const H = 640;
const CORE_X = 180;
const CORE_Y = 172;
const CORE_R = 72;

let scale = 1;
function resize() {
  scale = Math.min(innerWidth / W, innerHeight / H);
  const dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.style.width = W * scale + 'px';
  canvas.style.height = H * scale + 'px';
  canvas.width = Math.round(W * scale * dpr);
  canvas.height = Math.round(H * scale * dpr);
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
}
addEventListener('resize', resize);
resize();

function rrect(x, y, w, h, r) {
  const rr = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.arcTo(x + w, y, x + w, y + h, rr);
  ctx.arcTo(x + w, y + h, x, y + h, rr);
  ctx.arcTo(x, y + h, x, y, rr);
  ctx.arcTo(x, y, x + w, y, rr);
  ctx.closePath();
}

let audioCtx = null;
function playSfx(freq, freq2, dur, type, vol) {
  try {
    const AC = typeof AudioContext !== 'undefined' ? AudioContext : (typeof webkitAudioContext !== 'undefined' ? webkitAudioContext : null);
    if (!AC) return;
    if (!audioCtx) audioCtx = new AC();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t);
    if (freq2) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq2), t + dur);
    gain.gain.setValueAtTime(vol || 0.09, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + dur);
  } catch (e) {}
}

let best = 0;
try { best = +localStorage.getItem('goe-0168-best') || 0; } catch (e) {}

const FAC_META = [
  { id: 'synthesizer', name: 'Quark Synthesizer', yieldTxt: '+2⚛️/tick', color: '#a855f7' },
  { id: 'splitter', name: 'Boson Splitter', yieldTxt: '+10⚛️ +1⚡', color: '#38bdf8' },
  { id: 'accelerator', name: 'Hadron Collider', yieldTxt: '+40⚛️ +5⚡', color: '#22d3ee' },
  { id: 'quantumComputer', name: 'Quantum Lattice', yieldTxt: '+150⚛️ +20⚡', color: '#f472b6' },
  { id: 'singularityEngine', name: 'Singularity Engine', yieldTxt: '+800⚛️ +100⚡', color: '#fbbf24' }
];

let state = createState(Date.now());
let phase = 0;
let coreScale = 1;
let idleAcc = 0;
let holdCore = false;
let holdAcc = 0;
let overAt = 0;
let rings = [];
let floaters = [];

function fmt(n) {
  if (n >= 1000000) return (n / 1000000).toFixed(2) + 'M';
  if (n >= 10000) return (n / 1000).toFixed(1) + 'k';
  return Math.floor(n).toLocaleString();
}

function restart() {
  state = createState(Date.now());
  coreScale = 1;
  idleAcc = 0;
  holdCore = false;
  holdAcc = 0;
  overAt = 0;
  rings = [];
  floaters = [];
}

function execStep(act) {
  if (isOver(state)) return null;
  const valid = legalActions(state);
  if (!valid.includes(act)) return null;
  const prevM = state.matter;
  const res = step(state, act);
  const diffM = state.matter - prevM;
  const sc = score(state);
  if (sc > best) {
    best = sc;
    try { localStorage.setItem('goe-0168-best', best); } catch (e) {}
  }
  if (res.done) overAt = performance.now();
  return { diffM };
}

function triggerTap(px, py) {
  const out = execStep('action:synthesize_matter');
  if (!out) return;
  coreScale = 1.15;
  rings.push({ r: 22, maxR: 92, alpha: 0.9, color: '#c084fc' });
  floaters.push({ text: '+' + fmt(Math.max(6, out.diffM)) + ' ⚛️', x: px || CORE_X, y: (py || CORE_Y) - 16, t: 0, color: '#e9d5ff' });
  playSfx(320 + (state.cubits * 60), 540, 0.08, 'triangle', 0.09);
}

function toLogical(e) {
  const rect = canvas.getBoundingClientRect();
  return { x: (e.clientX - rect.left) / scale, y: (e.clientY - rect.top) / scale };
}

canvas.addEventListener('pointerdown', (e) => {
  const p = toLogical(e);
  if (isOver(state)) {
    if (performance.now() - overAt > 400) restart();
    return;
  }

  const valid = legalActions(state);

  // Universal Genesis Victory Button
  if (valid.includes('action:trigger_universal_genesis') && p.x >= 20 && p.x <= 340 && p.y >= 248 && p.y <= 282) {
    execStep('action:trigger_universal_genesis');
    playSfx(523, 1568, 0.4, 'triangle', 0.2);
    return;
  }

  // Forge Core Tap / Hold
  const dx = p.x - CORE_X;
  const dy = p.y - CORE_Y;
  if (dx * dx + dy * dy <= (CORE_R + 24) * (CORE_R + 24) && p.y < 284) {
    canvas.setPointerCapture(e.pointerId);
    holdCore = true;
    holdAcc = 0;
    triggerTap(p.x, p.y);
    return;
  }

  // Research & Prestige Row (y = 288..340, 4 buttons width 80)
  if (p.y >= 288 && p.y <= 340 && p.x >= 12 && p.x <= 348) {
    const idx = Math.min(3, Math.max(0, Math.floor((p.x - 12) / 85)));
    const acts = [
      'action:research_matter_compression',
      'action:research_superconductivity',
      'action:research_quantum_resonance',
      'action:quantum_inversion_prestige'
    ];
    if (execStep(acts[idx])) {
      rings.push({ r: 16, maxR: 130, alpha: 1, color: idx === 3 ? '#38bdf8' : '#34d399' });
      floaters.push({ text: idx === 3 ? '+1 CUBIT!' : 'RESEARCHED!', x: p.x, y: 280, t: 0, color: '#6ee7b7' });
      playSfx(idx === 3 ? 180 : 520, idx === 3 ? 920 : 880, 0.24, 'sawtooth', 0.14);
    }
    return;
  }

  // 5 Facility Cards (y = 348..618)
  if (p.y >= 348 && p.y <= 618 && p.x >= 16 && p.x <= 344) {
    const idx = Math.floor((p.y - 348) / 54);
    if (FAC_META[idx]) {
      if (execStep('action:purchase_facility:' + FAC_META[idx].id)) {
        rings.push({ r: 28, maxR: 88, alpha: 0.75, color: FAC_META[idx].color });
        floaters.push({ text: '+1 ' + FAC_META[idx].name.split(' ')[1], x: p.x, y: p.y - 10, t: 0, color: FAC_META[idx].color });
        playSfx(420, 700, 0.11, 'sine', 0.11);
      }
    }
  }
});

addEventListener('pointerup', () => { holdCore = false; });
addEventListener('pointercancel', () => { holdCore = false; });

addEventListener('keydown', (e) => {
  if (isOver(state)) {
    if ((e.key === ' ' || e.key === 'Enter') && performance.now() - overAt > 400) restart();
    return;
  }
  const valid = legalActions(state);
  if (e.key === ' ' || e.key === 'Enter') {
    if (valid.includes('action:trigger_universal_genesis')) execStep('action:trigger_universal_genesis');
    else triggerTap(CORE_X, CORE_Y);
  } else if (e.key >= '1' && e.key <= '5') {
    const idx = parseInt(e.key, 10) - 1;
    if (execStep('action:purchase_facility:' + FAC_META[idx].id)) playSfx(420, 700, 0.11, 'sine', 0.11);
  } else if (e.key === 'q' || e.key === 'Q') {
    execStep('action:research_matter_compression');
  } else if (e.key === 'w' || e.key === 'W') {
    execStep('action:research_superconductivity');
  } else if (e.key === 'e' || e.key === 'E') {
    execStep('action:research_quantum_resonance');
  } else if (e.key === 'p' || e.key === 'P') {
    execStep('action:quantum_inversion_prestige');
  } else if (e.key === 'r' || e.key === 'R') {
    restart();
  }
});

function drawHex(r, rot) {
  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    const a = rot + (i * Math.PI) / 3;
    const x = Math.cos(a) * r;
    const y = Math.sin(a) * r;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.stroke();
}

function update(dt) {
  phase += dt * (1.7 + state.cubits * 0.4);
  coreScale += (1 - coreScale) * Math.min(1, dt * 14);

  if (!isOver(state)) {
    if (holdCore) {
      holdAcc += dt;
      if (holdAcc >= 0.11) {
        holdAcc = 0;
        triggerTap(CORE_X + Math.cos(phase * 4) * 16, CORE_Y + Math.sin(phase * 5) * 14);
      }
    }

    idleAcc += dt;
    if (idleAcc >= 0.60) {
      idleAcc -= 0.60;
      const prevM = state.matter;
      execStep('action:idle_cycle');
      const gain = state.matter - prevM;
      if (gain > 0) {
        floaters.push({ text: '+' + fmt(gain), x: CORE_X + 48, y: CORE_Y - 36, t: 0, color: '#c084fc' });
      }
    }
  }

  for (const r of rings) {
    r.r += (r.maxR - r.r) * Math.min(1, dt * 9);
    r.alpha -= dt * 2.1;
  }
  rings = rings.filter((r) => r.alpha > 0.02);

  for (const f of floaters) f.t += dt;
  floaters = floaters.filter((f) => f.t < 0.75);
}

function draw() {
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#130d2e');
  bg.addColorStop(1, '#060412');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  const cubitBonus = state.researches.quantumResonance ? 1.5 : 1.0;
  const mult = (1 + state.cubits * cubitBonus) * (state.researches.superconductivity ? 1.5 : 1.0);

  // Top Resource HUD
  const cards = [
    { label: 'MATTER', val: fmt(state.matter), col: '#c084fc' },
    { label: 'ENERGY', val: fmt(state.energy), col: '#38bdf8' },
    { label: 'CUBITS', val: state.cubits + ' (' + mult.toFixed(1) + 'x)', col: '#34d399' },
    { label: 'SCORE', val: fmt(score(state)), col: '#fbbf24' }
  ];
  for (let i = 0; i < 4; i++) {
    const cx = 12 + i * 86;
    ctx.fillStyle = '#171136';
    rrect(cx, 10, 80, 46, 8);
    ctx.fill();
    ctx.strokeStyle = '#312566';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.fillStyle = '#94a3b8';
    ctx.font = 'bold 9px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(cards[i].label, cx + 40, 25);
    ctx.fillStyle = cards[i].col;
    ctx.font = 'bold 13px system-ui, sans-serif';
    ctx.fillText(cards[i].val, cx + 40, 45);
  }

  // Quantum Singularity Core
  ctx.save();
  ctx.translate(CORE_X, CORE_Y);
  ctx.scale(coreScale, coreScale);

  const glow = ctx.createRadialGradient(0, 0, 8, 0, 0, 96);
  glow.addColorStop(0, 'rgba(168, 85, 247, 0.45)');
  glow.addColorStop(0.6, 'rgba(56, 189, 248, 0.18)');
  glow.addColorStop(1, 'rgba(6, 4, 18, 0)');
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(0, 0, 96, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = '#38bdf8';
  ctx.lineWidth = 2.5;
  drawHex(66, phase * 0.7);

  ctx.strokeStyle = '#c084fc';
  ctx.lineWidth = 2.5;
  drawHex(52, -phase * 1.1);

  const orbs = Math.min(14, 3 + state.facilities.synthesizer + state.facilities.splitter * 2 + state.facilities.accelerator * 2);
  for (let i = 0; i < orbs; i++) {
    const a = phase * 1.6 + (i / orbs) * Math.PI * 2;
    const rad = 44 + Math.sin(phase * 3 + i) * 12;
    ctx.fillStyle = i % 2 === 0 ? '#67e8f9' : '#f0abfc';
    ctx.beginPath();
    ctx.arc(Math.cos(a) * rad, Math.sin(a) * rad, 3, 0, Math.PI * 2);
    ctx.fill();
  }

  const coreGrad = ctx.createRadialGradient(0, 0, 2, 0, 0, 34);
  coreGrad.addColorStop(0, '#ffffff');
  coreGrad.addColorStop(0.5, '#a855f7');
  coreGrad.addColorStop(1, '#3b0764');
  ctx.fillStyle = coreGrad;
  ctx.beginPath();
  ctx.arc(0, 0, 33 + Math.sin(phase * 4) * 2, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 10px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('FORGE TAP', 0, 4);

  ctx.restore();

  for (const r of rings) {
    ctx.globalAlpha = Math.max(0, r.alpha);
    ctx.strokeStyle = r.color;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(CORE_X, CORE_Y, r.r, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  const valid = legalActions(state);
  if (valid.includes('action:trigger_universal_genesis')) {
    ctx.fillStyle = '#d97706';
    rrect(20, 248, 320, 34, 8);
    ctx.fill();
    ctx.strokeStyle = '#fef08a';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 13px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('🌟 TRIGGER UNIVERSAL GENESIS!', W / 2, 270);
  } else {
    ctx.fillStyle = '#a78bfa';
    ctx.font = '11px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Hold Core to extract Quantum Foam • Auto-tick active', W / 2, 272);
  }

  // Research & Prestige Row (4 chips)
  const resItems = [
    { name: 'COMPRESS', cost: '150⚛️', done: state.researches.matterCompression, ok: valid.includes('action:research_matter_compression'), col: '#34d399' },
    { name: 'SUPERCOND', cost: '600⚛️ 40⚡', done: state.researches.superconductivity, ok: valid.includes('action:research_superconductivity'), col: '#38bdf8' },
    { name: 'RESONANCE', cost: '2.5k⚛️ 150⚡', done: state.researches.quantumResonance, ok: valid.includes('action:research_quantum_resonance'), col: '#f472b6' },
    { name: 'INVERT', cost: '120⚡→+1💠', done: false, ok: valid.includes('action:quantum_inversion_prestige'), col: '#fbbf24' }
  ];
  for (let i = 0; i < 4; i++) {
    const it = resItems[i];
    const bx = 12 + i * 85;
    ctx.fillStyle = it.done ? 'rgba(52,211,153,0.18)' : (it.ok ? '#1e1646' : '#100c26');
    rrect(bx, 288, 81, 48, 7);
    ctx.fill();
    ctx.strokeStyle = it.done ? '#34d399' : (it.ok ? it.col : '#261e4d');
    ctx.lineWidth = it.ok || it.done ? 1.8 : 1;
    ctx.stroke();
    ctx.fillStyle = it.done ? '#34d399' : (it.ok ? '#ffffff' : '#64748b');
    ctx.font = 'bold 9.5px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(it.name + (it.done ? ' ✓' : ''), bx + 40.5, 307);
    ctx.fillStyle = it.done ? '#6ee7b7' : (it.ok ? it.col : '#475569');
    ctx.font = '9px system-ui, sans-serif';
    ctx.fillText(it.done ? 'ACTIVE' : it.cost, bx + 40.5, 325);
  }

  // 5 Facility Cards
  for (let i = 0; i < FAC_META.length; i++) {
    const f = FAC_META[i];
    const count = state.facilities[f.id];
    const cost = getFacilityCost(f.id, count);
    const canBuy = valid.includes('action:purchase_facility:' + f.id);
    const cy = 348 + i * 54;

    ctx.fillStyle = canBuy ? '#1b1440' : '#0f0b24';
    rrect(16, cy, 328, 48, 8);
    ctx.fill();
    ctx.strokeStyle = canBuy ? f.color : '#231b47';
    ctx.lineWidth = canBuy ? 1.8 : 1;
    ctx.stroke();

    ctx.fillStyle = canBuy ? f.color : '#231b47';
    rrect(24, cy + 8, 36, 32, 6);
    ctx.fill();
    ctx.fillStyle = canBuy ? '#09071a' : '#94a3b8';
    ctx.font = 'bold 14px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(count, 42, cy + 29);

    ctx.fillStyle = canBuy ? '#f8fafc' : '#94a3b8';
    ctx.font = 'bold 12px system-ui, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(f.name, 70, cy + 21);

    ctx.fillStyle = '#64748b';
    ctx.font = '10px system-ui, sans-serif';
    ctx.fillText(f.yieldTxt, 70, cy + 37);

    const costStr = fmt(cost.matter) + '⚛️' + (cost.energy > 0 ? ' ' + fmt(cost.energy) + '⚡' : '');
    ctx.fillStyle = canBuy ? '#fde047' : '#475569';
    ctx.font = 'bold 11px system-ui, sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText(costStr, 334, cy + 28);
  }

  for (const f of floaters) {
    ctx.globalAlpha = Math.max(0, 1 - f.t / 0.75);
    ctx.fillStyle = f.color;
    ctx.font = 'bold 13px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(f.text, f.x, f.y - f.t * 36);
  }
  ctx.globalAlpha = 1;

  ctx.fillStyle = '#64748b';
  ctx.font = '10px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('Goal: 1 Singularity + 2💠 + 40k⚛️ • Cycle ' + state.turns + '/' + state.maxTurns + ' • Best ' + fmt(best), W / 2, 632);

  if (isOver(state)) {
    ctx.fillStyle = 'rgba(9, 7, 26, 0.88)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = state.victory ? '#34d399' : '#f87171';
    ctx.font = 'bold 25px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(state.victory ? 'UNIVERSAL GENESIS!' : 'MANIFOLD COLLAPSED', W / 2, H / 2 - 36);
    ctx.fillStyle = '#fbbf24';
    ctx.font = 'bold 22px system-ui, sans-serif';
    ctx.fillText('Score: ' + fmt(score(state)), W / 2, H / 2 + 6);
    ctx.fillStyle = '#c084fc';
    ctx.font = '16px system-ui, sans-serif';
    ctx.fillText('Tap anywhere to forge again', W / 2, H / 2 + 48);
  }
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

const inApk = window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform();
if (!inApk && 'serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
