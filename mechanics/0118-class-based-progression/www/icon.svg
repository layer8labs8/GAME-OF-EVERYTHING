<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <rect width="512" height="512" rx="100" fill="#0d1117"/>
  <circle cx="256" cy="256" r="200" fill="#161b22" stroke="#8957e5" stroke-width="12"/>
  <!-- Class Tree Crown & Triforce / Crest -->
  <polygon points="256,90 320,180 192,180" fill="#f0883e" stroke="#f6ad55" stroke-width="6"/>
  <!-- Branching Node Connections -->
  <line x1="256" y1="180" x2="160" y2="300" stroke="#8957e5" stroke-width="8"/>
  <line x1="256" y1="180" x2="352" y2="300" stroke="#8957e5" stroke-width="8"/>
  <line x1="256" y1="180" x2="256" y2="300" stroke="#8957e5" stroke-width="8"/>
  <!-- Three Tier 1 Class Spheres -->
  <circle cx="160" cy="300" r="32" fill="#da3633" stroke="#f85149" stroke-width="6"/> <!-- Warrior -->
  <circle cx="256" cy="300" r="32" fill="#238636" stroke="#3fb950" stroke-width="6"/> <!-- Rogue -->
  <circle cx="352" cy="300" r="32" fill="#1f6feb" stroke="#58a6ff" stroke-width="6"/> <!-- Mage -->
  <!-- Ascended Crown Star -->
  <polygon points="256,380 270,410 300,410 275,430 285,460 256,440 227,460 237,430 212,410 242,410" fill="#d29922"/>
</svg>
