<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Highway Hauler - Semi-Truck Driving</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #0b1320;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
      padding: 8px;
    }
    header {
      width: 100%;
      max-width: 640px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 12px;
      background: #1e293b;
      border: 1px solid #38bdf8;
      border-radius: 8px;
      margin-bottom: 6px;
    }
    h1 {
      font-size: 1.05rem;
      font-weight: 700;
      color: #38bdf8;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .badge {
      font-size: 0.72rem;
      padding: 2px 8px;
      border-radius: 4px;
      background: #0284c7;
      color: #f0f9ff;
      font-weight: 600;
    }
    #game-container {
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    canvas {
      width: 100%;
      height: auto;
      aspect-ratio: 4/3;
      background: #030712;
      border: 2px solid #0284c7;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(56, 189, 248, 0.2);
    }
    .vitals-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      width: 100%;
    }
    .vital-card {
      background: #0f172a;
      border: 1px solid #1e293b;
      padding: 4px 6px;
      border-radius: 6px;
      text-align: center;
    }
    .vital-title {
      font-size: 0.62rem;
      color: #94a3b8;
      text-transform: uppercase;
    }
    .vital-val {
      font-size: 0.95rem;
      font-weight: 700;
      margin-top: 1px;
    }
    .log-box {
      background: #0f172a;
      border: 1px solid #0284c7;
      border-left: 4px solid #38bdf8;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 0.78rem;
      color: #f1f5f9;
      min-height: 40px;
      display: flex;
      align-items: center;
    }
    .actions-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 6px;
      margin-top: 2px;
    }
    .btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #f1f5f9;
      padding: 8px 6px;
      font-family: inherit;
      font-size: 0.72rem;
      border-radius: 6px;
      cursor: pointer;
      text-transform: uppercase;
      font-weight: 600;
      transition: all 0.15s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .btn:hover {
      background: #334155;
      border-color: #38bdf8;
      color: #fff;
    }
    .btn:active {
      transform: scale(0.97);
    }
    .btn-drive {
      background: #0369a1;
      border-color: #38bdf8;
      color: #f0f9ff;
    }
    .btn-drive:hover {
      background: #0284c7;
    }
    .btn-brake {
      border-color: #ef4444;
      color: #fca5a5;
    }
    .btn-brake:hover {
      background: #450a0a;
    }
    .btn-service {
      border-color: #10b981;
      color: #6ee7b7;
    }
    .btn-service:hover {
      background: #064e3b;
    }
    .btn-gold {
      background: #78350f;
      border-color: #d97706;
      color: #fde68a;
    }
    .btn-gold:hover {
      background: #b45309;
    }
    .footer-bar {
      display: flex;
      justify-content: space-between;
      margin-top: 6px;
      width: 100%;
    }
  </style>
</head>
<body>
  <header>
    <h1>🚛 Highway Hauler</h1>
    <div>
      <span id="turn-badge" class="badge">0 / 100 KM</span>
      <span id="score-badge" class="badge" style="background:#0369a1; color:#f0f9ff;">0 PTS</span>
    </div>
  </header>

  <div id="game-container">
    <canvas id="gameCanvas" width="640" height="480"></canvas>

    <div class="vitals-grid">
      <div class="vital-card">
        <div class="vital-title">Speedometer</div>
        <div id="val-speed" class="vital-val" style="color: #38bdf8;">30 km/h</div>
      </div>
      <div class="vital-card">
        <div class="vital-title">Diesel Fuel</div>
        <div id="val-fuel" class="vital-val" style="color: #facc15;">100 L</div>
      </div>
      <div class="vital-card">
        <div class="vital-title">Fatigue</div>
        <div id="val-fatigue" class="vital-val" style="color: #10b981;">0%</div>
      </div>
      <div class="vital-card">
        <div class="vital-title">Cargo Health</div>
        <div id="val-cargo" class="vital-val" style="color: #4ade80;">100%</div>
      </div>
    </div>

    <div id="game-log" class="log-box">
      18-wheeler diesel engine idling at Interstate on-ramp. Deliver fragile cargo safely.
    </div>

    <div id="actions-panel" class="actions-grid">
      <!-- Injected dynamically -->
    </div>

    <div class="footer-bar">
      <div id="gear-summary" style="font-size:0.7rem; color:#94a3b8;">Transmission: Gear 1 (Max 40 km/h) | Lane: Center</div>
      <button id="bot-toggle-btn" class="btn" style="padding: 4px 10px; font-size: 0.68rem;" onclick="window.toggleBot()">BOT: OFF</button>
    </div>
  </div>

  <script src="logic.js"></script>
  <script>
    let state = createState(Date.now ? Date.now() : 12345);
    let botRunning = false;
    let botInterval = null;

    // Web Audio Synthesizer
    let audioCtx = null;
    function playSfx(type) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const t = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'throttle') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(65, t);
          osc.frequency.linearRampToValueAtTime(110, t + 0.25);
          gain.gain.setValueAtTime(0.3, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + 0.3);
          osc.start(t);
          osc.stop(t + 0.3);
        } else if (type === 'brake') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(400, t);
          osc.frequency.exponentialRampToValueAtTime(150, t + 0.2);
          gain.gain.setValueAtTime(0.35, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + 0.25);
          osc.start(t);
          osc.stop(t + 0.25);
        } else if (type === 'shift') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(250, t);
          osc.frequency.setValueAtTime(350, t + 0.05);
          gain.gain.setValueAtTime(0.25, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + 0.12);
          osc.start(t);
          osc.stop(t + 0.12);
        } else if (type === 'service') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, t);
          osc.frequency.setValueAtTime(659.25, t + 0.1);
          gain.gain.setValueAtTime(0.2, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + 0.3);
          osc.start(t);
          osc.stop(t + 0.3);
        }
      } catch (e) {}
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let dashOffset = 0;
    const LANE_NAMES = ['Slow / Right Shoulder', 'Center Cruising', 'Left Passing'];

    function render() {
      // Status badges
      document.getElementById('turn-badge').textContent = state.distance + ' / ' + ROUTE_LENGTH_KM + ' KM';
      document.getElementById('score-badge').textContent = score(state) + ' PTS';
      document.getElementById('game-log').textContent = state.gameMessage;

      document.getElementById('val-speed').textContent = state.speed + ' km/h';

      const fEl = document.getElementById('val-fuel');
      fEl.textContent = state.fuel + ' L';
      fEl.style.color = state.fuel > 30 ? '#facc15' : '#ef4444';

      const fatEl = document.getElementById('val-fatigue');
      fatEl.textContent = state.fatigue + '%';
      fatEl.style.color = state.fatigue < 50 ? '#10b981' : (state.fatigue < 80 ? '#f59e0b' : '#ef4444');

      const cEl = document.getElementById('val-cargo');
      cEl.textContent = state.cargoIntegrity + '%';
      cEl.style.color = state.cargoIntegrity > 60 ? '#4ade80' : '#ef4444';

      document.getElementById('gear-summary').textContent =
        'Gear ' + state.gear + ' (Max ' + GEAR_MAX_SPEED[state.gear] + ' km/h) | Lane: ' + LANE_NAMES[state.lane];

      // Canvas Rendering
      const w = canvas.width;
      const h = canvas.height;
      const cx = w / 2;
      const horizonY = h * 0.38;

      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, w, h);

      // Sky & Twilight horizon
      const skyGrad = ctx.createLinearGradient(0, 0, 0, horizonY);
      skyGrad.addColorStop(0, '#0284c7');
      skyGrad.addColorStop(0.7, '#38bdf8');
      skyGrad.addColorStop(1, '#fed7aa');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, w, horizonY);

      // Distant tree silhouette along highway
      ctx.fillStyle = '#064e3b';
      ctx.fillRect(0, horizonY - 14, w, 14);

      // Highway 3D Perspective
      const roadTopW = 120;
      const roadBottomW = 520;

      ctx.fillStyle = '#334155';
      ctx.beginPath();
      ctx.moveTo(cx - roadTopW / 2, horizonY);
      ctx.lineTo(cx + roadTopW / 2, horizonY);
      ctx.lineTo(cx + roadBottomW / 2, h);
      ctx.lineTo(cx - roadBottomW / 2, h);
      ctx.closePath();
      ctx.fill();

      // White solid outer road shoulders
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 4;
      ctx.stroke();

      // Dashed lane dividers
      dashOffset = (dashOffset + Math.max(2, Math.floor(state.speed / 6))) % 36;
      ctx.strokeStyle = '#facc15';
      ctx.lineWidth = 3;
      ctx.setLineDash([18, 18]);
      ctx.lineDashOffset = -dashOffset;

      // Divider between lane 0 and 1
      ctx.beginPath();
      ctx.moveTo(cx - roadTopW / 6, horizonY);
      ctx.lineTo(cx - roadBottomW / 6, h);
      ctx.stroke();

      // Divider between lane 1 and 2
      ctx.beginPath();
      ctx.moveTo(cx + roadTopW / 6, horizonY);
      ctx.lineTo(cx + roadBottomW / 6, h);
      ctx.stroke();
      ctx.setLineDash([]);

      // Draw Traffic Ahead in Lanes
      for (let l = 0; l < 3; l++) {
        const obs = state.traffic[l];
        if (obs) {
          const t = 0.45; // distance scale
          const ty = horizonY + (h - horizonY) * t;
          const curW = roadTopW + (roadBottomW - roadTopW) * t;
          const laneW = curW / 3;
          const tx = cx - curW / 2 + l * laneW + laneW / 2;

          ctx.fillStyle = obs.type === 'road_work' ? '#f97316' : '#64748b';
          ctx.fillRect(tx - 15, ty - 12, 30, 24);
          ctx.fillStyle = '#fef08a';
          ctx.fillRect(tx - 12, ty + 8, 6, 4);
          ctx.fillRect(tx + 6, ty + 8, 6, 4);
        }
      }

      // Draw Semi-Truck Hood & Windshield from Driver's Perspective
      const hoodY = h - 75;
      const curW = roadBottomW * 0.9;
      const laneW = curW / 3;
      const px = cx - curW / 2 + state.lane * laneW + laneW / 2;

      // Heavy chrome semi-truck hood
      ctx.fillStyle = '#0284c7';
      ctx.beginPath();
      ctx.moveTo(px - 60, h);
      ctx.lineTo(px - 40, hoodY);
      ctx.lineTo(px + 40, hoodY);
      ctx.lineTo(px + 60, h);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 3;
      ctx.stroke();

      // Chrome hood ornament / centerline
      ctx.fillStyle = '#cbd5e1';
      ctx.fillRect(px - 3, hoodY, 6, h - hoodY);

      // Game Over Screen
      if (isOver(state)) {
        ctx.fillStyle = state.victory ? 'rgba(6, 78, 59, 0.9)' : 'rgba(69, 10, 10, 0.9)';
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 24px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(state.victory ? 'HAUL COMPLETE - CARGO DELIVERED!' : 'DELIVERY FAILED - ROUTE ABORTED', cx, cy - 20);
        ctx.font = '14px sans-serif';
        ctx.fillText('Driver Evaluation Score: ' + score(state), cx, cy + 15);
      }

      updateActions();
    }

    function updateActions() {
      const panel = document.getElementById('actions-panel');
      if (isOver(state)) {
        panel.innerHTML = '<button class="btn btn-drive" onclick="window.restartGame()">NEW FREIGHT CONTRACT</button>';
        return;
      }

      const actions = legalActions(state);
      let html = '';

      for (const act of actions) {
        let cls = 'btn';
        let label = act;
        let sub = '';

        if (act === 'action:accelerate_throttle') {
          cls += ' btn-drive';
          label = '🚚 Throttle Accelerate';
          sub = '+Speed (Gear ' + state.gear + ')';
        } else if (act === 'action:apply_service_brakes') {
          cls += ' btn-brake';
          label = '🛑 Service Brakes';
          sub = '-30 km/h Deceleration';
        } else if (act === 'action:shift_gear_up') {
          label = '⬆️ Shift Gear Up';
          sub = 'To Gear ' + (state.gear + 1);
        } else if (act === 'action:shift_gear_down') {
          label = '⬇️ Shift Gear Down';
          sub = 'To Gear ' + (state.gear - 1);
        } else if (act === 'action:shift_lane:left') {
          label = '◀ Merge Left';
          sub = 'Lane Change';
        } else if (act === 'action:shift_lane:right') {
          label = '▶ Merge Right';
          sub = 'Lane Change';
        } else if (act === 'action:stop_at_fuel_depot') {
          cls += ' btn-service';
          label = '⛽ Service Plaza Fuel';
          sub = 'Fill Tank to 100L';
        } else if (act === 'action:rest_sleeper_cab') {
          cls += ' btn-service';
          label = '💤 Sleeper Cab Rest';
          sub = 'Reset Fatigue to 0%';
        } else if (act === 'action:deliver_freight') {
          cls += ' btn-gold';
          label = '🏆 Finalize Container Delivery!';
          sub = 'Victory';
        }

        html += '<button class="' + cls + '" onclick="window.triggerAction(\'' + act + '\')"><span>' + label + '</span>' + (sub ? '<span style="font-size:0.62rem;opacity:0.8;">' + sub + '</span>' : '') + '</button>';
      }

      panel.innerHTML = html;
    }

    window.triggerAction = function(act) {
      if (isOver(state)) return;
      if (act.includes('accelerate')) playSfx('throttle');
      else if (act.includes('brake')) playSfx('brake');
      else if (act.includes('gear') || act.includes('lane')) playSfx('shift');
      else if (act.includes('fuel') || act.includes('rest') || act.includes('deliver')) playSfx('service');

      step(state, act);
      render();
    };

    window.restartGame = function() {
      state = createState(Date.now ? Date.now() : 12345);
      render();
    };

    window.toggleBot = function() {
      botRunning = !botRunning;
      document.getElementById('bot-toggle-btn').textContent = botRunning ? 'BOT: ON' : 'BOT: OFF';
      document.getElementById('bot-toggle-btn').style.background = botRunning ? '#0284c7' : '#1e293b';

      if (botRunning) {
        botInterval = setInterval(() => {
          if (isOver(state)) {
            state = createState(Date.now ? Date.now() : 9999);
            render();
            return;
          }
          const acts = legalActions(state);
          if (acts.length > 0) {
            let choice = acts[0];
            if (acts.includes('action:deliver_freight')) choice = 'action:deliver_freight';
            else if (state.fuel < 40 && acts.includes('action:stop_at_fuel_depot')) choice = 'action:stop_at_fuel_depot';
            else if (state.fatigue > 60 && acts.includes('action:rest_sleeper_cab')) choice = 'action:rest_sleeper_cab';
            else if (state.traffic[state.lane] && acts.includes('action:shift_lane:left')) choice = 'action:shift_lane:left';
            else if (state.traffic[state.lane] && acts.includes('action:shift_lane:right')) choice = 'action:shift_lane:right';
            else if (state.speed >= 30 && acts.includes('action:shift_gear_up')) choice = 'action:shift_gear_up';
            else if (acts.includes('action:accelerate_throttle')) choice = 'action:accelerate_throttle';
            else choice = acts[0];
            window.triggerAction(choice);
          }
        }, 250);
      } else {
        clearInterval(botInterval);
      }
    };

    render();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
