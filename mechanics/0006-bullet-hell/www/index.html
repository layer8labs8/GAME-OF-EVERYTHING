<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#070814">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>Danmaku Veil</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #070814;
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  canvas {
    display: block;
    margin: 0 auto;
    touch-action: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="logic.js"></script>
<script>
const {
  WIDTH,
  HEIGHT,
  createState,
  legalActions,
  step,
  isOver,
  score
} = GameLogic;

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const W = 360;
const H = 640;

let scale = 1;
function resize() {
  scale = Math.min(innerWidth / W, innerHeight / H);
  const dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.style.width = W * scale + 'px';
  canvas.style.height = H * scale + 'px';
  canvas.width = Math.round(W * scale * dpr);
  canvas.height = Math.round(H * scale * dpr);
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
}
addEventListener('resize', resize);
resize();

let state = createState(Date.now());
let focusMode = false;
let overAt = 0;

function restart() {
  state = createState(Date.now());
  focusMode = false;
  overAt = 0;
}

function toLogical(e) {
  const rect = canvas.getBoundingClientRect();
  return { x: (e.clientX - rect.left) / scale, y: (e.clientY - rect.top) / scale };
}

function doAction(actionName) {
  if (isOver(state)) return;
  if (!legalActions(state).includes(actionName)) return;
  const res = step(state, actionName);
  if (res.done) overAt = performance.now();
}

function handleMove(dir) {
  if (focusMode) {
    if (dir === 'left') doAction('focus_left');
    else if (dir === 'right') doAction('focus_right');
    else doAction(dir);
  } else {
    doAction(dir);
  }
}

// Touch Handling
canvas.addEventListener('pointerdown', (e) => {
  const p = toLogical(e);
  if (isOver(state)) {
    if (performance.now() - overAt > 400) restart();
    return;
  }

  // D-pad controls around (110, 560)
  const cx = 100;
  const cy = 560;

  if (p.x >= cx - 25 && p.x <= cx + 25 && p.y >= cy - 65 && p.y <= cy - 20) {
    handleMove('up');
    return;
  }
  if (p.x >= cx - 25 && p.x <= cx + 25 && p.y >= cy + 20 && p.y <= cy + 65) {
    handleMove('down');
    return;
  }
  if (p.x >= cx - 65 && p.x <= cx - 20 && p.y >= cy - 25 && p.y <= cy + 25) {
    handleMove('left');
    return;
  }
  if (p.x >= cx + 20 && p.x <= cx + 65 && p.y >= cy - 25 && p.y <= cy + 25) {
    handleMove('right');
    return;
  }
  if (p.x >= cx - 18 && p.x <= cx + 18 && p.y >= cy - 18 && p.y <= cy + 18) {
    doAction('wait');
    return;
  }

  // Focus Button (205, 560)
  if (p.x >= 180 && p.x <= 250 && p.y >= 530 && p.y <= 590) {
    focusMode = !focusMode;
    return;
  }

  // Bomb Button (295, 560)
  if (p.x >= 270 && p.x <= 345 && p.y >= 530 && p.y <= 590) {
    doAction('bomb');
    return;
  }

  // Touch glide across playfield
  if (p.y >= 60 && p.y <= 490) {
    const dx = p.x - state.player.x;
    const dy = p.y - state.player.y;
    if (Math.abs(dx) > Math.abs(dy)) {
      handleMove(dx > 0 ? 'right' : 'left');
    } else {
      handleMove(dy > 0 ? 'down' : 'up');
    }
  }
});

addEventListener('keydown', (e) => {
  if (isOver(state)) {
    if ((e.key === ' ' || e.key === 'Enter') && performance.now() - overAt > 400) restart();
    return;
  }

  if (e.key === 'ArrowLeft' || e.key === 'a') handleMove('left');
  else if (e.key === 'ArrowRight' || e.key === 'd') handleMove('right');
  else if (e.key === 'ArrowUp' || e.key === 'w') handleMove('up');
  else if (e.key === 'ArrowDown' || e.key === 's') handleMove('down');
  else if (e.key === 'Shift') focusMode = !focusMode;
  else if (e.key === 'x' || e.key === 'b') doAction('bomb');
  else if (e.key === ' ' || e.key === 'e') doAction('wait');
  else if (e.key === 'r') restart();
});

function drawRoundedRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function draw() {
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#130c24');
  bg.addColorStop(1, '#070814');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // Boss HP Bar across top
  const hpRatio = Math.max(0, state.boss.hp / state.boss.maxHp);
  ctx.fillStyle = '#1e1b2e';
  ctx.fillRect(0, 0, W, 8);
  ctx.fillStyle = hpRatio > 0.5 ? '#f43f5e' : hpRatio > 0.25 ? '#a855f7' : '#ec4899';
  ctx.fillRect(0, 0, W * hpRatio, 8);

  // Header HUD
  ctx.fillStyle = '#64748b';
  ctx.font = '11px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('SHIELDS', 20, 26);
  ctx.textAlign = 'center';
  ctx.fillText('GRAZE', W / 2, 26);
  ctx.textAlign = 'right';
  ctx.fillText('SCORE', W - 20, 26);

  ctx.fillStyle = '#ef4444';
  ctx.font = 'bold 15px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('♥ '.repeat(state.player.lives) || 'CRITICAL', 20, 46);

  ctx.fillStyle = '#38bdf8';
  ctx.textAlign = 'center';
  ctx.fillText(`⚡ ${state.grazeCount}`, W / 2, 46);

  ctx.fillStyle = '#f8fafc';
  ctx.textAlign = 'right';
  ctx.fillText(score(state), W - 20, 46);

  // Playfield separator line
  ctx.strokeStyle = '#1e293b';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, 500);
  ctx.lineTo(W, 500);
  ctx.stroke();

  // Draw Boss Crimson Core
  const bx = state.boss.x;
  const by = state.boss.y;
  ctx.fillStyle = '#881337';
  ctx.beginPath();
  ctx.arc(bx, by, 26, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#f43f5e';
  ctx.beginPath();
  ctx.arc(bx, by, 16, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(bx, by, 7, 0, Math.PI * 2);
  ctx.fill();

  // Orbiting rings
  ctx.strokeStyle = '#fda4af';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(bx, by, 34, state.stepCount * 0.1, state.stepCount * 0.1 + Math.PI * 1.5);
  ctx.stroke();

  // Draw Player Bullets
  ctx.fillStyle = '#38bdf8';
  for (const pb of state.playerBullets) {
    ctx.fillRect(pb.x - 1.5, pb.y - 6, 3, 12);
  }

  // Draw Hostile Danmaku Bullets
  for (const b of state.bullets) {
    ctx.fillStyle = b.color || '#f43f5e';
    ctx.beginPath();
    ctx.arc(b.x, b.y, 4.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(b.x, b.y, 2, 0, Math.PI * 2);
    ctx.fill();
  }

  // Draw Player Ship
  const px = state.player.x;
  const py = state.player.y;
  ctx.fillStyle = state.player.invuln > 0 ? '#94a3b8' : '#0284c7';
  ctx.beginPath();
  ctx.moveTo(px, py - 14);
  ctx.lineTo(px + 12, py + 10);
  ctx.lineTo(px, py + 6);
  ctx.lineTo(px - 12, py + 10);
  ctx.closePath();
  ctx.fill();

  // Glowing Micro-Core Hitbox (4px)
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(px, py, 3.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#ef4444';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Graze Aura when focusing
  if (focusMode) {
    ctx.strokeStyle = 'rgba(56, 189, 248, 0.4)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(px, py, 19, 0, Math.PI * 2);
    ctx.stroke();
  }

  // Bottom Controls Panel
  const cx = 100;
  const cy = 560;

  function drawPad(bx, by, bw, bh, txt) {
    ctx.fillStyle = '#1e1b2e';
    drawRoundedRect(bx, by, bw, bh, 6);
    ctx.fill();
    ctx.strokeStyle = '#332e4d';
    ctx.stroke();
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 13px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(txt, bx + bw / 2, by + bh / 2 + 5);
  }

  drawPad(cx - 20, cy - 60, 40, 35, '▲');
  drawPad(cx - 20, cy + 25, 40, 35, '▼');
  drawPad(cx - 60, cy - 18, 35, 40, '◀');
  drawPad(cx + 25, cy - 18, 35, 40, '▶');
  drawPad(cx - 15, cy - 15, 30, 30, '●');

  // Focus Button
  ctx.fillStyle = focusMode ? '#0284c7' : '#1e1b2e';
  drawRoundedRect(180, 535, 68, 50, 8);
  ctx.fill();
  ctx.strokeStyle = focusMode ? '#38bdf8' : '#332e4d';
  ctx.stroke();
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 12px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('FOCUS', 214, 560);
  ctx.font = '10px sans-serif';
  ctx.fillStyle = '#94a3b8';
  ctx.fillText(focusMode ? 'SLOW ON' : 'OFF', 214, 574);

  // Bomb Button
  const bombReady = state.bombMeter >= 100;
  ctx.fillStyle = bombReady ? '#f59e0b' : '#1e1b2e';
  drawRoundedRect(268, 535, 74, 50, 8);
  ctx.fill();
  ctx.strokeStyle = bombReady ? '#fde047' : '#332e4d';
  ctx.stroke();
  ctx.fillStyle = bombReady ? '#0f172a' : '#ffffff';
  ctx.font = 'bold 13px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('BOMB', 305, 560);
  ctx.font = '10px sans-serif';
  ctx.fillStyle = bombReady ? '#78350f' : '#64748b';
  ctx.fillText(`${state.bombMeter}%`, 305, 574);

  ctx.fillStyle = '#64748b';
  ctx.font = '10px sans-serif';
  ctx.fillText('Arrows / WASD glide · Shift Focus · X / Bomb blast', W / 2, 622);

  // Overlay
  if (isOver(state)) {
    ctx.fillStyle = 'rgba(7, 8, 20, 0.94)';
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    if (state.won) {
      ctx.fillStyle = '#10b981';
      ctx.font = 'bold 30px sans-serif';
      ctx.fillText('CRIMSON CORE DOWN', W / 2, H / 2 - 35);
      ctx.fillStyle = '#cbd5e1';
      ctx.font = '16px sans-serif';
      ctx.fillText('Danmaku curtain vanquished!', W / 2, H / 2 - 5);
    } else {
      ctx.fillStyle = '#ef4444';
      ctx.font = 'bold 30px sans-serif';
      ctx.fillText('CORE OVERHEAT', W / 2, H / 2 - 35);
      ctx.fillStyle = '#cbd5e1';
      ctx.font = '16px sans-serif';
      ctx.fillText('All fighter shields obliterated!', W / 2, H / 2 - 5);
    }

    ctx.fillStyle = '#38bdf8';
    ctx.font = 'bold 22px sans-serif';
    ctx.fillText(`Final Score: ${score(state)}`, W / 2, H / 2 + 30);

    ctx.fillStyle = '#94a3b8';
    ctx.font = '14px sans-serif';
    ctx.fillText('Tap anywhere to sortie again', W / 2, H / 2 + 75);
  }
}

function frame() {
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

const inApk = window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform();
if (!inApk && 'serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
