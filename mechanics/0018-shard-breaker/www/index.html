<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b1020">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>Shard Breaker</title>
<meta name="description" content="Bounce a ball off your paddle to smash every crystal, and don't let it fall.">
<style>
  html, body { margin: 0; height: 100%; background: #0b1020; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; margin: 0 auto; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="logic.js"></script>
<script src="kit.js"></script>
<script>
const { W: CW, H: CH, PADDLE_Y, createState, step, isOver, score } = GameLogic;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const W = 360;
const H = 640;
const CX = (W - CW) / 2;
const CY = 104;
const ROW_COLORS = ['#ff6b6b', '#ffa94d', '#ffd43b', '#69db7c', '#4dabf7'];

let scale = 1;
function resize() {
  scale = Math.min(innerWidth / W, innerHeight / H);
  const dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.style.width = W * scale + 'px';
  canvas.style.height = H * scale + 'px';
  canvas.width = Math.round(W * scale * dpr);
  canvas.height = Math.round(H * scale * dpr);
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
}
addEventListener('resize', resize);
resize();

let best = 0;
try { best = +localStorage.getItem('goe-0018-best') || 0; } catch (e) {}

let state = createState(Date.now());
let targetX = null;
const keys = { left: false, right: false };
let accum = 0;
let overAt = 0;

function restart() {
  state = createState(Date.now());
  targetX = null;
  accum = 0;
  overAt = 0;
}

function rrect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function toArenaX(e) {
  const rect = canvas.getBoundingClientRect();
  return (e.clientX - rect.left) / scale - CX;
}

canvas.addEventListener('pointerdown', (e) => {
  if (isOver(state)) {
    if (performance.now() - overAt > 400) restart();
    return;
  }
  canvas.setPointerCapture(e.pointerId);
  targetX = toArenaX(e);
});
canvas.addEventListener('pointermove', (e) => {
  if (e.buttons || e.pointerType === 'touch') targetX = toArenaX(e);
});
canvas.addEventListener('pointerup', () => { targetX = null; });
canvas.addEventListener('pointercancel', () => { targetX = null; });

addEventListener('keydown', (e) => {
  if (isOver(state)) {
    if ((e.key === ' ' || e.key === 'Enter') && performance.now() - overAt > 400) restart();
    return;
  }
  if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
  if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
});
addEventListener('keyup', (e) => {
  if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
  if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
});

function pickAction() {
  if (keys.left && !keys.right) return 'L';
  if (keys.right && !keys.left) return 'R';
  if (targetX !== null) {
    if (targetX < state.paddleX - 5) return 'L';
    if (targetX > state.paddleX + 5) return 'R';
  }
  return 'S';
}

function draw() {
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#16213e');
  bg.addColorStop(1, '#0b1020');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = '#8a93a8';
  ctx.font = '12px system-ui, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('SCORE', 24, 34);
  ctx.textAlign = 'center';
  ctx.fillText(`WAVE ${state.wave}`, W / 2, 34);
  ctx.textAlign = 'right';
  ctx.fillText('BEST', W - 24, 34);

  ctx.fillStyle = '#e8ecf5';
  ctx.font = 'bold 28px system-ui, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(score(state), 24, 68);
  ctx.font = 'bold 22px system-ui, sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText(best, W - 24, 66);

  // Lives dots
  for (let i = 0; i < 3; i++) {
    ctx.fillStyle = i < state.lives ? '#ff6b6b' : '#2a3554';
    ctx.beginPath();
    ctx.arc(W / 2 - 18 + i * 18, 60, 6, 0, Math.PI * 2);
    ctx.fill();
  }

  // Chamber
  ctx.fillStyle = '#0f162c';
  rrect(CX, CY, CW, CH, 12);
  ctx.fill();
  ctx.strokeStyle = '#293a66';
  ctx.lineWidth = 2;
  rrect(CX, CY, CW, CH, 12);
  ctx.stroke();

  ctx.fillStyle = 'rgba(200,215,255,0.5)';
  for (let i = 0; i < 40; i++) {
    const sx = (i * 73) % CW;
    const sy = (i * 131 + performance.now() * (0.004 + (i % 3) * 0.003)) % CH;
    ctx.fillRect(CX + sx, CY + sy, 1.5, 1.5);
  }

  for (const br of state.bricks) {
    const color = ROW_COLORS[br.row % ROW_COLORS.length];
    const bx = CX + br.x;
    const by = CY + br.y;
    ctx.globalAlpha = 0.22;
    ctx.fillStyle = color;
    rrect(bx - 2, by - 2, br.w + 4, br.h + 4, 6);
    ctx.fill();
    ctx.globalAlpha = 1;
    const shade = ctx.createLinearGradient(bx, by, bx, by + br.h);
    shade.addColorStop(0, color);
    shade.addColorStop(1, 'rgba(0,0,0,0.35)');
    ctx.fillStyle = color;
    rrect(bx, by, br.w, br.h, 4);
    ctx.fill();
    ctx.fillStyle = shade;
    rrect(bx, by, br.w, br.h, 4);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.beginPath();
    ctx.moveTo(bx + 3, by + 3);
    ctx.lineTo(bx + br.w * 0.45, by + 3);
    ctx.lineTo(bx + br.w * 0.3, by + br.h - 3);
    ctx.lineTo(bx + 3, by + br.h - 3);
    ctx.closePath();
    ctx.fill();
  }

  const px = CX + state.paddleX - state.paddleW / 2;
  const glow = ctx.createLinearGradient(px, 0, px + state.paddleW, 0);
  glow.addColorStop(0, '#2bb5a8');
  glow.addColorStop(0.5, '#b8fff5');
  glow.addColorStop(1, '#2bb5a8');
  ctx.globalAlpha = 0.25;
  ctx.fillStyle = '#4fd1c5';
  rrect(px - 4, CY + PADDLE_Y - 10, state.paddleW + 8, 20, 10);
  ctx.fill();
  ctx.globalAlpha = 1;
  ctx.fillStyle = glow;
  rrect(px, CY + PADDLE_Y - 6, state.paddleW, 12, 6);
  ctx.fill();

  trail.push({ x: CX + state.ball.x, y: CY + state.ball.y });
  if (trail.length > 10) trail.shift();
  trail.forEach((t, i) => {
    ctx.globalAlpha = (i / trail.length) * 0.45;
    ctx.fillStyle = '#9fd8ff';
    ctx.beginPath();
    ctx.arc(t.x, t.y, state.ball.r * (0.4 + (i / trail.length) * 0.6), 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
  const bx2 = CX + state.ball.x;
  const by2 = CY + state.ball.y;
  const ballGlow = ctx.createRadialGradient(bx2, by2, 1, bx2, by2, state.ball.r * 3);
  ballGlow.addColorStop(0, 'rgba(255,255,255,0.95)');
  ballGlow.addColorStop(0.35, 'rgba(159,216,255,0.55)');
  ballGlow.addColorStop(1, 'rgba(159,216,255,0)');
  ctx.fillStyle = ballGlow;
  ctx.fillRect(bx2 - state.ball.r * 3, by2 - state.ball.r * 3, state.ball.r * 6, state.ball.r * 6);

  ctx.fillStyle = '#6c7793';
  ctx.font = '13px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('Slide finger or press Left / Right to aim', W / 2, 584);

  if (isOver(state)) {
    ctx.fillStyle = 'rgba(11,16,32,0.84)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#e8ecf5';
    ctx.font = 'bold 34px system-ui, sans-serif';
    ctx.fillText('Game Over', W / 2, H / 2 - 32);
    ctx.font = '22px system-ui, sans-serif';
    ctx.fillText('Score: ' + score(state), W / 2, H / 2 + 8);
    ctx.fillStyle = '#4fd1c5';
    ctx.font = '18px system-ui, sans-serif';
    ctx.fillText('Tap to restart', W / 2, H / 2 + 50);
  }
}

const trail = [];
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (!isOver(state)) {
    accum += dt;
    const stepDt = 1 / 60;
    while (accum >= stepDt && !isOver(state)) {
      accum -= stepDt;
      const res = step(state, pickAction());
      if (res.done) {
        overAt = performance.now();
        const sc = score(state);
        if (sc > best) {
          best = sc;
          try { localStorage.setItem('goe-0018-best', best); } catch (e) {}
        }
      }
    }
  }
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

const inApk = window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform();
if (!inApk && 'serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
