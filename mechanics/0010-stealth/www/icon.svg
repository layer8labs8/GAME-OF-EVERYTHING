<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="cone" cx="20%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#ffd166" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ef476f" stop-opacity="0.1"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#141c2f"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <!-- Flashlight beam -->
  <path d="M 120 180 L 420 80 L 440 380 Z" fill="url(#cone)"/>
  <!-- Guard -->
  <circle cx="120" cy="180" r="32" fill="#ef476f"/>
  <!-- Infiltrator crouching in shadow -->
  <circle cx="340" cy="360" r="28" fill="#06d6a0"/>
  <!-- Night vision goggles glowing -->
  <circle cx="332" cy="355" r="5" fill="#10b981"/>
  <circle cx="348" cy="355" r="5" fill="#10b981"/>
  <!-- Shadow vignette border -->
  <rect x="20" y="20" width="472" height="472" rx="80" fill="none" stroke="#2a3b5c" stroke-width="8"/>
</svg>
