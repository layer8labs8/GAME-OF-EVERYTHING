<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0d041c">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Arcade Blast</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d041c; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; margin: 0 auto; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="logic.js"></script>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const W = 360;
const H = 640;
let scale = 1;

function resize() {
  scale = Math.min(innerWidth / W, innerHeight / H);
  const dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.style.width = W * scale + 'px';
  canvas.style.height = H * scale + 'px';
  canvas.width = Math.round(W * scale * dpr);
  canvas.height = Math.round(H * scale * dpr);
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
}
addEventListener('resize', resize);
resize();

function rrect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

let best = 0;
try { best = +localStorage.getItem('goe-0178-best') || 0; } catch (e) {}

let state = createState(Date.now());
let particles = [];
let floaters = [];
let animTimer = 0;
let overAt = 0;

function restart() {
  state = createState(Date.now());
  particles = [];
  floaters = [];
  overAt = 0;
}

const TARGET_COLORS = {
  ruby: '#ef4444',
  sapphire: '#0ea5e9',
  emerald: '#22c55e',
  diamond: '#c084fc',
  skull: '#dc2626'
};

const TARGET_LABELS = {
  ruby: 'RUBY +150',
  sapphire: 'SAPPHIRE +300',
  emerald: 'EMERALD +600',
  diamond: 'DIAMOND +1200',
  skull: 'HAZARD SKULL!'
};

function performAction(act) {
  if (isOver(state)) return;
  const legals = legalActions(state);
  if (!legals.includes(act)) return;

  const oldPoints = state.points;
  const oldShield = state.shield;
  const res = step(state, act);

  const gain = state.points - oldPoints;
  if (gain > 0) {
    floaters.push({ text: '+' + gain, x: 180, y: 220, t: 0, color: '#facc15' });
  } else if (state.shield < oldShield) {
    floaters.push({ text: 'SHIELD DAMAGED!', x: 180, y: 220, t: 0, color: '#ef4444' });
  } else if (act.includes('laser')) {
    floaters.push({ text: 'OVERDRIVE LASER!', x: 180, y: 220, t: 0, color: '#38bdf8' });
  } else if (act.includes('frenzy')) {
    floaters.push({ text: 'FRENZY BURST x4!', x: 180, y: 220, t: 0, color: '#a855f7' });
  }

  // Spark burst
  for (let i = 0; i < 15; i++) {
    particles.push({
      x: 180 + (Math.random() - 0.5) * 80,
      y: 260 + (Math.random() - 0.5) * 80,
      vx: (Math.random() - 0.5) * 300,
      vy: (Math.random() - 0.5) * 300,
      color: gain > 0 ? '#facc15' : '#ef4444',
      life: 0.35,
      maxLife: 0.35
    });
  }

  if (isOver(state)) {
    overAt = performance.now();
    const sc = score(state);
    if (sc > best) {
      best = sc;
      try { localStorage.setItem('goe-0178-best', best); } catch (e) {}
    }
  }
}

// 4 Matrix Target Pad Hitboxes on Canvas
const PADS = [
  { idx: 0, x: 25, y: 120, w: 145, h: 145 },
  { idx: 1, x: 190, y: 120, w: 145, h: 145 },
  { idx: 2, x: 25, y: 285, w: 145, h: 145 },
  { idx: 3, x: 190, y: 285, w: 145, h: 145 }
];

// Bottom Action Buttons
const BTNS = [
  { id: 'laser', label: '⚡ OVERDRIVE LASER', action: 'action:charge_overdrive_laser', x: 20, y: 470, w: 320, h: 46, col: '#0284c7' },
  { id: 'frenzy', label: '🔥 FRENZY BURST (4x)', action: 'action:trigger_frenzy_burst', x: 20, y: 524, w: 155, h: 48, col: '#a855f7' },
  { id: 'refresh', label: '🔄 SHUFFLE MATRIX', action: 'action:refresh_targets', x: 185, y: 524, w: 155, h: 48, col: '#10b981' }
];

function toLogical(e) {
  const rect = canvas.getBoundingClientRect();
  return { x: (e.clientX - rect.left) / scale, y: (e.clientY - rect.top) / scale };
}

canvas.addEventListener('pointerdown', (e) => {
  const p = toLogical(e);
  if (isOver(state)) {
    if (performance.now() - overAt > 400) restart();
    return;
  }
  // Check Pad Taps
  for (const pad of PADS) {
    if (p.x >= pad.x && p.x <= pad.x + pad.w && p.y >= pad.y && p.y <= pad.y + pad.h) {
      performAction('action:blast_target:' + pad.idx);
      return;
    }
  }
  // Check Button Taps
  for (const b of BTNS) {
    if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) {
      performAction(b.action);
      return;
    }
  }
});

addEventListener('keydown', (e) => {
  if (isOver(state)) {
    if ((e.key === ' ' || e.key === 'Enter') && performance.now() - overAt > 400) restart();
    return;
  }
  const k = e.key.toLowerCase();
  if (k === '1' || k === 'q') performAction('action:blast_target:0');
  else if (k === '2' || k === 'w') performAction('action:blast_target:1');
  else if (k === '3' || k === 'a') performAction('action:blast_target:2');
  else if (k === '4' || k === 's') performAction('action:blast_target:3');
  else if (k === ' ' || k === 'e') performAction('action:charge_overdrive_laser');
  else if (k === 'f') performAction('action:trigger_frenzy_burst');
  else if (k === 'r') performAction('action:refresh_targets');
});

function draw(dt) {
  animTimer += dt;

  // Background
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#150628');
  bg.addColorStop(1, '#080210');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // Top Dashboard Header
  ctx.fillStyle = 'rgba(21, 6, 40, 0.9)';
  ctx.fillRect(0, 0, W, 50);

  ctx.fillStyle = '#facc15';
  ctx.font = 'bold 16px system-ui, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(state.points + ' PTS', 14, 22);

  ctx.textAlign = 'right';
  ctx.fillStyle = '#c084fc';
  ctx.fillText('COMBO x' + state.comboMultiplier + ' (' + state.combo + ')', W - 14, 22);

  // Sub-bars: Shield & Frenzy
  ctx.font = '10px system-ui, sans-serif';
  ctx.fillStyle = '#94a3b8';
  ctx.textAlign = 'left';
  ctx.fillText('SHIELDS: ' + '🛡'.repeat(state.shield), 14, 40);

  ctx.fillStyle = '#38bdf8';
  ctx.textAlign = 'right';
  ctx.fillText('FRENZY: ' + state.frenzyMeter + '% ⚡', W - 14, 40);

  // Draw 4 Matrix Target Pads
  for (let i = 0; i < 4; i++) {
    const pad = PADS[i];
    const target = state.slots[i];
    if (!target) continue;

    const col = TARGET_COLORS[target.type] || '#fff';
    const isSkull = target.type === 'skull';

    // Pad container
    ctx.fillStyle = isSkull ? 'rgba(220, 38, 38, 0.15)' : 'rgba(30, 10, 60, 0.7)';
    rrect(pad.x, pad.y, pad.w, pad.h, 12);
    ctx.fill();
    ctx.strokeStyle = col;
    ctx.lineWidth = isSkull ? 3 : 2;
    rrect(pad.x, pad.y, pad.w, pad.h, 12);
    ctx.stroke();

    // Central Icon / Gem Symbol
    const cx = pad.x + pad.w / 2;
    const cy = pad.y + pad.h / 2 - 8;
    const pulse = Math.sin(animTimer * 4 + i) * 3;

    ctx.fillStyle = col;
    ctx.beginPath();
    if (isSkull) {
      // Skull Shape
      ctx.arc(cx, cy, 26 + pulse, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#080210';
      ctx.beginPath();
      ctx.arc(cx - 8, cy - 2, 5, 0, Math.PI * 2);
      ctx.arc(cx + 8, cy - 2, 5, 0, Math.PI * 2);
      ctx.fill();
    } else {
      // Gem Diamond
      ctx.moveTo(cx, cy - (28 + pulse));
      ctx.lineTo(cx + (28 + pulse), cy);
      ctx.lineTo(cx, cy + (28 + pulse));
      ctx.lineTo(cx - (28 + pulse), cy);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      ctx.beginPath();
      ctx.arc(cx - 6, cy - 6, 8, 0, Math.PI * 2);
      ctx.fill();
    }

    // Label on Pad
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 11px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(TARGET_LABELS[target.type], cx, pad.y + pad.h - 14);

    // Number key helper pill in top left
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    rrect(pad.x + 8, pad.y + 8, 22, 22, 4);
    ctx.fill();
    ctx.fillStyle = '#94a3b8';
    ctx.font = 'bold 12px system-ui, sans-serif';
    ctx.fillText(i + 1, pad.x + 19, pad.y + 24);
  }

  // Draw Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const pt = particles[i];
    pt.x += pt.vx * dt;
    pt.y += pt.vy * dt;
    pt.life -= dt;
    if (pt.life <= 0) {
      particles.splice(i, 1);
      continue;
    }
    ctx.fillStyle = pt.color;
    ctx.globalAlpha = pt.life / pt.maxLife;
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, 4, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Floating text
  for (let i = floaters.length - 1; i >= 0; i--) {
    const f = floaters[i];
    f.y -= 40 * dt;
    f.t += dt;
    if (f.t > 0.8) {
      floaters.splice(i, 1);
      continue;
    }
    ctx.fillStyle = f.color;
    ctx.font = 'bold 18px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(f.text, f.x, f.y);
  }

  // Control Deck at Bottom
  ctx.fillStyle = '#0f041e';
  ctx.fillRect(0, 450, W, 190);
  ctx.fillStyle = '#7c3aed';
  ctx.fillRect(0, 448, W, 2);

  const legals = legalActions(state);
  for (const b of BTNS) {
    const isLegal = legals.includes(b.action);
    ctx.fillStyle = isLegal ? b.col : '#1e1030';
    rrect(b.x, b.y, b.w, b.h, 6);
    ctx.fill();
    ctx.strokeStyle = isLegal ? 'rgba(255,255,255,0.3)' : '#2d1848';
    ctx.lineWidth = 1.5;
    rrect(b.x, b.y, b.w, b.h, 6);
    ctx.stroke();

    ctx.fillStyle = isLegal ? '#ffffff' : '#6b7280';
    ctx.font = 'bold 12px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(b.label, b.x + b.w / 2, b.y + b.h / 2);
  }
  ctx.textBaseline = 'alphabetic';

  // Game over overlay
  if (isOver(state)) {
    ctx.fillStyle = 'rgba(13, 4, 28, 0.92)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = state.victory ? '#10b981' : '#ef4444';
    ctx.font = 'bold 30px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(state.victory ? 'PLATINUM BLAST!' : 'SHIELD COLLAPSE', W / 2, H / 2 - 40);
    ctx.fillStyle = '#f1f5f9';
    ctx.font = '18px system-ui, sans-serif';
    ctx.fillText('Score: ' + score(state) + '  (Best: ' + best + ')', W / 2, H / 2);
    ctx.fillText('Gems Cleared: ' + state.gemsCleared + '  Points: ' + state.points, W / 2, H / 2 + 28);
    ctx.fillStyle = '#38bdf8';
    ctx.font = 'bold 16px system-ui, sans-serif';
    ctx.fillText('Tap to blast again', W / 2, H / 2 + 70);
  }
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  draw(dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

const inApk = window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform();
if (!inApk && 'serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
