<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b1020">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>Pulse Lock</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b1020; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; margin: 0 auto; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="logic.js"></script>
<script>
const { MAX_LOCKS, createState, step, isOver, score } = GameLogic;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const W = 360;
const H = 640;
const BAR_X = 30;
const BAR_Y = 300;
const BAR_W = 300;
const BAR_H = 38;

let scale = 1;
function resize() {
  scale = Math.min(innerWidth / W, innerHeight / H);
  const dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.style.width = W * scale + 'px';
  canvas.style.height = H * scale + 'px';
  canvas.width = Math.round(W * scale * dpr);
  canvas.height = Math.round(H * scale * dpr);
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
}
addEventListener('resize', resize);
resize();

let best = 0;
try { best = +localStorage.getItem('goe-0021-best') || 0; } catch (e) {}

let state = createState(Date.now());
let accum = 0;
let overAt = 0;
let banner = null;

function restart() {
  state = createState(Date.now());
  accum = 0;
  overAt = 0;
  banner = null;
}

function rrect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function checkDone() {
  if (isOver(state) && !overAt) {
    overAt = performance.now();
    const sc = score(state);
    if (sc > best) {
      best = sc;
      try { localStorage.setItem('goe-0021-best', best); } catch (e) {}
    }
  }
}

function triggerTap() {
  if (isOver(state)) return;
  const res = step(state, 'tap');
  const map = {
    perfect: { text: `PERFECT! +${res.reward}`, color: '#ffd43b' },
    good: { text: `GOOD +${res.reward}`, color: '#4fd1c5' },
    miss: { text: 'MISS!', color: '#ff6b6b' },
  };
  banner = { ...(map[state.lastGrade] || { text: '', color: '#fff' }), t: 0 };
  checkDone();
}

canvas.addEventListener('pointerdown', () => {
  if (isOver(state)) {
    if (performance.now() - overAt > 400) restart();
    return;
  }
  triggerTap();
});

addEventListener('keydown', (e) => {
  if (isOver(state)) {
    if ((e.key === ' ' || e.key === 'Enter') && performance.now() - overAt > 400) restart();
    return;
  }
  if (e.key === ' ' || e.key === 'Enter') triggerTap();
});

function draw(dt) {
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#172242');
  bg.addColorStop(1, '#0b1020');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = '#8a93a8';
  ctx.font = '12px system-ui, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('SCORE', 28, 42);
  ctx.textAlign = 'center';
  ctx.fillText('LOCKS', W / 2, 42);
  ctx.textAlign = 'right';
  ctx.fillText('BEST', W - 28, 42);

  ctx.fillStyle = '#e8ecf5';
  ctx.font = 'bold 30px system-ui, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(score(state), 28, 78);
  ctx.fillStyle = '#4fd1c5';
  ctx.textAlign = 'center';
  ctx.fillText(`${state.locks}/${MAX_LOCKS}`, W / 2, 78);
  ctx.fillStyle = '#e8ecf5';
  ctx.font = 'bold 22px system-ui, sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText(best, W - 28, 76);

  // Lives & Streak
  for (let i = 0; i < 3; i++) {
    ctx.fillStyle = i < state.lives ? '#ff6b6b' : '#2a3554';
    ctx.beginPath();
    ctx.arc(W / 2 - 22 + i * 22, 118, 7, 0, Math.PI * 2);
    ctx.fill();
  }
  if (state.streak > 1) {
    ctx.fillStyle = '#ffd43b';
    ctx.font = 'bold 18px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(`Streak x${state.streak}`, W / 2, 162);
  }

  // Central dial ring visual
  ctx.strokeStyle = '#253663';
  ctx.lineWidth = 10;
  ctx.beginPath();
  ctx.arc(W / 2, 224, 38, 0, Math.PI * 2);
  ctx.stroke();
  ctx.strokeStyle = '#4fd1c5';
  ctx.beginPath();
  ctx.arc(W / 2, 224, 38, -Math.PI / 2, -Math.PI / 2 + (Math.PI * 2 * state.locks) / MAX_LOCKS);
  ctx.stroke();

  // Gauge bar
  ctx.fillStyle = '#121b34';
  rrect(BAR_X, BAR_Y, BAR_W, BAR_H, 12);
  ctx.fill();
  ctx.strokeStyle = '#2d3f70';
  ctx.lineWidth = 2;
  rrect(BAR_X, BAR_Y, BAR_W, BAR_H, 12);
  ctx.stroke();

  const gx1 = BAR_X + ((state.target - state.goodRadius) / 100) * BAR_W;
  const gw = ((state.goodRadius * 2) / 100) * BAR_W;
  ctx.fillStyle = 'rgba(79, 209, 197, 0.35)';
  rrect(gx1, BAR_Y + 4, gw, BAR_H - 8, 6);
  ctx.fill();

  const px1 = BAR_X + ((state.target - state.perfectRadius) / 100) * BAR_W;
  const pw = ((state.perfectRadius * 2) / 100) * BAR_W;
  ctx.fillStyle = '#ffd43b';
  rrect(px1, BAR_Y + 4, pw, BAR_H - 8, 4);
  ctx.fill();

  // Needle
  const nx = BAR_X + (state.pos / 100) * BAR_W;
  ctx.fillStyle = '#ffffff';
  rrect(nx - 4, BAR_Y - 8, 8, BAR_H + 16, 4);
  ctx.fill();

  if (banner) {
    banner.t += dt;
    ctx.globalAlpha = Math.max(0, 1 - banner.t / 0.8);
    ctx.fillStyle = banner.color;
    ctx.font = 'bold 26px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(banner.text, W / 2, 396 - banner.t * 24);
    ctx.globalAlpha = 1;
    if (banner.t >= 0.8) banner = null;
  }

  // Big tap pad
  ctx.fillStyle = '#1d2b4f';
  rrect(60, 470, 240, 68, 18);
  ctx.fill();
  ctx.strokeStyle = '#3c5596';
  ctx.lineWidth = 2;
  rrect(60, 470, 240, 68, 18);
  ctx.stroke();
  ctx.fillStyle = '#e8ecf5';
  ctx.font = 'bold 20px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('TAP TO LOCK', W / 2, 511);

  if (isOver(state)) {
    const won = state.locks >= MAX_LOCKS;
    ctx.fillStyle = 'rgba(11,16,32,0.84)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = won ? '#69db7c' : '#e8ecf5';
    ctx.font = 'bold 34px system-ui, sans-serif';
    ctx.fillText(won ? 'Vault Unlocked!' : 'Lock Jammed', W / 2, H / 2 - 32);
    ctx.fillStyle = '#e8ecf5';
    ctx.font = '22px system-ui, sans-serif';
    ctx.fillText('Score: ' + score(state), W / 2, H / 2 + 8);
    ctx.fillStyle = '#4fd1c5';
    ctx.font = '18px system-ui, sans-serif';
    ctx.fillText('Tap to play again', W / 2, H / 2 + 50);
  }
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (!isOver(state)) {
    accum += dt;
    const stepDt = 1 / 60;
    while (accum >= stepDt && !isOver(state)) {
      accum -= stepDt;
      step(state, 'wait');
      checkDone();
    }
  }
  draw(dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

const inApk = window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform();
if (!inApk && 'serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
