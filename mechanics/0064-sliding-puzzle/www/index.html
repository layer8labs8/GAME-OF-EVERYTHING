<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b1020">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>Tile Shift</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b1020; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; margin: 0 auto; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="logic.js"></script>
<script>
const { MAX_STEPS, createState, legalActions, step, isOver, score } = GameLogic;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const LEVELS = [
  { id: "001", name: "First Slide", diff: 1, tiles: [1, 2, 0, 4, 5, 3, 7, 8, 6], par: 2 },
  { id: "002", name: "Corner Exchange", diff: 1, tiles: [1, 0, 2, 4, 5, 3, 7, 8, 6], par: 3 },
  { id: "003", name: "Triangle Turn", diff: 1, tiles: [1, 5, 2, 4, 0, 3, 7, 8, 6], par: 4 },
  { id: "004", name: "Crossroad", diff: 2, tiles: [1, 5, 2, 4, 8, 3, 0, 7, 6], par: 6 },
  { id: "005", name: "Center Swap", diff: 2, tiles: [1, 5, 2, 0, 8, 3, 4, 7, 6], par: 7 },
  { id: "006", name: "Side Loop", diff: 2, tiles: [0, 5, 2, 1, 8, 3, 4, 7, 6], par: 8 },
  { id: "007", name: "Clockwise Twist", diff: 3, tiles: [5, 8, 2, 1, 0, 3, 4, 7, 6], par: 10 },
  { id: "008", name: "Orbit Shift", diff: 3, tiles: [5, 8, 2, 1, 7, 3, 0, 4, 6], par: 12 },
  { id: "009", name: "Double Helix", diff: 4, tiles: [0, 8, 2, 5, 7, 3, 1, 4, 6], par: 14 },
  { id: "010", name: "Mirror Maze", diff: 4, tiles: [8, 7, 2, 5, 0, 3, 1, 4, 6], par: 16 },
  { id: "011", name: "Serpent Gate", diff: 5, tiles: [8, 7, 2, 5, 4, 3, 0, 1, 6], par: 18 },
  { id: "012", name: "The Grand Shuffle", diff: 5, tiles: [8, 7, 0, 5, 4, 2, 1, 6, 3], par: 20 }
];

const W = 360;
const H = 640;
const BX = 30;
const BY = 162;
const GAP = 12;
const CELL = 92;

let scale = 1;
function resize() {
  scale = Math.min(innerWidth / W, innerHeight / H);
  const dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.style.width = W * scale + 'px';
  canvas.style.height = H * scale + 'px';
  canvas.width = Math.round(W * scale * dpr);
  canvas.height = Math.round(H * scale * dpr);
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
}
addEventListener('resize', resize);
resize();

let levelIdx = 0;
let isRandomMode = false;
let state = createState(null, LEVELS[0].tiles);
let overAt = 0;

function loadLevel(idx) {
  levelIdx = Math.max(0, Math.min(LEVELS.length - 1, idx));
  isRandomMode = false;
  state = createState(null, LEVELS[levelIdx].tiles);
  overAt = 0;
}

function restart() {
  if (isRandomMode) {
    state = createState(Date.now());
  } else {
    state = createState(null, LEVELS[levelIdx].tiles);
  }
  overAt = 0;
}

function rrect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function tryTile(idx) {
  if (isOver(state)) return;
  if (!legalActions(state).includes(idx)) return;
  const res = step(state, idx);
  if (res.done) {
    overAt = performance.now();
  }
}

function toLogical(e) {
  const rect = canvas.getBoundingClientRect();
  return { x: (e.clientX - rect.left) / scale, y: (e.clientY - rect.top) / scale };
}

canvas.addEventListener('pointerdown', (e) => {
  const p = toLogical(e);
  if (isOver(state)) {
    if (performance.now() - overAt > 300) {
      if (state.solved && !isRandomMode && levelIdx < LEVELS.length - 1) {
        loadLevel(levelIdx + 1);
      } else {
        restart();
      }
    }
    return;
  }

  // Level selector buttons
  if (p.y >= 92 && p.y <= 126) {
    if (p.x >= 24 && p.x <= 74 && levelIdx > 0 && !isRandomMode) {
      loadLevel(levelIdx - 1);
      return;
    }
    if (p.x >= W - 74 && p.x <= W - 24 && levelIdx < LEVELS.length - 1 && !isRandomMode) {
      loadLevel(levelIdx + 1);
      return;
    }
  }

  // Bottom action buttons
  if (p.y >= 518 && p.y <= 564) {
    if (p.x >= 30 && p.x <= 165) {
      restart();
      return;
    }
    if (p.x >= 195 && p.x <= 330) {
      isRandomMode = true;
      state = createState(Date.now());
      overAt = 0;
      return;
    }
  }

  // Tile grid clicks
  for (let i = 0; i < 9; i++) {
    const r = Math.floor(i / 3);
    const c = i % 3;
    const x = BX + c * (CELL + GAP);
    const y = BY + r * (CELL + GAP);
    if (p.x >= x && p.x <= x + CELL && p.y >= y && p.y <= y + CELL) {
      tryTile(i);
      return;
    }
  }
});

addEventListener('keydown', (e) => {
  if (isOver(state)) {
    if ((e.key === ' ' || e.key === 'Enter') && performance.now() - overAt > 300) {
      if (state.solved && !isRandomMode && levelIdx < LEVELS.length - 1) loadLevel(levelIdx + 1);
      else restart();
    }
    return;
  }
  const gap = state.tiles.indexOf(0);
  const gr = Math.floor(gap / 3);
  const gc = gap % 3;
  if ((e.key === 'ArrowUp' || e.key === 'w') && gr < 2) tryTile((gr + 1) * 3 + gc);
  else if ((e.key === 'ArrowDown' || e.key === 's') && gr > 0) tryTile((gr - 1) * 3 + gc);
  else if ((e.key === 'ArrowLeft' || e.key === 'a') && gc < 2) tryTile(gr * 3 + gc + 1);
  else if ((e.key === 'ArrowRight' || e.key === 'd') && gc > 0) tryTile(gr * 3 + gc - 1);
  else if (e.key === 'r') restart();
});

function draw() {
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#172240');
  bg.addColorStop(1, '#0b1020');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // Top header
  ctx.fillStyle = '#8a93a8';
  ctx.font = '12px system-ui, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('PAR', 30, 36);
  ctx.textAlign = 'center';
  ctx.fillText('MOVES', W / 2, 36);
  ctx.textAlign = 'right';
  ctx.fillText('SCORE', W - 30, 36);

  ctx.fillStyle = '#4fd1c5';
  ctx.font = 'bold 26px system-ui, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(isRandomMode ? '—' : LEVELS[levelIdx].par, 30, 68);

  ctx.fillStyle = '#e8ecf5';
  ctx.textAlign = 'center';
  ctx.fillText(`${state.stepCount}/${MAX_STEPS}`, W / 2, 68);

  ctx.textAlign = 'right';
  ctx.fillText(score(state), W - 30, 68);

  // Level banner with prev/next controls
  ctx.fillStyle = '#121b33';
  rrect(24, 88, W - 48, 44, 10);
  ctx.fill();

  ctx.fillStyle = '#e8ecf5';
  ctx.font = 'bold 15px system-ui, sans-serif';
  ctx.textAlign = 'center';
  const label = isRandomMode ? 'Random Shuffle' : `Level ${levelIdx + 1}/${LEVELS.length}: ${LEVELS[levelIdx].name}`;
  ctx.fillText(label, W / 2, 115);

  if (!isRandomMode) {
    ctx.fillStyle = levelIdx > 0 ? '#4fd1c5' : '#4a5568';
    ctx.font = 'bold 16px system-ui, sans-serif';
    ctx.fillText('◀', 44, 115);

    ctx.fillStyle = levelIdx < LEVELS.length - 1 ? '#4fd1c5' : '#4a5568';
    ctx.fillText('▶', W - 44, 115);
  }

  // Board background
  ctx.fillStyle = '#121b33';
  rrect(BX - 12, BY - 12, 3 * CELL + 2 * GAP + 24, 3 * CELL + 2 * GAP + 24, 18);
  ctx.fill();

  // Tiles
  for (let i = 0; i < 9; i++) {
    const r = Math.floor(i / 3);
    const c = i % 3;
    const x = BX + c * (CELL + GAP);
    const y = BY + r * (CELL + GAP);
    const v = state.tiles[i];
    if (v === 0) {
      ctx.fillStyle = '#0c1326';
      rrect(x, y, CELL, CELL, 14);
      ctx.fill();
      continue;
    }
    const rightSpot = v === i + 1;
    ctx.fillStyle = rightSpot ? '#22544f' : '#263866';
    rrect(x, y, CELL, CELL, 14);
    ctx.fill();
    ctx.strokeStyle = rightSpot ? '#4fd1c5' : '#3c5596';
    ctx.lineWidth = 2;
    rrect(x, y, CELL, CELL, 14);
    ctx.stroke();

    ctx.fillStyle = '#e8ecf5';
    ctx.font = 'bold 34px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(v, x + CELL / 2, y + CELL / 2 + 2);
  }
  ctx.textBaseline = 'alphabetic';

  // Bottom buttons: Reset & Random
  ctx.fillStyle = '#1d2b4f';
  rrect(30, 518, 135, 46, 12);
  ctx.fill();
  ctx.fillStyle = '#e8ecf5';
  ctx.font = 'bold 15px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('Reset Level', 97, 546);

  ctx.fillStyle = isRandomMode ? '#22544f' : '#1d2b4f';
  rrect(195, 518, 135, 46, 12);
  ctx.fill();
  ctx.fillStyle = isRandomMode ? '#4fd1c5' : '#e8ecf5';
  ctx.fillText('Random Mode', 262, 546);

  if (isOver(state)) {
    ctx.fillStyle = 'rgba(11,16,32,0.88)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = state.solved ? '#69db7c' : '#ff6b6b';
    ctx.font = 'bold 32px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(state.solved ? 'Puzzle Solved!' : 'Out of Moves', W / 2, H / 2 - 32);

    ctx.fillStyle = '#e8ecf5';
    ctx.font = '20px system-ui, sans-serif';
    const parText = !isRandomMode ? `  ·  Par: ${LEVELS[levelIdx].par}` : '';
    ctx.fillText(`Moves: ${state.stepCount}${parText}`, W / 2, H / 2 + 8);

    ctx.fillStyle = '#4fd1c5';
    ctx.font = '17px system-ui, sans-serif';
    const nextMsg = !isRandomMode && levelIdx < LEVELS.length - 1 ? 'Tap to play Next Level' : 'Tap to play again';
    ctx.fillText(nextMsg, W / 2, H / 2 + 50);
  }
}

function frame() {
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

const inApk = window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform();
if (!inApk && 'serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
