<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#090d16">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>Chrono Leap</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #090d16;
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  canvas {
    display: block;
    margin: 0 auto;
    touch-action: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="logic.js"></script>
<script>
const {
  GRID_W,
  GRID_H,
  MAX_STEPS,
  createState,
  legalActions,
  step,
  isOver,
  score
} = GameLogic;

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const W = 360;
const H = 640;

let scale = 1;
function resize() {
  scale = Math.min(innerWidth / W, innerHeight / H);
  const dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.style.width = W * scale + 'px';
  canvas.style.height = H * scale + 'px';
  canvas.width = Math.round(W * scale * dpr);
  canvas.height = Math.round(H * scale * dpr);
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
}
addEventListener('resize', resize);
resize();

let state = createState(Date.now());
let overAt = 0;

function restart() {
  state = createState(Date.now());
  overAt = 0;
}

const TILE = 20;
const ARENA_X = (W - GRID_W * TILE) / 2; // (360 - 320) / 2 = 20
const ARENA_Y = 80;

function toLogical(e) {
  const rect = canvas.getBoundingClientRect();
  return { x: (e.clientX - rect.left) / scale, y: (e.clientY - rect.top) / scale };
}

function doAction(actionName) {
  if (isOver(state)) return;
  if (!legalActions(state).includes(actionName)) return;
  const res = step(state, actionName);
  if (res.done) overAt = performance.now();
}

// Touch Handling
canvas.addEventListener('pointerdown', (e) => {
  const p = toLogical(e);
  if (isOver(state)) {
    if (performance.now() - overAt > 400) restart();
    return;
  }

  // Left Button
  if (p.x >= 20 && p.x <= 80 && p.y >= 500 && p.y <= 560) {
    doAction('left');
    return;
  }
  // Right Button
  if (p.x >= 95 && p.x <= 155 && p.y >= 500 && p.y <= 560) {
    doAction('right');
    return;
  }
  // Jump Button (Green)
  if (p.x >= 180 && p.x <= 250 && p.y >= 500 && p.y <= 560) {
    doAction('jump');
    return;
  }
  // Dash Right Button (Pink)
  if (p.x >= 270 && p.x <= 340 && p.y >= 500 && p.y <= 560) {
    doAction('dash_right');
    return;
  }
  // Dash Up Button (Small, above jump)
  if (p.x >= 200 && p.x <= 270 && p.y >= 435 && p.y <= 485) {
    doAction('dash_up');
    return;
  }
  // Dash Diagonal Button
  if (p.x >= 280 && p.x <= 345 && p.y >= 435 && p.y <= 485) {
    doAction('dash_up_right');
    return;
  }
  // Wait / Coast
  if (p.x >= 40 && p.x <= 135 && p.y >= 435 && p.y <= 485) {
    doAction('wait');
    return;
  }
});

addEventListener('keydown', (e) => {
  if (isOver(state)) {
    if ((e.key === ' ' || e.key === 'Enter') && performance.now() - overAt > 400) restart();
    return;
  }

  if (e.key === 'ArrowLeft' || e.key === 'a') doAction('left');
  else if (e.key === 'ArrowRight' || e.key === 'd') doAction('right');
  else if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') doAction('jump');
  else if (e.key === 'j' || e.key === 'Shift') doAction('dash_right');
  else if (e.key === 'k') doAction('dash_up');
  else if (e.key === 'l') doAction('dash_up_right');
  else if (e.key === 's' || e.key === 'e') doAction('wait');
  else if (e.key === 'r') restart();
});

function drawRoundedRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function draw() {
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#0f172a');
  bg.addColorStop(1, '#090d16');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // Top Header HUD
  ctx.fillStyle = '#64748b';
  ctx.font = '11px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('LIVES', 20, 28);
  ctx.textAlign = 'center';
  ctx.fillText('CRYSTALS', W / 2, 28);
  ctx.textAlign = 'right';
  ctx.fillText('SCORE', W - 20, 28);

  // Lives
  ctx.fillStyle = '#ef4444';
  ctx.font = 'bold 15px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('♥ '.repeat(state.player.lives) || 'DEAD', 20, 50);

  // Crystals gathered
  const collectedCount = state.crystals.filter((c) => c.collected).length;
  ctx.fillStyle = collectedCount === state.crystals.length ? '#10b981' : '#38bdf8';
  ctx.textAlign = 'center';
  ctx.fillText(`◆ ${collectedCount}/${state.crystals.length}`, W / 2, 50);

  // Score
  ctx.fillStyle = '#f8fafc';
  ctx.textAlign = 'right';
  ctx.fillText(score(state), W - 20, 50);

  // Arena Background Frame
  ctx.fillStyle = '#060911';
  ctx.fillRect(ARENA_X - 2, ARENA_Y - 2, GRID_W * TILE + 4, GRID_H * TILE + 4);

  // Draw Grid Tiles
  for (let r = 0; r < GRID_H; r++) {
    for (let c = 0; c < GRID_W; c++) {
      const x = ARENA_X + c * TILE;
      const y = ARENA_Y + r * TILE;
      const ch = state.grid[r][c];

      if (ch === '#') {
        ctx.fillStyle = '#334155';
        ctx.fillRect(x, y, TILE, TILE);
        ctx.strokeStyle = '#475569';
        ctx.strokeRect(x + 0.5, y + 0.5, TILE - 1, TILE - 1);
      } else if (ch === '^') {
        // Red hazards spikes
        ctx.fillStyle = '#ef4444';
        ctx.beginPath();
        ctx.moveTo(x, y + TILE);
        ctx.lineTo(x + TILE / 2, y + 3);
        ctx.lineTo(x + TILE, y + TILE);
        ctx.closePath();
        ctx.fill();
      }
    }
  }

  // Draw Portal
  const allC = state.crystals.every((c) => c.collected);
  const px = ARENA_X + (state.portal.x - 0.5) * TILE;
  const py = ARENA_Y + (state.portal.y - 0.5) * TILE;
  ctx.fillStyle = allC ? '#10b981' : '#334155';
  ctx.beginPath();
  ctx.arc(px, py, TILE * 0.55, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = allC ? '#6ee7b7' : '#475569';
  ctx.lineWidth = 2;
  ctx.stroke();

  // Draw Crystals
  for (const c of state.crystals) {
    if (!c.collected) {
      const cx = ARENA_X + (c.x - 0.5) * TILE;
      const cy = ARENA_Y + (c.y - 0.5) * TILE;
      ctx.fillStyle = '#38bdf8';
      ctx.beginPath();
      ctx.moveTo(cx, cy - 7);
      ctx.lineTo(cx + 6, cy);
      ctx.lineTo(cx, cy + 7);
      ctx.lineTo(cx - 6, cy);
      ctx.closePath();
      ctx.fill();
    }
  }

  // Draw Player
  const plx = ARENA_X + state.player.x * TILE;
  const ply = ARENA_Y + state.player.y * TILE;
  ctx.fillStyle = state.player.dashes > 0 ? '#ec4899' : '#94a3b8';
  drawRoundedRect(plx - 5, ply - 14, 10, 14, 3);
  ctx.fill();

  // Eye
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(plx, ply - 11, 3, 3);

  // Touch Control Buttons
  function drawBtn(bx, by, bw, bh, txt, bgCol, borderCol) {
    ctx.fillStyle = bgCol;
    drawRoundedRect(bx, by, bw, bh, 8);
    ctx.fill();
    ctx.strokeStyle = borderCol;
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(txt, bx + bw / 2, by + bh / 2 + 5);
  }

  drawBtn(20, 500, 60, 55, '◀', '#1e293b', '#475569');
  drawBtn(95, 500, 60, 55, '▶', '#1e293b', '#475569');
  drawBtn(180, 500, 70, 55, 'JUMP', '#059669', '#10b981');
  drawBtn(270, 500, 70, 55, 'DASH ▶', state.player.dashes > 0 ? '#db2777' : '#475569', '#f472b6');

  drawBtn(40, 435, 95, 45, 'WAIT', '#1e293b', '#334155');
  drawBtn(190, 435, 65, 45, 'DASH ▲', state.player.dashes > 0 ? '#db2777' : '#475569', '#f472b6');
  drawBtn(275, 435, 65, 45, 'DASH ↗', state.player.dashes > 0 ? '#db2777' : '#475569', '#f472b6');

  ctx.fillStyle = '#64748b';
  ctx.font = '11px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('A/D move · Space jump · Shift/J dash', W / 2, 605);

  // Overlay
  if (isOver(state)) {
    ctx.fillStyle = 'rgba(9, 13, 22, 0.92)';
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    if (state.won) {
      ctx.fillStyle = '#10b981';
      ctx.font = 'bold 30px sans-serif';
      ctx.fillText('CHAMBER CLEARED', W / 2, H / 2 - 35);
      ctx.fillStyle = '#cbd5e1';
      ctx.font = '16px sans-serif';
      ctx.fillText('Portal activated successfully!', W / 2, H / 2 - 5);
    } else {
      ctx.fillStyle = '#ef4444';
      ctx.font = 'bold 30px sans-serif';
      ctx.fillText('CHRONO DESYNC', W / 2, H / 2 - 35);
      ctx.fillStyle = '#cbd5e1';
      ctx.font = '16px sans-serif';
      ctx.fillText('All lives exhausted on hazards!', W / 2, H / 2 - 5);
    }

    ctx.fillStyle = '#38bdf8';
    ctx.font = 'bold 22px sans-serif';
    ctx.fillText(`Final Score: ${score(state)}`, W / 2, H / 2 + 32);

    ctx.fillStyle = '#94a3b8';
    ctx.font = '14px sans-serif';
    ctx.fillText('Tap anywhere to retry', W / 2, H / 2 + 75);
  }
}

function frame() {
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

const inApk = window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform();
if (!inApk && 'serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
