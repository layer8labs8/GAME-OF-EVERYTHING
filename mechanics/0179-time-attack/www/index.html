<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0a0518">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Speed Chrono</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0518; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; margin: 0 auto; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="logic.js"></script>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const W = 360;
const H = 640;
let scale = 1;

function resize() {
  scale = Math.min(innerWidth / W, innerHeight / H);
  const dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.style.width = W * scale + 'px';
  canvas.style.height = H * scale + 'px';
  canvas.width = Math.round(W * scale * dpr);
  canvas.height = Math.round(H * scale * dpr);
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
}
addEventListener('resize', resize);
resize();

function rrect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

let best = 0;
try { best = +localStorage.getItem('goe-0179-best') || 0; } catch (e) {}

let state = createState(Date.now());
let playerX = 180;
let roadOffset = 0;
let floaters = [];
let overAt = 0;
let swipeStartX = null;

function restart() {
  state = createState(Date.now());
  playerX = 180;
  floaters = [];
  overAt = 0;
}

function performAction(act) {
  if (isOver(state)) return;
  const legals = legalActions(state);
  if (!legals.includes(act)) return;

  const oldApex = state.perfectApexCount;
  const res = step(state, act);

  if (state.perfectApexCount > oldApex) {
    floaters.push({ text: 'PERFECT APEX! +2500', x: 180, y: 340, t: 0, color: '#facc15' });
  } else if (act.includes('throttle')) {
    floaters.push({ text: state.speed + ' KM/H', x: 180, y: 340, t: 0, color: '#10b981' });
  } else if (act.includes('brake')) {
    floaters.push({ text: 'TRAIL BRAKE', x: 180, y: 340, t: 0, color: '#ef4444' });
  } else if (act.includes('boost')) {
    floaters.push({ text: 'BOOST SURGE!', x: 180, y: 340, t: 0, color: '#06b6d4' });
  }

  if (isOver(state)) {
    overAt = performance.now();
    const sc = score(state);
    if (sc > best) {
      best = sc;
      try { localStorage.setItem('goe-0179-best', best); } catch (e) {}
    }
  }
}

// Action button hitboxes on canvas
const BTNS = [
  { id: 'steer_l', label: '◀ CURB IN', action: 'action:steer_inside_curb', x: 20, y: 470, w: 75, h: 48, col: '#0284c7' },
  { id: 'gas', label: 'THROTTLE ▲', action: 'action:throttle_accelerate', x: 105, y: 470, w: 150, h: 48, col: '#10b981' },
  { id: 'steer_r', label: 'LINE OUT ▶', action: 'action:steer_outside_line', x: 265, y: 470, w: 75, h: 48, col: '#0284c7' },
  { id: 'brake', label: 'APEX BRAKE ▼', action: 'action:apex_brake', x: 20, y: 528, w: 100, h: 44, col: '#ef4444' },
  { id: 'boost', label: '⚡ ERS BOOST', action: 'action:boost_overdrive', x: 130, y: 528, w: 100, h: 44, col: '#06b6d4' },
  { id: 'coast', label: 'COAST / FLOW', action: 'action:maintain_coasting', x: 240, y: 528, w: 100, h: 44, col: '#8b5cf6' },
];

function toLogical(e) {
  const rect = canvas.getBoundingClientRect();
  return { x: (e.clientX - rect.left) / scale, y: (e.clientY - rect.top) / scale };
}

canvas.addEventListener('pointerdown', (e) => {
  const p = toLogical(e);
  if (isOver(state)) {
    if (performance.now() - overAt > 400) restart();
    return;
  }
  for (const b of BTNS) {
    if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) {
      performAction(b.action);
      return;
    }
  }
  if (p.y < 460) {
    swipeStartX = p.x;
    if (p.x < 110) performAction('action:steer_inside_curb');
    else if (p.x > 250) performAction('action:steer_outside_line');
    else performAction('action:throttle_accelerate');
  }
});

canvas.addEventListener('pointermove', (e) => {
  if (swipeStartX === null || isOver(state)) return;
  const p = toLogical(e);
  const dx = p.x - swipeStartX;
  if (Math.abs(dx) > 25) {
    if (dx > 0) performAction('action:steer_outside_line');
    else performAction('action:steer_inside_curb');
    swipeStartX = p.x;
  }
});

canvas.addEventListener('pointerup', () => { swipeStartX = null; });
canvas.addEventListener('pointercancel', () => { swipeStartX = null; });

addEventListener('keydown', (e) => {
  if (isOver(state)) {
    if ((e.key === ' ' || e.key === 'Enter') && performance.now() - overAt > 400) restart();
    return;
  }
  const k = e.key.toLowerCase();
  if (k === 'arrowleft' || k === 'a') performAction('action:steer_inside_curb');
  else if (k === 'arrowright' || k === 'd') performAction('action:steer_outside_line');
  else if (k === 'arrowup' || k === 'w') performAction('action:throttle_accelerate');
  else if (k === 'arrowdown' || k === 's') performAction('action:apex_brake');
  else if (k === ' ' || k === 'b') performAction('action:boost_overdrive');
  else if (k === 'c') performAction('action:maintain_coasting');
});

function draw(dt) {
  // Road speed calculation
  const pxSpeed = state.speed * 4.5;
  roadOffset = (roadOffset + pxSpeed * dt) % 60;

  // Background Circuit
  ctx.fillStyle = '#080314';
  ctx.fillRect(0, 0, W, H);

  // Track Surface
  ctx.fillStyle = '#181028';
  ctx.fillRect(35, 0, 290, 460);

  // Red & White Apex Curbs
  for (let y = -60 + roadOffset; y < 460; y += 40) {
    ctx.fillStyle = Math.floor(y / 40) % 2 === 0 ? '#ef4444' : '#ffffff';
    ctx.fillRect(30, y, 6, 20);
    ctx.fillRect(324, y, 6, 20);
  }

  // Smooth car position based on racing line (-100 to +100)
  const targetCarX = 180 + (state.line / 100) * 110;
  playerX += (targetCarX - playerX) * Math.min(1, dt * 12);

  // Draw F1 Hypercar
  const py = 370;

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  rrect(playerX - 18, py + 16, 36, 24, 4);
  ctx.fill();

  // Wheels (Wide slick tires)
  ctx.fillStyle = '#0f051d';
  ctx.fillRect(playerX - 24, py - 24, 7, 16);
  ctx.fillRect(playerX + 17, py - 24, 7, 16);
  ctx.fillRect(playerX - 25, py + 12, 8, 18);
  ctx.fillRect(playerX + 17, py + 12, 8, 18);

  // Aero Wings & Body
  ctx.fillStyle = '#06b6d4';
  // Front wing
  ctx.fillRect(playerX - 22, py - 28, 44, 5);
  // Main chassis
  ctx.fillStyle = '#3b82f6';
  rrect(playerX - 11, py - 24, 22, 54, 4);
  ctx.fill();
  // Cockpit / Halo
  ctx.fillStyle = '#0f172a';
  rrect(playerX - 7, py - 6, 14, 14, 2);
  ctx.fill();
  // Rear wing
  ctx.fillStyle = '#06b6d4';
  ctx.fillRect(playerX - 20, py + 26, 40, 6);

  // Top Dashboard Header
  ctx.fillStyle = 'rgba(10, 5, 24, 0.9)';
  ctx.fillRect(0, 0, W, 50);

  const sec = (state.timeElapsed / 10).toFixed(1);
  ctx.fillStyle = state.timeElapsed < 650 ? '#10b981' : '#f59e0b';
  ctx.font = 'bold 16px system-ui, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('LAP: ' + sec + 's / 65.0s', 12, 22);

  ctx.textAlign = 'right';
  ctx.fillStyle = '#38bdf8';
  ctx.fillText(state.speed + ' KM/H', W - 12, 22);

  // F1 Rev LEDs & Split info
  ctx.font = '10px system-ui, sans-serif';
  ctx.fillStyle = '#94a3b8';
  ctx.textAlign = 'left';
  ctx.fillText('DIST: ' + state.distance + '/1500M', 12, 40);

  ctx.fillStyle = '#facc15';
  ctx.textAlign = 'center';
  ctx.fillText('APEXES: ' + state.perfectApexCount + ' ⭐', W / 2, 40);

  ctx.fillStyle = '#06b6d4';
  ctx.textAlign = 'right';
  ctx.fillText('BOOST ' + state.boost + '% ⚡', W - 12, 40);

  // Floating text
  for (let i = floaters.length - 1; i >= 0; i--) {
    const f = floaters[i];
    f.y -= 35 * dt;
    f.t += dt;
    if (f.t > 0.8) {
      floaters.splice(i, 1);
      continue;
    }
    ctx.fillStyle = f.color;
    ctx.font = 'bold 16px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(f.text, f.x, f.y);
  }

  // Draw Control Deck
  ctx.fillStyle = '#0a0318';
  ctx.fillRect(0, 460, W, 180);
  ctx.fillStyle = '#06b6d4';
  ctx.fillRect(0, 458, W, 2);

  const legals = legalActions(state);
  for (const b of BTNS) {
    const isLegal = legals.includes(b.action);
    ctx.fillStyle = isLegal ? b.col : '#170c2a';
    rrect(b.x, b.y, b.w, b.h, 6);
    ctx.fill();
    ctx.strokeStyle = isLegal ? 'rgba(255,255,255,0.3)' : '#2a164c';
    ctx.lineWidth = 1.5;
    rrect(b.x, b.y, b.w, b.h, 6);
    ctx.stroke();

    ctx.fillStyle = isLegal ? '#ffffff' : '#64748b';
    ctx.font = 'bold 11px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(b.label, b.x + b.w / 2, b.y + b.h / 2);
  }
  ctx.textBaseline = 'alphabetic';

  // Game over overlay
  if (isOver(state)) {
    ctx.fillStyle = 'rgba(10, 5, 24, 0.9)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = state.victory ? '#10b981' : '#ef4444';
    ctx.font = 'bold 30px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(state.victory ? 'GOLD LAP RECORD!' : 'TIME COLLAPSE', W / 2, H / 2 - 40);
    ctx.fillStyle = '#f1f5f9';
    ctx.font = '18px system-ui, sans-serif';
    ctx.fillText('Lap Time: ' + (state.timeElapsed / 10).toFixed(1) + 's  Score: ' + score(state), W / 2, H / 2);
    ctx.fillText('Perfect Apexes: ' + state.perfectApexCount + '  Best: ' + best, W / 2, H / 2 + 28);
    ctx.fillStyle = '#38bdf8';
    ctx.font = 'bold 16px system-ui, sans-serif';
    ctx.fillText('Tap to race again', W / 2, H / 2 + 70);
  }
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  draw(dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

const inApk = window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform();
if (!inApk && 'serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
