<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Office Mayhem: Job Simulator</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#3b82f6">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #0b0f19;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 8px;
      overflow-x: hidden;
    }
    header {
      width: 100%;
      max-width: 520px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      padding: 6px 14px;
      background: #1e293b;
      border-radius: 8px;
      border: 1px solid #334155;
    }
    h1 {
      font-size: 0.95rem;
      color: #60a5fa;
      display: flex;
      align-items: center;
      gap: 6px;
      letter-spacing: 0.5px;
    }
    .hud {
      width: 100%;
      max-width: 520px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 6px;
      background: #111827;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #1f2937;
      font-size: 0.72rem;
    }
    .hud-box {
      background: #1e293b;
      border-radius: 6px;
      padding: 6px;
      text-align: center;
      border: 1px solid #334155;
    }
    .hud-val {
      font-size: 0.95rem;
      font-weight: bold;
      margin-top: 2px;
    }
    .text-green { color: #10b981; }
    .text-amber { color: #f59e0b; }
    .text-rose { color: #f43f5e; }
    .text-blue { color: #38bdf8; }
    .text-purple { color: #c084fc; }

    #canvas-container {
      width: 100%;
      max-width: 520px;
      position: relative;
      background: #020617;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #1e293b;
      aspect-ratio: 16 / 10;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .status-banner {
      width: 100%;
      max-width: 520px;
      margin-top: 6px;
      padding: 6px 12px;
      background: #1e293b;
      border-left: 4px solid #3b82f6;
      border-radius: 4px;
      font-size: 0.75rem;
      min-height: 32px;
      display: flex;
      align-items: center;
    }

    .tasks-container {
      width: 100%;
      max-width: 520px;
      margin-top: 6px;
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 8px;
      padding: 6px 10px;
    }
    .section-title {
      font-size: 0.72rem;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
    }
    .task-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .task-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 6px 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.72rem;
    }
    .task-desc {
      font-weight: bold;
      color: #e2e8f0;
    }
    .task-meta {
      font-size: 0.65rem;
      color: #94a3b8;
      margin-top: 2px;
    }

    .controls-grid {
      width: 100%;
      max-width: 520px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      margin-top: 6px;
    }
    button {
      background: #1e293b;
      border: 1px solid #3b82f6;
      color: #f8fafc;
      padding: 8px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: 600;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      transition: all 0.1s ease;
      touch-action: manipulation;
    }
    button:hover:not(:disabled) {
      background: #2563eb;
      border-color: #60a5fa;
    }
    button:active:not(:disabled) {
      transform: scale(0.97);
    }
    button:disabled {
      opacity: 0.4;
      border-color: #475569;
      cursor: not-allowed;
    }
    button.btn-primary {
      background: #0284c7;
      border-color: #38bdf8;
    }
    button.btn-success {
      background: #059669;
      border-color: #10b981;
    }
    button.btn-warn {
      background: #d97706;
      border-color: #f59e0b;
    }
    button.btn-purple {
      background: #7c3aed;
      border-color: #a855f7;
      grid-column: span 2;
    }
    .btn-sub {
      font-size: 0.62rem;
      font-weight: normal;
      color: #cbd5e1;
    }
  </style>
</head>
<body>

  <header>
    <h1>🏢 Office Mayhem</h1>
    <div style="font-size: 0.72rem; color: #94a3b8;">
      Shift: <span id="hdr-turn" class="text-blue">0</span>/120 | Rank: <span id="hdr-rank" class="text-purple">Clerk</span>
    </div>
  </header>

  <div class="hud">
    <div class="hud-box">
      <div style="color: #94a3b8;">Energy</div>
      <div id="hud-energy" class="hud-val text-amber">90%</div>
    </div>
    <div class="hud-box">
      <div style="color: #94a3b8;">Stress</div>
      <div id="hud-stress" class="hud-val text-rose">15%</div>
    </div>
    <div class="hud-box">
      <div style="color: #94a3b8;">Performance</div>
      <div id="hud-perf" class="hud-val text-green">75%</div>
    </div>
    <div class="hud-box">
      <div style="color: #94a3b8;">Salary</div>
      <div id="hud-salary" class="hud-val text-blue">$350</div>
    </div>
  </div>

  <div id="canvas-container">
    <canvas id="gameCanvas" width="520" height="325"></canvas>
  </div>

  <div id="status-banner" class="status-banner">
    Welcome to Megacorp Inc.! Time to clock in and conquer the cubicle.
  </div>

  <div class="tasks-container">
    <div class="section-title">
      <span>Pending Executive Deliverables</span>
      <span id="tasks-count">2 Active</span>
    </div>
    <div id="task-list" class="task-list">
      <!-- Injected via JavaScript -->
    </div>
  </div>

  <div id="controls" class="controls-grid">
    <!-- Buttons dynamically rendered -->
  </div>

  <script src="logic.js"></script>
  <script>
    let state = createState(Math.floor(Date.now() % 1000000));
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    function renderScene() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Office wall
      const wallGrad = ctx.createLinearGradient(0, 0, 0, 200);
      wallGrad.addColorStop(0, '#1e293b');
      wallGrad.addColorStop(1, '#0f172a');
      ctx.fillStyle = wallGrad;
      ctx.fillRect(0, 0, 520, 190);

      // Cubicle partition
      ctx.fillStyle = '#334155';
      ctx.fillRect(0, 180, 520, 10);
      ctx.fillStyle = '#475569';
      ctx.fillRect(10, 20, 130, 80); // Whiteboard
      ctx.fillStyle = '#ffffff';
      ctx.font = '10px monospace';
      ctx.fillText('GOALS Q4:', 18, 38);
      ctx.fillStyle = '#f87171';
      ctx.fillText('• NO FIRES', 18, 52);
      ctx.fillStyle = '#60a5fa';
      ctx.fillText('• SHIP REPORTS', 18, 66);
      ctx.fillStyle = '#34d399';
      ctx.fillText('• GET PROMOTED', 18, 80);

      // Office Clock
      ctx.beginPath();
      ctx.arc(460, 50, 24, 0, Math.PI * 2);
      ctx.fillStyle = '#f8fafc';
      ctx.fill();
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.fillStyle = '#0f172a';
      const hourAngle = ((state.turns % 60) / 60) * Math.PI * 2;
      ctx.beginPath();
      ctx.moveTo(460, 50);
      ctx.lineTo(460 + Math.cos(hourAngle) * 14, 50 + Math.sin(hourAngle) * 14);
      ctx.stroke();

      // Desk surface
      const deskGrad = ctx.createLinearGradient(0, 190, 0, 325);
      deskGrad.addColorStop(0, '#78350f');
      deskGrad.addColorStop(1, '#451a03');
      ctx.fillStyle = deskGrad;
      ctx.fillRect(0, 190, 520, 135);

      // Desktop PC Monitor
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(200, 110, 120, 80);
      ctx.strokeStyle = '#0284c7';
      ctx.lineWidth = 2;
      ctx.strokeRect(200, 110, 120, 80);
      // Screen glow
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(204, 114, 112, 72);
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(210, 122, 60, 4);
      ctx.fillStyle = '#34d399';
      ctx.fillRect(210, 132, 90, 4);
      ctx.fillStyle = '#f59e0b';
      ctx.fillRect(210, 142, 45, 4);
      ctx.fillStyle = '#f43f5e';
      ctx.fillRect(210, 152, 75, 4);
      // Stand & keyboard
      ctx.fillStyle = '#334155';
      ctx.fillRect(245, 190, 30, 20);
      ctx.fillRect(210, 215, 100, 25);

      // Paper stack / Contracts
      ctx.fillStyle = '#e2e8f0';
      ctx.fillRect(50, 210, 50, 40);
      ctx.fillStyle = '#cbd5e1';
      ctx.fillRect(52, 206, 50, 40);
      ctx.fillStyle = '#94a3b8';
      ctx.fillRect(54, 202, 50, 40);
      ctx.fillStyle = '#0f172a';
      ctx.font = '9px sans-serif';
      ctx.fillText('Docs: ' + (state.items.contractsSigned + state.items.reportsPrinted), 58, 225);

      // Coffee mug with steam
      ctx.fillStyle = '#ef4444';
      ctx.fillRect(360, 215, 28, 30);
      ctx.strokeStyle = '#fca5a5';
      ctx.strokeRect(360, 215, 28, 30);
      ctx.beginPath();
      ctx.arc(390, 230, 8, -Math.PI / 2, Math.PI / 2);
      ctx.stroke();
      // Steam
      ctx.strokeStyle = 'rgba(255,255,255,0.4)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(370, 210);
      ctx.quadraticCurveTo(365, 200, 372, 192);
      ctx.moveTo(378, 208);
      ctx.quadraticCurveTo(383, 198, 376, 190);
      ctx.stroke();

      // Inventory HUD at bottom
      ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
      ctx.fillRect(10, 275, 500, 40);
      ctx.strokeStyle = '#334155';
      ctx.lineWidth = 1;
      ctx.strokeRect(10, 275, 500, 40);

      ctx.fillStyle = '#cbd5e1';
      ctx.font = '11px sans-serif';
      ctx.fillText(`☕ Beans: ${state.items.coffeeBeans}`, 25, 300);
      ctx.fillText(`📄 Paper: ${state.items.paperReams}`, 120, 300);
      ctx.fillText(`✍️ Contracts: ${state.items.contractsSigned}`, 215, 300);
      ctx.fillText(`📊 Reports: ${state.items.reportsPrinted}`, 315, 300);
      ctx.fillText(`🗑️ Shredded: ${state.items.shreddedMemos}`, 415, 300);
    }

    function updateUI() {
      document.getElementById('hdr-turn').textContent = state.turns;
      document.getElementById('hdr-rank').textContent = state.jobTitle;

      const nrg = document.getElementById('hud-energy');
      nrg.textContent = state.energy + '%';
      nrg.className = 'hud-val ' + (state.energy > 40 ? 'text-amber' : 'text-rose');

      const str = document.getElementById('hud-stress');
      str.textContent = state.stress + '%';
      str.className = 'hud-val ' + (state.stress > 65 ? 'text-rose' : 'text-green');

      const prf = document.getElementById('hud-perf');
      prf.textContent = state.performance + '%';
      prf.className = 'hud-val ' + (state.performance >= 70 ? 'text-green' : 'text-amber');

      document.getElementById('hud-salary').textContent = '$' + state.salary;
      document.getElementById('status-banner').textContent = state.gameMessage;

      // Render tasks
      document.getElementById('tasks-count').textContent = state.tasks.length + ' Active';
      let taskHtml = '';
      if (state.tasks.length === 0) {
        taskHtml = '<div style="color: #64748b; font-size: 0.72rem; padding: 4px;">No pending tickets. Board is satisfied!</div>';
      } else {
        for (const t of state.tasks) {
          let reqLabel = '';
          if (t.type === 'contract') reqLabel = `${t.requiredCount} Signed Contracts`;
          else if (t.type === 'report') reqLabel = `${t.requiredCount} Printed Reports`;
          else if (t.type === 'compliance') reqLabel = `${t.requiredCount} Shredded Memos`;
          else if (t.type === 'coffee_run') reqLabel = `${t.requiredCount} Coffee Beans`;

          taskHtml += `
            <div class="task-card">
              <div>
                <div class="task-desc">${t.description}</div>
                <div class="task-meta">Requires: <span style="color:#38bdf8">${reqLabel}</span> | Expires in: <span style="color:${t.deadlineTurns <= 4 ? '#f43f5e' : '#f59e0b'}">${t.deadlineTurns} turns</span></div>
              </div>
              <div style="font-weight: bold; color: #10b981;">+$${t.reward}</div>
            </div>
          `;
        }
      }
      document.getElementById('task-list').innerHTML = taskHtml;

      // Render control buttons
      const legal = legalActions(state);
      let ctrlHtml = '';

      if (isOver(state)) {
        ctrlHtml = `
          <button class="btn-primary" style="grid-column: span 2; padding: 14px;" onclick="window.resetGame()">
            🔄 Start New Office Career Shift
          </button>
        `;
      } else {
        // Standard buttons
        ctrlHtml += `
          <button class="${legal.includes('action:stamp_contracts') ? 'btn-primary' : ''}" ${legal.includes('action:stamp_contracts') ? '' : 'disabled'} onclick="window.doAction('action:stamp_contracts')">
            ✍️ Stamp Contracts
            <span class="btn-sub">-10 Energy, +4 Stress</span>
          </button>
          <button class="${legal.includes('action:print_reports') ? 'btn-primary' : ''}" ${legal.includes('action:print_reports') ? '' : 'disabled'} onclick="window.doAction('action:print_reports')">
            🖨️ Print Reports
            <span class="btn-sub">-1 Paper, -12 Energy</span>
          </button>
          <button ${legal.includes('action:shred_documents') ? '' : 'disabled'} onclick="window.doAction('action:shred_documents')">
            🗑️ Shred Memos
            <span class="btn-sub">-8 Energy, -4 Stress</span>
          </button>
          <button class="${legal.includes('action:brew_coffee') ? 'btn-warn' : ''}" ${legal.includes('action:brew_coffee') ? '' : 'disabled'} onclick="window.doAction('action:brew_coffee')">
            ☕ Brew Espresso
            <span class="btn-sub">-1 Bean, +28 Energy</span>
          </button>
          <button ${legal.includes('action:water_cooler_chat') ? '' : 'disabled'} onclick="window.doAction('action:water_cooler_chat')">
            💬 Water Cooler Chat
            <span class="btn-sub">-22 Stress, +10 Energy</span>
          </button>
          <button ${legal.includes('action:take_power_nap') ? 'btn-warn' : ''}" ${legal.includes('action:take_power_nap') ? '' : 'disabled'} onclick="window.doAction('action:take_power_nap')">
            💤 Desk Power Nap
            <span class="btn-sub">+40 Energy, -15 Stress</span>
          </button>
          <button style="grid-column: span 2;" ${legal.includes('action:restock_supplies') ? '' : 'disabled'} onclick="window.doAction('action:restock_supplies')">
            📦 Restock Office Supplies ($25)
            <span class="btn-sub">+4 Paper Reams, +3 Coffee Beans</span>
          </button>
        `;

        // Deliver task buttons
        for (const t of state.tasks) {
          const act = 'action:deliver_task:' + t.id;
          if (legal.includes(act)) {
            ctrlHtml += `
              <button class="btn-success" style="grid-column: span 2;" onclick="window.doAction('${act}')">
                ✅ Submit Deliverable: ${t.description}
                <span class="btn-sub">Claim $${t.reward} + Performance Bonus</span>
              </button>
            `;
          }
        }

        // Promotion button
        if (legal.includes('action:ask_for_promotion')) {
          ctrlHtml += `
            <button class="btn-purple" onclick="window.doAction('action:ask_for_promotion')">
              ⭐ Petition Executive Board for Promotion!
              <span class="btn-sub">Elevate your title and salary</span>
            </button>
          `;
        }
      }

      document.getElementById('controls').innerHTML = ctrlHtml;
      renderScene();
    }

    window.doAction = function(act) {
      try {
        step(state, act);
        updateUI();
      } catch (err) {
        console.error(err);
      }
    };

    window.resetGame = function() {
      state = createState(Math.floor(Date.now() % 1000000));
      updateUI();
    };

    updateUI();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
