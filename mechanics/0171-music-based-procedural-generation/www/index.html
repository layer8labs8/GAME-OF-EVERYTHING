<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Beat Odyssey - Procedural Rhythm Highway</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #070014;
      color: #fdf2f8;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
      padding: 8px;
    }
    header {
      width: 100%;
      max-width: 640px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 12px;
      background: #1e0538;
      border: 1px solid #d946ef;
      border-radius: 8px;
      margin-bottom: 6px;
    }
    h1 {
      font-size: 1.05rem;
      font-weight: 700;
      color: #ec4899;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(236, 72, 153, 0.5);
    }
    .badge {
      font-size: 0.72rem;
      padding: 2px 8px;
      border-radius: 4px;
      background: #701a75;
      color: #fdf2f8;
      font-weight: 600;
    }
    #game-container {
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    canvas {
      width: 100%;
      height: auto;
      aspect-ratio: 4/3;
      background: #090218;
      border: 2px solid #a21caf;
      border-radius: 8px;
      box-shadow: 0 4px 25px rgba(236, 72, 153, 0.3);
    }
    .vitals-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      width: 100%;
    }
    .vital-card {
      background: #140326;
      border: 1px solid #4a044e;
      padding: 4px 6px;
      border-radius: 6px;
      text-align: center;
    }
    .vital-title {
      font-size: 0.62rem;
      color: #f472b6;
      text-transform: uppercase;
    }
    .vital-val {
      font-size: 0.95rem;
      font-weight: 700;
      margin-top: 1px;
    }
    .log-box {
      background: #140326;
      border: 1px solid #a21caf;
      border-left: 4px solid #ec4899;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 0.78rem;
      color: #fdf2f8;
      min-height: 40px;
      display: flex;
      align-items: center;
    }
    .actions-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 6px;
      margin-top: 2px;
    }
    .btn {
      background: #1e0538;
      border: 1px solid #701a75;
      color: #fdf2f8;
      padding: 8px 6px;
      font-family: inherit;
      font-size: 0.72rem;
      border-radius: 6px;
      cursor: pointer;
      text-transform: uppercase;
      font-weight: 600;
      transition: all 0.15s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .btn:hover {
      background: #3b0764;
      border-color: #ec4899;
      color: #fff;
    }
    .btn:active {
      transform: scale(0.97);
    }
    .btn-ride {
      background: #4a044e;
      border-color: #d946ef;
      color: #fae8ff;
    }
    .btn-ride:hover {
      background: #701a75;
    }
    .btn-steer {
      border-color: #0284c7;
      color: #7dd3fc;
    }
    .btn-steer:hover {
      background: #0369a1;
    }
    .btn-blast {
      border-color: #ea580c;
      color: #fdba74;
    }
    .btn-blast:hover {
      background: #9a3412;
    }
    .btn-overdrive {
      background: #831843;
      border-color: #f43f5e;
      color: #ffe4e6;
    }
    .btn-overdrive:hover {
      background: #9f1239;
    }
    .footer-bar {
      display: flex;
      justify-content: space-between;
      margin-top: 6px;
      width: 100%;
    }
  </style>
</head>
<body>
  <header>
    <h1>🎵 Beat Odyssey</h1>
    <div>
      <span id="turn-badge" class="badge">MEASURE 0 / 100</span>
      <span id="score-badge" class="badge" style="background:#be185d; color:#fdf2f8;">0 PTS</span>
    </div>
  </header>

  <div id="game-container">
    <canvas id="gameCanvas" width="640" height="480"></canvas>

    <div class="vitals-grid">
      <div class="vital-card">
        <div class="vital-title">Shields</div>
        <div id="val-shield" class="vital-val" style="color: #38bdf8;">100%</div>
      </div>
      <div class="vital-card">
        <div class="vital-title">Energy</div>
        <div id="val-energy" class="vital-val" style="color: #facc15;">30%</div>
      </div>
      <div class="vital-card">
        <div class="vital-title">Groove Combo</div>
        <div id="val-combo" class="vital-val" style="color: #ec4899;">0x</div>
      </div>
      <div class="vital-card">
        <div class="vital-title">Lane Position</div>
        <div id="val-lane" class="vital-val" style="color: #c084fc;">CENTER</div>
      </div>
    </div>

    <div id="game-log" class="log-box">
      Procedural audio synth track generated. Surf the frequency highway to measure 100.
    </div>

    <div id="actions-panel" class="actions-grid">
      <!-- Injected dynamically -->
    </div>

    <div class="footer-bar">
      <div id="spectrum-summary" style="font-size:0.7rem; color:#f472b6;">Spectrum: Bass 50% | Mid 50% | Treble 50%</div>
      <button id="bot-toggle-btn" class="btn" style="padding: 4px 10px; font-size: 0.68rem;" onclick="window.toggleBot()">BOT: OFF</button>
    </div>
  </div>

  <script src="logic.js"></script>
  <script>
    let state = createState(Date.now ? Date.now() : 12345);
    let botRunning = false;
    let botInterval = null;

    // Web Audio Synthesizer
    let audioCtx = null;
    function playSfx(type) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const t = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'beat') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(150, t);
          osc.frequency.exponentialRampToValueAtTime(45, t + 0.12);
          gain.gain.setValueAtTime(0.4, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + 0.15);
          osc.start(t);
          osc.stop(t + 0.15);
        } else if (type === 'steer') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(300, t);
          osc.frequency.exponentialRampToValueAtTime(450, t + 0.08);
          gain.gain.setValueAtTime(0.2, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
          osc.start(t);
          osc.stop(t + 0.1);
        } else if (type === 'blast') {
          osc.type = 'square';
          osc.frequency.setValueAtTime(500, t);
          osc.frequency.exponentialRampToValueAtTime(80, t + 0.25);
          gain.gain.setValueAtTime(0.4, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + 0.3);
          osc.start(t);
          osc.stop(t + 0.3);
        } else if (type === 'overdrive') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(200, t);
          osc.frequency.linearRampToValueAtTime(600, t + 0.35);
          gain.gain.setValueAtTime(0.35, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + 0.4);
          osc.start(t);
          osc.stop(t + 0.4);
        }
      } catch (e) {}
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const LANE_NAMES = ['LEFT', 'CENTER', 'RIGHT'];

    function render() {
      // Status badges
      document.getElementById('turn-badge').textContent = 'MEASURE ' + state.measure + ' / ' + TRACK_LENGTH;
      document.getElementById('score-badge').textContent = score(state) + ' PTS';
      document.getElementById('game-log').textContent = state.gameMessage;

      const sEl = document.getElementById('val-shield');
      sEl.textContent = state.shield + '%';
      sEl.style.color = state.shield > 50 ? '#38bdf8' : '#ef4444';

      document.getElementById('val-energy').textContent = state.energy + '%';
      document.getElementById('val-combo').textContent = state.combo + 'x';
      document.getElementById('val-lane').textContent = LANE_NAMES[state.lane];

      if (state.measure < state.track.length) {
        const slice = state.track[state.measure];
        document.getElementById('spectrum-summary').textContent =
          'Spectrum: Bass ' + slice.bass + '% | Mid ' + slice.mid + '% | Treble ' + slice.treble + '%';
      }

      // Canvas 3D Perspective Synthwave Rendering
      const w = canvas.width;
      const h = canvas.height;
      const cx = w / 2;
      const cy = h / 2;

      ctx.fillStyle = '#060012';
      ctx.fillRect(0, 0, w, h);

      // Neon Sun on Horizon
      const sunY = h * 0.4;
      const sunGrad = ctx.createLinearGradient(cx, sunY - 70, cx, sunY + 70);
      sunGrad.addColorStop(0, '#f43f5e');
      sunGrad.addColorStop(0.5, '#fb923c');
      sunGrad.addColorStop(1, '#ec4899');
      ctx.fillStyle = sunGrad;
      ctx.beginPath();
      ctx.arc(cx, sunY, 65, 0, Math.PI * 2);
      ctx.fill();

      // Sun stripes
      ctx.strokeStyle = '#060012';
      for (let s = 0; s < 6; s++) {
        const sy = sunY + s * 10;
        ctx.lineWidth = 3 + s * 1.5;
        ctx.beginPath();
        ctx.moveTo(cx - 70, sy); ctx.lineTo(cx + 70, sy);
        ctx.stroke();
      }

      // Equalizer bars along horizon
      if (state.measure < state.track.length) {
        const slice = state.track[state.measure];
        ctx.fillStyle = 'rgba(56, 189, 248, 0.4)';
        ctx.fillRect(40, sunY, 30, -slice.bass * 0.8);
        ctx.fillStyle = 'rgba(236, 72, 153, 0.4)';
        ctx.fillRect(80, sunY, 30, -slice.mid * 0.8);
        ctx.fillStyle = 'rgba(244, 114, 182, 0.4)';
        ctx.fillRect(w - 110, sunY, 30, -slice.treble * 0.8);
      }

      // Perspective Highway 3 Lanes
      const roadTopW = 120;
      const roadBottomW = 480;
      const roadTopY = sunY + 10;
      const roadBottomY = h;

      ctx.fillStyle = '#0d0124';
      ctx.beginPath();
      ctx.moveTo(cx - roadTopW / 2, roadTopY);
      ctx.lineTo(cx + roadTopW / 2, roadTopY);
      ctx.lineTo(cx + roadBottomW / 2, roadBottomY);
      ctx.lineTo(cx - roadBottomW / 2, roadBottomY);
      ctx.closePath();
      ctx.fill();

      // Outer highway borders
      ctx.strokeStyle = '#ec4899';
      ctx.lineWidth = 4;
      ctx.stroke();

      // Lane divider lines
      ctx.strokeStyle = '#06b6d4';
      ctx.lineWidth = 2;
      ctx.setLineDash([16, 12]);
      // Lane 0/1 divider
      ctx.beginPath();
      ctx.moveTo(cx - roadTopW / 6, roadTopY);
      ctx.lineTo(cx - roadBottomW / 6, roadBottomY);
      ctx.stroke();
      // Lane 1/2 divider
      ctx.beginPath();
      ctx.moveTo(cx + roadTopW / 6, roadTopY);
      ctx.lineTo(cx + roadBottomW / 6, roadBottomY);
      ctx.stroke();
      ctx.setLineDash([]);

      // Draw upcoming measures (next 5 measures in perspective)
      for (let dist = 4; dist >= 1; dist--) {
        const targetM = state.measure + dist;
        if (targetM < state.track.length) {
          const slice = state.track[targetM];
          const t = 1 - dist / 5;
          const y = roadTopY + (roadBottomY - roadTopY) * t;
          const curW = roadTopW + (roadBottomW - roadTopW) * t;
          const laneW = curW / 3;

          for (let l = 0; l < 3; l++) {
            const el = slice.elements[l];
            if (el) {
              const lx = cx - curW / 2 + l * laneW + laneW / 2;
              const size = 12 + t * 24;

              if (el === 'hazard') {
                ctx.fillStyle = '#ef4444';
                ctx.fillRect(lx - size / 2, y - size / 2, size, size);
                ctx.strokeStyle = '#fca5a5';
                ctx.strokeRect(lx - size / 2, y - size / 2, size, size);
              } else if (el === 'gem') {
                ctx.fillStyle = '#38bdf8';
                ctx.beginPath();
                ctx.arc(lx, y, size / 2, 0, Math.PI * 2);
                ctx.fill();
              } else if (el === 'harmonizer') {
                ctx.strokeStyle = '#facc15';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.arc(lx, y, size / 1.5, 0, Math.PI * 2);
                ctx.stroke();
              }
            }
          }
        }
      }

      // Draw Player Ship in Current Lane
      const shipY = roadBottomY - 50;
      const shipRoadW = roadBottomW * 0.9;
      const shipLaneW = shipRoadW / 3;
      const shipX = cx - shipRoadW / 2 + state.lane * shipLaneW + shipLaneW / 2;

      ctx.fillStyle = state.overdriveTurns > 0 ? '#f43f5e' : '#38bdf8';
      ctx.beginPath();
      ctx.moveTo(shipX, shipY - 24);
      ctx.lineTo(shipX + 22, shipY + 18);
      ctx.lineTo(shipX, shipY + 10);
      ctx.lineTo(shipX - 22, shipY + 18);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.stroke();

      // Ship thruster flame
      ctx.fillStyle = '#fb923c';
      ctx.beginPath();
      ctx.moveTo(shipX - 8, shipY + 12);
      ctx.lineTo(shipX, shipY + 28);
      ctx.lineTo(shipX + 8, shipY + 12);
      ctx.fill();

      // Game Over Screen
      if (isOver(state)) {
        ctx.fillStyle = state.victory ? 'rgba(6, 78, 59, 0.9)' : 'rgba(69, 10, 10, 0.9)';
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 24px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(state.victory ? 'TRACK SYNCHRONIZATION COMPLETE!' : 'SONIC DESTABILIZATION - CRASH', cx, cy - 20);
        ctx.font = '14px sans-serif';
        ctx.fillText('Final Rhythm Performance Score: ' + score(state), cx, cy + 15);
      }

      updateActions();
    }

    function updateActions() {
      const panel = document.getElementById('actions-panel');
      if (isOver(state)) {
        panel.innerHTML = '<button class="btn btn-ride" onclick="window.restartGame()">NEW TRACK ODYSSEY</button>';
        return;
      }

      const actions = legalActions(state);
      let html = '';

      for (const act of actions) {
        let cls = 'btn';
        let label = act;
        let sub = '';

        if (act === 'action:ride_beat') {
          cls += ' btn-ride';
          label = '⚡ Ride Rhythm Pulse';
          sub = 'Maintain Lane Flow';
        } else if (act === 'action:shift_lane:left') {
          cls += ' btn-steer';
          label = '◀ Shift Left';
          sub = 'Evade / Target Left';
        } else if (act === 'action:shift_lane:right') {
          cls += ' btn-steer';
          label = '▶ Shift Right';
          sub = 'Evade / Target Right';
        } else if (act === 'action:pulse_sonic_blast') {
          cls += ' btn-blast';
          label = '💥 Sonic Blast';
          sub = 'Vaporize Hazard (-20 Eng)';
        } else if (act === 'action:engage_overdrive') {
          cls += ' btn-overdrive';
          label = '🚀 Supersonic Overdrive';
          sub = 'Invulnerability (30 Eng)';
        }

        html += '<button class="' + cls + '" onclick="window.triggerAction(\'' + act + '\')"><span>' + label + '</span>' + (sub ? '<span style="font-size:0.62rem;opacity:0.8;">' + sub + '</span>' : '') + '</button>';
      }

      panel.innerHTML = html;
    }

    window.triggerAction = function(act) {
      if (isOver(state)) return;
      if (act.includes('blast')) playSfx('blast');
      else if (act.includes('overdrive')) playSfx('overdrive');
      else if (act.includes('shift')) playSfx('steer');
      else playSfx('beat');

      step(state, act);
      render();
    };

    window.restartGame = function() {
      state = createState(Date.now ? Date.now() : 12345);
      render();
    };

    window.toggleBot = function() {
      botRunning = !botRunning;
      document.getElementById('bot-toggle-btn').textContent = botRunning ? 'BOT: ON' : 'BOT: OFF';
      document.getElementById('bot-toggle-btn').style.background = botRunning ? '#be185d' : '#1e0538';

      if (botRunning) {
        botInterval = setInterval(() => {
          if (isOver(state)) {
            state = createState(Date.now ? Date.now() : 9999);
            render();
            return;
          }
          const acts = legalActions(state);
          if (acts.length > 0) {
            let choice = acts[0];
            // Check if upcoming measure has hazard in current lane
            const slice = state.track[state.measure];
            const hasHazard = slice && slice.elements[state.lane] === 'hazard';

            if (hasHazard && acts.includes('action:pulse_sonic_blast') && state.energy >= 20) {
              choice = 'action:pulse_sonic_blast';
            } else if (hasHazard && acts.includes('action:shift_lane:left')) {
              choice = 'action:shift_lane:left';
            } else if (hasHazard && acts.includes('action:shift_lane:right')) {
              choice = 'action:shift_lane:right';
            } else if (acts.includes('action:engage_overdrive') && state.energy >= 50) {
              choice = 'action:engage_overdrive';
            } else {
              choice = 'action:ride_beat';
            }
            window.triggerAction(choice);
          }
        }, 250);
      } else {
        clearInterval(botInterval);
      }
    };

    render();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
