<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)" stroke="#f59e0b" stroke-width="8"/>
  <!-- Radiant Halo Rays -->
  <g stroke="#f59e0b" stroke-width="6" opacity="0.5" stroke-dasharray="16, 12">
    <circle cx="256" cy="230" r="140" fill="none"/>
    <circle cx="256" cy="230" r="180" fill="none"/>
  </g>
  <!-- Celestial Sun of Creation -->
  <circle cx="256" cy="230" r="90" fill="url(#sunGrad)" filter="drop-shadow(0 0 25px #f59e0b)"/>
  <!-- Divine Lightning Bolt of Will -->
  <polygon points="266,70 196,250 256,250 216,420 336,210 276,210" fill="url(#boltGrad)" stroke="#ffffff" stroke-width="6" stroke-linejoin="round"/>
  <!-- Sacred Earth Arc -->
  <path d="M 80 430 Q 256 360 432 430" fill="none" stroke="#10b981" stroke-width="14" stroke-linecap="round"/>
</svg>
