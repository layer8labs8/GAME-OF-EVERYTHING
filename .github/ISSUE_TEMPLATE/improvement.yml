name: Improve a game
description: Suggest a better feel, new levels, sound, controls, or clearer rules for an existing game
labels: [upgrade]
body:
  - type: input
    id: mechanic
    attributes:
      label: Game
      description: The folder name, such as 0017-court-rally.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What should change?
      description: Say what feels wrong or missing, and what you'd like instead.
    validations:
      required: true
  - type: dropdown
    id: help
    attributes:
      label: Would you like to work on this?
      options:
        - Yes, I'd like to open a pull request
        - No, I'm only suggesting it
    validations:
      required: true
