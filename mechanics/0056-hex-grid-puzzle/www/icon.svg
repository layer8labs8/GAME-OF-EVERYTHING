<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070e" />
      <stop offset="100%" stop-color="#0d1527" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a5f3fc" />
      <stop offset="60%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <!-- Central Glowing Hexagon -->
  <polygon points="256,96 394,176 394,336 256,416 118,336 118,176" fill="#0f172a" stroke="url(#cyanGlow)" stroke-width="12" />
  <!-- Inner Power Core -->
  <polygon points="256,160 338,208 338,304 256,352 174,304 174,208" fill="url(#coreGlow)" opacity="0.8" />
  <!-- Circuit Wires -->
  <line x1="256" y1="96" x2="256" y2="160" stroke="#67e8f9" stroke-width="10" stroke-linecap="round" />
  <line x1="394" y1="176" x2="338" y2="208" stroke="#67e8f9" stroke-width="10" stroke-linecap="round" />
  <line x1="394" y1="336" x2="338" y2="304" stroke="#67e8f9" stroke-width="10" stroke-linecap="round" />
  <line x1="256" y1="416" x2="256" y2="352" stroke="#67e8f9" stroke-width="10" stroke-linecap="round" />
  <line x1="118" y1="336" x2="174" y2="304" stroke="#67e8f9" stroke-width="10" stroke-linecap="round" />
  <line x1="118" y1="176" x2="174" y2="208" stroke="#67e8f9" stroke-width="10" stroke-linecap="round" />
  <!-- Center Orb -->
  <circle cx="256" cy="256" r="36" fill="#ffffff" filter="drop-shadow(0 0 16px #38bdf8)" />
</svg>
