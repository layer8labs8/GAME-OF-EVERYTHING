<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#182038"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="crystal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <!-- Platform block -->
  <rect x="80" y="360" width="352" height="60" rx="12" fill="#334155"/>
  <!-- Hazard spikes -->
  <polygon points="120,360 140,320 160,360" fill="#ef4444"/>
  <polygon points="160,360 180,320 200,360" fill="#ef4444"/>
  <polygon points="200,360 220,320 240,360" fill="#ef4444"/>
  <!-- Floating Crystal -->
  <polygon points="360,200 400,260 360,320 320,260" fill="url(#crystal)"/>
  <!-- Leaping Runner with Dash Aura -->
  <circle cx="240" cy="220" r="32" fill="#ec4899"/>
  <circle cx="210" cy="225" r="22" fill="#ec4899" opacity="0.5"/>
  <circle cx="185" cy="230" r="14" fill="#ec4899" opacity="0.25"/>
  <!-- Border -->
  <rect x="20" y="20" width="472" height="472" rx="80" fill="none" stroke="#334155" stroke-width="8"/>
</svg>
