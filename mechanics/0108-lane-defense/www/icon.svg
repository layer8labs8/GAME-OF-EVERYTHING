<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="crystal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="gate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="100" fill="url(#bg)" stroke="#334155" stroke-width="8" />

  <!-- 3 Defense Lanes converging towards left fortress -->
  <g fill="none" stroke="#475569" stroke-width="3" opacity="0.6">
    <!-- Top Lane -->
    <path d="M 120,160 L 460,110" />
    <path d="M 120,210 L 460,180" />
    <!-- Mid Lane -->
    <path d="M 120,240 L 460,230" />
    <path d="M 120,290 L 460,300" />
    <!-- Bot Lane -->
    <path d="M 120,320 L 460,350" />
    <path d="M 120,370 L 460,420" />
  </g>

  <!-- Left Citadel Fortress Bastion Wall -->
  <g>
    <path d="M 60,100 L 140,100 L 140,420 L 60,420 Z" fill="#1e293b" stroke="#64748b" stroke-width="6" />
    <!-- Wall battlements -->
    <rect x="60" y="80" width="20" height="24" fill="#334155" />
    <rect x="90" y="80" width="20" height="24" fill="#334155" />
    <rect x="120" y="80" width="20" height="24" fill="#334155" />
    <!-- Portcullis Gates -->
    <rect x="130" y="170" width="16" height="30" rx="3" fill="url(#gate)" />
    <rect x="130" y="250" width="16" height="30" rx="3" fill="url(#gate)" />
    <rect x="130" y="330" width="16" height="30" rx="3" fill="url(#gate)" />
  </g>

  <!-- Defensive Towers on Lanes -->
  <!-- Top Lane Archer Tower -->
  <g>
    <rect x="220" y="125" width="26" height="45" rx="3" fill="#334155" stroke="#94a3b8" stroke-width="3" />
    <polygon points="214,125 233,105 252,125" fill="#f59e0b" />
    <!-- Arrow fired -->
    <line x1="250" y1="130" x2="330" y2="120" stroke="#fde047" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Mid Lane Arcane Obelisk Crystal -->
  <g filter="url(#glow)">
    <polygon points="270,265 285,210 300,265 285,280" fill="url(#crystal)" stroke="#a5f3fc" stroke-width="2" />
    <rect x="276" y="278" width="18" height="20" fill="#1e293b" stroke="#64748b" stroke-width="2" />
    <!-- Arcane aura rings -->
    <circle cx="285" cy="245" r="32" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 4" opacity="0.8" />
  </g>

  <!-- Bot Lane Cannon Bastion -->
  <g>
    <rect x="230" y="340" width="36" height="26" rx="4" fill="#1e293b" stroke="#64748b" stroke-width="3" />
    <rect x="250" y="346" width="28" height="12" rx="2" fill="#0f172a" stroke="#94a3b8" stroke-width="2" />
  </g>

  <!-- Invader Horde Crest (Right) -->
  <polygon points="410,240 460,200 460,280" fill="#ef4444" opacity="0.8" />
  <circle cx="430" cy="240" r="10" fill="#7f1d1d" />
</svg>