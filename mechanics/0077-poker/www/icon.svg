<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="felt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="chipRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#felt)"/>
  <rect width="500" height="500" x="6" y="6" rx="90" fill="none" stroke="#d97706" stroke-width="4" stroke-opacity="0.3"/>
  <g transform="translate(136, 86)">
    <!-- Pocket Aces Cards -->
    <rect x="-30" y="20" width="180" height="260" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="4" transform="rotate(-15, 60, 150)" filter="url(#shadow)"/>
    <text x="0" y="60" fill="#dc2626" font-size="28" font-weight="900" font-family="serif" transform="rotate(-15, 60, 150)">A♥</text>

    <rect x="30" y="10" width="180" height="260" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="4" transform="rotate(10, 120, 140)" filter="url(#shadow)"/>
    <text x="50" y="55" fill="#0f172a" font-size="28" font-weight="900" font-family="serif" transform="rotate(10, 120, 140)">A♠</text>

    <!-- Poker Chip in foreground -->
    <circle cx="120" cy="270" r="64" fill="url(#chipRed)" stroke="#ffffff" stroke-width="8" stroke-dasharray="24 16" filter="url(#shadow)"/>
    <circle cx="120" cy="270" r="44" fill="#7f1d1d" stroke="url(#gold)" stroke-width="4"/>
    <text x="120" y="282" fill="url(#gold)" font-size="34" font-weight="900" font-family="sans-serif" text-anchor="middle">♠</text>
  </g>
</svg>
