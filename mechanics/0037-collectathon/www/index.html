<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#081326">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>Relic Rush</title>
<style>
  html, body { margin: 0; height: 100%; background: #081326; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; margin: 0 auto; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="logic.js"></script>
<script>
const logic = window.RelicRush || window.GameLogic;
const { PLATFORMS, createState, legalActions, step, isOver, score } = logic;

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const W = 360;
const H = 640;
const VIEW_Y = 98;
const VIEW_H = 310;
const SX = 16;
const SY = 26;

let scale = 1;
function resize() {
  scale = Math.min(innerWidth / W, innerHeight / H);
  const dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.style.width = W * scale + 'px';
  canvas.style.height = H * scale + 'px';
  canvas.width = Math.round(W * scale * dpr);
  canvas.height = Math.round(H * scale * dpr);
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
}
addEventListener('resize', resize);
resize();

let best = 0;
try { best = +localStorage.getItem('goe-0037-best') || 0; } catch (e) {}

let state = createState(Date.now());
let visX = state.player.x;
let visY = state.player.y;
let camX = visX * SX - W / 2;
let camY = -visY * SY - VIEW_H * 0.58;
let facing = 1;
let animTime = 0;
let shake = 0;
let overAt = 0;

let particles = [];
let popups = [];

const keys = {};
let touchDir = 0;
let holdGlide = false;
let activeBtn = '';
let activePointer = null;
let dragAnchorX = null;
let moveTimer = 0;
let airTimer = 0;
let restTimer = 0;

const BTNS = [
  { id: 'left', x: 16, y: 504, w: 68, h: 68, label: '◀' },
  { id: 'right', x: 92, y: 504, w: 68, h: 68, label: '▶' },
  { id: 'jump', x: 174, y: 504, w: 86, h: 68, label: 'JUMP' },
  { id: 'interact', x: 268, y: 504, w: 76, h: 68, label: 'ACT' },
  { id: 'glide', x: 174, y: 442, w: 86, h: 52, label: 'GLIDE' },
  { id: 'pound', x: 268, y: 442, w: 76, h: 52, label: 'POUND' },
  { id: 'reset', x: 16, y: 442, w: 144, h: 52, label: '↺ NEW EXPEDITION' }
];

function rrect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function addBurst(wx, wy, color, count) {
  for (let i = 0; i < count; i++) {
    const a = (Math.PI * 2 * i) / count + (i % 3) * 0.22;
    const sp = 35 + (i % 4) * 20;
    particles.push({ x: wx * SX, y: -wy * SY - 10, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 15, color, life: 0.5 });
  }
}

function addPopup(wx, wy, text, color) {
  popups.push({ x: wx * SX, y: -wy * SY - 24, text, color, life: 0.95 });
}

function restart() {
  state = createState(Date.now());
  visX = state.player.x;
  visY = state.player.y;
  camX = visX * SX - W / 2;
  camY = -visY * SY - VIEW_H * 0.58;
  facing = 1;
  shake = 0;
  overAt = 0;
  particles = [];
  popups = [];
  touchDir = 0;
  holdGlide = false;
  activeBtn = '';
  activePointer = null;
  dragAnchorX = null;
  moveTimer = 0;
  airTimer = 0;
  restTimer = 0;
}

function executeAction(act) {
  if (isOver(state)) return false;
  const legal = legalActions(state);
  if (!legal.includes(act)) return false;

  const prevGems = state.gemsCollected;
  const prevRelics = state.relicsCollected;
  const prevHp = state.player.hp;
  const prevPound = state.player.abilities.groundPound;
  const prevGlide = state.player.abilities.glide;
  const prevGate = state.tributeGateOpen;

  if (act === 'move_left') facing = -1;
  else if (act === 'move_right' || act === 'glide') facing = 1;

  if (act === 'jump' || act === 'double_jump') {
    addBurst(state.player.x, state.player.y, '#38bdf8', 7);
  } else if (act === 'ground_pound') {
    shake = 6;
  }

  const res = step(state, act);

  if (act === 'ground_pound') {
    addBurst(state.player.x, state.player.y, '#fbbf24', 14);
  }

  if (state.gemsCollected > prevGems) {
    addBurst(state.player.x, state.player.y, '#38bdf8', 8);
    addPopup(state.player.x, state.player.y, '+15 GEM', '#38bdf8');
  }
  if (state.relicsCollected > prevRelics) {
    addBurst(state.player.x, state.player.y, '#facc15', 18);
    addPopup(state.player.x, state.player.y, '★ RELIC +250!', '#facc15');
    shake = 4;
  }
  if (!prevPound && state.player.abilities.groundPound) {
    addBurst(5, 3, '#ef4444', 14);
    addPopup(5, 3, 'GROUND POUND!', '#f87171');
  }
  if (!prevGlide && state.player.abilities.glide) {
    addBurst(14, 5, '#818cf8', 14);
    addPopup(14, 5, 'GLIDER WINGS!', '#a5b4fc');
  }
  if (!prevGate && state.tributeGateOpen) {
    addBurst(25, 2, '#34d399', 14);
    addPopup(25, 2, 'GATE UNLOCKED!', '#34d399');
  }
  if (state.player.hp < prevHp) {
    visX = state.player.x;
    visY = state.player.y;
    shake = 7;
    addPopup(state.player.x, state.player.y, 'VOID FALL!', '#ef4444');
  }

  if (res.done) {
    overAt = performance.now();
    const sc = score(state);
    if (sc > best) {
      best = sc;
      try { localStorage.setItem('goe-0037-best', best); } catch (e) {}
    }
  }
  return true;
}

function smartJump() {
  if (state.player.onGround) {
    if (state.player.stamina < 10) executeAction('rest');
    if (executeAction('jump')) airTimer = 0;
  } else {
    if (executeAction('double_jump')) airTimer = 0;
    else if (executeAction('glide')) airTimer = 0;
  }
}

function isNearInteractable() {
  const p = state.player;
  if (Math.abs(p.x - 5) <= 1 && Math.abs(p.y - 3) <= 1 && !p.abilities.groundPound) return 'SHRINE: POUND';
  if (Math.abs(p.x - 14) <= 1 && Math.abs(p.y - 5) <= 1 && !p.abilities.glide) return 'SHRINE: GLIDE';
  if (Math.abs(p.x - 25) <= 1 && !state.tributeGateOpen) return `GATE (${state.gemsCollected}/20 GEMS)`;
  if (Math.abs(p.x - 36) <= 1 && p.y >= 12) return `BEACON (${state.relicsCollected}/5★)`;
  return '';
}

function toLogical(e) {
  const rect = canvas.getBoundingClientRect();
  return { x: (e.clientX - rect.left) / scale, y: (e.clientY - rect.top) / scale };
}

function hitBtn(p) {
  for (const b of BTNS) {
    if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) return b.id;
  }
  return '';
}

canvas.addEventListener('pointerdown', (e) => {
  const p = toLogical(e);
  if (isOver(state)) {
    if (performance.now() - overAt > 350) restart();
    return;
  }
  canvas.setPointerCapture(e.pointerId);
  activePointer = e.pointerId;

  const bid = hitBtn(p);
  activeBtn = bid;
  if (bid === 'reset') { restart(); return; }
  if (bid === 'left') {
    touchDir = -1;
    if (executeAction('move_left')) { moveTimer = 0.13; airTimer = 0; }
    return;
  }
  if (bid === 'right') {
    touchDir = 1;
    if (executeAction('move_right')) { moveTimer = 0.13; airTimer = 0; }
    return;
  }
  if (bid === 'jump') { smartJump(); return; }
  if (bid === 'interact') { executeAction('interact'); return; }
  if (bid === 'glide') { holdGlide = true; if (executeAction('glide')) airTimer = 0; return; }
  if (bid === 'pound') { if (executeAction('ground_pound')) airTimer = 0; return; }

  // Direct viewport touch: tap interactable if nearby, upper viewport jumps, lower steers
  dragAnchorX = p.x;
  if (isNearInteractable() && p.y >= VIEW_Y && p.y <= VIEW_Y + VIEW_H && Math.abs(p.x - W / 2) < 55) {
    executeAction('interact');
    return;
  }
  if (p.y < VIEW_Y + VIEW_H * 0.52) {
    smartJump();
  } else {
    touchDir = p.x < W / 2 ? -1 : 1;
    if (executeAction(touchDir < 0 ? 'move_left' : 'move_right')) { moveTimer = 0.13; airTimer = 0; }
  }
});

canvas.addEventListener('pointermove', (e) => {
  if (activePointer !== e.pointerId || isOver(state)) return;
  const p = toLogical(e);
  const bid = hitBtn(p);
  if (bid === 'left') { activeBtn = 'left'; touchDir = -1; return; }
  if (bid === 'right') { activeBtn = 'right'; touchDir = 1; return; }
  if (dragAnchorX !== null && p.y < 435) {
    const dx = p.x - dragAnchorX;
    if (Math.abs(dx) > 14) touchDir = dx < 0 ? -1 : 1;
  }
});

function clearPointer() {
  activePointer = null;
  dragAnchorX = null;
  touchDir = 0;
  holdGlide = false;
  activeBtn = '';
}
canvas.addEventListener('pointerup', clearPointer);
canvas.addEventListener('pointercancel', clearPointer);

addEventListener('keydown', (e) => {
  if (isOver(state)) {
    if ((e.key === ' ' || e.key === 'Enter') && performance.now() - overAt > 350) restart();
    return;
  }
  const wasDown = keys[e.key];
  keys[e.key] = true;

  if (!wasDown) {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
      e.preventDefault();
      if (executeAction('move_left')) { moveTimer = 0.13; airTimer = 0; }
    } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
      e.preventDefault();
      if (executeAction('move_right')) { moveTimer = 0.13; airTimer = 0; }
    } else if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
      e.preventDefault();
      smartJump();
    } else if (e.key === 'e' || e.key === 'E' || e.key === 'Enter') {
      e.preventDefault();
      executeAction('interact');
    } else if (e.key === 'g' || e.key === 'G' || e.key === 'Shift') {
      e.preventDefault();
      if (executeAction('glide')) airTimer = 0;
    } else if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown') {
      e.preventDefault();
      if (executeAction('ground_pound')) airTimer = 0;
    } else if (e.key === 'r' || e.key === 'R') {
      restart();
    }
  }
});

addEventListener('keyup', (e) => { keys[e.key] = false; });

function updateSim(dt) {
  animTime += dt;
  if (shake > 0) shake = Math.max(0, shake - dt * 26);
  if (moveTimer > 0) moveTimer = Math.max(0, moveTimer - dt);

  if (!isOver(state)) {
    let dir = touchDir;
    if (keys['ArrowLeft'] || keys['a'] || keys['A']) dir = -1;
    else if (keys['ArrowRight'] || keys['d'] || keys['D']) dir = 1;
    const glidingNow = holdGlide || keys['g'] || keys['G'] || keys['Shift'];

    if (!state.player.onGround) {
      airTimer += dt;
      const AIR_STEP = 0.14;
      while (airTimer >= AIR_STEP && !isOver(state) && !state.player.onGround) {
        airTimer -= AIR_STEP;
        if (glidingNow && legalActions(state).includes('glide')) {
          executeAction('glide');
        } else if (dir < 0 && legalActions(state).includes('move_left')) {
          executeAction('move_left');
        } else if (dir > 0 && legalActions(state).includes('move_right')) {
          executeAction('move_right');
        } else {
          // Pure vertical gravity tick when coasting mid-air
          executeAction('interact');
        }
      }
    } else {
      airTimer = 0;
      if (dir !== 0 && moveTimer <= 0) {
        if (executeAction(dir < 0 ? 'move_left' : 'move_right')) {
          moveTimer = 0.125;
          restTimer = 0;
        }
      } else if (dir === 0 && state.player.stamina < state.player.maxStamina) {
        restTimer += dt;
        if (restTimer >= 0.28) {
          restTimer = 0;
          executeAction('rest');
        }
      }
    }
  }

  // Smooth 60 FPS player & camera interpolation
  const k = Math.min(1, dt * 18);
  visX += (state.player.x - visX) * k;
  visY += (state.player.y - visY) * k;

  const targetCamX = visX * SX - W / 2;
  const targetCamY = -visY * SY - VIEW_H * 0.58;
  camX += (targetCamX - camX) * Math.min(1, dt * 10);
  camY += (targetCamY - camY) * Math.min(1, dt * 10);

  for (let i = particles.length - 1; i >= 0; i--) {
    const pt = particles[i];
    pt.x += pt.vx * dt;
    pt.y += pt.vy * dt;
    pt.vy += 120 * dt;
    pt.life -= dt;
    if (pt.life <= 0) particles.splice(i, 1);
  }
  for (let i = popups.length - 1; i >= 0; i--) {
    popups[i].y -= 26 * dt;
    popups[i].life -= dt;
    if (popups[i].life <= 0) popups.splice(i, 1);
  }
}

function draw() {
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#0f2447');
  bg.addColorStop(0.55, '#081326');
  bg.addColorStop(1, '#040914');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  const p = state.player;

  // Top Header HUD
  ctx.fillStyle = '#94a3b8';
  ctx.font = 'bold 11px system-ui, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('SCORE', 16, 26);
  ctx.textAlign = 'center';
  ctx.fillText('CELESTIAL RELICS', W / 2, 26);
  ctx.textAlign = 'right';
  ctx.fillText('BEST', W - 16, 26);

  ctx.fillStyle = '#f8fafc';
  ctx.font = 'bold 24px system-ui, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(score(state), 16, 54);

  // 5 Relic Stars
  for (let i = 0; i < 5; i++) {
    const has = state.relics[i] && state.relics[i].collected;
    ctx.fillStyle = has ? '#facc15' : '#1e293b';
    ctx.font = 'bold 19px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('★', W / 2 - 40 + i * 20, 53);
  }

  ctx.fillStyle = '#38bdf8';
  ctx.font = 'bold 20px system-ui, sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText(best, W - 16, 52);

  // Gems + HP + Stamina Bar Row
  ctx.fillStyle = '#38bdf8';
  ctx.font = 'bold 12px system-ui, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(`◆ ${state.gemsCollected}/${state.totalGems} Gems`, 16, 82);

  ctx.fillStyle = '#f43f5e';
  ctx.textAlign = 'center';
  ctx.fillText(`♥ ${p.hp}%`, W / 2 + 8, 82);

  ctx.fillStyle = '#1e293b';
  rrect(W - 106, 72, 90, 12, 6);
  ctx.fill();
  ctx.fillStyle = '#22c55e';
  if (p.stamina > 0) {
    rrect(W - 106, 72, Math.max(8, 90 * (p.stamina / p.maxStamina)), 12, 6);
    ctx.fill();
  }

  // Sky Citadel Viewport
  ctx.save();
  ctx.beginPath();
  rrect(10, VIEW_Y, W - 20, VIEW_H, 12);
  ctx.clip();

  const sky = ctx.createLinearGradient(0, VIEW_Y, 0, VIEW_Y + VIEW_H);
  sky.addColorStop(0, '#0c2348');
  sky.addColorStop(0.65, '#133769');
  sky.addColorStop(1, '#1e1b4b');
  ctx.fillStyle = sky;
  ctx.fillRect(10, VIEW_Y, W - 20, VIEW_H);

  // Parallax clouds
  ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
  for (let i = 0; i < 6; i++) {
    const cx = ((i * 95 - camX * 0.25 + animTime * 6) % 440 + 440) % 440 - 40;
    const cy = VIEW_Y + 36 + (i % 3) * 65;
    rrect(cx, cy, 64, 18, 9);
    ctx.fill();
  }

  if (shake > 0.1) {
    ctx.translate(Math.sin(animTime * 55) * shake, Math.cos(animTime * 48) * shake * 0.6);
  }
  ctx.translate(-camX, VIEW_Y - camY);

  // Floating Islands
  for (const plat of PLATFORMS) {
    const px = plat.x1 * SX - 6;
    const pw = (plat.x2 - plat.x1) * SX + 12;
    const py = -plat.y * SY;

    ctx.fillStyle = '#78350f';
    ctx.beginPath();
    ctx.moveTo(px + 2, py + 6);
    ctx.lineTo(px + pw - 2, py + 6);
    ctx.lineTo(px + pw * 0.72, py + 32);
    ctx.lineTo(px + pw * 0.28, py + 32);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#22c55e';
    rrect(px, py, pw, 8, 4);
    ctx.fill();
  }

  // Shrine 1: Ground Pound (x=5, y=3)
  const s1x = 5 * SX;
  const s1y = -3 * SY - 24;
  ctx.fillStyle = p.abilities.groundPound ? '#475569' : '#dc2626';
  rrect(s1x - 10, s1y, 20, 24, 5);
  ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 11px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('P', s1x, s1y + 16);

  // Shrine 2: Glider Wings (x=14, y=5)
  const s2x = 14 * SX;
  const s2y = -5 * SY - 24;
  ctx.fillStyle = p.abilities.glide ? '#475569' : '#6366f1';
  rrect(s2x - 10, s2y, 20, 24, 5);
  ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.fillText('G', s2x, s2y + 16);

  // Reinforced Stone Chest (x=14, y=1)
  const chX = 14 * SX;
  const chY = -1 * SY - 16;
  ctx.fillStyle = state.chestSmashed ? '#334155' : '#ca8a04';
  rrect(chX - 11, chY, 22, 16, 4);
  ctx.fill();
  if (!state.chestSmashed) {
    ctx.strokeStyle = '#fde047';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }

  // Tribute Gate (x=25, y=2)
  const gtX = 25 * SX;
  const gtY = -2 * SY - 44;
  ctx.fillStyle = state.tributeGateOpen ? 'rgba(56, 189, 248, 0.22)' : '#0284c7';
  rrect(gtX - 5, gtY, 10, 44, 3);
  ctx.fill();

  // Celestial Beacon (x=36, y=12)
  const bcX = 36 * SX;
  const bcY = -12 * SY - 26;
  ctx.fillStyle = state.relicsCollected >= 5 ? '#facc15' : '#475569';
  ctx.beginPath();
  ctx.arc(bcX, bcY, 13 + Math.sin(animTime * 5) * 1.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = state.relicsCollected >= 5 ? '#fef08a' : '#94a3b8';
  ctx.lineWidth = 2;
  ctx.stroke();

  // Sky Gems (spinning & bobbing)
  for (let i = 0; i < state.gems.length; i++) {
    const g = state.gems[i];
    if (g.collected) continue;
    const gx = g.x * SX;
    const gy = -g.y * SY - 12 + Math.sin(animTime * 4 + i * 0.7) * 2.5;
    const spin = 0.4 + 0.6 * Math.abs(Math.cos(animTime * 3.2 + i));
    ctx.save();
    ctx.translate(gx, gy);
    ctx.scale(spin, 1);
    ctx.fillStyle = '#38bdf8';
    ctx.beginPath();
    ctx.moveTo(0, -6.5);
    ctx.lineTo(5.5, 0);
    ctx.lineTo(0, 6.5);
    ctx.lineTo(-5.5, 0);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  // Celestial Relics
  for (const r of state.relics) {
    if (r.collected || r.insideChest) continue;
    const rx = r.x * SX;
    const ry = -r.y * SY - 16 + Math.sin(animTime * 3.5 + r.id) * 3.5;
    ctx.save();
    ctx.translate(rx, ry);
    ctx.rotate(animTime * 1.8);
    ctx.fillStyle = '#facc15';
    ctx.beginPath();
    ctx.arc(0, 0, 9, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#fef08a';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.restore();
  }

  // Explorer Character (interpolated)
  const ex = visX * SX;
  const ey = -visY * SY - 16;
  ctx.save();
  ctx.translate(ex, ey);
  if (!p.onGround && p.abilities.glide) {
    ctx.strokeStyle = '#818cf8';
    ctx.lineWidth = 3.5;
    ctx.beginPath();
    ctx.moveTo(-16, -2);
    ctx.lineTo(0, -7);
    ctx.lineTo(16, -2);
    ctx.stroke();
  }
  ctx.fillStyle = '#eab308';
  rrect(-6, -2, 12, 15, 4);
  ctx.fill();
  ctx.fillStyle = '#38bdf8';
  ctx.beginPath();
  ctx.arc(0, -8, 7.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(facing > 0 ? 1 : -5, -10, 4, 3);
  ctx.restore();

  // Particles & Popups in world space
  for (const pt of particles) {
    ctx.globalAlpha = Math.min(1, pt.life * 2.2);
    ctx.fillStyle = pt.color;
    ctx.fillRect(pt.x - 2, pt.y - 2, 4, 4);
  }
  ctx.globalAlpha = 1;

  for (const pop of popups) {
    ctx.globalAlpha = Math.min(1, pop.life * 1.5);
    ctx.fillStyle = pop.color;
    ctx.font = 'bold 12px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(pop.text, pop.x, pop.y);
  }
  ctx.globalAlpha = 1;

  ctx.restore();

  // Viewport border + nearby prompt pill
  ctx.strokeStyle = '#1e3a5f';
  ctx.lineWidth = 2;
  rrect(10, VIEW_Y, W - 20, VIEW_H, 12);
  ctx.stroke();

  const promptLabel = isNearInteractable();
  if (promptLabel) {
    ctx.fillStyle = 'rgba(234, 179, 8, 0.92)';
    rrect(W / 2 - 92, VIEW_Y + 10, 184, 24, 12);
    ctx.fill();
    ctx.fillStyle = '#0f172a';
    ctx.font = 'bold 11px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(`TAP ACT [E]: ${promptLabel}`, W / 2, VIEW_Y + 26);
  }

  // Event ticker
  ctx.fillStyle = '#fbbf24';
  ctx.font = '11.5px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(state.lastEvent.slice(0, 52), W / 2, 427);

  // Touch Controls
  const legal = legalActions(state);
  const holdL = keys['ArrowLeft'] || keys['a'] || keys['A'] || touchDir < 0;
  const holdR = keys['ArrowRight'] || keys['d'] || keys['D'] || touchDir > 0;

  for (const b of BTNS) {
    let fill = '#13233f';
    let border = '#2b4570';
    let textCol = '#f8fafc';

    if (b.id === 'left' && holdL) { fill = '#0284c7'; border = '#7dd3fc'; }
    else if (b.id === 'right' && holdR) { fill = '#0284c7'; border = '#7dd3fc'; }
    else if (b.id === 'jump') {
      fill = '#0369a1';
      border = '#38bdf8';
    } else if (b.id === 'interact') {
      fill = promptLabel ? '#eab308' : '#854d0e';
      border = '#facc15';
      textCol = promptLabel ? '#0f172a' : '#fef08a';
    } else if (b.id === 'glide') {
      const ok = legal.includes('glide');
      fill = ok ? '#4f46e5' : '#0f1b31';
      border = ok ? '#818cf8' : '#1e293b';
      textCol = ok ? '#e0e7ff' : '#475569';
    } else if (b.id === 'pound') {
      const ok = legal.includes('ground_pound');
      fill = ok ? '#b91c1c' : '#0f1b31';
      border = ok ? '#f87171' : '#1e293b';
      textCol = ok ? '#fee2e2' : '#475569';
    }

    ctx.fillStyle = fill;
    rrect(b.x, b.y, b.w, b.h, 12);
    ctx.fill();
    ctx.strokeStyle = border;
    ctx.lineWidth = 1.6;
    ctx.stroke();

    ctx.fillStyle = textCol;
    ctx.font = b.h > 58 ? 'bold 14px system-ui, sans-serif' : 'bold 11.5px system-ui, sans-serif';
    ctx.textAlign = 'center';
    const lbl = b.id === 'jump' && !p.onGround ? '2X JUMP' : b.label;
    ctx.fillText(lbl, b.x + b.w / 2, b.y + b.h / 2 + 5);
  }

  ctx.fillStyle = '#64748b';
  ctx.font = '11px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('A/D Run · Space Jump/2xJump · E Act · G Glide · S Ground Pound', W / 2, 602);

  if (isOver(state)) {
    ctx.fillStyle = 'rgba(4, 9, 20, 0.9)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';

    ctx.fillStyle = state.won ? '#facc15' : '#f43f5e';
    ctx.font = 'bold 30px system-ui, sans-serif';
    ctx.fillText(state.won ? 'CITADEL RESTORED!' : 'EXPEDITION OVER', W / 2, H / 2 - 42);

    ctx.fillStyle = '#e2e8f0';
    ctx.font = '16px system-ui, sans-serif';
    ctx.fillText(
      `Relics: ${state.relicsCollected}/5 · Gems: ${state.gemsCollected}/${state.totalGems}`,
      W / 2,
      H / 2 - 6
    );

    ctx.fillStyle = '#38bdf8';
    ctx.font = 'bold 24px system-ui, sans-serif';
    ctx.fillText('Score: ' + score(state), W / 2, H / 2 + 30);

    ctx.fillStyle = '#34d399';
    ctx.font = '15px system-ui, sans-serif';
    ctx.fillText('Tap anywhere or press Space to explore again', W / 2, H / 2 + 72);
  }
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  updateSim(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

const inApk = window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform();
if (!inApk && 'serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
